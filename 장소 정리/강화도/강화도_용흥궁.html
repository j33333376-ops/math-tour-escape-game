<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강화도 용흥궁</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  svg { display:block; width:100%; height:auto; }

  @keyframes yhg-sway-left {
    0%, 100% { transform: rotate(-1.6deg); }
    50%      { transform: rotate(1.2deg); }
  }
  @keyframes yhg-sway-right {
    0%, 100% { transform: rotate(1.6deg); }
    50%      { transform: rotate(-1.2deg); }
  }
  .yhg-lantern-left  { animation: yhg-sway-left 4.6s ease-in-out infinite;  transform-origin: 0px 0px; }
  .yhg-lantern-right { animation: yhg-sway-right 5.2s ease-in-out infinite; transform-origin: 0px 0px; }
</style>
</head>
<body>
<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="강화도 용흥궁 솟을대문과 담장">
<title>강화도 용흥궁</title>
<desc>조선 철종의 잠저인 강화도 용흥궁. 중앙에 솟을대문이 우뚝 서 있고 좌우로 와편담장이 이어지며, 담장 뒤로 안채 지붕과 문살창이 살짝 보인다.</desc>

<defs>
  <linearGradient id="yhgWoodGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c9805a"/>
    <stop offset="0.45" stop-color="#9c4a30"/>
    <stop offset="1" stop-color="#6a2611"/>
  </linearGradient>
  <linearGradient id="yhgDoorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5c3a24"/>
    <stop offset="1" stop-color="#2e1e0e"/>
  </linearGradient>
  <linearGradient id="yhgRoofGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#606f7c"/>
    <stop offset="1" stop-color="#252d35"/>
  </linearGradient>
  <linearGradient id="yhgRearRoofGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8d99a4"/>
    <stop offset="1" stop-color="#5b6570"/>
  </linearGradient>
  <linearGradient id="yhgStoneGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d6cdb2"/>
    <stop offset="1" stop-color="#aa9d7e"/>
  </linearGradient>
  <linearGradient id="yhgWallGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2e8ca"/>
    <stop offset="1" stop-color="#ddce9d"/>
  </linearGradient>
  <linearGradient id="yhgGoldGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7de84"/>
    <stop offset="1" stop-color="#a97a1e"/>
  </linearGradient>
  <radialGradient id="yhgLanternRed" cx="35%" cy="26%" r="75%">
    <stop offset="0" stop-color="#ee7150"/>
    <stop offset="1" stop-color="#94201a"/>
  </radialGradient>
  <radialGradient id="yhgLanternBlue" cx="35%" cy="26%" r="75%">
    <stop offset="0" stop-color="#5a94d4"/>
    <stop offset="1" stop-color="#1a3a72"/>
  </radialGradient>

  <pattern id="yhgTileCap" width="15" height="16" patternUnits="userSpaceOnUse">
    <rect width="15" height="16" fill="#3a4249"/>
    <path d="M0.5,16 A6.5,6.5 0 0 1 14.5,16 Z" fill="#5e6a76"/>
    <path d="M0.5,16 A6.5,6.5 0 0 1 14.5,16 Z" fill="none" stroke="#24292f" stroke-width="0.6"/>
  </pattern>

  <pattern id="yhgStonePattern" width="46" height="17" patternUnits="userSpaceOnUse">
    <line x1="0" y1="17" x2="46" y2="17" stroke="#8f8368" stroke-width="0.8" opacity="0.55"/>
    <line x1="0" y1="0" x2="0" y2="17" stroke="#8f8368" stroke-width="0.8" opacity="0.45"/>
    <line x1="23" y1="0" x2="23" y2="17" stroke="#8f8368" stroke-width="0.8" opacity="0.45"/>
  </pattern>

  <pattern id="yhgStuds" width="16" height="24" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="12" r="2.3" fill="#e6c25a" stroke="#8a6a1e" stroke-width="0.6"/>
  </pattern>

  <pattern id="yhgTransom" width="8" height="50" patternUnits="userSpaceOnUse">
    <rect width="8" height="50" fill="#233039"/>
    <rect x="3" width="2" height="50" fill="#101a20"/>
  </pattern>

  <pattern id="yhgLattice" width="12.5" height="12.5" patternUnits="userSpaceOnUse">
    <rect width="12.5" height="12.5" fill="#25333f"/>
    <line x1="0" y1="0" x2="0" y2="12.5" stroke="#e8dfc8" stroke-width="1"/>
    <line x1="0" y1="0" x2="12.5" y2="0" stroke="#e8dfc8" stroke-width="1"/>
  </pattern>
</defs>
