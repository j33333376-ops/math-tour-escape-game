<!DOCTYPE html>
<html lang="ko">
<head>

<title>강화도 북산 능선길</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }

  @keyframes bsgSwayA { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
  @keyframes bsgSwayB { 0%,100% { transform: rotate(1.1deg); } 50% { transform: rotate(-1.1deg); } }
  @keyframes bsgSwayC { 0%,100% { transform: rotate(-0.8deg); } 50% { transform: rotate(0.9deg); } }

  .bsg-sway-a { transform-box: fill-box; transform-origin: 50% 100%; animation: bsgSwayA 5.6s ease-in-out infinite; }
  .bsg-sway-b { transform-box: fill-box; transform-origin: 50% 100%; animation: bsgSwayB 6.4s ease-in-out infinite; }

</style>
</head>

<title>강화도 북산 능선길</title>

<defs>

    <stop offset="0" stop-color="#d9c092"/>
    <stop offset="0.5" stop-color="#caa76d"/>
    <stop offset="1" stop-color="#af8a55"/>
  </linearGradient>
  <linearGradient id="bsgFarGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c3d6cf"/>
    <stop offset="1" stop-color="#aec7bf"/>
  </linearGradient>
  <linearGradient id="bsgMidGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#93b39d"/>
    <stop offset="1" stop-color="#7ba488"/>
  </linearGradient>
  <linearGradient id="bsgNearGradL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b7a4e"/>
    <stop offset="1" stop-color="#42603a"/>
  </linearGradient>
  <linearGradient id="bsgNearGradR" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#638150" stop-opacity="1"/>
    <stop offset="1" stop-color="#476840"/>

  <filter id="bsgBlur" x="-20%" y="-100%" width="140%" height="300%">

</defs>
