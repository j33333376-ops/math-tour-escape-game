<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고려청자 매병</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .gcm-svg { display:block; width:100%; height:auto; }

</style>
</head>
<body>
<svg class="gcm-svg" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="고려청자 매병">
<title>고려청자 매병</title>
<desc>강화 천도기 고려청자 매병. 비색 유약과 상감 운학문.</desc>
<defs>
  <linearGradient id="gcmBody" x1="0" y1="0" x2="1" y2="0">

    <stop offset="0.5" stop-color="#c2ded2"/><stop offset="0.75" stop-color="#7fae9c"/>
    <stop offset="1" stop-color="#4a7466"/>
  </linearGradient>
  <linearGradient id="gcmBase" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4a7466"/><stop offset="0.5" stop-color="#8fb4a4"/><stop offset="1" stop-color="#3f6458"/>
  </linearGradient>
</defs>
<!-- 그림자 -->
<ellipse cx="250" cy="712" rx="120" ry="20" fill="#3f5a50" opacity="0.22"/>
<!-- 몸통 -->
<path d="M250,66

      fill="url(#gcmBody)" stroke="#2f4f44" stroke-width="4"/>

<path d="M204,676 L296,676 L306,706 L194,706 Z" fill="url(#gcmBase)" stroke="#2f4f44" stroke-width="3.4"/>
<ellipse cx="250" cy="706" rx="56" ry="10" fill="#5f8f80" stroke="#2f4f44" stroke-width="3"/>

<ellipse cx="250" cy="66" rx="58" ry="15" fill="#7fae9c" stroke="#2f4f44" stroke-width="3.4"/>
<ellipse cx="250" cy="64" rx="40" ry="9" fill="#3f6458"/>
<!-- 어깨 띠 -->
<path d="M186,178 C218,160 282,160 314,178" fill="none" stroke="#f2f0e4" stroke-width="6" opacity="0.9"/>
<path d="M180,198 C216,178 284,178 320,198" fill="none" stroke="#2f4f44" stroke-width="3" opacity="0.7"/>

    <ellipse rx="26" ry="14" transform="rotate(-14)"/>

    <circle cx="40" cy="-12" r="5"/>
  </g>
  <g transform="translate(300,392) scale(0.85)">
    <ellipse rx="26" ry="14" transform="rotate(12)"/>

  <g transform="translate(198,486) scale(0.72)">
    <ellipse rx="26" ry="14" transform="rotate(-10)"/>
    <path d="M18,-6 q16,-12 26,-4 q-10,10 -26,10 Z"/>
    <circle cx="40" cy="-10" r="5"/>

</g>
<!-- 상감 구름 -->
<g fill="none" stroke="#f6f4e8" stroke-width="4" opacity="0.9" stroke-linecap="round">
  <path d="M282,266 q18,-14 34,-2 q-14,14 -34,2"/>
  <path d="M170,368 q18,-14 34,-2 q-14,14 -34,2"/>

  <path d="M240,634 q16,-20 32,0"/>
  <path d="M274,634 q10,-14 20,-4"/>
</g>
<!-- 광택 -->
<path d="M196,220 C176,290 176,430 200,540" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.28" stroke-linecap="round"/>
<path d="M312,240 C328,300 328,420 310,510" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.16" stroke-linecap="round"/>
