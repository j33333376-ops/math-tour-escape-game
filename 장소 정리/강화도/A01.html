<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강화도 · 용흥궁 (A01)</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; }
    body {
        display:flex; justify-content:center; align-items:center;
        background:#f2f7f2; font-family:'Noto Sans KR', sans-serif; color:#3e4a3d;
        letter-spacing:-0.02em; line-height:1.6;
    }
    #game-container {
        position:relative; width:100%; max-width:1066px; aspect-ratio:16 / 9;
        overflow:hidden; border-radius:14px; margin:0 auto;
        background:linear-gradient(180deg,#cfe3d6 0%, #e7f1ea 55%, #d8ead0 100%);
        box-shadow:0 14px 34px rgba(20,30,20,0.35);
    }
    .layer { position:absolute; }
    /* 나무 팻말 상단 표시바 */
    #signpost {
        position:absolute; top:16px; left:16px; z-index:9;
        background:#6d4c41; color:#fdfbf7; font-family:'Gowun Batang', serif;
        padding:8px 18px; border-radius:12px; border:3px solid #8d6e63;
        box-shadow:0 4px 8px rgba(0,0,0,0.25); font-size:1.05rem;
    }
    /* 상황 설명 박스 (유형1) */
    #situation {
        position:absolute; top:22px; left:50%; transform:translateX(-50%); z-index:10;
        width:min(66%,640px); background:rgba(255,255,255,0.82); color:#31402c;
        border:2px solid #8aa171; border-radius:16px; padding:14px 20px; text-align:center;
        box-shadow:0 6px 16px rgba(30,50,25,0.18); font-size:1rem;
    }
    #situation b { color:#2d5a27; font-family:'Gowun Batang', serif; }
    /* 공통 이동 버튼 */
    .btn-nav {
        position:absolute; bottom:20px; z-index:11;
        background:#2d5a27; color:#fff; border:none; border-radius:20px;
        padding:13px 26px; font-size:1rem; font-weight:700; cursor:pointer;
        box-shadow:0 4px 6px rgba(45,90,39,0.2); transition:background .2s, transform .1s;
        font-family:'Noto Sans KR', sans-serif;
    }
    .btn-nav:hover { background:#6d4c41; }
    .btn-nav:active { transform:translateY(1px); }
    #btn-prev { left:20px; }
    #btn-next { right:20px; }
</style>
</head>
<body>
<div id="game-container">

    <!-- 배경(장소): 용흥궁 900x480 -->
    <div class="layer" style="left:0; bottom:0; width:1066px; height:568.5px; overflow:hidden; z-index:1;">
        <iframe src="강화도_용흥궁.html" scrolling="no" style="border:0; width:900px; height:480px; transform:scale(1.184); transform-origin:top left; pointer-events:none;"></iframe>
    </div>

    <!-- 에셋(물건): 강화순무 600x600 → 축소 -->
    <div class="layer" style="left:360px; bottom:78px; width:108px; height:108px; overflow:hidden; z-index:4;">
        <iframe src="강화도_에셋_강화순무.html" scrolling="no" style="border:0; width:600px; height:600px; transform:scale(0.18); transform-origin:top left; pointer-events:none;"></iframe>
    </div>

    <!-- 등장인물: 민우 260x320 고정 -->
    <div class="char-wrapper layer" id="char-민우" style="left:585px; bottom:66px; width:234px; height:288px; overflow:visible; z-index:3;">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.9); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <div id="signpost">강화도 · 용흥궁</div>

    <div id="situation">
        <b>용흥궁 앞뜰</b><br>
        민우가 강화순무를 발견했다. "이 주변에 첫 번째 단서가 숨어 있을 것 같아…"
    </div>

    <button class="btn-nav" id="btn-prev" onclick="location.href='index.html'">← 지도로</button>
    <button class="btn-nav" id="btn-next" onclick="location.href='index.html'">처음으로 (End)</button>

</div>
</body>
</html>
