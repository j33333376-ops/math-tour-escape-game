<!-- 원본 크기: 840x565 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강화산성 북문 (진송루)</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .bkm-svg { display:block; width:100%; height:auto; }

  @keyframes bkmGlow { 0%,100% { opacity:0.45; } 50% { opacity:0.8; } }
  .bkm-glow { animation: bkmGlow 6s ease-in-out infinite; }

  @keyframes bkmMist { 0%,100% { opacity:0.28; } 50% { opacity:0.45; } }
  .bkm-mist { animation: bkmMist 7.5s ease-in-out infinite; }

  .bkm-block { stroke:#6f6656; stroke-width:1; }
  .bkm-joint { stroke:#6f6656; stroke-width:1.1; opacity:0.7; fill:none; }
  .bkm-slit  { fill:#332c22; opacity:0.55; }
  .bkm-tilestripe { stroke:#37444a; stroke-width:1; opacity:0.35; fill:none; }
  .bkm-moss { fill:#6f8452; opacity:0.16; }
  .bkm-crack { stroke:#524a3c; stroke-width:0.8; opacity:0.4; fill:none; }
</style>
</head>
<body>
<svg class="bkm-svg" viewBox="30 65 840 565" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="강화산성 북문 진송루">
<title>강화산성 북문 (진송루)</title>
<desc>화강암을 쌓아 만든 무지개 모양 홍예문 위에 팔작지붕 목조 문루가 올라간 강화산성 북문의 모습.</desc>

<defs>
  <linearGradient id="bkmStone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ada497"/>
    <stop offset="0.5" stop-color="#948a7c"/>
    <stop offset="1" stop-color="#766c5e"/>
  </linearGradient>
  <linearGradient id="bkmStoneLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c7bda9"/>
    <stop offset="1" stop-color="#a89d8a"/>
  </linearGradient>
  <radialGradient id="bkmArchShadow" cx="0.5" cy="0.1" r="0.95">
    <stop offset="0" stop-color="#443c2f"/>
    <stop offset="0.5" stop-color="#241f17"/>
    <stop offset="1" stop-color="#0d0b08"/>
  </radialGradient>
  <linearGradient id="bkmWood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a3d29"/>
    <stop offset="0.5" stop-color="#9c4a34"/>
    <stop offset="1" stop-color="#7a3122"/>
  </linearGradient>
  <linearGradient id="bkmBeam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a4530"/>
    <stop offset="1" stop-color="#6a2f1e"/>
  </linearGradient>
  <linearGradient id="bkmRoof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7c8f97"/>
    <stop offset="0.55" stop-color="#5c6f78"/>
    <stop offset="1" stop-color="#414c53"/>
  </linearGradient>
  <pattern id="bkmBrick" width="58" height="52" patternUnits="userSpaceOnUse">
    <rect x="1" y="1" width="26" height="22" fill="#9c9182"/>
    <rect x="30" y="1" width="26" height="22" fill="#a89d8a"/>
    <rect x="-13" y="27" width="26" height="22" fill="#948a7b"/>
    <rect x="16" y="27" width="26" height="22" fill="#a29685"/>
    <rect x="45" y="27" width="26" height="22" fill="#9c9182"/>
  </pattern>
</defs>

<!-- ════════════ 지면 그림자 ════════════ -->
<ellipse cx="450" cy="606" rx="355" ry="12" fill="#000" opacity="0.16"/>

<!-- ════════════ 화강암 성벽 본체 ════════════ -->
<rect x="40" y="360" width="820" height="244" fill="url(#bkmStone)"/>
<rect x="40" y="360" width="820" height="244" fill="url(#bkmBrick)"/>
<rect x="40" y="592" width="820" height="12" fill="#5c5346" opacity="0.55"/>

<!-- 은은한 이끼/풍화 자국 -->
<g class="bkm-moss">
  <ellipse cx="90" cy="420" rx="20" ry="10"/>
  <ellipse cx="760" cy="470" rx="22" ry="11"/>
  <ellipse cx="130" cy="540" rx="16" ry="8"/>
  <ellipse cx="700" cy="390" rx="14" ry="8"/>
  <ellipse cx="800" cy="560" rx="18" ry="9"/>
</g>
<g class="bkm-crack">
  <path d="M100,380 L108,410 L98,450"/>
  <path d="M770,410 L780,440 L772,480"/>
  <path d="M820,520 L812,550 L822,580"/>
</g>

<!-- ════════════ 홍예문(아치 통로) ════════════ -->
<!-- 어두운 통로 -->
<path d="M360,604 L360,470 A90,90 0 0 1 540,470 L540,604 Z" fill="url(#bkmArchShadow)"/>
<ellipse class="bkm-mist" cx="450" cy="560" rx="55" ry="22" fill="#1c1712" opacity="0.35"/>

<!-- 홍예석(부채꼴로 짜맞춘 돌) 테두리 -->
<path d="M344,604 L344,470 A106,106 0 0 1 556,470 L556,604 Z
         M360,604 L360,470 A90,90 0 0 1 540,470 L540,604 Z"
      fill-rule="evenodd" fill="url(#bkmStoneLight)" class="bkm-block"/>

<!-- 방사형 돌 이음선 -->
<g class="bkm-joint">
  <line x1="533.2" y1="435.5" x2="548.0" y2="429.4"/>
  <line x1="513.6" y1="406.4" x2="525.0" y2="395.0"/>
  <line x1="484.5" y1="386.8" x2="490.6" y2="372.1"/>
  <line x1="450.0" y1="380.0" x2="450.0" y2="364.0"/>
  <line x1="415.5" y1="386.8" x2="409.4" y2="372.1"/>
  <line x1="386.4" y1="406.4" x2="375.0" y2="395.0"/>
  <line x1="366.8" y1="435.5" x2="352.1" y2="429.4"/>
</g>

<!-- 이맛돌(키스톤) -->
<rect x="436" y="358" width="28" height="20" fill="url(#bkmStoneLight)" class="bkm-block"/>

<!-- ════════════ 좌측 성첩(여장) ════════════ -->
<rect x="40" y="336" width="290" height="24" fill="url(#bkmStoneLight)" class="bkm-block"/>
<g class="bkm-block" fill="url(#bkmStoneLight)">
  <rect x="44"  y="310" width="26" height="26"/>
  <rect x="84"  y="310" width="26" height="26"/>
  <rect x="124" y="310" width="26" height="26"/>
  <rect x="164" y="310" width="26" height="26"/>
  <rect x="204" y="310" width="26" height="26"/>
  <rect x="244" y="310" width="26" height="26"/>
  <rect x="284" y="310" width="26" height="26"/>
</g>
<g class="bkm-slit">
  <rect x="54.5"  y="316" width="5" height="14"/>
  <rect x="94.5"  y="316" width="5" height="14"/>
  <rect x="134.5" y="316" width="5" height="14"/>
  <rect x="174.5" y="316" width="5" height="14"/>
  <rect x="214.5" y="316" width="5" height="14"/>
  <rect x="254.5" y="316" width="5" height="14"/>
  <rect x="294.5" y="316" width="5" height="14"/>
</g>

<!-- ════════════ 우측 성첩(여장) ════════════ -->
<rect x="570" y="336" width="290" height="24" fill="url(#bkmStoneLight)" class="bkm-block"/>
<g class="bkm-block" fill="url(#bkmStoneLight)">
  <rect x="590" y="310" width="26" height="26"/>
  <rect x="630" y="310" width="26" height="26"/>
  <rect x="670" y="310" width="26" height="26"/>
  <rect x="710" y="310" width="26" height="26"/>
  <rect x="750" y="310" width="26" height="26"/>
  <rect x="790" y="310" width="26" height="26"/>
  <rect x="830" y="310" width="26" height="26"/>
</g>
<g class="bkm-slit">
  <rect x="600.5" y="316" width="5" height="14"/>
  <rect x="640.5" y="316" width="5" height="14"/>
  <rect x="680.5" y="316" width="5" height="14"/>
  <rect x="720.5" y="316" width="5" height="14"/>
  <rect x="760.5" y="316" width="5" height="14"/>
  <rect x="800.5" y="316" width="5" height="14"/>
  <rect x="840.5" y="316" width="5" height="14"/>
</g>

<!-- ════════════ 문루 축대(누각 받침 돌바닥) ════════════ -->
<rect x="330" y="336" width="240" height="24" fill="url(#bkmStoneLight)" class="bkm-block"/>
<rect x="326" y="329" width="248" height="8" fill="#8f8574" stroke="#6f6656" stroke-width="0.6"/>

<!-- ════════════ 목조 문루 (진송루) ════════════ -->
<!-- 내부 그림자 (개방형 누각 안쪽) -->
<rect x="338" y="196" width="224" height="134" fill="#241a12" opacity="0.55"/>

<!-- 붉은 목재 기둥 -->
<g fill="url(#bkmWood)" stroke="#4a2010" stroke-width="0.6">
  <rect x="336" y="196" width="9" height="134"/>
  <rect x="367" y="196" width="9" height="134"/>
  <rect x="398" y="196" width="9" height="134"/>
  <rect x="429" y="196" width="9" height="134"/>
  <rect x="461" y="196" width="9" height="134"/>
  <rect x="492" y="196" width="9" height="134"/>
  <rect x="524" y="196" width="9" height="134"/>
  <rect x="555" y="196" width="9" height="134"/>
</g>

<!-- 기둥머리 공포(두공) 장식 -->
<g fill="#5a2818" opacity="0.9">
  <rect x="334" y="178" width="13" height="8"/>
  <rect x="365" y="178" width="13" height="8"/>
  <rect x="396" y="178" width="13" height="8"/>
  <rect x="427" y="178" width="13" height="8"/>
  <rect x="459" y="178" width="13" height="8"/>
  <rect x="490" y="178" width="13" height="8"/>
  <rect x="522" y="178" width="13" height="8"/>
  <rect x="553" y="178" width="13" height="8"/>
</g>

<!-- 창방/평방 (가로 대들보) -->
<rect x="330" y="182" width="240" height="14" fill="url(#bkmBeam)" stroke="#4a2010" stroke-width="0.6"/>
<rect x="324" y="174" width="252" height="8"  fill="#6a2f1e" stroke="#4a2010" stroke-width="0.5"/>

<!-- 현판: 진송루 -->
<rect x="410" y="150" width="80" height="26" rx="2" fill="#4a2f1f" stroke="#241408" stroke-width="1.5"/>
<rect x="413" y="153" width="74" height="20" fill="none" stroke="#c9a85c" stroke-width="1" opacity="0.6"/>
<text x="450" y="169" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#e8dcc0" letter-spacing="2">진송루</text>

<!-- ════════════ 팔작지붕 ════════════ -->
<!-- 지붕 몸체 (처마 곡선 + 용마루) -->
<path d="M296,140 Q300,95 380,80 L520,80 Q600,95 604,140
         Q527,175 450,178 Q373,175 296,140 Z" fill="url(#bkmRoof)" stroke="#37444a" stroke-width="1"/>

<!-- 우진각 모서리 내림마루 -->
<path d="M380,80 Q340,108 296,140" fill="none" stroke="#37444a" stroke-width="1" opacity="0.6"/>
<path d="M520,80 Q560,108 604,140" fill="none" stroke="#37444a" stroke-width="1" opacity="0.6"/>

<!-- 풍판(박공) 삼각 포인트 -->
<polygon points="300,142 320,116 340,142" fill="#6a5648" opacity="0.85"/>
<polygon points="560,142 580,116 600,142" fill="#6a5648" opacity="0.85"/>

<!-- 기와골 텍스처선 -->
<g class="bkm-tilestripe">
  <line x1="320" y1="126" x2="322" y2="150"/>
  <line x1="350" y1="100" x2="352" y2="158"/>
  <line x1="380" y1="84"  x2="382" y2="170"/>
  <line x1="410" y1="80"  x2="412" y2="176"/>
  <line x1="450" y1="80"  x2="450" y2="178"/>
  <line x1="490" y1="80"  x2="488" y2="176"/>
  <line x1="520" y1="84"  x2="518" y2="170"/>
  <line x1="550" y1="100" x2="548" y2="158"/>
  <line x1="580" y1="126" x2="578" y2="150"/>
</g>

<!-- 용마루(지붕마루) 강조선 -->
<rect x="380" y="76" width="140" height="10" fill="#3a474d"/>
<rect x="372" y="74" width="18" height="14" rx="3" fill="#2c383e"/>
<rect x="510" y="74" width="18" height="14" rx="3" fill="#2c383e"/>

<!-- 용마루 은은한 광택 -->
<rect class="bkm-glow" x="388" y="79" width="124" height="4" fill="#a9bac1" opacity="0.5"/>

<!-- 처마 끝 마구리 -->
<circle cx="296" cy="140" r="4.5" fill="#2c383e"/>
<circle cx="604" cy="140" r="4.5" fill="#2c383e"/>

</svg>
