<!-- 원본 크기: 1200x410 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강화도 대한성공회 강화성당</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .sgh-svg { display:block; width:100%; height:auto; }

  @keyframes sghGlow {
    0%, 100% { opacity: 0.18; }
    50%      { opacity: 0.5; }
  }
  .sgh-cross-glow { animation: sghGlow 6s ease-in-out infinite; }

  @keyframes sghSway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(1deg); }
  }
  .sgh-tree-left, .sgh-tree-right {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: sghSway 9s ease-in-out infinite;
  }
</style>
</head>
<body>
<svg class="sgh-svg" viewBox="0 0 1200 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="강화도 대한성공회 강화성당 - 한옥과 서양 바실리카 양식이 융합된 목조 기와 성당">
<title>강화도 대한성공회 강화성당</title>
<desc>긴 한옥 기와지붕 몸체를 가진 서양식 바실리카 평면의 성당. 측면에는 격자 살창이 늘어서 있고, 정면은 한 단 높은 박공 지붕과 나무 대문, 지붕 용마루 위에 작은 십자가가 세워져 있다.</desc>

<defs>
  <linearGradient id="sghRoofGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b96a3"/>
    <stop offset="1" stop-color="#5c6673"/>
  </linearGradient>
  <linearGradient id="sghWoodGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a5530"/>
    <stop offset="1" stop-color="#63381a"/>
  </linearGradient>
  <linearGradient id="sghStoneGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a49d8c"/>
    <stop offset="1" stop-color="#7d775f"/>
  </linearGradient>
  <linearGradient id="sghDoorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5a3018"/>
    <stop offset="1" stop-color="#3f2210"/>
  </linearGradient>
  <radialGradient id="sghGlowGrad" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
  </radialGradient>

  <g id="sghWin">
    <rect x="0" y="0" width="60" height="72" rx="2" fill="#4a2712"/>
    <rect x="4" y="4" width="52" height="64" fill="#ecdfc0"/>
    <g stroke="#6a4020" stroke-width="1.6">
      <line x1="21" y1="4" x2="21" y2="68"/>
      <line x1="39" y1="4" x2="39" y2="68"/>
      <line x1="4" y1="21" x2="56" y2="21"/>
      <line x1="4" y1="39" x2="56" y2="39"/>
      <line x1="4" y1="57" x2="56" y2="57"/>
    </g>
    <rect x="4" y="4" width="52" height="64" fill="#fff" opacity="0.06"/>
  </g>
</defs>

<rect x="0" y="0" width="1200" height="410" fill="none"/>

<!-- ════════ 지면 그림자 ════════ -->
<ellipse cx="565" cy="378" rx="500" ry="13" fill="#000" opacity="0.08"/>

<!-- ════════ 좌측 나무 ════════ -->
<g class="sgh-tree-left">

</g>
