<!-- 원본 크기: 500x750 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전등사 풍경</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .jdp-svg { display:block; width:100%; height:auto; }
  .jdp-swing { animation: jdp-swing 4.2s ease-in-out infinite; transform-origin: 250px 150px; }
  @keyframes jdp-swing { 0%,100% { transform: rotate(-5deg);} 50% { transform: rotate(5deg);} }
  .jdp-fish { animation: jdp-fish 4.2s ease-in-out infinite; transform-origin: 250px 470px; }
  @keyframes jdp-fish { 0%,100% { transform: rotate(9deg);} 50% { transform: rotate(-9deg);} }
</style>
</head>
<body>
<svg class="jdp-svg" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전등사 풍경">
<title>전등사 풍경</title>
<desc>전등사 처마 끝에 매달린 물고기 모양 청동 풍경(風磬).</desc>
<defs>
  <linearGradient id="jdpBronze" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5a3f10"/><stop offset="0.3" stop-color="#c9922e"/>
    <stop offset="0.5" stop-color="#f2d78a"/><stop offset="0.75" stop-color="#b8862a"/>
    <stop offset="1" stop-color="#4e3610"/>
  </linearGradient>
  <linearGradient id="jdpEave" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5f6b78"/><stop offset="1" stop-color="#39434f"/>
  </linearGradient>
</defs>
<!-- 처마 -->
<path d="M40,96 C150,58 350,58 460,96 L470,132 C350,92 150,92 30,132 Z" fill="url(#jdpEave)" stroke="#28313b" stroke-width="4"/>
<g fill="#4a5460">
  <ellipse cx="82" cy="126" rx="20" ry="9"/><ellipse cx="146" cy="112" rx="20" ry="9"/>
  <ellipse cx="210" cy="104" rx="20" ry="9"/><ellipse cx="290" cy="104" rx="20" ry="9"/>
  <ellipse cx="354" cy="112" rx="20" ry="9"/><ellipse cx="418" cy="126" rx="20" ry="9"/>
</g>
<rect x="196" y="126" width="108" height="20" rx="4" fill="#8c3a24" stroke="#5a2010" stroke-width="3"/>
<!-- 고리 -->
<circle cx="250" cy="152" r="9" fill="none" stroke="url(#jdpBronze)" stroke-width="6"/>

<g class="jdp-swing">
  <!-- 줄 -->
  <line x1="250" y1="160" x2="250" y2="196" stroke="#7a5a2c" stroke-width="4"/>
  <!-- 종 몸체 -->
  <path d="M250,196
           C226,196 216,206 216,220
           C216,240 190,268 182,308
           C174,346 178,376 186,396
           L314,396
           C322,376 326,346 318,308
           C310,268 284,240 284,220
           C284,206 274,196 250,196 Z"
        fill="url(#jdpBronze)" stroke="#4e3610" stroke-width="4"/>
  <path d="M180,396 L320,396 L326,418 L174,418 Z" fill="#8a6218" stroke="#4e3610" stroke-width="3.4"/>
  <!-- 종 무늬 -->
  <g stroke="#4e3610" stroke-width="3" fill="none" opacity="0.75">
    <path d="M196,340 q54,-16 108,0"/>
    <path d="M188,370 q62,-18 124,0"/>
  </g>
  <g fill="#4e3610" opacity="0.6">
    <circle cx="250" cy="278" r="14"/><circle cx="250" cy="278" r="7" fill="#f2d78a"/>
    <circle cx="212" cy="308" r="8"/><circle cx="288" cy="308" r="8"/>
  </g>
  <!-- 하이라이트 -->
  <path d="M212,232 C196,272 190,340 198,392" fill="none" stroke="#fff2c9" stroke-width="8" opacity="0.4" stroke-linecap="round"/>
  <!-- 추 줄 -->
  <line x1="250" y1="418" x2="250" y2="452" stroke="#7a5a2c" stroke-width="3.4"/>
</g>

<!-- 물고기 추 -->
<g class="jdp-fish">
  <g transform="translate(250,470)">
    <path d="M-58,0 C-40,-34 40,-34 62,0 C40,34 -40,34 -58,0 Z" fill="url(#jdpBronze)" stroke="#4e3610" stroke-width="4"/>
    <path d="M62,0 L110,-32 L104,0 L110,32 Z" fill="#c9922e" stroke="#4e3610" stroke-width="3.4"/>
    <path d="M-58,0 L-92,-22 L-86,0 L-92,22 Z" fill="#b8862a" stroke="#4e3610" stroke-width="3"/>
    <circle cx="-30" cy="-6" r="8" fill="#f6ecd0" stroke="#4e3610" stroke-width="2.4"/>
    <circle cx="-30" cy="-6" r="3.4" fill="#3a2a10"/>
    <path d="M0,-26 q16,-14 32,-6" fill="none" stroke="#4e3610" stroke-width="3"/>
    <g fill="none" stroke="#4e3610" stroke-width="2.4" opacity="0.7">
      <path d="M-10,-18 q10,18 0,36"/>
      <path d="M12,-20 q10,20 0,40"/>
      <path d="M34,-18 q9,18 0,36"/>
    </g>
    <path d="M-46,-8 C-24,-22 24,-22 48,-8" fill="none" stroke="#fff2c9" stroke-width="5" opacity="0.45"/>
  </g>
</g>
</svg>
</body>
</html>
