  /* 돌계단 */
  .grjTread { fill:url(#grjGranite); stroke:#8f8875; stroke-width:0.6; }
  .grjNosing { stroke:#ffffff; stroke-opacity:0.55; stroke-width:1; }
  .grjRiserShadow { stroke:#5f584a; stroke-opacity:0.28; stroke-width:1.4; }
  .grjSeam { stroke:#8a8272; stroke-opacity:0.35; stroke-width:1; }
  .grjLanding { fill:url(#grjGranite); stroke:#8f8875; stroke-width:0.6; }

  /* 대지/기단 */
  .grjPlatform { fill:url(#grjEarth); }
  .grjCurb { fill:#8f7550; }
  .grjDirt { fill:#7a6240; opacity:0.18; }

  /* 초석 */
  .grjStone { fill:#a29a8a; stroke:#847c6c; stroke-width:0.8; }
  .grjStoneMoss { fill:#7a9a5c; opacity:0.35; }
  .grjStoneShadow { fill:#000000; opacity:0.12; }
  .grjGrass { stroke:#5e8a44; stroke-width:1.3; fill:none; opacity:0.85; }

  /* 나무 */
  .grjTreeTrunk { fill:#6b4a30; }
  .grjTreeDark { fill:#4f7a45; }
  .grjTreeLight { fill:#74a862; opacity:0.9; }
  .grjTreeA { transform-origin: 190px 128px; animation: grjSway 5.5s ease-in-out infinite alternate; }
  .grjTreeB { transform-origin: 733px 118px; animation: grjSway 6.5s ease-in-out infinite alternate; animation-delay:0.7s; }

  /* 지붕 */

  .grjRidge { fill:#4d5762; }
  .grjRoofTick { stroke:#3f4a55; stroke-opacity:0.45; stroke-width:1; }
  .grjFascia { fill:url(#grjWoodGrad); }
  .grjBracket { fill:#c98a5a; opacity:0.55; }

  /* 벽/살창/기둥 */

  .grjLattice { stroke:#8a5a34; stroke-width:0.9; opacity:0.65; }
  .grjOpenBay { fill:#332821; }
  .grjInnerLine { stroke:#5a4a3c; stroke-width:0.8; opacity:0.4; }
  .grjBeam { fill:url(#grjWoodGrad); }
  .grjPillar { fill:url(#grjWoodGrad); }
  .grjPillarHi { fill:#c07040; opacity:0.35; }

  /* 마루/기단석 */
  .grjFloor { fill:url(#grjFloorGrad); }
  .grjPlank { stroke:#8a6b45; stroke-width:0.6; opacity:0.5; }
  .grjFoundation { fill:url(#grjGranite); stroke:#8f8875; stroke-width:0.6; }
  .grjStepStone { fill:#bcb6a6; stroke:#93897a; stroke-width:0.7; }

  .grjGroundShadow { fill:#000000; opacity:0.09; }

  @keyframes grjSway {
    0%   { transform: rotate(-1deg); }
    100% { transform: rotate(1deg); }
  }
</style>
