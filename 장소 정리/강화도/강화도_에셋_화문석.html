<!-- 원본 크기: 1000x500 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화문석</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .hms-svg { display:block; width:100%; height:auto; }

</style>
</head>
<body>
<svg class="hms-svg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="화문석">
<title>화문석</title>
<desc>강화도 특산 화문석. 왕골로 짠 돗자리에 꽃문양이 들어간 모습.</desc>
<defs>
  <linearGradient id="hmsMat" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2e2b8"/><stop offset="1" stop-color="#d9c184"/>
  </linearGradient>
  <pattern id="hmsWeave" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="none"/>
    <line x1="0" y1="7" x2="14" y2="7" stroke="#c9ad74" stroke-width="1.4" opacity="0.55"/>
    <line x1="7" y1="0" x2="7" y2="14" stroke="#e6d5a4" stroke-width="1.2" opacity="0.5"/>
  </pattern>
</defs>
<!-- 말린 부분(뒤) -->
<path d="M110,120 C110,96 140,86 168,90 L860,90 C888,86 918,96 918,120 C918,144 888,154 860,150 L168,150 C140,154 110,144 110,120 Z" fill="#e0c68e" stroke="#a8874c" stroke-width="3"/>
<ellipse cx="140" cy="120" rx="30" ry="30" fill="#eddcae" stroke="#a8874c" stroke-width="3"/>
<g fill="none" stroke="#c19a58" stroke-width="2" opacity="0.7">
  <ellipse cx="140" cy="120" rx="20" ry="20"/><ellipse cx="140" cy="120" rx="10" ry="10"/>
</g>
<!-- 펼친 자리 -->
<path d="M92,150 L908,150 L960,430 L40,430 Z" fill="url(#hmsMat)" stroke="#a8874c" stroke-width="4" stroke-linejoin="round"/>
<path d="M92,150 L908,150 L960,430 L40,430 Z" fill="url(#hmsWeave)"/>
<!-- 테두리 띠 -->
<path d="M118,178 L882,178 L924,404 L76,404 Z" fill="none" stroke="#8c3a24" stroke-width="8"/>
<path d="M136,196 L864,196 L900,388 L100,388 Z" fill="none" stroke="#1f5f8c" stroke-width="5"/>
<!-- 중앙 꽃문양 -->
<g transform="translate(500,292)">
  <g fill="#c2452e">
    <ellipse cx="0" cy="-52" rx="26" ry="34"/><ellipse cx="0" cy="52" rx="26" ry="34"/>
    <ellipse cx="-72" cy="0" rx="34" ry="26"/><ellipse cx="72" cy="0" rx="34" ry="26"/>
  </g>
  <g fill="#1f5f8c">
    <ellipse cx="-52" cy="-38" rx="24" ry="20" transform="rotate(-38 -52 -38)"/>
    <ellipse cx="52" cy="-38" rx="24" ry="20" transform="rotate(38 52 -38)"/>
    <ellipse cx="-52" cy="38" rx="24" ry="20" transform="rotate(38 -52 38)"/>
    <ellipse cx="52" cy="38" rx="24" ry="20" transform="rotate(-38 52 38)"/>
  </g>
  <circle r="30" fill="#e8b64c" stroke="#8c5a1c" stroke-width="3"/>
  <circle r="14" fill="#f6e2a8"/>
</g>
<!-- 좌우 보조 문양 -->
<g fill="#3f7a4c" opacity="0.9">
  <g transform="translate(232,292)">
    <path d="M0,-34 q22,20 0,40 q-22,-20 0,-40 Z"/>
    <path d="M-30,4 q20,-20 30,-4 q-14,22 -30,4 Z"/>
    <path d="M30,4 q-20,-20 -30,-4 q14,22 30,4 Z"/>
  </g>
  <g transform="translate(768,292)">
    <path d="M0,-34 q22,20 0,40 q-22,-20 0,-40 Z"/>
    <path d="M-30,4 q20,-20 30,-4 q-14,22 -30,4 Z"/>
    <path d="M30,4 q-20,-20 -30,-4 q14,22 30,4 Z"/>
  </g>
</g>
<!-- 앞단 마감 -->
<path d="M40,430 L960,430 L968,452 L32,452 Z" fill="#c9a35c" stroke="#8c6a34" stroke-width="3"/>
<g stroke="#8c6a34" stroke-width="2" opacity="0.6">
  <line x1="120" y1="430" x2="118" y2="452"/><line x1="300" y1="430" x2="298" y2="452"/>
  <line x1="500" y1="430" x2="500" y2="452"/><line x1="700" y1="430" x2="702" y2="452"/>
  <line x1="880" y1="430" x2="882" y2="452"/>
</g>
</svg>
</body>
</html>
