<!-- 원본 크기: 1000x500 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소금 더미와 고무래</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .ssg-svg { display:block; width:100%; height:auto; }
  .ssg-glint { animation: ssg-glint 3.4s ease-in-out infinite; }
  @keyframes ssg-glint { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
</style>
</head>
<body>
<svg class="ssg-svg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소금 더미와 고무래">
<title>소금 더미와 고무래</title>
<desc>염전에서 모은 하얀 소금 더미와 나무 고무래, 소금 수레.</desc>
<defs>
  <linearGradient id="ssgSalt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#eef4f6"/><stop offset="1" stop-color="#c4d4da"/>
  </linearGradient>
  <linearGradient id="ssgWood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9b076"/><stop offset="1" stop-color="#8f6a34"/>
  </linearGradient>
</defs>
<!-- 염전 바닥 반사 -->
<ellipse cx="440" cy="446" rx="330" ry="34" fill="#a8c4cc" opacity="0.35"/>
<!-- 뒤쪽 작은 더미 -->
<path d="M600,446 C620,368 660,318 700,318 C740,318 780,368 800,446 Z" fill="url(#ssgSalt)" stroke="#9fb4bc" stroke-width="4"/>
<g fill="#dfe9ec">
  <ellipse cx="676" cy="410" rx="26" ry="12"/><ellipse cx="736" cy="424" rx="22" ry="10"/>
</g>
<!-- 큰 소금 더미 -->
<path d="M140,450 C176,318 256,232 340,232 C424,232 504,318 540,450 Z" fill="url(#ssgSalt)" stroke="#9fb4bc" stroke-width="5"/>
<path d="M340,232 C300,296 268,376 250,450 L140,450 C176,318 256,232 340,232 Z" fill="#ffffff" opacity="0.55"/>
<!-- 소금 결정 질감 -->
<g fill="#ffffff" stroke="#b6c8ce" stroke-width="2">
  <rect x="292" y="292" width="18" height="18" transform="rotate(45 301 301)"/>
  <rect x="352" y="330" width="16" height="16" transform="rotate(45 360 338)"/>
  <rect x="256" y="366" width="20" height="20" transform="rotate(45 266 376)"/>
  <rect x="396" y="386" width="17" height="17" transform="rotate(45 404 394)"/>
  <rect x="200" y="412" width="19" height="19" transform="rotate(45 209 421)"/>
  <rect x="460" y="418" width="16" height="16" transform="rotate(45 468 426)"/>
  <rect x="320" y="410" width="15" height="15" transform="rotate(45 327 417)"/>
</g>
<g class="ssg-glint" fill="#ffffff">
  <circle cx="318" cy="272" r="5"/><circle cx="236" cy="352" r="4"/><circle cx="430" cy="352" r="4"/>
  <circle cx="700" cy="352" r="4"/>
</g>
<!-- 고무래 -->
<g transform="translate(770,150) rotate(20)">
  <rect x="-11" y="0" width="22" height="330" rx="11" fill="url(#ssgWood)" stroke="#6e4f26" stroke-width="4"/>
  <rect x="-96" y="318" width="192" height="34" rx="8" fill="#c49a5c" stroke="#6e4f26" stroke-width="4"/>
  <g stroke="#6e4f26" stroke-width="3" opacity="0.6">
    <line x1="-56" y1="318" x2="-56" y2="352"/><line x1="-16" y1="318" x2="-16" y2="352"/>
    <line x1="24" y1="318" x2="24" y2="352"/><line x1="64" y1="318" x2="64" y2="352"/>
  </g>
  <rect x="-34" y="-20" width="68" height="22" rx="11" fill="#a8763a" stroke="#6e4f26" stroke-width="3.4"/>
</g>
<!-- 나무 수레 -->
<g transform="translate(150,380)">
  <path d="M-96,-40 L104,-40 L88,34 L-80,34 Z" fill="#c49a5c" stroke="#6e4f26" stroke-width="4.4"/>
  <g stroke="#8f6a34" stroke-width="3" opacity="0.7">
    <line x1="-56" y1="-40" x2="-48" y2="34"/><line x1="-8" y1="-40" x2="-4" y2="34"/>
    <line x1="40" y1="-40" x2="40" y2="34"/>
  </g>
  <path d="M-92,-44 L100,-44 L100,-30 L-92,-30 Z" fill="#a8763a" stroke="#6e4f26" stroke-width="3.4"/>
  <path d="M-70,-40 C-56,-72 40,-72 56,-40 Z" fill="url(#ssgSalt)" stroke="#9fb4bc" stroke-width="3.4"/>
  <circle cx="-40" cy="52" r="30" fill="#8f6a34" stroke="#5e4220" stroke-width="4"/>
  <circle cx="-40" cy="52" r="10" fill="#c49a5c"/>
  <circle cx="52" cy="52" r="30" fill="#8f6a34" stroke="#5e4220" stroke-width="4"/>
  <circle cx="52" cy="52" r="10" fill="#c49a5c"/>
</g>
<!-- 흩뿌려진 소금 -->
<g fill="#ffffff" stroke="#c4d4da" stroke-width="1.6">
  <rect x="556" y="452" width="12" height="12" transform="rotate(45 562 458)"/>
  <rect x="592" y="462" width="10" height="10" transform="rotate(45 597 467)"/>
  <rect x="116" y="458" width="11" height="11" transform="rotate(45 121 463)"/>
  <rect x="836" y="450" width="12" height="12" transform="rotate(45 842 456)"/>
</g>
</svg>
</body>
</html>
