<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소래포구 MATHTOUR - STAGE 2</title>
    <style>
        /* [공통 규칙 4] 폰트 로드 */
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 초기화 및 바탕 설정 */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111;
        }

        /* [공통 규칙 2] 16:9 비율 유지 (최대 1066px) */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #2c2019; /* 다크 브라운 */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        /* [배경 이미지 규칙] z-index: 0, 화면 꽉 채움 */
        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* [공통 규칙 6] 상단 스테이지 표시바 (톱니바퀴 금속 명패 스타일) */
        .top-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #b87333, #8a5322); /* 브라스 골드 */
            border: 3px solid #4a3b32;
            color: #f4ecd8;
            padding: 8px 40px;
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: inset 0px 0px 5px rgba(255,255,255,0.3), 3px 3px 8px rgba(0,0,0,0.7);
            border-radius: 5px;
            z-index: 10;
        }

        /* [에셋 로딩 규칙] 등장인물 래퍼 - 트랜지션으로 확대 및 밝기 조절 연출 */
        .char-wrapper {
            position: absolute;
            bottom: 10px; /* 발끝 지면 정렬 */
            width: 260px;
            height: 320px;
            overflow: visible;
            z-index: 3;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: bottom center; /* 발을 기준으로 확대 */
        }
        /* 민우: 배경과 겹치지 않게 좌측 끝에 배치 */
        #char-민우 { left: 5%; }
        /* 서연: 배경과 겹치지 않게 우측 끝에 배치 */
        #char-서연 { right: 5%; }

        /* [유형 2] 대화창(말풍선) UI - 금속 파이프 테두리 스팀펑크 디자인 */
        #dialogue-box {
            position: absolute;
            width: 45%;
            background: linear-gradient(135deg, rgba(44,32,25,0.95), rgba(0,59,70,0.95)); /* 다크 브라운 ~ 다크 틸 */
            border: 5px solid #4a3b32;
            border-radius: 15px;
            box-shadow: 
                inset 0 0 0 2px #b87333, /* 브라스 골드 이너 라인 */
                5px 5px 20px rgba(0,0,0,0.8);
            padding: 20px 30px;
            z-index: 20;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: none; /* 초기값 숨김 */
        }

        /* 말풍선 꼬리 (아래쪽을 향하는 뾰족한 삼각형) */
        #dialogue-box::after {
            content: '';
            position: absolute;
            bottom: -25px;
            border-width: 25px 18px 0;
            border-style: solid;
            border-color: #4a3b32 transparent transparent transparent;
        }
        .tail-left::after { left: 40px; }
        .tail-right::after { right: 40px; }

        #speaker-name {
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: #b87333;
            margin-bottom: 12px;
            text-shadow: 1px 1px 2px #000;
        }

        #dialogue-text {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.15rem;
            color: #f4ecd8;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* [공통 규칙 5, 10] 공통 이동 버튼 (황동/리벳 느낌) */
        .btn-nav {
            position: absolute;
            background: linear-gradient(135deg, #b87333, #7a481e);
            color: #f4ecd8;
            border: 2px solid #4a3b32;
            padding: 10px 25px;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 25; 
            border-radius: 4px;
            box-shadow: 
                inset 2px 2px 2px rgba(255,255,255,0.2), 
                inset -2px -2px 4px rgba(0,0,0,0.5), 
                4px 4px 6px rgba(0,0,0,0.6);
            transition: all 0.2s ease;
            display: none;
        }

        .btn-nav::before, .btn-nav::after {
            content: ''; position: absolute; width: 6px; height: 6px;
            background-color: #4a3b32; border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8);
        }
        .btn-nav::before { top: 6px; left: 6px; }
        .btn-nav::after { bottom: 6px; right: 6px; }

        .btn-nav:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-nav:active { transform: translateY(1px); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8); }

        #btn-prev { left: 20px; bottom: 20px; }
        #btn-next, #btn-skip { right: 20px; bottom: 20px; }
        #btn-skip { display: block; } /* 건너뛰기는 진행 중에 표시 */
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지: 요청에 따라 '풍차 이차함수.png' 적용 -->
        <img class="bg-image" src="풍차 이차함수.png" alt="풍차 이차함수 배경">

        <!-- 상단 스테이지 표시바 -->
        <div class="top-bar">⚙ 관찰: 풍차의 포물선 궤적 ⚙</div>

        <!-- 등장 인물: 민우 (좌측) -->
        <div class="char-wrapper" id="char-민우">
            <!-- 260x320 고정, iframe 안에서는 원본 비율 유지, wrapper를 확대 -->
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장 인물: 서연 (우측) -->
        <div class="char-wrapper" id="char-서연">
            <!-- 마주보게 하기 위해 iframe에서 scaleX(-1) 적용 -->
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom center; pointer-events:none;"></iframe>
        </div>

        <!-- 대화창 UI (클릭 시 다음 대사 진행) -->
        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name"></div>
            <div id="dialogue-text"></div>
        </div>

        <!-- 네비게이션 버튼 -->
        <button id="btn-skip" class="btn-nav" onclick="endDialogue()">건너뛰기</button>
        <button id="btn-prev" class="btn-nav" onclick="window.location.href='E01.html'">이전</button>
        <button id="btn-next" class="btn-nav" onclick="window.location.href='E03.html'">다음</button>
    </div>

    <!-- 장면 진행 로직 스크립트 -->
    <script>
        // 대화 스크립트 (각각 한 마디씩)
        const dialogues = [
            { speaker: '민우', text: '저기 봐! 거대한 풍차 날개가 회전하는 궤적이 완벽한 포물선을 그리고 있어.' },
            { speaker: '서연', text: '정말이네! 이차함수 그래프와 똑같아. 저 궤적이 그리는 포물선의 최댓값과 최솟값도 수학적으로 구할 수 있지 않을까?' }
        ];

        let currentIndex = 0;
        const dialogueBox = document.getElementById('dialogue-box');
        const nameEl = document.getElementById('speaker-name');
        const textEl = document.getElementById('dialogue-text');
        
        const minwoo = document.getElementById('char-민우');
        const seoyeon = document.getElementById('char-서연');

        // 대사 진행, 화자 확대 및 말풍선 위치 이동 연출
        function advanceDialogue() {
            if (currentIndex >= dialogues.length) {
                endDialogue();
                return;
            }

            dialogueBox.style.display = 'block';
            const current = dialogues[currentIndex];
            
            // 텍스트 업데이트
            nameEl.innerText = current.speaker;
            textEl.innerHTML = current.text;

            // 화자 상태 변경 (확대 및 밝기 조절, 말풍선 위치 조정)
            if (current.speaker === '민우') {
                // 민우 활성화: 크기 확대, 밝기 원상복구, 맨 앞 배치
                minwoo.style.transform = "scale(1.35)";
                minwoo.style.filter = "brightness(1)";
                minwoo.style.zIndex = "10";
                
                // 서연 비활성화: 크기 축소, 밝기 어둡게, 뒤로 배치
                seoyeon.style.transform = "scale(0.85)";
                seoyeon.style.filter = "brightness(0.55)";
                seoyeon.style.zIndex = "3";

                // 말풍선을 민우 머리 위로 이동
                dialogueBox.style.left = "18%";
                dialogueBox.style.right = "auto";
                dialogueBox.style.bottom = "430px";
                dialogueBox.className = "tail-left"; // 꼬리를 왼쪽으로
            } else {
                // 서연 활성화
                seoyeon.style.transform = "scale(1.35)";
                seoyeon.style.filter = "brightness(1)";
                seoyeon.style.zIndex = "10";
                
                // 민우 비활성화
                minwoo.style.transform = "scale(0.85)";
                minwoo.style.filter = "brightness(0.55)";
                minwoo.style.zIndex = "3";

                // 말풍선을 서연 머리 위로 이동
                dialogueBox.style.left = "auto";
                dialogueBox.style.right = "18%";
                dialogueBox.style.bottom = "430px";
                dialogueBox.className = "tail-right"; // 꼬리를 오른쪽으로
            }
            
            currentIndex++;
        }

        // 대화 종료 시 모든 UI 원상 복구 및 이동 버튼 활성화
        function endDialogue() {
            dialogueBox.style.display = 'none';
            document.getElementById('btn-skip').style.display = 'none';
            document.getElementById('btn-prev').style.display = 'block';
            document.getElementById('btn-next').style.display = 'block';

            // 모든 캐릭터 원래 크기와 밝기로 복구
            minwoo.style.transform = "scale(1)";
            minwoo.style.filter = "brightness(1)";
            minwoo.style.zIndex = "3";

            seoyeon.style.transform = "scale(1)";
            seoyeon.style.filter = "brightness(1)";
            seoyeon.style.zIndex = "3";
        }

        // 창이 로드되면 첫 번째 대사 출력
        window.onload = () => {
            advanceDialogue();
        };
    </script>
</body>
</html>
