<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소래포구 MATHTOUR - D05 (수정)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 기본 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a110c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Gowun Dodum', sans-serif;
            overflow: hidden;
        }

        /* 게임 화면 컨테이너 (16:9 비율 고정) */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #2c2019;
            overflow: hidden;
            border: 4px solid #4a3b32;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(0, 0, 0, 0.6);
        }

        /* 배경 이미지 규칙 */
        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 스테이지 상단 표시바 (스팀펑크 금속 명패 스타일) */
        .top-status-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #003b46, #00252c);
            border: 2px solid #b87333;
            padding: 6px 35px;
            border-radius: 4px;
            color: #f4ecd8;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1.5px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6), inset 0 0 8px rgba(184, 115, 51, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-status-bar::before, .top-status-bar::after {
            content: '⚙';
            color: #b87333;
            display: inline-block;
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 상황 설명 박스 (유형 1: 빛바랜 도면/양피지 스타일) */
        .situation-box {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            background-color: #f4ecd8;
            border: 3px solid #4a3b32;
            box-shadow: 4px 4px 0px #b87333, 0 8px 20px rgba(0, 0, 0, 0.5);
            padding: 18px 25px;
            z-index: 10;
            font-family: 'Noto Serif KR', serif;
            color: #4a3b32;
            border-radius: 2px;
        }

        .situation-title {
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: bold;
            font-size: 14px;
            color: #003b46;
            border-bottom: 1px dashed #4a3b32;
            padding-bottom: 5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .situation-content p {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        
        .situation-content p:last-child {
            margin-bottom: 0;
        }

        .speaker-tag {
            font-weight: bold;
            color: #b87333;
            margin-right: 6px;
        }

        /* 등장인물 배치 컨테이너 */
        .char-wrapper {
            position: absolute;
            overflow: visible;
            z-index: 3;
        }

        /* 공통 이동 버튼 (황동 금속판 스타일) */
        .btn-nav {
            position: absolute;
            background: linear-gradient(135deg, #b87333, #8e4f1e);
            border: 2px solid #4a3b32;
            color: #f4ecd8;
            padding: 10px 24px;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            box-shadow: 3px 3px 0px #2c2019, inset 1px 1px 2px rgba(255, 255, 255, 0.2);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
            transition: all 0.1s ease;
        }

        .btn-nav:hover {
            background: linear-gradient(135deg, #c98444, #9f5f2a);
        }

        .btn-nav:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #2c2019;
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next {
            right: 20px;
            bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지 -->
        <img src="소래포구_새우타워(밤).png" alt="소래포구 새우타워 밤 풍경" class="bg-image">

        <!-- 상단 상태바 -->
        <div class="top-status-bar">소래포구 MATHTOUR</div>

        <!-- 상황 설명 박스 (유형 1) -->
        <div class="situation-box">
            <div class="situation-title">
                <span>[ 무대 완료 ] 새우타워의 밤</span>
                <span>⚙ SYSTEM ACTIVE</span>
            </div>
            <div class="situation-content">
                <p><span class="speaker-tag">서연:</span> "누렁아~ 계단 오르면서 무슨 생각을 했니?"</p>
                <p><span class="speaker-tag">민우:</span> "우리는 너를 잃어버린 4분 동안 너무 마음 졸였더니 힘들다. 이제 집에 가자."</p>
                <p><span class="speaker-tag">누렁이:</span> "월월~!"</p>
            </div>
        </div>

        <!-- 등장인물: 서연 (왼쪽) -->
        <div class="char-wrapper" id="char-서연" style="position:absolute; left:140px; bottom:20px; width:260px; height:320px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장인물: 누렁이 (서연과 민우 사이로 이동) -->
        <div class="char-wrapper" id="char-누렁이" style="position:absolute; left:410px; bottom:20px; width:260px; height:320px; z-index: 3;">
            <iframe src="등장인물_누렁이.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장인물: 민우 (오른쪽으로 이동, 정면 바라보기 유지) -->
        <div class="char-wrapper" id="char-민우" style="position:absolute; left:680px; bottom:20px; width:260px; height:320px; z-index: 3;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 이동 버튼 -->
        <button class="btn-nav" id="btn-prev" onclick="window.location.href='D04.html'">이전</button>
        <button class="btn-nav" id="btn-next" onclick="window.location.href='index.html'">다음</button>
    </div>

</body>
</html>
