<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소래포구 MATHTOUR - D03</title>
    <style>
        /* 폰트 및 공통 스타일 적용 */
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #1a110c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Gowun Dodum', sans-serif;
            overflow: hidden;
        }

        /* 16:9 비율 고정 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #2c2019;
            border: 4px solid #4a3b32;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 배경 이미지 규칙 적용 */
        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 스테이지 상단 표시바 (톱니바퀴 스타일 명패) */
        .stage-header {
            position: absolute;
            top: 15px;
            left: 20px;
            background: linear-gradient(135deg, #4a3b32, #2c2019);
            border: 2px solid #b87333;
            padding: 6px 18px;
            border-radius: 4px;
            z-index: 10;
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: bold;
            font-size: 14px;
            color: #b87333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stage-header::before {
            content: '⚙';
            display: inline-block;
            animation: gear-spin 5s linear infinite;
        }
        @keyframes gear-spin {
            100% { transform: rotate(360deg); }
        }

        /* 유형 1: 상황 설명 박스 */
        .situation-box {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 520px;
            height: 175px;
            background: linear-gradient(135deg, rgba(44, 32, 25, 0.95), rgba(26, 17, 12, 0.95));
            border: 3px solid #b87333;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 12px 28px rgba(0,0,0,0.8);
            border-radius: 6px;
            padding: 20px;
            z-index: 10;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* 스크롤바 커스텀 */
        .situation-box::-webkit-scrollbar {
            width: 6px;
        }
        .situation-box::-webkit-scrollbar-track {
            background: #2c2019;
        }
        .situation-box::-webkit-scrollbar-thumb {
            background: #b87333;
            border-radius: 3px;
        }

        .situation-title {
            font-family: 'Gowun Dodum', sans-serif;
            color: #b87333;
            font-size: 15px;
            font-weight: bold;
            border-bottom: 1px dashed #4a3b32;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        .situation-content {
            font-family: 'Noto Serif KR', serif;
            font-size: 13.5px;
            line-height: 1.7;
            color: #f4ecd8;
        }

        .system-mission {
            font-family: 'Nanum Gothic Coding', monospace;
            color: #b87333;
            font-weight: bold;
            border-top: 1px dashed #4a3b32;
            margin-top: 10px;
            padding-top: 10px;
            display: block;
            font-size: 14px;
        }

        /* 누렁이 화면 밖 대시 애니메이션 wrapper 스타일 */
        .char-wrapper {
            z-index: 2;
            position: absolute;
            overflow: visible;
            left: -300px;
            bottom: 20px;
            width: 234px;
            height: 288px;
            animation: dog-escape-screen 2.8s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        @keyframes dog-escape-screen {
            0% {
                left: -300px;
                transform: translateY(0) rotate(0deg);
            }
            10% { transform: translateY(-15px) rotate(-4deg); }
            20% { transform: translateY(0) rotate(4deg); }
            30% { transform: translateY(-15px) rotate(-4deg); }
            40% { transform: translateY(0) rotate(4deg); }
            50% { transform: translateY(-15px) rotate(-4deg); }
            60% { transform: translateY(0) rotate(4deg); }
            70% { transform: translateY(-15px) rotate(-4deg); }
            80% { transform: translateY(0) rotate(4deg); }
            90% { transform: translateY(-15px) rotate(-4deg); }
            100% {
                left: 110%;
                transform: translateY(0) rotate(0deg);
            }
        }

        /* 황동 금속판 내비게이션 버튼 스타일 */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            background: #b87333;
            border: 2px solid #4a3b32;
            color: #2c2019;
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: bold;
            font-size: 15px;
            padding: 8px 26px;
            cursor: pointer;
            box-shadow: 0 4px 0 #4a3b32, inset 1px 1px 2px rgba(255,255,255,0.4);
            border-radius: 4px;
            z-index: 15;
            transition: all 0.1s;
        }
        .btn-nav:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #4a3b32, 0 3px 5px rgba(0,0,0,0.5);
        }

        #btn-prev {
            left: 20px;
        }

        #btn-next {
            right: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지 -->
        <img src="소래포구_새우타워(밤).png" class="bg-image" alt="소래포구 새우타워 밤">

        <!-- 상단 헤더 바 -->
        <div class="stage-header">소래포구 MATHTOUR — ⚙ Stage 1</div>

        <!-- 유형 1: 상황 연출 설명 박스 -->
        <div class="situation-box">
            <div class="situation-title">🎬 소래포구 새우타워와 사라진 누렁이</div>
            <div class="situation-content">
                민우와 서연이가 누렁이를 찾기 위해 새우타워의 아찔한 계단으로 진입했습니다. 하지만 누렁이의 이동 속도가 심상치 않습니다! 수학적 지식을 발휘해 누렁이의 위치를 파악하세요!
                <!-- [수정] 미션 이름 변경 적용 -->
                <span class="system-mission">👉 [미션: 누렁이를 찾아라!] 가 시작됩니다.</span>
            </div>
        </div>

        <!-- 누렁이 에셋 애니메이션 배치 -->
        <div class="char-wrapper" id="char-누렁이">
            <iframe src="등장인물_누렁이.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.9); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 공통 네비게이션 버튼 -->
        <a id="btn-prev" class="btn-nav" href="./D02.html" style="text-decoration:none;">이전</a>
        <a id="btn-next" class="btn-nav" href="./D04.html" style="text-decoration:none;">다음</a>
    </div>

</body>
</html>
