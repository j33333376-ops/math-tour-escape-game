<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소래포구 MATHTOUR - C01</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #120e0c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Gowun Dodum', sans-serif;
      color: #f4ecd8;
      overflow: hidden;
    }

    /* 16:9 메인 게임 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background-color: #2c2019;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(184, 115, 51, 0.4);
      border: 3px solid #b87333;
    }

    /* 빨려 들어가는 다음 페이지 전환 애니메이션 */
    .suck-in-effect {
      animation: suckIn 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
      transform-origin: center center;
    }

    @keyframes suckIn {
      0% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
        filter: blur(0px);
      }
      50% {
        filter: blur(4px);
      }
      100% {
        transform: scale(0.01) rotate(720deg);
        opacity: 0;
        filter: blur(12px);
      }
    }

    /* 전체 배경 이미지 */
    #bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.85) contract(1.05);
    }

    /* 스테이지 상단 표시바 (스팀펑크 명패) */
    .stage-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: linear-gradient(180deg, #4a3b32 0%, #2c2019 100%);
      border: 2px solid #b87333;
      border-radius: 6px;
      padding: 6px 28px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stage-bar::before, .stage-bar::after {
      content: '⚙';
      font-size: 16px;
      color: #b87333;
      text-shadow: 0 0 4px rgba(184, 115, 51, 0.6);
    }

    .stage-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 16px;
      font-weight: bold;
      color: #f4ecd8;
      letter-spacing: 1px;
    }

    /* 상황 설명 박스 (가죽/오래된 설계도 느낌) */
    .situation-box {
      position: absolute;
      top: 53%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      max-height: 380px;
      z-index: 5;
      background: rgba(44, 32, 25, 0.92);
      border: 3px solid #b87333;
      border-radius: 8px;
      padding: 24px 28px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 8px 24px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);
      word-break: keep-all;
      overflow-y: auto;
    }

    /* 스팀펑크 양식 리벳 장식 */
    .rivet {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #b87333;
      border-radius: 50%;
      box-shadow: inset 1px 1px 1px rgba(255,255,255,0.6), inset -1px -1px 1px rgba(0,0,0,0.8);
    }
    .rivet.tl { top: 6px; left: 6px; }
    .rivet.tr { top: 6px; right: 6px; }
    .rivet.bl { bottom: 6px; left: 6px; }
    .rivet.br { bottom: 6px; right: 6px; }

    .situation-text {
      font-family: 'Noto Serif KR', serif;
      font-size: 15px;
      line-height: 1.75;
      color: #f4ecd8;
      text-align: justify;
    }

    .situation-text p {
      margin-bottom: 12px;
    }

    .situation-text p:last-child {
      margin-bottom: 0;
    }

    /* 가독성 강조 핵심 키워드 스타일링 (3~5개) */
    .highlight {
      color: #ffda66;
      font-weight: 700;
      text-shadow: 0 0 6px rgba(184, 115, 51, 0.5);
      border-bottom: 1px dashed #b87333;
      padding-bottom: 1px;
    }

    /* 캐릭터 영역 */
    .char-wrapper {
      position: absolute;
      z-index: 3;
      overflow: visible;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.7));
    }

    /* 좌측 하단 / 우측 하단 네비게이션 버튼 */
    .btn-nav {
      position: absolute;
      z-index: 10;
      background: linear-gradient(135deg, #b87333 0%, #7a461b 100%);
      color: #f4ecd8;
      border: 2px solid #4a3b32;
      border-radius: 6px;
      padding: 10px 24px;
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 1px 1px 0px rgba(255, 255, 255, 0.4), 
                  inset -1px -1px 0px rgba(0, 0, 0, 0.6), 
                  0 4px 8px rgba(0, 0, 0, 0.6);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
      box-shadow: inset 1px 1px 0px rgba(255, 255, 255, 0.5), 
                  inset -1px -1px 0px rgba(0, 0, 0, 0.6), 
                  0 6px 12px rgba(0, 0, 0, 0.7);
    }

    .btn-nav:active {
      transform: translateY(1px);
      filter: brightness(0.9);
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
    }

    #btn-next {
      right: 20px;
      bottom: 20px;
    }

    /* 스크롤바 맞춤 스타일링 */
    .situation-box::-webkit-scrollbar {
      width: 6px;
    }
    .situation-box::-webkit-scrollbar-track {
      background: #2c2019;
      border-radius: 3px;
    }
    .situation-box::-webkit-scrollbar-thumb {
      background: #b87333;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 배경 이미지 -->
    <img src="소래습지공원 전시관.png" id="bg-img" alt="소래습지공원 전시관">

    <!-- 상단 스테이지 바 -->
    <div class="stage-bar">
      <span class="stage-title">소래포구 MATHTOUR | 소래습지공원 전시관</span>
    </div>

    <!-- 좌측 캐릭터: 민우 -->
    <div class="char-wrapper" id="char-민우" style="left: 18px; bottom: 20px; width: 247px; height: 304px;">
      <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.95); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 중앙 상황 설명 박스 -->
    <div class="situation-box">
      <div class="rivet tl"></div>
      <div class="rivet tr"></div>
      <div class="rivet bl"></div>
      <div class="rivet br"></div>
      <div class="situation-text">
        <p>
          소래습지공원 전시관은 <span class="highlight">소래습지</span>의 자연환경과 <span class="highlight">갯벌 생태</span>, <span class="highlight">염전의 역사</span>와 다양한 생물을 한곳에서 만나볼 수 있는 공간입니다.
        </p>
        <p>
          전시관에서 만난 칠면초, 농게, 저어새 등 소래습지를 대표하는 생물과 습지의 모습을 주변 자연환경에서도 직접 찾아보세요. 전시관 안의 이야기와 실제 습지의 풍경을 함께 살펴보면, 소래습지가 지닌 <span class="highlight">자연·생태적 가치</span>와 인천 지역의 특색을 더욱 생생하게 발견할 수 있습니다.
        </p>
        <p style="margin-top: 16px; color: #d4a373; font-style: italic; text-align: center;">
          🌾 전시관 곳곳을 천천히 살펴보며 소래습지가 들려주는 다양한 이야기를 만나보세요!
        </p>
      </div>
    </div>

    <!-- 우측 캐릭터: 서연 -->
    <div class="char-wrapper" id="char-서연" style="right: 18px; bottom: 20px; width: 247px; height: 304px;">
      <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.95) scaleX(-1); transform-origin:bottom right; pointer-events:none;"></iframe>
    </div>

    <!-- 이동 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="goPrev()">◀ 이전</button>
    <button class="btn-nav" id="btn-next" onclick="goNext()">다음 ▶</button>
  </div>

  <script>
    const PREV_URL = "index.html";
    const NEXT_URL = "C02.html";

    function goPrev() {
      window.location.href = PREV_URL;
    }

    function goNext() {
      const container = document.getElementById('game-container');
      // 다음 버튼 누를 때 빨려 들어가는 연출 효과 적용
      container.classList.add('suck-in-effect');
      
      setTimeout(() => {
        window.location.href = NEXT_URL;
      }, 750);
    }
  </script>
</body>
</html>
