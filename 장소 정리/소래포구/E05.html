<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>소래포구 MATHTOUR - 이차함수 요약 정리</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        body { 
            margin: 0; background-color: #2c2019; 
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border: 8px solid #4a3b32;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        /* 배경 */
        #bg-image { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 0; 
        }

        /* 말풍선 스타일 */
        .speech-bubble {
            position: absolute;
            width: 320px;
            padding: 20px;
            background: #f4ecd8;
            border: 3px solid #4a3b32;
            border-radius: 20px;
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 18px;
            color: #4a3b32;
            z-index: 5;
            display: none;
            box-shadow: 5px 5px 0px #b87333;
            line-height: 1.4;
        }

        /* 말풍선 위치 조정 */
        /* 남학생(민우) 말풍선 */
        #bubble-min-woo { top: 100px; left: 120px; } 
        
        /* 여학생(서연) 말풍선 */
        #bubble-seoyeon { top: 100px; left: 450px; } 

        /* 공통 버튼 */
        .btn-nav {
            position: absolute; bottom: 20px; padding: 12px 30px;
            background: #b87333; color: #f4ecd8; font-family: 'Gowun Dodum';
            border: 4px solid #4a3b32; cursor: pointer; z-index: 11;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.6);
            font-size: 20px;
        }
        #btn-prev { left: 20px; }
        #btn-next { right: 20px; }
    </style>
</head>
<body onclick="advanceDialogue()">

<div id="game-container">
    <img id="bg-image" src="풍차앞.png" alt="배경">

    <!-- 민우와 서연의 머리 위 말풍선 -->
    <div id="bubble-min-woo" class="speech-bubble"></div>
    <div id="bubble-seoyeon" class="speech-bubble"></div>

    <!-- 버튼 -->
    <button id="btn-prev" class="btn-nav" onclick="event.stopPropagation(); location.href='E04.html'">이전</button>
    <button id="btn-next" class="btn-nav" onclick="event.stopPropagation(); location.href='index.html'" style="display:none;">다음</button>
</div>

<script>
    // 요청하신 대사로 변경
    const dialogues = [
        { text: "제한된 범위에서 이차함수의 최대, 최소를 구하는 과정이 실수 전체에서 구할때와는 다르다는 것을 배웠어", target: "min-woo" },
        { text: "맞아, 제한된 범위에서는 축의 x좌표가 주어진 범위에 들어가는지를 먼저 파악하고 그래프를 이용하여 생각하면 간단하게 구할 수 있어!", target: "seoyeon" }
    ];

    let currentIndex = 0;

    function advanceDialogue() {
        if (currentIndex >= dialogues.length) return;

        // 모든 말풍선 숨김
        document.querySelectorAll(".speech-bubble").forEach(b => b.style.display = "none");

        // 현재 대사 표시
        const d = dialogues[currentIndex];
        const bubble = document.getElementById("bubble-" + d.target);
        bubble.innerText = d.text;
        bubble.style.display = "block";

        currentIndex++;

        // 마지막 대사일 때 다음 버튼 표시
        if (currentIndex >= dialogues.length) {
            document.getElementById("btn-next").style.display = "block";
        }
    }

    // 시작 시 첫 대사 호출
    advanceDialogue();
</script>
</body>
</html>
