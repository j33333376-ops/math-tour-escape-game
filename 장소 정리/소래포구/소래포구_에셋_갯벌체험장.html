<!-- 원본 크기: 1000x480 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소래 갯벌체험장</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  svg.gtb-svg { display:block; width:100%; height:auto; }
  .gtb-glint { animation: gtb-twinkle 4.5s ease-in-out infinite; }
  @keyframes gtb-twinkle { 0%,100% { opacity:0.15; } 50% { opacity:0.5; } }
</style>
</head>
<body>
<svg class="gtb-svg" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소래 갯벌체험장, 갯골과 나무 데크가 있는 넓은 갯벌">
<title>소래 갯벌체험장</title>
<defs>
  <linearGradient id="gtb-mud1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9c8560"/>
    <stop offset="1" stop-color="#7c6748"/>
  </linearGradient>
  <linearGradient id="gtb-channel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fb0b0"/>
    <stop offset="0.5" stop-color="#6f8f8c"/>
    <stop offset="1" stop-color="#5a7268"/>
  </linearGradient>
  <linearGradient id="gtb-plank" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b98a52"/>
    <stop offset="1" stop-color="#8c6236"/>
  </linearGradient>
</defs>

<!-- ============ 갯벌 바닥 (유기적 경계) ============ -->
<path d="M0,86 C120,52 250,98 380,64 C520,30 650,80 800,48 C900,28 960,60 1000,50 L1000,480 L0,480 Z" fill="url(#gtb-mud1)"/>

<!-- 얼룩 텍스처 -->
<g opacity="0.35" fill="#6a5638">
  <ellipse cx="130" cy="200" rx="90" ry="34"/>
  <ellipse cx="420" cy="150" rx="110" ry="30"/>
  <ellipse cx="750" cy="220" rx="100" ry="36"/>
  <ellipse cx="880" cy="380" rx="90" ry="40"/>
  <ellipse cx="180" cy="400" rx="100" ry="42"/>
</g>
<g opacity="0.25" fill="#b8a074">
  <ellipse cx="300" cy="330" rx="80" ry="26"/>
  <ellipse cx="600" cy="380" rx="100" ry="30"/>
  <ellipse cx="60" cy="120" rx="60" ry="20"/>
</g>

<!-- 잔물결/펄 무늬 -->
<g stroke="#6a5638" stroke-width="1.2" fill="none" opacity="0.45">
  <path d="M40,140 Q90,132 140,140 T240,140"/>
  <path d="M60,240 Q110,232 160,240 T260,240"/>
  <path d="M500,120 Q550,112 600,120 T700,120"/>
  <path d="M560,300 Q610,292 660,300 T760,300"/>
  <path d="M780,420 Q830,412 880,420 T980,420"/>
  <path d="M100,440 Q150,432 200,440 T300,440"/>
</g>

<!-- ============ 구불구불한 갯골 (물길) ============ -->
<path d="M40,80
  C120,140 60,190 140,230
  C220,268 180,300 260,330
  C340,358 300,400 380,430
  C440,452 470,460 520,470
  L500,478
  C450,462 420,452 360,432
  C280,404 320,362 240,332
  C160,300 200,268 120,232
  C40,192 100,140 20,84 Z"
  fill="url(#gtb-channel)"/>

<!-- 갯골 지류 -->
<path d="M180,220 C230,210 260,230 300,222 L296,240 C258,246 232,228 186,236 Z" fill="url(#gtb-channel)" opacity="0.9"/>
<path d="M340,370 C390,358 420,378 460,368 L456,386 C418,394 392,376 344,388 Z" fill="url(#gtb-channel)" opacity="0.9"/>

<!-- 물결 하이라이트 -->
<g class="gtb-glint" fill="#fff">
  <ellipse cx="100" cy="140" rx="14" ry="4"/>
  <ellipse cx="220" cy="270" rx="16" ry="4"/>
  <ellipse cx="330" cy="380" rx="14" ry="4"/>
  <ellipse cx="450" cy="440" rx="16" ry="4"/>
</g>

<!-- ============ 나무 데크 다리 ============ -->
<g>
  <!-- 지지 기둥 그림자(펄에 박힌 흔적) -->
  <g fill="#4a3a24" opacity="0.4">
    <ellipse cx="640" cy="150" rx="10" ry="4"/>
    <ellipse cx="720" cy="164" rx="10" ry="4"/>
    <ellipse cx="800" cy="178" rx="10" ry="4"/>
    <ellipse cx="880" cy="192" rx="10" ry="4"/>
  </g>
  <!-- 지지 기둥 -->
  <g stroke="#7a5630" stroke-width="6">
    <line x1="640" y1="130" x2="640" y2="150"/>
    <line x1="720" y1="144" x2="720" y2="164"/>
    <line x1="800" y1="158" x2="800" y2="178"/>
    <line x1="880" y1="172" x2="880" y2="192"/>
  </g>

  <!-- 데크 상판 -->
  <polygon points="600,96 940,158 936,182 596,120" fill="url(#gtb-plank)"/>
  <!-- 판자 이음선 -->
  <g stroke="#6e4a26" stroke-width="1.4" opacity="0.55">
    <line x1="630" y1="100" x2="626" y2="124"/>
    <line x1="662" y1="106" x2="658" y2="130"/>
    <line x1="694" y1="112" x2="690" y2="136"/>
    <line x1="726" y1="118" x2="722" y2="142"/>
    <line x1="758" y1="124" x2="754" y2="148"/>
    <line x1="790" y1="130" x2="786" y2="154"/>
    <line x1="822" y1="136" x2="818" y2="160"/>
    <line x1="854" y1="142" x2="850" y2="166"/>
    <line x1="886" y1="148" x2="882" y2="172"/>
    <line x1="918" y1="154" x2="914" y2="178"/>
  </g>
  <!-- 데크 옆면 -->
  <polygon points="596,120 936,182 936,190 596,128" fill="#6e4a26"/>

  <!-- 난간 (뒤쪽) -->
  <g stroke="#8c6236" stroke-width="4" stroke-linecap="round">
    <line x1="612" y1="72" x2="612" y2="102"/>
    <line x1="660" y1="80" x2="660" y2="110"/>
    <line x1="708" y1="88" x2="708" y2="118"/>
    <line x1="756" y1="96" x2="756" y2="126"/>
    <line x1="804" y1="104" x2="804" y2="134"/>
    <line x1="852" y1="112" x2="852" y2="142"/>
    <line x1="900" y1="120" x2="900" y2="150"/>
  </g>
  <path d="M606,74 L906,122" stroke="#b98a52" stroke-width="5" fill="none" stroke-linecap="round"/>
</g>

<!-- ============ 게 (작은 갯벌 생물) ============ -->
<g fill="#a8542f">
  <g transform="translate(160,320)">
    <ellipse rx="14" ry="10"/>
    <g stroke="#8a3d1f" stroke-width="2" fill="none">
      <path d="M-12,-2 L-24,-10"/><path d="M-10,4 L-22,10"/><path d="M-6,9 L-14,18"/>
      <path d="M12,-2 L24,-10"/><path d="M10,4 L22,10"/><path d="M6,9 L14,18"/>
    </g>
    <g fill="#8a3d1f">
      <path d="M-15,-4 Q-22,-8 -20,-14 Q-14,-12 -13,-6 Z"/>
      <path d="M15,-4 Q22,-8 20,-14 Q14,-12 13,-6 Z"/>
    </g>
  </g>
  <g transform="translate(500,410) scale(0.8)">
    <ellipse rx="14" ry="10"/>
    <g stroke="#8a3d1f" stroke-width="2" fill="none">
      <path d="M-12,-2 L-24,-10"/><path d="M-10,4 L-22,10"/><path d="M-6,9 L-14,18"/>
      <path d="M12,-2 L24,-10"/><path d="M10,4 L22,10"/><path d="M6,9 L14,18"/>
    </g>
    <g fill="#8a3d1f">
      <path d="M-15,-4 Q-22,-8 -20,-14 Q-14,-12 -13,-6 Z"/>
      <path d="M15,-4 Q22,-8 20,-14 Q14,-12 13,-6 Z"/>
    </g>
  </g>
</g>

<!-- ============ 조개 ============ -->
<g>
  <g transform="translate(760,300)" fill="#e8ddd0" stroke="#c8b8a0" stroke-width="1">
    <path d="M-14,4 Q-12,-10 0,-12 Q12,-10 14,4 Q0,10 -14,4 Z"/>
    <path d="M-8,3 Q-6,-6 0,-8" fill="none" stroke="#c8b8a0" stroke-width="0.8"/>
    <path d="M8,3 Q6,-6 0,-8" fill="none" stroke="#c8b8a0" stroke-width="0.8"/>
  </g>
  <g transform="translate(300,120) scale(0.8)" fill="#e8ddd0" stroke="#c8b8a0" stroke-width="1">
    <path d="M-14,4 Q-12,-10 0,-12 Q12,-10 14,4 Q0,10 -14,4 Z"/>
  </g>
  <g transform="translate(60,380) scale(0.7) rotate(20)" fill="#d8c8b4" stroke="#b8a488" stroke-width="1">
    <path d="M-14,4 Q-12,-10 0,-12 Q12,-10 14,4 Q0,10 -14,4 Z"/>
  </g>
</g>

</svg>
</body>
</html>
