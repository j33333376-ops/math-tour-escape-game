<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>범용 SVG 캐릭터 생성기 v7.0 · 260×320 HTML 다운로드</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef7ff 0%,#fff8ec 100%);font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;color:#172033;display:grid;grid-template-columns:330px 1fr;gap:20px;padding:22px}
.panel{background:#fff;border:3px solid #26364d;border-radius:22px;padding:18px;box-shadow:0 12px 28px rgba(0,0,0,.12);height:calc(100vh - 44px);overflow:auto}
.panel h1{font-size:21px;margin:0 0 6px}
.panel p{font-size:13px;margin:0 0 16px;color:#5d6675;line-height:1.45}
.group{border-top:1px solid #e5eaf2;padding-top:13px;margin-top:13px}
.group-title{font-size:14px;font-weight:900;margin-bottom:9px}
.control{margin-bottom:10px}
.control label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}
select,input[type="text"],button,textarea{width:100%;border:2px solid #26364d;border-radius:11px;padding:9px;background:#f8fbff;font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{cursor:pointer;background:#08286f;color:white;transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn.sub{background:#46627f}
.preview-wrap{display:grid;place-items:center;min-height:calc(100vh - 44px)}
.stage-card{width:min(560px,100%);background:rgba(255,255,255,.65);border:3px solid rgba(38,54,77,.18);border-radius:28px;padding:24px;box-shadow:0 14px 35px rgba(0,0,0,.08)}
.character-area{width:340px;margin:0 auto}
.character-area svg{display:block;width:100%;height:auto}
.stage-caption{text-align:center;font-size:12px;color:#7c8698;font-weight:700;margin-top:10px}
.codebox{margin-top:16px}
.codebox textarea{height:120px;font-family:Consolas,monospace;font-size:12px;background:#111827;color:#e5e7eb;display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
@media(max-width:850px){body{grid-template-columns:1fr}.panel{height:auto}.preview-wrap{min-height:auto}}
</style>
</head>
<body>
<aside class="panel">
  <h1>범용 SVG 캐릭터 생성기</h1>
  <p>학생과 NPC를 함께 만드는 범용 캐릭터 생성기 v7.0 (SVG 엔진). 몸·의상이 하나의 뼈대 좌표를 공유해 어떤 조합에서도 라인이 정확히 맞습니다. 260×320 HTML 컴포넌트로 다운로드됩니다.</p>
  <div class="group"><div class="group-title">기본 설정</div>
    <div class="control"><label>성별</label><select id="gender"><option value="boy">남성형</option><option value="girl">여성형</option></select></div>
    <div class="control"><label>프리셋</label><select id="preset"><option value="custom">직접 설정</option><option value="boy1">학생 - 모범생</option><option value="boy2">학생 - 운동부</option><option value="boy3">학생 - 안경</option><option value="girl1">학생 - 단발</option><option value="girl2">학생 - 긴머리</option><option value="girl3">학생 - 포니테일</option><option value="merchant1">NPC - 개항기 상인</option><option value="doctor1">NPC - 의사</option><option value="captain1">NPC - 선장</option><option value="officer1">NPC - 장교</option><option value="hanbok1">NPC - 한복/도포</option><option value="suit1">NPC - 정장</option></select></div>
    <div class="control"><label>캐릭터 이름 <span style="font-weight:400;color:#8a93a3">(4자 이하면 명찰에 표시)</span></label><input type="text" id="studentName" placeholder="예: 미스터첸"></div>
    <div class="control"><label>체형</label><select id="bodyType"><option value="thin">마른 체형</option><option value="normal" selected>보통 체형</option><option value="chubby">통통한 체형</option></select></div>
  </div>
  <div class="group"><div class="group-title">외형</div>
    <div class="control"><label>머리 모양</label><select id="hairStyle"></select></div>
    <div class="control"><label>눈 모양</label><select id="eyeType"><option value="round" selected>동그란 눈</option><option value="sleepy">실눈</option><option value="up">치켜뜬 실눈</option><option value="down">처진 실눈</option></select></div>
    <div class="control"><label>안경</label><select id="glassesType"><option value="none">없음</option><option value="round">둥근 안경</option><option value="square">네모 안경</option><option value="big">큰 원형 안경</option><option value="horn">뿔테 안경</option><option value="red">빨간 안경</option><option value="silver">은색 안경</option></select></div>
  </div>
  <div class="group"><div class="group-title">색상</div>
    <div class="control"><label>피부색</label><input type="text" id="skinColor" value="#ffd9bd" maxlength="7" placeholder="#ffd9bd" readonly onclick="openColorPanel('skinColor')"></div>
    <div class="control"><label>머리색</label><input type="text" id="hairColor" value="#191919" maxlength="7" placeholder="#191919" readonly onclick="openColorPanel('hairColor')"></div>
    <div class="control"><label>상의색</label><input type="text" id="vestColor" value="#08286f" maxlength="7" placeholder="#08286f" readonly onclick="openColorPanel('vestColor')"></div>
    <div class="control"><label>하의색</label><input type="text" id="pantsColor" value="#c8ad7e" maxlength="7" placeholder="#c8ad7e" readonly onclick="openColorPanel('pantsColor')"><button type="button" id="matchPantsToVest" class="btn sub" onclick="copyVestToPants()" style="margin-top:6px;padding:7px;font-size:12px;">상의색과 같게</button></div>
  </div>
  <div class="group"><div class="group-title">의상</div>
    <div class="control"><label>복장</label><select id="outfit"><option value="uniform">교복 조끼</option><option value="cardigan">가디건</option><option value="sports">체육복</option><option value="casual">생활복</option><option value="suit">정장</option><option value="merchant">개항기 상인복</option><option value="hanbok">한복/도포</option><option value="doctor">의사 가운</option><option value="captain">선장복</option><option value="officer">장교복</option></select></div>
    <div class="control"><label>하의</label><select id="bottomType"><option value="pantsLook">바지</option><option value="skirtLook">치마</option></select></div>
  </div>
  <div class="group"><div class="btns"><button class="btn" onclick="randomCharacter()">🎲 랜덤 생성</button><button class="btn sub" onclick="copyHTML()">📋 HTML 복사</button></div><button class="btn" onclick="downloadHTML()" style="margin-top:8px;">💾 HTML 다운로드</button><button class="btn sub" onclick="toggleCode()" style="margin-top:8px;">코드 보기 / 숨기기</button><div class="codebox"><textarea id="codeOutput" readonly></textarea></div></div>
</aside>
<main class="preview-wrap"><section class="stage-card">
  <div class="character-area" id="charHost"></div>
  <div class="stage-caption">실제 출력 260×320 · SVG 벡터 (확대해도 선명)</div>
</section></main>
<div class="toast" id="toast">복사되었습니다.</div>
<script>
/* ============================================================
   범용 SVG 캐릭터 생성기 v7.0
   - 모든 부위가 하나의 뼈대 좌표(P)에서 계산되어 라인이 항상 일치
   - buildSVG(state) 가 완성된 <svg> 문자열을 반환
   ============================================================ */
const $=id=>document.getElementById(id);
const SW=2.6;               // 기본 외곽선 두께
let UID=0;                  // clipPath 고유 id

/* ---------- 색상 유틸 ---------- */
function normHex(v,f){return /^#[0-9a-fA-F]{6}$/.test((v||'').trim())?(v.trim().toLowerCase()):f}
function rgbOf(h){const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255]}
function hexOf(r,g,b){const c=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');return'#'+c(r)+c(g)+c(b)}
function darken(h,p){const[r,g,b]=rgbOf(normHex(h,'#000000'));const f=1-p/100;return hexOf(r*f,g*f,b*f)}
function lighten(h,p){const[r,g,b]=rgbOf(normHex(h,'#ffffff'));const f=p/100;return hexOf(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f)}
function luma(h){const[r,g,b]=rgbOf(normHex(h,'#888888'));return r*.299+g*.587+b*.114}
function outlineFor(h){return luma(h)>185?'#44536e':darken(h,42)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const R=n=>Math.round(n*100)/100;

/* ---------- SVG 프리미티브 ---------- */
function pth(d,fill,stroke,sw,extra){sw=sw==null?SW:sw;return `<path d="${d}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw}"`:''} stroke-linejoin="round" stroke-linecap="round" ${extra||''}/>`}
function ell(cx,cy,rx,ry,fill,stroke,sw,extra){sw=sw==null?SW:sw;return `<ellipse cx="${R(cx)}" cy="${R(cy)}" rx="${R(rx)}" ry="${R(ry)}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw}"`:''} ${extra||''}/>`}
function crc(cx,cy,r,fill,stroke,sw,extra){sw=sw==null?SW:sw;return `<circle cx="${R(cx)}" cy="${R(cy)}" r="${R(r)}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw}"`:''} ${extra||''}/>`}
function ln(x1,y1,x2,y2,stroke,sw,extra){sw=sw==null?1.8:sw;return `<line x1="${R(x1)}" y1="${R(y1)}" x2="${R(x2)}" y2="${R(y2)}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" ${extra||''}/>`}
function rrect(x,y,w,h,rx,fill,stroke,sw,extra){sw=sw==null?SW:sw;return `<rect x="${R(x)}" y="${R(y)}" width="${R(w)}" height="${R(h)}" rx="${R(rx)}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw}"`:''} ${extra||''}/>`}

/* ---------- 뼈대 좌표계 ---------- */
function makeP(st){
  const girl=st.gender==='girl', b=st.bodyType;
  const dw=b==='thin'?-6:b==='chubby'?9:0;
  const P={
    cx:130,
    faceRx:44+(girl?1:0)+(b==='chubby'?2:b==='thin'?-1:0),
    faceRy:46+(girl?1:0),
    faceCy:86, earY:90,
    shoY:150, torsoBot:228,
    wT:88+dw, wB:82+dw, rS:13, rB:9,
    armW:16+(b==='chubby'?1.5:b==='thin'?-1:0),
    armLen:66, handR:8.5,
    pantsTop:216, pantsBot:256, pantsW:76+dw,
    legW:17+(b==='chubby'?1.5:b==='thin'?-1:0),
    legGap:17, legBot:288, sockTop:276,
    shoeTop:286, shoeBot:302, shoeW:37,
    skirtTop:214, skirtBot:258
  };
  return P;
}

/* ---------- 팔레트 계산 ---------- */
function makeC(st){
  const skin=st.skin, hair=st.hairC, top=st.top, bot=st.bot;
  return {
    skin, sLine:darken(skin,58), sShade:darken(skin,10),
    hair, hLine:luma(hair)>190?'#8a8f98':darken(hair,36),
    hShine:luma(hair)>170?'#ffffff':lighten(hair,26),
    top, tLine:outlineFor(top), tDark:darken(top,18), tLight:lighten(top,16),
    bot, bLine:outlineFor(bot), bDark:darken(bot,18),
    white:'#ffffff', wLine:'#4a5878',
    blush:st.gender==='girl'?'#f78bb1':'#f2a29e',
    tie:'#ff9ec7', tieLine:'#c2497b'
  };
}

/* ---------- 몸통 경로 (모든 의상이 공유) ---------- */
function torsoD(P,o){
  o=o||{};
  const t=P.shoY, b=o.bot!=null?o.bot:P.torsoBot;
  const inset=o.inset||0;
  const wT=P.wT-inset*2, wB=P.wB-inset*2;
  const xtl=P.cx-wT/2, xtr=P.cx+wT/2, xbl=P.cx-wB/2, xbr=P.cx+wB/2;
  const rS=P.rS, rB=P.rB;
  let topEdge='';
  if(o.vHalf){topEdge=`L ${R(P.cx-o.vHalf)} ${t} L ${P.cx} ${R(t+o.vDepth)} L ${R(P.cx+o.vHalf)} ${t} `}
  else if(o.dipR){topEdge=`L ${R(P.cx-o.dipR)} ${t} Q ${P.cx} ${R(t+o.dipD*2)} ${R(P.cx+o.dipR)} ${t} `}
  return `M ${R(xtl+rS)} ${t} ${topEdge}L ${R(xtr-rS)} ${t} Q ${R(xtr)} ${t} ${R(xtr)} ${t+rS} L ${R(xbr)} ${b-rB} Q ${R(xbr)} ${b} ${R(xbr-rB)} ${b} L ${R(xbl+rB)} ${b} Q ${R(xbl)} ${b} ${R(xbl)} ${b-rB} L ${R(xtl)} ${t+rS} Q ${R(xtl)} ${t} ${R(xtl+rS)} ${t} Z`;
}

/* ---------- 클리핑 음영(오른쪽 셰이드/밑단) ---------- */
function shadeIn(d,o){
  o=o||{};
  const id='cp'+(UID++);
  let inner='';
  if(o.x!=null)inner+=`<rect x="${R(o.x)}" y="0" width="90" height="320" fill="rgba(15,23,42,${o.op!=null?o.op:.07})"/>`;
  if(o.hemY!=null)inner+=`<rect x="0" y="${R(o.hemY)}" width="260" height="12" fill="rgba(15,23,42,.05)"/>`;
  return `<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`;
}
/* 골지(리브) 밴드 */
function ribBand(d,y,h,op){
  const id='cp'+(UID++);
  let ticks='';
  for(let x=44;x<=216;x+=6)ticks+=`<line x1="${x}" y1="${R(y+1.5)}" x2="${x}" y2="${R(y+h-1.5)}" stroke="rgba(15,23,42,.13)" stroke-width="1.2"/>`;
  return `<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})"><rect x="0" y="${R(y)}" width="260" height="${R(h)}" fill="rgba(15,23,42,${op!=null?op:.09})"/>${ticks}</g>`;
}

/* ---------- 하의 종류 결정 ---------- */
function bottomKind(st){
  if(st.outfit==='doctor')return 'long';
  if(st.outfit==='hanbok')return (st.gender==='girl'&&st.bottom==='skirtLook')?'chima':'baji';
  if(st.gender==='girl'&&st.bottom==='skirtLook')return 'skirt';
  return ['suit','merchant','captain','officer'].includes(st.outfit)?'long':'shorts';
}
function torsoBotFor(st){
  if(st.outfit==='doctor')return 264;
  if(st.outfit==='merchant')return 240;
  if(st.outfit==='hanbok')return bottomKind(st)==='chima'?202:226;
  if(st.outfit==='captain'||st.outfit==='officer')return 230;
  return 228;
}

/* ---------- 신발 ---------- */
function shoeStyle(st,C){
  const o=st.outfit;
  if(o==='sports'||o==='casual')return{fill:'#f7f9fc',line:'#3e4a63',type:'sneaker'};
  if(o==='hanbok')return{fill:'#eef1f8',line:'#5f6c86',type:'gomusin'};
  if(['suit','captain','officer','doctor','merchant'].includes(o))return{fill:'#34353f',line:'#15161d',type:'dress'};
  return{fill:'#7a4a2b',line:'#33200f',type:'loafer'};
}
function shoesG(P,C,st){
  const sty=shoeStyle(st,C);
  let s='';
  for(const sg of[-1,1]){
    const xi=P.cx+sg*3.5, xo=P.cx+sg*(3.5+P.shoeW);
    const t=P.shoeTop, b=P.shoeBot;
    const d=`M ${R(xi)} ${b-2} L ${R(xi)} ${t+6} Q ${R(xi)} ${t} ${R(xi+sg*7)} ${t} L ${R(xo-sg*13)} ${t} Q ${R(xo)} ${t} ${R(xo)} ${t+9} Q ${R(xo)} ${b} ${R(xo-sg*9)} ${b} L ${R(xi+sg*3)} ${b} Q ${R(xi)} ${b} ${R(xi)} ${b-2} Z`;
    s+=pth(d,sty.fill,sty.line);
    s+=ln(xi+sg*2,b-4.5,xo-sg*3,b-4.5,sty.type==='sneaker'?'#b9c1cf':'rgba(0,0,0,.28)',1.8);
    if(sty.type==='sneaker'){
      s+=pth(`M ${R(xo-sg*12)} ${t+1.5} Q ${R(xo-sg*3)} ${t+3} ${R(xo-sg*1.5)} ${t+10}`,'none','#aab3c2',1.7);
      s+=ln(xi+sg*5,t+4,xi+sg*11,t+3,C.top,2.4);
    }else if(sty.type==='loafer'){
      s+=ell(xo-sg*10,t+5,4.5,2.4,'rgba(255,255,255,.28)',null);
      s+=ln(xi+sg*4,t+3.5,xi+sg*12,t+3,'rgba(0,0,0,.3)',1.6);
    }else if(sty.type==='dress'){
      s+=ell(xo-sg*10,t+4.5,4.5,2,'rgba(255,255,255,.30)',null);
    }else{
      s+=pth(`M ${R(xi+sg*4)} ${t+5} Q ${R((xi+xo)/2)} ${t+9.5} ${R(xo-sg*6)} ${t+4}`,'none','#8b98af',1.7);
    }
  }
  return s;
}

/* ---------- 다리·양말 ---------- */
function legsG(P,C,kind){
  let s='';
  const top=kind==='skirt'?248:244;
  for(const sg of[-1,1]){
    const x=P.cx+sg*P.legGap-P.legW/2;
    s+=rrect(x,top,P.legW,P.legBot-top,5,C.skin,C.sLine);
    s+=rrect(x-1.5,P.sockTop,P.legW+3,P.legBot-P.sockTop+2,4,'#f7fafc','#4a5878',2.2);
    s+=ln(x-1.5,P.sockTop+3.5,x+P.legW+1.5,P.sockTop+3.5,'#8fa3c4',1.6,'opacity=".85"');
  }
  return s;
}

/* ---------- 하의 ---------- */
function shortsG(P,C){
  const w=P.pantsW,t=P.pantsTop,b=P.pantsBot,xl=P.cx-w/2,xr=P.cx+w/2,r=7;
  const d=`M ${R(xl)} ${t} L ${R(xr)} ${t} L ${R(xr)} ${b-r} Q ${R(xr)} ${b} ${R(xr-r)} ${b} L ${R(P.cx+5)} ${b} Q ${P.cx} ${R(b-9)} ${R(P.cx-5)} ${b} L ${R(xl+r)} ${b} Q ${R(xl)} ${b} ${R(xl)} ${b-r} Z`;
  let s=pth(d,C.bot,C.bLine);
  s+=shadeIn(d,{x:xr-11,op:.06});
  s+=ln(xl+5,b-6.5,P.cx-8,b-6.5,C.bDark,1.6,'opacity=".55"');
  s+=ln(P.cx+8,b-6.5,xr-5,b-6.5,C.bDark,1.6,'opacity=".55"');
  s+=pth(`M ${R(xl+6)} ${t+7} Q ${R(xl+13)} ${t+12} ${R(xl+11)} ${t+20}`,'none',C.bDark,1.6,'opacity=".5"');
  s+=pth(`M ${R(xr-6)} ${t+7} Q ${R(xr-13)} ${t+12} ${R(xr-11)} ${t+20}`,'none',C.bDark,1.6,'opacity=".5"');
  return s;
}
function skirtG(P,C){
  const t=P.skirtTop,b=P.skirtBot;
  const wt=P.wB-8,wb=P.wB+24;
  const xl=P.cx-wt/2,xr=P.cx+wt/2,Xl=P.cx-wb/2,Xr=P.cx+wb/2;
  const d=`M ${R(xl)} ${t} L ${R(xr)} ${t} L ${R(Xr)} ${b-5} Q ${R(Xr+1)} ${b} ${R(Xr-7)} ${b} L ${R(Xl+7)} ${b} Q ${R(Xl-1)} ${b} ${R(Xl)} ${b-5} Z`;
  let s=pth(d,C.bot,C.bLine);
  s+=shadeIn(d,{x:Xr-13,op:.06});
  for(const f of[-0.62,-0.22,0.22,0.62]){
    s+=ln(P.cx+f*wt/2,t+4,P.cx+f*wb/2,b-3.5,C.bDark,1.6,'opacity=".45"');
  }
  s+=pth(`M ${R(Xl+6)} ${b-6.5} L ${R(Xr-6)} ${b-6.5}`,'none',C.bDark,1.4,'opacity=".35"');
  return s;
}
function longPantsD(P,w,b){
  const t=P.pantsTop,xl=P.cx-w/2,xr=P.cx+w/2,g=5;
  return `M ${R(xl)} ${t} L ${R(xr)} ${t} L ${R(xr-3)} ${b-4} Q ${R(xr-3)} ${b} ${R(xr-8)} ${b} L ${R(P.cx+g+3)} ${b} Q ${R(P.cx+g)} ${b} ${R(P.cx+g)} ${b-3} L ${R(P.cx+g)} 252 Q ${P.cx} 244 ${R(P.cx-g)} 252 L ${R(P.cx-g)} ${b-3} Q ${R(P.cx-g)} ${b} ${R(P.cx-g-3)} ${b} L ${R(xl+8)} ${b} Q ${R(xl+3)} ${b} ${R(xl+3)} ${b-4} Z`;
}
function longPantsG(P,C,o){
  o=o||{};
  const col=o.col||C.bot, lineC=o.lineC||C.bLine, b=o.b||284, w=o.w||P.pantsW;
  const d=longPantsD(P,w,b);
  const dk=darken(col,18);
  let s=pth(d,col,lineC);
  s+=shadeIn(d,{x:P.cx+w/2-11,op:.06});
  s+=ln(P.cx+8,b-6,P.cx+w/2-6,b-6,dk,1.6,'opacity=".5"');
  s+=ln(P.cx-w/2+6,b-6,P.cx-8,b-6,dk,1.6,'opacity=".5"');
  s+=ln(P.cx+w/4,P.pantsTop+18,P.cx+w/4+1,b-11,dk,1.3,'opacity=".22"');
  s+=ln(P.cx-w/4,P.pantsTop+18,P.cx-w/4-1,b-11,dk,1.3,'opacity=".22"');
  return s;
}
function bajiG(P,C){
  const w=P.pantsW+8, b=278;
  let s=longPantsG(P,C,{w,b});
  /* 대님(발목 매듭 밴드) */
  const bx=(5+w/2)/2;
  for(const sg of[-1,1]){
    s+=rrect(P.cx+sg*bx-9,b-7,18,6.5,3,'#f3f0e6','#8a7a5c',1.8);

}
function chimaG(P,C){
  const t=200,b=294,cx=P.cx;
  const d=`M ${R(cx-33)} ${t} L ${R(cx+33)} ${t} C ${R(cx+48)} 226 ${R(cx+56)} 258 ${R(cx+56)} 288 Q ${R(cx+56)} ${b} ${R(cx+50)} ${b} L ${R(cx-50)} ${b} Q ${R(cx-56)} ${b} ${R(cx-56)} 288 C ${R(cx-56)} 258 ${R(cx-48)} 226 ${R(cx-33)} ${t} Z`;
  let s=pth(d,C.bot,C.bLine);
  s+=shadeIn(d,{x:cx+38,op:.05});
  for(const f of[-0.6,-0.25,0.15,0.5]){

  }
  s+=pth(`M ${R(cx-50)} ${b-8} Q ${cx} ${b-4} ${R(cx+50)} ${b-8}`,'none',C.bDark,1.5,'opacity=".35"');

/* ---------- 목·가슴(라운드넥에서 노출) ---------- */
function neckG(P,C){
  const cx=P.cx;
  const d=`M ${R(cx-11)} 124 L ${R(cx+11)} 124 L ${R(cx+11)} 141 Q ${R(cx+11.5)} 147.5 ${R(cx+16.5)} 152 L ${R(cx+16.5)} 168 L ${R(cx-16.5)} 168 L ${R(cx-16.5)} 152 Q ${R(cx-11.5)} 147.5 ${R(cx-11)} 141 Z`;
  return pth(d,C.skin,C.sLine)+ell(cx,133.5,10.5,3.2,'rgba(0,0,0,.10)',null);
}

/* ---------- 팔 ---------- */
function armSpec(st,C){
  const o=st.outfit;
  if(o==='sports')return{type:'short'};
  if(o==='hanbok')return{type:'wide',col:C.top,line:C.tLine,cuff:'#f4f1e6',cuffLine:'#8a7a5c'};
  if(o==='merchant')return{type:'wide',col:C.top,line:C.tLine,cuff:luma(C.top)>150?darken(C.top,22):lighten(C.top,26),cuffLine:C.tLine};
  if(o==='uniform')return{type:'long',col:'#ffffff',line:C.wLine};
  if(o==='doctor')return{type:'long',col:'#ffffff',line:'#8fa0ba'};
  return{type:'long',col:C.top,line:C.tLine};
}
function armOne(P,C,st,sg){
  const spec=armSpec(st,C), o=st.outfit;
  const px=P.cx+sg*(P.wT/2-7), py=P.shoY+5;
  const rot=-sg*(spec.type==='short'?9:8);
  const w=P.armW, L=P.armLen, hw=w/2;
  const hand=crc(0,L+3,P.handR,C.skin,C.sLine);
  let body='';
  if(spec.type==='long'){
    body=hand+rrect(-hw,0,w,L,hw,spec.col,spec.line);
    if(o==='cardigan'||o==='casual'){
      body+=rrect(-hw+1.2,L-11,w-2.4,7,2,'rgba(15,23,42,.10)',null);
      body+=ln(-hw+3,L-10,-hw+3,L-5,'rgba(15,23,42,.16)',1.1)+ln(0,L-10,0,L-5,'rgba(15,23,42,.16)',1.1)+ln(hw-3,L-10,hw-3,L-5,'rgba(15,23,42,.16)',1.1);
    }else if(o==='captain'){
      body+=ln(-hw+2,L-13,hw-2,L-13,'#e7c356',2.6)+ln(-hw+2,L-7.5,hw-2,L-7.5,'#e7c356',2.6);
    }else{
      body+=ln(-hw+2,L-9.5,hw-2,L-9.5,spec.line,1.5,'opacity=".45"');
    }
  }else if(spec.type==='short'){
    body=hand+rrect(-hw+1,6,w-2,L-4,hw-1,C.skin,C.sLine);
    const sw2=hw+2.5;
    body+=pth(`M ${R(-sw2)} 30 L ${R(-sw2)} ${R(sw2*0.9)} A ${R(sw2)} ${R(sw2)} 0 0 1 ${R(sw2)} ${R(sw2*0.9)} L ${R(sw2)} 30 Z`,C.top,C.tLine);
    body+=ln(-sw2+1.8,25,sw2-1.8,25,'#ffffff',3,'opacity=".95"');
  }else{ /* wide 한복/상인 넓은 소매 */
    const fw=hw+7, cuffTop=L-12;
    const d=`M ${R(-hw)} 4 Q ${R(-hw)} 0 ${R(-hw+3)} 0 L ${R(hw-3)} 0 Q ${R(hw)} 0 ${R(hw)} 4 L ${R(fw)} ${cuffTop} Q ${R(fw+1)} ${L} ${R(fw-6)} ${L} L ${R(-fw+6)} ${L} Q ${R(-fw-1)} ${L} ${R(-fw)} ${cuffTop} Z`;
    body=hand+pth(d,spec.col,spec.line);
    body+=pth(`M ${R(-fw)} ${cuffTop} L ${R(fw)} ${cuffTop} Q ${R(fw+1)} ${L} ${R(fw-6)} ${L} L ${R(-fw+6)} ${L} Q ${R(-fw-1)} ${L} ${R(-fw)} ${cuffTop} Z`,spec.cuff,spec.cuffLine,2);
  }
  return `<g transform="translate(${R(px)} ${R(py)}) rotate(${rot})">${body}</g>`;
}
function armsG(P,C,st){return armOne(P,C,st,-1)+armOne(P,C,st,1)}

/* ---------- 카라(흰 셔츠 깃) ---------- */
function collarPair(P,C,o){
  o=o||{};
  const y=P.shoY-3+(o.drop||0), w=o.w||17, h=o.h||17;
  let s='';
  for(const sg of[-1,1]){
    const d=`M ${R(P.cx+sg*7)} ${y} L ${R(P.cx+sg*(7+w))} ${R(y+5.5)} Q ${R(P.cx+sg*(8+w))} ${R(y+8)} ${R(P.cx+sg*(4+w))} ${R(y+10.5)} L ${R(P.cx+sg*4)} ${R(y+h)} Z`;
    s+=pth(d,'#ffffff',C.wLine,2.2);
  }
  return s;
}

/* ---------- 명찰 ---------- */
function nameTag(P,C,name,o){
  o=o||{};
  const x=o.x!=null?o.x:P.cx+13, y=o.y!=null?o.y:P.shoY+46;
  const bg=o.bg||'#f7df85', bd=o.bd||'#c19f3a', tc=o.tc||'#6b5310';
  const w=27,h=13;
  let inner;
  const nm=(name||'').trim();
  if(nm&&nm.length<=4){
    inner=`<text x="${R(x+w/2)}" y="${R(y+h/2+2.7)}" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="7.4" font-weight="700" fill="${tc}">${esc(nm)}</text>`;
  }else{
    inner=ln(x+4.5,y+4.6,x+w-4.5,y+4.6,tc,1.6,'opacity=".55"')+ln(x+4.5,y+8.6,x+w-7.5,y+8.6,tc,1.6,'opacity=".4"');
  }
  return rrect(x,y,w,h,2.5,bg,bd,2)+inner;
}

      }

  s+=pth(`M ${R(cx-8)} 110 Q ${cx} 116.5 ${R(cx+8)} 110`,'none','#7c4238',2.6);
  const chR=st.gender==='girl'?8:7.2, chRy=st.gender==='girl'?5:4.4, chOp=st.gender==='girl'?.55:.45;
  s+=ell(cx-27,104,chR,chRy,C.blush,null,'',`opacity="${chOp}"`);
  s+=ell(cx+27,104,chR,chRy,C.blush,null,'',`opacity="${chOp}"`);
  return s;
}
function glassesG(st,P,C){
  if(st.glasses==='none')return '';
  const t=st.glasses, cx=P.cx;
  const col=t==='red'?'#c22a3a':(t==='silver'?'#97a2b4':'#1d3a6e');
  const gy=92;
  let s='';
  const lens=(ex)=>{
    if(t==='square')return rrect(ex-10.5,gy-9,21,18,4,'rgba(255,255,255,.14)',col,2.8);
    if(t==='horn')return rrect(ex-11,gy-8.5,22,17,6,'rgba(255,255,255,.14)',col,3.3);
    const r=t==='big'?13.5:11;
    return crc(ex,gy,r,'rgba(255,255,255,.14)',col,2.8);
  };
  for(const sg of[-1,1]){
    const ex=cx+sg*16;
    s+=lens(ex);
    s+=ln(ex-3,gy-4,ex+1,gy-6.5,'rgba(255,255,255,.55)',1.7);
  }
  if(t==='horn'){
    s+=ln(cx-27,gy-8.5,cx-5,gy-8.5,col,3.6);
    s+=ln(cx+5,gy-8.5,cx+27,gy-8.5,col,3.6);
  }
  s+=pth(`M ${R(cx-5.5)} ${gy-2} Q ${cx} ${gy-5} ${R(cx+5.5)} ${gy-2}`,'none',col,2.4);
  const lw=t==='big'?13.5:(t==='square'?10.5:11);
  s+=ln(cx-16-lw,gy-2,cx-P.faceRx+1,88,col,2.2);
  s+=ln(cx+16+lw,gy-2,cx+P.faceRx-1,88,col,2.2);
  return s;
}

/* ---------- 머리 전체 ---------- */
function headG(st,P,C){
  let s='';
  s+=earsG(P,C);
  s+=hairBackG(st,P,C);
  s+=faceG(P,C);
  s+=featuresG(st,P,C);
  s+=bangsG(st,P,C);
  s+=hairAccG(st,P,C);
  s+=glassesG(st,P,C);
  return s;
}

/* ============================================================
   전체 조립
   ============================================================ */
function buildSVG(st){
  UID=0;
  const P=makeP(st), C=makeC(st);
  P.torsoBot=torsoBotFor(st);
  const kind=bottomKind(st);
  const L=[];
  L.push(ell(P.cx,306,54,8,'rgba(66,44,28,.16)',null));
  L.push(hairBehind(st,P,C));
  if(kind==='shorts'||kind==='skirt')L.push(legsG(P,C,kind));
  L.push(shoesG(P,C,st));
  if(kind==='shorts')L.push(shortsG(P,C));
  else if(kind==='skirt')L.push(skirtG(P,C));
  else if(kind==='long')L.push(longPantsG(P,C,{col:st.outfit==='doctor'?'#ffffff':C.bot,lineC:st.outfit==='doctor'?'#9aa8bd':C.bLine}));
  else if(kind==='baji')L.push(bajiG(P,C));
  else if(kind==='chima')L.push(chimaG(P,C));
  L.push(neckG(P,C));
  L.push(armsG(P,C,st));
  L.push(torsoG(st,P,C));
  L.push(headG(st,P,C));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="260" height="320">${L.join('')}</svg>`;
}

const hairOptions={boy:[['basic','모범생 앞머리'],['short','짧은 스포츠 머리'],['part','가르마 머리'],['curly','삭발 머리'],['afro','아프로 폭탄머리']],girl:[['bob','단발'],['long','긴 생머리'],['pony','포니테일'],['pigtail','양갈래'],['half','반묶음']]};
function setHairOptions(){const g=$('gender').value;$('hairStyle').innerHTML=hairOptions[g].map(([v,t])=>`<option value="${v}">${t}</option>`).join('');$('hairStyle').value=g==='girl'?'bob':'basic'}
function getState(){
  return {
    gender:$('gender').value,
    bodyType:$('bodyType').value,
    hair:$('hairStyle').value,
    eye:$('eyeType').value,
    glasses:$('glassesType').value,
    outfit:$('outfit').value,
    bottom:$('bottomType').value,
    skin:normHex($('skinColor').value,'#ffd9bd'),
    hairC:normHex($('hairColor').value,'#191919'),
    top:normHex($('vestColor').value,'#08286f'),
    bot:normHex($('pantsColor').value,'#c8ad7e'),

  };
}
function syncLockedControls(){const isDoctor=$('outfit').value==='doctor';if(isDoctor){$('bottomType').value='pantsLook';$('pantsColor').value='#ffffff'}$('bottomType').disabled=isDoctor;$('pantsColor').disabled=isDoctor;if($('matchPantsToVest'))$('matchPantsToVest').disabled=isDoctor}
function readableTextColor(hex){hex=normHex(hex,'#ffffff');const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (r*299+g*587+b*114)/1000<135?'#ffffff':'#172033'}
function paintColorInputs(){['skinColor','hairColor','vestColor','pantsColor'].forEach(id=>{const input=$(id),color=normHex(input.value,'#ffffff');input.style.background=color;input.style.color=readableTextColor(color)})}
function apply(){
  syncLockedControls();
  paintColorInputs();
  if($('gender').value==='boy'&&$('bottomType').value==='skirtLook')$('bottomType').value='pantsLook';
  const st=getState();
  if(st.gender==='boy')st.bottom='pantsLook';
  $('charHost').innerHTML=buildSVG(st);
  scheduleUpdateCode();
}
/* ---------- 색상 팔레트 패널 ---------- */
const colorPalette=['#ffd9bd','#f1c6a8','#e6b08e','#ffe0c8','#191919','#3d2a22','#5a3828','#201611','#7a4d34','#08286f','#1f4f8f','#355c3a','#333333','#7b3f61','#d8d8d8','#e7d0a5','#6f4a2f','#8c3030','#1e3a8a','#4b5d36','#ffffff','#c8ad7e','#9b7a55','#52677a','#6d5b45','#334155','#d8b46a'];
let activeColorTarget=null;
function ensureColorPanel(){let panel=$('colorPanel');if(panel)return panel;panel=document.createElement('div');panel.id='colorPanel';panel.style.cssText='position:fixed;z-index:9999;width:286px;background:#fff;border:3px solid #26364d;border-radius:14px;padding:12px;box-shadow:0 16px 32px rgba(0,0,0,.22);display:none';panel.innerHTML='<div style="font-weight:900;margin-bottom:8px;">색상 선택</div><div id="colorPanelPalette" style="display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:10px;"></div><div style="display:flex;gap:8px;"><input type="text" id="colorPanelHex" maxlength="7" style="flex:1;min-width:0;"><button type="button" class="btn" onclick="applyPanelColor()" style="width:82px;padding:7px;">확인</button><button type="button" class="btn sub" onclick="closeColorPanel()" style="width:62px;padding:7px;">닫기</button></div>';document.body.appendChild(panel);const grid=$('colorPanelPalette');grid.innerHTML=colorPalette.map(c=>`<button type="button" onclick="selectPanelColor('${c}')" title="${c}" style="height:24px;border:2px solid #26364d;border-radius:6px;background:${c};cursor:pointer;"></button>`).join('');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeColorPanel()});return panel}
function openColorPanel(id){if($(id).disabled)return;activeColorTarget=id;const panel=ensureColorPanel(),input=$(id),rect=input.getBoundingClientRect();$('colorPanelHex').value=normHex(input.value,'#ffffff');panel.style.left=Math.min(rect.left,window.innerWidth-306)+'px';panel.style.top=Math.min(rect.bottom+6,window.innerHeight-190)+'px';panel.style.display='block';$('colorPanelHex').focus();$('colorPanelHex').select()}
function selectPanelColor(color){$('colorPanelHex').value=color;applyPanelColor()}
function applyPanelColor(){if(!activeColorTarget)return;$(activeColorTarget).value=normHex($('colorPanelHex').value,$(activeColorTarget).value);$('preset').value='custom';closeColorPanel();apply()}
function closeColorPanel(){const panel=$('colorPanel');if(panel)panel.style.display='none';activeColorTarget=null}
function copyVestToPants(){if($('pantsColor').disabled)return;$('pantsColor').value=normHex($('vestColor').value,'#08286f');$('preset').value='custom';apply()}
/* ---------- 프리셋·랜덤 ---------- */
function applyPreset(){const p=$('preset').value;if(p==='custom')return;const map={boy1:['boy','basic','round','none','normal','uniform','pantsLook','#3d2a22','#08286f','#c8ad7e'],boy2:['boy','short','sleepy','none','chubby','cardigan','pantsLook','#111111','#2f3640','#52677a'],boy3:['boy','part','sleepy','square','thin','uniform','pantsLook','#5a3828','#1f4f8f','#9b7a55'],girl1:['girl','bob','round','none','normal','uniform','skirtLook','#191919','#08286f','#c8ad7e'],girl2:['girl','long','down','silver','thin','cardigan','pantsLook','#4b2f23','#d8d8d8','#6d5b45'],girl3:['girl','pony','round','red','normal','uniform','skirtLook','#111111','#08286f','#c8ad7e'],merchant1:['boy','part','sleepy','round','normal','merchant','pantsLook','#241611','#8c3030','#5f4630'],doctor1:['boy','part','round','silver','thin','doctor','pantsLook','#2f2f2f','#ffffff','#334155'],captain1:['boy','short','round','none','normal','captain','pantsLook','#1f2937','#1e3a8a','#ffffff'],officer1:['boy','short','sleepy','none','normal','officer','pantsLook','#111111','#4b5d36','#334155'],hanbok1:['girl','long','down','none','normal','hanbok','skirtLook','#3d2a22','#b91c1c','#d8b46a'],suit1:['boy','part','sleepy','square','thin','suit','pantsLook','#2f2018','#111827','#475569']};const v=map[p];$('gender').value=v[0];setHairOptions();$('hairStyle').value=v[1];$('eyeType').value=v[2];$('glassesType').value=v[3];$('bodyType').value=v[4];$('outfit').value=v[5];$('bottomType').value=v[6];$('hairColor').value=v[7];$('vestColor').value=v[8];$('pantsColor').value=v[9];apply()}
function randomFrom(a){return a[Math.floor(Math.random()*a.length)]}
function randomCharacter(){const g=randomFrom(['boy','girl']);$('gender').value=g;setHairOptions();$('hairStyle').value=randomFrom(hairOptions[g].map(x=>x[0]));$('eyeType').value=randomFrom(['round','sleepy','up','down']);$('glassesType').value=randomFrom(['none','round','square','big','horn','red','silver']);$('bodyType').value=randomFrom(['thin','normal','chubby']);$('outfit').value=randomFrom(['uniform','cardigan','sports','casual','suit','merchant','hanbok','doctor','captain','officer']);$('bottomType').value=(g==='girl'?randomFrom(['pantsLook','skirtLook']):'pantsLook');$('skinColor').value=randomFrom(['#ffd9bd','#f1c6a8','#e6b08e','#ffe0c8']);$('hairColor').value=randomFrom(['#191919','#3d2a22','#5a3828','#201611','#7a4d34']);$('vestColor').value=randomFrom(['#08286f','#1f4f8f','#355c3a','#333333','#7b3f61','#d8d8d8','#e7d0a5','#6f4a2f','#8c3030','#1e3a8a','#4b5d36','#ffffff']);$('pantsColor').value=randomFrom(['#c8ad7e','#9b7a55','#52677a','#6d5b45','#334155','#ffffff','#d8b46a']);$('preset').value='custom';apply()}
/* ---------- 내보내기 ---------- */
function exportHTML(){
  const svg=buildSVG(getState());
  return `<!DOCTYPE html>\n<html lang="ko">\n<head>\n<meta charset="UTF-8">\n<title>캐릭터</title>\n<style>\nhtml,body{margin:0;padding:0;width:260px;height:320px;overflow:hidden;background:transparent}\nsvg{display:block;width:260px;height:320px}\n</style>\n</head>\n<body>\n${svg}\n</body>\n</html>`;
}
let updateCodeRequest=null;
function scheduleUpdateCode(){if(updateCodeRequest!==null)return;updateCodeRequest=requestAnimationFrame(()=>{updateCodeRequest=null;updateCode()})}
function updateCode(){$('codeOutput').value=exportHTML()}
function copyHTML(){
  updateCode();
  const textarea=$('codeOutput');
  textarea.style.display='block';
  textarea.focus();textarea.select();textarea.setSelectionRange(0,textarea.value.length);
  let success=false;
  try{success=document.execCommand('copy')}catch(e){success=false}
  if(success){showToast()}
  else if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(textarea.value).then(showToast).catch(()=>alert('복사에 실패했습니다. 코드 보기 후 직접 Ctrl+C로 복사해 주세요.'))}
  else{alert('복사에 실패했습니다. 코드 보기 후 직접 Ctrl+C로 복사해 주세요.')}
}
function safeFileName(name){const cleaned=name.trim().replace(/[\\/:*?"<>|]/g,'_');return cleaned||'캐릭터'}
function downloadHTML(){
  updateCode();
  const fileName=safeFileName($('studentName').value)+'.html';
  const blob=new Blob([$('codeOutput').value],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fileName;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('다운로드를 시작했습니다.');
}
function toggleCode(){const t=$('codeOutput');if(t.style.display==='block'){t.style.display='none'}else{updateCode();t.style.display='block';t.focus()}}
function showToast(message){const t=$('toast');t.textContent=message||'복사되었습니다.';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}
/* ---------- 이벤트 ---------- */
['gender','hairStyle','eyeType','glassesType','bodyType','outfit','bottomType'].forEach(id=>$(id).addEventListener('change',()=>{if(id==='gender'){setHairOptions();if($('gender').value==='boy')$('bottomType').value='pantsLook'}$('preset').value='custom';apply()}));
['skinColor','hairColor','vestColor','pantsColor'].forEach(id=>$(id).addEventListener('change',()=>{$('preset').value='custom';apply()}));
$('studentName').addEventListener('input',()=>{apply()});
$('preset').addEventListener('change',applyPreset);
setHairOptions();apply();
