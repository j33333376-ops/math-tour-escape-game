<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소래포구 MATHTOUR - A04</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a120c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Noto Serif KR', serif;
      color: #f4ecd8;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #2c2019;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      border: 2px solid #4a3b32;
    }

    /* 배경 이미지 */
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* 상단 스테이지 표시바 (중앙 정렬 및 크기 확대) */
    #stage-bar {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: linear-gradient(135deg, #2c2019, #4a3b32);
      border: 2px solid #b87333;
      padding: 10px 28px;
      border-radius: 6px;
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 18px;
      font-weight: bold;
      color: #f4ecd8;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.7), inset 0 0 8px rgba(184,115,51,0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    #stage-bar::before {
      content: '⚙';
      color: #b87333;
      font-size: 20px;
    }

    /* 캐릭터 영역 */
    #characters-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .char-wrapper {
      position: absolute;
      bottom: 80px;
      width: 260px;
      height: 320px;
      overflow: visible;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    .char-wrapper iframe {
      border: 0;
      width: 260px;
      height: 320px;
      transform-origin: bottom left;
      pointer-events: none;
    }

    /* 대화창 UI 컨테이너 */
    #dialogue-box {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 140px;
      background: rgba(44, 32, 25, 0.92);
      border: 3px solid #b87333;
      border-radius: 8px;
      padding: 16px 24px;
      z-index: 10;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.7), inset 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    #dialogue-box::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border: 1px solid #4a3b32;
      border-radius: 10px;
      pointer-events: none;
    }

    #speaker-tag {
      display: inline-block;
      align-self: flex-start;
      background: #b87333;
      color: #1a120c;
      font-family: 'Gowun Dodum', sans-serif;
      font-weight: bold;
      font-size: 16px;
      padding: 3px 14px;
      border-radius: 3px;
      border: 1px solid #4a3b32;
      margin-bottom: 10px;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.4);
    }

    #dialogue-text {
      font-family: 'Noto Serif KR', serif;
      font-size: 16.5px;
      line-height: 1.5;
      color: #f4ecd8;
      word-break: keep-all;
    }

    #click-prompt {
      position: absolute;
      bottom: 10px;
      right: 20px;
      font-size: 12px;
      color: #b87333;
      font-family: 'Gowun Dodum', sans-serif;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 공통 네비게이션 버튼 */
    .btn-nav {
      position: absolute;
      z-index: 15;
      background-color: #b87333;
      color: #f4ecd8;
      border: 2px solid #4a3b32;
      padding: 10px 22px;
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 3px 3px 6px rgba(0,0,0,0.6), inset 1px 1px 2px rgba(255,255,255,0.3);
      transition: all 0.15s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-nav:hover {
      background-color: #d4833b;
      transform: translateY(-2px);
      box-shadow: 4px 5px 8px rgba(0,0,0,0.7);
    }

    .btn-nav:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    /* 건너뛰기 버튼: 대화 상자 우측 상단 바로 위 배치 */
    #btn-skip {
      top: -45px;
      right: 0px;
      padding: 6px 16px;
      font-size: 13.5px;
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
    }

    #btn-next {
      right: 20px;
      bottom: 20px;
    }

    /* 대화 종료 후 나타나는 버튼 컨트롤 */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 배경 이미지 -->
  <img src="소래포구주차장.png" alt="소래포구 주차장 배경" class="bg-img">

  <!-- 스테이지 상단바 (크기 확대 및 중앙 정렬) -->
  <div id="stage-bar">소래포구 주차장 - 주차비 계산</div>

  <!-- 캐릭터 레이어 (좌: 서연, 민우 / 우: 선생님) -->
  <div id="characters-layer">
    <!-- 서연 (학생 A: 기존 60px에서 오른쪽으로 이동하여 170px 설정) -->
    <div class="char-wrapper inactive" id="char-서연" style="left: 170px;">
      <iframe src="등장인물_서연.html" scrolling="no"></iframe>
    </div>
    
    <!-- 민우 (학생 B) -->
    <div class="char-wrapper inactive" id="char-민우" style="left: 360px;">
      <iframe src="등장인물_민우.html" scrolling="no"></iframe>
    </div>

    <!-- 선생님 (좌우 반전) -->
    <div class="char-wrapper inactive" id="char-선생님" style="right: 70px;">
      <iframe src="등장인물_선생님.html" scrolling="no" style="transform: scaleX(-1); transform-origin: center;"></iframe>
    </div>
  </div>

  <!-- 대화창 UI -->
  <div id="dialogue-box" onclick="advanceDialogue()">
    <!-- 건너뛰기 버튼 (대화상자 상단 우측에 배치) -->
    <button id="btn-skip" class="btn-nav" onclick="event.stopPropagation(); skipDialogue();">건너뛰기 ≫</button>

    <div id="speaker-tag">선생님</div>
    <div id="dialogue-text">대사가 로딩 중입니다...</div>
    <div id="click-prompt">클릭하여 계속 ▼</div>
  </div>

  <!-- 이전 / 다음 네비게이션 버튼 -->
  <button id="btn-prev" class="btn-nav hidden" onclick="navigate('A03.html')">≪ 이전</button>
  <button id="btn-next" class="btn-nav hidden" onclick="navigate('A05.html')">다음 ≫</button>
</div>

<script>
  // 대화 스크립트 데이터
  const dialogues = [
    {
      speaker: "선생님",
      text: "자, 시장 구경하면서 새우도 잘 샀고! 다음 장소는 차 두고 걸어갈 거니까 주차비 계산부터 해볼까? 아까 시장에서 장볼 때 너희 둘이 금액 착착 맞추는 거 보고 선생님이 속으로 얼마나 뿌듯했는지 몰라.",
      target: "char-선생님"
    },
    {
      speaker: "서연",
      text: "헤헤, 시장 할머니가 덤으로 더 주신 것까지 합산해서 계산했죠! 그런데 주차비 계산은 또 다른 영역인데요?",
      target: "char-서연"
    },
    {
      speaker: "선생님",
      text: "요금표는 아까 봤지? 기본 30분에 1,000원, 추가 15분당 500원, 일 최대 요금은 20,000원이야. 우리가 다음 장소까지 들렀다 차를 빼면 총 7시간 30분 정도 주차하는 셈인데... 과연 주차비가 얼마나 나올까?",
      target: "char-선생님"
    },
    {
      speaker: "민우",
      text: "7시간 30분이요?! 으아, 분으로 바꾸면 몇 분이지... 일단 기본 30분을 빼고 남은 시간을 15분으로 나눠야 하나?",
      target: "char-민우"
    },
    {
      speaker: "서연",
      text: "잠깐만, 추가 15분당 500원이면 1시간에 추가 요금이 얼마지? 500원에 4를 곱하면 1시간에 2,000원인데... 7시간이면... 어? 그런데 상한선이 있지 않았나?",
      target: "char-서연"
    },
    {
      speaker: "민우",
      text: "맞다! 일 최대 요금이 20,000원이라고 했잖아! 7시간 30분이면 일단 그냥 계산했을 때 10,000원이 넘는지 안 넘는지부터 확인해 봐야 하는 거 아니야?",
      target: "char-민우"
    },
    {
      speaker: "서연",
      text: "그러네! 계산을 끝까지 다 해보고 10,000원이랑 비교해야 할까, 아니면 중간에 계산을 멈춰도 될까?",
      target: "char-서연"
    }
  ];

  let currentIndex = 0;

  // 대화 진행 함수
  function advanceDialogue() {
    if (currentIndex < dialogues.length) {
      const current = dialogues[currentIndex];
      
      // 화자 이름 및 대사 업데이트
      document.getElementById("speaker-tag").innerText = current.speaker;
      document.getElementById("dialogue-text").innerText = current.text;

      // 캐릭터 하이라이트 처리 (.inactive 토글)
      const wrappers = document.querySelectorAll('.char-wrapper');
      wrappers.forEach(wrapper => {
        if (wrapper.id === current.target) {
          wrapper.classList.remove('inactive');
        } else {
          wrapper.classList.add('inactive');
        }
      });

      currentIndex++;
    } else {
      endDialogue();
    }
  }

  // 대화 종료 처리
  function endDialogue() {
    // 대화창 숨기기
    document.getElementById("dialogue-box").style.display = "none";

    // 모든 캐릭터 원래 밝기로 복구
    const wrappers = document.querySelectorAll('.char-wrapper');
    wrappers.forEach(wrapper => {
      wrapper.classList.remove('inactive');
    });

    // 이전 / 다음 네비게이션 버튼 표시
    document.getElementById("btn-prev").classList.remove("hidden");
    document.getElementById("btn-next").classList.remove("hidden");
  }

  // 스킵 버튼 처리
  function skipDialogue() {
    endDialogue();
  }

  // 페이지 이동 함수
  function navigate(url) {
    if (url) {
      window.location.href = url;
    }
  }

  // 초기 실행
  window.onload = function() {
    advanceDialogue();
  };
</script>

</body>
</html>
