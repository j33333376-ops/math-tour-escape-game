<!-- 원본 크기: 380x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소래포구 풍차</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  svg.pch-svg { display:block; width:100%; height:auto; }
  .pch-blades { transform-origin: 190px 168px; animation: pch-turn 18s linear infinite; }
  @keyframes pch-turn { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  .pch-cloud { animation: pch-float 14s ease-in-out infinite; }
  @keyframes pch-float { 0%,100% { transform: translateX(0);} 50% { transform: translateX(14px);} }
</style>
</head>
<body>
<svg class="pch-svg" viewBox="0 0 380 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소래포구 네덜란드식 하얀 풍차, 붉은 지붕과 회전하는 날개">
<title>소래포구 풍차</title>
<desc>소래습지생태공원의 네덜란드식 풍차. 붉은 원뿔 지붕과 격자 날개, 뒤편의 염전 풍경.</desc>
<defs>
  <linearGradient id="pch-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe1f2"/>
    <stop offset="0.7" stop-color="#e6f2f7"/>
    <stop offset="1" stop-color="#f6f1e2"/>
  </linearGradient>
  <linearGradient id="pch-body" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e8e4d8"/>
    <stop offset="0.45" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#cfcabb"/>
  </linearGradient>
  <linearGradient id="pch-roof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d1483a"/>
    <stop offset="1" stop-color="#8e2a20"/>
  </linearGradient>
  <linearGradient id="pch-blade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f4ecd8"/>
    <stop offset="1" stop-color="#c9bb96"/>
  </linearGradient>
  <linearGradient id="pch-pond" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c7dfe2"/>
    <stop offset="1" stop-color="#a7c8cd"/>
  </linearGradient>
  <linearGradient id="pch-ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b9c98f"/>
    <stop offset="1" stop-color="#93a86a"/>
  </linearGradient>
</defs>

<!-- 하늘 -->
<rect x="0" y="0" width="380" height="470" fill="url(#pch-sky)"/>
<g class="pch-cloud" fill="#ffffff" opacity="0.85">
  <ellipse cx="66" cy="70" rx="40" ry="14"/>
  <ellipse cx="96" cy="64" rx="26" ry="16"/>
  <ellipse cx="40" cy="76" rx="22" ry="10"/>
  <ellipse cx="316" cy="118" rx="34" ry="12"/>
  <ellipse cx="342" cy="112" rx="22" ry="14"/>
</g>
<g fill="none" stroke="#6d7c84" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
  <path d="M52,160 q8,-7 16,0 q8,-7 16,0"/>
  <path d="M300,196 q7,-6 14,0 q7,-6 14,0"/>
</g>

<!-- 염전(원경) -->
<rect x="0" y="452" width="380" height="60" fill="url(#pch-pond)"/>
<g stroke="#8fb0b4" stroke-width="2" opacity="0.8">
  <line x1="0" y1="470" x2="380" y2="470"/>
  <line x1="0" y1="492" x2="380" y2="492"/>
  <line x1="60" y1="452" x2="48" y2="512"/>

  <line x1="240" y1="452" x2="248" y2="512"/>

  <path d="M330,572 C336,560 332,552 340,542"/>

  <circle cx="190" cy="168" r="11" fill="#6e685c" stroke="#4a4638" stroke-width="1.5"/>
