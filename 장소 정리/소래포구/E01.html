<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소래포구 MATHTOUR - STAGE 1</title>
    <style>
        /* 폰트 로드 */
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 초기화 및 기본 배경(게임 컨테이너 밖) */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111; /* 게임 바깥 여백은 어둡게 */
        }

        /* [공통 규칙] 16:9 화면 비율 유지 및 스팀펑크 베이스 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #2c2019; /* 기본 다크 브라운 */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        /* 전체 배경 이미지 (규칙에 따라 지정된 파일 사용) */
        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 상단 스테이지 표시바 - 톱니바퀴 장식 명패 느낌 */
        .top-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #b87333, #8a5322); /* 브라스 골드 */
            border: 3px solid #4a3b32;
            color: #f4ecd8;
            padding: 8px 40px;
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: inset 0px 0px 5px rgba(255,255,255,0.3), 3px 3px 8px rgba(0,0,0,0.7);
            border-radius: 5px;
            z-index: 10;
        }

        /* [유형1] 상황 설명 박스 - 오래된 설계도 / 가죽 느낌 */
        .situation-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            background-color: rgba(44, 32, 25, 0.9); /* 다크 브라운 투명도 */
            border: 4px solid #b87333; /* 브라스 골드 테두리 */
            color: #f4ecd8; /* 빛바랜 양피지색 */
            padding: 30px 40px;
            font-family: 'Noto Serif KR', serif;
            font-size: 1.15rem;
            line-height: 1.8;
            text-align: center;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 5px 5px 15px rgba(0,0,0,0.7);
            z-index: 15;
            backdrop-filter: blur(3px);
        }

        .situation-box h2 {
            font-family: 'Gowun Dodum', sans-serif;
            color: #b87333;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-shadow: 1px 1px 2px #000;
        }

        .situation-box p {
            margin: 10px 0;
        }

        /* 공통 이동 버튼 - 황동 금속판 느낌, 리벳 디테일 */
        .btn-nav {
            position: absolute;
            background: linear-gradient(135deg, #b87333, #7a481e);
            color: #f4ecd8;
            border: 2px solid #4a3b32;
            padding: 10px 30px;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            border-radius: 6px;
            box-shadow: 
                inset 2px 2px 2px rgba(255,255,255,0.2), 
                inset -2px -2px 4px rgba(0,0,0,0.5), 
                4px 4px 6px rgba(0,0,0,0.6);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            transition: all 0.2s ease;
        }

        .btn-nav::before, .btn-nav::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #4a3b32;
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8);
        }
        .btn-nav::before { top: 6px; left: 6px; }
        .btn-nav::after { bottom: 6px; right: 6px; }

        .btn-nav:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }
        .btn-nav:active {
            transform: translateY(1px);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
        }

        #btn-prev { left: 20px; bottom: 20px; }
        #btn-next { right: 20px; bottom: 20px; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 1. 배경 이미지 (z-index: 0) -->
        <img class="bg-image" src="소래포구 풍차.png" alt="소래습지생태공원 풍차 배경">

        <!-- 2. 상단 스테이지 표시바 -->
        <div class="top-bar">⚙ 소래습지생태공원 ⚙</div>

        <!-- 3. 에셋: 풍차 (z-index: 1, 배경과 인물 사이) -->
        <!-- 원본 크기를 알 수 없는 경우를 대비해 500x750 비율로 가정하고 스케일 조정 (s=0.7) -->
        <div style="position:absolute; left:calc(50% - 175px); bottom:150px; width:350px; height:525px; overflow:hidden; z-index: 1;">
            <iframe src="소래포구_풍차.html" scrolling="no" style="border:0; width:500px; height:750px; transform:scale(0.7); transform-origin:top left; pointer-events:none;"></iframe>
        </div>

        <!-- 4. 등장 인물: 민우 (좌측 배치, z-index: 3) -->
        <!-- 원본 260x320 고정, s=1 -->
        <div class="char-wrapper" id="char-민우" style="position:absolute; left:40px; bottom:20px; width:260px; height:320px; overflow:visible; z-index: 3;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 5. 등장 인물: 서연 (우측 배치, 마주보게 좌우 반전, z-index: 3) -->
        <!-- 반전(scaleX(-1)) 시 축 기준점이 달라지는 것을 막기 위해 감싸는 div 안에서 조정 -->
        <div class="char-wrapper" id="char-서연" style="position:absolute; right:40px; bottom:20px; width:260px; height:320px; overflow:visible; z-index: 3;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom center; pointer-events:none;"></iframe>
        </div>

        <!-- 6. 상황 설명 박스 (유형 1, z-index: 15) -->
        <div class="situation-box">
            <h2>[ 생태공원과 붉은 태엽장치 ]</h2>
            <p>과거 거대한 염전이었던 소래습지생태공원.<br>지금은 갯벌과 억새초지가 어우러진 생태의 보고가 되었다.</p>
            <p>공원 한가운데 서 있는 세 개의 붉은 풍차는<br>마치 기계도시를 움직이는 거대한 톱니바퀴처럼 조용히 바람을 맞이하고 있다.</p>
            <p>민우와 서연은 쉼 없이 돌아가는 풍차의 움직임 속에서<br>숨겨진 수학적 규칙과 단서를 찾아내기 위해 걸음을 멈춘다.</p>
        </div>

        <!-- 7. 네비게이션 버튼 (z-index: 20) -->
        <button id="btn-prev" class="btn-nav" onclick="window.location.href='index.html'">이전</button>
        <button id="btn-next" class="btn-nav" onclick="window.location.href='E02.html'">다음</button>
    </div>

</body>
</html>
