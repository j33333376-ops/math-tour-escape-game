<!-- 원본 크기: 1000x460 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소래 염전 (소금밭과 수차)</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  svg.yj1-svg { display:block; width:100%; height:auto; }
  .yj1-spoke { transform-origin: 860px 250px; animation: yj1-spin 22s linear infinite; }
  @keyframes yj1-spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
</style>
</head>
<body>
<svg class="yj1-svg" viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소래 염전의 소금밭과 나무 수차">
<title>소래 염전</title>
<defs>
  <linearGradient id="yj1-salt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#e2ded0"/>
  </linearGradient>
  <linearGradient id="yj1-brine" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d7e6de"/>
    <stop offset="1" stop-color="#b9d0c4"/>
  </linearGradient>
  <linearGradient id="yj1-mud" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c9ac78"/>
    <stop offset="1" stop-color="#ab8a58"/>
  </linearGradient>
  <linearGradient id="yj1-wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a97c48"/>
    <stop offset="1" stop-color="#7a5630"/>
  </linearGradient>
</defs>

<!-- 소금밭 전체 테두리(둑) -->
<rect x="16" y="136" width="656" height="292" fill="url(#yj1-wood)"/>

<!-- 소금밭 그리드 (6열 x 4행) -->
<g>
  <!-- row1 -->
  <rect x="24" y="146" width="102" height="64" fill="url(#yj1-brine)"/>
  <rect x="132" y="146" width="102" height="64" fill="url(#yj1-mud)"/>
  <rect x="240" y="146" width="102" height="64" fill="url(#yj1-salt)"/>
  <rect x="348" y="146" width="102" height="64" fill="url(#yj1-brine)"/>
  <rect x="456" y="146" width="102" height="64" fill="url(#yj1-mud)"/>
  <rect x="564" y="146" width="102" height="64" fill="url(#yj1-salt)"/>
  <!-- row2 -->
  <rect x="24" y="216" width="102" height="64" fill="url(#yj1-mud)"/>
  <rect x="132" y="216" width="102" height="64" fill="url(#yj1-salt)"/>
  <rect x="240" y="216" width="102" height="64" fill="url(#yj1-brine)"/>
  <rect x="348" y="216" width="102" height="64" fill="url(#yj1-mud)"/>
  <rect x="456" y="216" width="102" height="64" fill="url(#yj1-salt)"/>
  <rect x="564" y="216" width="102" height="64" fill="url(#yj1-brine)"/>
  <!-- row3 -->
  <rect x="24" y="286" width="102" height="64" fill="url(#yj1-salt)"/>
  <rect x="132" y="286" width="102" height="64" fill="url(#yj1-brine)"/>
  <rect x="240" y="286" width="102" height="64" fill="url(#yj1-mud)"/>
  <rect x="348" y="286" width="102" height="64" fill="url(#yj1-salt)"/>
  <rect x="456" y="286" width="102" height="64" fill="url(#yj1-brine)"/>
  <rect x="564" y="286" width="102" height="64" fill="url(#yj1-mud)"/>
  <!-- row4 -->
  <rect x="24" y="356" width="102" height="64" fill="url(#yj1-brine)"/>
  <rect x="132" y="356" width="102" height="64" fill="url(#yj1-mud)"/>
  <rect x="240" y="356" width="102" height="64" fill="url(#yj1-salt)"/>
  <rect x="348" y="356" width="102" height="64" fill="url(#yj1-brine)"/>
  <rect x="456" y="356" width="102" height="64" fill="url(#yj1-salt)"/>
  <rect x="564" y="356" width="102" height="64" fill="url(#yj1-mud)"/>

  <!-- 나무 둑 세로선 -->
  <g fill="url(#yj1-wood)">
    <rect x="122" y="146" width="10" height="274"/>
    <rect x="230" y="146" width="10" height="274"/>
    <rect x="338" y="146" width="10" height="274"/>
    <rect x="446" y="146" width="10" height="274"/>
    <rect x="554" y="146" width="10" height="274"/>
  </g>
  <!-- 나무 둑 가로선 -->
  <g fill="url(#yj1-wood)">
    <rect x="24" y="206" width="642" height="10"/>
    <rect x="24" y="276" width="642" height="10"/>
    <rect x="24" y="346" width="642" height="10"/>
  </g>
</g>

<!-- 소금 결정 반짝임(하이라이트) -->
<g fill="#fff" opacity="0.55">
  <circle cx="270" cy="165" r="2.2"/><circle cx="290" cy="180" r="1.8"/><circle cx="255" cy="190" r="1.6"/>
  <circle cx="160" cy="240" r="2"/><circle cx="180" cy="255" r="1.7"/>
  <circle cx="600" cy="165" r="2"/><circle cx="618" cy="182" r="1.7"/>
  <circle cx="60" cy="310" r="2"/><circle cx="80" cy="320" r="1.6"/>
  <circle cx="370" cy="300" r="2"/><circle cx="390" cy="315" r="1.7"/>
  <circle cx="270" cy="375" r="2"/><circle cx="255" cy="390" r="1.6"/>
</g>

<!-- 소금 더미 (하얀 원뿔) -->
<g>
  <g transform="translate(280,178)">
    <polygon points="0,-26 24,14 -24,14" fill="url(#yj1-salt)" stroke="#d8d2c0" stroke-width="1"/>
    <polygon points="0,-26 24,14 4,14" fill="#d8d2c0" opacity="0.6"/>
    <ellipse cx="0" cy="15" rx="26" ry="6" fill="#ffffff"/>
  </g>
  <g transform="translate(175,250)">
    <polygon points="0,-20 19,11 -19,11" fill="url(#yj1-salt)" stroke="#d8d2c0" stroke-width="1"/>
    <polygon points="0,-20 19,11 3,11" fill="#d8d2c0" opacity="0.6"/>
    <ellipse cx="0" cy="12" rx="20" ry="5" fill="#ffffff"/>
  </g>
  <g transform="translate(608,178)">
    <polygon points="0,-22 20,12 -20,12" fill="url(#yj1-salt)" stroke="#d8d2c0" stroke-width="1"/>
    <polygon points="0,-22 20,12 3,12" fill="#d8d2c0" opacity="0.6"/>
    <ellipse cx="0" cy="13" rx="21" ry="5" fill="#ffffff"/>
  </g>
  <g transform="translate(280,388)">
    <polygon points="0,-18 17,10 -17,10" fill="url(#yj1-salt)" stroke="#d8d2c0" stroke-width="1"/>
    <polygon points="0,-18 17,10 3,10" fill="#d8d2c0" opacity="0.6"/>
    <ellipse cx="0" cy="11" rx="18" ry="4.5" fill="#ffffff"/>
  </g>
</g>

<!-- ============ 나무 수차(무자위) ============ -->
<g transform="translate(770,0)">
  <!-- 물 수로 -->
  <rect x="-30" y="392" width="220" height="34" fill="url(#yj1-brine)"/>
  <rect x="-30" y="392" width="220" height="6" fill="#fff" opacity="0.4"/>

  <!-- 지지 기둥 -->
  <rect x="70" y="200" width="14" height="200" fill="url(#yj1-wood)"/>
  <rect x="130" y="200" width="14" height="200" fill="url(#yj1-wood)"/>
  <rect x="60" y="192" width="94" height="14" fill="url(#yj1-wood)"/>
  <rect x="66" y="386" width="82" height="12" fill="url(#yj1-wood)"/>

  <!-- 수차 바퀴 -->
  <g class="yj1-spoke">
    <circle cx="90" cy="250" r="72" fill="none" stroke="url(#yj1-wood)" stroke-width="10"/>
    <g stroke="#7a5630" stroke-width="7">
      <line x1="90" y1="180" x2="90" y2="320"/>
      <line x1="20" y1="250" x2="160" y2="250"/>
      <line x1="40" y1="200" x2="140" y2="300"/>
      <line x1="40" y1="300" x2="140" y2="200"/>
    </g>
    <!-- 물받이 스쿱 -->
    <g fill="#8a6636" stroke="#5a3f22" stroke-width="1.5">
      <rect x="82" y="176" width="16" height="26" rx="3" transform="rotate(0 90 250)"/>
      <rect x="82" y="176" width="16" height="26" rx="3" transform="rotate(45 90 250)"/>
      <rect x="82" y="176" width="16" height="26" rx="3" transform="rotate(90 90 250)"/>
      <rect x="82" y="176" width="16" height="26" rx="3" transform="rotate(135 90 250)"/>
      <rect x="82" y="176" width="16" height="26" rx="3" transform="rotate(180 90 250)"/>
      <rect x="82" y="176" width="16" height="26" rx="3" transform="rotate(225 90 250)"/>
      <rect x="82" y="176" width="16" height="26" rx="3" transform="rotate(270 90 250)"/>
      <rect x="82" y="176" width="16" height="26" rx="3" transform="rotate(315 90 250)"/>
    </g>
    <circle cx="90" cy="250" r="12" fill="#5a3f22"/>
  </g>
  <circle cx="90" cy="250" r="6" fill="#3a2814"/>
</g>

</svg>
</body>
</html>
