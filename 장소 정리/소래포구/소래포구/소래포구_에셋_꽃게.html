<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꽃게</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .skk-svg { display:block; width:100%; height:auto; }
  .skk-claw-l { animation: skk-cl 3.4s ease-in-out infinite; transform-origin: 200px 330px; }
  .skk-claw-r { animation: skk-cr 3.4s ease-in-out infinite; transform-origin: 400px 330px; }
  @keyframes skk-cl { 0%,100% { transform: rotate(0deg);} 50% { transform: rotate(-9deg);} }
  @keyframes skk-cr { 0%,100% { transform: rotate(0deg);} 50% { transform: rotate(9deg);} }
  .skk-leg { animation: skk-leg 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 50%; }
  @keyframes skk-leg { 0%,100% { transform: rotate(-2.5deg);} 50% { transform: rotate(2.5deg);} }
</style>
</head>
<body>

</defs>
