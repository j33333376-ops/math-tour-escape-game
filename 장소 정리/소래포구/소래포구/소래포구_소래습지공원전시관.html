<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>소래포구 - 소래습지공원 전시관</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .we-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="we-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소래습지공원 전시관">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c5e3f0"/><stop offset="100%" stop-color="#eef7f4"/></linearGradient>
    <linearGradient id="wallw" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8dcc2"/><stop offset="100%" stop-color="#d3c39e"/></linearGradient>
    <linearGradient id="roofw" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8a6a48"/><stop offset="100%" stop-color="#6b4e30"/></linearGradient>
    <linearGradient id="marsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a8c9a0"/><stop offset="100%" stop-color="#8db386"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="480" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.6"><ellipse cx="250" cy="72" rx="72" ry="22"/><ellipse cx="950" cy="60" rx="84" ry="24"/></g>
  <!-- 철새 -->
  <g stroke="#5b7386" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300,120 q10,-10 20,0 q10,-10 20,0"/><path d="M360,100 q9,-9 18,0 q9,-9 18,0"/><path d="M880,110 q10,-10 20,0 q10,-10 20,0"/>
  </g>
  <!-- 원경 풍차 2기 -->
  <g opacity="0.75">
    <g transform="translate(150,340)">
      <polygon points="-16,120 16,120 9,0 -9,0" fill="#c9563e"/>
      <rect x="-20" y="118" width="40" height="8" fill="#8a6a48"/>
      <g stroke="#5f4a35" stroke-width="6" stroke-linecap="round"><line x1="0" y1="0" x2="0" y2="-52"/><line x1="0" y1="0" x2="46" y2="26"/><line x1="0" y1="0" x2="-46" y2="26"/><line x1="0" y1="0" x2="0" y2="52" opacity="0"/></g>
      <g fill="#f2ead3" stroke="#5f4a35" stroke-width="2"><polygon points="0,-6 0,-50 14,-44 14,-12"/><polygon points="5,3 43,25 40,39 8,16"/><polygon points="-5,3 -43,25 -40,39 -8,16"/></g>
      <circle r="7" fill="#3f3226"/>
    </g>
    <g transform="translate(1060,352)" opacity="0.85">
      <polygon points="-13,104 13,104 7,0 -7,0" fill="#c9563e"/>
      <g stroke="#5f4a35" stroke-width="5" stroke-linecap="round"><line x1="0" y1="0" x2="0" y2="-42"/><line x1="0" y1="0" x2="38" y2="20"/><line x1="0" y1="0" x2="-38" y2="20"/></g>
      <circle r="6" fill="#3f3226"/>
    </g>
  </g>

  <!-- 습지 -->
  <rect x="0" y="460" width="1200" height="260" fill="url(#marsh)"/>
  <ellipse cx="230" cy="580" rx="190" ry="46" fill="#7fb7c9"/>
  <ellipse cx="1000" cy="620" rx="170" ry="42" fill="#7fb7c9"/>
  <g stroke="#e7f4f8" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M160,578 q18,-7 36,0 q18,7 36,0"/><path d="M950,616 q18,-7 36,0 q18,7 36,0"/>
  </g>

  <!-- 전시관 건물 (소금창고형 목조) -->
  <g transform="translate(600,470)">
    <!-- 본체 -->
    <rect x="-260" y="-130" width="520" height="130" fill="url(#wallw)" stroke="#9c8a66" stroke-width="3"/>
    <!-- 板 무늬 -->
    <g stroke="#c0ae87" stroke-width="2" opacity="0.8">
      <line x1="-260" y1="-104" x2="260" y2="-104"/><line x1="-260" y1="-78" x2="260" y2="-78"/><line x1="-260" y1="-52" x2="260" y2="-52"/><line x1="-260" y1="-26" x2="260" y2="-26"/>
    </g>
    <!-- 큰 박공지붕 -->
    <polygon points="-292,-130 0,-238 292,-130" fill="url(#roofw)" stroke="#4d3826" stroke-width="4"/>
    <rect x="-14" y="-262" width="28" height="30" fill="#6b4e30" stroke="#4d3826" stroke-width="2"/>
    <!-- 창 -->
    <g fill="#bfe0ea" stroke="#7a664a" stroke-width="2.5">
      <rect x="-224" y="-96" width="66" height="52" rx="4"/><rect x="158" y="-96" width="66" height="52" rx="4"/>
    </g>
    <line x1="-191" y1="-96" x2="-191" y2="-44" stroke="#7a664a" stroke-width="2"/>
    <line x1="191" y1="-96" x2="191" y2="-44" stroke="#7a664a" stroke-width="2"/>
    <!-- 입구 -->
    <rect x="-52" y="-92" width="104" height="92" fill="#5a4630" stroke="#3f3020" stroke-width="3"/>
    <line x1="0" y1="-92" x2="0" y2="0" stroke="#8a7250" stroke-width="3"/>
    <circle cx="-12" cy="-44" r="4" fill="#c9a24a"/><circle cx="12" cy="-44" r="4" fill="#c9a24a"/>
    <!-- 지붕 위 간판 -->
    <g transform="translate(0,-286)">
      <rect x="-170" y="-24" width="340" height="40" rx="9" fill="#2f5d4e"/>
      <text x="0" y="4" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#ffffff">소래습지공원 전시관</text>
    </g>
  </g>

  <!-- 나무데크 산책로 -->
  <g>
    <polygon points="480,720 545,470 655,470 720,720" fill="#b98d5e"/>
    <g stroke="#8a6540" stroke-width="4">
      <line x1="500" y1="650" x2="700" y2="650"/><line x1="512" y1="600" x2="688" y2="600"/><line x1="522" y1="556" x2="678" y2="556"/><line x1="531" y1="518" x2="669" y2="518"/>
    </g>
    <line x1="480" y1="720" x2="545" y2="470" stroke="#7a5636" stroke-width="5"/>
    <line x1="720" y1="720" x2="655" y2="470" stroke="#7a5636" stroke-width="5"/>
  </g>

  <!-- 갈대 -->
  <g stroke="#a68a4e" stroke-width="4" fill="none" stroke-linecap="round">
    <g transform="translate(90,700)"><path d="M0,0 q-4,-46 -12,-78"/><path d="M18,0 q0,-52 6,-84"/><path d="M36,0 q6,-44 16,-72"/></g>
    <g transform="translate(360,706)"><path d="M0,0 q-4,-42 -10,-70"/><path d="M16,0 q2,-48 8,-78"/></g>
    <g transform="translate(830,700)"><path d="M0,0 q-4,-46 -12,-76"/><path d="M18,0 q0,-52 6,-82"/><path d="M36,0 q6,-42 14,-68"/></g>
    <g transform="translate(1130,706)"><path d="M0,0 q-4,-42 -10,-72"/><path d="M16,0 q2,-46 8,-76"/></g>
  </g>
  <g fill="#c7a55e">
    <ellipse cx="76" cy="614" rx="7" ry="18" transform="rotate(-12 76 614)"/><ellipse cx="115" cy="608" rx="7" ry="18" transform="rotate(8 115 608)"/><ellipse cx="143" cy="620" rx="7" ry="17" transform="rotate(14 143 620)"/>
    <ellipse cx="348" cy="628" rx="6" ry="16" transform="rotate(-10 348 628)"/><ellipse cx="385" cy="622" rx="6" ry="16" transform="rotate(9 385 622)"/>
    <ellipse cx="816" cy="616" rx="7" ry="18" transform="rotate(-12 816 616)"/><ellipse cx="855" cy="610" rx="7" ry="18" transform="rotate(8 855 610)"/><ellipse cx="882" cy="624" rx="7" ry="17" transform="rotate(14 882 624)"/>
    <ellipse cx="1118" cy="626" rx="6" ry="16" transform="rotate(-10 1118 626)"/><ellipse cx="1155" cy="622" rx="6" ry="16" transform="rotate(9 1155 622)"/>
  </g>

  <!-- 사람 -->
  <g fill="#41637a"><circle cx="586" cy="620" r="9"/><rect x="579" y="628" width="14" height="28" rx="5"/></g>
  <g fill="#8a5a41"><circle cx="632" cy="636" r="9"/><rect x="625" y="644" width="14" height="28" rx="5"/></g>
</svg>
</body>
</html>
