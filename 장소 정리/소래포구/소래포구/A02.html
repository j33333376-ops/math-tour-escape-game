<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소래포구 MATHTOUR - A02</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(184,115,51,.18), transparent 38%),
        #16100c;
      color: #f4ecd8;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif KR', serif;
    }

    #game-container {
      position: relative;
      width: min(100vw, 1066px);
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #2c2019;
      border: 6px solid #4a3b32;
      box-shadow:
        0 0 0 3px #b87333,
        0 18px 45px rgba(0,0,0,.65),
        inset 0 0 70px rgba(0,0,0,.35);
    }

    #background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: sepia(.08) contrast(1.05) brightness(.88);
    }

    #scene-vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.30), transparent 22%, transparent 64%, rgba(0,0,0,.58)),
        radial-gradient(ellipse at center, transparent 48%, rgba(20,10,5,.46) 100%);
    }

    #stage-plate {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      min-width: 420px;
      padding: 10px 54px;
      text-align: center;
      font-family: 'Gowun Dodum', sans-serif;
      font-weight: 700;
      letter-spacing: .08em;
      color: #f4ecd8;
      background: linear-gradient(#7d4b25, #3d281b);
      border: 3px solid #b87333;
      border-radius: 9px;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.18),
        inset 0 -5px 10px rgba(0,0,0,.45),
        0 5px 12px rgba(0,0,0,.55);
    }

    #stage-plate::before,
    #stage-plate::after {
      content: "⚙";
      position: absolute;
      top: 50%;
      transform: translateY(-52%);
      color: #d69655;
      font-size: 30px;
      text-shadow: 0 2px 2px #24150d;
    }
    #stage-plate::before { left: 12px; }
    #stage-plate::after { right: 12px; }

    .char-wrapper {
      position: absolute;
      overflow: visible;
      z-index: 3;
      transition: filter .2s ease, transform .2s ease;
    }

    .char-wrapper.inactive {
      filter: brightness(.55) saturate(.75);
    }

    .char-wrapper.active {
      filter: brightness(1.08) drop-shadow(0 0 10px rgba(244,236,216,.18));
    }

    .char-nameplate {
      position: absolute;
      left: 50%;
      bottom: -2px;
      transform: translateX(-50%);
      min-width: 112px;
      padding: 5px 13px;
      text-align: center;
      font-family: 'Gowun Dodum', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #f4ecd8;
      background: linear-gradient(#6c4226, #2d2018);
      border: 2px solid #b87333;
      border-radius: 4px;
      box-shadow: 0 3px 8px rgba(0,0,0,.55);
      pointer-events: none;
    }

    #dialogue-box {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 30;
      width: calc(100% - 48px);
      min-height: 150px;
      padding: 36px 38px 30px;
      cursor: pointer;
      border: 3px solid #b87333;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(35,25,20,.97), rgba(0,59,70,.95));
      box-shadow:
        inset 0 0 0 3px #4a3b32,
        inset 0 -12px 24px rgba(0,0,0,.32),
        0 12px 28px rgba(0,0,0,.62);
    }

    #speaker-name {
      position: absolute;
      left: 28px;
      top: -22px;
      min-width: 150px;
      padding: 9px 20px;
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 19px;
      font-weight: 700;
      text-align: center;
      color: #f4ecd8;
      background: linear-gradient(#995d2b, #5d351f);
      border: 3px solid #d09250;
      border-radius: 6px;
      box-shadow: 0 5px 10px rgba(0,0,0,.45);
    }

    #dialogue-text {
      margin: 0;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.75;
      word-break: keep-all;
      text-shadow: 0 2px 2px rgba(0,0,0,.8);
    }

    #click-hint {
      position: absolute;
      right: 22px;
      bottom: 12px;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 12px;
      color: #d6b88d;
      opacity: .82;
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: .9; }
      50%, 100% { opacity: .28; }
    }

    .btn-nav {
      position: absolute;
      z-index: 40;
      min-width: 128px;
      padding: 12px 22px;
      border: 3px solid #4a3b32;
      border-radius: 6px;
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #f4ecd8;
      background:
        radial-gradient(circle at 10px 10px, #e0b279 0 2px, #5f371e 3px 4px, transparent 5px),
        radial-gradient(circle at calc(100% - 10px) 10px, #e0b279 0 2px, #5f371e 3px 4px, transparent 5px),
        radial-gradient(circle at 10px calc(100% - 10px), #e0b279 0 2px, #5f371e 3px 4px, transparent 5px),
        radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), #e0b279 0 2px, #5f371e 3px 4px, transparent 5px),
        linear-gradient(#cb8241, #8d4f27);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.24),
        inset 0 -5px 8px rgba(0,0,0,.32),
        0 5px 0 #3a2419,
        0 8px 14px rgba(0,0,0,.42);
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
    }

    .btn-nav:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn-nav:active { transform: translateY(4px); box-shadow: inset 0 2px 8px rgba(0,0,0,.45), 0 1px 0 #3a2419; }

    #btn-prev { left: 20px; bottom: 20px; display: none; }
    #btn-next { right: 20px; bottom: 20px; display: none; }
    #btn-skip {
      right: 24px;
      bottom: 188px;
      z-index: 45;
      min-width: 116px;
      padding: 10px 18px;
      font-size: 16px;
    }

    #progress-gauge {
      position: absolute;
      top: 72px;
      right: 22px;
      z-index: 20;
      width: 170px;
      height: 16px;
      border: 2px solid #4a3b32;
      border-radius: 9px;
      background: #1b1511;
      box-shadow: inset 0 2px 6px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.4);
      overflow: hidden;
    }

    #progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #71512f, #b87333, #e0b279);
      transition: width .25s ease;
    }

    @media (max-width: 760px) {
      #stage-plate { min-width: 330px; padding: 8px 45px; font-size: 14px; }
      #dialogue-box { width: calc(100% - 24px); min-height: 134px; padding: 30px 24px 24px; }
      #btn-skip { right: 14px; bottom: 164px; min-width: 96px; padding: 8px 12px; font-size: 14px; }
      #speaker-name { font-size: 16px; min-width: 125px; }
      .btn-nav { min-width: 100px; padding: 9px 14px; font-size: 15px; }
      #progress-gauge { display: none; }
    }
  </style>
</head>
<body>
  <main id="game-container" aria-label="소래포구 MATHTOUR 대화 장면">
    <img id="background-image" src="소래포구시장안.png" alt="소래포구시장 내부" />
    <div id="scene-vignette"></div>

    <div id="stage-plate">소래포구 MATHTOUR · 새우 가격의 비밀</div>
    <div id="progress-gauge" aria-hidden="true"><div id="progress-fill"></div></div>

    <!-- 서연: 왼쪽 -->
    <div class="char-wrapper" id="char-서연" style="left:95px; bottom:158px; width:221px; height:272px;">
      <iframe
        src="등장인물_서연.html"
        title="서연"
        scrolling="no"
        style="border:0; width:260px; height:320px; transform:scale(0.85); transform-origin:bottom left; pointer-events:none;"
      ></iframe>
      <div class="char-nameplate">서연</div>
    </div>

    <!-- 민우: 왼쪽 중앙, 서연과 겹치지 않게 배치 -->
    <div class="char-wrapper" id="char-민우" style="left:316px; bottom:155px; width:221px; height:272px;">
      <iframe
        src="등장인물_민우.html"
        title="민우"
        scrolling="no"
        style="border:0; width:260px; height:320px; transform:scale(0.85); transform-origin:bottom left; pointer-events:none;"
      ></iframe>
      <div class="char-nameplate">민우</div>
    </div>

    <!-- 시장상인: 오른쪽, 학생들을 바라보도록 좌우 반전 -->
    <div class="char-wrapper" id="char-시장상인" style="left:760px; bottom:150px; width:234px; height:288px;">
      <iframe
        src="등장인물_시장상인.html"
        title="시장상인"
        scrolling="no"
        style="border:0; width:260px; height:320px; transform:scale(0.9) scaleX(-1); transform-origin:bottom left; pointer-events:none;"
      ></iframe>
      <div class="char-nameplate">시장상인</div>
    </div>

    <section id="dialogue-box" onclick="advanceDialogue()" role="button" tabindex="0" aria-label="대화창, 클릭하여 다음 대사로 진행">
      <div id="speaker-name">시장상인</div>
      <p id="dialogue-text"></p>
      <div id="click-hint">CLICK ▶</div>
    </section>

    <button class="btn-nav" id="btn-prev" type="button" onclick="goTo('A01.html')">이전</button>
    <button class="btn-nav" id="btn-skip" type="button" onclick="skipDialogue(event)">건너뛰기</button>
    <button class="btn-nav" id="btn-next" type="button" onclick="goTo('A03.html')">다음</button>
  </main>

  <script>
    const dialogues = [
      {
        speaker: '시장상인',
        text: '어서 오세요! 학생들, 오늘 새우 진짜 좋아! 방금 들어와서 아주 팔팔해. 무슨 일로 둘이서 장을 보러 왔어?',
        target: 'char-시장상인'
      },
      {
        speaker: '서연',
        text: '안녕하세요! 저희 이번에 반 단합대회 하거든요. 반 친구들이 다 같이 먹을 새우 사러 왔어요.',
        target: 'char-서연'
      },
      {
        speaker: '시장상인',
        text: '아이구, 반 단합대회? 단체로 먹는 거면 양이 꽤 되겠네! 오늘 생물 흰다리새우가 씨알도 굵고 아주 좋아. 기본 1킬로그램에 3만 원인데, 단합대회라니까 이모가 특별히 할인해 줄게! 1킬로씩 더 살 때마다 킬로당 1,000원씩 더 할인해 줄 건데, 몇 킬로나 사려고?',
        target: 'char-시장상인'
      },
      {
        speaker: '민우',
        text: '우와, 진짜요? 1킬로 추가될 때마다 킬로당 가격이 1,000원씩 내려간다는 말씀이시죠?',
        target: 'char-민우'
      },
      {
        speaker: '시장상인',
        text: '그렇지! 1kg 사면 3만 원, 2kg 사면 킬로당 2만 9천 원, 3kg 사면 킬로당 2만 8천 원… 이렇게 킬로 수가 늘어날수록 전체 킬로당 단가가 낮아지는 거지!',
        target: 'char-시장상인'
      },
      {
        speaker: '서연',
        text: '(민우를 보며) 야, 대박이다! 그런데 우리 오늘 새우 사는 데 쓸 수 있는 회비 예산이 총 14만 원이잖아.',
        target: 'char-서연'
      },
      {
        speaker: '민우',
        text: '맞다! 그럼 아주머니, 저희 예산 14만 원으로 최대 몇 킬로그램까지 살 수 있는 거예요?',
        target: 'char-민우'
      },
      {
        speaker: '시장상인',
        text: '(미소를 지으며) 글쎄~ 싹싹한 학생들이니까 직접 한번 계산해 봐! 몇 킬로까지 살 수 있는지 맞히면 내가 서비스로 가리비도 몇 개 얹어줄게!',
        target: 'char-시장상인'
      },
      {
        speaker: '서연',
        text: '(휴대전화 계산기를 꺼내며) 오, 좋아요! 가리비 서비스 꼭 받을게요. 어디 보자… 4kg 사면 킬로당 2만 7천 원이니까 10만 8천 원이고… 그럼 5kg을 사면 킬로당 얼마지?',
        target: 'char-서연'
      },
      {
        speaker: '민우',
        text: '5kg이면 킬로당 2만 6천 원이니까… 곱해보면… 어? 14만 원으로 몇 kg까지 살 수 있는 거지?!',
        target: 'char-민우'
      }
    ];

    let currentIndex = 0;
    let finished = false;

    const dialogueBox = document.getElementById('dialogue-box');
    const speakerName = document.getElementById('speaker-name');
    const dialogueText = document.getElementById('dialogue-text');
    const progressFill = document.getElementById('progress-fill');
    const characters = [...document.querySelectorAll('.char-wrapper')];

    function updateDialogue() {
      const item = dialogues[currentIndex];
      speakerName.textContent = item.speaker;
      dialogueText.textContent = item.text;

      characters.forEach(character => {
        const isSpeaking = character.id === item.target;
        character.classList.toggle('inactive', !isSpeaking);
        character.classList.toggle('active', isSpeaking);
      });

      const ratio = ((currentIndex + 1) / dialogues.length) * 100;
      progressFill.style.width = ratio + '%';
    }

    function advanceDialogue() {
      if (finished) return;

      if (currentIndex < dialogues.length - 1) {
        currentIndex += 1;
        updateDialogue();
      } else {
        finishDialogue();
      }
    }

    function finishDialogue() {
      finished = true;
      dialogueBox.style.display = 'none';
      document.getElementById('btn-skip').style.display = 'none';
      document.getElementById('btn-prev').style.display = 'block';
      document.getElementById('btn-next').style.display = 'block';
      progressFill.style.width = '100%';

      characters.forEach(character => {
        character.classList.remove('inactive', 'active');
      });
    }

    function skipDialogue(event) {
      event.stopPropagation();
      finishDialogue();
    }

    function goTo(url) {
      window.location.href = url;
    }

    dialogueBox.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        advanceDialogue();
      }
    });

    updateDialogue();
  </script>
</body>
</html>
