<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>소래포구 - 새우타워</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .st-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="st-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소래포구 새우타워">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7db9e4"/><stop offset="65%" stop-color="#c9e4f4"/><stop offset="100%" stop-color="#e9f4fa"/></linearGradient>
    <linearGradient id="copA" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d3a05e"/><stop offset="55%" stop-color="#b57e3e"/><stop offset="100%" stop-color="#7d4f20"/></linearGradient>
    <linearGradient id="copBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c68f4e"/><stop offset="100%" stop-color="#8a5a28"/></linearGradient>
    <linearGradient id="glassCore" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3d5468"/><stop offset="100%" stop-color="#22303c"/></linearGradient>
    <pattern id="lat" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0,9 L9,0 L18,9 L9,18 Z" fill="none" stroke="#5f3d18" stroke-width="1.4" opacity="0.5"/>
      <path d="M0,0 L18,18 M18,0 L0,18" stroke="#5f3d18" stroke-width="0.7" opacity="0.3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="180" cy="100" rx="84" ry="22"/><ellipse cx="1040" cy="90" rx="90" ry="24"/><ellipse cx="860" cy="170" rx="58" ry="16"/><ellipse cx="300" cy="220" rx="52" ry="14"/></g>
  <!-- 갈매기 -->
  <g stroke="#5b7386" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M230,190 q10,-10 20,0 q10,-10 20,0"/><path d="M1000,250 q9,-9 18,0 q9,-9 18,0"/><path d="M1090,170 q9,-9 18,0 q9,-9 18,0"/>
  </g>
  <!-- 원경 산업단지/송전탑 -->
  <g opacity="0.45">
    <rect x="20" y="480" width="100" height="80" fill="#a9bfcc"/><rect x="130" y="500" width="80" height="60" fill="#b9ccd6"/><rect x="240" y="510" width="60" height="50" fill="#a9bfcc"/>
    <rect x="960" y="490" width="120" height="70" fill="#a9bfcc"/><rect x="1090" y="505" width="90" height="55" fill="#b9ccd6"/>
    <g stroke="#8fa8b6" stroke-width="3" fill="none">
      <path d="M905,560 L920,470 L935,560 M908,505 L932,505 M912,485 L928,485 M898,530 L942,530"/>
      <path d="M1145,560 L1158,485 L1171,560 M1148,522 L1168,522 M1151,502 L1165,502"/>
    </g>
  </g>

  <!-- 바다 -->
  <rect x="0" y="560" width="1200" height="80" fill="#5f9cba"/>
  <g stroke="#dff0f6" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M80,592 q20,-8 40,0 q20,8 40,0"/><path d="M1040,600 q20,-8 40,0 q20,8 40,0"/>
  </g>
  <!-- 해안 광장 -->
  <rect x="0" y="640" width="1200" height="80" fill="#cfc6b4"/>
  <rect x="0" y="640" width="1200" height="10" fill="#b8ad97"/>
  <g stroke="#b8ad97" stroke-width="2" opacity="0.7"><line x1="180" y1="650" x2="150" y2="720"/><line x1="440" y1="650" x2="430" y2="720"/><line x1="820" y1="650" x2="840" y2="720"/><line x1="1070" y1="650" x2="1100" y2="720"/></g>

  <!-- ===== 새우타워 ===== -->
  <g>
    <ellipse cx="580" cy="662" rx="230" ry="17" fill="#8a8272" opacity="0.35"/>

    <!-- 더듬이 : 머리에서 오른쪽으로 크게 감기는 두 개의 고리 -->
    <g fill="none" stroke-linecap="round">
      <path d="M512,84 C650,-34 918,6 934,190 C946,318 848,404 758,376" stroke="#8a5a28" stroke-width="7"/>
      <path d="M512,84 C650,-34 918,6 934,190 C946,318 848,404 758,376" stroke="#d8ab6c" stroke-width="2.6" opacity="0.7"/>
      <path d="M524,98 C688,-2 880,60 878,220 C876,330 800,394 736,382" stroke="#8a5a28" stroke-width="6"/>
      <path d="M524,98 C688,-2 880,60 878,220 C876,330 800,394 736,382" stroke="#d8ab6c" stroke-width="2.2" opacity="0.7"/>
    </g>
    <!-- 머리 뿔(로스트럼) : 정점에서 부챗살 -->
    <g stroke="#7a4c1e" stroke-width="5.5" stroke-linecap="round" fill="none">
      <path d="M500,92 L408,34"/>
      <path d="M505,84 L446,10"/>
      <path d="M512,80 L495,0"/>
      <path d="M520,80 L548,8"/>
      <path d="M497,100 L392,66"/>
    </g>

    <!-- 몸체 : 각진 파사드, 왼쪽으로 기운 정점, 아래로 비틀리며 내려오는 형태 -->
    <path d="M500,78 L556,100 L604,158 L616,232 L648,308 L662,392 L652,470 L640,560 L630,660
             L486,660 L478,570 L466,478 L444,388 L434,300 L452,224 L444,150 L472,106 Z"
          fill="url(#copA)" stroke="#5f3d18" stroke-width="4" stroke-linejoin="round"/>
    <path d="M500,78 L556,100 L604,158 L616,232 L648,308 L662,392 L652,470 L640,560 L630,660
             L486,660 L478,570 L466,478 L444,388 L434,300 L452,224 L444,150 L472,106 Z"
          fill="url(#lat)"/>
    <!-- 왼쪽 면 하이라이트(햇빛 받는 면) -->
    <polygon points="500,78 472,106 444,150 452,224 434,300 444,388 508,368 488,290 502,214 492,142" fill="#e2b878" opacity="0.4"/>

    <!-- 비틀린 대각 이음매(나선 세그먼트) -->
    <g stroke="#5f3d18" stroke-width="3.5" fill="none" opacity="0.85">
      <path d="M448,252 Q552,282 614,236"/>
      <path d="M436,344 Q560,378 652,318"/>
      <path d="M452,432 Q572,462 656,404"/>
      <path d="M472,522 Q580,548 646,498"/>
    </g>
    <!-- 패널 능선(삼각 파사드) -->
    <g stroke="#5f3d18" stroke-width="2" fill="none" opacity="0.5">
      <path d="M500,78 L524,152 L604,158 M524,152 L452,224 M524,152 L536,244 L614,236 M536,244 L448,252"/>
      <path d="M536,252 L500,312 L436,344 M536,252 L590,300 L652,322 M500,312 L590,300"/>
      <path d="M590,306 L556,388 L652,406 M500,318 L556,388 M452,432 L556,388"/>
      <path d="M556,396 L520,470 L472,522 M556,396 L616,460 L646,498 M520,470 L616,460"/>
    </g>

    <!-- 머리 큰 삼각 개구부(전망창) -->
    <polygon points="474,148 546,116 566,192 492,216" fill="#1e2a33" stroke="#141c22" stroke-width="3"/>
    <line x1="512" y1="132" x2="530" y2="204" stroke="#3d5468" stroke-width="2"/>

    <!-- 중단 작은 개구부 -->
    <polygon points="564,334 610,318 618,356 572,370" fill="#26333d"/>

    <!-- 코일 사이 어두운 유리 틈 -->
    <polygon points="524,566 618,560 614,604 528,610" fill="url(#glassCore)"/>
    <g stroke="#5a7285" stroke-width="2" opacity="0.8"><line x1="556" y1="564" x2="558" y2="606"/><line x1="588" y1="562" x2="588" y2="605"/></g>

    <!-- 꼬리 코일 : 앞을 감아 도는 두 겹의 격자 밴드(오른쪽으로 벌어짐) -->
    <path d="M436,514 Q590,478 740,522 L724,564 Q590,522 456,560 Z" fill="url(#copBand)" stroke="#5f3d18" stroke-width="4"/>
    <path d="M436,514 Q590,478 740,522 L724,564 Q590,522 456,560 Z" fill="url(#lat)"/>
    <path d="M424,604 Q600,562 762,610 L744,654 Q600,614 448,650 Z" fill="url(#copA)" stroke="#5f3d18" stroke-width="4"/>
    <path d="M424,604 Q600,562 762,610 L744,654 Q600,614 448,650 Z" fill="url(#lat)"/>
    <!-- 코일 하이라이트 -->
    <path d="M436,514 Q590,478 740,522" fill="none" stroke="#e2b878" stroke-width="3" opacity="0.6"/>
    <path d="M424,604 Q600,562 762,610" fill="none" stroke="#e2b878" stroke-width="3" opacity="0.6"/>

    <!-- 나선 계단(오른쪽, 어두운 코어 기둥을 감음) -->
    <g>
      <rect x="670" y="298" width="18" height="178" fill="#33424e" stroke="#22303c" stroke-width="2"/>
      <g fill="none" stroke="#4a2d12" stroke-width="4.5" stroke-linecap="round">
        <path d="M650,318 Q679,332 708,316"/>
        <path d="M650,348 Q679,362 708,346"/>
        <path d="M650,378 Q679,392 708,376"/>
        <path d="M650,408 Q679,422 708,406"/>
        <path d="M650,438 Q679,452 708,436"/>
      </g>
      <path d="M650,306 Q679,320 708,304" fill="none" stroke="#6b4420" stroke-width="3" stroke-linecap="round"/>
      <path d="M650,466 Q679,480 708,464" fill="none" stroke="#6b4420" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 전망 데크(오른쪽 돌출 곡선 브리지) -->
    <g>
      <path d="M688,320 Q770,304 846,314 L846,330 Q770,320 688,336 Z" fill="#6b4420" stroke="#4a2d12" stroke-width="3"/>
      <g stroke="#4a2d12" stroke-width="2.8">
        <line x1="706" y1="324" x2="706" y2="282"/><line x1="734" y1="320" x2="734" y2="278"/><line x1="762" y1="316" x2="762" y2="274"/><line x1="790" y1="314" x2="790" y2="272"/><line x1="818" y1="313" x2="818" y2="272"/><line x1="844" y1="314" x2="844" y2="274"/>
      </g>
      <path d="M696,284 Q770,270 848,278" stroke="#4a2d12" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M726,336 L710,378 M790,330 L772,378 M842,330 L830,372" stroke="#4a2d12" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 하단 짧은 데크 -->
      <path d="M690,468 Q734,460 776,464 L776,478 Q734,474 690,482 Z" fill="#6b4420" stroke="#4a2d12" stroke-width="3"/>
      <g stroke="#4a2d12" stroke-width="2.5"><line x1="708" y1="470" x2="708" y2="440"/><line x1="736" y1="466" x2="736" y2="436"/><line x1="762" y1="465" x2="762" y2="436"/></g>
      <path d="M696,442 Q736,432 778,438" stroke="#4a2d12" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 작업자(주황 조끼) -->
  <g><circle cx="890" cy="668" r="8" fill="#e8c9a8"/><rect x="883" y="675" width="14" height="24" rx="5" fill="#e05e2b"/></g>
  <g fill="#41637a"><circle cx="300" cy="668" r="9"/><rect x="293" y="676" width="14" height="26" rx="5"/></g>

  <!-- 사인 -->
  <g transform="translate(600,694)">
    <rect x="-86" y="-22" width="172" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#96632c" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#7a4c1e">새우타워</text>
  </g>
</svg>
</body>
</html>
