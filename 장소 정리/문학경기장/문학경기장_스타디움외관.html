<!-- 원본 크기: 1280x500 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문학경기장 스타디움 외관</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .mst-svg { display:block; width:100%; height:auto; }

  @keyframes mst-flag { 0%,100% { transform: skewX(0deg); } 50% { transform: skewX(-6deg); } }
  .mst-flag { transform-origin: left center; animation: mst-flag 3.2s ease-in-out infinite; }
  .mst-flag2 { animation-delay: .6s; }
  .mst-flag3 { animation-delay: 1.2s; }

  @keyframes mst-shimmer { 0%,100% { opacity:0.16; } 50% { opacity:0.32; } }
  .mst-shine { animation: mst-shimmer 4.5s ease-in-out infinite; }
</style>
</head>
<body>
<svg class="mst-svg" viewBox="0 0 1280 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="문학경기장 스타디움 외관">
<title>문학경기장 스타디움 외관</title>
<defs>
  <linearGradient id="mstSail" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#cfd8e2"/>
  </linearGradient>
  <linearGradient id="mstGlass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7fa8c8"/>
    <stop offset="1" stop-color="#4d7a9e"/>
  </linearGradient>
  <linearGradient id="mstWall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d7dade"/>
    <stop offset="1" stop-color="#b9bcc2"/>
  </linearGradient>
  <linearGradient id="mstBand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f4fa0"/>
    <stop offset="0.5" stop-color="#2f6fc8"/>
    <stop offset="1" stop-color="#c8283a"/>
  </linearGradient>
</defs>

<!-- 지면 그림자 -->
<ellipse cx="640" cy="452" rx="600" ry="16" fill="#000" opacity="0.08"/>
<rect x="0" y="450" width="1280" height="3" fill="#c9c4b8" opacity="0.5"/>

<!-- ════════ 스탠드(둥근 몸체) ════════ -->
<rect x="50" y="240" width="1180" height="200" rx="26" fill="url(#mstWall)" stroke="#9a9ea4" stroke-width="1.5"/>

<!-- 콘크리트 기둥선 -->

  <line x1="800" y1="252" x2="800" y2="428"/>

</g>

<!-- 상단 유리 프리즈(관람 통로) -->
<rect x="50" y="240" width="1180" height="58" rx="18" fill="url(#mstGlass)" opacity="0.92"/>
<rect x="60" y="248" width="1160" height="42" fill="#284a63" opacity="0.18"/>

<!-- 팀 컬러 띠 -->
<rect x="50" y="300" width="1180" height="14" fill="url(#mstBand)"/>

<!-- 1층 출입구 아치들 -->
<g fill="#243447">
  <rect x="120"  y="360" width="60" height="80" rx="26"/>
  <rect x="270"  y="360" width="60" height="80" rx="26"/>
  <rect x="420"  y="360" width="60" height="80" rx="26"/>
  <rect x="580"  y="360" width="120" height="80" rx="34"/>

<text x="640" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff" letter-spacing="1">문학경기장</text>

<!-- ════════ 돛단배 형상 흰 지붕 (세 개의 돛) ════════ -->
<!-- 좌측 돛 -->
<path d="M70,242 C 150,120 210,70 262,44 C 300,86 330,160 360,242 Z" fill="url(#mstSail)" stroke="#aab2ba" stroke-width="1.5"/>
<path d="M262,44 C 300,86 330,160 360,242" fill="none" stroke="#9aa4ad" stroke-width="1"/>
<line x1="262" y1="44" x2="262" y2="14" stroke="#7a828a" stroke-width="4"/>
<polygon points="262,14 262,32 284,20" class="mst-flag mst-flag1" fill="#c8283a"/>
<g stroke="#b6bdc4" stroke-width="0.8" opacity="0.7">
  <line x1="262" y1="16" x2="120" y2="238"/>
  <line x1="262" y1="16" x2="180" y2="238"/>

<!-- 중앙(가장 큰) 돛 -->
<path d="M370,242 C 460,80 560,10 640,-6 C 720,10 800,80 890,242 Z" fill="url(#mstSail)" stroke="#aab2ba" stroke-width="1.5"/>
<path d="M640,-6 C 720,10 800,80 890,242" fill="none" stroke="#9aa4ad" stroke-width="1"/>

<polygon points="640,-34 640,-14 666,-26" class="mst-flag mst-flag2" fill="#1f4fa0"/>
<g stroke="#b6bdc4" stroke-width="0.9" opacity="0.75">

  <line x1="640" y1="-30" x2="520" y2="238"/>
  <line x1="640" y1="-30" x2="640" y2="238"/>
  <line x1="640" y1="-30" x2="760" y2="238"/>
  <line x1="640" y1="-30" x2="860" y2="238"/>
</g>

<!-- 우측 돛 -->
<path d="M900,242 C 930,160 960,86 998,44 C 1050,70 1110,120 1190,242 Z" fill="url(#mstSail)" stroke="#aab2ba" stroke-width="1.5"/>
<path d="M998,44 C 950,86 930,160 900,242" fill="none" stroke="#9aa4ad" stroke-width="1"/>
<line x1="998" y1="44" x2="998" y2="14" stroke="#7a828a" stroke-width="4"/>
<polygon points="998,14 998,32 1020,20" class="mst-flag mst-flag3" fill="#c8283a"/>
<g stroke="#b6bdc4" stroke-width="0.8" opacity="0.7">

<!-- 지붕 하이라이트 -->
<path d="M460,180 C 520,90 580,30 640,10" fill="none" stroke="#fff" stroke-width="6" opacity="0.35" class="mst-shine"/>

</svg>
</body>
</html>
