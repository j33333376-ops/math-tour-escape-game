<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모두를 위한 경기장: 휠체어 경사로 설계 미션</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #ca8a04;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 800px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .header {
      background: var(--primary);
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .content {
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    .mission-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .mission-box strong {
      color: var(--primary);
    }

    .canvas-container {
      width: 100%;
      height: 240px;
      background: #f1f5f9;
      border-radius: 12px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      background: #fafafa;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
    }

    .input-group input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .input-group input[readonly] {
      background-color: #e2e8f0;
      color: #64748b;
    }

    .btn-submit {
      grid-column: 1 / -1;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    .result-card {
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card.show {
      display: block;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      color: white;
    }

    .badge.s-rank { background: var(--success); }
    .badge.a-rank { background: var(--warning); }
    .badge.f-rank { background: var(--danger); }

    /* 수학 공식 강조 박스 */
    .formula-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
      font-size: 1rem;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* 분수 표현 CSS */
    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
    }

    .numerator {
      border-bottom: 2px solid #0f172a;
      padding-bottom: 2px;
      font-weight: 600;
    }

    .denominator {
      padding-top: 2px;
      font-weight: 600;
    }

    .formula-box span.highlight {
      color: var(--primary);
      font-weight: bold;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      text-align: center;
    }

    .stat-item .label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .stat-item .value {
      font-size: 1.1rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏟️ 모두를 위한 경기장 설계 미션</h1>
    <p>삼각비(tan)를 활용해 최적의 휠체어 경사로를 만들어보세요!</p>
  </div>

  <div class="content">
    <!-- 미션 브리핑 -->
    <div class="mission-box">
      <strong>📌 설계를 위한 조건</strong><br>
      • 경기장 입구 높이: <strong>1.5m</strong> (고정)<br>
      • 법정 안전 규정: 경사도 약 0.0833 이하<br>
      • 자재 예산 제한: 최대 <strong>20m</strong> 이하의 수평 거리만 자금 지원 가능
    </div>

    <!-- 시각화 캔버스 -->
    <div class="canvas-container">
      <canvas id="rampCanvas"></canvas>
    </div>

    <!-- 입력 폼 -->
    <div class="controls">
      <div class="input-group">
        <label for="heightInput">높이 (h)</label>
        <input type="text" id="heightInput" value="1.5 m" readonly>
      </div>
      <div class="input-group">
        <label for="lengthInput">설계할 수평 거리 (L)</label>
        <input type="number" id="lengthInput" placeholder="예: 18.0" step="0.1" min="1" max="30">
      </div>
      <button class="btn-submit" onclick="evaluateDesign()">설계안 검토 및 승인 요청</button>
    </div>

    <!-- 평가 결과 영역 -->
    <div id="resultCard" class="result-card">
      <div class="result-header">
        <h3 id="resultTitle">평가 결과</h3>
        <span id="rankBadge" class="badge">S등급</span>
      </div>
      <p id="resultDescription">설명 메시지</p>
      
      <!-- 탄젠트 계산 공식 박스 (분수 형태) -->
      <div class="formula-box">
        📐 <strong>계산식:</strong> 
        <span>tan θ = </span>
        
        <!-- 한글 정의 분수 -->
        <div class="fraction">
          <span class="numerator">높이 (h)</span>
          <span class="denominator">수평거리 (L)</span>
        </div>
        
        <span>=</span>
        
        <!-- 실제 대입 숫자 분수 -->
        <div class="fraction highlight">
          <span class="numerator" id="numVal">1.5m</span>
          <span class="denominator" id="denVal">18.0m</span>
        </div>
        
        <span>=</span>
        <span id="tanResultVal" class="highlight">0.0833</span>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <div class="label">탄젠트 값 (tan θ)</div>
          <div class="value" id="tanValue">-</div>
        </div>
        <div class="stat-item">
          <div class="label">경사각 (θ)</div>
          <div class="value" id="angleValue">-</div>
        </div>
        <div class="stat-item">
          <div class="label">안전 여부</div>
          <div class="value" id="safetyStatus">-</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const HEIGHT = 1.5; // 고정 높이 1.5m
  const MAX_SAFE_TAN = 1 / 12; // 약 0.083333...

  const canvas = document.getElementById('rampCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    drawRamp(parseFloat(document.getElementById('lengthInput').value) || 0);
  }

  window.addEventListener('resize', resizeCanvas);

  // 캔버스에 직각삼각형 및 경사로 그리기
  function drawRamp(length) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const padding = 40;
    const drawWidth = canvas.width - padding * 2;
    const drawHeight = canvas.height - padding * 2;

    const displayLength = Math.max(length, 5); 
    const scaleX = drawWidth / Math.max(displayLength, 25); 
    const scaleY = drawHeight / 3; 

    const startX = padding;
    const startY = canvas.height - padding;
    const endX = startX + (length > 0 ? length * scaleX : 0);
    const topY = startY - (HEIGHT * scaleY);

    // 바닥선
    ctx.beginPath();
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 2;
    ctx.moveTo(0, startY);
    ctx.lineTo(canvas.width, startY);
    ctx.stroke();

    if (length > 0) {
      // 직각삼각형 채우기
      ctx.beginPath();
      ctx.fillStyle = 'rgba(37, 99, 235, 0.1)';
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, startY);
      ctx.lineTo(startX, topY);
      ctx.closePath();
      ctx.fill();

      // 경사면 (빗변)
      ctx.beginPath();
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 4;
      ctx.moveTo(startX, topY);
      ctx.lineTo(endX, startY);
      ctx.stroke();

      // 높이선 (수직변)
      ctx.beginPath();
      ctx.strokeStyle = '#94a3b8';
      ctx.setLineDash([4, 4]);
      ctx.moveTo(startX, startY);
      ctx.lineTo(startX, topY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 텍스트 표시
      ctx.fillStyle = '#0f172a';
      ctx.font = '12px sans-serif';
      ctx.fillText(`높이 h = ${HEIGHT}m`, startX + 8, topY + (startY - topY) / 2);
      ctx.fillText(`수평 거리 L = ${length.toFixed(1)}m`, startX + (endX - startX) / 2 - 30, startY + 20);
    }
  }

  // 설계 검토 및 평가 함수
  function evaluateDesign() {
    const lengthInput = document.getElementById('lengthInput');
    const length = parseFloat(lengthInput.value);

    if (isNaN(length) || length <= 0) {
      alert("올바른 수평 거리를 입력해 주세요!");
      return;
    }

    drawRamp(length);

    const tan = HEIGHT / length;
    const angleRad = Math.atan(tan);
    const angleDeg = angleRad * (180 / Math.PI);

    const resultCard = document.getElementById('resultCard');
    const resultTitle = document.getElementById('resultTitle');
    const resultDescription = document.getElementById('resultDescription');
    const rankBadge = document.getElementById('rankBadge');

    // 계산식 수치 업데이트 (분수 형태)
    document.getElementById('numVal').innerText = `${HEIGHT}m`;
    document.getElementById('denVal').innerText = `${length.toFixed(1)}m`;
    document.getElementById('tanResultVal').innerText = tan.toFixed(4);

    document.getElementById('tanValue').innerText = tan.toFixed(4);
    document.getElementById('angleValue').innerText = `${angleDeg.toFixed(1)}°`;

    resultCard.className = 'result-card show';

    // 조건 분기 평가
    if (tan > MAX_SAFE_TAN) {
      // 1. 안전 기준 미달 (부적합)
      resultTitle.innerText = "🚨 설계 부적합 (안전 기준 미달)";
      resultDescription.innerText = `경사도(tan θ = ${tan.toFixed(4)})가 안전 기준(1/12 ≈ 0.0833)을 초과해 너무 가파릅니다. 휠체어 이용자가 올라가기 위험합니다!`;
      rankBadge.innerText = "F등급 (재설계 필요)";
      rankBadge.className = "badge f-rank";
      document.getElementById('safetyStatus').innerText = "❌ 위험";
      document.getElementById('safetyStatus').style.color = "var(--danger)";

    } else if (length > 20.0) {
      // 2. 안전하지만 예산 초과
      resultTitle.innerText = "💸 예산 초과 (자재 과다 사용)";
      resultDescription.innerText = `안전 기준은 만족하지만, 필요 이상으로 수평 거리(${length}m)가 길어 공사 예산을 초과했습니다! (최대 지원 예산: 20m 이하)`;
      rankBadge.innerText = "A등급 (예산 오버)";
      rankBadge.className = "badge a-rank";
      document.getElementById('safetyStatus').innerText = "🟢 안전";
      document.getElementById('safetyStatus').style.color = "var(--success)";

    } else {
      // 3. 최적화 성공 (S등급)
      resultTitle.innerText = "🎉 축하합니다! 완벽한 설계입니다.";
      resultDescription.innerText = `안전 기준(tan θ ≤ 1/12)을 정확히 만족하면서, 예산 범위(18m ~ 20m) 내에서 가장 효율적으로 설계하셨습니다. 모두를 위한 경기장이 완성되었습니다!`;
      rankBadge.innerText = "S등급 유니버설 건축가";
      rankBadge.className = "badge s-rank";
      document.getElementById('safetyStatus').innerText = "🟢 안전";
      document.getElementById('safetyStatus').style.color = "var(--success)";
    }
  }

  // 초기화 실행
  resizeCanvas();
</script>

</body>
</html>
