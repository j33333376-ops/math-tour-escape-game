<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문학경기장 MATHTOUR - C02</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Pretendard', sans-serif;
      overflow: hidden;
    }

    /* 16:9 메인 게임 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border-radius: 12px;
    }

    /* 스테이지 상단 표시바 */
    #top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      height: 48px;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      z-index: 20;
    }

    .stage-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stage-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 16px;
      background-color: #2563eb;
      border-radius: 4px;
    }

    .progress-text {
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: #2563eb;
    }

    /* 에셋 레이어: 어린이박물관내부 (W:1000, H:500 기준 배치) */
    #building-layer {
      position: absolute;
      left: 33px;
      bottom: 40px;
      width: 1000px;
      height: 500px;
      overflow: hidden;
      z-index: 1;
    }

    #building-layer iframe {
      border: 0;
      width: 1000px;
      height: 500px;
      transform: scale(1);
      transform-origin: top left;
      pointer-events: none;
    }

    /* 등장인물 감싸는 Wrapper */
    .char-wrapper {
      position: absolute;
      transition: filter 0.2s ease;
      z-index: 3;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    /* 비주얼 노블 대화창 UI */
    #dialogue-box {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 220px);
      height: 125px;
      background-color: rgba(255, 255, 255, 0.96);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 18px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      z-index: 15;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid rgba(37, 99, 235, 0.15);
      transition: border-color 0.2s ease;
    }

    #dialogue-box:hover {
      border-color: rgba(37, 99, 235, 0.4);
    }

    #speaker-name {
      font-size: 16px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #speaker-name::after {
      content: '◀';
      font-size: 10px;
      opacity: 0.6;
    }

    #dialogue-text {
      font-size: 16px;
      line-height: 1.6;
      color: #1e293b;
      letter-spacing: -0.02em;
      flex-grow: 1;
    }

    .click-indicator {
      align-self: flex-end;
      font-size: 12px;
      color: #94a3b8;
      font-family: 'Roboto Mono', monospace;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* 공통 이동 버튼 */
    .btn-nav {
      position: absolute;
      bottom: 20px;
      height: 44px;
      padding: 0 22px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: 'Pretendard', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: background-color 0.2s, transform 0.1s;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-nav:hover {
      background-color: #1d4ed8;
    }

    .btn-nav:active {
      transform: scale(0.98);
    }

    #btn-prev {
      left: 20px;
    }

    #btn-next, #btn-skip {
      right: 20px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 스테이지 상단 표시바 -->
  <div id="top-bar">
    <div class="stage-title">어린이박물관 탐구 - 과학체험관</div>
    <div class="progress-bar-container">
      <span class="progress-text">STAGE C02</span>
    </div>
  </div>

  <!-- 에셋: 어린이박물관내부 -->
  <div id="building-layer">
    <iframe src="어린이박물관내부.html" scrolling="no"></iframe>
  </div>

  <!-- 등장인물: 민우 (좌측) -->
  <div class="char-wrapper" id="char-민우" style="left: 120px; bottom: 40px; width: 260px; height: 320px; overflow: visible;">
    <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
  </div>

  <!-- 등장인물: 서연 (우측, 좌우 반전으로 민우를 바라봄) -->
  <div class="char-wrapper" id="char-서연" style="left: 685px; bottom: 40px; width: 260px; height: 320px; overflow: visible;">
    <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
  </div>

  <!-- 대화창 UI -->
  <div id="dialogue-box" onclick="advanceDialogue()">
    <div id="speaker-name">민우</div>
    <div id="dialogue-text">과학체험 전시장이다.</div>
    <div class="click-indicator">클릭하여 계속 ▶</div>
  </div>

  <!-- 이동 및 건너뛰기 버튼 -->
  <button id="btn-prev" class="btn-nav" onclick="goPrev()">◀ 이전</button>
  <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기 ⏭</button>
  <button id="btn-next" class="btn-nav hidden" onclick="goNext()">다음 ▶</button>
</div>

<script>
  // 대화 스크립트 데이터 (요청서 스토리 기반)
  const dialogues = [
    { speaker: "민우", text: "과학체험 전시장이다.", target: "char-민우" },
    { speaker: "서연", text: "이것봐! 버튼을 누르면 기계가 움직여", target: "char-서연" },
    { speaker: "민우", text: "공기가 힘을 만들어 물건을 움직이는 것도 신기해.", target: "char-민우" },
    { speaker: "서연", text: "직접 해보니까 더 재밌다.", target: "char-서연" },
    { speaker: "민우", text: "여기는 우리 생활 속 여러 현상을 이해할 수 있도록 도와주는 곳이야!", target: "char-민우" },
    { speaker: "서연", text: "또 다른 장소로 가보자~~", target: "char-서연" }
  ];

  let currentIndex = 0;

  // 대화 상태 업데이트 함수
  function updateDialogue() {
    if (currentIndex < dialogues.length) {
      const current = dialogues[currentIndex];
      document.getElementById('speaker-name').textContent = current.speaker;
      document.getElementById('dialogue-text').textContent = current.text;

      // 말하는 캐릭터만 강조 (나머지는 inactive 적용)
      const characters = document.querySelectorAll('.char-wrapper');
      characters.forEach(char => {
        if (char.id === current.target) {
          char.classList.remove('inactive');
        } else {
          char.classList.add('inactive');
        }
      });
    } else {
      endDialogue();
    }
  }

  // 대화 진행 (클릭 시)
  function advanceDialogue() {
    currentIndex++;
    if (currentIndex < dialogues.length) {
      updateDialogue();
    } else {
      endDialogue();
    }
  }

  // 건너뛰기 버튼 실행
  function skipDialogue() {
    endDialogue();
  }

  // 대화 종료 시 처리
  function endDialogue() {
    document.getElementById('dialogue-box').style.display = 'none';
    document.getElementById('btn-skip').classList.add('hidden');
    document.getElementById('btn-next').classList.remove('hidden');

    // 모든 인물 밝기 원복
    const characters = document.querySelectorAll('.char-wrapper');
    characters.forEach(char => {
      char.classList.remove('inactive');
    });
  }

  // 페이지 이동 함수
  function goPrev() {
    window.location.href = 'C01.html';
  }

  function goNext() {
    window.location.href = 'C03.html';
  }

  // 초기 시작 시 첫 대화 로드
  window.onload = function() {
    updateDialogue();
  };
</script>

</body>
</html>
