<!-- 원본 크기: 1000x500 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인천어린이 박물관</title>
    <style>
        body { margin:0; padding:0; background:transparent; overflow:hidden; }
        svg { display:block; width:100%; height:auto; }
    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
        <defs>
            <!-- Gradients -->
            <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FDFBF7" />
                <stop offset="100%" stop-color="#E8E2D5" />
            </linearGradient>
            
            <linearGradient id="brickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#D96B43" />
                <stop offset="100%" stop-color="#B04A27" />
            </linearGradient>

            <linearGradient id="yellowSignGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FFEB3B" />
                <stop offset="100%" stop-color="#FBC02D" />
            </linearGradient>

            <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#81D4FA" stop-opacity="0.8" />
                <stop offset="50%" stop-color="#29B6F6" stop-opacity="0.6" />
                <stop offset="100%" stop-color="#0288D1" stop-opacity="0.9" />
            </linearGradient>

            <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#455A64" />
                <stop offset="100%" stop-color="#263238" />
            </linearGradient>

            <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FF7043" />
                <stop offset="50%" stop-color="#FFA726" />
                <stop offset="100%" stop-color="#26A69A" />
            </linearGradient>

            <!-- Drop Shadows -->
            <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
            </filter>
            
            <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2"/>
            </filter>

            <!-- Pattern for Brickwork -->
            <pattern id="brickPattern" width="20" height="10" patternUnits="userSpaceOnUse">
                <rect width="20" height="10" fill="none" stroke="#A03D1B" stroke-width="0.5"/>
                <line x1="0" y1="5" x2="20" y2="5" stroke="#A03D1B" stroke-width="0.5"/>
                <line x1="10" y1="0" x2="10" y2="5" stroke="#A03D1B" stroke-width="0.5"/>
                <line x1="0" y1="5" x2="0" y2="10" stroke="#A03D1B" stroke-width="0.5"/>
            </pattern>
        </defs>

        <!-- Main Building Structure -->
        <g id="museum-building">
            <!-- Roof Parapet / Top Trim -->
            <path d="M 50,80 L 950,80 L 950,95 L 50,95 Z" fill="url(#roofGrad)" />
            <path d="M 40,75 L 960,75 L 960,83 L 40,83 Z" fill="#37474F" />

            <!-- Decorative Playful Roof Elements (Colorful Spheres/Flags on Top) -->
            <g id="roof-decorations">
                <!-- Left Playful Tower -->
                <rect x="120" y="40" width="30" height="40" fill="#EC407A" />
                <polygon points="120,40 135,15 150,40" fill="#AB47BC" />
                <!-- Center Playful Arch Dome -->
                <path d="M 420,80 A 80,50 0 0,1 580,80 Z" fill="url(#domeGrad)" filter="url(#softShadow)"/>
                <circle cx="500" cy="25" r="12" fill="#FFCA28" />
                <!-- Right Playful Blocks -->
                <rect x="820" y="45" width="25" height="35" fill="#26A69A" />
                <polygon points="820,45 832.5,20 845,45" fill="#FFA726" />
            </g>

            <!-- Main Wall Structure -->
            <!-- Main Central & Side Walls -->
            <rect x="60" y="95" width="880" height="385" rx="8" fill="url(#wallGrad)" stroke="#B0BEC5" stroke-width="2"/>
            
            <!-- Lower Accent Brick Base -->
            <rect x="60" y="320" width="880" height="160" fill="url(#brickGrad)" />
            <rect x="60" y="320" width="880" height="160" fill="url(#brickPattern)" opacity="0.4" />
            <line x1="60" y1="320" x2="940" y2="320" stroke="#8D2B0F" stroke-width="4"/>

            <!-- Decorative Columns / Pillars on Facade -->
            <g id="columns" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1">
                <rect x="80" y="95" width="35" height="225" />
                <rect x="220" y="95" width="30" height="225" />
                <rect x="750" y="95" width="30" height="225" />
                <rect x="885" y="95" width="35" height="225" />
            </g>

            <!-- Windows - Second Floor (Upper Level) -->
            <g id="upper-windows">
                <!-- Left Window Set -->
                <rect x="130" y="125" width="70" height="110" rx="35" fill="url(#glassGrad)" stroke="#37474F" stroke-width="3"/>
                <line x1="165" y1="125" x2="165" y2="235" stroke="#FFF" stroke-width="2"/>
                <line x1="130" y1="180" x2="200" y2="180" stroke="#FFF" stroke-width="2"/>

                <!-- Left-Center Windows -->
                <rect x="270" y="130" width="110" height="90" fill="url(#glassGrad)" stroke="#37474F" stroke-width="3"/>
                <line x1="325" y1="130" x2="325" y2="220" stroke="#FFF" stroke-width="2"/>
                <line x1="270" y1="175" x2="380" y2="175" stroke="#FFF" stroke-width="2"/>

                <!-- Right-Center Windows -->
                <rect x="620" y="130" width="110" height="90" fill="url(#glassGrad)" stroke="#37474F" stroke-width="3"/>
                <line x1="675" y1="130" x2="675" y2="220" stroke="#FFF" stroke-width="2"/>
                <line x1="620" y1="175" x2="730" y2="175" stroke="#FFF" stroke-width="2"/>

                <!-- Right Window Set -->
                <rect x="800" y="125" width="70" height="110" rx="35" fill="url(#glassGrad)" stroke="#37474F" stroke-width="3"/>
                <line x1="835" y1="125" x2="835" y2="235" stroke="#FFF" stroke-width="2"/>
                <line x1="800" y1="180" x2="870" y2="180" stroke="#FFF" stroke-width="2"/>
            </g>

            <!-- Windows - Lower Level (Brick Area) -->
            <g id="lower-windows">
                <rect x="110" y="350" width="120" height="80" rx="5" fill="url(#glassGrad)" stroke="#5D4037" stroke-width="3"/>
                <line x1="170" y1="350" x2="170" y2="430" stroke="#FFF" stroke-width="2"/>

                <rect x="770" y="350" width="120" height="80" rx="5" fill="url(#glassGrad)" stroke="#5D4037" stroke-width="3"/>
                <line x1="830" y1="350" x2="830" y2="430" stroke="#FFF" stroke-width="2"/>
            </g>

            <!-- Playful Colored Frames / Wall Accents -->
            <g id="playful-accents">
                <circle cx="260" cy="280" r="18" fill="#FF5252" />
                <circle cx="260" cy="280" r="10" fill="#FFF" />
                <circle cx="740" cy="280" r="18" fill="#448AFF" />
                <circle cx="740" cy="280" r="10" fill="#FFF" />
            </g>

            <!-- MAIN ENTRANCE STRUCTURE (Center) -->
            <g id="main-entrance">
                <!-- Entrance Canopy Frame -->
                <rect x="380" y="240" width="240" height="240" fill="#ECEFF1" stroke="#78909C" stroke-width="2"/>
                
                <!-- Glass Doors -->
                <rect x="400" y="330" width="200" height="150" fill="url(#glassGrad)" stroke="#263238" stroke-width="3"/>
                <!-- Door frames -->
                <line x1="500" y1="330" x2="500" y2="480" stroke="#263238" stroke-width="3"/>
                <line x1="450" y1="330" x2="450" y2="480" stroke="#455A64" stroke-width="1.5"/>
                <line x1="550" y1="330" x2="550" y2="480" stroke="#455A64" stroke-width="1.5"/>
                <!-- Door Handles -->
                <rect x="485" y="400" width="6" height="30" rx="2" fill="#CFD8DC" stroke="#37474F"/>
                <rect x="509" y="400" width="6" height="30" rx="2" fill="#CFD8DC" stroke="#37474F"/>

                <!-- Ground Entrance Steps Base -->
                <path d="M 360,480 L 640,480 L 650,495 L 350,495 Z" fill="#B0BEC5" stroke="#78909C"/>

                <!-- [매우 중요 요구사항 1] 입구쪽 노란 띠 (영어: INCHEON CHILDREN'S MUSEUM) -->
                <g id="yellow-ribbon-english" filter="url(#dropShadow)">
                    <!-- Yellow Ribbon/Band -->
                    <rect x="370" y="295" width="260" height="28" rx="4" fill="url(#yellowSignGrad)" stroke="#F57F17" stroke-width="1.5"/>
                    <!-- Inner Border Detail -->
                    <rect x="374" y="298" width="252" height="22" rx="2" fill="none" stroke="#FBC02D" stroke-width="1"/>
                    <!-- English Text -->
                    <text x="500" y="314" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="12" fill="#1A237E" text-anchor="middle" letter-spacing="1">INCHEON CHILDREN'S MUSEUM</text>
                </g>
            </g>

            <!-- [매우 중요 요구사항 2] 노란색 메인 간판 ("인천어린이 박물관" + 손바닥 로고) -->
            <g id="main-yellow-sign" filter="url(#dropShadow)">
                <!-- Main Signboard Background -->
                <rect x="330" y="105" width="340" height="85" rx="12" fill="url(#yellowSignGrad)" stroke="#F57C00" stroke-width="3"/>
                <!-- Outer decorative border -->
                <rect x="335" y="110" width="330" height="75" rx="8" fill="none" stroke="#FFF" stroke-width="2" stroke-dasharray="6,4"/>

                <!-- Handprint Icon (손바닥 그림 - Colorful Playful Hand) -->
                <g id="handprint-icon" transform="translate(350, 118) scale(0.85)">
                    <!-- Palm Base -->
                    <path d="M 30,35 C 25,25 35,20 42,28 C 45,20 55,18 58,27 C 62,18 72,20 72,29 C 75,23 83,27 80,35 C 82,42 78,55 65,62 C 55,67 35,62 30,50 Z" fill="#FF4081" />
                    <!-- Palm Center -->
                    <ellipse cx="52" cy="45" rx="16" ry="14" fill="#FFEB3B" />
                    <!-- Colorful Fingers -->
                    <!-- Thumb -->
                    <path d="M 22,38 C 12,32 18,20 28,26 Z" fill="#FF5252"/>
                    <!-- Index Finger -->
                    <path d="M 33,26 C 30,12 42,10 44,24 Z" fill="#FF9800"/>
                    <!-- Middle Finger -->
                    <path d="M 48,22 C 48,8 60,8 60,22 Z" fill="#4CAF50"/>
                    <!-- Ring Finger -->
                    <path d="M 62,24 C 64,12 76,14 73,27 Z" fill="#1E88E5"/>
                    <!-- Little Finger -->
                    <path d="M 74,32 C 82,24 88,34 79,40 Z" fill="#9C27B0"/>
                </g>

                <!-- Korean Text ("인천어린이 박물관") -->
                <text x="535" y="158" font-family="'Nanum Gothic', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-weight="900" font-size="28" fill="#0D47A1" text-anchor="middle" letter-spacing="0">인천어린이 박물관</text>
                <!-- Text Shadow/Highlight effect -->
                <text x="536" y="159" font-family="'Nanum Gothic', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-weight="900" font-size="28" fill="#1565C0" text-anchor="middle" opacity="0.3" letter-spacing="0">인천어린이 박물관</text>
            </g>

            <!-- Decorative Entrance Clock / Banner Top -->
            <circle cx="500" cy="78" r="16" fill="#FFF" stroke="#FF9800" stroke-width="3"/>
            <path d="M 500,68 L 500,78 L 507,78" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
    </svg>
</body>
</html>
