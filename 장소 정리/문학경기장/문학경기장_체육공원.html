<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>문학경기장 - 체육공원</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .sp-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="sp-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="체육공원">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfe1f4"/><stop offset="100%" stop-color="#eef7fc"/></linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a4cb8e"/><stop offset="100%" stop-color="#7fae6c"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="440" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="250" cy="80" rx="76" ry="22"/><ellipse cx="940" cy="66" rx="84" ry="24"/></g>

  <!-- 원경 문학산/스타디움 -->
  <path d="M0,440 Q200,320 420,440 Z" fill="#9ab98a" opacity="0.6"/>
  <path d="M780,440 Q1000,330 1200,440 Z" fill="#9ab98a" opacity="0.6"/>
  <g opacity="0.55">
    <path d="M540,392 Q660,340 780,392 L780,440 L540,440 Z" fill="#c3ccd3"/>
    <path d="M540,394 Q660,344 780,394" fill="none" stroke="#8fa8b6" stroke-width="5"/>
    <g stroke="#8fa8b6" stroke-width="3"><line x1="570" y1="380" x2="570" y2="440"/><line x1="620" y1="364" x2="620" y2="440"/><line x1="700" y1="364" x2="700" y2="440"/><line x1="750" y1="380" x2="750" y2="440"/></g>
  </g>

  <!-- 잔디 -->
  <rect x="0" y="440" width="1200" height="280" fill="url(#lawn)"/>
  <!-- 산책로(우레탄 트랙) -->
  <path d="M0,520 Q600,470 1200,520 L1200,570 Q600,520 0,570 Z" fill="#d98a6a"/>
  <path d="M0,545 Q600,495 1200,545" fill="none" stroke="#f2ead3" stroke-width="3" stroke-dasharray="18 14"/>

  <!-- 농구코트 -->
  <g transform="translate(280,640)">
    <rect x="-220" y="-52" width="440" height="110" rx="10" fill="#7aa8c0" stroke="#5a8aa4" stroke-width="4"/>
    <circle cx="0" cy="4" r="34" fill="none" stroke="#f2f5f8" stroke-width="3.5"/>
    <line x1="0" y1="-52" x2="0" y2="58" stroke="#f2f5f8" stroke-width="3.5"/>
    <!-- 골대 -->
    <g transform="translate(-196,-52)">
      <line x1="0" y1="0" x2="0" y2="-66" stroke="#5b6670" stroke-width="7"/>
      <rect x="-4" y="-96" width="42" height="30" fill="#f2f5f8" stroke="#5b6670" stroke-width="3"/>
      <rect x="8" y="-74" width="18" height="12" fill="none" stroke="#e05e2b" stroke-width="3"/>
      <path d="M8,-62 L26,-62 L22,-46 L12,-46 Z" fill="none" stroke="#c3ccd3" stroke-width="2"/>
    </g>
    <!-- 드리블하는 사람 -->
    <g><circle cx="60" cy="-14" r="9" fill="#e8c9a8"/><rect x="52" y="-6" width="16" height="26" rx="6" fill="#e05e2b"/><circle cx="84" cy="26" r="8" fill="#d97a2b" stroke="#a8551a" stroke-width="2"/></g>
  </g>

  <!-- 야외운동기구 -->
  <g transform="translate(760,610)">
    <!-- 공중걷기 -->
    <line x1="0" y1="30" x2="0" y2="-64" stroke="#2f855a" stroke-width="8"/>
    <line x1="-28" y1="-64" x2="28" y2="-64" stroke="#2f855a" stroke-width="6"/>
    <g stroke="#5b6670" stroke-width="4"><line x1="-18" y1="-60" x2="-26" y2="6"/><line x1="18" y1="-60" x2="26" y2="6"/></g>
    <g fill="#ffcf4a" stroke="#d9a32b" stroke-width="2.5"><rect x="-36" y="2" width="22" height="10" rx="4"/><rect x="14" y="2" width="22" height="10" rx="4"/></g>
    <g><circle cx="-22" cy="-38" r="8" fill="#e8c9a8"/><rect x="-29" y="-31" width="14" height="24" rx="5" fill="#2b6cb0"/></g>
  </g>
  <g transform="translate(880,616)">
    <!-- 허리돌리기 -->
    <line x1="0" y1="26" x2="0" y2="-52" stroke="#c0392b" stroke-width="8"/>
    <circle cx="0" cy="-52" r="16" fill="none" stroke="#c0392b" stroke-width="6"/>
    <ellipse cx="0" cy="22" rx="26" ry="8" fill="#8a949b"/>
  </g>
  <g transform="translate(1000,610)">
    <!-- 철봉 3단 -->
    <g stroke="#2b6cb0" stroke-width="7" stroke-linecap="round">
      <line x1="-44" y1="30" x2="-44" y2="-70"/><line x1="8" y1="30" x2="8" y2="-52"/><line x1="60" y1="30" x2="60" y2="-34"/>
      <line x1="-44" y1="-70" x2="8" y2="-70"/><line x1="8" y1="-52" x2="60" y2="-52"/>
    </g>
    <!-- 매달린 사람 -->
    <g><circle cx="-18" cy="-56" r="8" fill="#e8c9a8"/><rect x="-25" y="-49" width="14" height="24" rx="5" fill="#6b46c1"/><line x1="-26" y1="-66" x2="-30" y2="-70" stroke="#e8c9a8" stroke-width="4"/><line x1="-10" y1="-66" x2="-6" y2="-70" stroke="#e8c9a8" stroke-width="4"/></g>
  </g>

  <!-- 나무 -->
  <g transform="translate(90,470)"><rect x="-7" y="0" width="14" height="52" fill="#6a4a2c"/><circle cy="-18" r="40" fill="#5aa653"/><circle cx="-26" cy="4" r="26" fill="#69b55f"/><circle cx="26" cy="4" r="26" fill="#69b55f"/></g>
  <g transform="translate(1130,468)"><rect x="-7" y="0" width="14" height="52" fill="#6a4a2c"/><circle cy="-18" r="40" fill="#5aa653"/><circle cx="-26" cy="4" r="26" fill="#69b55f"/><circle cx="26" cy="4" r="26" fill="#69b55f"/></g>

  <!-- 조깅하는 사람들 -->
  <g><circle cx="480" cy="500" r="9" fill="#e8c9a8"/><rect x="472" y="508" width="16" height="24" rx="6" fill="#c0392b"/></g>
  <g><circle cx="900" cy="508" r="9" fill="#e8c9a8"/><rect x="892" y="516" width="16" height="24" rx="6" fill="#2f855a"/></g>

  <!-- 사인 -->
  <g transform="translate(600,690)">
    <rect x="-86" y="-22" width="172" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#2f855a" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#1f5d3e">체육공원</text>
  </g>
</svg>
</body>
</html>
