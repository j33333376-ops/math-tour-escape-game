<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신포국제시장 - F02</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 16:9 비율 유지 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #f5f0e6;
            border: 2px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            user-select: none;
        }

        /* 배경 이미지 */
        #bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 상단 스테이지 바 */
        #stage-header {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 10;
            padding: 8px 18px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid #d4af37;
            border-radius: 4px;
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        /* 캐릭터 래퍼 공통 스타일 */
        .char-wrapper {
            position: absolute;
            bottom: 30px;
            width: 260px;
            height: 320px;
            z-index: 3;
            overflow: visible;
            transition: all 1s ease, filter 0.2s ease;
            filter: brightness(1);
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        #char-민우 {
            left: 140px;
        }

        #char-서연 {
            right: 140px;
        }

        /* 하단 대화창 UI */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            height: 145px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #d4af37;
            border-radius: 6px;
            z-index: 10;
            padding: 16px 24px;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
        }

        #dialogue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            color: #d4af37;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.03em;
        }

        #click-prompt {
            font-size: 12px;
            color: #d4af37;
            opacity: 0.8;
            font-family: 'Noto Sans KR', sans-serif;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: -0.02em;
            color: #f0f0f0;
            margin-top: 6px;
            flex-grow: 1;
        }

        /* 공통 이동 버튼 */
        .btn-nav {
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: 700;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            outline: none;
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        .btn-nav:active {
            transform: scale(0.96);
        }

        #btn-prev {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 12;
            display: none;
        }

        #btn-next {
            position: absolute;
            right: 20px;
            bottom: 20px;
            z-index: 12;
            display: none;
        }

        #btn-skip {
            position: absolute;
            right: 20px;
            bottom: 20px;
            z-index: 11;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 배경 이미지 -->
    <img src="효율적인암벽등반.png" id="bg-img" alt="문학경기장 인공암벽장 배경">

    <!-- 상단 스테이지 바 -->
    <div id="stage-header">
        신포국제시장 | 문학경기장 인공암벽장
    </div>

    <!-- 등장인물: 민우 -->
    <div class="char-wrapper" id="char-민우">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 등장인물: 서연 -->
    <div class="char-wrapper" id="char-서연">
        <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform: scaleX(-1); transform-origin:bottom center; pointer-events:none;"></iframe>
    </div>

    <!-- 하단 대화창 -->
    <div id="dialogue-box" onclick="advanceDialogue()">
        <div id="dialogue-header">
            <span id="speaker-name">민우</span>
            <span id="click-prompt">▼ 클릭하여 계속</span>
        </div>
        <div id="dialogue-text">대사를 로딩 중입니다...</div>
    </div>

    <!-- 건너뛰기 및 이동 버튼 -->
    <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
    <button id="btn-prev" class="btn-nav" onclick="navigateTo('F02.html')">이전</button>
    <button id="btn-next" class="btn-nav" onclick="navigateTo('F03.html')">다음</button>
</div>

<script>
    // 대화 스크립트 데이터
    const dialogues = [
        {
            speaker: "민우",
            text: "드디어 문학경기장에 있는 인공암벽등반 장소에 도착했어!",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "우와, 생각보다 정말 높고 거대하다! 이곳에도 수학적인 요소가 들어있을까?",
            target: "char-서연"
        },
        {
            speaker: "민우",
            text: "당연하지! 암벽의 홀드를 따라 올라가는 여러 최적 경로를 계산하는 과정에 '경우의 수' 규칙이 적용되어 있어.",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "맞아! 특정 홀드들을 거쳐 정상까지 가는 최단 경로의 수나 규칙을 파악하는 게 핵심이야.",
            target: "char-서연"
        },
        {
            speaker: "민우",
            text: "이 경우의 수 문제를 어떻게 해결할지 고민이었는데... 서연아, 우리 예전에 2x2 길을 이용한 문제를 해결했던 경험 기억나?",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "그럼 기억하지! 격자판에서 오른쪽과 위쪽으로 이동하는 최단 경로의 수 원리를 적용했었잖아.",
            target: "char-서연"
        },
        {
            speaker: "민우",
            text: "응! 그때 떠올린 2x2 경험을 확장하면, 이번 3x3 단계 길 찾기 문제도 충분히 풀어낼 수 있을 거야.",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "좋아! 그럼 더 망설이지 말고 3x3 단계 길 찾기 문제로 이동해서 도전해보자!",
            target: "char-서연"
        }
    ];

    let currentIndex = 0;
    let isEnding = false;

    // 현재 대화 및 발화자 하이라이트 갱신
    function renderDialogue() {
        if (currentIndex >= dialogues.length) {
            endDialogue();
            return;
        }

        const current = dialogues[currentIndex];
        document.getElementById("speaker-name").innerText = current.speaker;
        document.getElementById("dialogue-text").innerText = current.text;

        const minwoo = document.getElementById("char-민우");
        const seoyeon = document.getElementById("char-서연");

        if (current.target === "char-민우") {
            minwoo.classList.remove("inactive");
            seoyeon.classList.add("inactive");
        } else {
            seoyeon.classList.remove("inactive");
            minwoo.classList.add("inactive");
        }
    }

    // 다음 대화 진행
    function advanceDialogue() {
        if (isEnding) return;
        currentIndex++;
        renderDialogue();
    }

    // 대화 건너뛰기
    function skipDialogue() {
        if (isEnding) return;
        endDialogue();
    }

    // 대화 종료 및 퇴장 연출
    function endDialogue() {
        isEnding = true;

        // UI 숨기기
        document.getElementById("dialogue-box").style.display = "none";
        document.getElementById("btn-skip").style.display = "none";

        const minwoo = document.getElementById("char-민우");
        const seoyeon = document.getElementById("char-서연");

        // 명암 복구
        minwoo.classList.remove("inactive");
        seoyeon.classList.remove("inactive");

        // 중앙으로 이동하면서 사라지는 연출
        minwoo.style.left = "calc(50% - 150px)";
        minwoo.style.opacity = "0";

        seoyeon.style.right = "calc(50% - 150px)";
        seoyeon.style.opacity = "0";

        // 애니메이션 완료 후 이동 버튼 표시
        setTimeout(() => {
            minwoo.style.display = "none";
            seoyeon.style.display = "none";
            document.getElementById("btn-prev").style.display = "block";
            document.getElementById("btn-next").style.display = "block";
        }, 1000);
    }

    //페이지 이동 함수
    function navigateTo(url) {
        window.location.href = url;
    }

    // 초기 실행
    window.onload = function() {
        renderDialogue();
    };
</script>

</body>
</html>
