<!-- 원본 크기: 1000x500 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어린이박물관내부공룡</title>
    <style>
        body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
        svg { display: block; width: 100%; height: auto; }
    </style>
</head>
<body>
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 선형/방사형 그라데이션 정의 -->
            <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2D3B36" />
                <stop offset="50%" stop-color="#1F2926" />
                <stop offset="100%" stop-color="#141C19" />
            </linearGradient>

            <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#8C7A6B" />
                <stop offset="100%" stop-color="#5E4E42" />
            </linearGradient>

            <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.8" />
                <stop offset="50%" stop-color="#80DEEA" stop-opacity="0.5" />
                <stop offset="100%" stop-color="#00ACC1" stop-opacity="0.3" />
            </linearGradient>

            <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFFDE7" stop-opacity="0.4" />
                <stop offset="100%" stop-color="#FFFDE7" stop-opacity="0" />
            </radialGradient>

            <linearGradient id="trexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8D6E63" />
                <stop offset="50%" stop-color="#5D4037" />
                <stop offset="100%" stop-color="#3E2723" />
            </linearGradient>

            <linearGradient id="brachioGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#6B8E23" />
                <stop offset="50%" stop-color="#556B2F" />
                <stop offset="100%" stop-color="#2E3B14" />
            </linearGradient>

            <linearGradient id="triceraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#D7CCC8" />
                <stop offset="50%" stop-color="#A1887F" />
                <stop offset="100%" stop-color="#795548" />
            </linearGradient>

            <linearGradient id="pteroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFB74D" />
                <stop offset="100%" stop-color="#E65100" />
            </linearGradient>

            <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#A1887F" />
                <stop offset="100%" stop-color="#4E342E" />
            </linearGradient>

            <!-- 그림자 필터 -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
            </filter>
        </defs>

        <!-- [1] 박물관 내 전시관 기본 파사드 구조 (메인 건물 프레임) -->
        <g filter="url(#shadow)">
            <!-- 외곽 현대식 전시관 테두리 및 벽면 -->
            <polygon points="20,480 20,80 200,30 800,30 980,80 980,480" fill="url(#wallGrad)" stroke="#455A64" stroke-width="4"/>
            
            <!-- 유리 천장 지붕 구조 (아치형 서포터) -->
            <path d="M 200,30 Q 500,0 800,30 L 780,70 Q 500,45 220,70 Z" fill="#37474F" />
            <!-- 유리 패널 돔 -->
            <path d="M 220,70 Q 500,45 780,70 L 760,110 Q 500,85 240,110 Z" fill="url(#glassGrad)" />
            <path d="M 300,60 L 290,103 M 400,50 L 395,97 M 500,45 L 500,95 M 600,50 L 605,97 M 700,60 L 710,103" stroke="#263238" stroke-width="2"/>

            <!-- 내부 전시 바닥면 (디오라마 데크) -->
            <polygon points="50,470 70,360 930,360 950,470" fill="url(#floorGrad)" />
            <!-- 데크 경계 박물관 펜스/난간 -->
            <rect x="50" y="460" width="900" height="15" fill="#D7CCC8" rx="3"/>
            <path d="M 60,460 L 60,420 M 200,460 L 200,420 M 350,460 L 350,420 M 500,460 L 500,420 M 650,460 L 650,420 M 800,460 L 800,420 M 940,460 L 940,420" stroke="#8D6E63" stroke-width="4"/>
            <line x1="50" y1="425" x2="950" y2="425" stroke="#A1887F" stroke-width="3"/>
        </g>

        <!-- [2] 박물관 내 박식/안내판 및 조명 (건축 디테일) -->
        <!-- 천장 스폿조명 -->
        <g stroke="#78909C" stroke-width="3">
            <line x1="250" y1="80" x2="250" y2="130" />
            <line x1="500" y1="70" x2="500" y2="120" />
            <line x1="750" y1="80" x2="750" y2="130" opacity="0.9"/>
        </g>
        <!-- 조명 갓 및 빛 내림 효과 -->
        <path d="M 235,130 L 265,130 L 275,145 L 225,145 Z" fill="#455A64" />
        <polygon points="225,145 275,145 380,440 120,440" fill="url(#spotlight)" />

        <path d="M 485,120 L 515,120 L 525,135 L 475,135 Z" fill="#455A64" />
        <polygon points="475,135 525,135 680,440 320,440" fill="url(#spotlight)" />

        <path d="M 735,130 L 765,130 L 775,145 L 725,145 Z" fill="#455A64" />
        <polygon points="725,145 775,145 880,440 620,440" fill="url(#spotlight)" />

        <!-- 전시관 박물관 타이틀 플래카드 (상단) -->
        <rect x="360" y="80" width="280" height="40" rx="8" fill="#1B5E20" stroke="#81C784" stroke-width="2"/>
        <text x="500" y="106" font-family="'Comic Sans MS', 'Pretendard', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🦕 DINO ADVENTURE 🌿</text>

        <!-- [3] 공룡 시대 원시 식생 및 바위 디오라마 (풀, 화산 지형 모형) -->
        <!-- 배경 화산 모형 (전시용) -->
        <polygon points="720,360 780,240 820,240 880,360" fill="#4E342E" />
        <polygon points="780,240 800,220 820,240 800,250" fill="#D84315" /> <!-- 용암 표현 -->
        <path d="M 790,240 Q 780,270 775,300 M 810,240 Q 820,280 825,320" stroke="#FF5722" stroke-width="3" fill="none"/>

        <!-- 암석 및 흙더미 -->
        <path d="M 90,370 Q 140,330 200,365 Q 260,340 320,370 Z" fill="#6D4C41" />
        <path d="M 550,370 Q 620,320 700,365 Q 760,350 820,375 Z" fill="#5D4037" />

        <!-- 원시 거대 양치식물 & 열대 풀 (여러 레이어) -->
        <!-- 왼쪽 거대 양치식물 숲 -->
        <g fill="#2E7D32">
            <!-- 고사리 잎 1 -->
            <path d="M 110,360 Q 60,300 30,220 Q 80,260 120,350 Z" />
            <path d="M 120,360 Q 80,270 70,180 Q 110,240 130,350 Z" fill="#388E3C" />
            <path d="M 130,360 Q 130,260 160,170 Q 160,250 140,350 Z" fill="#4CAF50" />
            <path d="M 140,360 Q 180,280 230,220 Q 190,270 145,360 Z" fill="#1B5E20" />
        </g>

        <!-- 중앙/오른쪽 소세지나무 및 고사리 포기들 -->
        <g fill="#43A047">
            <!-- 소철나무 1 -->
            <rect x="620" y="270" width="20" height="90" rx="5" fill="url(#woodGrad)"/>
            <path d="M 630,270 Q 560,220 530,210 Q 580,240 625,270 Z" fill="#2E7D32"/>
            <path d="M 630,270 Q 600,200 600,170 Q 620,210 630,270 Z" fill="#388E3C"/>
            <path d="M 630,270 Q 660,190 680,170 Q 660,210 635,270 Z" fill="#4CAF50"/>
            <path d="M 630,270 Q 700,220 730,220 Q 670,250 635,270 Z" fill="#1B5E20"/>

            <!-- 바닥 풀 세밀 요소 -->
            <path d="M 280,365 C 260,330 230,320 220,310 C 240,325 270,340 285,365 Z" fill="#66BB6A"/>
            <path d="M 300,365 C 310,320 330,300 350,290 C 330,315 315,335 305,365 Z" fill="#81C784"/>
            <path d="M 450,365 Q 430,310 400,290 Q 430,330 455,365 Z" fill="#2E7D32"/>
            <path d="M 470,365 Q 490,300 520,280 Q 490,320 475,365 Z" fill="#388E3C"/>
            <path d="M 850,370 Q 880,310 920,290 Q 880,330 855,370 Z" fill="#1B5E20"/>
        </g>


        <!-- [4] 주요 공룡 모형 개체들 -->

        <!-- 공룡 1: 익룡 (프테라노돈) - 천장에 줄로 달린 전시 모형 -->
        <g filter="url(#shadow)">
            <!-- 와이어 줄 -->
            <line x1="380" y1="70" x2="380" y2="160" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="4,2"/>
            <line x1="440" y1="70" x2="420" y2="160" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="4,2"/>

            <!-- 익룡 본체 -->
            <!-- 날개 -->
            <polygon points="380,170 300,130 350,185 380,180" fill="url(#pteroGrad)"/>
            <polygon points="400,170 480,140 430,190 395,180" fill="url(#pteroGrad)"/>
            <!-- 몸통 & 머리 -->
            <path d="M 380,175 Q 390,160 395,145 L 415,140 L 398,155 L 395,185 Q 388,195 380,175 Z" fill="#E65100"/>
            <!-- 벼슬 및 주둥이 -->
            <polygon points="395,145 425,140 400,150" fill="#BF360C"/>
            <!-- 눈 -->
            <circle cx="394" cy="148" r="2" fill="#FFF"/>
            <circle cx="394" cy="148" r="1" fill="#000"/>
        </g>


        <!-- 공룡 2: 브라키오사우루스 (대형 목 긴 공룡) - 중앙/우측 배경 -->
        <g id="brachiosaurus">
            <!-- 꼬리 -->
            <path d="M 830,310 Q 900,280 940,240 Q 910,300 810,340 Z" fill="url(#brachioGrad)"/>
            <!-- 뒷다리 & 앞다리 -->
            <rect x="790" y="310" width="35" height="90" rx="10" fill="#3B4D1A"/>
            <rect x="730" y="300" width="38" height="100" rx="10" fill="#556B2F"/>
            <rect x="830" y="300" width="30" height="95" rx="8" fill="#2E3B14"/>
            <rect x="680" y="290" width="35" height="110" rx="10" fill="#556B2F"/>
            <!-- 몸통 -->
            <ellipse cx="760" cy="300" rx="80" ry="50" fill="url(#brachioGrad)"/>
            <!-- 긴 목 & 머리 -->
            <path d="M 700,280 C 670,220 630,140 600,100 C 620,95 640,110 655,120 C 690,180 730,240 750,270 Z" fill="url(#brachioGrad)"/>
            <!-- 머리 -->
            <path d="M 600,100 Q 580,90 560,100 Q 550,115 580,120 Q 610,120 620,110 Z" fill="#6B8E23"/>
            <!-- 눈 & 콧구멍 -->
            <circle cx="575" cy="102" r="2.5" fill="#FFF"/>
            <circle cx="575" cy="102" r="1.2" fill="#000"/>
            <!-- 등 무늬 -->
            <path d="M 720,260 Q 750,250 780,270" stroke="#8FBC8F" stroke-width="4" fill="none" opacity="0.6"/>
            <path d="M 740,280 Q 770,270 800,290" stroke="#8FBC8F" stroke-width="4" fill="none" opacity="0.6"/>
        </g>


        <!-- 공룡 3: 티라노사우루스 렉스 (T-Rex) - 좌측/중앙 포효하는 모형 -->
        <g id="trex" filter="url(#shadow)">
            <!-- 꼬리 -->
            <path d="M 280,290 Q 200,270 130,240 Q 180,300 260,330 Z" fill="url(#trexGrad)"/>
            <!-- 왼쪽 뒷다리 (배경) -->
            <path d="M 230,320 Q 210,360 220,410 L 245,410 Q 240,370 260,330 Z" fill="#3E2723"/>
            <!-- 몸통 -->
            <ellipse cx="310" cy="300" rx="65" ry="45" transform="rotate(-15 310 300)" fill="url(#trexGrad)"/>
            <!-- 오른쪽 뒷다리 (전면) -->
            <path d="M 290,310 Q 270,360 285,420 L 315,420 Q 310,360 330,320 Z" fill="#5D4037"/>
            <path d="M 285,415 L 265,425 L 315,425 Z" fill="#3E2723"/> <!-- 발가락 -->
            <!-- 작은 앞다리 -->
            <path d="M 350,300 Q 370,310 375,325 L 365,328 L 345,310 Z" fill="#8D6E63"/>
            <!-- 목 & 큰 머리 -->
            <path d="M 330,270 L 380,210 L 420,230 L 360,290 Z" fill="url(#trexGrad)"/>
            <!-- 주둥이/머리 (벌린 입) -->
            <!-- 위 턱 -->
            <path d="M 375,215 L 450,200 L 440,225 L 390,235 Z" fill="#5D4037"/>
            <!-- 아래 턱 -->
            <path d="M 390,240 L 440,235 L 420,255 L 380,245 Z" fill="#3E2723"/>
            <!-- 빨간 입 내부 & 이빨 -->
            <polygon points="390,235 435,225 420,238" fill="#C62828"/>
            <path d="M 390,233 L 395,238 L 400,232 L 405,237 L 410,231 L 415,236 L 420,230" stroke="#FFF" stroke-width="2" fill="none"/>
            <!-- 눈 (날카로운 눈매) -->
            <circle cx="400" cy="215" r="3.5" fill="#FFD54F"/>
            <circle cx="400" cy="215" r="1.5" fill="#000"/>
            <!-- 피부 질감/무늬 -->
            <path d="M 270,290 Q 290,270 310,285" stroke="#3E2723" stroke-width="3" fill="none"/>
            <path d="M 290,310 Q 310,290 330,305" stroke="#3E2723" stroke-width="3" fill="none"/>
        </g>


        <!-- 공룡 4: 트리케라톱스 (뿔공룡) - 우측 하단 모형 -->
        <g id="triceratops">
            <!-- 꼬리 -->
            <path d="M 590,380 Q 640,370 670,360 Q 630,390 580,400 Z" fill="url(#triceraGrad)"/>
            <!-- 다리들 -->
            <rect x="470" y="380" width="22" height="50" rx="6" fill="#5D4037"/>
            <rect x="500" y="380" width="25" height="55" rx="6" fill="#795548"/>
            <rect x="560" y="380" width="22" height="48" rx="6" fill="#5D4037"/>
            <rect x="580" y="380" width="25" height="52" rx="6" fill="#795548"/>
            <!-- 몸통 -->
            <ellipse cx="540" cy="380" rx="55" ry="32" fill="url(#triceraGrad)"/>
            <!-- 프릴 (머리 뒤 뼈 장식) -->
            <path d="M 495,340 C 470,300 430,330 465,375 Z" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
            <!-- 머리 & 주둥이 -->
            <path d="M 485,360 L 435,375 L 455,400 L 490,390 Z" fill="#795548"/>
            <!-- 코 뿔 & 눈 위 뿔 2개 -->
            <polygon points="435,375 410,370 440,382" fill="#FFF8E1"/> <!-- 코뿔 -->
            <polygon points="465,350 425,325 455,358" fill="#FFF8E1"/> <!-- 눈위뿔 1 -->
            <!-- 눈 -->
            <circle cx="465" cy="365" r="2.5" fill="#3E2723"/>
        </g>


        <!-- [5] 어린이 박물관 전용 정보 인터랙티브 요소 (설명판 및 퀴즈 버튼) -->
        <!-- 티라노사우루스 설명판 -->
        <g stroke="#3E2723" stroke-width="2">
            <line x1="370" y1="410" x2="370" y2="455" />
            <rect x="320" y="420" width="100" height="30" rx="4" fill="#FFF8E1" />
            <text x="370" y="440" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" fill="#3E2723" text-anchor="middle" stroke="none">티라노사우루스</text>
        </g>

        <!-- 트리케라톱스 설명판 -->
        <g stroke="#3E2723" stroke-width="2">
            <line x1="510" y1="410" x2="510" y2="455" />
            <rect x="460" y="425" width="100" height="28" rx="4" fill="#FFF8E1" />
            <text x="510" y="443" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" fill="#3E2723" text-anchor="middle" stroke="none">트리케라톱스</text>
        </g>

        <!-- 어린이 체험용 스탬프/터치 버튼 포스트 -->
        <circle cx="210" cy="435" r="14" fill="#FF5252" stroke="#FFF" stroke-width="2" filter="url(#shadow)"/>
        <text x="210" y="440" font-family="sans-serif" font-size="12" fill="#FFF" font-weight="bold" text-anchor="middle">TOUCH</text>

        <!-- 공룡 알 모형 둥지 (전시 디테일) -->
        <g>
            <ellipse cx="660" cy="420" rx="25" ry="10" fill="#8D6E63"/>
            <ellipse cx="650" cy="417" rx="6" ry="8" fill="#F5F5F5" transform="rotate(-10 650 417)"/>
            <ellipse cx="662" cy="415" rx="6" ry="8" fill="#EEEEEE" transform="rotate(15 662 415)"/>
            <ellipse cx="670" cy="418" rx="5" ry="7" fill="#E0E0E0" transform="rotate(5 670 418)"/>
        </g>

    </svg>
</body>
</html>
