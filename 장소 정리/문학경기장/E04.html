<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문학경기장 MATHTOUR - E04</title>
  
  <!-- 폰트 설정: Pretendard, Roboto Mono -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap">

  <style>
    /* Reset & Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Pretendard', sans-serif;
      overflow: hidden;
    }

    /* 16:9 메인 스테이지 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background-color: #f8fafc;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
    }

    /* 배경 이미지 */
    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* 상단 진행률 헤더 바 */
    .top-header {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      height: 48px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }
    .top-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-title .badge {
      background: #2563eb;
      color: #ffffff;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: 'Roboto Mono', monospace;
    }
    .progress-bar-bg {
      width: 120px;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background: #10b981;
      border-radius: 4px;
    }

    /* 등장인물 Wrapper & iframe 규칙 */
    .char-wrapper {
      position: absolute;
      width: 260px;
      height: 320px;
      overflow: visible;
      z-index: 3;
      transition: filter 0.3s ease;
    }
    .char-wrapper iframe {
      border: 0;
      width: 260px;
      height: 320px;
      transform: scale(1);
      transform-origin: bottom left;
      pointer-events: none;
    }

    /* 환호하는 방방 뛰는 애니메이션 */
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-28px);
      }
    }
    .jumping {
      animation: bounce 0.6s infinite ease-in-out;
    }

    /* 공통 말풍선 기본 스타일 */
    .speech-bubble {
      position: absolute;
      background: #ffffff;
      color: #1e293b;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 5;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    /* 민우 머리 위 말풍선 (left 120px 인물 기준) */
    #bubble-민우 {
      left: 250px; /* 120px + (260px / 2) */
      bottom: 370px;
      transform: translateX(-50%);
    }
    #bubble-민우.active {
      opacity: 1;
      transform: translateX(-50%) translateY(-5px);
    }

    /* 서연 머리 위 말풍선 (right 120px, 너비 260px의 중앙인 right 250px 지점에 배치) */
    #bubble-서연 {
      right: 250px; /* 120px + (260px / 2) */
      bottom: 370px;
      transform: translateX(50%);
    }
    #bubble-서연.active {
      opacity: 1;
      transform: translateX(50%) translateY(-5px);
    }

    /* 대화 진행 전체 클릭 영역 */
    #click-area {
      position: absolute;
      inset: 0;
      z-index: 6;
      cursor: pointer;
    }

    /* 대화 완료 후 미션 성공 카드 */
    #success-card {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 2px solid #10b981;
      border-radius: 20px;
      padding: 32px 48px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 8;
    }
    #success-card.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    #success-card h2 {
      font-size: 26px;
      font-weight: 800;
      color: #10b981;
      margin-bottom: 8px;
    }
    #success-card p {
      font-size: 16px;
      color: #475569;
      font-weight: 600;
    }

    /* 공통 하단 이동 버튼 */
    .btn-nav {
      position: absolute;
      height: 44px;
      padding: 0 24px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Pretendard', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
      transition: background-color 0.2s, transform 0.1s;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-nav:hover {
      background: #1d4ed8;
    }
    .btn-nav:active {
      transform: scale(0.98);
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
    }
    #btn-next {
      right: 20px;
      bottom: 20px;
    }

    /* 대화 안내 오버레이 */
    .tap-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
      z-index: 7;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 1. 배경 이미지 -->
    <img src="박태환수영장외부.png" alt="박태환수영장 외부" class="bg-image">

    <!-- 2. 상단 헤더 바 -->
    <div class="top-header">
      <div class="top-title">
        <span class="badge">E04</span>
        <span>문학경기장 MATHTOUR - 최종 성공</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- 3. 대화 터치 영역 -->
    <div id="click-area" onclick="nextDialogue()"></div>

    <!-- 4. 등장인물 1: 민우 -->
    <div class="char-wrapper jumping" id="char-민우" style="left: 120px; bottom: 40px;">
      <iframe src="등장인물_민우.html" scrolling="no"></iframe>
    </div>

    <!-- 5. 등장인물 2: 서연 -->
    <div class="char-wrapper jumping" id="char-서연" style="right: 120px; bottom: 40px; animation-delay: 0.15s;">
      <iframe src="등장인물_서연.html" scrolling="no" style="transform: scale(1) scaleX(-1);"></iframe>
    </div>

    <!-- 6. 캐릭터 머리 위 독립 말풍선 -->
    <div class="speech-bubble" id="bubble-민우"></div>
    <div class="speech-bubble" id="bubble-서연"></div>

    <!-- 7. 화면 클릭 안내 힌트 -->
    <div class="tap-hint" id="tap-hint">화면을 클릭하여 대화를 진행하세요 💬</div>

    <!-- 8. 최종 미션 성공 카드 -->
    <div id="success-card">
      <h2>🎉 미션 성공!</h2>
      <p>다른 미션도 시도해볼까요?</p>
    </div>

    <!-- 9. 이동 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="goPrev()">이전</button>
    <button class="btn-nav" id="btn-next" onclick="goNext()">End</button>
  </div>

  <script>
    // 대화 스크립트 데이터
    const dialogues = [
      { speaker: "민우", text: "와! 드디어 결승점이다! 해냈어!" },
      { speaker: "서연", text: "축하해, 민우! 장애물을 하나도 놓치지 않고 정말 멋지게 통과했어!" },
      { speaker: "민우", text: "중간에 조금 힘들었는데 끝까지 포기하지 않아서 더 뿌듯해!\n진짜 박태환 선수가 된 기분이야!" },
      { speaker: "서연", text: "나도 정말 신났어! 장애물을 피하면서 헤엄치니까\n실제 수영 대회에 참가한 것처럼 긴장감도 있었어." },
      { speaker: "민우", text: "맞아! 순간 너무 짜릿했어!\n다음에는 더 빠르게 도전해서 내 기록도 깨보고 싶다!" },
      { speaker: "서연", text: "좋아! 우리 계속 연습해서 더 멋진 '박태환'이 되어 보자!" }
    ];

    let currentIndex = 0;

    const bubbleMinwoo = document.getElementById('bubble-민우');
    const bubbleSeoyeon = document.getElementById('bubble-서연');
    const wrapperMinwoo = document.getElementById('char-민우');
    const wrapperSeoyeon = document.getElementById('char-서연');
    const tapHint = document.getElementById('tap-hint');
    const clickArea = document.getElementById('click-area');
    const successCard = document.getElementById('success-card');

    // 화면 초기화 및 대화 출력
    function renderDialogue() {
      if (currentIndex < dialogues.length) {
        const current = dialogues[currentIndex];
        const formattedText = current.text.replace(/\n/g, '<br>');

        if (current.speaker === "민우") {
          bubbleMinwoo.innerHTML = formattedText;
          bubbleMinwoo.classList.add('active');
          bubbleSeoyeon.classList.remove('active');

          wrapperMinwoo.style.filter = "brightness(1)";
          wrapperSeoyeon.style.filter = "brightness(0.65)";
        } else if (current.speaker === "서연") {
          bubbleSeoyeon.innerHTML = formattedText;
          bubbleSeoyeon.classList.add('active');
          bubbleMinwoo.classList.remove('active');

          wrapperSeoyeon.style.filter = "brightness(1)";
          wrapperMinwoo.style.filter = "brightness(0.65)";
        }
      } else {
        // 모든 대화 종료 후
        bubbleMinwoo.classList.remove('active');
        bubbleSeoyeon.classList.remove('active');
        wrapperMinwoo.style.filter = "brightness(1)";
        wrapperSeoyeon.style.filter = "brightness(1)";
        
        clickArea.style.display = 'none';
        tapHint.style.display = 'none';

        // 성공 카드 노출
        successCard.classList.add('show');
      }
    }

    // 다음 대화 진행
    function nextDialogue() {
      currentIndex++;
      renderDialogue();
    }

    // 이전 장면 이동
    function goPrev() {
      window.location.href = "E03.html";
    }

    // 다음 장면 (End/메인) 이동
    function goNext() {
      window.location.href = "index.html";
    }

    // 로드 시 실행
    window.addEventListener('DOMContentLoaded', () => {
      renderDialogue();
    });
  </script>
</body>
</html>
