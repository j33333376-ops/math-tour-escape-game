<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신포국제시장 - 인공암벽등반 (F01)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      color: #2d3748;
    }

    /* 게임 컨테이너 (16:9 비율 고정) */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #f5f0e6;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 2px solid #d4af37;
    }

    /* 배경 이미지 */
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* 상단 스테이지 표시바 */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 10;
      background: rgba(20, 15, 10, 0.75);
      border: 1px solid #d4af37;
      padding: 8px 18px;
      border-radius: 4px;
      color: #d4af37;
      font-family: 'Nanum Myeongjo', serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    /* 상황 설명 박스 (양피지 / 오래된 종이 느낌) */
    .situation-box {
      position: absolute;
      top: 50%;
      left: 38%;
      transform: translate(-50%, -50%);
      width: 62%;
      max-height: 75%;
      background: #f5f0e6;
      border: 2px solid #8c3030;
      outline: 1px solid #d4af37;
      outline-offset: -5px;
      padding: 24px 28px;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 10;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .situation-title {
      font-family: 'Nanum Myeongjo', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #8c3030;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #d4af37;
    }

    .situation-content {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #2d3748;
      letter-spacing: -0.02em;
    }

    .situation-content p {
      margin-bottom: 10px;
    }

    .situation-content p strong {
      color: #8c3030;
    }

    /* 페이지 인디케이터 */
    .page-indicator {
      margin-top: auto;
      padding-top: 10px;
      text-align: right;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.85rem;
      color: #8c3030;
      font-weight: bold;
    }

    /* 등장인물 래퍼 */
    .char-wrapper {
      position: absolute;
      z-index: 3;
      overflow: visible;
    }

    /* 공통 버튼 디자인 */
    .btn-nav {
      position: absolute;
      z-index: 20;
      background-color: #8c3030;
      color: #ffffff;
      border: 1px solid #d4af37;
      border-radius: 4px;
      padding: 10px 24px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-nav:hover {
      background-color: #661f1f;
    }

    .btn-nav:active {
      transform: scale(0.98);
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
    }

    #btn-next {
      right: 20px;
      bottom: 20px;
    }

    /* 스크롤바 커스텀 (양피지 박스 내부) */
    .situation-box::-webkit-scrollbar {
      width: 6px;
    }
    .situation-box::-webkit-scrollbar-thumb {
      background: #8c3030;
      border-radius: 3px;
    }
    .situation-box::-webkit-scrollbar-track {
      background: #e8e1d5;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 배경 이미지 -->
    <img src="인공암벽등반.png" alt="인공암벽등반 배경" class="bg-img">

    <!-- 상단 스테이지 표시바 -->
    <div class="top-bar">신포국제시장 - 문학경기장 인공암벽등반</div>

    <!-- 상황 설명 글상자 -->
    <div class="situation-box" id="situation-box">
      <div class="situation-title" id="box-title">1. 장소 개요 및 코스 선정 이유</div>
      <div class="situation-content" id="box-content">
        <!-- 스크립트로 1장/2장 내용 동적 변경 -->
      </div>
      <div class="page-indicator" id="page-indicator">1 / 2</div>
    </div>

    <!-- 등장인물: 민우 (W: 260, H: 320, 오른쪽에 배치) -->
    <div class="char-wrapper" id="char-민우" style="left: 670px; bottom: 20px; width: 260px; height: 320px;">
      <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 등장인물: 서연 (W: 260, H: 320, 민우 우측에 겹치지 않게 배치) -->
    <div class="char-wrapper" id="char-서연" style="left: 810px; bottom: 20px; width: 260px; height: 320px;">
      <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 이동 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="handlePrev()">이전</button>
    <button class="btn-nav" id="btn-next" onclick="handleNext()">다음</button>
  </div>

  <script>
    // 2장에 걸친 상황 설명 데이터
    const storyPages = [
      {
        title: "1. 장소 개요 및 코스 선정 이유",
        content: `
          <p>인천 문학경기장은 축구, 육상 주경기장을 비롯해 야구장, 수영장 등을 갖춘 복합 문화·체육 공간입니다. 그중에서도 청소년문화센터 등과 함께 운영되는 인공암벽등반 시설은 시민들의 체력 단련과 여가활동을 돕는 대표적인 체험 장소입니다.</p>
          <p><strong>수학적 유용성 체감:</strong> 인공암벽등반은 경사도, 높이, 홀드의 배치 등 기하학적 요소와 대수적 관계가 풍부하게 담겨 있어, 교과서 속 수학이 실황에 어떻게 적용되는지 체감하기에 최적의 공간입니다.</p>
          <p><strong>우수한 접근성 및 안전성:</strong> 지하철(인천 1호선 문학경기장역) 및 버스 노선이 잘 갖추어져 있어 접근성이 뛰어나며, 넓은 공간이 확보되어 있어 다수의 학생이 안전하게 이동하고 실습 활동을 진행하기에 적합합니다.</p>
        `
      },
      {
        title: "2. 코스별 주요 수학활동 특징",
        content: `
          <p>본 코스는 중학교 수학 교육과정의 핵심 개념인 <strong>‘경우의 수’</strong>를 실제 암벽 구조물 및 루트 파인딩 상황과 직접 연결 지을 수 있도록 설계되었습니다.</p>
          <p><strong>디지털·HTML 기반의 조작활동 도입:</strong><br>
          단순한 펜과 종이 중심의 학습지 활동에서 벗어나, 학생들이 디지털 도구나 HTML 기반의 시뮬레이션을 직접 조작할 수 있습니다.</p>
          <p><strong>실제적 제약 조건이 반영된 최단 경로 문제 해결:</strong><br>
          실제 암벽등반 상황처럼 '반드시 잡아야 하는 홀드(필수 경유지)'나 '닿으면 안 되는 장애물(위험 지점)' 등의 제약 조건을 시뮬레이션 상에서 직접 변경해보고, 이에 따른 최단 경로의 경우의 수를 다각도로 탐구하며 문제를 해결합니다.</p>
        `
      }
    ];

    let currentPage = 0;
    const nextUrl = "F02.html"; // 다음 장면 URL

    const titleEl = document.getElementById("box-title");
    const contentEl = document.getElementById("box-content");
    const indicatorEl = document.getElementById("page-indicator");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");

    // 화면 업데이트 함수
    function renderPage() {
      const data = storyPages[currentPage];
      titleEl.innerText = data.title;
      contentEl.innerHTML = data.content;
      indicatorEl.innerText = `${currentPage + 1} / ${storyPages.length}`;

      // 이전 버튼 처리: 첫 장이고 이전 URL이 없으면 비활성화/숨김
      if (currentPage === 0) {
        btnPrev.style.display = "none";
      } else {
        btnPrev.style.display = "block";
      }

      // 다음 버튼 텍스트 변경
      if (currentPage === storyPages.length - 1) {
        btnNext.innerText = "다음 장면으로";
      } else {
        btnNext.innerText = "다음";
      }
    }

    // 다음 버튼 클릭 처리
    function handleNext() {
      if (currentPage < storyPages.length - 1) {
        currentPage++;
        renderPage();
      } else {
        // 마지막 장일 때 지정된 다음 장면 URL로 이동
        window.location.href = nextUrl;
      }
    }

    // 이전 버튼 클릭 처리
    function handlePrev() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }

    // 초기화
    renderPage();
  </script>
</body>
</html>
