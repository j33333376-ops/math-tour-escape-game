<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문학경기장 MATHTOUR - B02</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
        }
        #game-container {
            position: relative;
            width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #f8fafc;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .char-wrapper {
            position: absolute;
            transition: filter 0.2s, transform 1s ease-in-out, opacity 1s ease-in-out;
        }
        .char-wrapper.inactive {
            filter: brightness(0.55);
        }
        #dialogue-box {
            position: absolute;
            bottom: 30px;
            left: 50px;
            right: 50px;
            height: 160px;
            background: #ffffff;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            padding: 24px 32px;
            z-index: 20;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(37, 99, 235, 0.1);
        }
        #speaker-name {
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: #2563eb;
            margin-bottom: 8px;
        }
        #dialogue-text {
            font-family: 'Pretendard', sans-serif;
            font-weight: 400;
            font-size: 1.1rem;
            color: #1e293b;
            line-height: 1.6;
            letter-spacing: -0.02em;
        }
        .dialogue-hint {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: right;
        }
        .btn-nav {
            position: absolute;
            bottom: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
            transition: background 0.2s, transform 0.1s;
            z-index: 30;
            font-family: 'Pretendard', sans-serif;
        }
        .btn-nav:hover {
            background: #1d4ed8;
        }
        .btn-nav:active {
            transform: scale(0.98);
        }
        #btn-prev {
            left: 20px;
            display: none;
        }
        #btn-next, #btn-skip {
            right: 20px;
        }
        #btn-skip {
            bottom: 200px;
            background: rgba(30, 41, 59, 0.7);
            padding: 8px 16px;
            font-size: 0.9rem;
            z-index: 30;
        }
        #btn-skip:hover {
            background: rgba(30, 41, 59, 0.9);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 배경 이미지 -->
    <img src="인천문학경기장.png" class="bg-image" alt="인천문학경기장 배경">

    <!-- 등장 인물: 민우 (좌측) -->
    <div class="char-wrapper inactive" id="char-민우" style="left: 150px; bottom: 50px; width: 260px; height: 320px; overflow: visible; z-index: 3;">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 등장 인물: 서연 (우측, 마주보도록 좌우 반전) -->
    <div class="char-wrapper inactive" id="char-서연" style="right: 150px; bottom: 50px; width: 260px; height: 320px; overflow: visible; z-index: 3;">
        <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 건너뛰기 버튼 -->
    <button class="btn-nav" id="btn-skip" onclick="skipDialogue()">건너뛰기</button>

    <!-- 대화창 -->
    <div id="dialogue-box" onclick="advanceDialogue()">
        <div>
            <div id="speaker-name">화자</div>
            <div id="dialogue-text">대사 내용이 여기에 표시됩니다.</div>
        </div>
        <div class="dialogue-hint">클릭하여 계속하기 ▶</div>
    </div>

    <!-- 공통 네비게이션 버튼 (이전: B01, 다음: B02) -->
    <button class="btn-nav" id="btn-prev" onclick="location.href='B01.html'">이전</button>
    <button class="btn-nav" id="btn-next" onclick="location.href='B02.html'">다음</button>
</div>

<script>
    const dialogues = [
        { speaker: "민우", text: "와, 드디어 인천문학경기장에 도착했다! 경기장이 엄청 크고 멋지네.", target: "char-민우" },
        { speaker: "서연", text: "응! 2002년 한일 월드컵 때 경기도 열렸던 역사 깊은 곳이잖아. 건축 디자인도 화물선 범례를 모티브로 해서 아주 독특하고 멋지다고 해.", target: "char-서연" },
        { speaker: "민우", text: "맞아, 게다가 국내 최초로 야구장과 축구장이 함께 어우러진 복합 문화 공간이라는 점도 대단한 자랑거리야.", target: "char-민우" },
        { speaker: "서연", text: "경기장 주변에 산책로나 조각공원도 잘 꾸며져 있어서 시민들 휴식 공간으로도 인기 만점이래.", target: "char-서연" },
        { speaker: "민우", text: "그렇구나. 자, 그럼 본격적으로 경기장 안으로 들어가서 오늘의 수학 투어를 시작해볼까?", target: "char-민우" },
        { speaker: "서연", text: "좋아! 안으로 들어가자!", target: "char-서연" }
    ];

    let currentIndex = 0;

    function updateDialogue() {
        if (currentIndex < dialogues.length) {
            const current = dialogues[currentIndex];
            document.getElementById("speaker-name").innerText = current.speaker;
            document.getElementById("dialogue-text").innerText = current.text;

            // 캐릭터 활성/비활성 처리
            document.querySelectorAll('.char-wrapper').forEach(el => el.classList.add('inactive'));
            const activeChar = document.getElementById(current.target);
            if (activeChar) {
                activeChar.classList.remove('inactive');
            }
        } else {
            endDialogue();
        }
    }

    function advanceDialogue() {
        currentIndex++;
        if (currentIndex < dialogues.length) {
            updateDialogue();
        } else {
            endDialogue();
        }
    }

    function endDialogue() {
        // 대화창 숨기기 및 건너뛰기 버튼 숨기기
        document.getElementById("dialogue-box").style.display = "none";
        document.getElementById("btn-skip").style.display = "none";

        // 모든 캐릭터 밝게 복구 후 중앙으로 이동하며 사라지는 효과
        const minu = document.getElementById("char-민우");
        const seoyeon = document.getElementById("char-서연");

        minu.classList.remove('inactive');
        seoyeon.classList.remove('inactive');

        // 가운데로 이동 및 페이드아웃 효과 적용
        minu.style.left = "400px";
        minu.style.opacity = "0";

        seoyeon.style.right = "400px";
        seoyeon.style.opacity = "0";

        // 애니메이션 종료 후 이전, 다음 버튼 표시
        setTimeout(() => {
            document.getElementById("btn-prev").style.display = "block";
            document.getElementById("btn-next").style.display = "block";
        }, 1000);
    }

    function skipDialogue() {
        currentIndex = dialogues.length;
        endDialogue();
    }

    // 초기 실행
    window.onload = function() {
        document.getElementById("btn-next").style.display = "none";
        updateDialogue();
    };
</script>

</body>
</html>
