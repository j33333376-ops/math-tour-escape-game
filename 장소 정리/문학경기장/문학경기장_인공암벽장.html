<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>문학경기장 - 인공암벽장</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .cw-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="cw-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인공암벽장">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfe1f4"/><stop offset="100%" stop-color="#eef7fc"/></linearGradient>
    <linearGradient id="wallg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a9b6c2"/><stop offset="100%" stop-color="#7f8f9d"/></linearGradient>
    <linearGradient id="wallg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c3ccd6"/><stop offset="100%" stop-color="#98a6b4"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="220" cy="80" rx="76" ry="22"/><ellipse cx="980" cy="70" rx="84" ry="24"/></g>
  <circle cx="120" cy="130" r="44" fill="#ffd23f" opacity="0.9"/>

  <!-- 잔디/바닥 -->
  <rect x="0" y="560" width="1200" height="160" fill="#8fbc7d"/>
  <rect x="0" y="560" width="1200" height="12" fill="#7aa869"/>

  <!-- 인공암벽 구조물 : 각진 볼더 타워 2개 -->
  <g>
    <!-- 메인 타워(높은 벽) -->
    <polygon points="380,560 420,150 560,96 660,180 640,560" fill="url(#wallg)" stroke="#5b6670" stroke-width="5" stroke-linejoin="round"/>
    <!-- 면 분할 -->
    <g stroke="#5b6670" stroke-width="3" opacity="0.7" fill="none">
      <path d="M420,150 L520,260 L560,96"/>
      <path d="M400,360 L520,260 L620,340 L660,180"/>
      <path d="M390,470 L520,420 L630,470 M520,260 L520,420"/>
    </g>
    <!-- 밝은 면 -->
    <polygon points="560,96 660,180 640,560 600,560 620,340 520,260" fill="url(#wallg2)" opacity="0.65"/>
    <!-- 홀드(알록달록) -->
    <g>
      <circle cx="440" cy="500" r="9" fill="#e05e5e"/><circle cx="490" cy="452" r="9" fill="#ffcf4a"/><circle cx="452" cy="396" r="9" fill="#4a90d9"/><circle cx="500" cy="340" r="9" fill="#5aa66a"/><circle cx="466" cy="286" r="9" fill="#e08baa"/><circle cx="502" cy="224" r="9" fill="#e05e2b"/><circle cx="472" cy="188" r="9" fill="#6b46c1"/><circle cx="524" cy="150" r="9" fill="#ffcf4a"/>
      <circle cx="560" cy="480" r="9" fill="#4a90d9"/><circle cx="592" cy="420" r="9" fill="#e05e5e"/><circle cx="556" cy="360" r="9" fill="#ffcf4a"/><circle cx="600" cy="300 " r="9" fill="#5aa66a"/><circle cx="566" cy="240" r="9" fill="#4a90d9"/><circle cx="608" cy="212" r="9" fill="#e08baa"/>
    </g>
    <!-- 꼭대기 홀드/종 -->
    <g transform="translate(556,92)">
      <circle r="12" fill="#ffd23f" stroke="#d9a32b" stroke-width="3"/>
      <path d="M0,-12 L0,-30" stroke="#5b6670" stroke-width="4"/>
      <polygon points="-12,-30 12,-30 0,-48" fill="#e05e5e" stroke="#b23a32" stroke-width="2.5"/>
    </g>
    <!-- 클라이머 -->
    <g transform="translate(538,318)">
      <circle cx="0" cy="-26" r="11" fill="#e8c9a8"/>
      <path d="M0,-26 m-8,-4 a11,11 0 0 1 16,-2 l-2,-8 a13,13 0 0 0 -14,2 Z" fill="#e05e2b"/>
      <rect x="-9" y="-16" width="18" height="30" rx="7" fill="#2f855a"/>
      <path d="M-8,-10 Q-26,-22 -34,-40" stroke="#e8c9a8" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M8,-12 Q24,-4 36,4" stroke="#e8c9a8" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M-6,14 Q-16,32 -10,46" stroke="#3f6b82" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M6,14 Q18,26 30,30" stroke="#3f6b82" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- 로프 -->
      <path d="M0,-38 Q6,-120 18,-216" stroke="#e05e5e" stroke-width="3.5" fill="none"/>
    </g>
    <!-- 빌레이어(로프 잡는 사람) -->
    <g transform="translate(560,540)">
      <circle cx="0" cy="-24" r="10" fill="#e8c9a8"/>
      <rect x="-9" y="-15" width="18" height="30" rx="7" fill="#6b46c1"/>
      <path d="M-4,-8 Q-18,-40 -22,-90" stroke="#e05e5e" stroke-width="3" fill="none"/>
    </g>

    <!-- 보조 볼더(낮은 벽) -->
    <polygon points="760,560 790,300 900,260 980,340 950,560" fill="url(#wallg2)" stroke="#5b6670" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#5b6670" stroke-width="3" opacity="0.7" fill="none"><path d="M790,300 L880,380 L900,260"/><path d="M775,440 L880,380 L960,440"/></g>
    <g>
      <circle cx="820" cy="500" r="8" fill="#ffcf4a"/><circle cx="856" cy="452" r="8" fill="#e05e5e"/><circle cx="822" cy="404" r="8" fill="#5aa66a"/><circle cx="866" cy="352" r="8" fill="#4a90d9"/><circle cx="836" cy="316" r="8" fill="#e08baa"/>
      <circle cx="906" cy="480" r="8" fill="#4a90d9"/><circle cx="922" cy="410" r="8" fill="#ffcf4a"/><circle cx="898" cy="330" r="8" fill="#e05e2b"/>
    </g>
    <!-- 볼더링하는 사람 -->
    <g transform="translate(882,430)">
      <circle cx="0" cy="-22" r="10" fill="#e8c9a8"/>
      <rect x="-8" y="-13" width="16" height="26" rx="6" fill="#c0392b"/>
      <path d="M-6,-8 Q-20,-20 -24,-34" stroke="#e8c9a8" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M6,-10 Q18,-16 24,-28" stroke="#e8c9a8" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M-4,13 Q-12,26 -8,38" stroke="#3f6b82" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M4,13 Q14,22 22,26" stroke="#3f6b82" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 안전매트 -->
  <g>
    <rect x="356" y="556" width="310" height="26" rx="10" fill="#4a90d9" stroke="#2b6cb0" stroke-width="3"/>
    <rect x="740" y="556" width="240" height="26" rx="10" fill="#e05e5e" stroke="#b23a32" stroke-width="3"/>
  </g>

  <!-- 나무 -->
  <g transform="translate(120,560)"><rect x="-7" y="0" width="14" height="50" fill="#6a4a2c"/><circle cy="-18" r="38" fill="#5aa653"/><circle cx="-24" cy="2" r="24" fill="#69b55f"/><circle cx="24" cy="2" r="24" fill="#69b55f"/></g>
  <g transform="translate(1110,560)"><rect x="-7" y="0" width="14" height="50" fill="#6a4a2c"/><circle cy="-18" r="38" fill="#5aa653"/><circle cx="-24" cy="2" r="24" fill="#69b55f"/><circle cx="24" cy="2" r="24" fill="#69b55f"/></g>

  <!-- 구경하는 사람 -->
  <g><circle cx="250" cy="620" r="10" fill="#e8c9a8"/><rect x="241" y="629" width="18" height="30" rx="6" fill="#2b6cb0"/></g>
  <g><circle cx="1050" cy="628" r="10" fill="#e8c9a8"/><rect x="1041" y="637" width="18" height="30" rx="6" fill="#2f855a"/></g>

  <!-- 사인 -->
  <g transform="translate(600,684)">
    <rect x="-96" y="-22" width="192" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#5b6670" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#3d4a56">인공암벽장</text>
  </g>
</svg>
</body>
</html>
