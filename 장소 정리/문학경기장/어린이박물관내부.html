<!-- 원본 크기: 1000x500 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; padding:0; background:transparent; overflow:hidden; }
  svg { display:block; width:100%; height:auto; }
  .glow { filter: drop-shadow(0px 0px 6px rgba(255, 235, 59, 0.6)); }
</style>
</head>
<body>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for Room Walls & Floor -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>

    <linearGradient id="backBoardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>

    <!-- Metal Trim & Details -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00838f"/>
    </linearGradient>

    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffee58"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ab47bc"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(0, 150, 136, 0.1)"/>
    </linearGradient>

    <!-- Floor Pattern -->
    <pattern id="grid" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    </pattern>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- MAIN ROOM CONTAINER CUTOUT (Building Shell Cutaway Interior view) -->
  <g id="museum_structure">
    <!-- Interior Back Wall -->
    <polygon points="100,50 900,50 900,380 100,380" fill="url(#wallGrad)" stroke="#455a64" stroke-width="4"/>
    
    <!-- Floor Cutout Angle -->
    <polygon points="100,380 900,380 980,480 20,480" fill="url(#floorGrad)"/>
    <!-- Floor Grid overlay -->
    <polygon points="100,380 900,380 980,480 20,480" fill="url(#grid)"/>

    <!-- Ceiling / Roof Frame Top Accent -->
    <polygon points="80,30 920,30 900,50 100,50" fill="#37474f"/>
    <path d="M 80,30 L 20,480 M 920,30 L 980,480" stroke="#ffb300" stroke-width="6" fill="none"/>
    <rect x="80" y="25" width="840" height="10" fill="#ffb300"/>

    <!-- Side Walls Perspective -->
    <polygon points="20,480 100,380 100,50 80,30" fill="#263238"/>
    <polygon points="980,480 900,380 900,50 920,30" fill="#212121"/>
  </g>

  <!-- WALL DECORATIONS & SCIENCE BOARDS -->
  <!-- Header Banner -->
  <g id="science_banner" transform="translate(300, 60)">
    <rect x="0" y="0" width="400" height="40" rx="8" fill="#1565c0" stroke="#90caf9" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="200" y="26" font-family="'Arial', 'NanumGothic', sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">🔬 어린이 과학 탐구실 🪐</text>
  </g>

  <!-- Left Wall Board: Solar System & Astronomy -->
  <g id="space_board" transform="translate(130, 110)">
    <rect x="0" y="0" width="220" height="150" rx="6" fill="#0d1b2a" stroke="#415a77" stroke-width="3"/>
    <rect x="5" y="5" width="210" height="20" rx="3" fill="#1b263b"/>
    <text x="110" y="19" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e0e1dd" text-anchor="middle">태양계와 우주 (SOLAR SYSTEM)</text>
    
    <!-- Planets -->
    <circle cx="30" cy="85" r="18" fill="#ff9800"/> <!-- Sun -->
    <circle cx="70" cy="85" r="5" fill="#8d6e63"/>
    <circle cx="95" cy="85" r="8" fill="#29b6f6"/> <!-- Earth -->
    <circle cx="95" cy="85" r="12" fill="none" stroke="#b3e5fc" stroke-width="1"/>
    <circle cx="125" cy="85" r="6" fill="#ef5350"/> <!-- Mars -->
    
    <!-- Saturn -->
    <ellipse cx="165" cy="85" rx="16" ry="5" fill="none" stroke="#ffd54f" stroke-width="2" transform="rotate(-15 165 85)"/>
    <circle cx="165" cy="85" r="10" fill="#ffa726"/>
    
    <!-- Orbit Lines -->
    <path d="M 30,85 Q 100,55 170,85" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2,2"/>
    
    <!-- Text / Formulas -->
    <text x="15" y="140" font-family="monospace" font-size="9" fill="#81d4fa">F = G(m1·m2)/r²</text>
    <text x="140" y="140" font-family="monospace" font-size="9" fill="#81d4fa">v = H₀·d</text>
  </g>

  <!-- Center Wall Board: Physics & Energy -->
  <g id="physics_board" transform="translate(390, 110)">
    <rect x="0" y="0" width="220" height="150" rx="6" fill="#1a237e" stroke="#5c6bc0" stroke-width="3"/>
    <rect x="5" y="5" width="210" height="20" rx="3" fill="#283593"/>
    <text x="110" y="19" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">빛과 에너지의 원리</text>
    
    <!-- Prism Light Beam Illustration -->
    <polygon points="60,65 40,105 80,105" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="15" y1="90" x2="50" y2="85" stroke="#ffffff" stroke-width="2"/> <!-- White light -->
    <!-- Rainbow rays -->
    <line x1="70" y1="90" x2="110" y2="70" stroke="#ff1744" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="110" y2="78" stroke="#ff9100" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="110" y2="86" stroke="#ffea00" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="110" y2="94" stroke="#00e676" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="110" y2="102" stroke="#2979ff" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="110" y2="110" stroke="#651fff" stroke-width="1.5"/>

    <!-- Atom Model -->
    <ellipse cx="165" cy="85" rx="22" ry="8" fill="none" stroke="#80deea" stroke-width="1.5" transform="rotate(30 165 85)"/>
    <ellipse cx="165" cy="85" rx="22" ry="8" fill="none" stroke="#80deea" stroke-width="1.5" transform="rotate(-30 165 85)"/>
    <ellipse cx="165" cy="85" rx="22" ry="8" fill="none" stroke="#80deea" stroke-width="1.5" transform="rotate(90 165 85)"/>
    <circle cx="165" cy="85" r="5" fill="#ff4081"/>

    <!-- Formulas -->
    <text x="15" y="140" font-family="serif" font-style="italic" font-size="12" fill="#ffd54f">E = mc²</text>
    <text x="130" y="140" font-family="serif" font-style="italic" font-size="12" fill="#ffd54f">λ = h / p</text>
  </g>

  <!-- Right Wall Board: Chemistry & DNA -->
  <g id="chemistry_board" transform="translate(650, 110)">
    <rect x="0" y="0" width="220" height="150" rx="6" fill="#004d40" stroke="#26a69a" stroke-width="3"/>
    <rect x="5" y="5" width="210" height="20" rx="3" fill="#00695c"/>
    <text x="110" y="19" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">생명과학과 분자구조</text>
    
    <!-- Benzene ring / Molecule -->
    <polygon points="60,50 80,60 80,80 60,90 40,80 40,60" fill="none" stroke="#80cbc4" stroke-width="2"/>
    <circle cx="60" cy="50" r="4" fill="#ff5252"/>
    <circle cx="80" cy="60" r="4" fill="#ff5252"/>
    <circle cx="80" cy="80" r="4" fill="#ff5252"/>
    <circle cx="60" cy="90" r="4" fill="#ff5252"/>
    <circle cx="40" cy="80" r="4" fill="#ff5252"/>
    <circle cx="40" cy="60" r="4" fill="#ff5252"/>

    <!-- DNA Strand -->
    <path d="M 130,50 Q 150,70 130,90 T 130,120" fill="none" stroke="#a7ffeb" stroke-width="2"/>
    <path d="M 160,50 Q 140,70 160,90 T 160,120" fill="none" stroke="#a7ffeb" stroke-width="2"/>
    <line x1="135" y1="60" x2="155" y2="60" stroke="#ffd740" stroke-width="2"/>
    <line x1="130" y1="70" x2="160" y2="70" stroke="#ff4081" stroke-width="2"/>
    <line x1="132" y1="80" x2="158" y2="80" stroke="#40c4ff" stroke-width="2"/>
    <line x1="135" y1="100" x2="155" y2="100" stroke="#ffd740" stroke-width="2"/>

    <text x="15" y="140" font-family="sans-serif" font-size="10" fill="#a7ffeb">H₂O + CO₂ → C₆H₁₂O₆</text>
  </g>

  <!-- Interactive Wall Gear Display Cutout (Interactive Exhibit) -->
  <g id="gear_wall" transform="translate(130, 275)">
    <rect x="0" y="0" width="120" height="90" rx="5" fill="#37474f" stroke="#78909c" stroke-width="2"/>
    <text x="60" y="15" font-family="sans-serif" font-size="9" font-weight="bold" fill="#eceff1" text-anchor="middle">톱니바퀴의 원리</text>
    
    <!-- Gear 1 -->
    <g transform="translate(45, 50)">
      <circle cx="0" cy="0" r="22" fill="#ff9800"/>
      <path d="M -22,-4 L -26,-4 -26,4 -22,4 M 22,-4 L 26,-4 26,4 22,4 M -4,-22 L -4,-26 4,-26 4,-22 M -4,22 L -4,26 4,26 4,22" stroke="#ff9800" stroke-width="4"/>
      <circle cx="0" cy="0" r="8" fill="#37474f"/>
    </g>
    <!-- Gear 2 -->
    <g transform="translate(80, 55)">
      <circle cx="0" cy="0" r="14" fill="#29b6f6"/>
      <path d="M -14,-3 L -18,-3 -18,3 -14,3 M 14,-3 L 18,-3 18,3 14,3 M -3,-14 L -3,-18 3,-18 3,-14 M -3,14 L -3,18 3,18 3,14" stroke="#29b6f6" stroke-width="3"/>
      <circle cx="0" cy="0" r="5" fill="#37474f"/>
    </g>
  </g>

  <!-- Interactive Wall Circuit Display -->
  <g id="circuit_wall" transform="translate(750, 275)">
    <rect x="0" y="0" width="120" height="90" rx="5" fill="#263238" stroke="#78909c" stroke-width="2"/>
    <text x="60" y="15" font-family="sans-serif" font-size="9" font-weight="bold" fill="#eceff1" text-anchor="middle">전기 회로 연결하기</text>
    <path d="M 20,40 L 40,40 L 50,25 L 70,55 L 80,40 L 100,40" fill="none" stroke="#00e676" stroke-width="3"/>
    <circle cx="20" cy="40" r="5" fill="#ffeb3b"/>
    <circle cx="100" cy="40" r="5" fill="#ffeb3b"/>
    <circle cx="60" cy="70" r="10" fill="#ff1744" class="glow"/>
    <text x="60" y="73" font-family="sans-serif" font-size="8" fill="#fff" text-anchor="middle">스위치</text>
  </g>


  <!-- EXHIBIT EQUIPMENT ON THE FLOOR -->

  <!-- Equipment 1: Plasma Globe Station (Center-Left) -->
  <g id="plasma_globe" transform="translate(280, 310)" filter="url(#dropShadow)">
    <!-- Stand/Pedestal -->
    <ellipse cx="40" cy="110" rx="35" ry="12" fill="#455a64"/>
    <path d="M 10,110 L 20,50 L 60,50 L 70,110 Z" fill="#78909c"/>
    <rect x="20" y="45" width="40" height="8" rx="2" fill="#37474f"/>
    
    <!-- Glass Sphere -->
    <circle cx="40" cy="25" r="28" fill="url(#glassGrad)" stroke="#80deea" stroke-width="1.5"/>
    <!-- Inner Electrode -->
    <circle cx="40" cy="25" r="6" fill="#ab47bc"/>
    
    <!-- Plasma Lightning Bolts -->
    <path d="M 40,25 Q 30,15 22,10" fill="none" stroke="#ea80fc" stroke-width="2"/>
    <path d="M 40,25 Q 55,20 62,14" fill="none" stroke="#80d8ff" stroke-width="2"/>
    <path d="M 40,25 Q 35,35 25,42" fill="none" stroke="#ea80fc" stroke-width="1.5"/>
    <path d="M 40,25 Q 50,38 58,40" fill="none" stroke="#80d8ff" stroke-width="2"/>

    <!-- Sign Label -->
    <rect x="15" y="70" width="50" height="18" rx="3" fill="#263238" stroke="#00e5ff" stroke-width="1"/>
    <text x="40" y="82" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">플라즈마 구</text>
  </g>

  <!-- Equipment 2: Giant Microscope Station (Center Floor) -->
  <g id="microscope_station" transform="translate(450, 320)" filter="url(#dropShadow)">
    <!-- Table/Base -->
    <ellipse cx="50" cy="120" rx="60" ry="18" fill="#37474f"/>
    <path d="M 0,120 L 10,80 L 90,80 L 100,120 Z" fill="#cfd8dc"/>
    <rect x="5" y="75" width="90" height="8" rx="2" fill="#009688"/>

    <!-- Microscope Heavy Body -->
    <!-- Base -->
    <path d="M 30,75 L 70,75 L 65,65 L 35,65 Z" fill="#424242"/>
    <!-- Arm -->
    <path d="M 60,65 C 75,50 75,20 55,10 L 45,10 C 60,25 60,45 45,65 Z" fill="#1e88e5"/>
    <!-- Stage -->
    <rect x="25" y="45" width="35" height="5" fill="#212121"/>
    <rect x="38" y="50" width="8" height="15" fill="#b0bec5"/> <!-- Substage lens -->
    <!-- Eyepiece / Tube -->
    <rect x="35" y="0" width="12" height="25" transform="rotate(20 35 0)" fill="#78909c"/>
    <rect x="31" y="-4" width="16" height="6" transform="rotate(20 35 0)" fill="#212121"/> <!-- ocular -->
    <!-- Revolving Nosepiece & Objectives -->
    <circle cx="42" cy="28" r="7" fill="#ffd54f"/>
    <rect x="38" y="32" width="4" height="10" fill="#212121"/>
    <rect x="45" y="32" width="5" height="8" fill="#ff1744"/>

    <!-- Label -->
    <rect x="25" y="92" width="50" height="16" rx="2" fill="#263238"/>
    <text x="50" y="103" font-family="sans-serif" font-size="8" fill="#a7ffeb" text-anchor="middle">체험용 현미경</text>
  </g>

  <!-- Equipment 3: Tornado / Vortex Fluid Demonstration Tube (Center-Right Floor) -->
  <g id="vortex_tube" transform="translate(620, 300)" filter="url(#dropShadow)">
    <!-- Bottom Pedestal -->
    <ellipse cx="35" cy="140" rx="40" ry="12" fill="#263238"/>
    <rect x="5" y="110" width="60" height="30" fill="#546e7a"/>
    <rect x="0" y="105" width="70" height="8" rx="2" fill="#78909c"/>

    <!-- Glass Cylinder -->
    <rect x="12" y="15" width="46" height="90" fill="url(#glassGrad)" stroke="#b2ebf2" stroke-width="2"/>
    <!-- Top Cap -->
    <rect x="8" y="8" width="54" height="8" rx="2" fill="#78909c"/>

    <!-- Water Tornado Effect inside -->
    <path d="M 20,15 Q 35,40 33,60 T 22,90 T 35,105 L 37,105 Q 48,80 37,60 T 48,15 Z" fill="rgba(0, 229, 255, 0.5)"/>
    <path d="M 35,15 Q 37,50 33,80 T 35,105" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Control Buttons on Base -->
    <circle cx="20" cy="122" r="4" fill="#ff1744"/>
    <circle cx="35" cy="122" r="4" fill="#00e676"/>
    <circle cx="50" cy="122" r="4" fill="#ffea00"/>

    <text x="35" y="134" font-family="sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">토네이도 생성기</text>
  </g>

  <!-- Left Foreground: Interactive Touch Kiosk / Quiz Tablet Stand -->
  <g id="kiosk" transform="translate(100, 370)" filter="url(#dropShadow)">
    <ellipse cx="25" cy="80" rx="25" ry="8" fill="#37474f"/>
    <path d="M 20,80 L 15,30 L 30,30 L 30,80 Z" fill="#90a4ae"/>
    
    <!-- Screen Box angled -->
    <rect x="0" y="0" width="45" height="32" rx="4" fill="#212121" stroke="#00e5ff" stroke-width="2" transform="skewY(-10)"/>
    <!-- Screen Content -->
    <rect x="4" y="4" width="37" height="24" rx="2" fill="#0288d1" transform="skewY(-10)"/>
    <text x="22" y="15" font-family="sans-serif" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle" transform="skewY(-10)">과학 퀴즈</text>
    <rect x="8" y="18" width="12" height="6" rx="1" fill="#ffeb3b" transform="skewY(-10)"/>
    <rect x="23" y="18" width="12" height="6" rx="1" fill="#69f0ae" transform="skewY(-10)"/>
  </g>

  <!-- Right Foreground: Newton's Cradle (Momentum Demo) -->
  <g id="newtons_cradle" transform="translate(800, 380)" filter="url(#dropShadow)">
    <!-- Base -->
    <polygon points="10,50 80,50 75,65 15,65" fill="#5d4037"/>
    <!-- Frame -->
    <path d="M 20,50 L 20,10 L 70,10 L 70,50" fill="none" stroke="#cfd8dc" stroke-width="3"/>
    <path d="M 25,50 L 25,15 L 65,15 L 65,50" fill="none" stroke="#90a4ae" stroke-width="1.5"/>

    <!-- Strings and Balls -->
    <!-- Ball 1 (Swinging out) -->
    <line x1="30" y1="12" x2="18" y2="38" stroke="#ccc" stroke-width="1"/>
    <circle cx="16" cy="40" r="5" fill="url(#metal)"/>

    <!-- Ball 2 -->
    <line x1="40" y1="12" x2="40" y2="40" stroke="#ccc" stroke-width="1"/>
    <circle cx="40" cy="40" r="5" fill="url(#metal)"/>

    <!-- Ball 3 -->
    <line x1="48" y1="12" x2="48" y2="40" stroke="#ccc" stroke-width="1"/>
    <circle cx="48" cy="40" r="5" fill="url(#metal)"/>

    <!-- Ball 4 -->
    <line x1="56" y1="12" x2="56" y2="40" stroke="#ccc" stroke-width="1"/>
    <circle cx="56" cy="40" r="5" fill="url(#metal)"/>

    <!-- Ball 5 (Swinging out right) -->
    <line x1="64" y1="12" x2="76" y2="38" stroke="#ccc" stroke-width="1"/>
    <circle cx="78" cy="40" r="5" fill="url(#metal)"/>
  </g>

  <!-- Decorative Ceiling Lights / Spotlight Tracks -->
  <g id="ceiling_lights">
    <line x1="150" y1="50" x2="850" y2="50" stroke="#455a64" stroke-width="6"/>
    <!-- Lamp 1 -->
    <path d="M 250,50 L 245,65 L 260,65 Z" fill="#ffb300"/>
    <polygon points="230,120 275,120 260,65 245,65" fill="rgba(255, 235, 59, 0.15)"/>
    <!-- Lamp 2 -->
    <path d="M 500,50 L 495,65 L 510,65 Z" fill="#ffb300"/>
    <polygon points="470,140 535,140 510,65 495,65" fill="rgba(255, 235, 59, 0.15)"/>
    <!-- Lamp 3 -->
    <path d="M 750,50 L 745,65 L 760,65 Z" fill="#ffb300"/>
    <polygon points="730,120 775,120 760,65 745,65" fill="rgba(255, 235, 59, 0.15)"/>
  </g>
</svg>
</body>
</html>
