<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>문학경기장 - 박태환수영장</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .sw-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="sw-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="박태환수영장">
  <defs>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dfe8ee"/><stop offset="100%" stop-color="#c3d3dd"/></linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#63b6d9"/><stop offset="100%" stop-color="#2f8bb8"/></linearGradient>
  </defs>
  <!-- 실내 천장(아치형) -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#ceil)"/>
  <path d="M0,220 Q600,40 1200,220 L1200,0 L0,0 Z" fill="#b7c9d4"/>
  <g stroke="#98aebb" stroke-width="5" fill="none">
    <path d="M0,220 Q600,40 1200,220"/>
    <path d="M0,300 Q600,130 1200,300"/>
  </g>
  <!-- 천장 조명 -->
  <g fill="#fff3b0" stroke="#d9c37a" stroke-width="2">
    <ellipse cx="300" cy="196" rx="34" ry="10"/><ellipse cx="600" cy="150" rx="34" ry="10"/><ellipse cx="900" cy="196" rx="34" ry="10"/>
  </g>
  <!-- 대형 유리창 -->
  <g fill="#cfe9f5" stroke="#98aebb" stroke-width="3">
    <rect x="60" y="250" width="150" height="110"/><rect x="990" y="250" width="150" height="110"/>
  </g>
  <g stroke="#98aebb" stroke-width="2"><line x1="135" y1="250" x2="135" y2="360"/><line x1="1065" y1="250" x2="1065" y2="360"/><line x1="60" y1="305" x2="210" y2="305"/><line x1="990" y1="305" x2="1140" y2="305"/></g>

  <!-- 전광판/기록판 -->
  <g transform="translate(600,268)">
    <rect x="-190" y="-52" width="380" height="86" rx="10" fill="#26333d" stroke="#141c22" stroke-width="4"/>
    <text x="0" y="-12" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="27" font-weight="700" fill="#8fd0e4">박태환수영장</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Jua',sans-serif" font-size="16" fill="#ffd23f">RECORD 1:44.71</text>
  </g>

  <!-- 풀 데크 -->
  <rect x="0" y="360" width="1200" height="80" fill="#e8e4da"/>
  <rect x="0" y="360" width="1200" height="10" fill="#cfc9bb"/>
  <!-- 출발대 -->
  <g fill="#4a90d9" stroke="#2b6cb0" stroke-width="3">
    <path d="M150,440 L190,440 L182,404 L158,404 Z"/><path d="M350,440 L390,440 L382,404 L358,404 Z"/><path d="M550,440 L590,440 L582,404 L558,404 Z"/><path d="M750,440 L790,440 L782,404 L758,404 Z"/><path d="M950,440 L990,440 L982,404 L958,404 Z"/>
  </g>
  <g font-family="'Jua',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="170" y="430">1</text><text x="370" y="430">2</text><text x="570" y="430">3</text><text x="770" y="430">4</text><text x="970" y="430">5</text>
  </g>

  <!-- 수영장 -->
  <rect x="0" y="440" width="1200" height="280" fill="url(#pool)"/>
  <!-- 레인 로프 -->
  <g stroke-dasharray="20 12" stroke-width="7">
    <line x1="70" y1="452" x2="34" y2="720" stroke="#ffd23f"/>
    <line x1="270" y1="452" x2="252" y2="720" stroke="#e05e5e"/>
    <line x1="470" y1="452" x2="464" y2="720" stroke="#ffd23f"/>
    <line x1="670" y1="452" x2="678" y2="720" stroke="#e05e5e"/>
    <line x1="870" y1="452" x2="890" y2="720" stroke="#ffd23f"/>
    <line x1="1070" y1="452" x2="1106" y2="720" stroke="#e05e5e"/>
  </g>
  <!-- 물결 -->
  <g stroke="#bfe6f4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M120,520 q22,-9 44,0 q22,9 44,0"/><path d="M760,560 q22,-9 44,0 q22,9 44,0"/><path d="M320,640 q24,-10 48,0 q24,10 48,0"/><path d="M940,650 q24,-10 48,0"/>
  </g>
  <!-- 자유형 수영 선수 -->
  <g transform="translate(560,568)">
    <ellipse cx="0" cy="0" rx="52" ry="14" fill="#3fa0c8" opacity="0.6"/>
    <path d="M-40,-2 Q0,-14 40,-4" stroke="#e8c9a8" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="46" cy="-8" r="12" fill="#e8c9a8"/>
    <path d="M40,-16 Q48,-24 58,-18" fill="none" stroke="#e05e5e" stroke-width="7" stroke-linecap="round"/>
    <path d="M-12,-10 Q-2,-34 16,-26" stroke="#e8c9a8" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g stroke="#eaf6fb" stroke-width="3" opacity="0.85" fill="none"><path d="M-64,-4 q-10,4 -18,0"/><path d="M62,0 q10,4 18,0"/></g>
  </g>
  <!-- 킥판 잡은 수영 초보 -->
  <g transform="translate(200,640)">
    <rect x="24" y="-10" width="34" height="20" rx="8" fill="#ffcf4a" stroke="#d9a32b" stroke-width="2.5"/>
    <circle cx="8" cy="-8" r="11" fill="#e8c9a8"/>
    <path d="M2,-16 Q10,-24 20,-16" fill="none" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round"/>
    <path d="M-2,0 Q-20,6 -36,2" stroke="#e8c9a8" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 사인 -->
  <g transform="translate(600,690)">
    <rect x="-108" y="-22" width="216" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#1f4e79">박태환수영장</text>
  </g>
</svg>
</body>
</html>
