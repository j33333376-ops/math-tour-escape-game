<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문학경기장 MATHTOUR - 박태환 수영장의 스토리</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 16:9 메인 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f8fafc;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        /* 배경 이미지 */
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 상단 스테이지 바 */
        .stage-bar {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            height: 48px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .stage-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stage-badge {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: 'Roboto Mono', monospace;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: #2563eb;
        }

        .progress-bar-bg {
            width: 120px;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #2563eb;
            transition: width 0.3s ease;
        }

        /* 캐릭터 스테이지 영역 */
        .characters-stage {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes subtleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 캐릭터 Wrapper */
        .char-wrapper {
            position: absolute;
            bottom: 20px;
            width: 260px;
            height: 320px;
            overflow: visible;
            transition: filter 0.3s ease;
            pointer-events: auto;
        }

        .char-wrapper.speaking {
            animation: subtleBounce 2s infinite ease-in-out;
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        /* 캐릭터 머리 위 말풍선 스타일 */
        .speech-bubble-container {
            position: absolute;
            bottom: 335px; /* 캐릭터 높이(320px) 위로 가려지지 않게 여유 배치 */
            width: 320px;
            z-index: 20;
            cursor: pointer;
            display: none;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
            transition: transform 0.15s ease;
        }

        .speech-bubble-container:hover {
            transform: scale(1.02);
        }

        .speech-bubble-container:active {
            transform: scale(0.98);
        }

        /* 민우 말풍선 위치 (민우 머리 위) */
        #bubble-minwoo {
            left: -30px; /* 민우 캐릭터 기준 중앙 오프셋 조정 */
        }

        /* 서연 말풍선 위치 (서연 머리 위) */
        #bubble-seoyeon {
            right: -30px; /* 서연 캐릭터 기준 중앙 오프셋 조정 */
        }

        .bubble-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 18px;
            border: 2px solid #2563eb;
            position: relative;
        }

        /* 말풍선 꼬리표 (아래쪽 화살표) */
        .bubble-card::after {
            content: '';
            position: absolute;
            bottom: -10px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 10px 10px 0 10px;
            border-color: #ffffff transparent transparent transparent;
            z-index: 2;
        }

        .bubble-card::before {
            content: '';
            position: absolute;
            bottom: -13px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 11px 11px 0 11px;
            border-color: #2563eb transparent transparent transparent;
            z-index: 1;
        }

        /* 민우 말풍선 꼬리 위치 (중앙 하단) */
        #bubble-minwoo .bubble-card::after,
        #bubble-minwoo .bubble-card::before {
            left: 150px;
        }

        /* 서연 말풍선 꼬리 위치 (중앙 하단) */
        #bubble-seoyeon .bubble-card::after,
        #bubble-seoyeon .bubble-card::before {
            right: 150px;
        }

        .bubble-speaker {
            font-size: 13px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bubble-speaker::after {
            content: '클릭시 계속 ➔';
            font-family: 'Pretendard', sans-serif;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
        }

        .bubble-text {
            font-size: 14px;
            color: #1e293b;
            line-height: 1.55;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        /* 공통 이동 버튼 디자인 */
        .btn-nav {
            position: absolute;
            height: 44px;
            padding: 0 22px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-nav:hover {
            background-color: #1d4ed8;
            box-shadow: 0 6px 12px -2px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        .btn-nav:active {
            transform: translateY(0);
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
            background-color: #64748b;
            box-shadow: 0 4px 6px -1px rgba(100, 116, 139, 0.3);
        }

        #btn-prev:hover {
            background-color: #475569;
        }

        #btn-next, #btn-skip {
            right: 20px;
            bottom: 20px;
        }

        .nav-hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지 -->
        <img src="박태환수영장내부.png" alt="박태환수영장 내부" class="bg-img" />

        <!-- 상단 스테이지 바 -->
        <div class="stage-bar">
            <div class="stage-title">
                <span class="stage-badge">STAGE 02</span>
                <span>박태환 수영장의 비밀</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <span id="progress-text">1 / 14</span>
            </div>
        </div>

        <!-- 캐릭터 및 머리 위 말풍선 영역 -->
        <div class="characters-stage">
            <!-- 민우 캐릭터 (좌측) -->
            <div class="char-wrapper" id="char-민우" style="left: 160px;">
                <!-- 민우 머리 위 말풍선 -->
                <div class="speech-bubble-container" id="bubble-minwoo" onclick="advanceDialogue()">
                    <div class="bubble-card">
                        <div class="bubble-speaker">민우</div>
                        <div class="bubble-text" id="text-minwoo"></div>
                    </div>
                </div>
                <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; pointer-events:none;"></iframe>
            </div>

            <!-- 서연 캐릭터 (우측) -->
            <div class="char-wrapper" id="char-서연" style="right: 160px;">
                <!-- 서연 머리 위 말풍선 -->
                <div class="speech-bubble-container" id="bubble-seoyeon" onclick="advanceDialogue()">
                    <div class="bubble-card">
                        <div class="bubble-speaker">서연</div>
                        <div class="bubble-text" id="text-seoyeon"></div>
                    </div>
                </div>
                <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform: scaleX(-1); pointer-events:none;"></iframe>
            </div>
        </div>

        <!-- 탐색 및 이동 버튼 그룹 -->
        <button class="btn-nav nav-hidden" id="btn-prev" onclick="goToPrev()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            이전
        </button>

        <button class="btn-nav" id="btn-skip" onclick="skipDialogue()">
            건너뛰기
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        </button>

        <button class="btn-nav nav-hidden" id="btn-next" onclick="goToNext()">
            다음
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <script>
        // 대화 시나리오 데이터
        const dialogues = [
            {
                speaker: "민우",
                text: "서연아, 이 수영장이 왜 '박태환수영장'인지 알아?",
                target: "char-민우"
            },
            {
                speaker: "서연",
                text: "응! 박태환 선수 이름을 따서 만든 수영장이잖아. 그런데 왜 여기 문학경기장 안에 만든 거야?",
                target: "char-서연"
            },
            {
                speaker: "민우",
                text: "2014년에 열린 인천 아시안게임 수영 경기를 치르기 위해 만든 국제 규격 수영장이야. 세계 여러 나라 선수들이 최고의 시설에서 경기할 수 있도록 지은 거지.",
                target: "char-민우"
            },
            {
                speaker: "서연",
                text: "아, 그래서 경기장도 엄청 크고 시설도 좋은 거구나!",
                target: "char-서연"
            },
            {
                speaker: "민우",
                text: "맞아. 그리고 우리나라 최초의 올림픽 수영 금메달리스트인 박태환 선수의 업적을 기념하고, 더 많은 어린이와 청소년들이 수영에 꿈을 가질 수 있도록 그의 이름을 붙였대.",
                target: "char-민우"
            },
            {
                speaker: "서연",
                text: "그러니까 아시안게임도 성공적으로 개최하고, 박태환 선수의 도전 정신도 오래 기억하자는 의미가 담겨 있는 거네!",
                target: "char-서연"
            },
            {
                speaker: "민우",
                text: "맞아! 지금은 국제대회뿐 아니라 인천 시민들도 이용하는 수영장이라서, 많은 사람들이 운동하고 건강을 키우는 공간으로도 활용되고 있어.",
                target: "char-민우"
            },
            {
                speaker: "민우",
                text: "이야기를 듣고 나니까 나도 박태환 선수처럼 멋지게 수영해 보고 싶다!",
                target: "char-민우"
            },
            {
                speaker: "서연",
                text: "그럼 우리 직접 박태환 선수가 되어보는 건 어때?",
                target: "char-서연"
            },
            {
                speaker: "민우",
                text: "우리가?",
                target: "char-민우"
            },
            {
                speaker: "서연",
                text: "응! 수영장 안에서 나타나는 여러 장애물을 피하면서 앞으로 나아가는 거야. 빠르게 헤엄치고, 장애물을 피하다 보면 마치 박태환 선수가 국제대회에서 레이스를 펼치는 기분을 느낄 수 있을 거야!",
                target: "char-서연"
            },
            {
                speaker: "민우",
                text: "와! 단순히 수영하는 게 아니라 박태환 선수처럼 집중력과 순발력을 발휘하는 체험이네!",
                target: "char-민우"
            },
            {
                speaker: "서연",
                text: "맞아! 장애물을 모두 피해서 결승점까지 가장 빠르게 도착하면 오늘의 '박태환'은 바로 너야!",
                target: "char-서연"
            },
            {
                speaker: "민우",
                text: "좋아! 그럼 지금부터 박태환이 된 마음으로 힘차게 출발해 보자!",
                target: "char-민우"
            }
        ];

        let currentIndex = 0;
        const totalDialogues = dialogues.length;

        // DOM 요소
        const charMinwoo = document.getElementById('char-민우');
        const charSeoyeon = document.getElementById('char-서연');
        const bubbleMinwoo = document.getElementById('bubble-minwoo');
        const bubbleSeoyeon = document.getElementById('bubble-seoyeon');
        const textMinwoo = document.getElementById('text-minwoo');
        const textSeoyeon = document.getElementById('text-seoyeon');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const btnSkip = document.getElementById('btn-skip');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        // 화면 대화 업데이트
        function updateDialogue() {
            if (currentIndex >= totalDialogues) {
                endDialogue();
                return;
            }

            const current = dialogues[currentIndex];

            // 진행률 바 갱신
            const progressPercent = ((currentIndex + 1) / totalDialogues) * 100;
            progressFill.style.width = `${progressPercent}%`;
            progressText.innerText = `${currentIndex + 1} / ${totalDialogues}`;

            // 턴에 따라 발화자의 말풍선을 켜고, 인물 어둡기/바운스 효과 조절
            if (current.speaker === "민우") {
                charMinwoo.classList.remove('inactive');
                charMinwoo.classList.add('speaking');
                
                charSeoyeon.classList.add('inactive');
                charSeoyeon.classList.remove('speaking');

                textMinwoo.innerText = current.text;
                bubbleMinwoo.style.display = 'block';
                bubbleSeoyeon.style.display = 'none';
            } else {
                charSeoyeon.classList.remove('inactive');
                charSeoyeon.classList.add('speaking');

                charMinwoo.classList.add('inactive');
                charMinwoo.classList.remove('speaking');

                textSeoyeon.innerText = current.text;
                bubbleSeoyeon.style.display = 'block';
                bubbleMinwoo.style.display = 'none';
            }
        }

        // 말풍선 터치/클릭 시 다음 대화
        function advanceDialogue() {
            currentIndex++;
            updateDialogue();
        }

        // 건너뛰기
        function skipDialogue() {
            currentIndex = totalDialogues;
            endDialogue();
        }

        // 대화 완결 처리
        function endDialogue() {
            bubbleMinwoo.style.display = 'none';
            bubbleSeoyeon.style.display = 'none';

            charMinwoo.classList.remove('inactive', 'speaking');
            charSeoyeon.classList.remove('inactive', 'speaking');

            btnSkip.classList.add('nav-hidden');
            btnPrev.classList.remove('nav-hidden');
            btnNext.classList.remove('nav-hidden');

            progressFill.style.width = '100%';
            progressText.innerText = `${totalDialogues} / ${totalDialogues}`;
        }

        // 이동 함수
        function goToPrev() {
            window.location.href = 'E01.html';
        }

        function goToNext() {
            window.location.href = 'E03.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateDialogue();
        });
    </script>
</body>
</html>
