<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문학경기장 MATHTOUR - B04</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #f8fafc;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            transition: opacity 0.5s ease;
        }

        /* 페이드 아웃 효과 클래스 */
        #game-container.fade-out {
            opacity: 0;
        }

        /* 배경 이미지 */
        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 캐릭터 래퍼 스타일 */
        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            z-index: 3;
            transition: filter 0.2s ease;
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        /* 공통 이동 버튼 스타일 */
        .btn-nav {
            position: absolute;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Pretendard', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: background-color 0.2s, transform 0.1s;
            z-index: 20;
            display: none;
        }

        .btn-nav:hover {
            background-color: #1d4ed8;
        }

        .btn-nav:active {
            transform: scale(0.98);
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
            bottom: 20px;
        }

        #btn-skip {
            background-color: #64748b;
        }

        #btn-skip:hover {
            background-color: #475569;
        }

        /* 대화창 스타일 (유형 2) */
        #dialogue-box {
            position: absolute;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            width: 900px;
            height: 160px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            padding: 24px 32px;
            z-index: 15;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(226, 232, 240, 0.8);
            backdrop-filter: blur(8px);
        }

        #speaker-name {
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #2563eb;
            margin-bottom: 8px;
        }

        #dialogue-text {
            font-family: 'Pretendard', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: -0.02em;
            color: #1e293b;
            flex-grow: 1;
        }

        .dialogue-guide {
            font-size: 12px;
            color: #64748b;
            text-align: right;
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지 -->
        <img src="인천1호선문학경기장역.png" alt="인천1호선문학경기장역 배경" class="bg-image">

        <!-- 등장인물: 민우 (좌측) -->
        <div class="char-wrapper" id="char-민우" style="left: 60px; bottom: 0px;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장인물: 서연 (우측, 마주보도록 좌우 반전) -->
        <div class="char-wrapper" id="char-서연" style="right: 60px; bottom: 0px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 대화창 UI -->
        <div id="dialogue-box" onclick="advanceDialogue()">
            <div>
                <div id="speaker-name">화자</div>
                <div id="dialogue-text">대사 내용이 여기에 표시됩니다.</div>
            </div>
            <div class="dialogue-guide">클릭하여 계속 진행 ▼</div>
        </div>

        <!-- 하단 이동 버튼 -->
        <button id="btn-prev" class="btn-nav" onclick="goPrev()">이전</button>
        <button id="btn-skip" class="btn-nav" onclick="skipDialogue()" style="display: block;">건너뛰기</button>
        <button id="btn-next" class="btn-nav" onclick="goNext()">End</button>
    </div>

    <script>
        const dialogues = [
            { speaker: "민우", text: "와, 문학경기장 곳곳을 돌며 수학 문제를 다 풀고 나니까 새삼 새롭게 보이네!", target: "char-민우" },
            { speaker: "서연", text: "맞아! 교실 칠판 속에서만 보던 삼각비나 도형 공식들을 실제 건축물이나 경기장 시설에 직접 적용해 볼 수 있어서 정말 신기했어.", target: "char-서연" },
            { speaker: "민우", text: "그냥 지나치기 쉬운 전광판의 높이나 관람석의 경사각도 다 수학적인 원리로 설계되어 있었다니 대단하지 않아?", target: "char-민우" },
            { speaker: "서연", text: "응. 수학이 우리 일상생활과 이렇게 밀접하게 연결되어 있다는 걸 몸소 깨달은 소중한 시간이었어.", target: "char-서연" },
            { speaker: "민우", text: "오늘의 MATH TOUR는 여기서 완벽 클리어! 다음에도 이런 재미있는 미션이 또 있었으면 좋겠다!", target: "char-민우" }
        ];

        let currentIndex = 0;
        const prevUrl = "B03.html";
        const nextUrl = "index.html";

        function updateDialogue() {
            if (currentIndex < dialogues.length) {
                const current = dialogues[currentIndex];
                document.getElementById("speaker-name").innerText = current.speaker;
                document.getElementById("dialogue-text").innerText = current.text;

                // 캐릭터 활성/비활성(명암) 처리
                const charMinu = document.getElementById("char-민우");
                const charSoyeon = document.getElementById("char-서연");

                if (current.target === "char-민우") {
                    charMinu.classList.remove("inactive");
                    charSoyeon.classList.add("inactive");
                } else {
                    charSoyeon.classList.remove("inactive");
                    charMinu.classList.add("inactive");
                }
            } else {
                endDialogue();
            }
        }

        function advanceDialogue() {
            currentIndex++;
            if (currentIndex < dialogues.length) {
                updateDialogue();
            } else {
                endDialogue();
            }
        }

        function skipDialogue() {
            currentIndex = dialogues.length;
            endDialogue();
        }

        function endDialogue() {
            // 대화창 숨기기
            document.getElementById("dialogue-box").style.display = "none";
            document.getElementById("btn-skip").style.display = "none";

            // 모든 캐릭터 원래 밝기로 복구
            document.getElementById("char-민우").classList.remove("inactive");
            document.getElementById("char-서연").classList.remove("inactive");

            // 이전 / 다음 버튼 표시 (다음 URL이 비어있거나 index.html인 경우 등 처리)
            document.getElementById("btn-prev").style.display = "block";
            const nextBtn = document.getElementById("btn-next");
            nextBtn.style.display = "block";
            nextBtn.innerText = "End"; // 마지막 페이지이므로 End로 표시
        }

        function goPrev() {
            const container = document.getElementById("game-container");
            container.classList.add("fade-out");
            setTimeout(() => {
                window.location.href = prevUrl;
            }, 500);
        }

        function goNext() {
            const container = document.getElementById("game-container");
            container.classList.add("fade-out");
            setTimeout(() => {
                window.location.href = nextUrl;
            }, 500);
        }

        // 초기 실행
        window.onload = function() {
            updateDialogue();
        };
    </script>
</body>
</html>
