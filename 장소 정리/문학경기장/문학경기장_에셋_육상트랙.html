<!-- 원본 크기: 1200x500 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문학경기장 육상 트랙</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .mtr-svg { display:block; width:100%; height:auto; }
  @keyframes mtr-glint { 0%,100% { opacity:0.10; } 50% { opacity:0.22; } }
  .mtr-glint { animation: mtr-glint 5s ease-in-out infinite; }
</style>
</head>
<body>
<svg class="mtr-svg" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="문학경기장 육상 트랙">
<title>문학경기장 육상 트랙</title>
<defs>
  <linearGradient id="mtrTrack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d5493f"/>
    <stop offset="1" stop-color="#b8342c"/>
  </linearGradient>
  <linearGradient id="mtrField" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4fac54"/>
    <stop offset="1" stop-color="#3a8f42"/>
  </linearGradient>
</defs>

<!-- 트랙 외곽 옅은 그림자 -->
<path d="M258,38 L942,38 A212,212 0 0 1 942,462 L258,462 A212,212 0 0 1 258,38 Z" fill="#000" opacity="0.06"/>

<!-- 붉은 트랙 (외곽-내곽 홀 뚫기) -->
<path fill-rule="evenodd" fill="url(#mtrTrack)" stroke="#8f261f" stroke-width="1.5"
  d="M260,40 L940,40 A210,210 0 0 1 940,460 L260,460 A210,210 0 0 1 260,40 Z
     M260,100 L940,100 A150,150 0 0 1 940,400 L260,400 A150,150 0 0 1 260,100 Z"/>

<!-- 레인 구분선 (흰색) -->
<g fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.9">
  <path d="M260,47 L940,47 A203,203 0 0 1 940,453 L260,453 A203,203 0 0 1 260,47"/>
  <path d="M260,55 L940,55 A195,195 0 0 1 940,445 L260,445 A195,195 0 0 1 260,55"/>
  <path d="M260,62 L940,62 A188,188 0 0 1 940,438 L260,438 A188,188 0 0 1 260,62"/>
  <path d="M260,70 L940,70 A180,180 0 0 1 940,430 L260,430 A180,180 0 0 1 260,70"/>
  <path d="M260,77 L940,77 A173,173 0 0 1 940,423 L260,423 A173,173 0 0 1 260,77"/>
  <path d="M260,85 L940,85 A165,165 0 0 1 940,415 L260,415 A165,165 0 0 1 260,85"/>
  <path d="M260,92 L940,92 A158,158 0 0 1 940,408 L260,408 A158,158 0 0 1 260,92"/>
</g>

<!-- 안쪽 초록 필드 -->
<path d="M260,100 L940,100 A150,150 0 0 1 940,400 L260,400 A150,150 0 0 1 260,100 Z" fill="url(#mtrField)"/>

<!-- 잔디 스트라이프 -->
<g fill="#ffffff" opacity="0.06">
  <rect x="290" y="100" width="30" height="300"/>
  <rect x="350" y="100" width="30" height="300"/>
  <rect x="410" y="100" width="30" height="300"/>
  <rect x="470" y="100" width="30" height="300"/>
  <rect x="530" y="100" width="30" height="300"/>
  <rect x="590" y="100" width="30" height="300"/>
  <rect x="650" y="100" width="30" height="300"/>
  <rect x="710" y="100" width="30" height="300"/>
  <rect x="770" y="100" width="30" height="300"/>
  <rect x="830" y="100" width="30" height="300"/>
  <rect x="890" y="100" width="30" height="300"/>
</g>

<!-- 필드 중앙선 & 센터서클 -->
<line x1="600" y1="100" x2="600" y2="400" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
<circle cx="600" cy="250" r="42" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
<circle cx="600" cy="250" r="3" fill="#ffffff" opacity="0.9"/>

<!-- 결승선 (체크무늬) -->
<g>
  <rect x="754" y="40" width="6" height="60" fill="#ffffff"/>
  <rect x="754" y="400" width="6" height="60" fill="#ffffff"/>
  <g fill="#1a1a1a">
    <rect x="754" y="40"  width="6" height="6"/>
    <rect x="754" y="52"  width="6" height="6"/>
    <rect x="754" y="64"  width="6" height="6"/>
    <rect x="754" y="76"  width="6" height="6"/>
    <rect x="754" y="88"  width="6" height="6"/>
    <rect x="754" y="400" width="6" height="6"/>
    <rect x="754" y="412" width="6" height="6"/>
    <rect x="754" y="424" width="6" height="6"/>
    <rect x="754" y="436" width="6" height="6"/>
    <rect x="754" y="448" width="6" height="6"/>
  </g>
</g>

<!-- 출발 블록 표시 (좌측 직선 구간) -->
<g stroke="#ffffff" stroke-width="1.5" opacity="0.8">
  <line x1="320" y1="47" x2="320" y2="92"/>
  <line x1="340" y1="47" x2="340" y2="92"/>
  <line x1="360" y1="47" x2="360" y2="92"/>
</g>

<!-- 트랙 하이라이트 글로스 -->
<path d="M260,40 L940,40" stroke="#ffffff" stroke-width="4" opacity="0.12" class="mtr-glint"/>

</svg>
</body>
</html>
