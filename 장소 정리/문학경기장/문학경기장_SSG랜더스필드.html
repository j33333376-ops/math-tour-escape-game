<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>문학경기장 - 인천SSG랜더스필드</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .bb-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="bb-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천SSG랜더스필드">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9dc9e8"/><stop offset="100%" stop-color="#e3f1fa"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5aa653"/><stop offset="100%" stop-color="#3f8a3f"/></linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d9534a"/><stop offset="100%" stop-color="#b23a32"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="240" cy="70" rx="76" ry="20"/><ellipse cx="950" cy="60" rx="82" ry="22"/></g>

  <!-- 야간 조명탑 -->
  <g>
    <g transform="translate(150,120)">
      <line x1="0" y1="0" x2="0" y2="240" stroke="#8a949b" stroke-width="10"/>
      <rect x="-52" y="-38" width="104" height="44" rx="8" fill="#5b6670"/>
      <g fill="#fff3b0"><circle cx="-36" cy="-24" r="8"/><circle cx="-12" cy="-24" r="8"/><circle cx="12" cy="-24" r="8"/><circle cx="36" cy="-24" r="8"/><circle cx="-24" cy="-6" r="8"/><circle cx="0" cy="-6" r="8"/><circle cx="24" cy="-6" r="8"/></g>
    </g>
    <g transform="translate(1050,120)">
      <line x1="0" y1="0" x2="0" y2="240" stroke="#8a949b" stroke-width="10"/>
      <rect x="-52" y="-38" width="104" height="44" rx="8" fill="#5b6670"/>
      <g fill="#fff3b0"><circle cx="-36" cy="-24" r="8"/><circle cx="-12" cy="-24" r="8"/><circle cx="12" cy="-24" r="8"/><circle cx="36" cy="-24" r="8"/><circle cx="-24" cy="-6" r="8"/><circle cx="0" cy="-6" r="8"/><circle cx="24" cy="-6" r="8"/></g>
    </g>
  </g>

  <!-- 관중석 -->
  <path d="M40,400 Q600,300 1160,400 L1160,300 Q600,196 40,300 Z" fill="url(#stand)" stroke="#8f2f28" stroke-width="4"/>
  <g stroke="#f2b5af" stroke-width="2.5" opacity="0.7">
    <path d="M60,368 Q600,268 1140,368" fill="none"/>
    <path d="M60,336 Q600,236 1140,336" fill="none"/>
  </g>
  <!-- 관중 점 -->
  <g fill="#ffe1c9" opacity="0.9">
    <circle cx="200" cy="330" r="5"/><circle cx="260" cy="318" r="5"/><circle cx="330" cy="304" r="5"/><circle cx="420" cy="290" r="5"/><circle cx="520" cy="282" r="5"/><circle cx="620" cy="280" r="5"/><circle cx="720" cy="286" r="5"/><circle cx="820" cy="296" r="5"/><circle cx="920" cy="312" r="5"/><circle cx="1000" cy="326" r="5"/>
    <circle cx="240" cy="360" r="5"/><circle cx="360" cy="340" r="5"/><circle cx="480" cy="326" r="5"/><circle cx="600" cy="320" r="5"/><circle cx="740" cy="328" r="5"/><circle cx="880" cy="344" r="5"/><circle cx="980" cy="358" r="5"/>
  </g>
  <!-- 전광판 -->
  <g transform="translate(600,204)">
    <rect x="-170" y="-70" width="340" height="86" rx="10" fill="#26333d" stroke="#141c22" stroke-width="4"/>
    <text x="0" y="-22" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="30" font-weight="700" fill="#ffd23f">SSG 랜더스필드</text>
    <text x="0" y="6" text-anchor="middle" font-family="'Jua',sans-serif" font-size="16" fill="#8fd0e4">HOME 3 : 2 AWAY</text>
    <line x1="-120" y1="16" x2="-120" y2="52" stroke="#5b6670" stroke-width="8"/>
    <line x1="120" y1="16" x2="120" y2="52" stroke="#5b6670" stroke-width="8"/>
  </g>

  <!-- 그라운드 -->
  <rect x="0" y="400" width="1200" height="320" fill="url(#grass)"/>
  <!-- 외야 잔디 줄무늬 -->
  <g fill="#4f9c49" opacity="0.6">
    <path d="M0,430 L1200,430 L1200,462 L0,462 Z"/><path d="M0,494 L1200,494 L1200,526 L0,526 Z"/><path d="M0,558 L1200,558 L1200,590 L0,590 Z"/><path d="M0,622 L1200,622 L1200,654 L0,654 Z"/>
  </g>
  <!-- 내야 다이아몬드 -->
  <g transform="translate(600,560)">
    <polygon points="0,-130 190,0 0,130 -190,0" fill="#c9955c" stroke="#a8773f" stroke-width="4"/>
    <polygon points="0,-92 134,0 0,92 -134,0" fill="url(#grass)"/>
    <!-- 베이스 -->
    <g fill="#f7fafc" stroke="#b3ac9c" stroke-width="2">
      <rect x="-9" y="-104" width="18" height="18" transform="rotate(45 0 -95)"/>
      <rect x="125" y="-9" width="18" height="18" transform="rotate(45 134 0)"/>
      <rect x="-143" y="-9" width="18" height="18" transform="rotate(45 -134 0)"/>
    </g>
    <!-- 마운드 -->
    <circle cx="0" cy="0" r="26" fill="#c9955c" stroke="#a8773f" stroke-width="3"/>
    <rect x="-10" y="-4" width="20" height="7" fill="#f7fafc"/>
    <!-- 홈플레이트 -->
    <g transform="translate(0,108)">
      <circle r="30" fill="#c9955c" stroke="#a8773f" stroke-width="3"/>
      <polygon points="-8,-6 8,-6 8,2 0,8 -8,2" fill="#f7fafc"/>
    </g>
    <!-- 파울라인 -->
    <line x1="0" y1="108" x2="220" y2="-42" stroke="#f7fafc" stroke-width="4"/>
    <line x1="0" y1="108" x2="-220" y2="-42" stroke="#f7fafc" stroke-width="4"/>
  </g>
  <!-- 선수 -->
  <g><circle cx="600" cy="536" r="9" fill="#e8c9a8"/><rect x="592" y="544" width="16" height="26" rx="6" fill="#d9534a"/></g>
  <g><circle cx="600" cy="654" r="9" fill="#e8c9a8"/><rect x="592" y="662" width="16" height="26" rx="6" fill="#2b6cb0"/><line x1="612" y1="660" x2="634" y2="642" stroke="#c9955c" stroke-width="5" stroke-linecap="round"/></g>

  <!-- 사인 -->
  <g transform="translate(600,690)">
    <rect x="-128" y="-22" width="256" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#b23a32" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#8f2f28">인천SSG랜더스필드</text>
  </g>
</svg>
</body>
</html>
