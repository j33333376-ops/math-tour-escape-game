<!-- 원본 크기: 900x650 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문학경기장 전광판</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .msb-svg { display:block; width:100%; height:auto; }
  @keyframes msb-blink { 0%,49% { opacity:1; } 50%,100% { opacity:0.25; } }
  .msb-blink { animation: msb-blink 1.6s steps(1) infinite; }
  .msb-blink2 { animation-delay: .4s; }
  .msb-blink3 { animation-delay: .8s; }
  @keyframes msb-glow { 0%,100% { opacity:0.9; } 50% { opacity:0.55; } }
  .msb-glow { animation: msb-glow 2.4s ease-in-out infinite; }
</style>
</head>
<body>
<svg class="msb-svg" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="문학경기장 대형 전광판">
<title>문학경기장 전광판</title>
<defs>
  <linearGradient id="msbFrame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c3c7cc"/>
    <stop offset="1" stop-color="#8b8f95"/>
  </linearGradient>
  <linearGradient id="msbScreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#132648"/>
    <stop offset="1" stop-color="#060f22"/>
  </linearGradient>
  <linearGradient id="msbPole" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a7abb1"/>
    <stop offset="0.5" stop-color="#787c82"/>
    <stop offset="1" stop-color="#a7abb1"/>
  </linearGradient>
  <pattern id="msbGrid" width="12" height="12" patternUnits="userSpaceOnUse">
    <rect width="12" height="12" fill="none"/>
    <path d="M12,0 L0,0 0,12" fill="none" stroke="#3a5580" stroke-width="0.5" opacity="0.4"/>
  </pattern>
</defs>

<!-- 지면 그림자 -->
<ellipse cx="450" cy="612" rx="220" ry="14" fill="#000" opacity="0.1"/>

<!-- 지지 기둥 2개 + 가새 -->
<rect x="245" y="470" width="26" height="130" fill="url(#msbPole)" stroke="#6a6e74" stroke-width="1"/>
<rect x="629" y="470" width="26" height="130" fill="url(#msbPole)" stroke="#6a6e74" stroke-width="1"/>
<line x1="258" y1="520" x2="642" y2="560" stroke="#8b8f95" stroke-width="6"/>
<line x1="642" y1="520" x2="258" y2="560" stroke="#8b8f95" stroke-width="6"/>
<rect x="230" y="596" width="56" height="10" fill="#6a6e74"/>
<rect x="614" y="596" width="56" height="10" fill="#6a6e74"/>

<!-- 철제 트러스 외곽 프레임 -->
<rect x="60" y="20" width="780" height="470" rx="6" fill="url(#msbFrame)" stroke="#5c6066" stroke-width="2"/>
<!-- 모서리 가새(diagonal gusset) -->
<g stroke="#6a6e74" stroke-width="4" opacity="0.8">
  <line x1="60"  y1="20"  x2="100" y2="60"/>
  <line x1="840" y1="20"  x2="800" y2="60"/>
  <line x1="60"  y1="490" x2="100" y2="450"/>
  <line x1="840" y1="490" x2="800" y2="450"/>
</g>
<!-- 프레임 리벳 -->
<g fill="#5c6066">
  <circle cx="80" cy="40" r="3"/>
  <circle cx="820" cy="40" r="3"/>
  <circle cx="80" cy="470" r="3"/>
  <circle cx="820" cy="470" r="3"/>
  <circle cx="450" cy="30" r="3"/>
  <circle cx="450" cy="480" r="3"/>
</g>

<!-- 16:9 스크린 -->
<rect x="100" y="60" width="680" height="382" rx="4" fill="url(#msbScreen)" stroke="#020814" stroke-width="4"/>
<rect x="100" y="60" width="680" height="382" fill="url(#msbGrid)"/>

<!-- 상단 팀명 바 -->
<rect x="118" y="78" width="220" height="34" rx="4" fill="#c8283a" opacity="0.85"/>
<text x="228" y="101" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">HOME</text>
<rect x="542" y="78" width="220" height="34" rx="4" fill="#1f4fa0" opacity="0.85"/>
<text x="652" y="101" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">AWAY</text>

<!-- 메인 스코어 -->
<text x="450" y="270" text-anchor="middle" font-family="'Courier New', monospace" font-size="140" font-weight="bold" fill="#4dff6a" class="msb-glow">2 : 1</text>
<text x="450" y="270" text-anchor="middle" font-family="'Courier New', monospace" font-size="140" font-weight="bold" fill="#4dff6a" opacity="0.25" filter="blur(4px)">2 : 1</text>

<!-- 경기 시간 -->
<rect x="380" y="330" width="140" height="42" rx="4" fill="#0a1830" stroke="#2a4a78" stroke-width="1.5"/>
<text x="450" y="359" text-anchor="middle" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#ffcf4d">45:00</text>

<!-- 하단 문구 -->
<text x="450" y="405" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9fc4ff" letter-spacing="2">문학경기장 · INCHEON MUNHAK STADIUM</text>

<!-- 반짝이는 LED 픽셀 포인트 -->
<g>
  <rect x="130" y="420" width="8" height="8" fill="#ff5252" class="msb-blink"/>
  <rect x="150" y="420" width="8" height="8" fill="#4dff6a" class="msb-blink msb-blink2"/>
  <rect x="170" y="420" width="8" height="8" fill="#4da3ff" class="msb-blink msb-blink3"/>
  <rect x="722" y="420" width="8" height="8" fill="#ffcf4d" class="msb-blink msb-blink2"/>
  <rect x="742" y="420" width="8" height="8" fill="#ff5252" class="msb-blink"/>
  <rect x="762" y="420" width="8" height="8" fill="#4dff6a" class="msb-blink msb-blink3"/>
</g>

</svg>
</body>
</html>
