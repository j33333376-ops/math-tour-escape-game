<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문학경기장 MATHTOUR - C03</title>
    <!-- Pretendard & Roboto Mono 폰트 로드 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Pretendard', sans-serif;
            color: #1e293b;
        }

        /* 16:9 비율 고정 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }

        /* 스테이지 상단 표시바 (모던 에듀테크 연구소 스타일) */
        #top-bar {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            height: 48px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
            z-index: 20;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .stage-title {
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stage-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #2563eb;
            border-radius: 4px;
        }

        .stage-progress {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
            background: #eff6ff;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #bfdbfe;
        }

        /* 무대 구성 요소 (z-index 관리) */
        #stage-view {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        /* 에셋: 건물 (어린이박물관내부공룡 - 1000x500) */
        /* 무대 높이 600px 기준, 높이 약 75% 설정 (H=450px, s=0.9) */
        .asset-building {
            position: absolute;
            left: 33px;
            bottom: 20px;
            width: 900px;
            height: 450px;
            overflow: hidden;
            z-index: 1;
        }

        /* 등장인물 wrapper 공통 */
        .char-wrapper {
            position: absolute;
            transition: filter 0.25s ease, transform 0.25s ease;
            z-index: 3;
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        /* 인물 1: 민우 (좌측) */
        #char-민우 {
            left: 100px;
            bottom: 40px;
            width: 260px;
            height: 320px;
            overflow: visible;
        }

        /* 인물 2: 서연 (우측, 좌우반전) */
        #char-서연 {
            right: 100px;
            bottom: 40px;
            width: 260px;
            height: 320px;
            overflow: visible;
        }

        /* 대화창 UI (유형 2) */
        #dialogue-box {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 25px;
            height: 150px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border-bottom-left-radius: 4px; /* 메신저 말풍선 스타일 */
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 20px 24px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        #dialogue-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.06);
        }

        #speaker-badge {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            padding: 4px 14px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
        }

        #dialogue-text {
            font-size: 17px;
            line-height: 1.6;
            color: #1e293b;
            letter-spacing: -0.02em;
            font-weight: 500;
            word-break: keep-all;
        }

        .click-prompt {
            position: absolute;
            right: 24px;
            bottom: 16px;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* 공통 네비게이션 버튼 (10번 규칙 준수) */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            padding: 12px 24px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: 'Pretendard', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: background-color 0.2s ease, transform 0.1s ease;
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-nav:active {
            transform: translateY(0);
        }

        #btn-prev {
            left: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
        }

        #btn-skip {
            background-color: #64748b;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.2);
        }

        #btn-skip:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 스테이지 상단 표시바 -->
        <div id="top-bar">
            <div class="stage-title">문학경기장 MATHTOUR — 어린이박물관 공룡관</div>
            <div class="stage-progress">STAGE C03</div>
        </div>

        <!-- 무대 요소 영역 -->
        <div id="stage-view">
            <!-- 에셋: 어린이박물관내부공룡 (1000x500 -> s=0.9) -->
            <div class="asset-building">
                <iframe src="어린이박물관내부공룡.html" scrolling="no" style="border:0; width:1000px; height:500px; transform:scale(0.9); transform-origin:top left; pointer-events:none;"></iframe>
            </div>

            <!-- 등장인물 1: 민우 (260x320) -->
            <div class="char-wrapper" id="char-민우">
                <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; pointer-events:none;"></iframe>
            </div>

            <!-- 등장인물 2: 서연 (260x320, 좌우 반전 적용) -->
            <div class="char-wrapper" id="char-서연">
                <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scaleX(-1); pointer-events:none;"></iframe>
            </div>
        </div>

        <!-- 대화창 UI (대화 진행 중 사용) -->
        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-badge">화자</div>
            <div id="dialogue-text">대사 내용이 들어갑니다.</div>
            <div class="click-prompt">클릭하여 계속 ▼</div>
        </div>

        <!-- 네비게이션 버튼 -->
        <button id="btn-prev" class="btn-nav" onclick="goPrev()" style="display:none;">◀ 이전</button>
        <button id="btn-skip" class="btn-nav" onclick="finishDialogue()">건너뛰기 ▶</button>
        <button id="btn-next" class="btn-nav" onclick="goNext()" style="display:none;">다음 ▶</button>
    </div>

    <script>
        // 대화 스크립트 데이터 정의
        const dialogues = [
            { speaker: "민우", text: "우와~!! 공룡이다.!!", target: "char-민우" },
            { speaker: "서연", text: "정말 크다. 살아 있는 것 같아.!!", target: "char-서연" },
            { speaker: "민우", text: "공룡은 아주 오래전 지구에서 살았던 동물이래.", target: "char-민우" },
            { speaker: "서연", text: "맞아. 그런데 왜 지금은 볼 수 없지?", target: "char-서연" },
            { speaker: "민우", text: "여러 가지 환경 변화로 대부분 멸종 했어.", target: "char-민우" },
            { speaker: "서연", text: "그럼 지금의 공룡들은 어떻게 발견한 걸까?", target: "char-서연" },
            { speaker: "민우", text: "그건 화석을 통해 발견했어.", target: "char-민우" },
            { speaker: "서연", text: "화석을 발견하기 엄청 힘들지 않을까?.", target: "char-서연" }
        ];

        let currentIndex = 0;

        // 페이지 로드 시 첫 대화 출력
        window.addEventListener('DOMContentLoaded', () => {
            updateDialogue();
        });

        // 대화 진행 및 화자 강조 처리
        function updateDialogue() {
            if (currentIndex < dialogues.length) {
                const current = dialogues[currentIndex];
                document.getElementById('speaker-badge').innerText = current.speaker;
                document.getElementById('dialogue-text').innerText = current.text;

                // 모든 인물을 inactive로 설정 후 말하는 인물만 활성화
                const charWrappers = document.querySelectorAll('.char-wrapper');
                charWrappers.forEach(wrapper => {
                    if (wrapper.id === current.target) {
                        wrapper.classList.remove('inactive');
                    } else {
                        wrapper.classList.add('inactive');
                    }
                });
            } else {
                finishDialogue();
            }
        }

        // 클릭 시 다음 대화로 이동
        function advanceDialogue() {
            currentIndex++;
            updateDialogue();
        }

        // 대화 종료 시 처리 (건너뛰기 또는 대화 끝)
        function finishDialogue() {
            document.getElementById('dialogue-box').style.display = 'none';
            document.getElementById('btn-skip').style.display = 'none';

            // 모든 인물 어두움 해제
            const charWrappers = document.querySelectorAll('.char-wrapper');
            charWrappers.forEach(wrapper => wrapper.classList.remove('inactive'));

            // 이전 / 다음 이동 버튼 노출
            document.getElementById('btn-prev').style.display = 'flex';
            document.getElementById('btn-next').style.display = 'flex';
        }

        // URL 이동 로직 (window.location.href 사용)
        function goPrev() {
            window.location.href = "C02.html";
        }

        function goNext() {
            window.location.href = "C04.html";
        }
    </script>
</body>
</html>
