<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문학경기장 MATHTOUR - E03</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 16:9 방탈출 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f8fafc;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }

        /* 전체 배경 이미지 */
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 스테이지 상단 바 */
        #top-bar {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            height: 48px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .stage-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stage-title .badge {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* 등장인물 사이드배치 (선택적 시각 연출) */
        .char-wrapper {
            position: absolute;
            bottom: 0;
            width: 260px;
            height: 320px;
            overflow: visible;
            z-index: 3;
            pointer-events: none;
            transition: filter 0.2s ease;
        }

        /* 공통 이동 버튼 */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            height: 44px;
            padding: 0 24px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-nav:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }

        #btn-prev {
            left: 20px;
        }

        #btn-next {
            right: 20px;
            display: none; /* 퀴즈 통과 전까지 숨김 */
        }

        /* 수학 퀴즈 레이어 / 컨테이너 */
        .quiz-stage-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* 임베드된 수영장 게임 래퍼 */
        #pool-game-box {
            position: relative;
            width: 440px;
            height: 520px;
            background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
            border: 4px solid #38bdf8;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .lane-mark {
            position: absolute;
            width: 4px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.25);
            border-style: dashed;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 30;
        }

        .hidden {
            display: none !important;
        }

        .card {
            background-color: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 18px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            color: #ffffff;
        }

        .card h1 {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 10px;
            font-family: 'Pretendard', sans-serif;
        }

        .card p {
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .btn-game {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 6px;
        }

        .btn-game:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }

        .problem-title {
            color: #fde047;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            font-family: 'Roboto Mono', monospace;
        }

        .problem-expr {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            font-weight: bold;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            color: #ffffff;
            border: 1px solid #475569;
        }

        .choice-btn {
            font-family: 'Pretendard', sans-serif;
            background-color: #334155;
            color: white;
            border: 1px solid #64748b;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: background 0.2s;
        }

        .choice-btn:hover {
            background-color: #475569;
        }

        .input-answer {
            font-family: 'Roboto Mono', monospace;
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #64748b;
            margin-bottom: 10px;
            text-align: center;
            background-color: #0f172a;
            color: #fff;
        }

        .feedback-text {
            font-size: 15px;
            font-weight: bold;
            margin-top: 6px;
        }

        .correct { color: #4ade80; }
        .wrong { color: #f87171; }

        .solution-box {
            background-color: #0f172a;
            border-left: 4px solid #f87171;
            padding: 8px;
            text-align: left;
            font-size: 12px;
            margin-top: 8px;
            margin-bottom: 10px;
            color: #cbd5e1;
            line-height: 1.4;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            background-color: rgba(15, 23, 42, 0.85);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 5;
            font-size: 12px;
            color: #ffffff;
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 배경 이미지 -->
    <img src="박태환수영장내부.png" alt="박태환수영장내부" class="bg-img">

    <!-- 상단 진행률 바 -->
    <div id="top-bar">
        <div class="stage-title">
            <span class="badge">STAGE E03</span>
            <span>박태환 수영장 매쓰투어</span>
        </div>
    </div>

    <!-- 좌우 캐릭터 서포트 배치 -->
    <div class="char-wrapper" id="char-민우" style="left: 20px; filter: brightness(0.9);">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.8); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>
    <div class="char-wrapper" id="char-서연" style="right: 20px; filter: brightness(0.9);">
        <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.8) scaleX(-1); transform-origin:bottom right; pointer-events:none;"></iframe>
    </div>

    <!-- 수학 퀴즈 레이어 -->
    <div class="quiz-stage-wrapper">
        <div id="pool-game-box">
            <div class="lane-mark" style="left: 110px;"></div>
            <div class="lane-mark" style="left: 220px;"></div>
            <div class="lane-mark" style="left: 330px;"></div>

            <div id="hud">
                <span>🏊‍♂️ 매쓰투어</span>
                <span id="speed-text" style="color: #38bdf8;">속도: 1x</span>
                <span id="score-text">통과 문제: 0 / 5</span>
            </div>

            <canvas id="gameCanvas" width="440" height="520"></canvas>

            <!-- 시작 모달 -->
            <div id="start-modal" class="modal-overlay">
                <div class="card">
                    <h1>🚨 장애물 피하기 미션!</h1>
                    <p>바다 생물들이 레인을 넘나들고 있습니다!</p>
                    <div style="text-align: left; font-size: 11px; background: #0f172a; padding: 10px; border-radius: 6px; line-height: 1.5; color: #cbd5e1; margin-bottom: 12px;">
                        <b>🎯 승리 조건:</b><br>
                        - 장애물 부딪힘 시 나오는 <b>수학 문제 5개</b>를 모두 맞춰 완주하세요!<br><br>
                        <b>🎮 조작 방법:</b><br>
                        - <b>↑</b>: 전진 스퍼트 | <b>← / →</b>: 좌우 이동
                    </div>
                    <button class="btn-game" onclick="startGame()">게임 시작하기</button>
                </div>
            </div>

            <!-- 문제 모달 -->
            <div id="problem-modal" class="modal-overlay hidden">
                <div class="card">
                    <div class="problem-title" id="problem-num">문제 1</div>
                    <div class="problem-expr" id="problem-expr">2x + 3 = 7</div>
                    
                    <div id="quiz-body"></div>

                    <div id="feedback-container" class="hidden">
                        <div id="feedback-text" class="feedback-text"></div>
                        <div id="solution-box" class="solution-box hidden"></div>
                        <button class="btn-game" id="next-try-btn">다시 도전 (유사 문제)</button>
                    </div>
                </div>
            </div>

            <!-- 승리 모달 -->
            <div id="victory-modal" class="modal-overlay hidden">
                <div class="card">
                    <h1 style="font-size: 24px;">🥇 메달 획득!</h1>
                    <p>축하합니다! 총 5문제를 해결하고 완주에 성공하셨습니다!</p>
                    <p style="color: #10b981; font-weight: bold;">우측 하단의 [다음] 버튼을 눌러 이동하세요.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 네비게이션 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="window.location.href='E02.html'">이전</button>
    <button class="btn-nav" id="btn-next" onclick="window.location.href='E04.html'">다음</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameRunning = false;
    let solvedCount = 0;
    let isModalOpen = false;
    let animFrame = 0;

    const keys = { ArrowUp: false, ArrowLeft: false, ArrowRight: false };

    const player = {
        x: 200,
        y: 420,
        width: 36,
        height: 52,
        baseSpeed: 7.0
    };

    let enemies = [];
    let baseEnemySpeed = 3.5;

    const problemSet = [
        {
            type: 'mcq',
            title: '문제 1 [이항 개념]',
            expr: '방정식 3x + 5 = 11 에서 +5를 이항한 식으로 옳은 것은?',
            options: ['3x = 11 + 5', '3x = 11 - 5', '3x = -11 + 5', '3x = 11 × 5'],
            answer: 1,
            misconception: "💡 <b>개념 체크:</b> 등식의 성질에 의해 항의 부호를 바꾸어 다른 변으로 옮기는 것을 <b>'이항'</b>이라고 합니다.<br>+5를 이항하면 <b>-5</b>가 됩니다."
        },
        {
            type: 'saq',
            title: '문제 2 [기본 일차방정식]',
            expr: '2x - 4 = 6 의 해(x)를 구하시오.',
            answer: 5,
            generator: (rand) => {
                const a = 2 + rand % 3;
                const ans = 3 + rand % 4;
                const b = a * ans - 4;
                return { expr: `${a}x - 4 = ${b}`, answer: ans };
            },
            misconception: "💡 <b>풀이 과정 점검:</b><br>1) 상수항을 이항할 때 **부호를 바꾸었나요?** (-4 ➔ +4)<br>2) x의 계수로 **양변을 정확히 나누었나요?**"
        },
        {
            type: 'saq',
            title: '문제 3 [괄호가 있는 일차방정식]',
            expr: '3(x - 2) = 9 의 해(x)를 구하시오.',
            answer: 5,
            misconception: "💡 <b>풀이 과정 점검:</b><br>1) 괄호를 풀 때 **분배법칙**을 올바르게 적용했나요? 3(x - 2) = 3x - 6<br>2) 이항 후 양변을 나누어 x를 구해보세요."
        },
        {
            type: 'mcq',
            title: '문제 4 [계수가 소수인 일차방정식]',
            expr: '0.2x + 0.6 = 1.4 의 해는?',
            options: ['x = 2', 'x = 3', 'x = 4', 'x = 5'],
            answer: 2,
            misconception: "💡 <b>풀이 과정 점검:</b><br>계수가 소수일 때는 **양변에 10, 100...** 을 곱하여 정수로 만들어 풀면 편리합니다.<br>양변에 10을 곱하면: 2x + 6 = 14"
        },
        {
            type: 'saq',
            title: '문제 5 [계수가 분수인 일차방정식]',
            expr: 'x/2 - 1 = 3 의 해(x)를 구하시오.',
            answer: 8,
            misconception: "💡 <b>풀이 과정 점검:</b><br>1) 먼저 -1을 이항하면 x/2 = 4 가 됩니다.<br>2) 양변에 분모의 최저공배수(2)를 곱하면 x = 8 이 됩니다."
        }
    ];

    let currentProblemData = null;

    window.addEventListener('keydown', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    });
    window.addEventListener('keyup', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    function startGame() {
        document.getElementById('start-modal').classList.add('hidden');
        gameRunning = true;
        spawnEnemyWave();
        requestAnimationFrame(gameLoop);
    }

    function spawnEnemyWave() {
        enemies = [];
        let spawnCount = Math.random() < 0.5 ? 2 : 3;
        let enemyTypes = ['shark', 'jellyfish', 'urchin'];

        for (let i = 0; i < spawnCount; i++) {
            let type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
            let randomX = 50 + Math.random() * 340;
            enemies.push({
                baseX: randomX,
                x: randomX,
                y: -50 - (Math.random() * 70),
                type: type,
                radius: 20,
                active: true,
                phase: Math.random() * Math.PI * 2,
                vx: (Math.random() - 0.5) * 3
            });
        }
    }

    function gameLoop() {
        if (!gameRunning) return;

        update();
        render();

        if (!isModalOpen) {
            requestAnimationFrame(gameLoop);
        }
    }

    function update() {
        animFrame += 0.08;

        const currentMoveSpeed = player.baseSpeed + (solvedCount * 1.2);
        const currentEnemySpeed = baseEnemySpeed + (solvedCount * 1.1);

        document.getElementById('speed-text').innerText = `속도: ${(1 + solvedCount * 0.4).toFixed(1)}x`;

        if (keys.ArrowLeft && player.x > 10) player.x -= currentMoveSpeed;
        if (keys.ArrowRight && player.x < canvas.width - player.width - 10) player.x += currentMoveSpeed;
        if (keys.ArrowUp && player.y > 20) {
            player.y -= currentMoveSpeed * 0.6;
        } else {
            if (player.y < 420) player.y += 1.5;
        }

        let allOffScreen = true;

        enemies.forEach((e) => {
            if (e.active) {
                e.y += currentEnemySpeed;

                if (e.type === 'shark') {
                    e.baseX += e.vx * 1.5;
                    if (e.baseX < 40 || e.baseX > canvas.width - 40) e.vx *= -1;
                    e.x = e.baseX + Math.sin(animFrame * 2 + e.phase) * 50;

                } else if (e.type === 'jellyfish') {
                    e.x = 220 + Math.sin(animFrame * 1.2 + e.phase) * 150;

                } else if (e.type === 'urchin') {
                    e.x = e.baseX + Math.cos(animFrame * 1.5 + e.phase) * 90;
                }

                if (e.x < 20) e.x = 20;
                if (e.x > canvas.width - 20) e.x = canvas.width - 20;

                if (e.y < canvas.height + 50) {
                    allOffScreen = false;
                }

                const pCenterX = player.x + player.width / 2;
                const pCenterY = player.y + player.height / 2;
                const dist = Math.hypot(pCenterX - e.x, pCenterY - e.y);

                if (dist < e.radius + player.width / 2 - 4) {
                    e.active = false;
                    triggerProblem();
                }
            }
        });

        if (allOffScreen) {
            spawnEnemyWave();
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        let waveY = (Date.now() / 10) % canvas.height;
        ctx.fillRect(0, waveY, canvas.width, 5);
        ctx.fillRect(0, (waveY + 260) % canvas.height, canvas.width, 5);

        enemies.forEach(e => {
            if (e.active) {
                drawEnemy(e);
            }
        });

        drawSwimmer(player.x + player.width / 2, player.y + player.height / 2);
    }

    function drawEnemy(e) {
        ctx.save();
        ctx.translate(e.x, e.y);

        if (e.type === 'shark') {
            let angle = Math.cos(animFrame * 2 + e.phase) * 0.4;
            ctx.rotate(angle);

            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.ellipse(0, 0, 15, 24, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.moveTo(0, -4);
            ctx.lineTo(-12, 8);
            ctx.lineTo(0, 8);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-4, 10, 2.5, 0, Math.PI * 2);
            ctx.arc(4, 10, 2.5, 0, Math.PI * 2);
            ctx.fill();

        } else if (e.type === 'jellyfish') {
            ctx.fillStyle = '#ec4899';
            ctx.beginPath();
            ctx.arc(0, -4, 15, Math.PI, 0);
            ctx.fill();

            ctx.strokeStyle = '#f472b6';
            ctx.lineWidth = 2.5;
            for (let i = -10; i <= 10; i += 5) {
                ctx.beginPath();
                ctx.moveTo(i, -4);
                let wave = Math.sin(animFrame * 4 + i) * 4;
                ctx.lineTo(i + wave, 15);
                ctx.stroke();
            }

        } else if (e.type === 'urchin') {
            ctx.rotate(animFrame * 2);

            ctx.fillStyle = '#1e1b4b';
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#312e81';
            ctx.lineWidth = 2.5;
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * 8, Math.sin(a) * 8);
                ctx.lineTo(Math.cos(a) * 18, Math.sin(a) * 18);
                ctx.stroke();
            }
        }

        ctx.restore();
    }

    function drawSwimmer(cx, cy) {
        ctx.save();
        ctx.translate(cx, cy);

        let armCycle = Math.sin(animFrame * 2);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        let splashSize = 6 + Math.abs(armCycle) * 5;
        ctx.beginPath();
        ctx.arc(0, 26, splashSize, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f87171';
        ctx.beginPath();
        ctx.ellipse(0, 6, 9, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(-7, 10, 14, 11);

        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#f87171';

        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(-16, -12 + armCycle * 14);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(16, -12 - armCycle * 14);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -10, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#fde047';
        ctx.fill();

        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-5, -12, 5, 3);
        ctx.fillRect(1, -12, 5, 3);

        ctx.restore();
    }

    function triggerProblem() {
        isModalOpen = true;
        const modal = document.getElementById('problem-modal');
        document.getElementById('feedback-container').classList.add('hidden');
        
        currentProblemData = problemSet[solvedCount];
        displayQuestion(currentProblemData);

        modal.classList.remove('hidden');
    }

    function displayQuestion(prob) {
        document.getElementById('problem-num').innerText = prob.title;
        document.getElementById('problem-expr').innerText = prob.expr;

        const body = document.getElementById('quiz-body');
        body.innerHTML = '';
        body.classList.remove('hidden');

        if (prob.type === 'mcq') {
            prob.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = `${idx + 1}) ${opt}`;
                btn.onclick = () => checkAnswer(idx);
                body.appendChild(btn);
            });
        } else if (prob.type === 'saq') {
            const input = document.createElement('input');
            input.type = 'number';
            input.id = 'saq-input';
            input.className = 'input-answer';
            input.placeholder = '정답(정수) 입력';
            
            const submitBtn = document.createElement('button');
            submitBtn.className = 'btn-game';
            submitBtn.innerText = '정답 제출';
            submitBtn.onclick = () => {
                const val = parseInt(document.getElementById('saq-input').value, 10);
                checkAnswer(val);
            };

            body.appendChild(input);
            body.appendChild(submitBtn);
        }
    }

    function checkAnswer(userAns) {
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackText = document.getElementById('feedback-text');
        const solutionBox = document.getElementById('solution-box');
        const nextBtn = document.getElementById('next-try-btn');
        const quizBody = document.getElementById('quiz-body');

        quizBody.classList.add('hidden');
        feedbackContainer.classList.remove('hidden');

        let isCorrect = (userAns === currentProblemData.answer);

        if (isCorrect) {
            feedbackText.innerText = "🎉 정답입니다! 전진하세요!";
            feedbackText.className = "feedback-text correct";
            solutionBox.classList.add('hidden');

            nextBtn.innerText = "계속 수영하기";
            nextBtn.onclick = () => {
                solvedCount++;
                document.getElementById('score-text').innerText = `통과 문제: ${solvedCount} / 5`;
                document.getElementById('problem-modal').classList.add('hidden');
                isModalOpen = false;

                if (solvedCount >= 5) {
                    showVictory();
                } else {
                    spawnEnemyWave();
                    requestAnimationFrame(gameLoop);
                }
            };
        } else {
            feedbackText.innerText = "아쉬워요! 다시 도전!";
            feedbackText.className = "feedback-text wrong";
            
            solutionBox.innerHTML = currentProblemData.misconception;
            solutionBox.classList.remove('hidden');

            nextBtn.innerText = "유사 문제로 다시 도전";
            nextBtn.onclick = () => {
                let randVal = Math.floor(Math.random() * 5) + 1;
                if (currentProblemData.generator) {
                    const newProb = currentProblemData.generator(randVal);
                    currentProblemData.expr = newProb.expr;
                    currentProblemData.answer = newProb.answer;
                }
                
                feedbackContainer.classList.add('hidden');
                displayQuestion(currentProblemData);
            };
        }
    }

    function showVictory() {
        gameRunning = false;
        document.getElementById('victory-modal').classList.remove('hidden');
        // 다음 이동 버튼 노출
        document.getElementById('btn-next').style.display = 'flex';
    }
</script>
</body>
