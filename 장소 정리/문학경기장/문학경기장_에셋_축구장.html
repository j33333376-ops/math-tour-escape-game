<!-- 원본 크기: 1200x750 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문학경기장 축구장 (조감)</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .msf-svg { display:block; width:100%; height:auto; }
  @keyframes msf-sheen { 0%,100% { opacity:0.04; } 50% { opacity:0.13; } }
  .msf-sheen { animation: msf-sheen 6s ease-in-out infinite; }
  @keyframes msf-flag { 0%,100% { transform: skewX(-6deg); } 50% { transform: skewX(6deg); } }
  .msf-flag { animation: msf-flag 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
  @keyframes msf-ball { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-14px,10px); } }
  .msf-ball { animation: msf-ball 5s ease-in-out infinite; }
</style>
</head>
<body>
<svg class="msf-svg" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="문학경기장 축구장 조감도">
<title>문학경기장 축구장</title>
<desc>문학경기장 축구장을 위에서 내려다본 조감도. 잔디 줄무늬와 경기장 규격선, 둘레의 육상 트랙과 관중석이 함께 그려져 있다.</desc>
<defs>
  <linearGradient id="msfGrass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4aa851"/>
    <stop offset="1" stop-color="#2b7434"/>
  </linearGradient>
  <linearGradient id="msfTrack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d46a4a"/>
    <stop offset="1" stop-color="#b2503a"/>
  </linearGradient>
  <linearGradient id="msfStand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b6c7c"/>
    <stop offset="1" stop-color="#3d4854"/>
  </linearGradient>
</defs>

<!-- 관중석 테두리 -->
<rect x="0" y="0" width="1200" height="750" rx="26" fill="#4a5462"/>
<g opacity="0.85">
  <rect x="0" y="0" width="1200" height="750" rx="26" fill="none" stroke="#333c47" stroke-width="6"/>
</g>
<g fill="#8894a4" opacity="0.55">
  <rect x="18" y="18" width="1164" height="12" rx="6"/>
  <rect x="18" y="720" width="1164" height="12" rx="6"/>
  <rect x="18" y="18" width="12" height="714" rx="6"/>
  <rect x="1170" y="18" width="12" height="714" rx="6"/>
</g>
<!-- 관중 좌석 점 -->
<g fill="#c9d2dc" opacity="0.5">
  <rect x="40" y="40" width="1120" height="6" rx="3"/>
  <rect x="40" y="704" width="1120" height="6" rx="3"/>
</g>
<g fill="#e6403a" opacity="0.45">
  <rect x="200" y="40" width="120" height="6" rx="3"/>
  <rect x="700" y="704" width="140" height="6" rx="3"/>
</g>
<g fill="#2f6fc4" opacity="0.45">
  <rect x="620" y="40" width="140" height="6" rx="3"/>
  <rect x="280" y="704" width="120" height="6" rx="3"/>
</g>

<!-- 육상 트랙 -->
<rect x="58" y="58" width="1084" height="634" rx="150" fill="url(#msfTrack)"/>
<g fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.55">
  <rect x="72" y="72" width="1056" height="606" rx="138"/>
  <rect x="86" y="86" width="1028" height="578" rx="126"/>
  <rect x="100" y="100" width="1000" height="550" rx="114"/>
</g>

<!-- 필드 베이스 -->
<rect x="118" y="118" width="964" height="514" rx="8" fill="url(#msfGrass)"/>

<!-- 잔디 깎은 줄무늬 -->
<g fill="#ffffff" class="msf-sheen">
  <rect x="214" y="118" width="96" height="514"/>
  <rect x="406" y="118" width="96" height="514"/>
  <rect x="598" y="118" width="96" height="514"/>
  <rect x="790" y="118" width="96" height="514"/>
  <rect x="982" y="118" width="96" height="514"/>
</g>

<!-- 필드 외곽선 -->
<rect x="140" y="140" width="920" height="470" fill="none" stroke="#ffffff" stroke-width="4"/>

<!-- 중앙선 & 센터서클 -->
<line x1="600" y1="140" x2="600" y2="610" stroke="#ffffff" stroke-width="4"/>
<circle cx="600" cy="375" r="72" fill="none" stroke="#ffffff" stroke-width="4"/>
<circle cx="600" cy="375" r="5" fill="#ffffff"/>

<!-- 좌측 페널티 박스 -->
<rect x="140" y="212" width="176" height="326" fill="none" stroke="#ffffff" stroke-width="4"/>
<rect x="140" y="303" width="64" height="144" fill="none" stroke="#ffffff" stroke-width="4"/>
<circle cx="256" cy="375" r="5" fill="#ffffff"/>
<path d="M 316,318 A 72,72 0 0 1 316,432" fill="none" stroke="#ffffff" stroke-width="4"/>

<!-- 우측 페널티 박스 -->
<rect x="884" y="212" width="176" height="326" fill="none" stroke="#ffffff" stroke-width="4"/>
<rect x="996" y="303" width="64" height="144" fill="none" stroke="#ffffff" stroke-width="4"/>
<circle cx="944" cy="375" r="5" fill="#ffffff"/>
<path d="M 884,318 A 72,72 0 0 0 884,432" fill="none" stroke="#ffffff" stroke-width="4"/>

<!-- 골대 -->
<rect x="126" y="347" width="14" height="56" fill="#ffffff" opacity="0.28" stroke="#ffffff" stroke-width="3"/>
<rect x="1060" y="347" width="14" height="56" fill="#ffffff" opacity="0.28" stroke="#ffffff" stroke-width="3"/>

<!-- 코너 아크 -->
<path d="M 140,158 A 18,18 0 0 1 158,140" fill="none" stroke="#ffffff" stroke-width="3"/>
<path d="M 1042,140 A 18,18 0 0 1 1060,158" fill="none" stroke="#ffffff" stroke-width="3"/>
<path d="M 158,610 A 18,18 0 0 1 140,592" fill="none" stroke="#ffffff" stroke-width="3"/>
<path d="M 1060,592 A 18,18 0 0 1 1042,610" fill="none" stroke="#ffffff" stroke-width="3"/>

<!-- 코너 깃발 -->
<g stroke="#f2f2f2" stroke-width="3" stroke-linecap="round">
  <line x1="140" y1="140" x2="140" y2="112"/>
  <line x1="1060" y1="140" x2="1060" y2="112"/>
  <line x1="140" y1="610" x2="140" y2="638"/>
  <line x1="1060" y1="610" x2="1060" y2="638"/>
</g>
<g fill="#f2c14e">
  <path class="msf-flag" d="M140,112 L166,120 L140,128 Z"/>
  <path class="msf-flag" d="M1060,112 L1086,120 L1060,128 Z"/>
  <path class="msf-flag" d="M140,638 L166,630 L140,622 Z"/>
  <path class="msf-flag" d="M1060,638 L1086,630 L1060,622 Z"/>
</g>

<!-- 선수 -->
<g>
  <g fill="#2f6fc4" stroke="#1e4c8c" stroke-width="1.6">
    <circle cx="420" cy="300" r="11"/><circle cx="470" cy="420" r="11"/>
    <circle cx="352" cy="392" r="11"/><circle cx="536" cy="252" r="11"/>
    <circle cx="252" cy="360" r="11"/>
  </g>
  <g fill="#e6403a" stroke="#a82b26" stroke-width="1.6">
    <circle cx="700" cy="330" r="11"/><circle cx="758" cy="440" r="11"/>
    <circle cx="666" cy="470" r="11"/><circle cx="838" cy="300" r="11"/>
    <circle cx="930" cy="386" r="11"/>
  </g>
</g>
<g class="msf-ball">
  <circle cx="616" cy="352" r="9" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <polygon points="616,346 621,350 619,356 613,356 611,350" fill="#333333"/>
</g>

<!-- 규격 안내 (매쓰투어) -->
<g opacity="0.92">
  <line x1="140" y1="662" x2="1060" y2="662" stroke="#ffe9a8" stroke-width="2.4"/>
  <line x1="140" y1="654" x2="140" y2="670" stroke="#ffe9a8" stroke-width="2.4"/>
  <line x1="1060" y1="654" x2="1060" y2="670" stroke="#ffe9a8" stroke-width="2.4"/>
  <rect x="546" y="646" width="108" height="30" rx="6" fill="#2b3540" opacity="0.75"/>
  <text x="600" y="667" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffe9a8">105 m</text>

  <line x1="92" y1="140" x2="92" y2="610" stroke="#ffe9a8" stroke-width="2.4"/>
  <line x1="84" y1="140" x2="100" y2="140" stroke="#ffe9a8" stroke-width="2.4"/>
  <line x1="84" y1="610" x2="100" y2="610" stroke="#ffe9a8" stroke-width="2.4"/>
  <rect x="62" y="360" width="62" height="30" rx="6" fill="#2b3540" opacity="0.75"/>
  <text x="93" y="381" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffe9a8">68 m</text>
</g>

<!-- 미세 하이라이트 -->
<rect x="118" y="118" width="964" height="514" rx="8" fill="#ffffff" opacity="0.03"/>
</svg>
</body>
</html>
