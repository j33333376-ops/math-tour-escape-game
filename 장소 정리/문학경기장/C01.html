<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문학경기장 MATHTOUR - 인천어린이박물관 도착</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1e293b;
        }

        /* 16:9 비율 고정 메인 컨테이너 */
        #game-container {
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(180deg, #e0f2fe 0%, #f8fafc 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }

        /* 상단 스테이지 표시바 */
        .top-bar {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            height: 48px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .stage-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stage-title .badge {
            background: #2563eb;
            color: #ffffff;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: 'Roboto Mono', monospace;
        }

        .progress-bar-container {
            width: 160px;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            width: 20%;
            height: 100%;
            background: #2563eb;
            border-radius: 4px;
        }

        /* 무대 요소 배치 영역 */
        .stage-viewport {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* 지면 오버레이 */
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, rgba(226, 232, 240, 0.4) 0%, #cbd5e1 100%);
            border-top: 2px solid #94a3b8;
            z-index: 1;
        }

        /* 인물 Wrapper 공통 */
        .char-wrapper {
            position: absolute;
            overflow: visible;
            z-index: 3;
            transition: filter 0.2s;
        }

        /* 상황 설명 박스 (유형 1) */
        .situation-box {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 24px 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
            z-index: 10;
            text-align: center;
        }

        .situation-title {
            font-size: 18px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 8px;
            display: inline-block;
            padding-bottom: 4px;
            border-bottom: 2px solid #2563eb;
        }

        .situation-text {
            font-size: 15px;
            line-height: 1.6;
            color: #334155;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        /* 이동 버튼 */
        .btn-nav {
            position: absolute;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Pretendard', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3), 0 2px 4px -2px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-nav:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(37, 99, 235, 0.4);
        }

        .btn-nav:active {
            transform: translateY(0);
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next {
            right: 20px;
            bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 상단 진행 바 -->
        <div class="top-bar">
            <div class="stage-title">
                <span class="badge">STAGE 01</span>
                <span>문학경기장 MATHTOUR - 어린이박물관</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
        </div>

        <!-- 메인 무대 배치 영역 -->
        <div class="stage-viewport">
            <!-- 건물 에셋: 인천어린이박물관 -->
            <div style="position:absolute; left:33px; bottom:60px; width:1000px; height:500px; overflow:hidden; z-index:1;">
                <iframe src="인천어린이박물관.html" scrolling="no" style="border:0; width:1000px; height:500px; transform:scale(1); transform-origin:top left; pointer-events:none;"></iframe>
            </div>

            <!-- 등장인물: 민우 (왼쪽 끝 배치) -->
            <div class="char-wrapper" id="char-민우" style="left:30px; bottom:40px; width:260px; height:320px;">
                <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
            </div>

            <!-- 등장인물: 서연 (오른쪽 끝 배치) -->
            <div class="char-wrapper" id="char-서연" style="right:30px; bottom:40px; width:260px; height:320px;">
                <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scaleX(-1); transform-origin:center; pointer-events:none;"></iframe>
            </div>

            <!-- 바닥 지면 연출 -->
            <div class="ground"></div>
        </div>

        <!-- 유형 1: 상황 연출 카드 -->
        <div class="situation-box">
            <div class="situation-title">인천어린이박물관 도착</div>
            <div class="situation-text">
                민우와 서연이는 인천 문학경기장 내에 위치한 어린이박물관에 도착했습니다.<br>
                두 사람은 흥미진진한 박물관 전시를 관람하며 곳곳에 숨겨진 수학적 원리를 찾아볼 계획입니다.
            </div>
        </div>

        <!-- 하단 이동 버튼 -->
        <button id="btn-prev" class="btn-nav" onclick="goPage('index.html')">
            &#9664; 이전
        </button>
        <button id="btn-next" class="btn-nav" onclick="goPage('C02.html')">
            다음 &#9654;
        </button>
    </div>

    <script>
        // 페이지 이동 공통 함수
        function goPage(url) {
            if (url) {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
