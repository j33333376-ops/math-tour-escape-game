<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>문학경기장 - 인천어린이박물관</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .cm-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="cm-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천어린이박물관">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfe1f4"/><stop offset="100%" stop-color="#eef7fc"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="500" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="230" cy="80" rx="76" ry="22"/><ellipse cx="960" cy="66" rx="84" ry="24"/></g>
  <circle cx="1060" cy="120" r="46" fill="#ffd23f" opacity="0.9"/>

  <!-- 광장 -->
  <rect x="0" y="500" width="1200" height="220" fill="#d9d3c6"/>
  <rect x="0" y="500" width="1200" height="12" fill="#c4bcab"/>
  <g stroke="#c4bcab" stroke-width="2" opacity="0.8"><line x1="0" y1="580" x2="1200" y2="580"/><line x1="0" y1="656" x2="1200" y2="656"/><line x1="320" y1="512" x2="280" y2="720"/><line x1="880" y1="512" x2="920" y2="720"/></g>

  <!-- 박물관 본관 : 알록달록 큐브 조합 -->
  <g>
    <!-- 메인 블록 -->
    <rect x="300" y="240" width="380" height="260" fill="#f2f5f8" stroke="#b7c6d0" stroke-width="4"/>
    <!-- 빨강 큐브 -->
    <rect x="240" y="300" width="140" height="200" fill="#e05e5e" stroke="#b23a32" stroke-width="4"/>
    <g fill="#ffd9d9"><rect x="262" y="330" width="40" height="40" rx="6"/><rect x="318" y="330" width="40" height="40" rx="6"/><rect x="262" y="396" width="40" height="40" rx="6"/><rect x="318" y="396" width="40" height="40" rx="6"/></g>
    <!-- 파랑 큐브(기울어진 창) -->
    <rect x="560" y="200" width="180" height="160" fill="#4a90d9" stroke="#2b6cb0" stroke-width="4"/>
    <g fill="#d3e8fa"><circle cx="610" cy="252" r="24"/><circle cx="686" cy="252" r="24"/><rect x="586" y="296" width="124" height="34" rx="10"/></g>
    <!-- 노랑 큐브 -->
    <rect x="660" y="360" width="200" height="140" fill="#ffcf4a" stroke="#d9a32b" stroke-width="4"/>
    <g fill="#fff3cd"><rect x="684" y="388" width="44" height="44" rx="8"/><rect x="748" y="388" width="44" height="44" rx="8"/><rect x="812" y="388" width="30" height="44" rx="8"/></g>
    <!-- 초록 원통 -->
    <g>
      <rect x="880" y="280" width="120" height="220" fill="#5aa66a" stroke="#3f8a4f" stroke-width="4"/>
      <ellipse cx="940" cy="280" rx="60" ry="20" fill="#74c084" stroke="#3f8a4f" stroke-width="4"/>
      <g fill="#d7f2dd"><rect x="904" y="320" width="30" height="30" rx="8"/><rect x="946" y="320" width="30" height="30" rx="8"/><rect x="904" y="376" width="30" height="30" rx="8"/><rect x="946" y="376" width="30" height="30" rx="8"/><rect x="904" y="432" width="30" height="30" rx="8"/><rect x="946" y="432" width="30" height="30" rx="8"/></g>
    </g>
    <!-- 본관 창/문 -->
    <g fill="#bfe0ea" stroke="#8fa8b6" stroke-width="3"><rect x="330" y="280" width="60" height="60" rx="8"/><rect x="410" y="280" width="60" height="60" rx="8"/><rect x="490" y="280" width="60" height="60" rx="8"/></g>
    <!-- 무지개 아치 입구 -->
    <g>
      <path d="M400,500 A85,85 0 0 1 570,500" fill="none" stroke="#e05e5e" stroke-width="16"/>
      <path d="M416,500 A69,69 0 0 1 554,500" fill="none" stroke="#ffcf4a" stroke-width="16"/>
      <path d="M432,500 A53,53 0 0 1 538,500" fill="none" stroke="#5aa66a" stroke-width="16"/>
      <path d="M448,500 A37,37 0 0 1 522,500" fill="none" stroke="#4a90d9" stroke-width="16"/>
      <rect x="458" y="446" width="54" height="54" fill="#26333d"/>
      <line x1="485" y1="446" x2="485" y2="500" stroke="#5a7285" stroke-width="2.5"/>
    </g>
    <!-- 지붕 위 연필 조형물 -->
    <g transform="translate(350,240) rotate(-14)">
      <rect x="-14" y="-96" width="28" height="86" fill="#ffcf4a" stroke="#d9a32b" stroke-width="3"/>
      <polygon points="-14,-96 0,-126 14,-96" fill="#e8c9a8" stroke="#c9955c" stroke-width="3"/>
      <polygon points="-5,-115 0,-126 5,-115" fill="#5a4632"/>
      <rect x="-14" y="-16" width="28" height="12" fill="#e08baa"/>
    </g>
    <!-- 간판 -->
    <g transform="translate(490,222)">
      <rect x="-150" y="-26" width="300" height="42" rx="10" fill="#2b6cb0"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#ffffff">인천어린이박물관</text>
    </g>
  </g>

  <!-- 공룡 조형물 -->
  <g transform="translate(140,500)">
    <path d="M-60,0 Q-70,-40 -34,-52 Q-6,-60 8,-44 Q40,-56 56,-30 Q78,-38 84,-16 Q92,4 70,0 Z" fill="#74b06a" stroke="#4f8a48" stroke-width="3.5"/>
    <path d="M-58,-30 Q-88,-38 -96,-64 Q-84,-58 -72,-60 Q-80,-72 -74,-86 Q-64,-74 -52,-74 Q-58,-56 -50,-44 Z" fill="#74b06a" stroke="#4f8a48" stroke-width="3.5"/>
    <circle cx="-76" cy="-70" r="3.5" fill="#26333d"/>
    <g stroke="#4f8a48" stroke-width="7" stroke-linecap="round"><line x1="-34" y1="0" x2="-34" y2="18"/><line x1="30" y1="0" x2="30" y2="18"/></g>
  </g>

  <!-- 아이들 -->
  <g><circle cx="700" cy="586" r="9" fill="#e8c9a8"/><rect x="692" y="594" width="16" height="24" rx="6" fill="#e05e5e"/></g>
  <g><circle cx="740" cy="596" r="9" fill="#e8c9a8"/><rect x="732" y="604" width="16" height="24" rx="6" fill="#4a90d9"/></g>
  <g><circle cx="330" cy="600" r="10" fill="#e8c9a8"/><rect x="321" y="609" width="18" height="30" rx="6" fill="#6b46c1"/></g>
  <!-- 풍선 든 아이 -->
  <g>
    <circle cx="860" cy="588" r="9" fill="#e8c9a8"/><rect x="852" y="596" width="16" height="24" rx="6" fill="#2f855a"/>
    <line x1="872" y1="600" x2="886" y2="556" stroke="#8a949b" stroke-width="2"/>
    <circle cx="888" cy="546" r="14" fill="#e08baa"/>
  </g>

  <!-- 사인 -->
  <g transform="translate(600,684)">
    <rect x="-128" y="-22" width="256" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#4a90d9" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#2b6cb0">인천어린이박물관</text>
  </g>
</svg>
</body>
</html>
