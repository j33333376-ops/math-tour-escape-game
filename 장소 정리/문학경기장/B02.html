<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문학경기장 MATHTOUR - B02</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #f8fafc;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            z-index: 3;
            transition: filter 0.2s ease;
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        #dialogue-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 24px 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 20;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        #speaker-name {
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #2563eb;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        #dialogue-text {
            font-family: 'Pretendard', sans-serif;
            font-weight: 400;
            font-size: 16px;
            color: #1e293b;
            line-height: 1.6;
            letter-spacing: -0.02em;
            min-height: 50px;
        }

        .click-guide {
            position: absolute;
            bottom: 12px;
            right: 24px;
            font-size: 12px;
            color: #64748b;
            font-family: 'Roboto Mono', monospace;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .btn-nav {
            position: absolute;
            bottom: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-family: 'Pretendard', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.1s;
            z-index: 30;
            display: none;
        }

        .btn-nav:hover {
            background-color: #1d4ed8;
        }

        .btn-nav:active {
            transform: scale(0.98);
        }

        #btn-prev {
            left: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
        }

        #btn-skip {
            display: block;
            background-color: #64748b;
        }

        #btn-skip:hover {
            background-color: #475569;
        }

        #transition-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(37,99,235,0) 0%, rgba(15,23,42,1) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            transform: scale(1);
        }

        #transition-overlay.active {
            opacity: 1;
            transform: scale(1.5);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <img src="휠체어.png" class="bg-image" alt="배경 이미지">

        <div class="char-wrapper" id="char-민우" style="left: 60px; bottom: 40px;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <div class="char-wrapper" id="char-서연" style="right: 60px; bottom: 40px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name">민우</div>
            <div id="dialogue-text">대화 내용을 불러오는 중입니다...</div>
            <div class="click-guide">클릭하여 계속 ▼</div>
        </div>

        <button id="btn-prev" class="btn-nav" onclick="goPrev()">이전</button>
        <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
        <button id="btn-next" class="btn-nav" onclick="goNext()">다음</button>

        <div id="transition-overlay"></div>
    </div>

    <script>
        const dialogues = [
            { speaker: "민우", text: "저기 경기장 입구를 봐. 휠체어를 타신 분들이 오고 계시는데, 저 경사로를 올라가려면 어떻게 해야 안전할까?", target: "char-민우" },
            { speaker: "서연", text: "아, 경사로 말이야? 무조건 완만하다고 좋은 건 아닐 수도 있고... 공간에 맞춰서 적절한 각도와 길이를 계산해야 하지 않을까?", target: "char-서연" },
            { speaker: "민우", text: "맞아! 법적으로 정해진 기울기 기준이나 수학적인 비율이 숨겨져 있을 것 같아. 경기장에 들어가기 전에 이 경사로의 비밀을 한번 풀어보자!", target: "char-민우" }
        ];

        let currentIndex = 0;

        const speakerNameEl = document.getElementById("speaker-name");
        const dialogueTextEl = document.getElementById("dialogue-text");
        const dialogueBoxEl = document.getElementById("dialogue-box");
        const btnPrev = document.getElementById("btn-prev");
        const btnNext = document.getElementById("btn-next");
        const btnSkip = document.getElementById("btn-skip");
        const charMinu = document.getElementById("char-민우");
        const charSoyeon = document.getElementById("char-서연");

        function updateDialogue() {
            if (currentIndex < dialogues.length) {
                const current = dialogues[currentIndex];
                speakerNameEl.textContent = current.speaker;
                dialogueTextEl.textContent = current.text;

                if (current.target === "char-민우") {
                    charMinu.classList.remove("inactive");
                    charSoyeon.classList.add("inactive");
                } else {
                    charSoyeon.classList.remove("inactive");
                    charMinu.classList.add("inactive");
                }
            } else {
                endDialogue();
            }
        }

        function advanceDialogue() {
            currentIndex++;
            if (currentIndex < dialogues.length) {
                updateDialogue();
            } else {
                endDialogue();
            }
        }

        function skipDialogue() {
            currentIndex = dialogues.length;
            endDialogue();
        }

        function endDialogue() {
            dialogueBoxEl.style.display = "none";
            btnSkip.style.display = "none";
            btnPrev.style.display = "block";
            btnNext.style.display = "block";

            charMinu.classList.remove("inactive");
            charSoyeon.classList.remove("inactive");
        }

        function goPrev() {
            window.location.href = "B01.html";
        }

        function goNext() {
            const overlay = document.getElementById("transition-overlay");
            overlay.classList.add("active");
            setTimeout(() => {
                window.location.href = "B03.html";
            }, 800);
        }

        updateDialogue();
    </script>
</body>
</html>
