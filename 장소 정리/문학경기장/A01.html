<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옹진 섬탈출 게임 - 인트로</title>
    <style>
        /* 공통 폰트 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 16:9 비율의 게임 컨테이너 */
        #game-container {
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(180deg, #4da8da 0%, #1a4a76 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 스테이지 표시기 */
        .stage-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.2rem;
            z-index: 100;
        }

        /* 메인 타이틀 */
        .main-title {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            font-family: 'Black Han Sans', sans-serif;
            font-size: clamp(3rem, 5vw, 4.5rem);
            color: #ffffff;
            text-shadow: 4px 4px 0px #1e40af, 8px 8px 15px rgba(0,0,0,0.5);
            margin: 0;
            z-index: 100;
            letter-spacing: 5px;
        }

        /* 상황 설명 텍스트 */
        .story-text {
            position: absolute;
            top: 28%;
            width: 80%;
            left: 10%;
            text-align: center;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.2rem;
            color: #e2e8f0;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: -0.02em;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            z-index: 100;
        }

        /* 공통 버튼 스타일 */
        .btn-nav {
            position: absolute;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s, transform 0.1s;
            z-index: 110;
        }
        .btn-nav:hover {
            background-color: #2563eb;
        }
        .btn-nav:active {
            transform: scale(0.95) translateX(-50%) !important; /* 중앙 배치 버튼용 예외 처리 */
        }

        /* 시작하기 버튼 (중앙 배치로 변경) */
        #btn-next {
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 40px;
            font-size: 1.4rem;
            border-radius: 50px; /* 둥근 버튼으로 강조 */
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            animation: pulse-btn 2s infinite;
        }

        @keyframes pulse-btn {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
            50% { transform: translateX(-50%) scale(1.05); box-shadow: 0 10px 25px rgba(59, 130, 246, 0.8); }
            100% { transform: translateX(-50%) scale(1); box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
        }

        /* 불시착하는 비행기 연출 */
        .crashing-plane {
            position: absolute;
            top: 12%;
            right: 8%;
            font-size: 4rem;
            transform: rotate(35deg);
            z-index: 20;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5));
            animation: plane-shake 0.5s infinite alternate;
        }
        .crashing-plane::after {
            content: '🔥';
            position: absolute;
            top: -10px;
            left: -20px;
            font-size: 2.5rem;
        }

        @keyframes plane-shake {
            0% { transform: rotate(35deg) translate(0, 0); }
            100% { transform: rotate(37deg) translate(5px, 5px); }
        }

        /* 5개의 섬 (배경) - 캐릭터들 사이사이 빈 공간으로 위치 재배치 */
        .island {
            position: absolute;
            transform: translateX(-50%); /* 기준점을 섬의 중앙으로 설정하여 배치 용이성 확보 */
            background: linear-gradient(135deg, #4ade80, #166534);
            border-radius: 50% 50% 30% 30%;
            box-shadow: inset -5px -10px 15px rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .island::before { /* 섬 이름 태그 */
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            text-shadow: 1px 1px 3px #000;
            white-space: nowrap;
        }
        
        /* 캐릭터들 사이 간격(18%, 34%, 50%, 66%, 82%)에 맞춰 완벽 분배 */
        .island-1 { width: 140px; height: 60px; top: 58%; left: 18%; }
        .island-1::before { content: '백령도'; }
        
        .island-2 { width: 110px; height: 50px; top: 68%; left: 34%; background: linear-gradient(135deg, #65a30d, #3f6212); }
        .island-2::before { content: '연평도'; }
        
        .island-3 { width: 160px; height: 70px; top: 56%; left: 50%; }
        .island-3::before { content: '덕적도'; }
        
        .island-4 { width: 130px; height: 55px; top: 68%; left: 66%; background: linear-gradient(135deg, #10b981, #047857); }
        .island-4::before { content: '영흥도'; }
        
        .island-5 { width: 180px; height: 80px; top: 58%; left: 82%; }
        .island-5::before { content: '영종도'; }

        /* 캐릭터 래퍼 (크기 조정 및 균등 배치 기준점 변경) */
        .char-wrapper {
            position: absolute;
            bottom: -30px;
            transform-origin: bottom center;
            transform: translateX(-50%) scale(0.45); /* 중앙 정렬 후 스케일 적용하여 여백 안정화 */
            z-index: 50;
        }

    </style>
</head>
<body>

<div id="game-container">
    
    <div class="stage-indicator">인트로 (게임 시작)</div>
    <h1 class="main-title">옹진 섬탈출 게임</h1>
    <div class="story-text">제주도 수학여행에서 돌아오던 중 북한 NLL에 불시착했다!<br>북한군의 추격을 피해 5개의 섬을 거쳐 무사히 인천으로 돌아가자.</div>
    
    <button class="btn-nav" id="btn-next">게임 시작하기</button>

    <div class="crashing-plane">🛩️</div>
    
    <div class="island island-1"></div>
    <div class="island island-2"></div>
    <div class="island island-3"></div>
    <div class="island island-4"></div>
    <div class="island island-5"></div>

    <div class="char-wrapper" style="left: 10%;">

            <style>

                .kmw-ear-l, .kmw-ear-r { position: absolute; top: 52px; width: 16px; height: 26px; background-color: #ffdbb5; border: 3.5px solid #8d5b4c; z-index: 2; }

                .kmw-ear-r { right: -11px; border-radius: 0 50% 50% 0; transform: rotate(10deg); }
                .kmw-hair-back { position: absolute; top: -8px; left: -4px; width: 128px; height: 80px; background-color: #242424; border: 3.5px solid #141414; border-radius: 60px 60px 20px 20px; z-index: 1; }
                .kmw-neck { position: absolute; top: 105px; left: 50%; transform: translateX(-50%); width: 28px; height: 40px; background-color: #ffdbb5; border-left: 3.5px solid #8d5b4c; border-right: 3.5px solid #8d5b4c; z-index: 3; }
                .kmw-face-skin { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffdbb5; border: 3.5px solid #8d5b4c; border-radius: 50px 50px 60px 60px; z-index: 4; overflow: hidden; }
                .kmw-front-hair { position: absolute; top: 0; left: 0; width: 100%; height: 42px; background-color: #242424; border-bottom: 3.5px solid #141414; z-index: 10; }
                .kmw-hair-point { position: absolute; top: 36px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid #141414; z-index: 11; }
                .kmw-eyebrow-l, .kmw-eyebrow-r { position: absolute; top: 50px; width: 18px; height: 4px; background-color: #221a15; border-radius: 2px; z-index: 6; }
                .kmw-eyebrow-l { left: 22px; transform: rotate(5deg); }
                .kmw-eyebrow-r { right: 22px; transform: rotate(-5deg); }
                .kmw-eye-l, .kmw-eye-r { position: absolute; top: 62px; width: 15px; height: 15px; background-color: #221a15; border-radius: 50%; z-index: 6; }
                .kmw-eye-l::after, .kmw-eye-r::after { content: ''; position: absolute; top: 2px; left: 2px; width: 4px; height: 4px; background-color: #fff; border-radius: 50%; }
                .kmw-eye-l { left: 24px; }
                .kmw-eye-r { right: 24px; }
                .kmw-blush-l, .kmw-blush-r { position: absolute; top: 78px; width: 18px; height: 9px; background-color: rgba(244, 63, 94, 0.4); border-radius: 50%; filter: blur(0.5px); z-index: 6; }
                .kmw-blush-l { left: 16px; }
                .kmw-blush-r { right: 16px; }
                .kmw-mouth { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 22px; height: 11px; background-color: #e11d48; border-radius: 2px 2px 12px 12px; border: 1.5px solid #9f1239; z-index: 6; }
                .kmw-uniform-top { position: absolute; top: 180px; left: 50%; transform: translateX(-50%); width: 124px; height: 110px; background-color: #1e293b; border: 3.5px solid #475569; border-radius: 24px 24px 10px 10px; z-index: 7; overflow: hidden; }
                .kmw-collar-l { position: absolute; top: -2px; left: 32px; width: 30px; height: 26px; background-color: #ffffff; border: 3px solid #475569; transform: rotate(-30deg); border-radius: 0 0 5px 0; }
                .kmw-collar-r { position: absolute; top: -2px; right: 32px; width: 30px; height: 26px; background-color: #ffffff; border: 3px solid #475569; transform: rotate(30deg); border-radius: 0 0 0 5px; }
                .kmw-tie { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 12px; height: 50px; background-color: #b91c1c; border: 2px solid #7f1d1d; border-radius: 2px 2px 6px 6px; z-index: 10; }
                .kmw-tie::after { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 16px; height: 10px; background-color: #b91c1c; border: 2px solid #7f1d1d; border-radius: 3px; }
            </style>
            <div class="kmw-stage">
                <div class="kmw-head-wrapper">
                    <div class="kmw-hair-back"></div>
                    <div class="kmw-ear-l"></div>
                    <div class="kmw-ear-r"></div>
                    <div class="kmw-neck"></div>
                    <div class="kmw-face-skin">
                        <div class="kmw-front-hair"></div>
                        <div class="kmw-hair-point" style="left: 15px;"></div>
                        <div class="kmw-hair-point" style="left: 45px;"></div>
                        <div class="kmw-hair-point" style="right: 25px;"></div>
                        <div class="kmw-eyebrow-l"></div>
                        <div class="kmw-eyebrow-r"></div>
                        <div class="kmw-eye-l"></div>
                        <div class="kmw-eye-r"></div>
                        <div class="kmw-blush-l"></div>
                        <div class="kmw-blush-r"></div>
                        <div class="kmw-mouth"></div>
                    </div>
                </div>
                <div class="kmw-uniform-top">
                    <div class="kmw-collar-l"></div>
                    <div class="kmw-collar-r"></div>
                    <div class="kmw-tie"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="char-wrapper" style="left: 26%;">
        <div class="kyobok-seoyeon-component" style="display: inline-block; overflow: visible !important;">

                .ksy-hair-elastic { position: absolute; top: 28px; right: -6px; width: 14px; height: 14px; background-color: #fb7185; border: 2px solid #e11d48; border-radius: 50%; z-index: 2; }

                .ksy-neck { position: absolute; top: 105px; left: 50%; transform: translateX(-50%); width: 28px; height: 40px; background-color: #ffdbb5; border-left: 3.5px solid #8d5b4c; border-right: 3.5px solid #8d5b4c; z-index: 3; }
                .ksy-face-skin { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffdbb5; border: 3.5px solid #8d5b4c; border-radius: 50px 50px 60px 60px; z-index: 4; overflow: hidden; }
                .ksy-front-hair { position: absolute; top: 0; left: 0; width: 100%; height: 45px; background-color: #4a3728; border-bottom: 3.5px solid #2d1f10; z-index: 10; }

        <div class="ami-component-wrapper" style="display: inline-block; overflow: visible !important;">

                .robot-antenna-tip { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; background-color: #38bdf8; border: 3px solid #475569; border-radius: 50%; box-shadow: 0 0 12px #38bdf8; }
