<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인천대공원 MATHTOUR - A01</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #f2f7f2;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
  }

  #game-container {
    position: relative;
    width: 100%;
    max-width: 1066px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: linear-gradient(180deg, #cfe3c9 0%, #f2f7f2 55%, #e7ddc4 100%);
    border: 4px solid #2d5a27;
    box-shadow: 0 8px 24px rgba(45,90,39,0.25);
  }

  /* 나무 팻말 상단 표시바 */
  #signpost {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    background: #6d4c41;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 2px, transparent 2px, transparent 10px);
    color: #fdfbf7;
    padding: 8px 26px;
    border-radius: 14px;
    border: 3px solid #4e342e;
    font-family: 'Gowun Batang', serif;
    font-size: 20px;
    letter-spacing: 1px;
    z-index: 5;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  #stage {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  /* 에셋: 환경미래관 (건물) */
  #asset-환경미래관 {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    z-index: 1;
  }

  /* 인물 배치 */
  .char-wrapper {
    position: absolute;
    bottom: 40px;
    overflow: visible;
    z-index: 3;
    filter: brightness(0.55);
    transition: filter .2s;
  }
  .char-wrapper.active {
    filter: brightness(1);
  }
  .char-wrapper iframe {
    border: 0;
    width: 260px;
    height: 320px;
    pointer-events: none;
  }

  #char-민우   { left: 90px;  }
  #char-서연   { left: 340px; }
  #char-옥금   { left: 590px; }
  #char-미스터첸 { left: 830px; transform: scaleX(-1); }
  #char-미스터첸 iframe { transform: scaleX(-1); }

  /* 대화창 (유형2) */
  #dialogue-box {
    position: absolute;
    left: 30px; right: 30px; bottom: 20px;
    min-height: 130px;
    background: rgba(45,90,39,0.8);
    border: 3px solid #6d4c41;
    border-radius: 16px;
    padding: 16px 24px;
    color: #fdfbf7;
    z-index: 10;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  #speaker-name {
    font-family: 'Gowun Batang', serif;
    font-size: 20px;
    color: #f4a261;
    margin-bottom: 6px;
  }
  #dialogue-text {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    letter-spacing: -0.02em;
  }
  #dialogue-hint {
    position: absolute;
    right: 18px; bottom: 10px;
    font-size: 12px;
    color: #d8e6d3;
    font-family: 'Nanum Gothic Coding', monospace;
  }

  /* 버튼 */
  .btn-nav {
    position: absolute;
    background: #2d5a27;
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 20px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(45,90,39,0.2);
    z-index: 20;
    transition: background .2s;
  }
  .btn-nav:hover { background: #6d4c41; }

  #btn-prev { left: 20px; bottom: 20px; }
  #btn-next, #btn-skip { right: 20px; bottom: 20px; }
  #btn-next { display: none; }
</style>
</head>
<body>

<div id="game-container">
  <div id="signpost">환경미래관 앞</div>

  <div id="stage">
    <!-- 에셋: 건물 (환경미래관) -->
    <div id="asset-환경미래관" style="width:520px; height:390px; overflow:hidden;">
      <iframe src="인천대공원_장소_환경미래관.html" scrolling="no" style="border:0; width:520px; height:390px; transform-origin:top left; pointer-events:none;"></iframe>
    </div>

    <!-- 인물 -->
    <div class="char-wrapper" id="char-민우">
      <iframe src="등장인물_민우.html" scrolling="no"></iframe>
    </div>
    <div class="char-wrapper" id="char-서연">
      <iframe src="등장인물_서연.html" scrolling="no"></iframe>
    </div>
    <div class="char-wrapper" id="char-옥금">
      <iframe src="등장인물_옥금.html" scrolling="no"></iframe>
    </div>
    <div class="char-wrapper" id="char-미스터첸">
      <iframe src="등장인물_미스터첸.html" scrolling="no"></iframe>
    </div>
  </div>

  <!-- 대화창 -->
  <div id="dialogue-box" onclick="advanceDialogue()">
    <div id="speaker-name"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-hint">클릭해서 계속 ▶</div>
  </div>

  <button class="btn-nav" id="btn-prev" onclick="goPrev()">이전</button>
  <button class="btn-nav" id="btn-next" onclick="goNext()">다음</button>
  <button class="btn-nav" id="btn-skip" onclick="skipDialogue()">건너뛰기</button>
</div>

<script>
  const prevUrl = "index.html";
  const nextUrl = "A02.html";

  const dialogues = [
    { speaker: "민우", text: "서연아, 저기 환경미래관 앞에 있는 시계 같은 거 봤어? 되게 신기하게 생겼던데.", target: "char-민우" },
    { speaker: "서연", text: "아, 나도 봤어! 숫자가 계속 줄어들던데... 저게 대체 뭘까?", target: "char-서연" },
    { speaker: "옥금", text: "얘들아, 저건 '기후위기시계'란다. 지구의 평균 기온이 산업화 이전보다 1.5도 이상 오르기까지 남은 시간을 보여주는 시계야.", target: "char-옥금" },
    { speaker: "민우", text: "1.5도요? 겨우 그 정도 오르는 게 뭐가 그렇게 큰일이에요?", target: "char-민우" },
    { speaker: "옥금", text: "숫자는 작아 보여도 지구 전체의 평균이라 그 영향은 정말 크단다. 시간이 얼마 남지 않았다는 걸 보여주기 위해 저렇게 시계로 만든 거지.", target: "char-옥금" },
    { speaker: "서연", text: "그렇구나... 근데 저기 지나가시는 분, 뭔가 하실 말씀이 있으신가 봐요.", target: "char-서연" },
    { speaker: "미스터첸", text: "허허, 마침 좋은 이야기를 나누고 있었구먼. 평균 기온이 계속 오르면 우리가 상상하는 것보다 훨씬 위험한 일들이 벌어진다네.", target: "char-미스터첸" },
    { speaker: "미스터첸", text: "빙하가 녹아 해수면이 높아지고, 폭염과 가뭄, 대형 산불이 더 자주 일어나지. 또 태풍과 폭우 같은 극단적인 날씨도 늘어난단다.", target: "char-미스터첸" },
    { speaker: "미스터첸", text: "생태계의 균형도 무너져서 많은 동식물이 살 곳을 잃게 되지. 그러니 저 시계가 0이 되기 전에, 우리가 할 수 있는 일을 찾아야 한다네.", target: "char-미스터첸" },
    { speaker: "민우", text: "우리가 할 수 있는 일이라... 궁금해요. 더 알아보고 싶어요!", target: "char-민우" }
  ];

  let currentIndex = 0;
  const dialogueBox = document.getElementById('dialogue-box');
  const speakerName = document.getElementById('speaker-name');
  const dialogueText = document.getElementById('dialogue-text');
  const charWrappers = document.querySelectorAll('.char-wrapper');

  function renderDialogue() {
    const d = dialogues[currentIndex];
    speakerName.textContent = d.speaker;
    dialogueText.textContent = d.text;
    charWrappers.forEach(w => w.classList.remove('active'));
    const target = document.getElementById(d.target);
    if (target) target.classList.add('active');
  }

  function advanceDialogue() {
    currentIndex++;
    if (currentIndex >= dialogues.length) {
      endDialogue();
    } else {
      renderDialogue();
    }
  }

  function skipDialogue() {
    endDialogue();
  }

  function endDialogue() {
    dialogueBox.style.display = 'none';
    document.getElementById('btn-skip').style.display = 'none';
    charWrappers.forEach(w => w.classList.add('active'));
    document.getElementById('btn-prev').style.display = 'block';
    if (nextUrl) {
      document.getElementById('btn-next').style.display = 'block';
      document.getElementById('btn-next').textContent = '다음';
    } else {
      document.getElementById('btn-next').style.display = 'block';
      document.getElementById('btn-next').textContent = 'End';
    }
  }

  function goPrev() {
    if (prevUrl) window.location.href = prevUrl;
  }

  function goNext() {
    if (nextUrl) {
      window.location.href = nextUrl;
    } else {
      window.location.href = 'index.html';
    }
  }

  // 초기화
  document.getElementById('btn-next').style.display = 'none';
  renderDialogue();
</script>

</body>
</html>
