<!-- 원본 크기: 500x750 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우승 트로피</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .mtp-svg { display:block; width:100%; height:auto; }
  .mtp-shine { animation: mtp-shine 3.6s ease-in-out infinite; }
  @keyframes mtp-shine { 0%,100% { opacity:0.25; } 50% { opacity:0.75; } }
</style>
</head>
<body>
<svg class="mtp-svg" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="우승 트로피">
<title>우승 트로피</title>
<desc>양쪽에 손잡이가 달린 황금 우승 트로피와 대리석 받침.</desc>
<defs>
  <linearGradient id="mtpGold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a5f18"/><stop offset="0.28" stop-color="#e8b93c"/>
    <stop offset="0.5" stop-color="#fff2b8"/><stop offset="0.74" stop-color="#d9a52c"/>
    <stop offset="1" stop-color="#7a5214"/>
  </linearGradient>
  <linearGradient id="mtpStone" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a4048"/><stop offset="0.45" stop-color="#6b7480"/><stop offset="1" stop-color="#2c333a"/>
  </linearGradient>
</defs>
<ellipse cx="250" cy="712" rx="150" ry="24" fill="#2f3238" opacity="0.22"/>
<!-- 받침 -->
<path d="M136,704 L364,704 L344,652 L156,652 Z" fill="url(#mtpStone)" stroke="#20262c" stroke-width="4"/>
<path d="M156,652 L344,652 L332,620 L168,620 Z" fill="#7d8894" stroke="#20262c" stroke-width="3.4"/>
<rect x="196" y="656" width="108" height="34" rx="4" fill="#e8b93c" stroke="#8a5f18" stroke-width="3"/>
<g stroke="#8a5f18" stroke-width="3" stroke-linecap="round">
  <line x1="212" y1="668" x2="288" y2="668"/><line x1="212" y1="680" x2="266" y2="680"/>
</g>
<!-- 기둥 -->
<path d="M228,620 L272,620 L266,540 L234,540 Z" fill="url(#mtpGold)" stroke="#6e4a10" stroke-width="3.4"/>
<ellipse cx="250" cy="540" rx="42" ry="12" fill="url(#mtpGold)" stroke="#6e4a10" stroke-width="3.4"/>
<ellipse cx="250" cy="620" rx="28" ry="9" fill="#d9a52c" stroke="#6e4a10" stroke-width="3"/>
<!-- 컵 -->
<path d="M136,236 C136,398 190,472 224,530 L276,530 C310,472 364,398 364,236 Z"
      fill="url(#mtpGold)" stroke="#6e4a10" stroke-width="5"/>
<ellipse cx="250" cy="236" rx="114" ry="30" fill="#fff2b8" stroke="#6e4a10" stroke-width="5"/>
<ellipse cx="250" cy="240" rx="94" ry="20" fill="#a8761c"/>
<!-- 손잡이 -->
<path d="M136,272 C64,272 52,352 118,398" fill="none" stroke="url(#mtpGold)" stroke-width="20" stroke-linecap="round"/>
<path d="M364,272 C436,272 448,352 382,398" fill="none" stroke="url(#mtpGold)" stroke-width="20" stroke-linecap="round"/>
<path d="M136,272 C64,272 52,352 118,398" fill="none" stroke="#6e4a10" stroke-width="3" opacity="0.5"/>
<path d="M364,272 C436,272 448,352 382,398" fill="none" stroke="#6e4a10" stroke-width="3" opacity="0.5"/>
<!-- 컵 장식 -->
<g fill="none" stroke="#8a5f18" stroke-width="3.4" opacity="0.8">
  <path d="M152,306 q98,26 196,0"/>
  <path d="M166,354 q84,24 168,0"/>
</g>
<g transform="translate(250,398)">
  <circle r="34" fill="#fff2b8" stroke="#8a5f18" stroke-width="3.4"/>
  <path d="M0,-20 l6,13 l14,2 l-10,10 l3,14 l-13,-7 l-13,7 l3,-14 l-10,-10 l14,-2 Z" fill="#c2452e"/>
</g>
<!-- 광택 -->
<path class="mtp-shine" d="M176,270 C170,350 190,430 218,486" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
<ellipse class="mtp-shine" cx="192" cy="232" rx="38" ry="12" fill="#ffffff"/>
</svg>
</body>
</html>
