<!-- 원본 크기: 520x960 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송도 동북아무역센터(NEATT)</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .neat-svg { display:block; width:100%; height:auto; }
  @keyframes neat-blink { 0%,40%{opacity:1;} 50%{opacity:0.15;} 60%,100%{opacity:1;} }
  .neat-beacon { animation: neat-blink 2.4s ease-in-out infinite; }
  @keyframes neat-ripple { 0%,100%{ opacity:0.15; } 50%{ opacity:0.35; } }
  .neat-ripple { animation: neat-ripple 4s ease-in-out infinite; }
</style>
</head>
<body>
<svg class="neat-svg" viewBox="0 0 520 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="송도 동북아무역센터">
<title>송도 동북아무역센터(NEATT)</title>
<desc>세로로 솟은 첨탑형 초고층 빌딩과 그 앞을 가로지르는 보행 다리, 아래로 흐르는 수로</desc>
<defs>
 <linearGradient id="neat-g1" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7fb0c4"/><stop offset="0.5" stop-color="#a8d0dc"/><stop offset="1" stop-color="#6a9cb0"/>
 </linearGradient>
 <linearGradient id="neat-g2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#6a9cb0"/><stop offset="0.5" stop-color="#94c0cc"/><stop offset="1" stop-color="#5a8a9e"/>
 </linearGradient>
 <linearGradient id="neat-water" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#5f93b8"/><stop offset="1" stop-color="#2f5a7c"/>
 </linearGradient>
 <pattern id="neat-grid" patternUnits="userSpaceOnUse" width="16" height="22">
  <rect width="16" height="22" fill="none" stroke="#22404c" stroke-width="0.6" opacity="0.35"/>
 </pattern>
</defs>

<!-- 첨탑 마스트 -->
<line x1="260" y1="18" x2="260" y2="90" stroke="#c9d6da" stroke-width="3"/>
<circle class="neat-beacon" cx="260" cy="16" r="4.5" fill="#ff5a5a"/>

<!-- 타워 세그먼트 (아래로 갈수록 넓어지는 첨탑형) -->
<polygon points="246,90 274,90 282,190 238,190" fill="url(#neat-g1)"/>
<polygon points="246,90 274,90 282,190 238,190" fill="url(#neat-grid)"/>

<rect x="230" y="188" width="60" height="4" fill="#e8eef2"/>

<polygon points="236,192 284,192 294,320 226,320" fill="url(#neat-g2)"/>
<polygon points="236,192 284,192 294,320 226,320" fill="url(#neat-grid)"/>

<rect x="220" y="318" width="80" height="4" fill="#e8eef2"/>

<polygon points="224,322 296,322 308,470 212,470" fill="url(#neat-g1)"/>
<polygon points="224,322 296,322 308,470 212,470" fill="url(#neat-grid)"/>

<rect x="206" y="468" width="108" height="4" fill="#e8eef2"/>

<polygon points="210,472 310,472 324,630 196,630" fill="url(#neat-g2)"/>
<polygon points="210,472 310,472 324,630 196,630" fill="url(#neat-grid)"/>

<rect x="190" y="628" width="140" height="5" fill="#e8eef2"/>

<polygon points="194,633 326,633 340,760 180,760" fill="url(#neat-g1)"/>
<polygon points="194,633 326,633 340,760 180,760" fill="url(#neat-grid)"/>

<!-- 저층 포디움 -->
<rect x="150" y="760" width="220" height="46" fill="#3a5a68"/>
<rect x="150" y="760" width="220" height="46" fill="url(#neat-grid)"/>
<rect x="150" y="804" width="220" height="4" fill="#22404c"/>

<!-- 보행 다리 (사장교) -->
<g>
 <polygon points="255,690 265,690 275,808 245,808" fill="#c7ccce"/>
 <line x1="260" y1="695" x2="60" y2="806" stroke="#aeb6b8" stroke-width="2"/>
 <line x1="260" y1="705" x2="90" y2="806" stroke="#aeb6b8" stroke-width="2"/>
 <line x1="260" y1="715" x2="120" y2="806" stroke="#aeb6b8" stroke-width="2"/>
 <line x1="260" y1="725" x2="150" y2="806" stroke="#aeb6b8" stroke-width="2"/>
 <line x1="260" y1="735" x2="180" y2="806" stroke="#aeb6b8" stroke-width="2"/>
 <line x1="260" y1="695" x2="460" y2="806" stroke="#aeb6b8" stroke-width="2"/>
 <line x1="260" y1="705" x2="430" y2="806" stroke="#aeb6b8" stroke-width="2"/>
 <line x1="260" y1="715" x2="400" y2="806" stroke="#aeb6b8" stroke-width="2"/>
 <line x1="260" y1="725" x2="370" y2="806" stroke="#aeb6b8" stroke-width="2"/>
 <line x1="260" y1="735" x2="340" y2="806" stroke="#aeb6b8" stroke-width="2"/>
</g>
<rect x="30" y="806" width="460" height="16" fill="#dfe3e6" stroke="#b7bcbe" stroke-width="1"/>
<line x1="30" y1="808" x2="490" y2="808" stroke="#fff" stroke-width="1.5" stroke-dasharray="10,8" opacity="0.7"/>
<rect x="50" y="822" width="10" height="18" fill="#9aa3a5"/>
<rect x="460" y="822" width="10" height="18" fill="#9aa3a5"/>

<!-- 수로 -->
<rect x="0" y="822" width="520" height="138" fill="url(#neat-water)"/>
<g class="neat-ripple" stroke="#fff" stroke-width="1.4" opacity="0.25">
 <line x1="0" y1="850" x2="520" y2="850"/>
 <line x1="0" y1="875" x2="520" y2="875"/>
 <line x1="0" y1="902" x2="520" y2="902"/>
 <line x1="0" y1="930" x2="520" y2="930"/>
</g>
<!-- 타워 반영(수면 반사) -->
<polygon points="200,822 320,822 300,940 220,940" fill="#3a6a86" opacity="0.28"/>
<polygon points="230,822 290,822 278,890 242,890" fill="#7fb0c4" opacity="0.2"/>
</svg>
</body>
</html>
