<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송도센트럴파크 MATHTOUR - A03-1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        :root {
            --primary-color: #2d5a27;
            --wood-brown: #6d4c41;
            --sunlight-yellow: #f4a261;
            --sage-green: #8aa171;
            --text-dark: #3e4a3d;
            --bg-beige: #f2f7f2;
            --white: #ffffff;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #121812;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 16:9 메인 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: var(--bg-beige);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        /* 배경 이미지 */
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.85;
        }

        /* 상단 나무 팻말 헤더 */
        header {
            position: relative;
            z-index: 10;
            background: rgba(45, 90, 39, 0.9);
            color: #fdfbf7;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--wood-brown);
            backdrop-filter: blur(4px);
        }

        header h1 {
            font-family: 'Gowun Batang', serif;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fdfbf7;
        }

        header p {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 0.85rem;
            color: var(--sunlight-yellow);
        }

        /* 캐릭터 레이어 */
        .character-layer {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .char-wrapper {
            position: absolute;
            overflow: visible;
        }

        /* 캔버스 및 배경 영역 */
        .canvas-section {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* 실시간 이차함수 수식 배너 */
        .equation-badge {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(253, 251, 247, 0.92);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Nanum Gothic Coding', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border: 2px solid var(--sage-green);
            transition: all 0.3s ease;
        }

        .equation-badge.success {
            background: rgba(0, 40, 10, 0.9);
            color: #39ff14;
            border-color: #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
        }

        /* 하단 슬라이더 조작 컨트롤 */
        .controls-section {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-top: 3px solid var(--wood-brown);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .sliders-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .control-group {
            background: var(--bg-beige);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--sage-green);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .control-label span.val {
            color: var(--primary-color);
            font-weight: 700;
            font-family: 'Nanum Gothic Coding', monospace;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 5px;
            background: #c8e6c9;
            outline: none;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        input[type="range"]:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* 하단 버튼 바 */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guide-text {
            font-size: 0.85rem;
            color: var(--text-dark);
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 공통 버튼 스타일 */
        .btn-nav {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(45, 90, 39, 0.2);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--wood-brown);
        }

        .btn-nav:disabled {
            background: #a5d6a7;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-nav:active:not(:disabled) {
            transform: scale(0.96);
        }

        /* 하단 안내 상자 */
        .info-box {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid var(--sage-green);
            border-radius: 12px;
            padding: 12px 20px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 5;
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.6;
        }

        /* 성공 모달 팝업 */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #fdfbf7;
            padding: 25px 30px;
            border-radius: 16px;
            border: 2px solid var(--wood-brown);
            text-align: center;
            max-width: 420px;
            width: 85%;
            box-shadow: var(--shadow);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-card h2 {
            color: var(--primary-color);
            font-size: 1.2rem;
            font-family: 'Gowun Batang', serif;
            margin-bottom: 10px;
            word-break: keep-all;
        }

        .modal-card p {
            color: var(--text-dark);
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* 화면 이동 애니메이션 */
        .slide-left-out {
            animation: slideLeft 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes slideLeft {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-100%); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지 -->
        <img src="배경_국립세계문자박물관(위).png" alt="국립세계문자박물관 전경" class="bg-img" onerror="this.src='https://images.unsplash.com/photo-1580130248039-389304928172?auto=format&fit=crop&w=1200&q=80'">

        <!-- 등장인물 레이어 (서연, 민우) -->
        <div class="character-layer">
            <!-- 민우 (좌측 하단 배치) -->
            <div class="char-wrapper" id="char-민우" style="left: 30px; bottom: 70px; width: 208px; height: 256px;">
                <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.8); transform-origin:bottom left; pointer-events:none;"></iframe>
            </div>
            <!-- 서연 (우측 하단 배치) -->
            <div class="char-wrapper" id="char-서연" style="right: 30px; bottom: 70px; width: 208px; height: 256px;">
                <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.8) scaleX(-1); transform-origin:bottom right; pointer-events:none;"></iframe>
            </div>
        </div>

        <!-- 상단 헤더 -->
        <header>
            <h1>송도 국립세계문자박물관 : 곡선 모델링 탐구</h1>
            <p>y = a(x - p)² + q</p>
        </header>

        <!-- 상황 설명 글상자 (활동 전 연출) -->
        <div class="info-box" id="intro-box">
            🍃 세 기준점을 찾았다. 올바른 이차함수의 식을 찾아보자!
        </div>

        <!-- 캔버스 및 수학 모의실험 영역 -->
        <div class="canvas-section">
            <div class="equation-badge" id="equation-text">y = 0.50(x - 0.0)² + 0.0</div>
            <canvas id="graphCanvas"></canvas>
        </div>

        <!-- 슬라이더 조작 영역 -->
        <div class="controls-section">
            <div class="sliders-grid">
                <!-- 슬라이더 a -->
                <div class="control-group">
                    <div class="control-label">
                        <span>a (폭/방향)</span>
                        <span class="val" id="val-a">0.50</span>
                    </div>
                    <input type="range" id="slider-a" min="-2.0" max="2.0" step="0.05" value="0.5">
                </div>

                <!-- 슬라이더 p -->
                <div class="control-group">
                    <div class="control-label">
                        <span>p (좌우 이동)</span>
                        <span class="val" id="val-p">0.0</span>
                    </div>
                    <input type="range" id="slider-p" min="-10" max="10" step="0.1" value="0.0">
                </div>

                <!-- 슬라이더 q -->
                <div class="control-group">
                    <div class="control-label">
                        <span>q (상하 이동)</span>
                        <span class="val" id="val-q">0.0</span>
                    </div>
                    <input type="range" id="slider-q" min="-10" max="10" step="0.1" value="0.0">
                </div>
            </div>

            <div class="action-bar">
                <button class="btn-nav" id="btn-prev" onclick="navigateToPrev()">이전</button>
                <span class="guide-text">💡 3개의 별 모양 타겟 포인트를 지나는 이차함수 식을 만드세요.</span>
                <button class="btn-nav" id="btn-next" onclick="navigateToNext()" disabled>다음</button>
            </div>
        </div>

        <!-- 성공 알림 모달 -->
        <div class="modal-overlay" id="success-modal">
            <div class="modal-card">
                <h2>건축 설계 최적화 성공!</h2>
                <p>박물관의 아름다운 곡선을 완벽하게 도출해냈습니다!</p>
                <button class="btn-nav" onclick="closeModal()">확인</button>
            </div>
        </div>
    </div>

    <script>
        const PREV_URL = "A02.html";
        const NEXT_URL = "A03-2.html";

        // DOM 요소
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const sliderA = document.getElementById('slider-a');
        const sliderP = document.getElementById('slider-p');
        const sliderQ = document.getElementById('slider-q');
        const valA = document.getElementById('val-a');
        const valP = document.getElementById('val-p');
        const valQ = document.getElementById('val-q');
        const equationText = document.getElementById('equation-text');
        const btnNext = document.getElementById('btn-next');
        const modal = document.getElementById('success-modal');

        let isSuccess = false;

        // 수학적 타겟 포인트 설정: (x, y)
        // 목표 정답 이차함수: y = 0.25*(x - 1.0)^2 + 2.0
        const targetPoints = [
            { x: -3.0, y: 6.0 },  // 0.25 * (-4)^2 + 2 = 6
            { x: 1.0,  y: 2.0 },  // 꼭짓점
            { x: 5.0,  y: 6.0 }   // 0.25 * (4)^2 + 2 = 6
        ];

        // 좌표계 스케일 및 원점
        const SCALE = 32; // 수학 단위 1 = Canvas 32px
        let originX, originY;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            originX = canvas.width / 2;
            originY = canvas.height * 0.75;
            render();
        }

        window.addEventListener('resize', resizeCanvas);

        // 수학 좌표 -> Canvas 화면 좌표 변환
        function toCanvasX(x) {
            return originX + (x * SCALE);
        }
        function toCanvasY(y) {
            return originY - (y * SCALE);
        }

        // 별 모양 타겟 그리기
        function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.restore();
        }

        // 투명 좌표평면(Grid) 그리기
        function drawGrid() {
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';

            // Grid 세로선
            for (let x = originX % SCALE; x < canvas.width; x += SCALE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // Grid 가로선
            for (let y = originY % SCALE; y < canvas.height; y += SCALE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // X, Y 메인 좌표축
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';

            // X축
            ctx.beginPath();
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.stroke();

            // Y축
            ctx.beginPath();
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, canvas.height);
            ctx.stroke();
        }

        // 이차함수 그래프 실시간 그리기
        function drawParabola(a, p, q) {
            ctx.save();
            ctx.beginPath();

            // 성공 상태일 때는 형광 네온 빛으로 연출
            if (isSuccess) {
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#39ff14'; // 형광 네온 라임색
                ctx.shadowColor = '#00ff66';  // 형광 네온 글로우
                ctx.shadowBlur = 18;
            } else {
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#2d5a27'; // 기본 딥 포레스트 그린
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
            }

            let firstPoint = true;
            for (let canvasX = 0; canvasX <= canvas.width; canvasX += 2) {
                const x = (canvasX - originX) / SCALE;
                const y = a * Math.pow((x - p), 2) + q;
                const canvasY = toCanvasY(y);

                if (firstPoint) {
                    ctx.moveTo(canvasX, canvasY);
                    firstPoint = false;
                } else {
                    ctx.lineTo(canvasX, canvasY);
                }
            }
            ctx.stroke();
            ctx.restore();
        }

        // 타겟 포인트 배치
        function drawTargetPoints() {
            targetPoints.forEach(pt => {
                const cx = toCanvasX(pt.x);
                const cy = toCanvasY(pt.y);
                drawStar(cx, cy, 5, 11, 5.5, '#f4a261'); // 햇살 옐로우 별
            });
        }

        // 수식 배너 갱신
        function updateEquationText(a, p, q) {
            let pStr = p >= 0 ? `- ${p.toFixed(1)}` : `+ ${Math.abs(p).toFixed(1)}`;
            let qStr = q >= 0 ? `+ ${q.toFixed(1)}` : `- ${Math.abs(q).toFixed(1)}`;
            equationText.textContent = `y = ${a.toFixed(2)}(x ${pStr})² ${qStr}`;
        }

        // 정답 판정 함수 (오차 없이 정확한 값 일치 조건)
        function checkSuccess(a, p, q) {
            const TARGET_A = 0.25;
            const TARGET_P = 1.0;
            const TARGET_Q = 2.0;

            // 정확히 a = 0.25, p = 1.0, q = 2.0 일 때만 성공
            const isCorrect = Math.abs(a - TARGET_A) < 0.001 &&
                              Math.abs(p - TARGET_P) < 0.001 &&
                              Math.abs(q - TARGET_Q) < 0.001;

            if (isCorrect && !isSuccess) {
                isSuccess = true;
                
                // 1. 슬라이더 조작 비활성화 (정지)
                sliderA.disabled = true;
                sliderP.disabled = true;
                sliderQ.disabled = true;

                // 2. 수식 배너 성공 스타일 적용
                equationText.classList.add('success');

                // 3. 다음 버튼 활성화 및 모달 열기
                btnNext.disabled = false;
                showModal();
            }
        }

        function showModal() {
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // 메인 렌더링 루프
        function render() {
            const a = parseFloat(sliderA.value);
            const p = parseFloat(sliderP.value);
            const q = parseFloat(sliderQ.value);

            valA.textContent = a.toFixed(2);
            valP.textContent = p.toFixed(1);
            valQ.textContent = q.toFixed(1);
            updateEquationText(a, p, q);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGrid();
            checkSuccess(a, p, q);
            drawParabola(a, p, q);
            drawTargetPoints();
        }

        // 이벤트 연결
        [sliderA, sliderP, sliderQ].forEach(slider => {
            slider.addEventListener('input', () => {
                // 슬라이더를 건드리면 상황 설명글 은은하게 숨기기
                const introBox = document.getElementById('intro-box');
                if (introBox) introBox.style.display = 'none';
                render();
            });
        });

        // 이전 페이지 이동
        function navigateToPrev() {
            if (PREV_URL && PREV_URL !== '') {
                window.location.href = PREV_URL;
            }
        }

        // 화면 슬라이드 후 다음 페이지 이동
        function navigateToNext() {
            const container = document.getElementById('game-container');
            container.classList.add('slide-left-out');

            setTimeout(() => {
                if (NEXT_URL && NEXT_URL !== '') {
                    window.location.href = NEXT_URL;
                } else {
                    alert('End');
                }
            }, 550);
        }

        // 초기화 실행
        resizeCanvas();
    </script>
</body>
</html>
