<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>송도센트럴파크 MATHTOUR - 한옥마을의 역사</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    :root {
      --forest: #2d5a27;
      --wood: #6d4c41;
      --sun: #f4a261;
      --olive: #3e4a3d;
      --ivory: #fdfbf7;
      --moss-beige: #f2f7f2;
      --sage: #8aa171;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(244, 162, 97, 0.12), transparent 38%),
        linear-gradient(145deg, #dce8d7 0%, var(--moss-beige) 55%, #d7e2d1 100%);
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--olive);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    #game-container {
      position: relative;
      width: min(100%, 1066px);
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      background: #dfe9d9;
      border: 5px solid rgba(109, 76, 65, 0.9);
      border-radius: 22px;
      box-shadow:
        0 20px 50px rgba(32, 58, 32, 0.3),
        inset 0 0 0 3px rgba(255, 255, 255, 0.2);
    }

    #background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: saturate(0.92) brightness(0.9);
      transform: scale(1.01);
    }

    .forest-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(20, 54, 26, 0.28) 0%,
          rgba(20, 54, 26, 0.02) 37%,
          rgba(20, 54, 26, 0.08) 72%,
          rgba(20, 40, 20, 0.28) 100%
        );
    }

    .leaf-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      box-shadow: inset 0 0 95px rgba(18, 50, 22, 0.34);
    }

    #stage-sign {
      position: absolute;
      z-index: 12;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 330px;
      padding: 11px 34px 12px;
      text-align: center;
      color: var(--ivory);
      font-family: 'Gowun Batang', serif;
      font-size: clamp(18px, 2.2vw, 29px);
      font-weight: 700;
      letter-spacing: 0.03em;
      background:
        repeating-linear-gradient(
          8deg,
          rgba(255,255,255,0.03) 0 4px,
          rgba(0,0,0,0.035) 4px 8px
        ),
        linear-gradient(180deg, #7c5a45 0%, var(--wood) 100%);
      border: 4px solid #4c352b;
      border-radius: 14px 14px 18px 18px;
      box-shadow:
        0 6px 0 rgba(60, 39, 30, 0.35),
        0 12px 24px rgba(0, 0, 0, 0.25);
      text-shadow: 0 2px 3px rgba(0,0,0,0.35);
    }

    #stage-sign::before,
    #stage-sign::after {
      content: "❧";
      position: absolute;
      top: 50%;
      transform: translateY(-52%);
      color: #b9ca96;
      font-size: 25px;
    }

    #stage-sign::before {
      left: 11px;
    }

    #stage-sign::after {
      right: 11px;
      transform: translateY(-52%) scaleX(-1);
    }

    .char-wrapper {
      position: absolute;
      z-index: 3;
      overflow: visible;
      filter: drop-shadow(0 11px 8px rgba(20, 30, 20, 0.28));
      animation: characterFloat 4s ease-in-out infinite;
    }

    #char-민우 {
      left: clamp(8px, 2.5vw, 42px);
      bottom: 47px;
      width: 221px;
      height: 272px;
      animation-delay: -0.8s;
    }

    #char-서연 {
      right: -92px;
      bottom: 47px;
      width: 221px;
      height: 272px;
      animation-delay: -2.1s;
    }

    .char-wrapper iframe {
      display: block;
      border: 0;
      width: 260px;
      height: 320px;
      pointer-events: none;
      transform-origin: bottom left;
    }

    #char-민우 iframe {
      transform: scale(0.85);
    }

    #char-서연 iframe {
      transform: scale(0.85) scaleX(-1);
    }

    @keyframes characterFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    #situation-box {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      width: min(45%, 480px);
      min-height: 245px;
      padding: 23px 27px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      background:
        linear-gradient(rgba(255,255,255,0.87), rgba(247,251,246,0.84));
      border: 3px solid rgba(138, 161, 113, 0.95);
      border-radius: 28px;
      box-shadow:
        0 15px 38px rgba(26, 54, 27, 0.25),
        inset 0 0 22px rgba(255,255,255,0.58);
      backdrop-filter: blur(7px);
    }

    #situation-box::before,
    #situation-box::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 22px;
      background: var(--forest);
      opacity: 0.92;
      border-radius: 100% 0 100% 0;
    }

    #situation-box::before {
      left: -16px;
      top: 18px;
      transform: rotate(-28deg);
    }

    #situation-box::after {
      right: -16px;
      bottom: 18px;
      transform: rotate(152deg);
    }

    #situation-title {
      margin: 0 0 15px;
      color: #284e26;
      font-family: 'Gowun Batang', serif;
      font-size: clamp(21px, 2.45vw, 31px);
      line-height: 1.32;
      word-break: keep-all;
    }

    #situation-text {
      margin: 0;
      color: var(--olive);
      font-size: clamp(13px, 1.38vw, 17px);
      font-weight: 500;
      line-height: 1.68;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }

    .btn-nav {
      position: absolute;
      z-index: 20;
      bottom: 20px;
      min-width: 104px;
      padding: 12px 22px;
      border: 0;
      border-radius: 20px;
      background: var(--forest);
      color: white;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(45,90,39,0.2);
      transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .btn-nav:hover {
      background: var(--wood);
      transform: translateY(-2px);
      box-shadow: 0 7px 13px rgba(73, 48, 38, 0.3);
    }

    .btn-nav:active {
      transform: translateY(1px) scale(0.98);
    }

    #btn-prev {
      left: 20px;
    }

    #btn-next {
      right: 20px;
      padding-right: 26px;
    }

    #btn-next::after {
      content: "  ➜";
    }

    .sparkles {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 236, 170, 0.82);
      box-shadow: 0 0 11px rgba(255, 221, 121, 0.9);
      animation: sparkle 3.5s ease-in-out infinite;
    }

    .spark:nth-child(1) { left: 18%; top: 23%; animation-delay: -0.4s; }
    .spark:nth-child(2) { left: 77%; top: 30%; animation-delay: -1.7s; }
    .spark:nth-child(3) { left: 39%; top: 17%; animation-delay: -2.4s; }
    .spark:nth-child(4) { left: 64%; top: 69%; animation-delay: -0.9s; }
    .spark:nth-child(5) { left: 29%; top: 72%; animation-delay: -2.8s; }
    .spark:nth-child(6) { left: 86%; top: 55%; animation-delay: -1.1s; }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.18;
        transform: scale(0.6) translateY(0);
      }
      50% {
        opacity: 1;
        transform: scale(1.25) translateY(-7px);
      }
    }

    #vortex-layer {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: none;
      overflow: hidden;
      pointer-events: all;
      background: rgba(13, 32, 18, 0.05);
    }

    #vortex-layer.active {
      display: block;
      animation: darken 1.35s ease-in forwards;
    }

    .vortex-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 140vmax;
      height: 140vmax;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 10vmax solid rgba(45, 90, 39, 0.26);
      box-shadow:
        inset 0 0 0 8vmax rgba(109, 76, 65, 0.18),
        inset 0 0 0 17vmax rgba(45, 90, 39, 0.22),
        inset 0 0 0 27vmax rgba(8, 25, 12, 0.30);
      animation: vortexSpin 1.35s cubic-bezier(.65,.02,.36,1) forwards;
    }

    .vortex-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #0a160c;
      box-shadow:
        0 0 30px 12px rgba(244, 162, 97, 0.35),
        0 0 80px 30px rgba(45, 90, 39, 0.45);
      animation: coreExpand 1.35s cubic-bezier(.66,.02,.34,1) forwards;
    }

    #game-container.sucked-in > *:not(#vortex-layer) {
      animation: suckScene 1.25s cubic-bezier(.7,.02,.36,1) forwards;
      transform-origin: center;
    }

    @keyframes suckScene {
      0% {
        transform: scale(1) rotate(0deg);
        filter: blur(0);
        opacity: 1;
      }
      68% {
        transform: scale(0.42) rotate(9deg);
        filter: blur(2px);
        opacity: 0.86;
      }
      100% {
        transform: scale(0.02) rotate(42deg);
        filter: blur(8px);
        opacity: 0;
      }
    }

    @keyframes vortexSpin {
      0% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.015) rotate(420deg);
        opacity: 1;
      }
    }

    @keyframes coreExpand {
      0% {
        width: 8px;
        height: 8px;
        opacity: 0;
      }
      55% {
        width: 70px;
        height: 70px;
        opacity: 0.9;
      }
      100% {
        width: 120vmax;
        height: 120vmax;
        opacity: 1;
      }
    }

    @keyframes darken {
      0% { background: rgba(13, 32, 18, 0); }
      100% { background: rgba(5, 12, 7, 1); }
    }

    @media (max-width: 760px) {
      #stage-sign {
        top: 10px;
        min-width: 270px;
        padding: 8px 28px 9px;
      }

      #char-민우,
      #char-서연 {
        bottom: 45px;
        width: 182px;
        height: 224px;
      }

      #char-서연 {
        right: -68px;
      }

      #char-민우 iframe,
      #char-서연 iframe {
        transform: scale(0.7);
      }

      #char-서연 iframe {
        transform: scale(0.7) scaleX(-1);
      }

      #situation-box {
        top: 46%;
        width: 50%;
        min-height: 205px;
        padding: 15px 16px;
      }

      .btn-nav {
        bottom: 12px;
        min-width: 86px;
        padding: 9px 16px;
        font-size: 13px;
      }

      #btn-prev {
        left: 12px;
      }

      #btn-next {
        right: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .char-wrapper,
      .spark {
        animation: none;
      }

      #game-container.sucked-in > *:not(#vortex-layer) {
        animation-duration: 0.45s;
      }

      .vortex-ring,
      .vortex-core,
      #vortex-layer.active {
        animation-duration: 0.5s;
      }
    }
  </style>
</head>

<body>
  <main id="game-container" aria-label="송도센트럴파크 MATHTOUR 한옥마을 역사 탐험 장면">
    <img
      id="background-image"
      src="한옥마을.png"
      alt="송도센트럴파크 한옥마을 배경"
      draggable="false"
    />

    <div class="forest-overlay" aria-hidden="true"></div>
    <div class="leaf-vignette" aria-hidden="true"></div>

    <header id="stage-sign">한옥마을의 숨은 이야기</header>

    <div class="sparkles" aria-hidden="true">
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
    </div>

    <div
      class="char-wrapper"
      id="char-민우"
      aria-label="등장인물 민우"
    >
      <iframe
        src="등장인물_민우.html"
        title="민우"
        scrolling="no"
      ></iframe>
    </div>

    <div
      class="char-wrapper"
      id="char-서연"
      aria-label="등장인물 서연"
    >
      <iframe
        src="등장인물_서연.html"
        title="서연"
        scrolling="no"
      ></iframe>
    </div>

    <section id="situation-box" aria-live="polite">
      <h1 id="situation-title">도시 속 옛 공간<br />- 센트럴파크 한옥마을 -</h1>
      <p id="situation-text">
        민우와 서연이는 송도센트럴파크 한옥마을에 도착했다.<br />
        두 사람은 이곳의 모습과 역사를 알아보기로 한다.<br /><br />
        송도 한옥마을은 인천광역시 연수구 송도국제도시에 위치한 한옥마을이다.<br />
        호텔, 식당, 문화 체험시설 등으로 이루어져 있으며 송도 최대의 한옥마을이다.
      </p>
    </section>

    <button
      type="button"
      class="btn-nav"
      id="btn-prev"
      onclick="goToPage('index.html')"
      aria-label="이전 장면으로 이동"
    >
      이전
    </button>

    <button
      type="button"
      class="btn-nav"
      id="btn-next"
      onclick="startVortexTransition('B02.html')"
      aria-label="다음 장면으로 이동"
    >
      다음
    </button>

    <div id="vortex-layer" aria-hidden="true">
      <div class="vortex-ring"></div>
      <div class="vortex-core"></div>
    </div>
  </main>

  <script>
    let isTransitioning = false;

    function goToPage(url) {
      if (isTransitioning) return;
      window.location.href = url;
    }

    function startVortexTransition(url) {
      if (isTransitioning) return;
      isTransitioning = true;

      const container = document.getElementById('game-container');
      const vortexLayer = document.getElementById('vortex-layer');
      const prevButton = document.getElementById('btn-prev');
      const nextButton = document.getElementById('btn-next');

      prevButton.disabled = true;
      nextButton.disabled = true;

      container.classList.add('sucked-in');
      vortexLayer.classList.add('active');
      vortexLayer.setAttribute('aria-hidden', 'false');

      window.setTimeout(function () {
        window.location.href = url;
      }, 1300);
    }

    document.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') {
        goToPage('index.html');
      }

      if (event.key === 'ArrowRight' || event.key === 'Enter') {
        startVortexTransition('B02.html');
      }
    });
  </script>
</body>
</html>
