<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>송도센트럴파크 MATHTOUR - 처마 속에 숨은 수학</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    :root {
      --forest-green: #2d5a27;
      --wood-brown: #6d4c41;
      --sun-yellow: #f4a261;
      --olive-gray: #3e4a3d;
      --ivory: #fdfbf7;
      --sage-green: #8aa171;
      --moss-beige: #f2f7f2;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dce8d8;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    button { font-family: 'Noto Sans KR', sans-serif; }

    #game-container {
      position: relative;
      width: min(100%, 1066px);
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--moss-beige);
      border: 5px solid #4b382f;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(25, 49, 25, 0.28);
      isolation: isolate;
    }

    #background-image {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    #background-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to bottom,
          rgba(22, 45, 23, 0.08) 0%,
          rgba(22, 45, 23, 0.01) 55%,
          rgba(18, 38, 20, 0.18) 100%);
    }

    #stage-sign {
      position: absolute;
      top: 12px;
      left: 50%;
      z-index: 20;
      min-width: 355px;
      padding: 9px 50px 11px;
      transform: translateX(-50%);
      text-align: center;
      color: var(--ivory);
      background:
        repeating-linear-gradient(
          7deg,
          #765346 0,
          #765346 8px,
          #6d4c41 8px,
          #6d4c41 16px
        );
      border: 4px solid #4f352c;
      border-radius: 16px 16px 20px 20px;
      box-shadow: 0 7px 12px rgba(32, 22, 17, 0.28);
    }

    #stage-sign::before,
    #stage-sign::after {
      content: "❧";
      position: absolute;
      top: 50%;
      color: #bfd18f;
      font-size: 24px;
      transform: translateY(-52%);
    }

    #stage-sign::before { left: 18px; }
    #stage-sign::after {
      right: 18px;
      transform: translateY(-52%) scaleX(-1);
    }

    #stage-title {
      margin: 0;
      font-family: 'Gowun Batang', serif;
      font-size: clamp(18px, 2.2vw, 25px);
      font-weight: 700;
      line-height: 1.22;
    }

    #stage-subtitle {
      display: block;
      margin-top: 2px;
      color: #f5dfbd;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: clamp(10px, 1.1vw, 13px);
    }

    #observation-marker {
      position: absolute;
      top: 88px;
      left: 50%;
      z-index: 18;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 15px;
      transform: translateX(-50%);
      color: white;
      background: rgba(45, 90, 39, 0.88);
      border: 2px solid rgba(244, 162, 97, 0.92);
      border-radius: 22px;
      box-shadow: 0 5px 12px rgba(20, 40, 22, 0.24);
      font-size: clamp(11px, 1.35vw, 15px);
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    /*
      박공지붕 위 직각삼각형
      - 화면 너비 1066px 기준
      - 정면 박공지붕의 왼쪽 처마 끝 → 지붕 꼭대기 → 수직 높이에 맞춤
    */
    #roof-triangle {
      position: absolute;
      left: 51.3%;
      top: 39.5%;
      z-index: 16;
      width: 170px;
      height: 112px;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.92);
      transform-origin: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
      pointer-events: none;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.85));
    }

    #roof-triangle.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #roof-triangle svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .triangle-main {
      fill: rgba(244, 162, 97, 0.08);
      stroke: #ff8a22;
      stroke-width: 5;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .triangle-highlight {
      fill: none;
      stroke: #fff4cf;
      stroke-width: 2;
      stroke-linejoin: round;
      opacity: 0.95;
    }

    .right-angle-mark {
      fill: rgba(255,255,255,0.14);
      stroke: #ff8a22;
      stroke-width: 4;
    }

    #triangle-label {
      position: absolute;
      left: 47.7%;
      top: 28.2%;
      z-index: 17;
      padding: 6px 12px;
      color: white;
      background: rgba(45, 90, 39, 0.94);
      border: 2px solid #8aa171;
      border-radius: 18px;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      pointer-events: none;
    }

    #triangle-label.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #triangle-label::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9px;
      width: 14px;
      height: 14px;
      background: rgba(45, 90, 39, 0.94);
      border-right: 2px solid #8aa171;
      border-bottom: 2px solid #8aa171;
      transform: translateX(-50%) rotate(45deg);
    }

    .char-wrapper {
      position: absolute;
      z-index: 5;
      overflow: visible;
      filter: brightness(1);
      transition: filter 0.25s ease, transform 0.25s ease;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    .char-wrapper.active-speaker {
      transform: translateY(-4px);
    }

    #char-민우 {
      left: 11%;
      bottom: 111px;
      width: 208px;
      height: 256px;
    }

    #char-서연 {
      right: 12%;
      bottom: 111px;
      width: 208px;
      height: 256px;
    }

    #char-민우 iframe,
    #char-서연 iframe {
      display: block;
      width: 260px;
      height: 320px;
      border: 0;
      pointer-events: none;
    }

    #char-민우 iframe {
      transform: scale(0.8);
      transform-origin: bottom left;
    }

    #char-서연 iframe {
      transform: scale(0.8) scaleX(-1);
      transform-origin: bottom left;
    }

    #dialogue-box {
      position: absolute;
      right: 2.5%;
      bottom: 14px;
      left: 2.5%;
      z-index: 30;
      min-height: 132px;
      padding: 27px 118px 22px 28px;
      color: var(--ivory);
      background:
        linear-gradient(130deg,
          rgba(30, 69, 32, 0.95),
          rgba(45, 90, 39, 0.9));
      border: 4px solid var(--wood-brown);
      border-radius: 24px;
      box-shadow:
        0 12px 25px rgba(18, 36, 20, 0.38),
        inset 0 0 0 2px rgba(233, 244, 224, 0.14);
      cursor: pointer;
      user-select: none;
    }

    #dialogue-box::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(225, 238, 211, 0.27);
      border-radius: 15px;
      pointer-events: none;
    }

    #dialogue-box.hidden {
      display: none;
    }

    #speaker-name {
      position: absolute;
      top: -25px;
      left: 27px;
      min-width: 116px;
      padding: 7px 20px;
      text-align: center;
      color: #fff8e9;
      background:
        repeating-linear-gradient(
          6deg,
          #7b574a 0,
          #7b574a 7px,
          #69483d 7px,
          #69483d 14px
        );
      border: 3px solid #4f352c;
      border-radius: 14px;
      box-shadow: 0 4px 8px rgba(26, 20, 16, 0.28);
      font-family: 'Gowun Batang', serif;
      font-size: clamp(16px, 2vw, 21px);
      font-weight: 700;
    }

    #dialogue-text {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: clamp(15px, 1.75vw, 20px);
      line-height: 1.65;
      letter-spacing: -0.02em;
      word-break: keep-all;
      text-shadow: 0 2px 3px rgba(0,0,0,0.22);
    }

    #dialogue-hint {
      position: absolute;
      right: 25px;
      bottom: 16px;
      z-index: 3;
      color: #eadfca;
      font-size: 12px;
      animation: hintPulse 1.2s ease-in-out infinite;
    }

    #dialogue-hint::after {
      content: " ▼";
      color: var(--sun-yellow);
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.58; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(3px); }
    }

    .btn-nav {
      position: absolute;
      z-index: 40;
      min-width: 105px;
      padding: 11px 22px;
      color: white;
      background: var(--forest-green);
      border: none;
      border-radius: 20px;
      box-shadow: 0 4px 6px rgba(45, 90, 39, 0.2);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.2s ease;
    }

    .btn-nav:hover {
      background: var(--wood-brown);
      transform: translateY(-2px);
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
      display: none;
    }

    #btn-next {
      right: 20px;
      bottom: 20px;
      display: none;
    }

    #btn-skip {
      right: 20px;
      bottom: 165px;
      padding: 9px 18px;
      color: var(--olive-gray);
      background: rgba(253, 251, 247, 0.94);
      border: 2px solid var(--sage-green);
    }

    #btn-skip:hover {
      color: white;
      background: var(--wood-brown);
      border-color: var(--wood-brown);
    }

    #scene-complete {
      position: absolute;
      top: 72%;
      left: 50%;
      z-index: 25;
      width: min(70%, 570px);
      padding: 19px 26px;
      text-align: center;
      color: var(--olive-gray);
      background: rgba(255,255,255,0.9);
      border: 3px solid var(--sage-green);
      border-radius: 20px;
      box-shadow: 0 12px 25px rgba(37,66,40,0.28);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -45%) scale(0.96);
      transition: opacity 0.35s ease, transform 0.35s ease;
      backdrop-filter: blur(5px);
    }

    #scene-complete.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #scene-complete h2 {
      margin: 0 0 7px;
      color: var(--forest-green);
      font-family: 'Gowun Batang', serif;
      font-size: clamp(19px, 2.8vw, 27px);
    }

    #scene-complete p {
      margin: 0;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: clamp(12px, 1.45vw, 15px);
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      body { padding: 0; }

      #game-container {
        width: 100vw;
        max-width: none;
        border-width: 3px;
        border-radius: 0;
      }

      #stage-sign {
        top: 6px;
        min-width: 260px;
        padding: 7px 38px 8px;
      }

      #observation-marker {
        top: 70px;
        padding: 5px 10px;
      }

      #roof-triangle {
        left: 51.3%;
        top: 39.5%;
        width: 128px;
        height: 84px;
      }

      #triangle-label {
        left: 47.7%;
        top: 27.7%;
        padding: 4px 8px;
        font-size: 9px;
      }

      #char-민우 {
        left: 4%;
        bottom: 76px;
        width: 156px;
        height: 192px;
      }

      #char-서연 {
        right: 4%;
        bottom: 76px;
        width: 156px;
        height: 192px;
      }

      #char-민우 iframe {
        transform: scale(0.6);
      }

      #char-서연 iframe {
        transform: scale(0.6) scaleX(-1);
      }

      #dialogue-box {
        right: 2%;
        bottom: 7px;
        left: 2%;
        min-height: 100px;
        padding: 19px 68px 14px 17px;
        border-width: 3px;
      }

      #speaker-name {
        top: -18px;
        left: 17px;
        min-width: 80px;
        padding: 4px 12px;
      }

      #dialogue-hint {
        right: 14px;
        bottom: 9px;
        font-size: 9px;
      }

      .btn-nav {
        min-width: 78px;
        padding: 7px 13px;
        font-size: 12px;
      }

      #btn-prev {
        left: 10px;
        bottom: 10px;
      }

      #btn-next {
        right: 10px;
        bottom: 10px;
      }

      #btn-skip {
        right: 10px;
        bottom: 115px;
      }

      #scene-complete {
        top: 68%;
      }
    }
  </style>
</head>

<body>
  <main id="game-container" aria-label="송도센트럴파크 MATHTOUR 한옥마을 대화 장면">

    <img
      id="background-image"
      src="한옥마을2.png"
      alt="송도한옥마을의 한옥과 처마"
      draggable="false"
    />

    <div id="background-overlay" aria-hidden="true"></div>

    <header id="stage-sign">
      <h1 id="stage-title">
        처마 속에 숨은 수학
        <span id="stage-subtitle">B02 · SONGDO HANOK VILLAGE</span>
      </h1>
    </header>

    <div id="observation-marker" aria-hidden="true">
      <span>🍃</span>
      <span>한옥의 처마를 자세히 관찰해 보자</span>
    </div>

    <!-- 한옥 박공지붕의 옆모습을 나타내는 직각삼각형 -->
    <div id="roof-triangle" aria-hidden="true">
      <svg viewBox="0 0 170 112" role="img" aria-label="한옥 지붕의 직각삼각형">
        <!-- 빗변: 처마 끝에서 지붕 꼭대기 -->
        <!-- 밑변: 처마 끝에서 꼭대기 아래 수직점 -->
        <!-- 높이: 꼭대기 아래 수직점에서 지붕 꼭대기 -->
        <path class="triangle-main" d="M12 100 L154 100 L154 12 Z" />
        <path class="triangle-highlight" d="M12 100 L154 100 L154 12 Z" />
        <path class="right-angle-mark" d="M137 100 L137 83 L154 83" />
      </svg>
    </div>

    <div id="triangle-label" aria-hidden="true">직각삼각형</div>

    <div class="char-wrapper" id="char-민우" aria-label="등장인물 민우">
      <iframe
        src="등장인물_민우.html"
        title="민우"
        scrolling="no"
        tabindex="-1"
      ></iframe>
    </div>

    <div class="char-wrapper inactive" id="char-서연" aria-label="등장인물 서연">
      <iframe
        src="등장인물_서연.html"
        title="서연"
        scrolling="no"
        tabindex="-1"
      ></iframe>
    </div>

    <section
      id="dialogue-box"
      role="button"
      tabindex="0"
      aria-label="대화창. 클릭하거나 엔터 키를 누르면 다음 대사로 진행합니다."
      onclick="advanceDialogue()"
      onkeydown="handleDialogueKey(event)"
    >
      <div id="speaker-name">민우</div>
      <p id="dialogue-text"></p>
      <div id="dialogue-hint">클릭하여 계속</div>
    </section>

    <section id="scene-complete" aria-live="polite">
      <h2>지붕에서 발견한 수학적 아이디어</h2>
      <p>
        지붕의 경사면을 빗변으로 하는 직각삼각형을 만들면<br />
        높이와 밑변을 이용해 지붕의 기울기를 구할 수 있어!
      </p>
    </section>

    <button
      type="button"
      class="btn-nav"
      id="btn-prev"
      onclick="goToPage('B01.html')"
    >
      ← 이전
    </button>

    <button
      type="button"
      class="btn-nav"
      id="btn-next"
      onclick="goToPage('B03.html')"
    >
      다음 →
    </button>

    <button
      type="button"
      class="btn-nav"
      id="btn-skip"
      onclick="skipDialogue(event)"
    >
      건너뛰기
    </button>
  </main>

  <script>
    const dialogues = [
      {
        speaker: "민우",
        text: "서연아, 한옥 지붕은 왜 비스듬하게 만들어졌을까?",
        target: "char-민우",
        showTriangle: false
      },
      {
        speaker: "서연",
        text: "비나 눈이 잘 흘러내리도록 기울여 만든 것 같아. 그런데 지붕의 기울기를 수학으로 구할 수도 있을까?",
        target: "char-서연",
        showTriangle: false
      },
      {
        speaker: "민우",
        text: "지붕의 옆모습을 직각삼각형으로 나타내면 삼각비를 이용할 수 있을 것 같아!",
        target: "char-민우",
        showTriangle: true
      }
    ];

    let currentIndex = 0;
    let dialogueFinished = false;

    const dialogueBox = document.getElementById("dialogue-box");
    const speakerName = document.getElementById("speaker-name");
    const dialogueText = document.getElementById("dialogue-text");
    const skipButton = document.getElementById("btn-skip");
    const prevButton = document.getElementById("btn-prev");
    const nextButton = document.getElementById("btn-next");
    const roofTriangle = document.getElementById("roof-triangle");
    const triangleLabel = document.getElementById("triangle-label");
    const sceneComplete = document.getElementById("scene-complete");
    const characterWrappers = Array.from(
      document.querySelectorAll(".char-wrapper")
    );

    function setTriangleVisible(visible) {
      roofTriangle.classList.toggle("show", visible);
      triangleLabel.classList.toggle("show", visible);
    }

    function renderDialogue() {
      const dialogue = dialogues[currentIndex];

      speakerName.textContent = dialogue.speaker;
      dialogueText.textContent = dialogue.text;

      characterWrappers.forEach((character) => {
        const isSpeaker = character.id === dialogue.target;
        character.classList.toggle("inactive", !isSpeaker);
        character.classList.toggle("active-speaker", isSpeaker);
      });

      setTriangleVisible(dialogue.showTriangle);
    }

    function advanceDialogue() {
      if (dialogueFinished) return;

      currentIndex += 1;

      if (currentIndex < dialogues.length) {
        renderDialogue();
      } else {
        finishDialogue();
      }
    }

    function handleDialogueKey(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        advanceDialogue();
      }
    }

    function skipDialogue(event) {
      event.stopPropagation();

      if (dialogueFinished) return;

      setTriangleVisible(true);
      finishDialogue();
    }

    function finishDialogue() {
      dialogueFinished = true;
      dialogueBox.classList.add("hidden");
      skipButton.style.display = "none";

      characterWrappers.forEach((character) => {
        character.classList.remove("inactive");
        character.classList.remove("active-speaker");
      });

      setTriangleVisible(true);
      sceneComplete.classList.add("show");
      prevButton.style.display = "block";
      nextButton.style.display = "block";
      nextButton.focus();
    }

    function goToPage(url) {
      window.location.href = url;
    }

    renderDialogue();
  </script>
</body>
</html>
