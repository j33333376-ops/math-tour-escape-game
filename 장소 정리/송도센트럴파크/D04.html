<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송도센트럴파크 MATHTOUR - D04</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1b261b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      color: #3e4a3d;
    }

    /* 16:9 비율 유지 게임 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background-color: #f2f7f2;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
    }

    /* 배경 이미지 */
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* 상단 나무 팻말 표시바 */
    .stage-signpost {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background-color: #6d4c41;
      color: #fdfbf7;
      padding: 8px 24px;
      border-radius: 12px;
      border: 3px solid #2d5a27;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      font-family: 'Gowun Batang', serif;
      font-size: 1.25rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    /* 등장인물 래퍼 */
    .char-wrapper {
      position: absolute;
      z-index: 3;
      overflow: visible;
      transition: filter 0.2s ease;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    /* 대화창 UI (유형 2) */
    #dialogue-box {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      height: 130px;
      background: rgba(45, 90, 39, 0.88);
      border: 2px solid #6d4c41;
      border-radius: 12px;
      padding: 16px 22px;
      z-index: 10;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      user-select: none;
    }

    #speaker-name {
      font-family: 'Gowun Batang', serif;
      font-size: 1.15rem;
      font-weight: bold;
      color: #f4a261;
      margin-bottom: 6px;
    }

    #dialogue-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.05rem;
      color: #fdfbf7;
      line-height: 1.6;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }

    .click-indicator {
      position: absolute;
      right: 18px;
      bottom: 12px;
      font-size: 0.85rem;
      color: #f4a261;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }

    /* 스마트폰 메시지 강조 스타일 */
    .phone-highlight {
      font-family: 'Nanum Gothic Coding', monospace;
      color: #f4a261;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* 공통 네비게이션 버튼 */
    .btn-nav {
      position: absolute;
      z-index: 10;
      background-color: #2d5a27;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 10px 24px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(45, 90, 39, 0.2);
      transition: background-color 0.2s, transform 0.1s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-nav:hover {
      background-color: #6d4c41;
    }

    .btn-nav:active {
      transform: scale(0.96);
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
      display: none;
    }

    #btn-next {
      right: 20px;
      bottom: 20px;
      display: none;
    }

    #btn-skip {
      right: 20px;
      bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 배경 이미지 -->
    <img src="수상택시 선착장.png" alt="수상택시 선착장" class="bg-img">

    <!-- 상단 나무 팻말 -->
    <div class="stage-signpost">
      송도센트럴파크 MATHTOUR
    </div>

    <!-- 등장인물: 민우 (왼쪽 배치) -->
    <div class="char-wrapper" id="char-민우" style="left: 100px; bottom: 20px; width: 260px; height: 320px;">
      <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 등장인물: 서연 (오른쪽 배치, 민우를 바라보도록 좌우 반전) -->
    <div class="char-wrapper" id="char-서연" style="right: 100px; bottom: 20px; width: 260px; height: 320px;">
      <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 대화창 UI -->
    <div id="dialogue-box" onclick="advanceDialogue()">
      <div id="speaker-name">안내</div>
      <div id="dialogue-text">대화를 시작합니다.</div>
      <div class="click-indicator">▼ 클릭하여 계속</div>
    </div>

    <!-- 네비게이션 버튼 -->
    <button id="btn-prev" class="btn-nav" onclick="goPrev()">이전</button>
    <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
    <button id="btn-next" class="btn-nav" onclick="goNext()">End</button>
  </div>

  <script>
    // 대화 스크립트 데이터 (숫자 명시 삭제 반영)
    const dialogues = [
      {
        speaker: "서연",
        text: "와, 민우야! 우리가 진짜 삼각비를 이용해서 G타워 높이를 구해냈어! 직접 재지 않고도 이렇게 답을 찾다니 정말 신기하다!",
        target: "char-서연"
      },
      {
        speaker: "민우",
        text: "맞아! 수상택시가 이동한 거리랑 올려다본 각도만으로 높이를 계산할 수 있다니, 수학 공식이 진짜 유용하네.",
        target: "char-민우"
      },
      {
        speaker: "서연",
        text: "그럼 방금 우리가 열심히 구한 높이를 선생님께 문자로 보내볼까?",
        target: "char-서연"
      },
      {
        speaker: "민우",
        text: "좋아! '선생님, 수상택시에서 삼각비를 활용해 계산한 G타워의 높이를 전송합니다!' … 답장 완결!",
        target: "char-민우"
      },
      {
        speaker: "알림음",
        text: "📱 (띠링! 잠시 후 스마트폰 메시지 도착 알람이 울린다.)",
        target: null
      },
      {
        speaker: "동아리 선생님 (메시지)",
        text: "📱 <span class='phone-highlight'>\"정답입니다! 배 위의 흔들림 속에서도 정확히 삼각비 원리를 적용해내다니 정말 훌륭하군요. 수학 탐험가로서 인정합니다!\"</span>",
        target: null
      },
      {
        speaker: "서연",
        text: "우와, 선생님한테 칭찬받았다! 역시 삼각비를 제대로 이해하고 활용하니까 뿌듯함이 두 배야.",
        target: "char-서연"
      },
      {
        speaker: "민우",
        text: "그러게 말이야! 미션도 멋지게 완수했으니, 이제 다음으로는 송도 어디를 탐방해볼까?",
        target: "char-민우"
      },
      {
        speaker: "서연",
        text: "트라이보울의 독특한 곡선 건축물도 궁금하고, 한옥마을 쪽 수로도 예쁘던데! 다음 수학 탐험 장소도 정말 기대된다!",
        target: "char-서연"
      }
    ];

    let currentIndex = 0;

    function updateDialogue() {
      const current = dialogues[currentIndex];
      
      // 화자 이름 및 대사 갱신
      document.getElementById("speaker-name").innerText = current.speaker;
      document.getElementById("dialogue-text").innerHTML = current.text;

      // 인물 하이라이트 처리 (.inactive 토글)
      const minoo = document.getElementById("char-민우");
      const seoyeon = document.getElementById("char-서연");

      if (current.target === "char-민우") {
        minoo.classList.remove("inactive");
        seoyeon.classList.add("inactive");
      } else if (current.target === "char-서연") {
        seoyeon.classList.remove("inactive");
        minoo.classList.add("inactive");
      } else {
        minoo.classList.remove("inactive");
        seoyeon.classList.remove("inactive");
      }
    }

    function advanceDialogue() {
      currentIndex++;
      if (currentIndex < dialogues.length) {
        updateDialogue();
      } else {
        endDialogue();
      }
    }

    function skipDialogue() {
      endDialogue();
    }

    function endDialogue() {
      // 대화창 및 건너뛰기 버튼 숨김
      document.getElementById("dialogue-box").style.display = "none";
      document.getElementById("btn-skip").style.display = "none";

      // 캐릭터 어두움 해제
      document.getElementById("char-민우").classList.remove("inactive");
      document.getElementById("char-서연").classList.remove("inactive");

      // 이전 및 엔딩(End) 버튼 표시
      document.getElementById("btn-prev").style.display = "inline-flex";
      document.getElementById("btn-next").style.display = "inline-flex";
    }

    function goPrev() {
      window.location.href = "D03.html";
    }

    function goNext() {
      alert("송도센트럴파크 MATHTOUR를 성공적으로 마쳤습니다!");
      window.location.href = "index.html";
    }

    // 최초 실행
    window.onload = function() {
      updateDialogue();
    };
  </script>
</body>
</html>
