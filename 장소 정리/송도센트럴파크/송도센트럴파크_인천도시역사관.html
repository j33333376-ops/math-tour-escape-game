<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>송도센트럴파크 - 인천도시역사관</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .mh-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="mh-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천도시역사관">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c1e2f3"/><stop offset="100%" stop-color="#eef6fb"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f2f5f8"/><stop offset="100%" stop-color="#d5dfe6"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a7d0e4"/><stop offset="100%" stop-color="#6ea9c8"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="500" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.6"><ellipse cx="240" cy="72" rx="70" ry="22"/><ellipse cx="960" cy="60" rx="82" ry="24"/></g>
  <!-- 원경 -->
  <g opacity="0.45"><rect x="60" y="220" width="60" height="240" fill="#a6cadb"/><rect x="1080" y="200" width="64" height="260" fill="#a6cadb"/></g>

  <!-- 땅/광장 -->
  <rect x="0" y="478" width="1200" height="242" fill="#d7dee4"/>
  <rect x="0" y="478" width="1200" height="14" fill="#c3ccd3"/>

  <!-- 박물관 본체 -->
  <g>
    <rect x="230" y="250" width="740" height="228" fill="url(#stone)" stroke="#aab8c2" stroke-width="3"/>
    <!-- 지붕 캡 -->
    <rect x="212" y="234" width="776" height="24" rx="4" fill="#c7d2da" stroke="#aab8c2" stroke-width="2"/>
    <!-- 유리 중앙부 -->
    <rect x="470" y="270" width="260" height="208" fill="url(#glass)" stroke="#5a93ad" stroke-width="3"/>
    <g stroke="#cfeaf4" stroke-width="2" opacity="0.8"><line x1="535" y1="270" x2="535" y2="478"/><line x1="600" y1="270" x2="600" y2="478"/><line x1="665" y1="270" x2="665" y2="478"/><line x1="470" y1="330" x2="730" y2="330"/><line x1="470" y1="392" x2="730" y2="392"/></g>
    <!-- 세로 핀(기둥) -->
    <g fill="#e2e9ee" stroke="#b6c3cc" stroke-width="1.5">
      <rect x="250" y="258" width="26" height="220"/><rect x="300" y="258" width="26" height="220"/><rect x="350" y="258" width="26" height="220"/><rect x="400" y="258" width="26" height="220"/>
      <rect x="778" y="258" width="26" height="220"/><rect x="828" y="258" width="26" height="220"/><rect x="878" y="258" width="26" height="220"/><rect x="928" y="258" width="26" height="220"/>
    </g>
    <!-- 입구 -->
    <rect x="556" y="404" width="88" height="74" fill="#3f6b82" stroke="#2c4f63" stroke-width="2"/>
    <line x1="600" y1="404" x2="600" y2="478" stroke="#cfeaf4" stroke-width="2"/>
    <!-- 계단 -->
    <rect x="520" y="478" width="160" height="10" fill="#c3ccd3"/><rect x="500" y="488" width="200" height="10" fill="#bcc6cd"/>
  </g>
  <!-- 배너 사인 -->
  <g transform="translate(600,214)">
    <rect x="-140" y="-24" width="280" height="38" rx="8" fill="#1f3a4d"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="21" font-weight="700" fill="#ffffff">인천도시역사관</text>
  </g>

  <!-- 옛 인천 전차 (도시 역사 상징) -->
  <g transform="translate(300,560)">
    <ellipse cx="0" cy="86" rx="170" ry="16" fill="#9aa6ad" opacity="0.4"/>
    <!-- 레일 -->
    <rect x="-260" y="82" width="520" height="6" fill="#8a949b"/>
    <!-- 차체 -->
    <rect x="-150" y="-70" width="300" height="140" rx="12" fill="#c24a3a" stroke="#8a2f22" stroke-width="3"/>
    <rect x="-150" y="-70" width="300" height="34" rx="12" fill="#e8d9b0"/>
    <text x="0" y="-46" text-anchor="middle" font-family="'Nanum Myeongjo',serif" font-size="17" font-weight="800" fill="#7a2f22">仁川 電車</text>
    <!-- 창문 -->
    <g fill="#bfe0ea" stroke="#7a2f22" stroke-width="2"><rect x="-132" y="-24" width="56" height="52" rx="4"/><rect x="-64" y="-24" width="56" height="52" rx="4"/><rect x="8" y="-24" width="56" height="52" rx="4"/><rect x="80" y="-24" width="52" height="52" rx="4"/></g>
    <!-- 바퀴 -->
    <circle cx="-90" cy="76" r="20" fill="#3a3f45" stroke="#1f2327" stroke-width="3"/><circle cx="90" cy="76" r="20" fill="#3a3f45" stroke="#1f2327" stroke-width="3"/>
    <circle cx="-90" cy="76" r="7" fill="#8a949b"/><circle cx="90" cy="76" r="7" fill="#8a949b"/>
    <!-- 폴 -->
    <line x1="0" y1="-70" x2="30" y2="-120" stroke="#5a5f65" stroke-width="3"/>
  </g>

  <!-- 나무/사람 -->
  <g transform="translate(1050,478)"><rect x="-6" y="0" width="12" height="46" fill="#6a4a2c"/><circle cy="-14" r="34" fill="#5aa653"/><circle cx="-22" cy="4" r="22" fill="#69b55f"/><circle cx="22" cy="4" r="22" fill="#69b55f"/></g>
  <g fill="#41637a"><circle cx="760" cy="600" r="9"/><rect x="753" y="608" width="14" height="28" rx="5"/></g>
  <g fill="#7a5a41"><circle cx="820" cy="606" r="9"/><rect x="813" y="614" width="14" height="28" rx="5"/></g>
</svg>
</body>
</html>
