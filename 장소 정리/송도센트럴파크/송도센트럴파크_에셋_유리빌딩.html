<!-- 원본 크기: 500x750 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송도 유리빌딩</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .sgb-svg { display:block; width:100%; height:auto; }
  .sgb-lit { animation: sgb-lit 4.2s ease-in-out infinite; }
  @keyframes sgb-lit { 0%,100% { opacity:0.35; } 50% { opacity:0.95; } }
</style>
</head>
<body>
<svg class="sgb-svg" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="송도 유리빌딩">
<title>송도 유리빌딩</title>
<desc>송도국제도시의 유리 커튼월 초고층 빌딩.</desc>
<defs>
  <linearGradient id="sgbFace" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7fa8c0"/><stop offset="0.35" stop-color="#c8e2ee"/>
    <stop offset="0.6" stop-color="#9fc4d8"/><stop offset="1" stop-color="#5f88a0"/>
  </linearGradient>
  <linearGradient id="sgbSide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4f7288"/><stop offset="1" stop-color="#325466"/>
  </linearGradient>
  <linearGradient id="sgbSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
  </linearGradient>
</defs>
<ellipse cx="250" cy="726" rx="196" ry="20" fill="#2f4654" opacity="0.22"/>
<!-- 첨탑 -->
<line x1="250" y1="70" x2="250" y2="18" stroke="#8f9aa4" stroke-width="7" stroke-linecap="round"/>
<circle class="sgb-lit" cx="250" cy="14" r="7" fill="#e6403a"/>
<!-- 왕관부 -->
<path d="M150,116 L350,116 L318,70 L182,70 Z" fill="url(#sgbSide)" stroke="#294552" stroke-width="4"/>
<path d="M182,70 L318,70 L300,44 L200,44 Z" fill="#7fa8c0" stroke="#294552" stroke-width="3.4"/>
<!-- 본체 앞면 -->
<path d="M118,700 L118,116 L350,116 L350,700 Z" fill="url(#sgbFace)" stroke="#3f6070" stroke-width="5"/>
<!-- 측면 -->
<path d="M350,116 L350,700 L426,676 L426,148 Z" fill="url(#sgbSide)" stroke="#294552" stroke-width="5"/>
<path d="M350,116 L426,148 L350,148 Z" fill="#6b93a8"/>
<!-- 창문 격자 -->
<g stroke="#e6f2f8" stroke-width="2.4" opacity="0.75">
  <line x1="164" y1="116" x2="164" y2="700"/><line x1="210" y1="116" x2="210" y2="700"/>
  <line x1="256" y1="116" x2="256" y2="700"/><line x1="302" y1="116" x2="302" y2="700"/>
</g>
<g stroke="#e6f2f8" stroke-width="2" opacity="0.55">
  <line x1="118" y1="160" x2="350" y2="160"/><line x1="118" y1="204" x2="350" y2="204"/>
  <line x1="118" y1="248" x2="350" y2="248"/><line x1="118" y1="292" x2="350" y2="292"/>
  <line x1="118" y1="336" x2="350" y2="336"/><line x1="118" y1="380" x2="350" y2="380"/>
  <line x1="118" y1="424" x2="350" y2="424"/><line x1="118" y1="468" x2="350" y2="468"/>
  <line x1="118" y1="512" x2="350" y2="512"/><line x1="118" y1="556" x2="350" y2="556"/>
  <line x1="118" y1="600" x2="350" y2="600"/><line x1="118" y1="644" x2="350" y2="644"/>
</g>
<g stroke="#8fb4c4" stroke-width="2" opacity="0.5">
  <line x1="350" y1="160" x2="426" y2="190"/><line x1="350" y1="248" x2="426" y2="276"/>
  <line x1="350" y1="336" x2="426" y2="362"/><line x1="350" y1="424" x2="426" y2="448"/>
  <line x1="350" y1="512" x2="426" y2="534"/><line x1="350" y1="600" x2="426" y2="620"/>
  <line x1="388" y1="132" x2="388" y2="688"/>
</g>
<!-- 불 켜진 창 -->
<g class="sgb-lit" fill="#ffe9a8">
  <rect x="168" y="212" width="38" height="32"/><rect x="260" y="300" width="38" height="32"/>
  <rect x="214" y="388" width="38" height="32"/><rect x="306" y="476" width="38" height="32"/>
  <rect x="122" y="344" width="38" height="32"/><rect x="260" y="564" width="38" height="32"/>
</g>
<g class="sgb-lit" fill="#ffe9a8" style="animation-delay:1.4s">
  <rect x="214" y="256" width="38" height="32"/><rect x="122" y="432" width="38" height="32"/>
  <rect x="306" y="212" width="38" height="32"/><rect x="168" y="608" width="38" height="32"/>
</g>
<!-- 유리 반사광 -->
<path d="M118,116 L204,116 L146,700 L118,700 Z" fill="url(#sgbSky)"/>
<path d="M262,116 L296,116 L238,700 L204,700 Z" fill="#ffffff" opacity="0.16"/>
<!-- 저층부 -->
<path d="M92,700 L452,700 L452,730 L92,730 Z" fill="#4f7288" stroke="#294552" stroke-width="5"/>
<path d="M92,700 L452,700 L440,664 L104,664 Z" fill="#9fc4d8" stroke="#3f6070" stroke-width="4"/>
<g fill="#cfe6f0" stroke="#3f6070" stroke-width="3">
  <rect x="150" y="676" width="60" height="24" rx="4"/>
  <rect x="240" y="676" width="60" height="24" rx="4"/>
  <rect x="330" y="676" width="60" height="24" rx="4"/>
</g>
<rect x="222" y="700" width="96" height="30" rx="4" fill="#2f4654"/>
</svg>
</body>
</html>
