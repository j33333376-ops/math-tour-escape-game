<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>등장인물 모아보기</title>
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; padding:40px 24px 60px;
    font-family:'NanumSquareRound','Noto Sans KR',sans-serif;
    background:linear-gradient(160deg,#e0f7fa 0%,#eef6f9 100%);
    color:#1a365d;
  }
  h1 {
    text-align:center; margin:0 0 6px; font-size:1.9rem; font-weight:800; color:#0077be;
    letter-spacing:-0.02em;
  }
  .subtitle { text-align:center; margin:0 0 34px; color:#5a7189; font-size:0.95rem; }

  .grid {
    display:grid; grid-template-columns:repeat(4, 1fr); gap:20px;
    max-width:1040px; margin:0 auto;
  }
  @media (max-width:900px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:560px){ .grid{ grid-template-columns:repeat(2,1fr); } }

  .card {
    background:#ffffff; border:2px solid #cdeef2; border-radius:16px;
    padding:14px 8px 12px; display:flex; flex-direction:column; align-items:center;
    box-shadow:0 6px 16px rgba(0,119,190,0.10); transition:transform .18s, box-shadow .18s;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 12px 24px rgba(0,119,190,0.18); }

  /* 260x320 SVG를 0.6배로 담는 무대 상자 */
  .stagebox { position:relative; width:156px; height:192px; }
  .char-wrap {
    position:absolute; top:0; left:50%;
    width:260px; height:320px;
    transform:translateX(-50%) scale(0.6); transform-origin:top center;
  }
  .char-wrap svg { display:block; width:260px; height:320px; }

  /* 숨쉬기 / 떠오르기 애니메이션 */
  .breathe { animation:breathe 4s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { transform:translateX(-50%) scale(0.6) translateY(0); }
    50%     { transform:translateX(-50%) scale(0.606) translateY(-4px); }
  }
  .float { animation:floaty 4s ease-in-out infinite; }
  @keyframes floaty {
    0%,100% { transform:translateX(-50%) scale(0.6) translateY(0); }
    50%     { transform:translateX(-50%) scale(0.6) translateY(-10px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .breathe, .float { animation:none; }
  }

  .name {
    margin-top:10px; font-weight:800; font-size:1.05rem; color:#1a365d;
    background:#e0f7fa; border:1px solid #40e0d0; border-radius:30px;
    padding:5px 16px; letter-spacing:-0.01em;
  }
  .role { margin-top:6px; font-size:0.8rem; color:#7089a3; }
</style>
</head>
