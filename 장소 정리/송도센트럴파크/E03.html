<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송도센트럴파크 MATHTOUR - E03</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #030712;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 16:9 비율 유지 게임 컨테이너 (1066px) */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #060b19;
            border: 4px solid #2d5a27;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* 3D WebGL Canvas Layer */
        #webgl-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 등장인물 iframe wrapper (260x320 고정 규격) */
        .char-wrapper {
            position: absolute;
            overflow: visible;
            z-index: 12;
            pointer-events: none;
            transition: filter 0.2s ease, opacity 0.3s ease;
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        /* 스테이지 상단 표시바 (Wooden Signpost) */
        #stage-signpost {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #6d4c41, #4a332a);
            color: #fdfbf7;
            padding: 8px 24px;
            border-radius: 20px;
            border: 2px solid #8aa171;
            font-family: 'Gowun Batang', serif;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 대화창 UI (유형 2 규칙) */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 920px;
            height: 125px;
            background: rgba(45, 90, 39, 0.92);
            backdrop-filter: blur(8px);
            border: 3px solid #6d4c41;
            border-radius: 16px;
            padding: 16px 24px;
            color: #fdfbf7;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 25;
            cursor: pointer;
        }

        #speaker-name {
            font-family: 'Gowun Batang', serif;
            font-size: 18px;
            font-weight: bold;
            color: #f4a261;
            margin-bottom: 4px;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #fdfbf7;
        }

        #click-prompt {
            position: absolute;
            right: 20px;
            bottom: 12px;
            font-size: 12px;
            color: #8aa171;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 3D 게임 오버레이 패널 (대화 종료 후 활성화) */
        #game-ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: none; /* 대화 중에는 숨김 */
            padding: 20px;
        }

        .panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 18px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
            color: #fff;
        }

        .controls-info {
            margin-top: 6px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            font-size: 11px;
            color: #cbd5e1;
        }

        .key-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            color: #38bdf8;
            display: inline-block;
        }

        #prompt-card {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px) scale(0.95);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            border: 2px solid #38bdf8;
            padding: 14px 28px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        #prompt-card.active {
            transform: translateX(-50%) translateY(0) scale(1);
            opacity: 1;
        }

        .build-btn-key {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: white;
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(56, 189, 248, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        #coord-display {
            position: absolute;
            bottom: 20px;
            left: 110px;
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 13px;
            color: #38bdf8;
        }

        #sequence-tracker {
            position: absolute;
            bottom: 20px;
            right: 110px;
            min-width: 220px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 3px 0;
            color: #64748b;
        }

        .step-item.active { color: #38bdf8; font-weight: 700; }
        .step-item.completed { color: #22c55e; text-decoration: line-through; }

        .step-num {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .step-item.active .step-num { background: #0284c7; color: #fff; }
        .step-item.completed .step-num { background: #22c55e; color: #fff; }

        /* 이동 네비게이션 버튼 규칙 */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            padding: 10px 24px;
            background-color: #2d5a27;
            color: #ffffff;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(45, 90, 39, 0.2);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            z-index: 30;
        }

        .btn-nav:hover {
            background-color: #6d4c41;
            transform: translateY(-2px);
        }

        #btn-prev { left: 20px; }
        #btn-skip { right: 20px; }
        #btn-next { right: 20px; display: none; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 상단 나무 팻말 -->
        <div id="stage-signpost">
            🌲 송도센트럴파크 MATHTOUR - 인천 3D 랜드마크 탐험
        </div>

        <!-- 3D 캔버스 -->
        <div id="webgl-container"></div>

        <!-- [에셋 로딩 규칙] 등장인물 민우 -->
        <div class="char-wrapper" id="char-민우" style="left: 60px; bottom: 20px; width: 195px; height: 240px;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.75); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- [에셋 로딩 규칙] 등장인물 서연 -->
        <div class="char-wrapper" id="char-서연" style="right: 60px; bottom: 20px; width: 195px; height: 240px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.75) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- [유형 2] 대화창 UI -->
        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name">민우</div>
            <div id="dialogue-text">대화를 시작합니다.</div>
            <div id="click-prompt">▼ 클릭하여 계속</div>
        </div>

        <!-- 3D 조작 건설 게임 HUD 패널 (대화 종료 후 노출) -->
        <div id="game-ui-layer">
            <div class="panel" style="position: absolute; top: 15px; left: 15px; max-width: 280px;">
                <h1 style="font-size: 15px; color: #38bdf8; margin-bottom: 4px;">🌊 인천 3D 랜드마크 건설</h1>
                <p style="font-size: 11px; color: #94a3b8;">키보드로 이동하여 6개 랜드마크를 순서대로 만드세요!</p>
                <div class="controls-info">
                    <div><span class="key-badge">W</span> Y축 +</div>
                    <div><span class="key-badge">S</span> Y축 -</div>
                    <div><span class="key-badge">A</span> X축 -</div>
                    <div><span class="key-badge">D</span> X축 +</div>
                </div>
            </div>

            <div id="prompt-card">
                <div id="prompt-step" style="font-size:11px; color:#38bdf8;">STEP 1 / 6</div>
                <div id="prompt-location" style="font-size:18px; font-weight:800; color:#fff; margin: 4px 0 8px 0;">차이나타운</div>
                <div class="build-btn-key">
                    <span class="key-badge" style="background:white; color:#0284c7;">E</span> 건설하기
                </div>
            </div>

            <div class="panel" id="coord-display">
                📍 좌표: (<span id="curr-x">0</span>, <span id="curr-y">0</span>)
            </div>

            <div class="panel" id="sequence-tracker">
                <h3 style="font-size:12px; margin-bottom:6px;">🏗️ 건설 진행 순서</h3>
                <div class="step-item active" id="step-ui-0"><span class="step-num">1</span> 차이나타운 (3, 7)</div>
                <div class="step-item" id="step-ui-1"><span class="step-num">2</span> 인천역 (2, 4)</div>
                <div class="step-item" id="step-ui-2"><span class="step-num">3</span> 월미도 (0, 1)</div>
                <div class="step-item" id="step-ui-3"><span class="step-num">4</span> 인천국제공항 (-6, 1)</div>
                <div class="step-item" id="step-ui-4"><span class="step-num">5</span> 인천대교 (-4, -3)</div>
                <div class="step-item" id="step-ui-5"><span class="step-num">6</span> 동북아트레이드타워 (3, -6)</div>
            </div>
        </div>

        <!-- 공통 이동 버튼 -->
        <button class="btn-nav" id="btn-prev" onclick="goPrev()">이전</button>
        <button class="btn-nav" id="btn-skip" onclick="finishDialogue()">건너뛰기</button>
        <button class="btn-nav" id="btn-next" onclick="goNext()">다음</button>
    </div>

    <!-- Three.js 3D 엔진 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 스토리 대화 스크립트 (유형 2)
        const dialogues = [
            { speaker: "민우", text: "여기가 바로 인천의 주요 랜드마크를 한눈에 볼 수 있는 무대야!", target: "char-민우" },
            { speaker: "서연", text: "우리가 지도 좌표를 따라서 순서대로 건축해 나가야 해.", target: "char-서연" },
            { speaker: "민우", text: "좋아! W, A, S, D 키로 이동하고 해당 위치에서 E 키를 눌러 건물을 완성해보자!", target: "char-민우" }
        ];

        let currentIndex = 0;
        let isGameActive = false; // 대화가 끝나면 true로 변경

        function advanceDialogue() {
            if (currentIndex < dialogues.length) {
                const current = dialogues[currentIndex];
                document.getElementById('speaker-name').textContent = current.speaker;
                document.getElementById('dialogue-text').textContent = current.text;

                document.querySelectorAll('.char-wrapper').forEach(el => el.classList.add('inactive'));
                const activeChar = document.getElementById(current.target);
                if (activeChar) activeChar.classList.remove('inactive');

                currentIndex++;
            } else {
                finishDialogue();
            }
        }

        function finishDialogue() {
            document.getElementById('dialogue-box').style.display = 'none';
            document.getElementById('btn-skip').style.display = 'none';
            document.getElementById('char-민우').style.display = 'none';
            document.getElementById('char-서연').style.display = 'none';
            
            // 3D 조작 UI 노출 및 키보드 조작 활성화
            document.getElementById('game-ui-layer').style.display = 'block';
            isGameActive = true;
        }

        function goPrev() { window.location.href = 'E02.html'; }
        function goNext() { window.location.href = 'E04.html'; }

        // ================= 3D 게임 엔진 파트 =================
        const CELL_SIZE = 14;
        const BUILD_SEQUENCE = [
            { key: '3,7', x: 3, y: 7, name: '차이나타운', type: 'chinatown' },
            { key: '2,4', x: 2, y: 4, name: '인천역', type: 'incheon_station' },
            { key: '0,1', x: 0, y: 1, name: '월미도', type: 'wolmido' },
            { key: '-6,1', x: -6, y: 1, name: '인천국제공항', type: 'airport' },
            { key: '-4,-3', x: -4, y: -3, name: '인천대교', type: 'incheon_bridge' },
            { key: '3,-6', x: 3, y: -6, name: '동북아트레이드타워', type: 'trade_tower' }
        ];

        let currentSequenceIndex = 0;
        let playerPos = { x: 0, y: 0 };
        let targetCameraPos = { x: 0, y: 0, z: 0 };
        const landmarkObjects = {};

        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060b19);
        scene.fog = new THREE.FogExp2(0x060b19, 0.005);

        const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 1000);
        const OFFSET_Y = 36, OFFSET_Z = 46;

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        const gameContainer = document.getElementById('game-container');
        
        function resizeRenderer() {
            const width = gameContainer.clientWidth;
            const height = gameContainer.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff7ed, 1.5);
        sunLight.position.set(-70, 90, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        function gridToWorld(gx, gy) {
            return { x: gx * CELL_SIZE, z: -gy * CELL_SIZE };
        }

        function createEnvironment() {
            const land = new THREE.Mesh(new THREE.PlaneGeometry(180, 260), new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85 }));
            land.rotation.x = -Math.PI / 2;
            land.position.set(40, -0.1, 0);
            scene.add(land);

            const sea = new THREE.Mesh(new THREE.PlaneGeometry(160, 260), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.05, metalness: 0.85, transparent: true, opacity: 0.88 }));
            sea.rotation.x = -Math.PI / 2;
            sea.position.set(-85, -0.2, 0);
            scene.add(sea);

            const gridHelper = new THREE.GridHelper(20 * CELL_SIZE, 20, 0x38bdf8, 0x1e293b);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            const tileGeo = new THREE.PlaneGeometry(CELL_SIZE * 0.88, CELL_SIZE * 0.88);
            tileGeo.rotateX(-Math.PI / 2);

            for (let gx = -8; gx <= 8; gx++) {
                for (let gy = -8; gy <= 8; gy++) {
                    const mat = new THREE.MeshBasicMaterial({ color: (gx < -2 ? 0x0284c7 : 0x1f2937), transparent: true, opacity: 0.08 });
                    const tile = new THREE.Mesh(tileGeo, mat);
                    tile.position.set(gx * CELL_SIZE, 0.02, -gy * CELL_SIZE);
                    scene.add(tile);
                }
            }
        }

        let playerGroup, minwooMesh, seoyeonMesh;
        function createCharacters() {
            playerGroup = new THREE.Group();
            function buildHumanoid(shirtColor, pantsColor) {
                const char = new THREE.Group();
                const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.6), new THREE.MeshStandardMaterial({ color: shirtColor }));
                torso.position.y = 1.4;
                char.add(torso);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
                head.position.y = 2.4;
                char.add(head);
                return char;
            }

            minwooMesh = buildHumanoid(0x2563eb, 0x1e293b);
            minwooMesh.position.set(-0.8, 0, 0);
            playerGroup.add(minwooMesh);

            seoyeonMesh = buildHumanoid(0xf43f5e, 0x475569);
            seoyeonMesh.position.set(0.8, 0, 0);
            playerGroup.add(seoyeonMesh);

            const ring = new THREE.Mesh(new THREE.RingGeometry(CELL_SIZE * 0.32, CELL_SIZE * 0.42, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide }));
            ring.position.y = 0.08;
            playerGroup.add(ring);

            scene.add(playerGroup);
        }

        function buildChinatown() {
            const group = new THREE.Group();
            const redMat = new THREE.MeshStandardMaterial({ color: 0x991b1b });
            [-3.2, -1.2, 1.2, 3.2].forEach(x => {
                const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 6, 16), redMat);
                pillar.position.set(x, 3, 0);
                group.add(pillar);
            });
            const roof = new THREE.Mesh(new THREE.ConeGeometry(4.2, 1.6, 4), new THREE.MeshStandardMaterial({ color: 0x047857 }));
            roof.position.set(0, 6.8, 0);
            roof.rotation.y = Math.PI / 4;
            group.add(roof);
            return group;
        }

        function buildIncheonStation() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(8, 3.8, 4.5), new THREE.MeshStandardMaterial({ color: 0x991b1b }));
            body.position.y = 1.9;
            group.add(body);
            const tower = new THREE.Mesh(new THREE.BoxGeometry(2.6, 6.5, 2.6), new THREE.MeshStandardMaterial({ color: 0x991b1b }));
            tower.position.set(0, 3.25, 1.3);
            group.add(tower);
            return group;
        }

        function buildWolmido() {
            const group = new THREE.Group();
            const wheelGroup = new THREE.Group();
            wheelGroup.position.set(0, 9.5, 0);
            wheelGroup.add(new THREE.Mesh(new THREE.TorusGeometry(5.2, 0.2, 16, 36), new THREE.MeshStandardMaterial({ color: 0xf8fafc })));
            for (let i = 0; i < 8; i++) {
                const cabin = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 12), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
                cabin.position.set(Math.cos(i * Math.PI / 4) * 5.2, Math.sin(i * Math.PI / 4) * 5.2, 0);
                wheelGroup.add(cabin);
            }
            group.add(wheelGroup);
            group.userData.animator = () => { wheelGroup.rotation.z += 0.008; };
            return group;
        }

        function buildAirport() {
            const group = new THREE.Group();
            const roof = new THREE.Mesh(new THREE.SphereGeometry(5.5, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.32), new THREE.MeshStandardMaterial({ color: 0xcbd5e1 }));
            roof.scale.set(1.2, 0.35, 0.85);
            roof.position.set(0, 1.5, -0.6);
            group.add(roof);
            return group;
        }

        function buildIncheonBridge() {
            const group = new THREE.Group();
            const road = new THREE.Mesh(new THREE.BoxGeometry(13, 0.4, 2.6), new THREE.MeshStandardMaterial({ color: 0x334155 }));
            road.position.y = 2.8;
            group.add(road);
            return group;
        }

        function buildTradeTower() {
            const group = new THREE.Group();
            const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 3.8, 22, 4), new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.9 }));
            tower.position.y = 11;
            tower.rotation.y = Math.PI / 4;
            group.add(tower);
            return group;
        }

        function spawnLandmark(seqItem) {
            let buildingGroup;
            switch (seqItem.type) {
                case 'chinatown': buildingGroup = buildChinatown(); break;
                case 'incheon_station': buildingGroup = buildIncheonStation(); break;
                case 'wolmido': buildingGroup = buildWolmido(); break;
                case 'airport': buildingGroup = buildAirport(); break;
                case 'incheon_bridge': buildingGroup = buildIncheonBridge(); break;
                case 'trade_tower': buildingGroup = buildTradeTower(); break;
            }

            const worldPos = gridToWorld(seqItem.x, seqItem.y);
            buildingGroup.position.set(worldPos.x, -12, worldPos.z);
            scene.add(buildingGroup);

            landmarkObjects[seqItem.key] = { mesh: buildingGroup, targetY: 0, currentY: -12, animating: true };

            const uiStep = document.getElementById(`step-ui-${currentSequenceIndex}`);
            if (uiStep) {
                uiStep.classList.remove('active');
                uiStep.classList.add('completed');
            }

            currentSequenceIndex++;

            if (currentSequenceIndex < BUILD_SEQUENCE.length) {
                const nextStep = document.getElementById(`step-ui-${currentSequenceIndex}`);
                if (nextStep) nextStep.classList.add('active');
            } else {
                // 모두 완공되면 '다음' 버튼 활성화!
                document.getElementById('btn-next').style.display = 'block';
            }
            checkPromptUI();
        }

        createEnvironment();
        createCharacters();

        function updatePlayerPosition(dx, dy) {
            if (!isGameActive) return;

            playerPos.x = Math.max(-8, Math.min(8, playerPos.x + dx));
            playerPos.y = Math.max(-8, Math.min(8, playerPos.y + dy));

            document.getElementById('curr-x').textContent = playerPos.x;
            document.getElementById('curr-y').textContent = playerPos.y;

            const worldPos = gridToWorld(playerPos.x, playerPos.y);
            playerGroup.position.set(worldPos.x, 0, worldPos.z);

            targetCameraPos.x = worldPos.x;
            targetCameraPos.y = OFFSET_Y;
            targetCameraPos.z = worldPos.z + OFFSET_Z;

            checkPromptUI();
        }

        function checkPromptUI() {
            const card = document.getElementById('prompt-card');
            if (currentSequenceIndex >= BUILD_SEQUENCE.length) {
                card.classList.remove('active');
                return;
            }

            const targetSeq = BUILD_SEQUENCE[currentSequenceIndex];
            const isAtTarget = (playerPos.x === targetSeq.x && playerPos.y === targetSeq.y);

            if (isAtTarget) {
                document.getElementById('prompt-step').textContent = `STEP ${currentSequenceIndex + 1} / 6`;
                document.getElementById('prompt-location').textContent = `${targetSeq.name} (${targetSeq.x}, ${targetSeq.y})`;
                card.classList.add('active');
            } else {
                card.classList.remove('active');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!isGameActive) return;
            const code = e.code;
            if (code === 'KeyW' || code === 'ArrowUp') updatePlayerPosition(0, 1);
            else if (code === 'KeyS' || code === 'ArrowDown') updatePlayerPosition(0, -1);
            else if (code === 'KeyA' || code === 'ArrowLeft') updatePlayerPosition(-1, 0);
            else if (code === 'KeyD' || code === 'ArrowRight') updatePlayerPosition(1, 0);
            else if (code === 'KeyE') {
                if (currentSequenceIndex < BUILD_SEQUENCE.length) {
                    const targetSeq = BUILD_SEQUENCE[currentSequenceIndex];
                    if (playerPos.x === targetSeq.x && playerPos.y === targetSeq.y) {
                        spawnLandmark(targetSeq);
                    }
                }
            }
        });

        updatePlayerPosition(0, 0);
        resizeRenderer();
        window.addEventListener('resize', resizeRenderer);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            camera.position.x += (targetCameraPos.x - camera.position.x) * 0.08;
            camera.position.y += (targetCameraPos.y - camera.position.y) * 0.08;
            camera.position.z += (targetCameraPos.z - camera.position.z) * 0.08;

            const lookTargetX = playerGroup.position.x;
            const lookTargetZ = playerGroup.position.z;
            camera.lookAt(lookTargetX, 0, lookTargetZ - 8);

            minwooMesh.position.y = Math.sin(elapsedTime * 3) * 0.1;
            seoyeonMesh.position.y = Math.cos(elapsedTime * 3) * 0.1;

            Object.keys(landmarkObjects).forEach(key => {
                const item = landmarkObjects[key];
                if (item.animating) {
                    item.currentY += (item.targetY - item.currentY) * 0.08;
                    item.mesh.position.y = item.currentY;
                    if (Math.abs(item.targetY - item.currentY) < 0.01) {
                        item.mesh.position.y = item.targetY;
                        item.animating = false;
                    }
                }
                if (item.mesh.userData.animator) item.mesh.userData.animator();
            });

            renderer.render(scene, camera);
        }

        // 대화 시작
        advanceDialogue();
        animate();
    </script>
</body>
</html>
