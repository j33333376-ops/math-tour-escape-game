<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>송도센트럴파크 - 송도한옥마을</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .hv-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="hv-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="송도한옥마을">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c3e2f2"/><stop offset="100%" stop-color="#eef6fb"/></linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9ecbe0"/><stop offset="100%" stop-color="#6ba6c6"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#586576"/><stop offset="100%" stop-color="#3a434f"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8a5a2e"/><stop offset="100%" stop-color="#6a4420"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="470" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.6"><ellipse cx="300" cy="70" rx="70" ry="22"/><ellipse cx="900" cy="60" rx="80" ry="24"/></g>

  <!-- 뒤편 현대 송도 마천루 -->
  <g stroke="#4f8aa8" stroke-width="2">
    <rect x="70" y="150" width="80" height="330" fill="url(#tower)"/>
    <rect x="180" y="90" width="66" height="390" fill="url(#tower)"/>
    <rect x="880" y="120" width="74" height="360" fill="url(#tower)"/>
    <rect x="980" y="180" width="92" height="300" fill="url(#tower)"/>
    <rect x="1090" y="230" width="60" height="250" fill="url(#tower)"/>
  </g>
  <g fill="#d5ecf5" opacity="0.85">
    <g><rect x="82" y="165" width="56" height="10"/><rect x="82" y="190" width="56" height="10"/><rect x="82" y="215" width="56" height="10"/><rect x="82" y="240" width="56" height="10"/><rect x="82" y="265" width="56" height="10"/><rect x="82" y="290" width="56" height="10"/></g>
    <g><rect x="192" y="108" width="42" height="9"/><rect x="192" y="130" width="42" height="9"/><rect x="192" y="152" width="42" height="9"/><rect x="192" y="174" width="42" height="9"/><rect x="192" y="196" width="42" height="9"/><rect x="192" y="218" width="42" height="9"/></g>
    <g><rect x="892" y="138" width="50" height="10"/><rect x="892" y="162" width="50" height="10"/><rect x="892" y="186" width="50" height="10"/><rect x="892" y="210" width="50" height="10"/><rect x="892" y="234" width="50" height="10"/></g>
    <g><rect x="994" y="198" width="64" height="10"/><rect x="994" y="222" width="64" height="10"/><rect x="994" y="246" width="64" height="10"/><rect x="994" y="270" width="64" height="10"/></g>
  </g>

  <!-- 땅 -->
  <rect x="0" y="470" width="1200" height="250" fill="#d8cba8"/>
  <path d="M0,470 Q600,456 1200,470 L1200,540 Q600,528 0,540 Z" fill="#c9b98f" opacity="0.6"/>

  <!-- 기와 담장 -->
  <g>
    <rect x="40" y="430" width="1120" height="42" fill="#e6dcc4" stroke="#c3b48c" stroke-width="2"/>
    <rect x="30" y="416" width="1140" height="18" rx="6" fill="#4b5561"/>
  </g>

  <!-- 한옥 3채 -->
  <!-- 왼쪽 한옥 -->
  <g transform="translate(250,470)">
    <rect x="-150" y="-96" width="300" height="96" fill="#f0e7d2" stroke="#b79a6a" stroke-width="2"/>
    <g fill="url(#wood)" stroke="#4d3216" stroke-width="1.5"><rect x="-140" y="-96" width="16" height="96"/><rect x="-8" y="-96" width="16" height="96"/><rect x="124" y="-96" width="16" height="96"/></g>
    <rect x="-120" y="-84" width="108" height="84" fill="#efe6d0" stroke="#b79a6a" stroke-width="1.6"/>
    <rect x="20" y="-84" width="104" height="84" fill="#efe6d0" stroke="#b79a6a" stroke-width="1.6"/>
    <g stroke="#c19a5e" stroke-width="1.3" opacity="0.85"><line x1="-66" y1="-84" x2="-66" y2="0"/><line x1="72" y1="-84" x2="72" y2="0"/><line x1="-120" y1="-42" x2="124" y2="-42"/></g>
    <path d="M-172,-96 L-100,-172 L100,-172 L172,-96 Z" fill="url(#roof)" stroke="#2c333d" stroke-width="3"/>
    <rect x="-102" y="-180" width="204" height="12" rx="5" fill="#2c333d"/>
  </g>
  <!-- 오른쪽 한옥 -->
  <g transform="translate(760,470)">
    <rect x="-150" y="-96" width="300" height="96" fill="#f0e7d2" stroke="#b79a6a" stroke-width="2"/>
    <g fill="url(#wood)" stroke="#4d3216" stroke-width="1.5"><rect x="-140" y="-96" width="16" height="96"/><rect x="-8" y="-96" width="16" height="96"/><rect x="124" y="-96" width="16" height="96"/></g>
    <rect x="-120" y="-84" width="108" height="84" fill="#efe6d0" stroke="#b79a6a" stroke-width="1.6"/>
    <rect x="20" y="-84" width="104" height="84" fill="#efe6d0" stroke="#b79a6a" stroke-width="1.6"/>
    <g stroke="#c19a5e" stroke-width="1.3" opacity="0.85"><line x1="-66" y1="-84" x2="-66" y2="0"/><line x1="72" y1="-84" x2="72" y2="0"/><line x1="-120" y1="-42" x2="124" y2="-42"/></g>
    <path d="M-172,-96 L-100,-172 L100,-172 L172,-96 Z" fill="url(#roof)" stroke="#2c333d" stroke-width="3"/>
    <rect x="-102" y="-180" width="204" height="12" rx="5" fill="#2c333d"/>
  </g>

  <!-- 가운데 솟을대문 -->
  <g transform="translate(505,470)">
    <rect x="-58" y="-120" width="16" height="120" fill="url(#wood)" stroke="#4d3216" stroke-width="1.5"/>
    <rect x="42" y="-120" width="16" height="120" fill="url(#wood)" stroke="#4d3216" stroke-width="1.5"/>
    <rect x="-44" y="-116" width="88" height="116" fill="#5a3d22"/>
    <line x1="0" y1="-116" x2="0" y2="0" stroke="#3a2814" stroke-width="3"/>
    <circle cx="-16" cy="-58" r="5" fill="#c9a24a"/><circle cx="16" cy="-58" r="5" fill="#c9a24a"/>
    <path d="M-84,-120 L0,-180 L84,-120 Z" fill="url(#roof)" stroke="#2c333d" stroke-width="3"/>
    <rect x="-70" y="-124" width="140" height="10" fill="#2c333d"/>
  </g>

  <!-- 사인 -->
  <g transform="translate(600,636)">
    <rect x="-118" y="-24" width="236" height="42" rx="10" fill="rgba(255,255,255,0.92)" stroke="#7a4f28" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#5a3d1f">송도한옥마을</text>
  </g>
</svg>
</body>
</html>
