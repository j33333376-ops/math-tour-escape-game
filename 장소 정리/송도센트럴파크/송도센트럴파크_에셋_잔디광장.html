<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>송도 센트럴파크 잔디광장</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .jdg-svg { display:block; width:100%; height:auto; }
  @keyframes jdg-sway { 0%,100%{ transform: rotate(-1.5deg); } 50%{ transform: rotate(1.5deg); } }
  .jdg-tree { animation: jdg-sway 4.5s ease-in-out infinite; }
  @keyframes jdg-drift { 0%,100%{ transform: translateX(0); } 50%{ transform: translateX(22px); } }
  .jdg-cloud { animation: jdg-drift 16s ease-in-out infinite; }
  @keyframes jdg-kite { 0%,100%{ transform: translate(0,0) rotate(-6deg); } 50%{ transform: translate(-14px,-16px) rotate(6deg); } }
  .jdg-kite { animation: jdg-kite 7s ease-in-out infinite; transform-origin: center; }
</style>
</head>

 </linearGradient>
 <linearGradient id="jdg-grass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#8fbf62"/><stop offset="1" stop-color="#4f8038"/>
 </linearGradient>
 <linearGradient id="jdg-trunk" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7d5934"/><stop offset="0.45" stop-color="#966d42"/><stop offset="1" stop-color="#5e4126"/>
 </linearGradient>
 <radialGradient id="jdg-leafA" cx="0.36" cy="0.3" r="0.78">
  <stop offset="0" stop-color="#6fa855"/><stop offset="1" stop-color="#386d33"/>
 </radialGradient>
 <radialGradient id="jdg-leafB" cx="0.4" cy="0.32" r="0.78">
  <stop offset="0" stop-color="#7fb85f"/><stop offset="1" stop-color="#47823d"/>
 </radialGradient>
 <linearGradient id="jdg-tower" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#b9cdda"/><stop offset="1" stop-color="#8ea6b6"/>
 </linearGradient>
 <linearGradient id="jdg-path" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e2d9c0"/><stop offset="1" stop-color="#cabf9f"/>
 </linearGradient>
</defs>
