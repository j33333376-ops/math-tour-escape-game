<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송도센트럴파크 MATHTOUR - E01</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a2618;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
    }

    /* 게임 무대 컨테이너 (16:9 비율 유지) */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background-color: #f2f7f2;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
    }

    /* 화면 전환 전환효과 (빨려들어가는 연출) */
    #game-container.portal-suck {
      animation: suckIn 0.8s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes suckIn {
      0% {
        transform: scale(1) rotate(0deg);
        filter: brightness(1) blur(0px);
        opacity: 1;
      }
      50% {
        filter: brightness(1.5) blur(2px);
      }
      100% {
        transform: scale(0.01) rotate(1080deg);
        filter: brightness(3) blur(10px);
        opacity: 0;
      }
    }

    /* 배경 이미지/HTML iframe 세팅 */
    .bg-iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 0;
      pointer-events: none;
      object-fit: cover;
    }

    /* 상단 나무 팻말 스테이지 바 */
    .stage-header {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background-color: #6d4c41;
      color: #fdfbf7;
      padding: 6px 24px;
      border-radius: 12px;
      border: 3px solid #2d5a27;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      font-family: 'Gowun Batang', serif;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stage-header::before, .stage-header::after {
      content: '🌿';
      font-size: 0.9rem;
    }

    /* 인물 배치 영역 (화면 가장 왼쪽, 텍스트와 절대 안 겹치게 배치) */
    .char-wrapper {
      position: absolute;
      overflow: visible;
      z-index: 3;
      transition: filter 0.2s;
    }

    /* 상황 설명 글 상자 (유형 1: 온실 유리 스타일) */
    .situation-box {
      position: absolute;
      top: 52%;
      right: 40px;
      transform: translateY(-50%);
      width: 580px;
      max-width: 58%;
      background: rgba(255, 255, 255, 0.88);
      border: 3px solid #8aa171;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(45, 90, 39, 0.15);
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .situation-title {
      font-family: 'Gowun Batang', serif;
      font-size: 1.35rem;
      color: #2d5a27;
      margin-bottom: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px dashed #8aa171;
      padding-bottom: 8px;
    }

    .situation-text {
      font-size: 0.95rem;
      color: #3e4a3d;
      line-height: 1.65;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }

    /* 공통 이동 버튼 세팅 */
    .btn-nav {
      position: absolute;
      z-index: 100;
      background-color: #2d5a27;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(45, 90, 39, 0.2);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-nav:hover {
      background-color: #6d4c41;
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.25);
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
    }

    #btn-next {
      right: 20px;
      bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 배경 에셋 (인천도시역사관) -->
    <iframe class="bg-iframe" src="송도센트럴파크_인천도시역사관.html" scrolling="no"></iframe>

    <!-- 상단 나무 팻말 바 -->
    <div class="stage-header">
      송도센트럴파크 MATHTOUR — 인천도시역사관
    </div>

    <!-- 캐릭터 배치 (화면 가장 왼쪽에 겹쳐서 자연스럽게 서 있도록 배치) -->
    <!-- 캐릭터 1: 민우 -->
    <div class="char-wrapper" id="char-민우" style="left: 10px; bottom: 15px; width: 234px; height: 288px;">
      <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.9); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 캐릭터 2: 서연 -->
    <div class="char-wrapper" id="char-서연" style="left: 140px; bottom: 10px; width: 234px; height: 288px;">
      <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.9); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 중앙 상황 설명 박스 -->
    <div class="situation-box">
      <div class="situation-title">
        🏛️ 인천도시역사관 탐험
      </div>
      <div class="situation-text">
        민우와 서연이는 인천의 탄생과 발전을 한눈에 볼 수 있는 <b>인천도시역사관</b>에 도착했습니다.<br><br>
        이곳은 인천의 역사와 변화 과정을 다양한 실물 자료와 모형으로 소개하고 있으며, 도시 탐험을 위한 여러 교육 프로그램도 함께 운영하고 있습니다.
      </div>
    </div>

    <!-- 네비게이션 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="navigateTo('index.html')">◀ 이전</button>
    <button class="btn-nav" id="btn-next" onclick="suckAndNavigate('E02.html')">다음 ▶</button>
  </div>

  <script>
    // 일반 이동 함수
    function navigateTo(url) {
      if (url) {
        window.location.href = url;
      }
    }

    // 다음 페이지 이동 시 빨려들어가는 연출 실행
    function suckAndNavigate(url) {
      const container = document.getElementById('game-container');
      
      // 빨려들어가는 애니메이션 클래스 추가
      container.classList.add('portal-suck');
      
      // 애니메이션 진행(0.8s) 후 다음 장면으로 이동
      setTimeout(() => {
        if (url) {
          window.location.href = url;
        } else {
          alert("마지막 장면입니다.");
        }
      }, 750);
    }
  </script>
</body>
</html>
