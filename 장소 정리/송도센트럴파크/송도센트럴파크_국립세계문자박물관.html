<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>송도센트럴파크 - 국립세계문자박물관</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .mow-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="mow-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="국립세계문자박물관">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfe3f5"/><stop offset="100%" stop-color="#edf7fc"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a9d6e8"/><stop offset="100%" stop-color="#6fb2cf"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbfdff"/><stop offset="100%" stop-color="#dbe6ee"/></linearGradient>
    <linearGradient id="roofc" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef4f8"/><stop offset="100%" stop-color="#c4d3de"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="500" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.6"><ellipse cx="230" cy="80" rx="70" ry="22"/><ellipse cx="980" cy="66" rx="82" ry="24"/></g>
  <!-- 원경 송도 스카이라인 -->
  <g opacity="0.5">
    <rect x="60" y="230" width="70" height="230" fill="#9fc4d8"/><rect x="150" y="180" width="54" height="280" fill="#b0d0e0"/>
    <rect x="1010" y="200" width="64" height="260" fill="#a6cadb"/><rect x="1090" y="250" width="50" height="210" fill="#b6d4e2"/>
  </g>
  <!-- 땅/광장 -->
  <rect x="0" y="470" width="1200" height="250" fill="#d7dee4"/>
  <rect x="0" y="470" width="1200" height="16" fill="#c3ccd3"/>
  <g stroke="#bcc6cd" stroke-width="2" opacity="0.7"><line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="640" x2="1200" y2="640"/><line x1="400" y1="486" x2="330" y2="720"/><line x1="800" y1="486" x2="870" y2="720"/></g>

  <!-- 박물관 건물 : 곡선 캐노피 + 유리 -->
  <g>
    <!-- 유리 본체 -->
    <rect x="300" y="300" width="600" height="176" fill="url(#glass)" stroke="#5a93ad" stroke-width="3"/>
    <g stroke="#cfeaf4" stroke-width="2" opacity="0.8">
      <line x1="380" y1="300" x2="380" y2="476"/><line x1="460" y1="300" x2="460" y2="476"/><line x1="540" y1="300" x2="540" y2="476"/><line x1="620" y1="300" x2="620" y2="476"/><line x1="700" y1="300" x2="700" y2="476"/><line x1="780" y1="300" x2="780" y2="476"/><line x1="820" y1="300" x2="820" y2="476"/>
      <line x1="300" y1="360" x2="900" y2="360"/><line x1="300" y1="420" x2="900" y2="420"/>
    </g>
    <!-- 흰 곡선 캐노피 지붕 -->
    <path d="M250,300 Q600,196 950,300 L950,330 Q600,232 250,330 Z" fill="url(#roofc)" stroke="#a9bcc9" stroke-width="3"/>
    <!-- 입구 -->
    <rect x="556" y="392" width="88" height="84" fill="#3f6b82"/>
    <rect x="556" y="392" width="88" height="84" fill="none" stroke="#2c4f63" stroke-width="2"/>
    <line x1="600" y1="392" x2="600" y2="476" stroke="#cfeaf4" stroke-width="2"/>
  </g>

  <!-- 세계 문자 전시판 -->
  <g>
    <rect x="360" y="500" width="480" height="86" rx="10" fill="#ffffff" stroke="#8fb8cc" stroke-width="3"/>
    <g font-family="'Nanum Myeongjo',serif" font-weight="800" font-size="42" text-anchor="middle">
      <text x="410" y="560" fill="#c0392b">가</text>
      <text x="483" y="560" fill="#2b6cb0">A</text>
      <text x="556" y="560" fill="#2f855a">文</text>
      <text x="629" y="560" fill="#b7791f">あ</text>
      <text x="702" y="560" fill="#6b46c1">ᄒ</text>
      <text x="775" y="560" fill="#0b7285">Ω</text>
    </g>
  </g>
  <!-- 사인 -->
  <g transform="translate(600,268)">
    <rect x="-150" y="-26" width="300" height="40" rx="8" fill="#1f3a4d"/>
    <text x="0" y="2" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#ffffff">국립세계문자박물관</text>
  </g>

  <!-- 나무 -->
  <g transform="translate(130,470)"><rect x="-6" y="0" width="12" height="46" fill="#6a4a2c"/><circle cy="-14" r="34" fill="#5aa653"/><circle cx="-22" cy="4" r="22" fill="#69b55f"/><circle cx="22" cy="4" r="22" fill="#69b55f"/></g>
  <g transform="translate(1070,470)"><rect x="-6" y="0" width="12" height="46" fill="#6a4a2c"/><circle cy="-14" r="34" fill="#5aa653"/><circle cx="-22" cy="4" r="22" fill="#69b55f"/><circle cx="22" cy="4" r="22" fill="#69b55f"/></g>
  <!-- 사람 -->
  <g fill="#41637a"><circle cx="470" cy="632" r="9"/><rect x="463" y="640" width="14" height="26" rx="5"/></g>
  <g fill="#7a5a41"><circle cx="720" cy="640" r="9"/><rect x="713" y="648" width="14" height="26" rx="5"/></g>
</svg>
</body>
</html>
