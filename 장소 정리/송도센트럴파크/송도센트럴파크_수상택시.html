<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>송도센트럴파크 - 수상택시</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .wt-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="wt-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="송도 센트럴파크 수상택시">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfe1f4"/><stop offset="100%" stop-color="#e9f5fb"/></linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a7d0e4"/><stop offset="100%" stop-color="#6ea9c8"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7cc0dc"/><stop offset="100%" stop-color="#3f92bb"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="430" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.6"><ellipse cx="250" cy="70" rx="72" ry="22"/><ellipse cx="960" cy="58" rx="84" ry="24"/></g>

  <!-- 스카이라인 -->
  <g stroke="#4f8aa8" stroke-width="2">
    <rect x="60" y="150" width="70" height="270" fill="url(#tower)"/>
    <rect x="150" y="100" width="58" height="320" fill="url(#tower)"/>
    <rect x="230" y="190" width="64" height="230" fill="url(#tower)"/>
    <polygon points="820,420 820,150 858,120 896,150 896,420" fill="url(#tower)"/>
    <rect x="920" y="120" width="80" height="300" fill="url(#tower)"/>
    <rect x="1020" y="180" width="60" height="240" fill="url(#tower)"/>
    <rect x="1100" y="220" width="56" height="200" fill="url(#tower)"/>
  </g>
  <g fill="#d5ecf5" opacity="0.85">
    <g><rect x="72" y="166" width="46" height="9"/><rect x="72" y="188" width="46" height="9"/><rect x="72" y="210" width="46" height="9"/><rect x="72" y="232" width="46" height="9"/></g>
    <g><rect x="160" y="116" width="38" height="9"/><rect x="160" y="138" width="38" height="9"/><rect x="160" y="160" width="38" height="9"/><rect x="160" y="182" width="38" height="9"/></g>
    <g><rect x="932" y="136" width="56" height="9"/><rect x="932" y="158" width="56" height="9"/><rect x="932" y="180" width="56" height="9"/><rect x="932" y="202" width="56" height="9"/></g>
  </g>
  <!-- 다리 -->
  <path d="M300,420 Q600,352 900,420" fill="none" stroke="#c9d4da" stroke-width="10"/>
  <path d="M300,420 Q600,352 900,420" fill="none" stroke="#eef4f7" stroke-width="4"/>

  <!-- 물 -->
  <rect x="0" y="420" width="1200" height="300" fill="url(#water)"/>
  <!-- 스카이라인 반영 -->
  <g fill="#5aa6c8" opacity="0.35">
    <rect x="150" y="420" width="58" height="60"/><rect x="920" y="420" width="80" height="70"/>
  </g>
  <!-- 물결 -->
  <g stroke="#eaf6fb" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M60,500 q22,-9 44,0 q22,9 44,0"/><path d="M300,560 q26,-10 52,0 q26,10 52,0"/>
    <path d="M900,520 q22,-9 44,0 q22,9 44,0"/><path d="M1000,600 q26,-10 52,0 q26,10 52,0"/>
    <path d="M150,650 q26,-10 52,0 q26,10 52,0"/>
  </g>

  <!-- 수상택시 보트 -->
  <g transform="translate(600,540)">
    <!-- 그림자/물결 -->
    <ellipse cx="0" cy="70" rx="210" ry="20" fill="#2d7ba0" opacity="0.4"/>
    <!-- 선체 -->
    <path d="M-190,20 L190,20 L150,74 L-150,74 Z" fill="#f4f7fa" stroke="#b7c6d0" stroke-width="3"/>
    <rect x="-190" y="20" width="380" height="14" fill="#ffd23f"/>
    <!-- 캐빈 -->
    <path d="M-140,20 L-118,-42 L120,-42 L142,20 Z" fill="#eaf1f6" stroke="#b7c6d0" stroke-width="3"/>
    <!-- 창문 -->
    <g fill="#4aa0c4" stroke="#2c6f92" stroke-width="2">
      <rect x="-116" y="-30" width="46" height="34" rx="4"/><rect x="-58" y="-30" width="46" height="34" rx="4"/><rect x="0" y="-30" width="46" height="34" rx="4"/><rect x="58" y="-30" width="46" height="34" rx="4"/>
    </g>
    <!-- 지붕 -->
    <rect x="-150" y="-54" width="300" height="16" rx="7" fill="#2b6cb0"/>
    <!-- 택시 표시등 -->
    <g transform="translate(0,-66)"><rect x="-34" y="-16" width="68" height="20" rx="5" fill="#ffd23f" stroke="#c99a1e" stroke-width="2"/><text x="0" y="0" text-anchor="middle" font-family="'Jua',sans-serif" font-size="14" font-weight="700" fill="#5a3d1f">TAXI</text></g>
    <!-- 승객 -->
    <g><circle cx="-93" cy="-14" r="9" fill="#c0392b"/><circle cx="-35" cy="-14" r="9" fill="#2f855a"/><circle cx="23" cy="-14" r="9" fill="#6b46c1"/><circle cx="81" cy="-14" r="9" fill="#b7791f"/></g>
  </g>

  <!-- 사인 -->
  <g transform="translate(600,676)">
    <rect x="-92" y="-24" width="184" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#1f4e79">수상택시</text>
  </g>
</svg>
</body>
</html>
