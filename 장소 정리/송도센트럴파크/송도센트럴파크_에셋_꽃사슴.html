<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꽃사슴</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .sds-svg { display:block; width:100%; height:auto; }
  .sds-ear { animation: sds-ear 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 100%; }
  @keyframes sds-ear { 0%,90%,100% { transform: rotate(0deg);} 95% { transform: rotate(-12deg);} }
  .sds-tail { animation: sds-tail 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
  @keyframes sds-tail { 0%,100% { transform: rotate(-9deg);} 50% { transform: rotate(9deg);} }
</style>
</head>
