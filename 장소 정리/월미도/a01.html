<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월미도 MATHTOUR - 월미전통정원</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            color: #2d3748;
        }

        /* 게임 무대 컨테이너 (16:9 비율 고정) */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #d4af37;
        }

        /* 배경 이미지 */
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 상단 스테이지 표시바 */
        #stage-header {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid #d4af37;
            padding: 8px 18px;
            border-radius: 4px;
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.1rem;
            font-weight: 700;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* 무대 요소 Layer */
        #stage-area {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* 등장인물 Wrapper */
        .char-wrapper {
            position: absolute;
            overflow: visible;
            transition: filter 0.2s ease;
        }

        /* 비활성화 상태 인물 (어둡게 처리) */
        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        /* 상단 상황 설명 박스 */
        .situation-box {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 78%;
            max-width: 820px;
            background: #f5f0e6;
            background-image: linear-gradient(to bottom, #fdfbf7, #e2d7c5);
            border: 2px solid #8c3030;
            outline: 1px solid #d4af37;
            outline-offset: -5px;
            padding: 16px 24px;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
            text-align: center;
        }

        .situation-title {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.25rem;
            color: #8c3030;
            font-weight: 700;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px dashed #d4af37;
        }

        .situation-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #2d3748;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        /* 하단 대화창 UI */
        #dialogue-box {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 900px;
            height: 120px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 15px 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 15;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 8px;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.98rem;
            line-height: 1.6;
            color: #ffffff;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        .click-prompt {
            position: absolute;
            right: 15px;
            bottom: 10px;
            font-size: 0.8rem;
            color: #d4af37;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        /* 네비게이션 공통 버튼 */
        .btn-nav {
            position: absolute;
            background: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .btn-nav:hover {
            background: #661f1f;
        }

        .btn-nav:active {
            transform: scale(0.98);
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
            bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 1. 배경 이미지 -->
        <img src="월미전통정원.png" alt="월미전통정원 배경" class="bg-img">

        <!-- 2. 상단 스테이지 표시바 -->
        <div id="stage-header">월미도 MATHTOUR — 월미전통정원</div>

        <!-- 3. 무대 요소 (등장인물 배치) -->
        <div id="stage-area">
            <!-- 민우 (좌측 배치, 규격 260x320) -->
            <div class="char-wrapper" id="char-민우" style="left: 60px; bottom: 20px; width: 260px; height: 320px; z-index: 3;">
                <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
            </div>

            <!-- 서연 (우측 배치, 좌우 반전으로 마주보게 설정) -->
            <div class="char-wrapper" id="char-서연" style="right: 60px; bottom: 20px; width: 260px; height: 320px; z-index: 3;">
                <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
            </div>
        </div>

        <!-- 4. 상황 설명 박스 -->
        <div class="situation-box">
            <div class="situation-title">월미전통정원의 정취</div>
            <div class="situation-text">
                월미도 MATHTOUR의 첫 시작.<br>
                도착한 정원의 고즈넉하고 아름다운 풍경에 두 사람 모두 넋을 잃고 감상합니다.
            </div>
        </div>

        <!-- 5. 대화창 UI -->
        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name">민우</div>
            <div id="dialogue-text">대사를 불러오는 중입니다...</div>
            <div class="click-prompt">▼ 클릭하여 계속</div>
        </div>

        <!-- 6. 이동 및 건너뛰기 버튼 -->
        <button id="btn-prev" class="btn-nav" onclick="goPrev()">이전</button>
        <button id="btn-skip" class="btn-nav" onclick="endDialogue()">건너뛰기</button>
        <button id="btn-next" class="btn-nav" onclick="goNext()" style="display: none;">다음</button>
    </div>

    <script>
        // 실제 퀴즈 단어(기초 문양: 꽃/격자/문자/기하학, 색상: 황토색/회색/백색/청색, 배치 방식: 가로형/격자형/지그재그형, 담장 재질: 흙담/돌담) 반영
        const dialogues = [
            {
                speaker: "민우",
                text: "서연아, 저기 늘어선 담장 좀 봐! 흙담이랑 돌담 위에 꾸며진 전통 문양이 정말 아름답지 않아?",
                target: "char-민우"
            },
            {
                speaker: "서연",
                text: "응! 황토색, 회색, 백색, 청색 같은 단정한 색상이 조화롭게 어우러져서 아주 고풍스러워.",
                target: "char-서연"
            },
            {
                speaker: "민우",
                text: "자세히 보니까 꽃, 격자, 문자, 기하학 같은 기초 문양들이 곳곳에 다채롭게 새겨져 있네.",
                target: "char-민우"
            },
            {
                speaker: "서연",
                text: "맞아! 그리고 가로형, 격자형, 지그재그형처럼 배치 방식도 여러 가지라서 보는 재미가 있어.",
                target: "char-서연"
            }
        ];

        let currentIndex = 0;

        function updateDialogue() {
            const current = dialogues[currentIndex];
            
            // 화자 이름 및 대사 업데이트
            document.getElementById("speaker-name").innerText = current.speaker;
            document.getElementById("dialogue-text").innerText = current.text;

            // 말하는 사람 강조 (말하지 않는 인물은 inactive 처리)
            document.querySelectorAll(".char-wrapper").forEach(wrapper => {
                if (wrapper.id === current.target) {
                    wrapper.classList.remove("inactive");
                } else {
                    wrapper.classList.add("inactive");
                }
            });
        }

        function advanceDialogue() {
            currentIndex++;
            if (currentIndex < dialogues.length) {
                updateDialogue();
            } else {
                endDialogue();
            }
        }

        function endDialogue() {
            // 대화창 닫기 및 버튼 전환
            document.getElementById("dialogue-box").style.display = "none";
            document.getElementById("btn-skip").style.display = "none";
            document.getElementById("btn-next").style.display = "block";

            // 모든 인물 비활성화 해제
            document.querySelectorAll(".char-wrapper").forEach(wrapper => {
                wrapper.classList.remove("inactive");
            });
        }

        function goPrev() {
            window.location.href = "index.html";
        }

        function goNext() {
            window.location.href = "a02.html";
        }

        // 페이지 로드 시 첫 대사 실행
        window.onload = function() {
            updateDialogue();
        };
    </script>
</body>
</html>
