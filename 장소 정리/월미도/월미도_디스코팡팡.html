<!-- 원본 크기: 560x540 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디스코팡팡</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .dpp-svg { display:block; width:100%; height:auto; }

  .dpp-base { fill:url(#dppBase); stroke:#3a3a3a; stroke-width:1; }
  .dpp-strut { stroke:#e8b800; stroke-width:10; }
  .dpp-strut-dark { stroke:#3a3a3a; stroke-width:10; }
  .dpp-disc { fill:url(#dppDisc); stroke:#5b3a8c; stroke-width:3; }
  .dpp-disc-rim { fill:none; stroke:#3a2360; stroke-width:4; opacity:0.5; }
  .dpp-hub { fill:url(#dppHub); stroke:#3a2360; stroke-width:2; }
  .dpp-sign-bg { fill:#e63946; stroke:#8c1f28; stroke-width:2; }
  .dpp-sign-text { fill:#fff; font-family:sans-serif; font-size:22px; font-weight:bold; text-anchor:middle; }
  .dpp-bulb-a { fill:#ffdd55; }
  .dpp-bulb-b { fill:#ff5577; }

  .dpp-bulb-a, .dpp-bulb-b { animation: dpp-blink 1.6s ease-in-out infinite; }
  .dpp-bulb-b { animation-delay: 0.8s; }
  @keyframes dpp-blink {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }
  .dpp-shine { animation: dpp-shine 5s ease-in-out infinite; transform-origin: 280px 258px; }
  @keyframes dpp-shine {
    0%,100% { opacity:0.10; }
    50% { opacity:0.28; }
  }
</style>
</head>

<defs>

    <stop offset="1" stop-color="#5b3a8c"/>

  <radialGradient id="dppHub" cx="0.4" cy="0.35" r="0.75">

    <stop offset="1" stop-color="#e8b800"/>
  </radialGradient>
  <linearGradient id="dppBase" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6a6a6a"/>
    <stop offset="1" stop-color="#3a3a3a"/>
  </linearGradient>
  <linearGradient id="dppSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b2350"/>
    <stop offset="1" stop-color="#5a4a86"/>

  <linearGradient id="dppFloor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4258"/>
    <stop offset="1" stop-color="#2e2a3a"/>

  <radialGradient id="dppGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
  </radialGradient>
</defs>
