<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>월미공원_산책로</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#0a180d" flood-opacity="0.4"/>
            </filter>

            <linearGradient id="stoneBase" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#9e9e9e"/>
                <stop offset="20%" stop-color="#757575"/>
                <stop offset="80%" stop-color="#424242"/>
                <stop offset="100%" stop-color="#212121"/>
            </linearGradient>

            <linearGradient id="woodMain" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a0653b"/>
                <stop offset="50%" stop-color="#6e4223"/>
                <stop offset="100%" stop-color="#422510"/>
            </linearGradient>

            <linearGradient id="woodPost" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#4a2a13"/>
                <stop offset="30%" stop-color="#84502a"/>
                <stop offset="70%" stop-color="#673d1f"/>
                <stop offset="100%" stop-color="#31190a"/>
            </linearGradient>

            <linearGradient id="forestLeafDark" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#2e5a1c"/>
                <stop offset="50%" stop-color="#1b3b10"/>
                <stop offset="100%" stop-color="#0b1e06"/>
            </linearGradient>

            <linearGradient id="forestLeafLight" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8bc34a"/>
                <stop offset="60%" stop-color="#4caf50"/>
                <stop offset="100%" stop-color="#2e7d32"/>
            </linearGradient>

            <linearGradient id="plateBronze" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#5d4037"/>
                <stop offset="50%" stop-color="#3e2723"/>
                <stop offset="100%" stop-color="#1b0000"/>
            </linearGradient>

            <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffe082"/>
                <stop offset="50%" stop-color="#ffb300"/>
                <stop offset="100%" stop-color="#ff8f00"/>
            </linearGradient>

            <pattern id="stoneTexture" width="30" height="30" patternUnits="userSpaceOnUse">
                <circle cx="5" cy="5" r="1.5" fill="#111" opacity="0.15"/>
                <circle cx="20" cy="18" r="2" fill="#fff" opacity="0.1"/>
                <path d="M 0,15 Q 15,10 30,15" stroke="#000" stroke-width="0.8" fill="none" opacity="0.15"/>
            </pattern>
        </defs>

        <g filter="url(#dropShadow)">

            <g id="sculpture-base">
                <polygon points="100,450 900,450 870,475 130,475" fill="#1a1a1a"/>
                <polygon points="120,410 880,410 900,450 100,450" fill="url(#stoneBase)"/>
                <polygon points="135,400 865,400 880,410 120,410" fill="#bdbdbd"/>
                <polygon points="120,410 880,410 900,450 100,450" fill="url(#stoneTexture)"/>
            </g>

            <g id="forest-arch">
                <path d="M 140,400 C 130,220 200,80 380,45 C 500,20 620,25 740,70 C 840,110 870,250 860,400 
                         C 810,400 810,230 710,130 C 600,60 480,60 380,95 C 250,140 190,260 180,400 Z" 
                      fill="url(#forestLeafDark)"/>

                <path d="M 135,400 C 120,280 160,180 250,120 C 290,140 310,190 280,230 C 230,280 220,350 210,400 Z" fill="url(#forestLeafLight)"/>
                <path d="M 160,250 C 140,190 210,120 280,100 C 310,130 290,180 240,200 Z" fill="#aed581" opacity="0.8"/>

                <path d="M 865,400 C 880,280 840,180 750,120 C 710,140 690,190 720,230 C 770,280 780,350 790,400 Z" fill="url(#forestLeafLight)"/>
                <path d="M 840,250 C 860,190 790,120 720,100 C 690,130 710,180 760,200 Z" fill="#7cb342" opacity="0.8"/>
            </g>

            <g id="deck-road">
                <polygon points="340,400 660,400 550,180 450,180" fill="url(#woodMain)"/>

                <g stroke="#2c1608" stroke-width="1.2" opacity="0.7">
                    <line x1="345" y1="390" x2="655" y2="390"/>
                    <line x1="355" y1="375" x2="645" y2="375"/>
                    <line x1="365" y1="360" x2="635" y2="360"/>
                    <line x1="375" y1="345" x2="625" y2="345"/>
                    <line x1="385" y1="330" x2="615" y2="330"/>
                    <line x1="395" y1="315" x2="605" y2="315"/>
                    <line x1="405" y1="300" x2="595" y2="300"/>
                    <line x1="413" y1="285" x2="587" y2="285"/>
                    <line x1="421" y1="270" x2="579" y2="270"/>
                    <line x1="428" y1="255" x2="572" y2="255"/>
                    <line x1="434" y1="240" x2="566" y2="240"/>
                    <line x1="440" y1="225" x2="560" y2="225"/>
                    <line x1="445" y1="210" x2="555" y2="210"/>
                    <line x1="448" y1="195" x2="552" y2="195"/>
                </g>

                <rect x="330" y="320" width="14" height="80" rx="2" fill="url(#woodPost)"/>
                <rect x="370" y="275" width="12" height="65" rx="2" fill="url(#woodPost)"/>
                <rect x="405" y="235" width="10" height="50" rx="2" fill="url(#woodPost)"/>
                <rect x="430" y="200" width="8" height="40" rx="2" fill="url(#woodPost)"/>
                <rect x="445" y="175" width="6" height="30" rx="2" fill="url(#woodPost)"/>

                <path d="M 330,335 L 450,185 M 330,355 L 450,200 M 330,375 L 450,215" stroke="#3e200b" stroke-width="4" stroke-linecap="round"/>
                <path d="M 330,333 L 450,183 M 330,353 L 450,198 M 330,373 L 450,213" stroke="#8d5229" stroke-width="1.8" stroke-linecap="round"/>

                <rect x="656" y="320" width="14" height="80" rx="2" fill="url(#woodPost)"/>
                <rect x="618" y="275" width="12" height="65" rx="2" fill="url(#woodPost)"/>
                <rect x="585" y="235" width="10" height="50" rx="2" fill="url(#woodPost)"/>
                <rect x="562" y="200" width="8" height="40" rx="2" fill="url(#woodPost)"/>
                <rect x="548" y="175" width="6" height="30" rx="2" fill="url(#woodPost)"/>

                <path d="M 670,335 L 550,185 M 670,355 L 550,200 M 670,375 L 550,215" stroke="#3e200b" stroke-width="4" stroke-linecap="round"/>
                <path d="M 670,333 L 550,183 M 670,353 L 550,198 M 670,373 L 550,213" stroke="#8d5229" stroke-width="1.8" stroke-linecap="round"/>

                <path d="M 665,330 Q 630,305 615,275 T 570,225 T 552,180" fill="none" stroke="#e6c687" stroke-width="3.5" stroke-dasharray="4,2"/>
            </g>

            <g id="sun-dappled" fill="#ffffff" opacity="0.25">
                <ellipse cx="480" cy="350" rx="25" ry="8"/>
                <ellipse cx="530" cy="310" rx="18" ry="5"/>
                <ellipse cx="450" cy="270" rx="15" ry="4"/>
                <ellipse cx="500" cy="220" rx="12" ry="3"/>
                <ellipse cx="510" cy="370" rx="30" ry="10"/>
            </g>

            <g id="title-plate">
                <rect x="320" y="70" width="16" height="110" rx="3" fill="url(#woodPost)"/>
                <rect x="664" y="70" width="16" height="110" rx="3" fill="url(#woodPost)"/>

                <rect x="300" y="70" width="400" height="75" rx="15" fill="url(#plateBronze)" stroke="url(#goldBorder)" stroke-width="4"/>
                <rect x="306" y="76" width="388" height="63" rx="10" fill="none" stroke="#a1887f" stroke-width="1.5" opacity="0.5"/>

                <text x="500" y="116" font-family="'Noto Sans KR', '맑은 고딕', sans-serif" font-weight="900" font-size="30" fill="url(#goldBorder)" text-anchor="middle" dominant-baseline="middle" letter-spacing="4" filter="drop-shadow(2px 2px 3px #000)">
                    월미산 산책로
                </text>
            </g>

        </g>
    </svg>
</body>
</html>
