<!-- 원본 크기: 360x640 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월미전망대</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .wmt-svg { display:block; width:100%; height:auto; }

  .wmt-shaft { fill:url(#wmtShaft); }
  .wmt-deck  { fill:url(#wmtGlass); stroke:#2c4a5c; stroke-width:1.5; }
  .wmt-deck-cap-top { fill:#dfeef4; }
  .wmt-deck-cap-bot { fill:#3a5a6c; }
  .wmt-shaft-cap-top { fill:#d9dee1; }
  .wmt-shaft-cap-bot { fill:#7d8890; }
  .wmt-roof { fill:#4a6a7c; }
  .wmt-spiral { stroke:#eef4f6; stroke-width:2; opacity:0.55; fill:none; }
  .wmt-mullion { stroke:#2c4a5c; stroke-width:1; opacity:0.6; }
  .wmt-base { fill:url(#wmtBase); stroke:#5c6a70; stroke-width:1; }
  .wmt-blink { animation: wmt-blink 2.4s ease-in-out infinite; }
  @keyframes wmt-blink { 0%,100% { opacity:0.45; } 50% { opacity:1; } }
  .wmt-cloud { animation: wmt-drift 15s ease-in-out infinite; }
  @keyframes wmt-drift { 0%,100% { transform: translateX(0);} 50% { transform: translateX(16px);} }
  .wmt-leaf { animation: wmt-sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes wmt-sway { 0%,100% { transform: rotate(-1.6deg);} 50% { transform: rotate(1.6deg);} }
</style>
</head>
<body>
<svg class="wmt-svg" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="월미전망대 일러스트">
<title>월미전망대</title>
<desc>월미산 정상의 원통형 월미전망대. 유리 전망층과 나선 계단, 뒤로 보이는 바다와 주변 숲.</desc>

<defs>
  <linearGradient id="wmtSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b5dcef"/>
    <stop offset="0.65" stop-color="#e2f1f6"/>
    <stop offset="1" stop-color="#f4f5e8"/>
  </linearGradient>
  <linearGradient id="wmtSea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4d8aa8"/>
    <stop offset="1" stop-color="#7fb3c8"/>
  </linearGradient>
  <linearGradient id="wmtShaft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8f9aa0"/>
    <stop offset="0.35" stop-color="#d6dde1"/>
    <stop offset="0.55" stop-color="#eef2f4"/>
    <stop offset="0.75" stop-color="#c0c9cf"/>
    <stop offset="1" stop-color="#8f9aa0"/>
  </linearGradient>
  <linearGradient id="wmtGlass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4f7f95"/>
    <stop offset="0.5" stop-color="#a9d3e2"/>
    <stop offset="1" stop-color="#4f7f95"/>
  </linearGradient>
  <linearGradient id="wmtBase" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9aa4aa"/>
    <stop offset="1" stop-color="#6d787e"/>
  </linearGradient>
  <linearGradient id="wmtHill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7fa85c"/>
    <stop offset="1" stop-color="#4e7838"/>
  </linearGradient>
  <radialGradient id="wmtTree" cx="0.36" cy="0.3" r="0.78">
    <stop offset="0" stop-color="#6fa855"/>
    <stop offset="1" stop-color="#376a32"/>
  </radialGradient>
</defs>

<!-- 하늘 -->
<rect x="0" y="0" width="360" height="470" fill="url(#wmtSky)"/>
<g class="wmt-cloud" fill="#ffffff" opacity="0.85">
  <ellipse cx="58" cy="86" rx="36" ry="13"/>
  <ellipse cx="86" cy="80" rx="24" ry="15"/>
  <ellipse cx="300" cy="142" rx="32" ry="11"/>
  <ellipse cx="324" cy="136" rx="20" ry="13"/>
</g>
<g fill="none" stroke="#63757e" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
  <path d="M40,178 q8,-7 16,0 q8,-7 16,0"/>
  <path d="M292,206 q7,-6 14,0 q7,-6 14,0"/>
</g>

<!-- 바다와 수평선 -->
<rect x="0" y="424" width="360" height="60" fill="url(#wmtSea)"/>
<g fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
  <path d="M14,440 C46,436 68,444 100,440"/>
  <path d="M240,452 C272,448 296,456 328,452"/>
  <path d="M60,466 C92,462 116,470 148,466"/>
</g>
<!-- 원경 섬 -->
<path d="M244,424 C266,410 288,414 306,404 C324,414 344,412 360,424 Z" fill="#8ba3ab" opacity="0.55"/>
<path d="M0,424 C20,412 40,416 58,408 L74,424 Z" fill="#8ba3ab" opacity="0.45"/>

<!-- 월미산 능선 -->
<path d="M0,478 C60,442 110,436 168,452 C226,468 292,446 360,470 L360,640 L0,640 Z" fill="url(#wmtHill)"/>
<g stroke="#3f6a2e" stroke-width="1.6" opacity="0.4" fill="none" stroke-linecap="round">
  <path d="M40,520 C48,506 44,496 54,484"/>
  <path d="M300,528 C308,514 304,504 314,492"/>
</g>

<!-- ════════ 첨탑/안테나 ════════ -->
<line x1="180" y1="18" x2="180" y2="62" stroke="#5c6a70" stroke-width="3"/>
<circle class="wmt-blink" cx="180" cy="16" r="5" fill="#c0392b"/>

<!-- ════════ 지붕(원뿔) ════════ -->
<polygon class="wmt-roof" points="180,62 108,120 252,120"/>
<ellipse cx="180" cy="120" rx="72" ry="12" fill="#3a5a6c"/>

<!-- ════════ 전망층(유리 원통) ════════ -->
<ellipse class="wmt-deck-cap-top" cx="180" cy="122" rx="70" ry="13"/>
<rect class="wmt-deck" x="110" y="122" width="140" height="105"/>
<ellipse class="wmt-deck-cap-bot" cx="180" cy="227" rx="70" ry="13"/>

<!-- 전망층 창 분할선 -->
<g class="wmt-mullion">
  <line x1="128" y1="122" x2="128" y2="227"/>
  <line x1="146" y1="122" x2="146" y2="227"/>
  <line x1="164" y1="122" x2="164" y2="227"/>
  <line x1="180" y1="122" x2="180" y2="227"/>
  <line x1="196" y1="122" x2="196" y2="227"/>
  <line x1="214" y1="122" x2="214" y2="227"/>
  <line x1="232" y1="122" x2="232" y2="227"/>
  <line x1="110" y1="160" x2="250" y2="160"/>
  <line x1="110" y1="195" x2="250" y2="195"/>
</g>
<!-- 전망층 안 관람객 -->
<g fill="#2c4a5c" opacity="0.75">
  <g transform="translate(150,186)"><circle cx="0" cy="-9" r="3.4"/><path d="M-3.4,-5 L3.4,-5 L2.8,5 L-2.8,5 Z"/></g>
  <g transform="translate(206,186)"><circle cx="0" cy="-9" r="3.4"/><path d="M-3.4,-5 L3.4,-5 L2.8,5 L-2.8,5 Z"/></g>
</g>
<rect x="105" y="230" width="150" height="6" fill="#2c4a5c"/>

<!-- ════════ 몸체(타워 샤프트) ════════ -->
<ellipse class="wmt-shaft-cap-top" cx="180" cy="238" rx="38" ry="8"/>
<rect class="wmt-shaft" x="142" y="238" width="76" height="290"/>
<ellipse class="wmt-shaft-cap-bot" cx="180" cy="528" rx="38" ry="8"/>

<!-- 나선 계단 라인 -->
<g class="wmt-spiral">
  <path d="M142,500 Q180,485 218,470"/>
  <path d="M142,455 Q180,440 218,425"/>
  <path d="M142,410 Q180,395 218,380"/>
  <path d="M142,365 Q180,350 218,335"/>
  <path d="M142,320 Q180,305 218,290"/>
  <path d="M142,275 Q180,262 218,248"/>
</g>

<!-- 계단실 채광창 -->
<g fill="#3a5a6c" opacity="0.7">
  <rect x="172" y="270" width="16" height="20" rx="2"/>
  <rect x="172" y="340" width="16" height="20" rx="2"/>
  <rect x="172" y="410" width="16" height="20" rx="2"/>
  <rect x="172" y="480" width="16" height="20" rx="2"/>
</g>

<!-- ════════ 하단 받침/출입부 ════════ -->
<ellipse cx="180" cy="578" rx="104" ry="18" fill="#3f5f2c" opacity="0.3"/>
<polygon class="wmt-base" points="120,528 240,528 260,570 100,570"/>
<rect x="162" y="536" width="36" height="34" rx="3" fill="#2c4a5c"/>
<g stroke="#5c6a70" stroke-width="2" opacity="0.7">
  <line x1="132" y1="546" x2="128" y2="566"/>
  <line x1="228" y1="546" x2="232" y2="566"/>
</g>

<!-- 진입 광장 -->
<ellipse cx="180" cy="592" rx="128" ry="26" fill="#d8d0b8" opacity="0.9"/>
<g fill="none" stroke="#bcb298" stroke-width="1.6" opacity="0.8">
  <ellipse cx="180" cy="592" rx="98" ry="20"/>
  <ellipse cx="180" cy="592" rx="64" ry="13"/>
</g>

<!-- 주변 나무 -->
<g class="wmt-leaf">
  <rect x="42" y="524" width="11" height="42" rx="3" fill="#6a4a2c"/>
  <circle cx="47" cy="510" r="28" fill="url(#wmtTree)"/>
  <circle cx="28" cy="524" r="17" fill="url(#wmtTree)"/>
  <circle cx="66" cy="524" r="17" fill="url(#wmtTree)"/>
</g>
<g class="wmt-leaf" style="animation-delay:.6s">
  <rect x="308" y="534" width="10" height="38" rx="3" fill="#6a4a2c"/>
  <circle cx="313" cy="522" r="24" fill="url(#wmtTree)"/>
  <circle cx="296" cy="534" r="15" fill="url(#wmtTree)"/>
  <circle cx="330" cy="534" r="15" fill="url(#wmtTree)"/>
</g>

<!-- 방문객 -->
<g fill="#4a5560">
  <g transform="translate(112,592)">
    <circle cx="0" cy="-16" r="5"/><path d="M-5,-10 L5,-10 L4,4 L-4,4 Z"/>
    <line x1="-3" y1="4" x2="-4" y2="14" stroke="#4a5560" stroke-width="2.6"/>
    <line x1="3" y1="4" x2="4" y2="14" stroke="#4a5560" stroke-width="2.6"/>
  </g>
  <g transform="translate(132,596)">
    <circle cx="0" cy="-13" r="4.2"/><path d="M-4.2,-8 L4.2,-8 L3.4,4 L-3.4,4 Z"/>
    <line x1="-2.4" y1="4" x2="-3.2" y2="12" stroke="#4a5560" stroke-width="2.4"/>
    <line x1="2.4" y1="4" x2="3.2" y2="12" stroke="#4a5560" stroke-width="2.4"/>
  </g>
  <g transform="translate(250,600)">
    <circle cx="0" cy="-15" r="4.6"/><path d="M-4.6,-9 L4.6,-9 L3.8,4 L-3.8,4 Z"/>
    <line x1="-2.8" y1="4" x2="-3.6" y2="13" stroke="#4a5560" stroke-width="2.4"/>
    <line x1="2.8" y1="4" x2="3.6" y2="13" stroke="#4a5560" stroke-width="2.4"/>
  </g>
</g>

<!-- 안내판 -->
<g transform="translate(66,600)">
  <rect x="-2" y="0" width="5" height="26" fill="#7d7462"/>
  <rect x="-24" y="-20" width="48" height="22" rx="3" fill="#f2ecdc" stroke="#8a8272" stroke-width="1.8"/>
  <g stroke="#8a8272" stroke-width="1.8" stroke-linecap="round">
    <line x1="-16" y1="-13" x2="16" y2="-13"/>
    <line x1="-16" y1="-6" x2="6" y2="-6"/>
  </g>
</g>
</svg>
</body>
</html>
