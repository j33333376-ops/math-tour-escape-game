<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월미도 MATHTOUR - D05</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1818;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            color: #2d3748;
        }

        /* 16:9 메인 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background: radial-gradient(circle at center, #2c2825 0%, #151312 100%);
            border: 3px solid #d4af37;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* 근대 개항기 세피아/양피지 질감 오버레이 */
        .stage-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(20, 10, 5, 0.4) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* 상단 스테이지 표시바 */
        #stage-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(20, 15, 10, 0.85);
            border: 2px solid #d4af37;
            padding: 6px 24px;
            border-radius: 20px;
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* 무대 요소 레이아웃 */
        #stage-area {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* 에셋 Wrapper (월미도_디스코팡팡) */
        .asset-wrapper {
            position: absolute;
            z-index: 1;
        }

        /* 캐릭터 Wrapper 공통 */
        .char-wrapper {
            position: absolute;
            z-index: 3;
            transition: filter 0.3s ease;
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        /* 대화창 UI (유형 2) */
        #dialogue-box {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            height: 140px;
            background-color: rgba(15, 12, 10, 0.88);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 18px 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.7), inset 0 0 15px rgba(212, 175, 55, 0.15);
            z-index: 10;
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #speaker-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            background: rgba(140, 48, 48, 0.6);
            padding: 3px 12px;
            border: 1px solid #d4af37;
            border-radius: 4px;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 17px;
            color: #ffffff;
            line-height: 1.6;
            letter-spacing: -0.02em;
            margin-top: 8px;
            word-break: keep-all;
        }

        #dialogue-prompt {
            align-self: flex-end;
            font-size: 13px;
            color: #d4af37;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 이동 / 조작 버튼 */
        .btn-nav {
            position: absolute;
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            z-index: 15;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        .btn-nav:active {
            transform: scale(0.97);
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
            bottom: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="stage-overlay"></div>

    <!-- 상단 스테이지 표시바 -->
    <div id="stage-header">월미도 MATHTOUR - 디스코팡팡</div>

    <!-- 무대 에셋 및 캐릭터 배치 -->
    <div id="stage-area">
        <!-- 배경 에셋: 월미도_디스코팡팡 (가로형 배경 조형물, W=1000, H=500 기준 s=0.75) -->
        <div class="asset-wrapper" style="left: 158px; bottom: 80px; width: 750px; height: 375px; overflow: hidden;">
            <iframe src="월미도_디스코팡팡.html" scrolling="no" style="border:0; width:1000px; height:500px; transform:scale(0.75); transform-origin:top left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장인물: 서연 (좌측) -->
        <div class="char-wrapper" id="char-서연" style="left: 220px; bottom: 130px; width: 260px; height: 320px; overflow: visible;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장인물: 민우 (우측, 좌우 반전으로 서연을 바라봄) -->
        <div class="char-wrapper" id="char-민우" style="left: 580px; bottom: 130px; width: 260px; height: 320px; overflow: visible;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>
    </div>

    <!-- 대화창 UI -->
    <div id="dialogue-box" onclick="advanceDialogue()">
        <div>
            <div id="speaker-container">
                <span id="speaker-name">서연</span>
            </div>
            <p id="dialogue-text">민우야 수학문제를 빨리 풀어줘서 고마워!</p>
        </div>
        <div id="dialogue-prompt">▶ 화면을 클릭하여 다음으로</div>
    </div>

    <!-- 네비게이션 버튼 -->
    <button id="btn-prev" class="btn-nav hidden" onclick="location.href='D04.html'">이전</button>
    <button id="btn-skip" class="btn-nav" onclick="finishDialogue()">건너뛰기</button>
    <button id="btn-next" class="btn-nav hidden" onclick="location.href='index.html'">End</button>
</div>

<script>
    // 대화 데이터 정의
    const dialogues = [
        {
            speaker: "서연",
            text: "민우야 수학문제를 빨리 풀어줘서 고마워!",
            target: "char-서연"
        },
        {
            speaker: "민우",
            text: "별거 아니야! 덕분에 디스코팡팡도 신나게 탈 수 있게 됐잖아.",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "월미도 수학여행 정말 즐거웠어. 다음에도 함께 탐방 오자!",
            target: "char-서연"
        },
        {
            speaker: "민우",
            text: "응! 다음 수학 탐방도 기대되는걸?",
            target: "char-민우"
        }
    ];

    let currentIndex = 0;

    function updateDialogue() {
        if (currentIndex < dialogues.length) {
            const current = dialogues[currentIndex];
            document.getElementById('speaker-name').innerText = current.speaker;
            document.getElementById('dialogue-text').innerText = current.text;

            // 캐릭터 활성화/비활성화 처리 (.inactive)
            document.querySelectorAll('.char-wrapper').forEach(wrapper => {
                if (wrapper.id === current.target) {
                    wrapper.classList.remove('inactive');
                } else {
                    wrapper.classList.add('inactive');
                }
            });
        } else {
            finishDialogue();
        }
    }

    function advanceDialogue() {
        currentIndex++;
        if (currentIndex < dialogues.length) {
            updateDialogue();
        } else {
            finishDialogue();
        }
    }

    function finishDialogue() {
        // 대화창 숨기기
        const dialogueBox = document.getElementById('dialogue-box');
        if (dialogueBox) dialogueBox.style.display = 'none';

        // 건너뛰기 버튼 숨기기
        const btnSkip = document.getElementById('btn-skip');
        if (btnSkip) btnSkip.style.display = 'none';

        // 모든 캐릭터 원래 밝기로 복구
        document.querySelectorAll('.char-wrapper').forEach(wrapper => {
            wrapper.classList.remove('inactive');
        });

        // 네비게이션 버튼 표시
        document.getElementById('btn-prev').classList.remove('hidden');
        document.getElementById('btn-next').classList.remove('hidden');
    }

    // 초기 실행
    window.onload = function() {
        updateDialogue();
    };
</script>

</body>
</html>
