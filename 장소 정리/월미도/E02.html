<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월미도 MATHTOUR - E02</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f5f0e6;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    #game-container {
      position: relative;
      width: min(100vw - 24px, 1066px);
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #231a17;
      border: 2px solid #d4af37;
      box-shadow: 0 14px 38px rgba(35, 26, 23, 0.38);
    }

    #background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      user-select: none;
      pointer-events: none;
    }

    #vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(20, 12, 8, 0.22), transparent 35%, rgba(20, 12, 8, 0.28)),
        radial-gradient(circle at center, transparent 48%, rgba(35, 18, 14, 0.44) 100%);
    }

    #stage-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      min-width: 310px;
      padding: 8px 22px;
      text-align: center;
      color: #f7e7a8;
      background: rgba(24, 16, 13, 0.72);
      border: 1px solid #d4af37;
      border-radius: 4px;
      font-family: 'Nanum Myeongjo', serif;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-shadow: 0 1px 3px #000;
      backdrop-filter: blur(3px);
    }

    .char-wrapper {
      position: absolute;
      z-index: 3;
      width: 260px;
      height: 320px;
      overflow: visible;
      filter: brightness(1);
      transition: filter .2s, transform 1.8s ease-in, opacity 1.8s ease-in;
      transform-origin: bottom center;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    #char-민우 {
      left: 85px;
      bottom: 68px;
    }

    #char-서연 {
      right: 85px;
      bottom: 68px;
    }

    .char-wrapper iframe {
      border: 0;
      width: 260px;
      height: 320px;
      pointer-events: none;
      display: block;
    }

    #char-민우 iframe {
      transform: scale(1);
      transform-origin: bottom left;
    }

    #char-서연 iframe {
      transform: scale(1) scaleX(-1);
      transform-origin: bottom left;
    }

    .walk-away-left {
      transform: translate(330px, -78px) scale(0.34);
      opacity: 0.76;
    }

    .walk-away-right {
      transform: translate(-330px, -78px) scale(0.34);
      opacity: 0.76;
    }

    #dialogue-box {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 15;
      width: calc(100% - 120px);
      min-height: 130px;
      padding: 18px 24px 18px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.74);
      border: 1px solid #d4af37;
      border-radius: 6px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    #speaker-name {
      margin-bottom: 8px;
      color: #f3ce62;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0 1px 3px #000;
    }

    #dialogue-text {
      min-height: 58px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: clamp(15px, 2vw, 21px);
      line-height: 1.6;
      letter-spacing: -0.02em;
      white-space: pre-line;
      text-shadow: 0 1px 2px #000;
    }

    #click-hint {
      position: absolute;
      right: 16px;
      bottom: 9px;
      color: #e4c96c;
      font-size: 12px;
      animation: blink 1.15s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }

    .btn-nav {
      position: absolute;
      z-index: 20;
      padding: 10px 24px;
      color: white;
      background: #8c3030;
      border: 1px solid #d4af37;
      border-radius: 4px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,.25);
      transition: background .2s, transform .2s;
    }

    .btn-nav:hover {
      background: #661f1f;
      transform: translateY(-1px);
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
      display: none;
    }

    #btn-next,
    #btn-skip {
      right: 20px;
      bottom: 20px;
    }

    #btn-next {
      display: none;
    }

    #btn-skip {
      display: block;
    }

    #ending-caption {
      position: absolute;
      left: 50%;
      top: 48%;
      z-index: 13;
      transform: translate(-50%, -50%);
      display: none;
      padding: 14px 24px;
      color: #fff7d3;
      background: rgba(40, 21, 18, 0.72);
      border: 1px solid #d4af37;
      border-radius: 4px;
      font-family: 'Nanum Myeongjo', serif;
      font-size: clamp(17px, 2.2vw, 25px);
      font-weight: 700;
      letter-spacing: 0.03em;
      text-align: center;
      text-shadow: 0 1px 4px #000;
      opacity: 0;
      transition: opacity .8s ease;
    }

    #ending-caption.show {
      display: block;
      opacity: 1;
    }

    @media (max-width: 760px) {
      #stage-bar {
        top: 9px;
        min-width: 240px;
        padding: 6px 14px;
        font-size: 13px;
      }

      #char-민우 { left: 16px; bottom: 54px; }
      #char-서연 { right: 16px; bottom: 54px; }

      .char-wrapper {
        transform: scale(.72);
        transform-origin: bottom center;
      }

      .walk-away-left {
        transform: translate(220px, -45px) scale(0.24);
      }

      .walk-away-right {
        transform: translate(-220px, -45px) scale(0.24);
      }

      #dialogue-box {
        width: calc(100% - 28px);
        min-height: 106px;
        padding: 12px 16px;
        bottom: 12px;
      }

      #speaker-name { font-size: 15px; margin-bottom: 4px; }
      #dialogue-text { font-size: 13px; min-height: 44px; }
      .btn-nav { padding: 8px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main id="game-container" aria-label="월미도 MATHTOUR 대화 장면">
    <img id="background-image" src="E02.jpg" alt="월미도 바이킹 배경" />
    <div id="vignette"></div>

    <div id="stage-bar">월미도 MATHTOUR · 반복되는 움직임</div>

    <div class="char-wrapper" id="char-민우">
      <iframe src="등장인물_민우.html" scrolling="no" title="민우"></iframe>
    </div>

    <div class="char-wrapper inactive" id="char-서연">
      <iframe src="등장인물_서연.html" scrolling="no" title="서연"></iframe>
    </div>

    <div id="ending-caption">두 사람은 바이킹의 움직임을 살펴보기 위해 앞으로 걸어갔다.</div>

    <section id="dialogue-box" onclick="advanceDialogue()" role="button" tabindex="0" aria-label="대화창, 클릭하면 다음 대사">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
      <div id="click-hint">클릭하여 계속 ▸</div>
    </section>

    <button class="btn-nav" id="btn-prev" type="button" onclick="goTo('E01.html')">이전</button>
    <button class="btn-nav" id="btn-next" type="button" onclick="goTo('E03.html')">다음</button>
    <button class="btn-nav" id="btn-skip" type="button" onclick="skipDialogue(event)">건너뛰기</button>
  </main>

  <script>
    const dialogues = [
      {
        speaker: '민우',
        text: '우와, 재미있겠다!\n그런데 바이킹은 일정한 움직임이 반복되잖아. 저런 운동을 뭐라고 했더라?',
        target: 'char-민우'
      },
      {
        speaker: '서연',
        text: '주기운동?',
        target: 'char-서연'
      },
      {
        speaker: '민우',
        text: '맞아, 주기운동.\n높이가 일정하게 올라갔다 내려갔다 하니까, 그걸 그래프로 나타내 볼 수 있을까?',
        target: 'char-민우'
      },
      {
        speaker: '서연',
        text: '오, 좋아! 직접 움직임을 살펴보면서 그래프로 나타내 보자.',
        target: 'char-서연'
      }
    ];

    let currentIndex = 0;
    let dialogueFinished = false;

    const dialogueBox = document.getElementById('dialogue-box');
    const speakerName = document.getElementById('speaker-name');
    const dialogueText = document.getElementById('dialogue-text');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSkip = document.getElementById('btn-skip');
    const minwoo = document.getElementById('char-민우');
    const seoyeon = document.getElementById('char-서연');
    const endingCaption = document.getElementById('ending-caption');

    function renderDialogue() {
      const current = dialogues[currentIndex];
      speakerName.textContent = current.speaker;
      dialogueText.textContent = current.text;

      document.querySelectorAll('.char-wrapper').forEach(character => {
        character.classList.add('inactive');
      });

      const activeCharacter = document.getElementById(current.target);
      if (activeCharacter) activeCharacter.classList.remove('inactive');
    }

    function advanceDialogue() {
      if (dialogueFinished) return;

      currentIndex += 1;
      if (currentIndex < dialogues.length) {
        renderDialogue();
      } else {
        finishDialogue();
      }
    }

    function finishDialogue() {
      if (dialogueFinished) return;
      dialogueFinished = true;

      dialogueBox.style.display = 'none';
      btnSkip.style.display = 'none';

      minwoo.classList.remove('inactive');
      seoyeon.classList.remove('inactive');

      endingCaption.classList.add('show');

      requestAnimationFrame(() => {
        minwoo.classList.add('walk-away-left');
        seoyeon.classList.add('walk-away-right');
      });

      setTimeout(() => {
        btnPrev.style.display = 'block';
        btnNext.style.display = 'block';
      }, 1650);
    }

    function skipDialogue(event) {
      event.stopPropagation();
      finishDialogue();
    }

    function goTo(url) {
      window.location.href = url;
    }

    dialogueBox.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        advanceDialogue();
      }
    });

    renderDialogue();
  </script>
</body>
</html>
