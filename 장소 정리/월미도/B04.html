<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월미도 MATHTOUR - B04</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            color: #2d3748;
        }

        /* 16:9 비율 고정 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #d4af37;
        }

        /* 배경 이미지 */
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 상단 스테이지 표시바 */
        #stage-bar {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.75);
            border: 1px solid #d4af37;
            padding: 8px 18px;
            border-radius: 4px;
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* 무대 및 캐릭터 배치 영역 */
        #stage-area {
            position: absolute;
            inset: 0;
            z-index: 3;
        }

        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            transition: filter 0.2s ease;
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        /* 대화창 UI (유형 2) */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 240px); /* 좌우 이동 버튼 공간 확보 */
            height: 130px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 16px 22px;
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 18px;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            color: #ffffff;
            line-height: 1.6;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        .click-prompt {
            position: absolute;
            right: 16px;
            bottom: 12px;
            font-size: 12px;
            color: #d4af37;
            opacity: 0.8;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 공통 버튼 디자인 및 네비게이션 */
        .btn-nav {
            position: absolute;
            z-index: 20;
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        .btn-nav:active {
            transform: scale(0.96);
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
            bottom: 20px;
        }

        #btn-next {
            display: none; /* 대화 완료 후 표시 */
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 배경 이미지 -->
    <img src="월미도전망대.png" alt="월미도전망대" class="bg-img">

    <!-- 스테이지 상단 표시바 -->
    <div id="stage-bar">월미도 MATHTOUR : 전망대에서의 소감</div>

    <!-- 무대 에셋 및 등장인물 레이어 -->
    <div id="stage-area">
        <!-- 등장인물: 민우 (좌측 배치) -->
        <div class="char-wrapper" id="char-민우" style="left: 180px; bottom: 60px;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장인물: 서연 (우측 배치, 좌우 반전으로 마주보기) -->
        <div class="char-wrapper" id="char-서연" style="right: 180px; bottom: 60px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>
    </div>

    <!-- 대화창 UI -->
    <div id="dialogue-box" onclick="advanceDialogue()">
        <div id="speaker-name">민우</div>
        <div id="dialogue-text">대사가 출력됩니다.</div>
        <div class="click-prompt">클릭하여 계속 ▼</div>
    </div>

    <!-- 이동 및 건너뛰기 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="goPrev()">이전</button>
    <button class="btn-nav" id="btn-skip" onclick="skipDialogue()">건너뛰기</button>
    <button class="btn-nav" id="btn-next" onclick="goNext()">End</button>
</div>

<script>
    // URL 설정
    const PREV_URL = "B03.html";
    const NEXT_URL = "index.html";

    // 대화 스크립트 데이터
    const dialogues = [
        {
            speaker: "민우",
            text: "휴, 전망대에 올라오니 바다 바람이 정말 시원하다! 놀이기구 배치를 좌표평면에 옮겨서 풀었던 게 생각보다 훨씬 인상 깊었어.",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "맞아. 단순한 놀이공원 시설물인 줄 알았는데, 동선이랑 편의시설 위치까지 수학적으로 계산되어 설치된 거였잖아.",
            target: "char-서연"
        },
        {
            speaker: "민우",
            text: "응! 우리가 수업 시간에 배운 선분의 내분 개념이 실제로 이런 시설물 위치 설계에 활용된다는 걸 눈으로 확인하니까 신기해.",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "실생활 속에서 수학을 직접 적용해보니 공식도 더 쉽게 이해되는 기분이야. 다음 장소로 이동해볼까? 또 어떤 흥미로운 수학이 기다릴지 기대돼!",
            target: "char-서연"
        }
    ];

    let currentIndex = 0;

    // 대화 및 캐릭터 하이라이트 갱신
    function updateDialogue() {
        if (currentIndex < dialogues.length) {
            const current = dialogues[currentIndex];
            document.getElementById('speaker-name').innerText = current.speaker;
            document.getElementById('dialogue-text').innerText = current.text;

            // 말하는 인물 하이라이트 (나머지는 .inactive 적용)
            const charWrappers = document.querySelectorAll('.char-wrapper');
            charWrappers.forEach(wrapper => {
                if (wrapper.id === current.target) {
                    wrapper.classList.remove('inactive');
                } else {
                    wrapper.classList.add('inactive');
                }
            });
        } else {
            finishDialogue();
        }
    }

    // 클릭 시 다음 대화 진행
    function advanceDialogue() {
        currentIndex++;
        if (currentIndex < dialogues.length) {
            updateDialogue();
        } else {
            finishDialogue();
        }
    }

    // 대화 완료 처리
    function finishDialogue() {
        document.getElementById('dialogue-box').style.display = 'none';
        document.getElementById('btn-skip').style.display = 'none';
        document.getElementById('btn-next').style.display = 'block';

        // 모든 캐릭터 밝기 복구
        const charWrappers = document.querySelectorAll('.char-wrapper');
        charWrappers.forEach(wrapper => {
            wrapper.classList.remove('inactive');
        });
    }

    // 건너뛰기 버튼
    function skipDialogue() {
        finishDialogue();
    }

    // 이전 버튼
    function goPrev() {
        window.location.href = PREV_URL;
    }

    // 다음(End) 버튼
    function goNext() {
        window.location.href = NEXT_URL;
    }

    // 페이지 로드 시 초기화
    window.onload = function() {
        updateDialogue();
    };
</script>

</body>
</html>
