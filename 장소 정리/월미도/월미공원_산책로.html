<!-- 원본 크기: 900x420 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월미산 둘레길 산책로</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .wmp-svg { display:block; width:100%; height:auto; }

  .wmp-tread { fill:url(#wmpWood); stroke:#7a4a26; stroke-width:1; }
  .wmp-riser { fill:#7a4a26; }
  .wmp-plankline { stroke:#8a5a34; stroke-width:1; opacity:0.5; }
  .wmp-rail { stroke:#6b4226; stroke-width:3; fill:none; }
  .wmp-post { fill:#6b4226; }
  .wmp-tree-trunk { fill:#5a4028; }
  .wmp-tree-dark { fill:#3f7a4a; }
  .wmp-tree-light { fill:#57975f; opacity:0.9; }
  .wmp-bush { fill:#4a8a52; }
</style>
</head>
<body>
<svg class="wmp-svg" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="월미산 둘레길 산책로 일러스트">
<title>월미산 둘레길 산책로</title>
<desc>경사진 나무 데크 산책로와 계단, 난간, 주변 나무.</desc>

<defs>
  <linearGradient id="wmpWood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8ab6f"/>
    <stop offset="1" stop-color="#b8814a"/>
  </linearGradient>
</defs>

<!-- ════════ 좌측 큰 나무(가까이) ════════ -->
<g>
  <rect class="wmp-tree-trunk" x="24" y="300" width="16" height="80"/>
  <ellipse class="wmp-tree-dark" cx="32" cy="270" rx="55" ry="45"/>
  <ellipse class="wmp-tree-light" cx="18" cy="255" rx="30" ry="24"/>
  <ellipse class="wmp-tree-light" cx="55" cy="280" rx="24" ry="20"/>
</g>
<g class="wmp-bush">
  <ellipse cx="60" cy="386" rx="30" ry="14"/>
  <ellipse cx="95" cy="392" rx="22" ry="10"/>
</g>

<!-- ════════ 계단형 목재 데크 (좌하 → 우상 상승) ════════ -->
<g>
  <!-- step 0 -->
  <rect class="wmp-riser" x="70" y="366" width="90" height="20"/>
  <rect class="wmp-tread" x="70" y="352" width="90" height="16"/>
  <!-- step 1 -->
  <rect class="wmp-riser" x="150" y="346" width="90" height="20"/>
  <rect class="wmp-tread" x="150" y="332" width="90" height="16"/>
  <!-- step 2 -->
  <rect class="wmp-riser" x="230" y="326" width="90" height="20"/>
  <rect class="wmp-tread" x="230" y="312" width="90" height="16"/>
  <!-- step 3 (평평한 데크 구간) -->
  <rect class="wmp-riser" x="310" y="306" width="160" height="20"/>
  <rect class="wmp-tread" x="310" y="292" width="160" height="16"/>
  <!-- step 4 -->
  <rect class="wmp-riser" x="470" y="286" width="90" height="20"/>
  <rect class="wmp-tread" x="470" y="272" width="90" height="16"/>
  <!-- step 5 -->
  <rect class="wmp-riser" x="550" y="266" width="90" height="20"/>
  <rect class="wmp-tread" x="550" y="252" width="90" height="16"/>
  <!-- step 6 -->
  <rect class="wmp-riser" x="630" y="246" width="90" height="20"/>
  <rect class="wmp-tread" x="630" y="232" width="90" height="16"/>
  <!-- step 7 -->
  <rect class="wmp-riser" x="710" y="226" width="90" height="20"/>
  <rect class="wmp-tread" x="710" y="212" width="90" height="16"/>
  <!-- step 8 -->
  <rect class="wmp-riser" x="790" y="206" width="80" height="20"/>
  <rect class="wmp-tread" x="790" y="192" width="80" height="16"/>
</g>

<!-- 판자 결 세로선 -->
<g class="wmp-plankline">
  <line x1="90"  y1="352" x2="90"  y2="368"/>
  <line x1="110" y1="352" x2="110" y2="368"/>
  <line x1="130" y1="352" x2="130" y2="368"/>
  <line x1="170" y1="332" x2="170" y2="348"/>
  <line x1="190" y1="332" x2="190" y2="348"/>
  <line x1="210" y1="332" x2="210" y2="348"/>
  <line x1="250" y1="312" x2="250" y2="328"/>
  <line x1="270" y1="312" x2="270" y2="328"/>
  <line x1="290" y1="312" x2="290" y2="328"/>
  <line x1="330" y1="292" x2="330" y2="308"/>
  <line x1="360" y1="292" x2="360" y2="308"/>
  <line x1="390" y1="292" x2="390" y2="308"/>
  <line x1="420" y1="292" x2="420" y2="308"/>
  <line x1="450" y1="292" x2="450" y2="308"/>
  <line x1="490" y1="272" x2="490" y2="288"/>
  <line x1="510" y1="272" x2="510" y2="288"/>
  <line x1="530" y1="272" x2="530" y2="288"/>
  <line x1="570" y1="252" x2="570" y2="268"/>
  <line x1="590" y1="252" x2="590" y2="268"/>
  <line x1="610" y1="252" x2="610" y2="268"/>
  <line x1="650" y1="232" x2="650" y2="248"/>
  <line x1="670" y1="232" x2="670" y2="248"/>
  <line x1="690" y1="232" x2="690" y2="248"/>
  <line x1="730" y1="212" x2="730" y2="228"/>
  <line x1="750" y1="212" x2="750" y2="228"/>
  <line x1="770" y1="212" x2="770" y2="228"/>
  <line x1="810" y1="192" x2="810" y2="208"/>
  <line x1="830" y1="192" x2="830" y2="208"/>
  <line x1="850" y1="192" x2="850" y2="208"/>
</g>

<!-- ════════ 난간 (뒤쪽) ════════ -->
<g>
  <g class="wmp-post">
    <rect x="66" y="326" width="6" height="30"/>
    <rect x="146" y="306" width="6" height="30"/>
    <rect x="226" y="286" width="6" height="30"/>
    <rect x="306" y="266" width="6" height="30"/>
    <rect x="466" y="246" width="6" height="30"/>
    <rect x="546" y="226" width="6" height="30"/>
    <rect x="626" y="206" width="6" height="30"/>
    <rect x="706" y="186" width="6" height="30"/>
    <rect x="786" y="166" width="6" height="30"/>
  </g>
  <path class="wmp-rail" d="M69,330 L149,310 L229,290 L309,270 L469,250 L549,230 L629,210 L709,190 L789,170"/>
  <path class="wmp-rail" d="M69,346 L149,326 L229,306 L309,286 L469,266 L549,246 L629,226 L709,206 L789,186" stroke-width="2"/>
</g>

<!-- ════════ 안내 팻말 ════════ -->
<g transform="translate(360,258)">
  <rect x="-4" y="0" width="8" height="34" fill="#6b4226"/>
  <rect x="-32" y="-24" width="64" height="26" rx="3" fill="#e8d9b8" stroke="#8a5a34" stroke-width="1.5"/>
  <text x="0" y="-6" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a3620" font-weight="bold">월미산 둘레길</text>
</g>

<!-- ════════ 중경/원경 나무 (계단 주변, 크기 점점 작게) ════════ -->
<g>
  <rect class="wmp-tree-trunk" x="418" y="255" width="10" height="40"/>
  <ellipse class="wmp-tree-dark" cx="423" cy="240" rx="34" ry="28"/>
  <ellipse class="wmp-tree-light" cx="412" cy="230" rx="18" ry="14"/>
</g>
<g>
  <rect class="wmp-tree-trunk" x="668" y="196" width="8" height="32"/>
  <ellipse class="wmp-tree-dark" cx="672" cy="182" rx="26" ry="22"/>
  <ellipse class="wmp-tree-light" cx="663" cy="174" rx="14" ry="11"/>
</g>
<g>
  <rect class="wmp-tree-trunk" x="860" y="150" width="7" height="28"/>
  <ellipse class="wmp-tree-dark" cx="863" cy="138" rx="20" ry="17"/>
  <ellipse class="wmp-tree-light" cx="856" cy="132" rx="11" ry="9"/>
</g>
</svg>
</body>
</html>
