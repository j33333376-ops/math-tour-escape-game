<!-- 원본 크기: 340x900 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아라뱃길 아라타워</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  *,*::before,*::after{ box-sizing:border-box; }
  .atw-wrap{ width:100%; max-width:340px; margin:0 auto; }
  .atw-svg{ display:block; width:100%; height:auto; }

  .atw-light{ animation: atw-blink 1.6s ease-in-out infinite; }
  @keyframes atw-blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .atw-shine{ animation: atw-shine 5s ease-in-out infinite; }
  @keyframes atw-shine{ 0%,100%{opacity:0.10;} 50%{opacity:0.28;} }
</style>
</head>
<body>
<div class="atw-wrap">
<svg class="atw-svg" viewBox="0 0 340 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="아라뱃길 아라타워 전망대">
<title>아라타워</title>
<defs>
  <linearGradient id="atw-body" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#aebac2"/>
    <stop offset="0.5" stop-color="#eef3f6"/>
    <stop offset="1" stop-color="#8fa0aa"/>
  </linearGradient>
  <linearGradient id="atw-glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7fb6e6"/>
    <stop offset="1" stop-color="#356f9c"/>
  </linearGradient>
  <linearGradient id="atw-base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d2d7da"/>
    <stop offset="1" stop-color="#a7adb2"/>
  </linearGradient>
</defs>

<!-- 안테나 / 항공등 -->
<line x1="170" y1="20" x2="170" y2="70" stroke="#8a8f94" stroke-width="5" stroke-linecap="round"/>
<circle class="atw-light" cx="170" cy="16" r="5" fill="#ff3b3b"/>

<!-- 상부 포드 -->
<polygon points="150,70 190,70 196,150 144,150" fill="url(#atw-body)" stroke="#8b969e" stroke-width="1"/>
<g fill="url(#atw-glass)">
  <rect x="152" y="86" width="14" height="18"/>
  <rect x="174" y="86" width="14" height="18"/>
  <rect x="152" y="112" width="14" height="18"/>
  <rect x="174" y="112" width="14" height="18"/>
</g>

<!-- 전망 데크 (원판) -->
<path d="M60,150 Q170,104 280,150 L286,196 Q170,232 54,196 Z" fill="url(#atw-body)" stroke="#8b969e" stroke-width="1.5"/>
<path d="M60,150 Q170,104 280,150 L280,164 Q170,124 60,164 Z" fill="#f4f7f9" opacity="0.55"/>
<g fill="url(#atw-glass)">
  <rect x="80" y="168" width="24" height="26" transform="skewY(-3)"/>
  <rect x="112" y="176" width="24" height="26" transform="skewY(-1)"/>
  <rect x="146" y="180" width="24" height="26"/>
  <rect x="180" y="180" width="24" height="26"/>
  <rect x="214" y="176" width="24" height="26" transform="skewY(1)"/>
  <rect x="246" y="168" width="24" height="26" transform="skewY(3)"/>
</g>
<ellipse class="atw-shine" cx="170" cy="150" rx="95" ry="22" fill="#ffffff" opacity="0.15"/>

<!-- 지지 기둥(샤프트) -->
<polygon points="130,222 210,222 235,800 105,800" fill="url(#atw-body)" stroke="#8b969e" stroke-width="1"/>

<!-- 창문 그리드 -->
<g fill="url(#atw-glass)">
  <rect x="132" y="245" width="18" height="26"/><rect x="161" y="245" width="18" height="26"/><rect x="190" y="245" width="18" height="26"/>
  <rect x="132" y="290" width="18" height="26"/><rect x="161" y="290" width="18" height="26"/><rect x="190" y="290" width="18" height="26"/>
  <rect x="132" y="335" width="18" height="26"/><rect x="161" y="335" width="18" height="26"/><rect x="190" y="335" width="18" height="26"/>
  <rect x="132" y="380" width="18" height="26"/><rect x="161" y="380" width="18" height="26"/><rect x="190" y="380" width="18" height="26"/>
  <rect x="132" y="425" width="18" height="26"/><rect x="161" y="425" width="18" height="26"/><rect x="190" y="425" width="18" height="26"/>
  <rect x="132" y="470" width="18" height="26"/><rect x="161" y="470" width="18" height="26"/><rect x="190" y="470" width="18" height="26"/>
  <rect x="132" y="515" width="18" height="26"/><rect x="161" y="515" width="18" height="26"/><rect x="190" y="515" width="18" height="26"/>
  <rect x="132" y="560" width="18" height="26"/><rect x="161" y="560" width="18" height="26"/><rect x="190" y="560" width="18" height="26"/>
  <rect x="132" y="605" width="18" height="26"/><rect x="161" y="605" width="18" height="26"/><rect x="190" y="605" width="18" height="26"/>
  <rect x="132" y="650" width="18" height="26"/><rect x="161" y="650" width="18" height="26"/><rect x="190" y="650" width="18" height="26"/>
  <rect x="132" y="695" width="18" height="26"/><rect x="161" y="695" width="18" height="26"/><rect x="190" y="695" width="18" height="26"/>
  <rect x="132" y="740" width="18" height="26"/><rect x="161" y="740" width="18" height="26"/><rect x="190" y="740" width="18" height="26"/>
</g>
<!-- 좌측 그림자 스트라이프 -->
<polygon points="130,222 150,222 128,800 105,800" fill="#5f6b74" opacity="0.18"/>
<polygon points="210,222 190,222 213,800 235,800" fill="#ffffff" opacity="0.20"/>

<!-- 표지판 -->
<rect x="108" y="772" width="126" height="28" rx="3" fill="#264a70" opacity="0.9"/>
<text x="171" y="792" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">아라타워</text>

<!-- 기단부 -->
<polygon points="90,800 250,800 282,862 58,862" fill="url(#atw-base)" stroke="#93999e" stroke-width="1"/>
<path d="M150,862 L150,822 Q170,802 190,822 L190,862 Z" fill="#33424c"/>
<rect x="112" y="822" width="18" height="40" fill="url(#atw-glass)" opacity="0.7"/>
<rect x="210" y="822" width="18" height="40" fill="url(#atw-glass)" opacity="0.7"/>

<!-- 가로수 -->
<g>
  <rect x="34" y="838" width="6" height="26" fill="#6a4a2a"/>
  <circle cx="37" cy="826" r="16" fill="#4c8a4a"/>
  <circle cx="30" cy="832" r="10" fill="#5fa15a" opacity="0.85"/>
</g>
<g>
  <rect x="300" y="838" width="6" height="26" fill="#6a4a2a"/>
  <circle cx="303" cy="826" r="16" fill="#4c8a4a"/>
  <circle cx="310" cy="832" r="10" fill="#5fa15a" opacity="0.85"/>
</g>

<!-- 바닥 그림자 -->
<ellipse cx="170" cy="868" rx="150" ry="12" fill="#000000" opacity="0.12"/>
</svg>
</div>
</body>
</html>
