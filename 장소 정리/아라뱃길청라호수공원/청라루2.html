<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheongnaroo - Night View</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0e17; }
        svg { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#050811" />
                <stop offset="70%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#1e1b4b" />
            </linearGradient>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
                <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#0a0e17" stop-opacity="0"/>
            </radialGradient>
        </defs>

        <!-- Night Sky -->
        <rect width="1200" height="500" fill="url(#nightSky)" />

        <!-- Moon -->
        <circle cx="950" cy="120" r="40" fill="#fef3c7" opacity="0.9"/>
        <circle cx="950" cy="120" r="60" fill="#fef3c7" opacity="0.15"/>

        <!-- Dark City Silhouette with Glowing Windows -->
        <g fill="#020617">
            <rect x="80" y="180" width="80" height="320" />
            <rect x="180" y="120" width="100" height="380" />
            <rect x="300" y="200" width="70" height="300" />
            <rect x="820" y="150" width="90" height="350" />
            <rect x="930" y="220" width="80" height="280" />
        </g>
        <!-- Windows (City Lights) -->
        <g fill="#fde047" opacity="0.6">
            <circle cx="100" cy="220" r="2"/><circle cx="120" cy="250" r="2"/><circle cx="140" cy="280" r="2"/>
            <circle cx="210" cy="160" r="2"/><circle cx="240" cy="190" r="2"/><circle cx="220" cy="240" r="2"/>
            <circle cx="850" cy="200" r="2"/><circle cx="880" cy="230" r="2"/><circle cx="860" cy="290" r="2"/>
        </g>

        <!-- Water -->
        <rect y="480" width="1200" height="320" fill="#030712" />

        <!-- Pavilion Light Aura -->
        <ellipse cx="700" cy="420" rx="280" ry="150" fill="url(#glow)" />

        <!-- Bridge -->
        <rect x="250" y="520" width="350" height="20" fill="#1e293b" />
        <line x1="250" y1="520" x2="600" y2="520" stroke="#f59e0b" stroke-width="3" />

        <!-- Cheongnaroo Platform -->
        <polygon points="520,540 880,540 910,580 490,580" fill="#1e293b" />
        <rect x="500" y="525" width="400" height="18" fill="#334155" />

        <!-- Illuminated Pillars -->
        <g fill="#b91c1c">
            <rect x="540" y="400" width="16" height="125" />
            <rect x="590" y="400" width="16" height="125" />
            <rect x="640" y="400" width="16" height="125" />
            <rect x="690" y="400" width="16" height="125" />
            <rect x="740" y="400" width="16" height="125" />
            <rect x="790" y="400" width="16" height="125" />
            <rect x="840" y="400" width="16" height="125" />
        </g>

        <!-- Inner Golden Warm Glow -->
        <rect x="545" y="410" width="300" height="100" fill="#fbbf24" opacity="0.4" />

        <!-- Dancheong Beam (Lit Up) -->
        <rect x="525" y="390" width="350" height="16" fill="#047857"/>
        <rect x="525" y="395" width="350" height="4" fill="#f59e0b"/>

        <!-- Roofs -->
        <path d="M 500,400 Q 700,375 900,400 L 870,370 Q 700,355 530,370 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
        <path d="M 450,330 Q 700,280 950,330 Q 880,260 700,240 Q 520,260 450,330 Z" fill="#020617" stroke="#f59e0b" stroke-width="2" />

        <!-- Water Shimmer & Reflection -->
        <ellipse cx="700" cy="620" rx="200" ry="60" fill="url(#glow)" opacity="0.7"/>
        <path d="M 470,590 Q 700,600 930,590" stroke="#f59e0b" stroke-width="4" opacity="0.6" fill="none"/>
        <path d="M 520,620 Q 700,630 880,620" stroke="#fbbf24" stroke-width="3" opacity="0.4" fill="none"/>
        <path d="M 580,650 Q 700,660 820,650" stroke="#f59e0b" stroke-width="2" opacity="0.3" fill="none"/>
    </svg>
</body>
</html>
