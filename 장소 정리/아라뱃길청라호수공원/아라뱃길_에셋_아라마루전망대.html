<!-- 원본 크기: 500x750 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아라마루 전망대</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .amt-svg { display:block; width:100%; height:auto; }
  .amt-blink { animation: amt-blink 2.2s ease-in-out infinite; }
  @keyframes amt-blink { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
</style>
</head>
<body>
<svg class="amt-svg" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="아라마루 전망대">
<title>아라마루 전망대</title>
<desc>아라뱃길 아라마루 전망대. 유리 바닥 전망 데크가 있는 탑.</desc>
<defs>
  <linearGradient id="amtCol" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6b7a86"/><stop offset="0.35" stop-color="#c8d4dc"/>
    <stop offset="0.6" stop-color="#9aa8b4"/><stop offset="1" stop-color="#5f6c78"/>
  </linearGradient>
  <linearGradient id="amtDeck" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dfe8ee"/><stop offset="1" stop-color="#8f9eaa"/>
  </linearGradient>
  <linearGradient id="amtGlass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfeaf5" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#7fb0c8" stop-opacity="0.65"/>
  </linearGradient>
</defs>
<ellipse cx="250" cy="716" rx="196" ry="22" fill="#3a4650" opacity="0.22"/>
<!-- 첨탑 -->
<line x1="250" y1="112" x2="250" y2="40" stroke="#8f9aa4" stroke-width="7" stroke-linecap="round"/>
<circle class="amt-blink" cx="250" cy="34" r="8" fill="#e6403a"/>
<!-- 지붕 -->
<path d="M60,150 L440,150 L392,112 L108,112 Z" fill="#2c5f9c" stroke="#183f6e" stroke-width="5"/>
<path d="M108,112 L392,112 L356,86 L144,86 Z" fill="#3f7fc4" stroke="#183f6e" stroke-width="4"/>
<!-- 전망 데크 -->
<rect x="46" y="150" width="408" height="16" rx="8" fill="#8f9eaa" stroke="#5a6772" stroke-width="4"/>
<rect x="66" y="166" width="368" height="96" rx="10" fill="url(#amtGlass)" stroke="#5a7f92" stroke-width="5"/>
<g stroke="#ffffff" stroke-width="3" opacity="0.7">
  <line x1="132" y1="166" x2="132" y2="262"/><line x1="198" y1="166" x2="198" y2="262"/>
  <line x1="264" y1="166" x2="264" y2="262"/><line x1="330" y1="166" x2="330" y2="262"/>
  <line x1="396" y1="166" x2="396" y2="262"/>
  <line x1="66" y1="214" x2="434" y2="214"/>
</g>
<g fill="#ffffff" opacity="0.35">
  <path d="M78,258 L118,170 L146,170 L106,258 Z"/>
  <path d="M276,258 L316,170 L344,170 L304,258 Z"/>
</g>
<!-- 관람객 -->
<g fill="#3f5566" opacity="0.7">
  <g transform="translate(160,240)"><circle cy="-16" r="8"/><path d="M-8,-9 L8,-9 L7,4 L-7,4 Z"/></g>
  <g transform="translate(300,240)"><circle cy="-14" r="7"/><path d="M-7,-8 L7,-8 L6,4 L-6,4 Z"/></g>
</g>
<!-- 데크 하부 -->
<rect x="46" y="262" width="408" height="20" rx="8" fill="url(#amtDeck)" stroke="#5a6772" stroke-width="4"/>
<path d="M96,282 L404,282 L360,326 L140,326 Z" fill="#7d8e9a" stroke="#4f5c66" stroke-width="4"/>
<!-- 유리 바닥 돌출부 -->
<path d="M404,296 L482,296 L470,330 L392,330 Z" fill="url(#amtGlass)" stroke="#5a7f92" stroke-width="4"/>
<path d="M96,296 L18,296 L30,330 L108,330 Z" fill="url(#amtGlass)" stroke="#5a7f92" stroke-width="4"/>
<!-- 기둥 -->
<path d="M206,326 L294,326 L282,676 L218,676 Z" fill="url(#amtCol)" stroke="#4f5c66" stroke-width="5"/>
<g stroke="#5f6c78" stroke-width="3" opacity="0.55">
  <line x1="230" y1="330" x2="226" y2="670"/><line x1="270" y1="330" x2="274" y2="670"/>
</g>
<!-- 나선 계단 -->
<g fill="none" stroke="#c8d4dc" stroke-width="6" opacity="0.9">
  <path d="M206,380 C240,364 268,392 294,376"/>
  <path d="M206,436 C240,420 268,448 294,432"/>
  <path d="M206,492 C240,476 268,504 294,488"/>
  <path d="M206,548 C240,532 268,560 294,544"/>
  <path d="M206,604 C240,588 268,616 294,600"/>
</g>
<!-- 창 -->
<g fill="#3f7fc4" opacity="0.7">
  <rect x="236" y="356" width="28" height="26" rx="4"/>
  <rect x="236" y="466" width="28" height="26" rx="4"/>
  <rect x="236" y="576" width="28" height="26" rx="4"/>
</g>
<!-- 기단 -->
<path d="M150,676 L350,676 L378,716 L122,716 Z" fill="#8f9eaa" stroke="#4f5c66" stroke-width="5"/>
<rect x="214" y="640" width="72" height="40" rx="4" fill="#2c5f9c" stroke="#183f6e" stroke-width="3.4"/>
<!-- 데크 광택 -->
<path d="M78,180 L78,250" stroke="#ffffff" stroke-width="8" opacity="0.5" stroke-linecap="round"/>
</svg>
</body>
</html>
