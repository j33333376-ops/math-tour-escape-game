<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아라뱃길·청라호수공원 MATHTOUR - E02</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');
    @import url('https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
    }

    /* 게임 컨테이너 (16:9 비율) */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background: linear-gradient(180deg, #e0f7fa 0%, #b2ebf2 100%);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
    }

    /* 상단 상태 표시바 */
    #top-bar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      padding: 10px 20px;
      background: rgba(0, 119, 190, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(64, 224, 208, 0.4);
      border-radius: 30px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #1a365d;
      font-family: 'NanumSquareRound', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .stage-title {
      color: #0077be;
      text-shadow: 0 0 2px rgba(255, 255, 255, 0.8);
    }

    /* 에셋 - 청라호수공원 횡단교량 (배경 스케일) */
    .asset-bridge {
      position: absolute;
      left: 33px;
      bottom: 60px;
      width: 1000px;
      height: 500px;
      overflow: hidden;
      z-index: 1;
    }

    /* 캐릭터 영역 */
    .char-wrapper {
      position: absolute;
      width: 260px;
      height: 320px;
      overflow: visible;
      z-index: 3;
      transition: filter 0.2s;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    #char-민우 {
      left: 150px;
      bottom: 30px;
    }

    #char-서연 {
      right: 150px;
      bottom: 30px;
    }

    /* 유형 2 대화창 */
    #dialogue-box {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      height: 140px;
      background: rgba(26, 54, 93, 0.85);
      border: 2px solid #40e0d0;
      border-radius: 16px;
      padding: 20px 25px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      z-index: 10;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    #speaker-name {
      font-family: 'NanumSquareRound', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #40e0d0;
      margin-bottom: 8px;
      display: inline-block;
      padding-bottom: 2px;
      border-bottom: 2px solid #40e0d0;
    }

    #dialogue-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: #ffffff;
      word-break: keep-all;
    }

    .click-indicator {
      position: absolute;
      right: 20px;
      bottom: 15px;
      font-size: 0.85rem;
      color: #40e0d0;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    /* 네비게이션 버튼 공통 */
    .btn-nav {
      position: absolute;
      padding: 10px 24px;
      background-color: #0077be;
      color: #ffffff;
      border: 1px solid #40e0d0;
      border-radius: 50px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      z-index: 11;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }

    .btn-nav:hover {
      background-color: #40e0d0;
      color: #1a365d;
      border-color: #0077be;
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
      display: none; /* 요청서: 이전 버튼 없음/비활성화 */
    }

    #btn-next {
      right: 20px;
      bottom: 20px;
      display: none;
    }

    #btn-skip {
      right: 20px;
      bottom: 20px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 상단 프로그레스/타이틀 바 -->
  <div id="top-bar">
    <span class="stage-title">아라뱃길·청라호수공원 MATHTOUR</span>
    <span>STAGE : 횡단교량 탐사</span>
  </div>

  <!-- 에셋: 청라호수공원 횡단교량 -->
  <div class="asset-bridge">
    <iframe src="청라호수공원_횡단교량.html" scrolling="no" style="border:0; width:1000px; height:500px; transform:scale(1); transform-origin:top left; pointer-events:none;"></iframe>
  </div>

  <!-- 등장인물: 민우 -->
  <div class="char-wrapper" id="char-민우">
    <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
  </div>

  <!-- 등장인물: 서연 -->
  <div class="char-wrapper" id="char-서연">
    <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
  </div>

  <!-- 대화창 -->
  <div id="dialogue-box" onclick="advanceDialogue()">
    <div id="speaker-name">민우</div>
    <div id="dialogue-text">대사가 로딩되는 중입니다...</div>
    <div class="click-indicator">▼ 클릭하여 계속</div>
  </div>

  <!-- 이동 버튼 -->
  <button id="btn-prev" class="btn-nav">이전</button>
  <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
  <button id="btn-next" class="btn-nav" onclick="goToNext()">다음</button>
</div>

<script>
  // 대화 데이터 구성
  const dialogues = [
    {
      speaker: "민우",
      text: "횡단 교량의 거대한 아치 구조는 정말 아름다운 포물선 형태를 띠고 있네!",
      target: "char-민우"
    },
    {
      speaker: "서연",
      text: "맞아! 이 아름다운 아치 곡선을 수학적인 이차함수의 그래프로 나타내보면 재미있을 것 같아.",
      target: "char-서연"
    },
    {
      speaker: "민우",
      text: "좋은 생각이야! 드론 비행 경로를 직선으로 설정해서 조절해보자.",
      target: "char-민우"
    },
    {
      speaker: "서연",
      text: "케이블인 이차함수에 딱 접하는 촬영 궤도를 확보하면, 직선과 이차함수의 위치관계도 완벽히 파악할 수 있겠어!",
      target: "char-서연"
    }
  ];

  let currentIndex = 0;

  function updateDialogue() {
    const current = dialogues[currentIndex];
    document.getElementById("speaker-name").innerText = current.speaker;
    document.getElementById("dialogue-text").innerText = current.text;

    // 말하는 캐릭터만 활성화, 나머지는 .inactive 처리
    const minwoo = document.getElementById("char-민우");
    const seoyeon = document.getElementById("char-서연");

    if (current.target === "char-민우") {
      minwoo.classList.remove("inactive");
      seoyeon.classList.add("inactive");
    } else if (current.target === "char-서연") {
      seoyeon.classList.remove("inactive");
      minwoo.classList.add("inactive");
    }
  }

  function advanceDialogue() {
    currentIndex++;
    if (currentIndex < dialogues.length) {
      updateDialogue();
    } else {
      endDialogue();
    }
  }

  function skipDialogue() {
    endDialogue();
  }

  function endDialogue() {
    // 대화창, 건너뛰기 버튼 숨김
    document.getElementById("dialogue-box").style.display = "none";
    document.getElementById("btn-skip").style.display = "none";

    // 캐릭터 원상복구
    document.getElementById("char-민우").classList.remove("inactive");
    document.getElementById("char-서연").classList.remove("inactive");

    // 다음 버튼 활성화
    document.getElementById("btn-next").style.display = "block";
  }

  function goToNext() {
    window.location.href = "E03.html";
  }

  // 초기 시작
  window.onload = function() {
    updateDialogue();
  };
</script>

</body>
</html>
