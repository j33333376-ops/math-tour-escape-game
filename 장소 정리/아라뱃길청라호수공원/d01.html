<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아라뱃길·청라호수공원 MATHTOUR</title>
<style>
  /* [공통 UI/UX] 폰트 임포트 */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');
  @import url('https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css');

  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #fdfbf7; /* 옅은 모래색 */
    font-family: 'Noto Sans KR', sans-serif;
  }

  /* 16:9 비율 유지 & 에메랄드 오션 스타일 */
  #game-container {
    position: relative;
    width: 100%;
    max-width: 1066px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background-color: #e0f7fa; /* 아이스 블루 */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  }

  /* 스테이지 상단 표시바 (글래스모피즘) - d02와 통일된 디자인 */
  .stage-bar {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 119, 190, 0.2);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(64, 224, 208, 0.5);
    border-radius: 30px;
    padding: 10px 30px;
    font-family: 'NanumSquareRound', sans-serif;
    color: #1a365d;
    font-size: 1.2rem;
    font-weight: 700;
    z-index: 20;
    text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
  }

  /* 배경 음악분수 꽉 찬 화면 및 카메라 움직임 연출 */
  .fountain-bg-wrapper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
  }

  .fountain-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1000px;
    height: 500px;
    border: 0;
    margin-top: -250px;
    margin-left: -500px;
    pointer-events: none;
    transform: scale(1.25);
    animation: dynamicCamera 3s ease-in-out forwards;
  }

  @keyframes dynamicCamera {
    0% { transform: scale(1.25) translate(0, 0); }
    20% { transform: scale(1.4) translate(-20px, 15px); }
    45% { transform: scale(1.45) translate(15px, -20px) rotate(1deg); }
    75% { transform: scale(1.35) translate(-10px, -10px); }
    100% { transform: scale(1.25) translate(0, 0); }
  }

  /* 음악분수 빛 연출 오버레이 */
  .fountain-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    background: linear-gradient(to top, rgba(64, 224, 208, 0.3), transparent);
    animation: lightShow 3s ease-in-out forwards;
  }

  @keyframes lightShow {
    0% { opacity: 0; background: linear-gradient(to top, rgba(0, 119, 190, 0.4), transparent); }
    30% { opacity: 1; background: linear-gradient(to top, rgba(64, 224, 208, 0.5), transparent); }
    60% { opacity: 1; background: linear-gradient(to top, rgba(255, 255, 255, 0.4), transparent); }
    90% { opacity: 1; background: linear-gradient(to top, rgba(0, 119, 190, 0.3), transparent); }
    100% { opacity: 0; }
  }

  .music-note {
    position: absolute;
    font-size: 28px;
    color: #0077be;
    opacity: 0;
    z-index: 2;
    animation: floatUp 2.5s ease-in forwards;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.8); opacity: 1; }
    100% { transform: translateY(-120px) scale(1.3); opacity: 0; }
  }

  /* 유형 2: 대화창 UI */
  #dialogue-box {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    background: rgba(26, 54, 93, 0.85); /* 짙은 네이비 반투명 */
    border: 1px solid #40e0d0; /* 에메랄드 민트 얇은 테두리 */
    border-radius: 15px;
    padding: 25px 35px;
    box-sizing: border-box;
    z-index: 15;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    transition: opacity 0.3s ease;
    display: none; /* 연출 시간동안 숨김 */
  }

  #speaker-name {
    font-family: 'NanumSquareRound', sans-serif;
    color: #40e0d0;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 10px;
  }

  #dialogue-text {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1.15rem;
    line-height: 1.6;
    letter-spacing: -0.02em;
  }

  /* 화자 강조 연출용 (어둡게 처리) */
  .char-wrapper {
    transition: filter 0.2s ease;
    opacity: 0; /* 처음에는 보이지 않음 */
  }
  .char-wrapper.visible {
    opacity: 1; /* 연출 이후 등장 */
  }
  .char-wrapper.inactive {
    filter: brightness(0.55);
  }

  /* 공통 버튼 디자인 */
  .btn-nav {
    position: absolute;
    background-color: #0077be;
    color: #ffffff;
    border: 1px solid #40e0d0;
    border-radius: 50px;
    padding: 12px 30px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    z-index: 20;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0, 119, 190, 0.3);
  }

  .btn-nav:hover {
    background-color: #40e0d0;
    color: #1a365d;
    box-shadow: 0 6px 15px rgba(64, 224, 208, 0.4);
  }

  /* 버튼 위치 고정 및 초기 표시 상태 */
  #btn-prev { left: 20px; bottom: 20px; display: none; }
  #btn-next { right: 20px; bottom: 20px; display: none; }
  #btn-skip { right: 20px; bottom: 120px; display: none; }

</style>
</head>
<body>

<div id="game-container">
  <!-- 상단 표시바 (d02와 통일된 스타일) -->
  <div class="stage-bar">아라뱃길·청라호수공원 MATHTOUR</div>

  <!-- 꽉 찬 화면의 음악분수 및 카메라 무빙 연출 -->
  <div class="fountain-bg-wrapper">
    <iframe class="fountain-bg" src="청라호수공원_음악분수.html" scrolling="no"></iframe>
  </div>

  <!-- 음악분수 조명 및 음악 연출 효과 -->
  <div class="fountain-overlay"></div>
  <div class="music-note" style="left: 38%; bottom: 250px; animation-delay: 0s;">♪</div>
  <div class="music-note" style="left: 55%; bottom: 300px; animation-delay: 0.5s;">♫</div>
  <div class="music-note" style="left: 45%; bottom: 220px; animation-delay: 1.0s;">♬</div>
  <div class="music-note" style="left: 62%; bottom: 280px; animation-delay: 1.5s;">♪</div>

  <!-- 등장 인물: 민우 (화면 좌측) -->
  <div class="char-wrapper" id="char-민우" style="position:absolute; left:150px; bottom:20px; width:260px; height:320px; overflow:visible; z-index:3;">
    <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
  </div>

  <!-- 등장 인물: 서연 (화면 우측, 민우를 향해 반전) -->
  <div class="char-wrapper" id="char-서연" style="position:absolute; left:650px; bottom:20px; width:260px; height:320px; overflow:visible; z-index:3;">
    <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
  </div>

  <!-- 유형 2: 대화창 UI -->
  <div id="dialogue-box" onclick="advanceDialogue()">
    <div id="speaker-name"></div>
    <div id="dialogue-text"></div>
  </div>

  <!-- 하단 네비게이션 버튼 -->
  <button id="btn-prev" class="btn-nav" onclick="goPrev()">이전</button>
  <button id="btn-next" class="btn-nav" onclick="goNext()">다음</button>
  <button id="btn-skip" class="btn-nav" onclick="endDialogue()">건너뛰기</button>
</div>

<script>
  // 대사 스크립트 배열
  const dialogues = [
    { speaker: "", target: "", text: "청라호수공원 음악분수에서 화려한 조명과 함께 시원한 물줄기가 춤을 추기 시작한다." },
    { speaker: "민우", target: "char-민우", text: "우와! 물줄기가 음악에 맞춰 춤을 추는 것 같아! 정말 멋지다." },
    { speaker: "서연", target: "char-서연", text: "응! 조명 색깔도 계속 변해서 에메랄드빛 바다 속에 있는 기분이야." }
  ];

  let currentIndex = 0;
  const dialogueBox = document.getElementById('dialogue-box');
  const speakerName = document.getElementById('speaker-name');
  const dialogueText = document.getElementById('dialogue-text');
  const btnSkip = document.getElementById('btn-skip');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  
  const charWrappers = [
    document.getElementById('char-민우'),
    document.getElementById('char-서연')
  ];

  // 3초간 음악분수 줌인/줌아웃 카메라 무빙 및 조명 연출 후 대화 시작
  window.onload = () => {
    setTimeout(() => {
      dialogueBox.style.display = 'block';
      btnSkip.style.display = 'block';
      advanceDialogue();
    }, 3000);
  };

  function advanceDialogue() {
    if (currentIndex < dialogues.length) {
      const current = dialogues[currentIndex];
      
      // 첫 번째 나레이션 출력 직후 캐릭터들 등장
      if (currentIndex === 1) {
        charWrappers.forEach(wrapper => wrapper.classList.add('visible'));
      }

      if (current.speaker === "") {
        speakerName.style.display = "none";
      } else {
        speakerName.style.display = "block";
        speakerName.textContent = current.speaker;
      }
      
      dialogueText.textContent = current.text;
      
      if (current.target !== "") {
        charWrappers.forEach(wrapper => {
          if (wrapper.id === current.target) {
            wrapper.classList.remove('inactive');
          } else {
            wrapper.classList.add('inactive');
          }
        });
      } else {
        charWrappers.forEach(wrapper => wrapper.classList.remove('inactive'));
      }
      
      currentIndex++;
    } else {
      endDialogue();
    }
  }

  function endDialogue() {
    dialogueBox.style.display = 'none';
    btnSkip.style.display = 'none';
    btnPrev.style.display = 'block';
    btnNext.style.display = 'block';
    
    charWrappers.forEach(wrapper => {
      wrapper.classList.add('visible');
      wrapper.classList.remove('inactive');
    });
  }

  function goPrev() {
    window.location.href = 'D01.html';
  }

  function goNext() {
    window.location.href = 'D02.html';
  }
</script>

</body>
</html>
