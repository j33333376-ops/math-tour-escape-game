<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아라뱃길·청라호수공원 MATHTOUR</title>
    
    <!-- 폰트 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        water: '#0ea5e9',    
                        deep: '#0369a1',     
                        foam: '#ffffff',     
                        splash: '#e0f2fe',   
                        cyan: '#22d3ee',     
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        title: ['"NanumSquareRound"', 'sans-serif'],
                        mono: ['"Nanum Gothic Coding"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        /* 기본 화면 설정 */
        body {
            margin: 0; padding: 0;
            background-color: #f8fafc;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 16:9 게임 컨테이너 */
        #game-container {
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #7dd3fc 0%, #0284c7 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
        }

        /* 스테이지 상단 표시바 */
        #top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            font-family: 'NanumSquareRound', sans-serif;
            font-size: 20px; font-weight: bold;
            color: #ffffff;
            z-index: 50;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            text-shadow: 0 2px 4px rgba(3, 105, 161, 0.5);
        }

        /* 공통 이동 버튼 */
        .btn-nav {
            position: absolute; bottom: 20px;
            background-color: #ffffff;
            color: #0ea5e9;
            border: 2px solid #0ea5e9;
            border-radius: 50px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px; font-weight: bold;
            line-height: 1.6; letter-spacing: -0.02em;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-nav:hover {
            background-color: #0ea5e9;
            color: #ffffff;
            box-shadow: 0 6px 12px rgba(14, 165, 233, 0.3);
            transform: translateY(-2px);
        }
        #btn-prev { left: 20px; }
        #btn-next { right: 20px; display: none; }

        /* 수학 퀴즈 컨테이너 */
        .quiz-container {
            position: absolute;
            top: 70px; left: 40px; right: 40px; bottom: 80px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 3px solid #7dd3fc;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(3, 105, 161, 0.3);
            display: flex;
            overflow: hidden;
            z-index: 10;
        }

        /* 커스텀 스크롤바 */
        .scrollable-content { overflow-y: auto; }
        .scrollable-content::-webkit-scrollbar { width: 6px; }
        .scrollable-content::-webkit-scrollbar-track { background: transparent; }
        .scrollable-content::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 3px; }

        /* 입력창 스타일 규칙 */
        input[type="number"] {
            background-color: transparent;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            font-family: 'Nanum Gothic Coding', monospace;
        }
        input[type="number"]:focus {
            outline: none;
            background-color: #ffffff;
            box-shadow: inset 0 0 0 2px #0ea5e9;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 상단 표시바 -->
        <div id="top-bar">아라폭포 안전 구역 설정 - 2단계</div>

        <!-- 퀴즈 컨테이너 -->
        <div class="quiz-container flex-col md:flex-row">
            
            <!-- 왼쪽: 좌표평면 시각화 영역 -->
            <div class="w-full md:w-1/2 lg:w-3/5 bg-splash/50 p-6 flex flex-col items-center justify-center border-r border-water/20 relative">
                <h2 class="text-xl font-bold text-deep mb-4 bg-white px-5 py-2 rounded-xl shadow-sm border border-cyan font-title">
                    📍 시각화된 안전 구역
                </h2>
                <div class="w-full max-w-[400px] aspect-square bg-white border-2 border-water rounded-2xl overflow-hidden shadow-inner relative flex justify-center items-center">
                    <canvas id="mathCanvas" width="400" height="400" class="w-full h-full max-w-[400px] max-h-[400px]"></canvas>
                </div>
            </div>

            <!-- 오른쪽: 미션 컨트롤 영역 -->
            <div class="w-full md:w-1/2 lg:w-2/5 p-8 flex flex-col justify-center bg-white scrollable-content">
                <h1 class="text-2xl lg:text-3xl font-bold text-deep mb-4 font-title">원의 방정식 수치 확인</h1>
                <p class="text-deep/80 mb-6 leading-relaxed font-sans text-sm lg:text-base">
                    앞서 설정한 구역을 수식으로 완벽하게 증명해 봅시다.<br>
                    두 점 <strong class="text-water font-bold">C(0, 0)</strong>과 <strong class="text-emerald-600 font-bold">Q(6, 8)</strong> 사이의 거리 공식을 사용하여 반지름의 제곱(<span class="font-serif italic font-bold text-deep">r²</span>) 값을 계산하여 입력하세요.
                </p>

                <!-- 입력 영역 -->
                <div class="bg-splash p-6 rounded-2xl border border-water/30 mb-6 shadow-sm">
                    <label class="block text-sm font-bold text-deep mb-3 font-sans">반지름의 제곱 값 입력</label>
                    <div class="flex items-center rounded-xl bg-white border border-water/40 overflow-hidden">
                        <span class="pl-4 pr-2 py-3 text-water font-serif italic text-xl font-bold bg-transparent select-none">
                            r² = 
                        </span>
                        <input type="number" id="rSquareInput" class="flex-1 block w-full pr-4 py-3 text-xl font-bold text-deep border-none focus:ring-0 outline-none rounded-r-xl" placeholder="값을 입력하세요">
                    </div>
                </div>

                <!-- 검증 버튼 -->
                <button id="calcCheckBtn" class="w-full bg-water hover:bg-deep text-white font-bold py-4 px-4 rounded-xl transition duration-300 shadow-md text-lg font-sans">
                    수식 검증하기
                </button>

                <!-- 결과 팝업 -->
                <div id="resultPopup" class="hidden mt-4 p-5 rounded-xl font-bold text-center border transition-all font-sans text-sm leading-relaxed"></div>
            </div>
        </div>

        <!-- 하단 공통 네비게이션 버튼 -->
        <button id="btn-prev" class="btn-nav">이전</button>
        <button id="btn-next" class="btn-nav">다음</button>
    </div>

    <script>
        document.getElementById('btn-prev').addEventListener('click', () => {
            window.location.href = 'B03.html'; // B03으로 수정됨
        });

        const nextBtn = document.getElementById('btn-next');
        nextBtn.addEventListener('click', () => {
            window.location.href = 'B05.html'; // B05로 수정됨
        });

        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');
        
        const scale = 25; 
        const originX = 80;
        const originY = 320;

        function drawStaticGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 그리드
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            for(let i = -5; i <= 15; i++) {
                ctx.beginPath(); ctx.moveTo(0, originY - i*scale); ctx.lineTo(400, originY - i*scale); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(originX + i*scale, 0); ctx.lineTo(originX + i*scale, 400); ctx.stroke();
            }
            
            // 축
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(400, originY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, 400); ctx.stroke();

            // 거리 선
            const qX = originX + 6 * scale;
            const qY = originY - 8 * scale;
            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(qX, qY);
            ctx.strokeStyle = '#059669'; 
            ctx.lineWidth = 2.5; 
            ctx.setLineDash([6, 6]); 
            ctx.stroke(); 
            ctx.setLineDash([]);

            // 완성된 원
            ctx.beginPath();
            ctx.arc(originX, originY, 10 * scale, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.15)'; 
            ctx.fill();
            ctx.strokeStyle = '#0ea5e9'; 
            ctx.lineWidth = 2; 
            ctx.stroke();

            const drawPoint = (x, y, icon, label, color, iconSize) => {
                const sx = originX + x * scale;
                const sy = originY - y * scale;
                
                ctx.beginPath();
                ctx.arc(sx, sy, iconSize / 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.font = `${iconSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icon, sx, sy + (iconSize * 0.05));
                
                ctx.font = 'bold 15px "Nanum Gothic Coding"';
                const textWidth = ctx.measureText(label).width;
                const textY = sy + (iconSize / 2) + 12;
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(sx - textWidth/2 - 8, textY - 12, textWidth + 16, 24, 6);
                ctx.fill();
                
                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, sx, textY + 5);
            };

            drawPoint(0, 0, '🌊', 'C(0,0)', '#0369a1', 36);
            drawPoint(6, 8, '🚶', 'Q(6,8)', '#059669', 28);
        }

        window.addEventListener('load', drawStaticGraph);

        document.getElementById('calcCheckBtn').addEventListener('click', () => {
            const inputVal = document.getElementById('rSquareInput').value.trim();
            const popup = document.getElementById('resultPopup');

            popup.classList.remove('hidden', 'bg-splash', 'text-deep', 'border-water', 'bg-red-50', 'text-red-700', 'border-red-200');

            if (inputVal === '100') {
                popup.innerHTML = "🎉 <strong>성공!</strong><br>아라폭포의 안전 구역을 완벽하게 수식으로 증명했습니다!";
                popup.classList.add('bg-splash', 'text-deep', 'border-water', 'block');
                document.getElementById('calcCheckBtn').classList.add('hidden');
                
                nextBtn.style.display = 'block';
            } else {
                popup.innerHTML = "❌ <strong>위험!</strong><br>수치가 틀리면 물보라를 맞을 수 있습니다. 다시 계산해 보세요.<br><span class='text-xs mt-2 block opacity-80 font-mono'>(힌트: 6² + 8²)</span>";
                popup.classList.add('bg-red-50', 'text-red-700', 'border-red-200', 'block');
                nextBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
