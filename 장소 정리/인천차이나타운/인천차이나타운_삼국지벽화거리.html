<!DOCTYPE html>

<title>삼국지 벽화거리</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 0;
    font-family: sans-serif;
  }
  .wall-container {
    width: 100%;
    max-width: 1400px;
    position: relative;
  }
  .roof {
    width: 100%;
    display: block;
  }
  .wall {
    background: #c0bcb4;
    border: 6px solid #a8a49c;
    border-top: none;
    border-radius: 0 0 8px 8px;
    padding: 40px 30px 80px;
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.08), 0 8px 30px rgba(0,0,0,0.4);
    position: relative;
  }
  .mural-frame {
    background: #f5f0e8;
    border: 3px solid #8a7a5a;
    box-shadow: 4px 6px 16px rgba(0,0,0,0.3), inset 0 0 8px rgba(0,0,0,0.05);
    flex: 1;
    min-width: 200px;
    max-width: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .mural-frame svg {
    width: 100%;
    height: auto;
    display: block;
  }
  @media (max-width: 900px) {
    .wall {
      padding: 24px 16px 50px;
      gap: 14px;
    }
    .mural-frame {
      min-width: 140px;
      max-width: 48%;
    }
  }
  @media (max-width: 500px) {
    .mural-frame {
      max-width: 100%;
    }
  }
</style>
</head>
