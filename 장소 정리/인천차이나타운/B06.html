<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천차이나타운 MATHTOUR - B06</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            perspective: 1200px;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1000px;
            aspect-ratio: 16 / 9;
            max-width: 1066px;
            overflow: hidden;
            background-color: #f5f0e6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.8s ease;
        }

        #game-container.rotate-out {
            transform: rotateY(720deg) scale(0.1);
            opacity: 0;
        }

        #bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 캐릭터 래퍼 스타일 */
        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            z-index: 3;
            transition: filter 0.2s ease;
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        /* 대화창 스타일 (유형 2) */
        #dialogue-box {
            position: absolute;
            bottom: 70px;
            left: 30px;
            right: 30px;
            height: 140px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 20px 25px;
            color: #ffffff;
            z-index: 10;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 8px;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            letter-spacing: -0.02em;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        #dialogue-hint {
            position: absolute;
            right: 20px;
            bottom: 12px;
            font-size: 0.8rem;
            color: #d4af37;
            font-family: 'Nanum Gothic Coding', monospace;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 공통 네비게이션 버튼 */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            background: #8c3030;
            color: white;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            z-index: 20;
            transition: background 0.2s;
            display: none;
        }

        .btn-nav:hover {
            background: #661f1f;
        }

        #btn-prev {
            left: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
        }

        #btn-skip {
            display: block;
            background: rgba(140, 48, 48, 0.8);
            font-size: 0.85rem;
            padding: 6px 16px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지 -->
        <img id="bg-image" src="인천차이나타운_짜장면 박물관.png" alt="짜장면 박물관 배경">

        <!-- 등장 인물 (미스터첸, 민우, 서연) -->
        <div class="char-wrapper" id="char-미스터첸" style="left: 60px; bottom: 40px;">
            <iframe src="등장인물_미스터첸.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <div class="char-wrapper" id="char-민우" style="left: 370px; bottom: 40px;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <div class="char-wrapper" id="char-서연" style="left: 680px; bottom: 40px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 대화 진행 UI -->
        <div id="dialogue-box" onclick="advanceDialogue()">
            <div>
                <div id="speaker-name">화자 이름</div>
                <div id="dialogue-text">대사 내용이 여기에 표시됩니다.</div>
            </div>
            <div id="dialogue-hint">▼ 클릭하여 계속</div>
        </div>

        <!-- 네비게이션 버튼 -->
        <button id="btn-prev" class="btn-nav" onclick="location.href='B05.html'">이전</button>
        <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
        <button id="btn-next" class="btn-nav" onclick="transitionToNext('index.html')">End</button>
    </div>

    <script>
        const dialogues = [
            {
                speaker: "미스터 첸",
                text: "훌륭하네! 자네들 덕분에 1985년 공화춘의 사라진 가격 기록이 완벽하게 복원되었네. 수학이란 단순한 숫자가 아니라, 이렇게 사라진 역사의 조각을 맞추는 강력한 도구라네!",
                target: "char-미스터첸"
            },
            {
                speaker: "서연",
                text: "찢어진 영수증을 볼 때는 막막했는데, 연립방정식을 블록으로 세우고 가감법으로 풀어내니 정말 신기했어요!",
                target: "char-서연"
            },
            {
                speaker: "민우",
                text: "우리가 직접 구한 1985년 짜장면 가격이 6,000원이었다니! 차이나타운 박물관에서 진짜 탐정이 된 기분이었어!",
                target: "char-민우"
            },
            {
                speaker: "해설",
                text: "두 학생의 활약으로 100년 짜장면 박물관의 비밀 영수증이 무사히 복원되었습니다.",
                target: null
            }
        ];

        let currentIndex = 0;

        function updateDialogue() {
            if (currentIndex >= dialogues.length) {
                endDialogue();
                return;
            }

            const current = dialogues[currentIndex];
            const speakerElem = document.getElementById("speaker-name");
            const textElem = document.getElementById("dialogue-text");

            speakerElem.textContent = current.speaker;
            textElem.textContent = current.text;

            const characters = ["char-미스터첸", "char-민우", "char-서연"];
            characters.forEach(id => {
                const elem = document.getElementById(id);
                if (current.target && id === current.target) {
                    elem.classList.remove("inactive");
                } else if (current.target) {
                    elem.classList.add("inactive");
                } else {
                    elem.classList.remove("inactive");
                }
            });
        }

        function advanceDialogue() {
            currentIndex++;
            if (currentIndex < dialogues.length) {
                updateDialogue();
            } else {
                endDialogue();
            }
        }

        function skipDialogue() {
            currentIndex = dialogues.length;
            endDialogue();
        }

        function endDialogue() {
            document.getElementById("dialogue-box").style.display = "none";
            document.getElementById("btn-skip").style.display = "none";
            
            const characters = ["char-미스터첸", "char-민우", "char-서연"];
            characters.forEach(id => {
                document.getElementById(id).classList.remove("inactive");
            });

            document.getElementById("btn-prev").style.display = "block";
            document.getElementById("btn-next").style.display = "block";
        }

        function transitionToNext(url) {
            const container = document.getElementById("game-container");
            container.classList.add("rotate-out");
            setTimeout(function() {
                window.location.href = url;
            }, 800);
        }

        window.onload = function() {
            updateDialogue();
        };
    </script>
</body>
</html>
