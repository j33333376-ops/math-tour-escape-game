<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천차이나타운 MATHTOUR - 삼국지 벽화거리</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 16:9 메인 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 2px solid #d4af37;
        }

        /* 배경 이미지 */
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 에셋 (건물/장소) Layer */
        .asset-wrapper {
            position: absolute;
            z-index: 1;
        }

        /* 인물 Layer */
        .char-wrapper {
            position: absolute;
            z-index: 3;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.4));
        }

        /* 스테이지 상단 표시바 */
        #stage-header {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid #d4af37;
            padding: 6px 16px;
            border-radius: 4px;
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* 유형1: 상황 설명 박스 (양피지 느낌) */
        .situation-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 62%;
            max-width: 620px;
            background: #f5f0e6;
            border: 2px solid #8c3030;
            border-radius: 6px;
            padding: 28px 32px;
            z-index: 10;
            box-shadow: inset 0 0 15px rgba(140, 48, 48, 0.15), 0 8px 25px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        /* 양피지 내경 구성을 위한 장식 테두리 */
        .situation-box::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid #d4af37;
            pointer-events: none;
        }

        .situation-title {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 22px;
            font-weight: 700;
            color: #8c3030;
            margin-bottom: 16px;
            border-bottom: 1px dashed #d4af37;
            padding-bottom: 8px;
        }

        .situation-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            color: #2d3748;
            line-height: 1.75;
            word-break: keep-all;
            text-align: justify;
            text-align-last: center;
        }

        /* 공통 이동 버튼 */
        .btn-nav {
            position: absolute;
            z-index: 10;
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        .btn-nav:active {
            transform: scale(0.98);
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next {
            right: 20px;
            bottom: 20px;
        }

        /* 빨려들어가는 연출 애니메이션 (Suck/Vortex Effect) */
        @keyframes vortexEffect {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                transform: scale(0) rotate(720deg);
                opacity: 0;
                filter: blur(10px);
            }
        }

        .suck-out {
            animation: vortexEffect 0.8s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
            transform-origin: center center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지 -->
        <img src="인천차이나타운_삼국지벽화거리.png" alt="인천차이나타운 삼국지벽화거리" class="bg-img" onerror="this.style.display='none';">

        <!-- 에셋: 인천차이나타운 삼국지벽화거리 (배경 보완 및 에셋 명시 충족) -->
        <div class="asset-wrapper" style="position:absolute; left:0px; bottom:0px; width:1066px; height:600px; overflow:hidden;">
            <iframe src="인천차이나타운_삼국지벽화거리.html" scrolling="no" style="border:0; width:1000px; height:500px; transform:scale(1.066); transform-origin:top left; pointer-events:none;"></iframe>
        </div>

        <!-- 스테이지 상단 표시바 -->
        <div id="stage-header">STAGE 01. 삼국지 벽화거리</div>

        <!-- 등장인물: 민우 (좌측) -->
        <div class="char-wrapper" id="char-민우" style="position:absolute; left:50px; bottom:20px; width:260px; height:320px; overflow:visible;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장인물: 서연 (우측, 마주보도록 좌우반전) -->
        <div class="char-wrapper" id="char-서연" style="position:absolute; right:50px; bottom:20px; width:260px; height:320px; overflow:visible;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 유형1: 상황 설명 박스 -->
        <div class="situation-box">
            <div class="situation-title">삼국지 벽화거리의 호기심</div>
            <div class="situation-text">
                민우와 서연이는 인천차이나타운의 삼국지 벽화거리를 천천히 걸어가고 있습니다.<br><br>
                화려하게 수놓아진 벽화를 따라 삼국지의 긴 역사를 살펴보던 두 사람은 문득 한 가지 궁금증이 생겼습니다.<br>
                <b>"이 넓은 벽화 속에서 가장 많이 등장하는 인물은 과연 누구일까?"</b>
            </div>
        </div>

        <!-- 이동 버튼 -->
        <!-- 이전 버튼 (이전 장면 없으므로 비활성화/숨김) -->
        <button class="btn-nav" id="btn-prev" style="display: none;">이전</button>
        <!-- 다음 버튼 -->
        <button class="btn-nav" id="btn-next" onclick="goToNextScene('A02.html')">다음</button>
    </div>

    <script>
        // 다음 페이지 이동 연출 함수 (빨려들어가는 효과 적용)
        function goToNextScene(targetUrl) {
            const container = document.getElementById('game-container');
            
            // 빨려들어가는 애니메이션 클래스 추가
            container.classList.add('suck-out');
            
            // 애니메이션 완료 후 페이지 이동 (800ms 실행)
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 750);
        }
    </script>
</body>
</html>
