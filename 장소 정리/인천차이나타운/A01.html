<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천차이나타운 MATHTOUR - A01</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a1a1a;
      color: #2d3748;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 16:9 메인 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background-color: #f5f0e6;
      border: 3px solid #d4af37;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    /* 배경 이미지 */
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* 상단 스테이지 표시바 */
    .stage-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #d4af37;
      border-radius: 4px;
      padding: 8px 18px;
      z-index: 10;
    }

    .stage-title {
      font-family: 'Nanum Myeongjo', serif;
      font-size: 1.1rem;
      color: #d4af37;
      letter-spacing: -0.02em;
    }

    /* 캐릭터 영역 */
    .char-stage {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .char-wrapper {
      position: absolute;
      overflow: visible;
      transition: filter 0.2s ease;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    /* 대화창 UI (#dialogue-box) */
    #dialogue-box {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 320px);
      min-height: 110px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #d4af37;
      border-radius: 6px;
      padding: 16px 20px;
      z-index: 10;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    #speaker-name {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 1.1rem;
      font-weight: bold;
      color: #d4af37;
    }

    #dialogue-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #ffffff;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }

    .click-indicator {
      align-self: flex-end;
      font-size: 0.8rem;
      color: #d4af37;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }

    /* 공통 이동 버튼 */
    .btn-nav {
      position: absolute;
      background-color: #8c3030;
      color: #ffffff;
      border: 1px solid #d4af37;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 11;
      transition: background-color 0.2s;
    }

    .btn-nav:hover {
      background-color: #661f1f;
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
    }

    #btn-next, #btn-skip {
      right: 20px;
      bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 배경 이미지 -->
    <img src="인천차이나타운_대불호텔.jpeg" alt="대불호텔 배경" class="bg-img">

    <!-- 스테이지 상단 표시바 -->
    <div class="stage-bar">
      <div class="stage-title">인천차이나타운 MATHTOUR - 대불호텔 앞</div>
    </div>

    <!-- 등장인물 무대 -->
    <div class="char-stage">
      <!-- 민우 (좌측 중앙 근처 배치) -->
      <div class="char-wrapper inactive" id="char-민우" style="position: absolute; left: 220px; bottom: 40px; width: 260px; height: 320px; overflow: visible;">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>

      <!-- 서연 (우측 중앙 근처 배치, 마주보도록 좌우 반전) -->
      <div class="char-wrapper inactive" id="char-서연" style="position: absolute; left: 586px; bottom: 40px; width: 260px; height: 320px; overflow: visible;">
        <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>
    </div>

    <!-- 대화창 UI -->
    <div id="dialogue-box" onclick="advanceDialogue()">
      <div id="speaker-name">민우</div>
      <div id="dialogue-text">대사가 출력됩니다.</div>
      <div class="click-indicator">▼ 클릭하여 계속</div>
    </div>

    <!-- 공통 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="goPage('index.html')">이전</button>
    <button class="btn-nav" id="btn-skip" onclick="finishDialogue()">건너뛰기</button>
    <button class="btn-nav" id="btn-next" style="display: none;" onclick="goPage('A02.html')">다음</button>
  </div>

  <script>
    // 대화 대본 데이터
    const dialogues = [
      {
        speaker: "민우",
        text: "서연아, 이제 맥아더 장군 동상으로 가보자!",
        target: "char-민우"
      },
      {
        speaker: "서연",
        text: "그래 민우야",
        target: "char-서연"
      }
    ];

    let currentIndex = 0;

    // 대화 진행 및 상태 업데이트
    function updateDialogue() {
      if (currentIndex < dialogues.length) {
        const current = dialogues[currentIndex];
        document.getElementById('speaker-name').innerText = current.speaker;
        document.getElementById('dialogue-text').innerText = current.text;

        // 모든 캐릭터 어둡게 처리 후, 말하는 캐릭터만 강조
        document.querySelectorAll('.char-wrapper').forEach(el => el.classList.add('inactive'));
        
        if (current.target) {
          const targetEl = document.getElementById(current.target);
          if (targetEl) {
            targetEl.classList.remove('inactive');
          }
        }
      } else {
        finishDialogue();
      }
    }

    // 대화창 클릭 시 다음 대사로
    function advanceDialogue() {
      currentIndex++;
      updateDialogue();
    }

    // 대화 종료 또는 건너뛰기 처리
    function finishDialogue() {
      document.getElementById('dialogue-box').style.display = 'none';
      document.getElementById('btn-skip').style.display = 'none';
      document.getElementById('btn-next').style.display = 'block';

      // 모든 캐릭터를 밝게 복구
      document.querySelectorAll('.char-wrapper').forEach(el => el.classList.remove('inactive'));
    }

    // 페이지 이동 함수
    function goPage(url) {
      window.location.href = url;
    }

    // 초기 화면 로드
    window.onload = () => {
      updateDialogue();
    };
  </script>
</body>
</html>
