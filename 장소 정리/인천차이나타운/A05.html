<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천차이나타운 MATHTOUR - A05 맥아더 장군 동상</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
    }

    /* 16:9 메인 게임 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #f5f0e6;
      border: 2px solid #d4af37;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      transition: opacity 0.4s ease;
    }

    /* 배경 이미지 */
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* 무대 영역 */
    #stage-area {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    /* 스테이지 상단 표시바 */
    .stage-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 10;
      background-color: rgba(0, 0, 0, 0.85);
      border: 1px solid #d4af37;
      border-radius: 4px;
      padding: 6px 16px;
      color: #d4af37;
      font-family: 'Nanum Myeongjo', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* 캐릭터 Wrapper 및 활성/비활성화 상태 */
    .char-wrapper {
      position: absolute;
      overflow: visible;
      z-index: 3;
      filter: brightness(1);
      transition: filter 0.2s ease;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    /* 대화창 UI (유형 2) */
    #dialogue-box {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      height: 130px;
      background-color: rgba(0, 0, 0, 0.7);
      border: 2px solid #d4af37;
      border-radius: 6px;
      padding: 16px 24px;
      z-index: 10;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    #speaker-name {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 18px;
      font-weight: bold;
      color: #d4af37;
      margin-bottom: 8px;
    }

    #dialogue-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px;
      color: #ffffff;
      line-height: 1.6;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }

    .dialogue-prompt {
      position: absolute;
      bottom: 10px;
      right: 16px;
      font-size: 12px;
      color: #d4af37;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* 공통 이동 버튼 스타일 */
    .btn-nav {
      position: absolute;
      bottom: 20px;
      z-index: 11;
      background-color: #8c3030;
      color: #ffffff;
      border: 1px solid #d4af37;
      border-radius: 4px;
      padding: 10px 24px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-nav:hover {
      background-color: #661f1f;
      transform: scale(1.03);
    }

    #btn-prev {
      left: 20px;
    }

    #btn-next, #btn-skip {
      right: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 전체 배경 이미지 -->
    <img src="맥아더 동상.png" alt="맥아더 동상" class="bg-img">

    <!-- 스테이지 상단 표시바 -->
    <div class="stage-bar">
      인천차이나타운 MATHTOUR — 맥아더 장군 동상
    </div>

    <!-- 무대 영역 (인물 배치) -->
    <div id="stage-area">
      <!-- 등장인물: 민우 (좌측) -->
      <div class="char-wrapper" id="char-민우" style="position:absolute; left: 180px; bottom: 20px; width: 260px; height: 320px;">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>

      <!-- 등장인물: 서연 (우측, 민우를 바라보도록 좌우 반전) -->
      <div class="char-wrapper" id="char-서연" style="position:absolute; left: 620px; bottom: 20px; width: 260px; height: 320px;">
        <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>
    </div>

    <!-- 대화창 UI -->
    <div id="dialogue-box" onclick="advanceDialogue()">
      <div id="speaker-name">민우</div>
      <div id="dialogue-text">이 동상이 인천상륙작전을 기념하기 위해 만든 맥아더 장군의 동상이야!</div>
      <div class="dialogue-prompt">클릭하여 계속 ▼</div>
    </div>

    <!-- 공통 네비게이션 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="goPage('A04.html')">이전</button>
    <button class="btn-nav" id="btn-skip" onclick="skipDialogue()">건너뛰기</button>
    <button class="btn-nav" id="btn-next" style="display: none;" onclick="goPage('index.html')">End</button>
  </div>

  <script>
    // 대화 스크립트 관리
    const dialogues = [
      { speaker: '민우', text: '이 동상이 인천상륙작전을 기념하기 위해 만든 맥아더 장군의 동상이야!', target: 'char-민우' },
      { speaker: '서연', text: '우와! 실제로 보니 훨씬 멋있다! 우리 민족의 역사적인 아픔과 한미동맹의 의미가 담겨있는 만큼 차이나타운에 온다면 꼭 한 번 보면 좋을 것 같아!', target: 'char-서연' }
    ];

    let currentIndex = 0;

    // 대화 화면 업데이트
    function updateDialogue() {
      if (currentIndex < dialogues.length) {
        const current = dialogues[currentIndex];
        document.getElementById('speaker-name').innerText = current.speaker;
        document.getElementById('dialogue-text').innerText = current.text;

        // 대화 중인 캐릭터만 밝게, 나머지는 어둡게 처리
        document.querySelectorAll('.char-wrapper').forEach(wrapper => {
          if (wrapper.id === current.target) {
            wrapper.classList.remove('inactive');
          } else {
            wrapper.classList.add('inactive');
          }
        });
      } else {
        endDialogue();
      }
    }

    // 클릭 시 다음 대화로 진행
    function advanceDialogue() {
      currentIndex++;
      if (currentIndex < dialogues.length) {
        updateDialogue();
      } else {
        endDialogue();
      }
    }

    // 대화 종료 시 처리
    function endDialogue() {
      document.getElementById('dialogue-box').style.display = 'none';
      document.getElementById('btn-skip').style.display = 'none';
      document.getElementById('btn-next').style.display = 'block';

      // 모든 캐릭터 밝기 복구
      document.querySelectorAll('.char-wrapper').forEach(wrapper => {
        wrapper.classList.remove('inactive');
      });
    }

    // 건너뛰기 처리
    function skipDialogue() {
      endDialogue();
    }

    // 페이지 이동 함수
    function goPage(url) {
      const container = document.getElementById('game-container');
      container.style.opacity = '0';
      setTimeout(() => {
        window.location.href = url;
      }, 400);
    }

    // 최초 로드 시 실행
    window.onload = function() {
      updateDialogue();
    };
  </script>
</body>
</html>
