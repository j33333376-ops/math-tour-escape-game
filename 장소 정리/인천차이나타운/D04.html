<!DOCTYPE html>
<!-- saved from url=(0043)file:///C:/Users/user/Downloads/D04(3).html -->
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천차이나타운 MATHTOUR - 보물선의 항해</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    :root {
      --dark-red: #8c3030;
      --dark-red-hover: #661f1f;
      --gold: #d4af37;
      --ink: #2d3748;
      --parchment: #f5f0e6;
      --paper: #fffaf0;
      --sea-top: #6f9eaa;
      --sea-bottom: #244a55;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background:
        radial-gradient(circle at 50% 0%, rgba(212,175,55,.15), transparent 34%),
        repeating-linear-gradient(90deg, rgba(80,48,20,.035) 0 1px, transparent 1px 6px),
        #2c2119;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--ink);
    }

    #game-container {
      position: relative;
      width: min(1066px, calc(100vw - 24px));
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background:
        linear-gradient(rgba(245,240,230,.92), rgba(226,211,181,.94)),
        repeating-linear-gradient(0deg, transparent 0 18px, rgba(97,63,24,.04) 18px 19px);
      border: 3px solid var(--gold);
      box-shadow: 0 18px 45px rgba(0,0,0,.45), inset 0 0 45px rgba(86,49,18,.18);
    }

    #game-container::before,
    #game-container::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(140,48,48,.45);
      pointer-events: none;
      z-index: 20;
    }

    #game-container::after {
      inset: 16px;
      border-color: rgba(212,175,55,.45);
    }

    .stage-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      min-width: 52%;
      padding: 8px 22px;
      color: #fff4d8;
      text-align: center;
      font-family: 'Nanum Myeongjo', serif;
      font-weight: 700;
      letter-spacing: .08em;
      background: rgba(36,25,20,.82);
      border: 1px solid var(--gold);
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
    }

    .char-wrapper {
      position: absolute;
      bottom: 52px;
      z-index: 3;
      overflow: visible;
      filter: drop-shadow(0 12px 7px rgba(0,0,0,.28));
    }

    #char-민우 { left: 28px; width: 208px; height: 256px; }
    #char-서연 { right: 28px; width: 208px; height: 256px; }

    .char-wrapper iframe {
      border: 0;
      width: 260px;
      height: 320px;
      transform: scale(.8);
      transform-origin: bottom left;
      pointer-events: none;
      background: transparent;
    }

    #char-서연 iframe { transform: scale(.8) scaleX(-1); }

    .nameplate {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 14px;
      min-width: 76px;
      text-align: center;
      color: #fff;
      background: rgba(92,35,35,.9);
      border: 1px solid var(--gold);
      font-family: 'Nanum Gothic Coding', monospace;
      font-weight: 700;
      z-index: 4;
    }

    .quiz-container {
      position: absolute;
      left: 50%;
      top: 56px;
      transform: translateX(-50%);
      width: 62%;
      height: calc(100% - 120px);
      z-index: 10;
      padding: 14px 18px 16px;
      overflow: auto;
      scrollbar-width: thin;
      background: rgba(255,250,240,.95);
      border: 2px solid var(--dark-red);
      outline: 1px solid var(--gold);
      outline-offset: 5px;
      box-shadow: 0 12px 28px rgba(56,32,16,.28), inset 0 0 24px rgba(126,82,34,.08);
    }

    .quiz-container h1 {
      margin: 0 0 3px;
      text-align: center;
      color: var(--dark-red);
      font-family: 'Nanum Myeongjo', serif;
      font-size: clamp(20px, 2.25vw, 29px);
    }

    .subtitle {
      margin: 0 0 10px;
      text-align: center;
      color: #6d5845;
      font-size: clamp(11px, 1.2vw, 14px);
    }

    .ocean-map {
      position: relative;
      width: 100%;
      height: 112px;
      margin-bottom: 10px;
      overflow: hidden;
      border: 2px solid #1e3f49;
      border-radius: 6px;
      background:
        linear-gradient(180deg, rgba(245,220,157,.26) 0 23%, transparent 24%),
        repeating-linear-gradient(170deg, rgba(255,255,255,.14) 0 2px, transparent 2px 16px),
        linear-gradient(180deg, var(--sea-top), var(--sea-bottom));
      box-shadow: inset 0 -10px 30px rgba(0,0,0,.22);
    }

    .ocean-map::before {
      content: "제물포 앞바다";
      position: absolute;
      left: 12px;
      top: 8px;
      color: rgba(255,250,230,.9);
      font-family: 'Nanum Myeongjo', serif;
      font-size: 13px;
      letter-spacing: .08em;
    }

    .ship, .port { position: absolute; z-index: 2; }
    .ship { left: 5%; bottom: 23px; font-size: 40px; transition: left .35s ease-out; }
    .port { right: 14px; bottom: 21px; font-size: 35px; text-align: center; }
    .port span { display: block; font-size: 10px; color: #fff5d0; font-weight: 700; }

    .distance-marker {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 5px;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      color: #fff;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 10px;
      font-weight: 700;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .controls, .data-display {
      min-height: 100px;
      padding: 10px 12px;
      background: rgba(245,240,230,.78);
      border: 1px solid #b99754;
      border-radius: 5px;
    }

    .controls h3, .data-display h3 {
      margin: 0 0 5px;
      color: #63322e;
      font-family: 'Nanum Myeongjo', serif;
      font-size: 15px;
    }

    .controls p, .data-display p, .slider-container label {
      margin: 3px 0;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--dark-red);
    }

    .relation-formula {
      margin: 3px 0;
      text-align: center;
      color: var(--dark-red);
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 21px;
      font-weight: 700;
    }

    .quiz-card {
      padding: 10px 12px;
      text-align: center;
      background: rgba(255,247,219,.92);
      border: 2px dashed var(--dark-red);
      border-radius: 6px;
    }

    .quiz-title {
      margin-bottom: 3px;
      color: var(--dark-red);
      font-family: 'Nanum Myeongjo', serif;
      font-weight: 700;
    }

    .quiz-card p { margin: 4px 0; font-size: 13px; }

    .quiz-input-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 7px;
    }

    input[type="number"] {
      width: 105px;
      padding: 7px 9px;
      border: 2px solid #a88045;
      border-radius: 4px;
      background: #fffdf5;
      text-align: center;
      font: 700 14px 'Nanum Gothic Coding', monospace;
    }

    .answer-btn {
      padding: 8px 14px;
      color: #fff;
      background: var(--dark-red);
      border: 1px solid var(--gold);
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
    }

    .answer-btn:hover { background: var(--dark-red-hover); }

    .result-message {
      min-height: 22px;
      margin-top: 7px;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .success { color: #16793e; }
    .fail { color: #b42318; }

    .btn-nav {
      position: absolute;
      bottom: 20px;
      z-index: 30;
      padding: 10px 24px;
      color: white;
      background: var(--dark-red);
      border: 1px solid var(--gold);
      border-radius: 4px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,.25);
    }

    .btn-nav:hover { background: var(--dark-red-hover); }
    #btn-prev { left: 20px; }
    #btn-next { right: 20px; display: none; }

    @media (max-width: 800px) {
      #char-민우, #char-서연 { transform: scale(.82); transform-origin: bottom center; }
      #char-민우 { left: -12px; }
      #char-서연 { right: -12px; }
      .quiz-container { width: 67%; }
    }
  </style>
</head>
<body>
  <main id="game-container" aria-label="인천차이나타운 MATHTOUR 수학 퀴즈 장면">
    <div class="stage-bar">D04 · 보물선의 항해 — 정비례 탐구</div>

    <div class="char-wrapper" id="char-민우">
      <iframe src="./D04_files/등장인물_민우.html" scrolling="no" title="민우"></iframe>
      <div class="nameplate">민우</div>
    </div>

    <div class="char-wrapper" id="char-서연">
      <iframe src="./D04_files/등장인물_서연.html" scrolling="no" title="서연"></iframe>
      <div class="nameplate">서연</div>
    </div>

    <section class="quiz-container">
      <h1>⚓ 보물선의 항해 (정비례)</h1>
      <p class="subtitle">일정한 속력으로 이동하는 무역선의 시간과 거리의 관계를 관찰해 봅시다.</p>

      <div class="ocean-map">
        <div class="ship" id="ship" style="left: 17.1667%;">⛵</div>
        <div class="port">🏰<span>개항장</span></div>
        <div class="distance-marker">
          <span>0km</span><span>30km</span><span>60km</span><span>90km</span>
        </div>
      </div>

      <div class="dashboard">
        <div class="controls">
          <h3>⏱ 항해 시간 조작</h3>
          <p>보물선 속력: <strong>시속 15 km</strong></p>
          <div class="slider-container">
            <label for="timeSlider">시간 (x시간): <strong id="timeVal">1</strong>시간</label>
            <input type="range" id="timeSlider" min="0" max="6" value="1" step="0.5">
          </div>
        </div>

        <div class="data-display">
          <h3>📊 관계식 및 결과</h3>
          <div class="relation-formula">y = 15x</div>
          <p>이동 거리 (y km): <strong id="distVal">15</strong> km</p>
        </div>
      </div>

      <div class="quiz-card">
        <div class="quiz-title">🎯 최종 입항 미션</div>
        <p>시속 15km로 이동하는 무역선이 <strong>4시간 동안 이동한 거리(y)</strong>는 몇 km일까요?</p>
        <div class="quiz-input-group">
          <input type="number" id="quizAnswer" placeholder="정답 입력" aria-label="정답 입력">
          <span>km</span>
          <button class="answer-btn" type="button" onclick="checkAnswer()">정답 확인</button>
        </div>
        <div class="result-message" id="resultMsg" aria-live="polite"></div>
      </div>
    </section>

    <button class="btn-nav" id="btn-prev" type="button" onclick="goToPage(&#39;D03.html&#39;)">이전</button>
    <button class="btn-nav" id="btn-next" type="button" onclick="goToPage(&#39;D01.html&#39;)">다음</button>
  </main>

  <script>
    const speed = 15;
    const timeSlider = document.getElementById('timeSlider');
    const timeVal = document.getElementById('timeVal');
    const distVal = document.getElementById('distVal');
    const ship = document.getElementById('ship');
    const quizAnswer = document.getElementById('quizAnswer');
    const resultMsg = document.getElementById('resultMsg');
    const nextButton = document.getElementById('btn-next');

    function updateSimulation(hours) {
      const distance = speed * hours;
      timeVal.textContent = Number.isInteger(hours) ? hours : hours.toFixed(1);
      distVal.textContent = Number.isInteger(distance) ? distance : distance.toFixed(1);
      const leftPercent = 5 + (hours / 6) * 73;
      ship.style.left = leftPercent + '%';
    }

    timeSlider.addEventListener('input', function (event) {
      updateSimulation(parseFloat(event.target.value));
    });

    quizAnswer.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') checkAnswer();
    });

    function checkAnswer() {
      const userAnswer = Number(quizAnswer.value);
      if (userAnswer === 60) {
        resultMsg.className = 'result-message success';
        resultMsg.textContent = '🎉 정답입니다! 무역선이 개항장에 성공적으로 정박했습니다.';
        timeSlider.value = 4;
        updateSimulation(4);
        window.setTimeout(function () {
          ship.style.left = '78%';
          nextButton.style.display = 'block';
          nextButton.focus();
        }, 300);
      } else {
        resultMsg.className = 'result-message fail';
        resultMsg.textContent = '❌ 다시 계산해 보세요. 힌트: 거리 = 속력 × 시간';
        nextButton.style.display = 'none';
        quizAnswer.focus();
      }
    }

    function goToPage(url) {
      window.location.href = url;
    }

    updateSimulation(parseFloat(timeSlider.value));
  </script>


</body></html>
