<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>인천차이나타운 MATHTOUR - 근대 개항기</title>
  <style>
    /* [공통 UI/UX 및 폰트 규칙] */
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    :root {
      --primary-red: #8c3030;
      --secondary-gold: #d4af37;
      --bg-beige: #f5f0e6;
      --text-dark: #2d3748;
      --text-light: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000000;
    }

    /* 화면 비율 16:9, 가로 최대 1066px */
    #game-container {
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-beige);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    /* 폰트 클래스 */
    .title-font { font-family: 'Nanum Myeongjo', serif; }
    .name-font { font-family: 'Nanum Gothic Coding', monospace; }
    .body-font { font-family: 'Noto Sans KR', sans-serif; line-height: 1.6; letter-spacing: -0.02em; }

    /* 화면 우측 상단 타이머 표시바 */
    #timer-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--secondary-gold);
      color: #ff4444;
      padding: 8px 18px;
      z-index: 10;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 4px;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
    }

    /* 대화창 UI (유형 2 기준 스타일 적용) */
    #dialogue-box {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      height: 130px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid var(--secondary-gold);
      border-radius: 6px;
      padding: 18px 24px;
      z-index: 25;
      box-sizing: border-box;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #speaker-name {
      color: var(--secondary-gold);
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    #dialogue-text {
      color: var(--text-light);
      font-size: 1.05rem;
      margin: 0;
      flex-grow: 1;
    }

    .dialogue-guide {
      text-align: right;
      color: #b0b0b0;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* 캐릭터 밝기 제어 (.inactive 클래스) */
    .char-wrapper {
      transition: filter 0.2s ease;
    }
    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    /* 공통 버튼 */
    .btn-nav {
      position: absolute;
      background-color: var(--primary-red);
      color: var(--text-light);
      border: 1px solid var(--secondary-gold);
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 30;
      transition: background-color 0.2s, transform 0.1s;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .btn-nav:hover {
      background-color: #661f1f;
    }
    .btn-nav:active {
      transform: scale(0.95);
    }
    #btn-prev {
      left: 20px;
      bottom: 20px;
    }
    #btn-next {
      right: 20px;
      bottom: 20px;
    }
    #btn-skip {
      right: 20px;
      bottom: 20px;
    }

  </style>
</head>
<body>

  <div id="game-container">
    
    <!-- 배경 이미지 (대불호텔) -->
    <img src="대불호텔침략.png" alt="대불호텔" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;">

    <!-- 화면 우측 상단 포격 타이머 -->
    <div id="timer-bar" class="name-font">
      포격까지 남은 시간: <span id="time-display">03:00</span>
    </div>

    <!-- 캐릭터 배치: 민우 (좌측 끝 0px) -->
    <div class="char-wrapper inactive" id="char-민우" style="position:absolute; left:0px; bottom:0px; width:260px; height:320px; overflow:visible; z-index:3;">
      <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 캐릭터 배치: 서연 (우측 끝 0px, 마주보도록 좌우 반전, 중심점 조절) -->
    <div class="char-wrapper inactive" id="char-서연" style="position:absolute; right:0px; bottom:0px; width:260px; height:320px; overflow:visible; z-index:3;">
      <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:center bottom; pointer-events:none;"></iframe>
    </div>

    <!-- 대화창 UI (클릭 시 다음 대화로 진행) -->
    <div id="dialogue-box" onclick="advanceDialogue()" class="body-font">
      <div>
        <div id="speaker-name" class="name-font">화자</div>
        <p id="dialogue-text">대화 내용이 출력되는 공간입니다.</p>
      </div>
      <div class="dialogue-guide">[클릭하여 계속]</div>
    </div>

    <!-- 하단 이동 버튼 (대화 완료 후 또는 스킵 시 표시) -->
    <button id="btn-prev" class="btn-nav" style="display: none;" onclick="window.location.href='C01.html'">이전</button>
    <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
    <button id="btn-next" class="btn-nav" style="display: none;" onclick="window.location.href='C03.html'">다음</button>

  </div>

  <script>
    // 대화 스크립트 데이터 관리
    const dialogues = [
      {
        speaker: "민우",
        text: "(다급하게 서연의 팔을 당기며) \"위험해! 일단 이리로 숨어!\"",
        target: "char-민우"
      },
      {
        speaker: "서연",
        text: "\"누, 누구세요?! 저 비행선은 대체 뭐고요!\"",
        target: "char-서연"
      },
      {
        speaker: "민우",
        text: "\"나는 이 시대의 역사를 지키는 방어군 요원 민우라고 해. 설명할 시간이 없어! 저 침략자들은 조선 근대화의 상징인 대불호텔을 파괴해 역사를 뒤바꾸려 하고 있어.\"",
        target: "char-민우"
      },
      {
        speaker: "민우",
        text: "\"저 건물을 덮을 전자기 방어막이 있지만, 방어막의 높이 좌표를 옥상에 정확히 맞추지 않으면 포격을 막을 수 없어. 서연, 네가 가진 이 디지털 클리노미터로 저 건물의 정확한 높이를 측정해 줘!\"",
        target: "char-민우"
      }
    ];

    let currentIndex = 0;

    // 대화창 업데이트 및 캐릭터 명함 밝기 제어 함수
    function updateDialogue() {
      if (currentIndex < dialogues.length) {
        const current = dialogues[currentIndex];
        document.getElementById('speaker-name').innerText = current.speaker;
        document.getElementById('dialogue-text').innerText = current.text;

        // 모든 캐릭터 비활성화 후 현재 화자만 활성화
        document.querySelectorAll('.char-wrapper').forEach(el => el.classList.add('inactive'));
        const activeWrapper = document.getElementById(current.target);
        if (activeWrapper) {
          activeWrapper.classList.remove('inactive');
        }
      } else {
        endDialogue();
      }
    }

    // 대화창 클릭 시 다음 대사로 진행
    function advanceDialogue() {
      currentIndex++;
      updateDialogue();
    }

    // 대화 건너뛰기 기능
    function skipDialogue() {
      endDialogue();
    }

    // 대화 종료 후 UI 전환 처리
    function endDialogue() {
      document.getElementById('dialogue-box').style.display = 'none';
      document.getElementById('btn-skip').style.display = 'none';
      
      // 모든 캐릭터 원래 밝기로 복구
      document.querySelectorAll('.char-wrapper').forEach(el => el.classList.remove('inactive'));

      // 이전 및 다음 버튼 표시
      document.getElementById('btn-prev').style.display = 'block';
      document.getElementById('btn-next').style.display = 'block';
    }

    // 타이머 구현 (03:00부터 1초씩 감소)
    let totalSeconds = 180;
    const timeDisplay = document.getElementById('time-display');

    const timerInterval = setInterval(() => {
      if (totalSeconds > 0) {
        totalSeconds--;
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;
        timeDisplay.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      } else {
        clearInterval(timerInterval);
      }
    }, 1000);

    // 페이지 로드 시 최초 대화 세팅 실행
    window.onload = function() {
      updateDialogue();
    };
  </script>
</body>
</html>
