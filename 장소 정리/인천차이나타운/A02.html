<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천차이나타운 MATHTOUR - A02</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a1a1a;
      color: #2d3748;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 16:9 메인 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background-color: #f5f0e6;
      border: 3px solid #d4af37;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    /* 상단 스테이지 표시바 */
    .stage-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #d4af37;
      border-radius: 4px;
      padding: 8px 18px;
      z-index: 10;
    }

    .stage-title {
      font-family: 'Nanum Myeongjo', serif;
      font-size: 1.1rem;
      color: #d4af37;
      letter-spacing: -0.02em;
    }

    /* 건물/장소 에셋 레이어 (z-index: 1) */
    .asset-building {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: 750px;
      height: 375px;
      overflow: hidden;
      z-index: 1;
    }

    /* 캐릭터 무대 레이어 (z-index: 3) */
    .char-stage {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .char-wrapper {
      position: absolute;
      overflow: visible;
    }

    /* 유형 1: 양피지 느낌의 상황 설명 박스 (z-index: 10) */
    .situation-box {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 120px);
      max-width: 900px;
      background: #fcf8ed;
      border: 2px solid #d4af37;
      border-radius: 6px;
      padding: 18px 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(212, 175, 55, 0.15);
      z-index: 10;
    }

    .situation-header {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 1.05rem;
      font-weight: bold;
      color: #8c3030;
      margin-bottom: 8px;
      border-bottom: 1px dashed #d4af37;
      padding-bottom: 4px;
    }

    .situation-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #2d3748;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }

    /* 공통 이동 버튼 (z-index: 11) */
    .btn-nav {
      position: absolute;
      background-color: #8c3030;
      color: #ffffff;
      border: 1px solid #d4af37;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 11;
      transition: background-color 0.2s;
    }

    .btn-nav:hover {
      background-color: #661f1f;
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
    }

    #btn-next {
      right: 20px;
      bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 스테이지 상단 표시바 -->
    <div class="stage-bar">
      <div class="stage-title">인천차이나타운 MATHTOUR - 대불호텔 앞 탐구</div>
    </div>

    <!-- 상황 설명 박스 (유형 1) -->
    <div class="situation-box">
      <div class="situation-header">[민우의 이야기]</div>
      <div class="situation-text">
        "대불호텔에서 맥아더 동상까지 가려면 버스를 타고 갈 수도 있고, 택시를 타고 가는 방법도 있고, 걸어갈 수도 있어. 버스를 타고 가려면 중간에 환승을 해야 하는데 환승 지점까지 2가지 노선, 환승 지점에서 맥아더 동상까지는 3가지 노선이 있어. 버스를 타거나, 택시를 타거나, 걸어간다고 할 때, 대불호텔에서 맥아더 동상까지 가는 방법의 경우의 수는 어떻게 될까?"
      </div>
    </div>

    <!-- 배경 건물 에셋: 인천차이나타운_대불호텔 -->
    <div class="asset-building">
      <iframe src="인천차이나타운_대불호텔.html" scrolling="no" style="border:0; width:1000px; height:500px; transform:scale(0.75); transform-origin:top left; pointer-events:none;"></iframe>
    </div>

    <!-- 등장인물 무대 (너비 260px 인물들이 겹치지 않도록 left 위치 수정) -->
    <div class="char-stage">
      <!-- 민우: 좌측 (left: 180px) -->
      <div class="char-wrapper" id="char-민우" style="position: absolute; left: 180px; bottom: 20px; width: 260px; height: 320px; overflow: visible;">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>

      <!-- 서연: 우측 (left: 626px - 좌우 반전 시 기준선 고려 간격 확보) -->
      <div class="char-wrapper" id="char-서연" style="position: absolute; left: 626px; bottom: 20px; width: 260px; height: 320px; overflow: visible;">
        <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>
    </div>

    <!-- 공통 이동 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="goPage('A01.html')">이전</button>
    <button class="btn-nav" id="btn-next" onclick="goPage('A03.html')">다음</button>
  </div>

  <script>
    function goPage(url) {
      window.location.href = url;
    }
  </script>
</body>
</html>
