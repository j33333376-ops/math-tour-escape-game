<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>인천차이나타운 MATHTOUR - 근대 개항기</title>
  <style>
    /* [공통 UI/UX 및 폰트 규칙] */
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    :root {
      --primary-red: #8c3030;
      --secondary-gold: #d4af37;
      --bg-beige: #f5f0e6;
      --text-dark: #2d3748;
      --text-light: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000000;
    }

    /* 화면 비율 16:9, 가로 최대 1066px */
    #game-container {
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-beige);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    /* 폰트 클래스 */
    .title-font { font-family: 'Nanum Myeongjo', serif; }
    .name-font { font-family: 'Nanum Gothic Coding', monospace; }
    .body-font { font-family: 'Noto Sans KR', sans-serif; line-height: 1.6; letter-spacing: -0.02em; }

    /* 스테이지 상단 표시바 (퀘스트) */
    #quest-bar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--secondary-gold);
      color: var(--secondary-gold);
      padding: 10px 24px;
      z-index: 10;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 4px;
      text-align: center;
      white-space: nowrap;
    }

    /* 상황 설명 박스 (유형 1 - 양피지 느낌) */
    .situation-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: var(--bg-beige);
      border: 2px solid var(--secondary-gold);
      color: var(--text-dark);
      padding: 30px 40px;
      width: 75%;
      max-width: 700px;
      box-shadow: 5px 5px 20px rgba(0,0,0,0.6);
      z-index: 15;
      border-radius: 4px;
      display: none; /* 스크립트로 제어 */
    }
    .situation-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 30%, rgba(140, 48, 48, 0.05) 100%);
      pointer-events: none;
    }
    .situation-text-title {
      color: var(--primary-red);
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 15px;
      border-bottom: 1px dashed var(--secondary-gold);
      padding-bottom: 5px;
    }
    .situation-text-body {
      font-size: 1.1rem;
      margin-bottom: 0;
    }

    /* 공통 버튼 */
    .btn-nav {
      position: absolute;
      background-color: var(--primary-red);
      color: var(--text-light);
      border: 1px solid var(--secondary-gold);
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 20;
      transition: background-color 0.2s, transform 0.1s;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .btn-nav:hover {
      background-color: #661f1f;
    }
    .btn-nav:active {
      transform: scale(0.95);
    }
    #btn-next {
      right: 20px;
      bottom: 20px;
    }

    /* =========================================
       연출 효과 CSS (글리치, 경고, 조준선 등) 
       ========================================= */
    
    /* 글리치 애니메이션 */
    .glitch-anim {
      animation: glitch 0.15s linear 6;
    }
    @keyframes glitch {
      0% { transform: translate(0); filter: hue-rotate(0deg); }
      20% { transform: translate(-10px, 5px); filter: hue-rotate(90deg); }
      40% { transform: translate(-10px, -5px); filter: hue-rotate(0deg); }
      60% { transform: translate(10px, 5px); filter: hue-rotate(180deg); }
      80% { transform: translate(10px, -5px); filter: hue-rotate(0deg); }
      100% { transform: translate(0); filter: hue-rotate(0deg); }
    }

    /* 화면 어두워짐(그림자 드리워짐) */
    #dark-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
      z-index: 5;
      transition: background 2s ease-out;
    }

    /* 붉은색 경고 점멸 */
    #warning-sign {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff3333;
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 0 0 15px #ff0000;
      z-index: 12;
      opacity: 0;
      pointer-events: none;
    }
    .blink-anim {
      animation: blink 1s infinite alternate;
    }
    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0.2; }
    }

    /* 붉은 조준선 (비행선 레이저) */
    #laser-sight {
      position: absolute;
      top: -100px;
      left: 60%;
      width: 3px;
      height: 150%;
      background: rgba(255, 0, 0, 0.8);
      box-shadow: 0 0 15px rgba(255, 0, 0, 1);
      transform: rotate(25deg);
      transform-origin: top center;
      z-index: 8;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease-in;
    }

  </style>
</head>
<body>

  <div id="game-container" class="glitch-anim">
    
    <!-- 배경 이미지 (대불호텔) -->
    <img src="대불호텔.png" alt="대불호텔" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;">

    <!-- 전환 연출을 위한 오버레이 -->
    <div id="dark-overlay"></div>
    <div id="laser-sight"></div>
    
    <!-- 상단 퀘스트 창 -->
    <div id="quest-bar" class="title-font">
      목표: 대불호텔을 보호하라!
    </div>

    <!-- 붉은색 경고 -->
    <div id="warning-sign" class="title-font blink-anim">
      [ 경 고 ]
    </div>

    <!-- 캐릭터 배치: 민우 (좌측 끝 0px) -->
    <div class="char-wrapper" id="char-민우" style="position:absolute; left:0px; bottom:0px; width:260px; height:320px; overflow:visible; z-index:3;">
      <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
    </div>

    <!-- 캐릭터 배치: 서연 (우측 끝 0px, 마주보도록 좌우 반전 시 중심점을 center로 변경하여 밀림 방지) -->
    <div class="char-wrapper" id="char-서연" style="position:absolute; right:0px; bottom:0px; width:260px; height:320px; overflow:visible; z-index:3;">
      <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:center bottom; pointer-events:none;"></iframe>
    </div>

    <!-- 상황 설명 박스 (유형 1) -->
    <div id="situation-box" class="situation-box">
      <div class="situation-text-title title-font">시스템 내레이션</div>
      <div class="situation-text-body body-font">
        "서기 1888년, 인천 개항장. 시간의 틈새를 넘어온 당신의 눈앞에 우리나라 최초의 서양식 숙박시설 '대불호텔'이 우뚝 서 있습니다. 하지만 웅장함을 감상할 틈도 없이, 역사를 파괴하려는 시간 침략자들의 비행선이 나타났습니다!"
      </div>
    </div>

    <!-- 네비게이션 버튼 (이전 버튼은 첫 화면이므로 생략) -->
    <button id="btn-next" class="btn-nav" onclick="window.location.href='C02.html'">다음</button>

  </div>

  <script>
    window.onload = function() {
      const container = document.getElementById('game-container');
      const darkOverlay = document.getElementById('dark-overlay');
      const warningSign = document.getElementById('warning-sign');
      const laserSight = document.getElementById('laser-sight');
      const situationBox = document.getElementById('situation-box');
      
      // 1. 글리치 효과(0.15초 * 6 = 0.9초) 종료 후 연출 시작
      setTimeout(() => {
        container.classList.remove('glitch-anim'); // 글리치 클래스 제거
        
        // 하늘에 거대한 그림자가 드리워짐 (화면 어두워짐)
        darkOverlay.style.background = 'rgba(0, 0, 0, 0.65)';
        
        // 붉은 조준선 등장
        laserSight.style.opacity = '1';

        // 상단 [경고] 표시 점멸 시작
        warningSign.style.opacity = '1';

        // 2. 약간의 텀을 두고 상황 설명 박스 페이드 인
        setTimeout(() => {
          situationBox.style.display = 'block';
          situationBox.animate([
            { opacity: 0, transform: 'translate(-50%, -40%)' },
            { opacity: 1, transform: 'translate(-50%, -50%)' }
          ], { duration: 600, fill: 'forwards', easing: 'ease-out' });
        }, 800);

      }, 1000); // 페이지 로드 후 1초 뒤 진행
    };
  </script>
</body>
</html>
