<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공갈빵</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .cgb-svg { display:block; width:100%; height:auto; }
  .cgb-shine { animation: cgb-shine 4.4s ease-in-out infinite; }
  @keyframes cgb-shine { 0%,100% { opacity:0.3; } 50% { opacity:0.7; } }
</style>
</head>
<body>
<svg class="cgb-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="공갈빵">
<title>공갈빵</title>
<desc>차이나타운 명물 공갈빵. 속이 빈 둥근 빵과 깨.</desc>
<defs>
  <radialGradient id="cgbCrust" cx="0.36" cy="0.28" r="0.85">
    <stop offset="0" stop-color="#f6dfa8"/><stop offset="0.45" stop-color="#e0b062"/>
    <stop offset="0.78" stop-color="#c08434"/><stop offset="1" stop-color="#8f5a18"/>
  </radialGradient>
  <linearGradient id="cgbBag" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#e0d4b4"/>
  </linearGradient>
</defs>
<ellipse cx="300" cy="536" rx="230" ry="28" fill="#5a4224" opacity="0.2"/>
<!-- 종이 봉투 -->
<g transform="translate(300,470)">
  <path d="M-196,-30 L196,-30 L172,66 L-172,66 Z" fill="url(#cgbBag)" stroke="#b8a678" stroke-width="4.4"/>
  <path d="M-196,-30 L196,-30 L188,-48 L-188,-48 Z" fill="#f2ead6" stroke="#b8a678" stroke-width="4"/>
  <g stroke="#c9b890" stroke-width="2.4" opacity="0.75">
    <line x1="-120" y1="-30" x2="-110" y2="66"/><line x1="-40" y1="-30" x2="-36" y2="66"/>
    <line x1="40" y1="-30" x2="36" y2="66"/><line x1="120" y1="-30" x2="110" y2="66"/>
  </g>
  <text x="0" y="34" text-anchor="middle" font-family="serif" font-size="42" font-weight="bold" fill="#c2201a">空 心 餅</text>
</g>
<!-- 뒤쪽 반쪽 빵 -->
<g transform="translate(452,382) rotate(18)">
  <path d="M-88,0 C-88,-52 -40,-84 0,-84 C40,-84 88,-52 88,0 Z" fill="url(#cgbCrust)" stroke="#7d4c14" stroke-width="4.4"/>
  <path d="M-88,0 C-60,-14 60,-14 88,0 C60,14 -60,14 -88,0 Z" fill="#f4e6c4" stroke="#7d4c14" stroke-width="3.4"/>
  <g fill="#e8d8b0">
    <ellipse cx="-34" cy="0" rx="18" ry="6"/><ellipse cx="30" cy="0" rx="16" ry="5"/>
  </g>
</g>
<!-- 주 공갈빵 -->
<g transform="translate(272,264)">
  <ellipse rx="200" ry="176" fill="url(#cgbCrust)" stroke="#7d4c14" stroke-width="6"/>
  <!-- 부푼 결 -->
  <g fill="none" stroke="#a86e28" stroke-width="4" opacity="0.6">
    <path d="M-176,-40 C-120,-84 -40,-100 30,-88"/>
    <path d="M-160,30 C-100,-20 0,-44 90,-28"/>
    <path d="M-120,110 C-60,60 40,32 140,52"/>
    <path d="M60,-118 C120,-96 164,-52 178,-4"/>
  </g>
  <g fill="none" stroke="#f6dfa8" stroke-width="5" opacity="0.55">
    <path d="M-150,-70 C-100,-116 -20,-134 50,-118"/>
    <path d="M-92,88 C-30,44 60,20 148,42"/>
  </g>
  <!-- 갈라진 표면 -->
  <g fill="none" stroke="#8f5a18" stroke-width="3.4" opacity="0.7">
    <path d="M-70,-120 C-58,-96 -62,-72 -78,-52"/>
    <path d="M40,-140 C56,-118 54,-92 38,-72"/>
    <path d="M120,-70 C138,-52 142,-24 130,0"/>
  </g>
  <!-- 깨 -->
  <g fill="#f6ecd8" stroke="#a8813c" stroke-width="1.6">
    <ellipse cx="-100" cy="-90" rx="9" ry="6" transform="rotate(-24 -100 -90)"/>
    <ellipse cx="-30" cy="-124" rx="9" ry="6" transform="rotate(14 -30 -124)"/>
    <ellipse cx="52" cy="-104" rx="9" ry="6" transform="rotate(-10 52 -104)"/>
    <ellipse cx="120" cy="-52" rx="9" ry="6" transform="rotate(30 120 -52)"/>
    <ellipse cx="-140" cy="-16" rx="9" ry="6" transform="rotate(20 -140 -16)"/>
    <ellipse cx="-64" cy="-30" rx="9" ry="6" transform="rotate(-16 -64 -30)"/>
    <ellipse cx="14" cy="-46" rx="9" ry="6" transform="rotate(8 14 -46)"/>
    <ellipse cx="96" cy="10" rx="9" ry="6" transform="rotate(-22 96 10)"/>
    <ellipse cx="-104" cy="60" rx="9" ry="6" transform="rotate(18 -104 60)"/>
    <ellipse cx="-16" cy="36" rx="9" ry="6" transform="rotate(-6 -16 36)"/>
    <ellipse cx="60" cy="80" rx="9" ry="6" transform="rotate(24 60 80)"/>
    <ellipse cx="146" cy="60" rx="9" ry="6" transform="rotate(-14 146 60)"/>
    <ellipse cx="-40" cy="120" rx="9" ry="6" transform="rotate(10 -40 120)"/>
  </g>
  <!-- 광택 -->
  <ellipse class="cgb-shine" cx="-84" cy="-96" rx="66" ry="34" transform="rotate(-24 -84 -96)" fill="#ffffff"/>
  <ellipse cx="66" cy="-118" rx="30" ry="14" transform="rotate(12 66 -118)" fill="#ffffff" opacity="0.35"/>
</g>
<!-- 떨어진 깨 -->
<g fill="#f6ecd8" stroke="#a8813c" stroke-width="1.6">
  <ellipse cx="120" cy="504" rx="9" ry="6" transform="rotate(20 120 504)"/>
  <ellipse cx="486" cy="512" rx="8" ry="5" transform="rotate(-14 486 512)"/>
</g>
</svg>
</body>
</html>
