<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>스키테일 암호</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
      /* ===== 이 퀴즈 전용 매핑 ===== */
      --cell-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      box-sizing: border-box;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    /* 패널 영역 */
    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 28px;
      width: 38vw;
      max-width: 440px;
      height: auto;
      justify-content: center;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 24px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    /* 슬라이더 제어부 */
    .control-group {
      background: var(--primary-soft);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .control-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .col-badge {
      background: var(--primary);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* 실시간 해독 결과 */
    .live-decoded {
      background: var(--primary-dark);
      color: white;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 2px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }

    /* 채점 영역 */
    .answer-group {
      padding-top: 20px;
      border-top: 2px dashed var(--border-color);
    }

    .answer-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-ctrl);
      outline: none;
      transition: border-color 0.2s;
      text-transform: uppercase;
      min-width: 0;
    }

    .input-row input:focus {
      border-color: var(--primary);
    }

    .btn-check {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-ctrl);
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .btn-check:hover { background: var(--primary-dark); }
    .btn-check:active { transform: translateY(1px); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
    }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--error); }

    /* 암호판(격자) 영역 */
    .wheel-side {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .grid-container {
      position: relative;
      width: 70vmin;
      height: 70vmin;
      max-width: 600px;
      max-height: 600px;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      /* 격자 안의 요소들이 FLIP 애니메이션처럼 움직이도록 absolute 컨테이너 설정 */
    }

    /* 개별 글자 셀 */
    .char-cell {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5vmin;
      font-weight: 800;
      color: var(--text-main);
      background: var(--cell-bg);
      border: 1px solid var(--border-color);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 가로로 읽는 방향을 시각적으로 돋보이게 하는 하이라이트 효과 (선택 사항) */
    .char-cell:hover {
      background: var(--primary-soft);
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    @media (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding-top: 4vh; }
      .panel-side { width: 92vw; padding: 20px; }
      .wheel-side { width: 100%; margin-top: 2vh; }
      .grid-container { width: 85vmin; height: 85vmin; }
      .char-cell { font-size: 6vmin; }
    }

    @media (orientation: landscape) and (max-height: 480px) {
      .panel-side { height: 95vh; padding: 12px 20px; }
      .header-block p { display: none; }
      .control-group { padding: 10px; margin-bottom: 10px; }
      .live-decoded { min-height: 40px; font-size: 1.1rem; margin-bottom: 10px; padding: 10px; }
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }


    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>스키테일 암호</h2>
        <p>막대의 굵기(열의 개수)를 조절하면 암호문이 재배열됩니다.<br>가로로 읽어 숨겨진 단어를 찾아내세요!</p>
      </div>

      <div class="control-group">
        <div class="control-header">
          <label>막대 굵기 조절 (열 개수)</label>
          <span class="col-badge" id="colBadge">3 열</span>
        </div>
        <input type="range" id="colSlider" min="1" max="6" value="1" step="1">
      </div>

      <div class="live-decoded" id="liveDecoded">
        ...
      </div>

      <div class="answer-group">
        <label>💡 해독한 정답을 입력하세요</label>
        <div class="input-row">
          <input type="text" id="answerInput" placeholder="정답 입력" autocomplete="off">
          <button class="btn-check" id="checkBtn">확인</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>

    <div class="wheel-side">
      <div class="grid-container" id="gridContainer">
        <!-- 자바스크립트로 글자 셀들이 생성됩니다 -->
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ⚙️ 선생님 설정 영역
    // =========================================================================
    
    // 1. 암호문 입력 (공백이 있어도 스크립트에서 자동 제거됩니다)
    const CIPHER_TEXT = "SEEK CNIE ICSY"; 

    // 2. 실제 정답 (띄어쓰기 무시, 대소문자 무시로 자동 채점됩니다)
    const CORRECT_ANSWER = "SCIENCEISKEY";

    // 3. 슬라이더 최대값 설정 (글자 길이에 따라 자동 설정도 가능하나 명시적으로 제어 가능)
    const MAX_COLUMNS = 6;

    // =========================================================================

    const textClean = CIPHER_TEXT.replace(/\s/g, '').toUpperCase();
    const len = textClean.length;

    const gridContainer = document.getElementById('gridContainer');
    const colSlider = document.getElementById('colSlider');
    const colBadge = document.getElementById('colBadge');
    const liveDecoded = document.getElementById('liveDecoded');
    const answerInput = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    const feedback = document.getElementById('feedback');

    // 슬라이더 속성 초기화
    colSlider.max = Math.min(MAX_COLUMNS, len);

    // DOM 요소 캐싱 배열
    const charElements = [];

    // 1. 초기 글자 엘리먼트 생성
    function initGrid() {
      for (let i = 0; i < len; i++) {
        const div = document.createElement('div');
        div.className = 'char-cell';
        div.textContent = textClean[i];
        gridContainer.appendChild(div);
        charElements.push(div);
      }
    }

    // 2. 열 개수에 맞춰 글자 위치(Absolute) 재배치 및 해독 텍스트 업데이트
    function renderGrid(cols) {
      colBadge.textContent = cols + " 열";
      
      const rows = Math.ceil(len / cols);
      
      // 각 열에 들어갈 글자 수 계산 (완벽히 나누어 떨어지지 않는 경우 대비)
      const colSizes = new Array(cols).fill(rows);
      const remainder = len % cols;
      if (remainder !== 0) {
        for (let i = remainder; i < cols; i++) {
          colSizes[i]--;
        }
      }

      // 글자 데이터 위치 매핑
      let charIndex = 0;
      const gridMap = Array.from({ length: rows }, () => new Array(cols).fill(''));

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < colSizes[c]; r++) {
          const char = textClean[charIndex];
          const div = charElements[charIndex];
          
          // CSS 퍼센테이지로 위치 및 크기 지정 (FLIP 효과처럼 스무스하게 이동)
          div.style.width = (100 / cols) + '%';
          div.style.height = (100 / rows) + '%';
          div.style.left = (c * 100 / cols) + '%';
          div.style.top = (r * 100 / rows) + '%';

          gridMap[r][c] = char;
          charIndex++;
        }
      }

      // 가로로 읽어 해독된 텍스트 생성
      let decodedString = "";
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (gridMap[r][c] !== '') {
            decodedString += gridMap[r][c];
          }
        }
      }
      liveDecoded.textContent = decodedString;
    }

    // 슬라이더 이벤트
    colSlider.addEventListener('input', (e) => {
      renderGrid(parseInt(e.target.value));
    });

    // 채점 로직
    function checkAnswer() {
      const userAnswer = answerInput.value.replace(/\s/g, '').toLowerCase();
      const targetAnswer = CORRECT_ANSWER.replace(/\s/g, '').toLowerCase();

      if (userAnswer === "") return;

      if (userAnswer === targetAnswer) {
        feedback.textContent = "✅ 정답입니다! 과학실 탈출 성공!";
        feedback.className = "feedback success";
      } else {
        feedback.textContent = "❌ 틀렸습니다. 가로로 꼼꼼히 읽어보세요.";
        feedback.className = "feedback error";
        
        setTimeout(() => {
          if (feedback.classList.contains('error')) {
            feedback.textContent = "";
            feedback.className = "feedback";
          }
        }, 1500);
      }
    }

    checkBtn.addEventListener('click', checkAnswer);
    answerInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    // 런타임 시작
    initGrid();
    renderGrid(1); // 초기 상태는 1열 (원본 암호문 상태)로 보여줌

  </script>
</body>
</html>
