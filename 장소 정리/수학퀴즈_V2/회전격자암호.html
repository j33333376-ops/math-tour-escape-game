<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>회전 격자암호</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
      /* ===== 이 퀴즈 전용 매핑 ===== */
      --cell-black: #1e293b;
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      box-sizing: border-box;
      gap: 30px;
      align-items: center;
      justify-content: center;
    }

    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 30px;
      width: 38vw;
      max-width: 420px;
      height: auto;
      justify-content: center;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: center;
      color: var(--text-main);
    }

    .header-block p {
      margin: 0 0 25px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .btn-rotate {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-ctrl);
      padding: 14px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(234, 88, 12, 0.25);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .btn-rotate:hover { background: #c2410c; transform: translateY(-2px); }
    .btn-rotate:active { transform: translateY(1px); }

    .answer-group {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 2px dashed var(--border-color);
    }

    .answer-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-ctrl);
      outline: none;
      transition: all 0.2s;
      min-width: 0;
    }

    .input-row input:focus {
      border-color: var(--primary);
    }

    .btn-check {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-ctrl);
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-check:hover { background: var(--primary-dark); }
    .btn-check:active { transform: translateY(1px); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--error); }

    .wheel-side {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .grid-container {
      position: relative;
      width: 65vmin;
      height: 65vmin;
      max-width: 550px;
      max-height: 550px;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      user-select: none;
    }

    .base-grid {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7vmin;
      font-weight: 800;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .grille-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center center;
    }

    .grille-cell {
      background-color: transparent;
      border: 1px solid rgba(0,0,0,0.05);
      cursor: pointer;
      transition: all 0.2s;
    }

    .grille-cell:hover {
      background-color: rgba(0,0,0,0.05);
    }

    .grille-cell.black {
      background-color: var(--cell-black);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    }

    .grille-cell.black:hover {
      background-color: #334155;
    }

    @media (max-width: 768px), (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding: 4vh 5vw; gap: 20px;}
      .panel-side { width: 100%; max-width: 500px; padding: 25px; }
      .wheel-side { width: 100%; }
      .grid-container { width: 85vmin; height: 85vmin; }
      .cell { font-size: 9vmin; }
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }


    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>회전 격자암호</h2>
        <p>격자칸을 클릭하여 가림막을 만들고<br>90도씩 회전시켜 암호를 해독하세요.</p>
      </div>

      <button class="btn-rotate" id="rotateBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        90° 회전하기
      </button>

      <div class="answer-group">
        <label>💡 해독한 정답을 입력하세요</label>
        <div class="input-row">
          <input type="text" id="answerInput" placeholder="정답 입력" autocomplete="off">
          <button class="btn-check" id="checkBtn">확인</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>

    </div>

    <div class="wheel-side">
      <div class="grid-container">
        <div class="base-grid" id="baseGrid"></div>
        <div class="grille-overlay" id="grilleOverlay"></div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ⚙️ 선생님 설정 영역 (요청하신 이미지에 맞게 수정 완료)
    // =========================================================================
    
    // 1. 격자판에 표시될 16글자 (첨부하신 이미지의 배열 순서대로 매칭)
    const GRID_TEXT = "교학시자생천들대만을성는여육인공"; 

    // 2. 정답 설정
    const CORRECT_ANSWER = "학생성공시대를여는인천교육만들자";

    // =========================================================================

    const baseGrid = document.getElementById('baseGrid');
    const grilleOverlay = document.getElementById('grilleOverlay');
    const rotateBtn = document.getElementById('rotateBtn');
    
    const answerInput = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    const feedback = document.getElementById('feedback');
    
    // 1. 하단 16칸 글자판 세팅
    let textToDisplay = GRID_TEXT.padEnd(16, ' ').slice(0, 16);
    for (let i = 0; i < 16; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = textToDisplay[i];
      baseGrid.appendChild(cell);
    }

    // 2. 상단 4x4 클릭 가능한 격자 세팅
    for (let i = 0; i < 16; i++) {
      const gCell = document.createElement('div');
      gCell.className = 'grille-cell';
      
      gCell.addEventListener('click', () => {
        gCell.classList.toggle('black');
      });
      
      grilleOverlay.appendChild(gCell);
    }

    // 3. 회전 로직
    let currentDegree = 0;
    rotateBtn.addEventListener('click', () => {
      currentDegree += 90;
      grilleOverlay.style.transform = `rotate(${currentDegree}deg)`;
    });

    // 4. 채점 로직
    function checkAnswer() {
      const userAnswer = answerInput.value.replace(/\s/g, '').toLowerCase();
      const targetAnswer = CORRECT_ANSWER.replace(/\s/g, '').toLowerCase();

      if (userAnswer === "") return;

      if (userAnswer === targetAnswer) {
        feedback.textContent = "✅ 정답입니다! 암호 해독 성공!";
        feedback.className = "feedback success";
      } else {
        feedback.textContent = "❌ 틀렸습니다. 다시 확인해보세요.";
        feedback.className = "feedback error";
        
        setTimeout(() => {
          if (feedback.classList.contains('error')) {
            feedback.textContent = "";
            feedback.className = "feedback";
          }
        }, 1500);
      }
    }

    checkBtn.addEventListener('click', checkAnswer);

    answerInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });
  </script>
</body>
</html>
