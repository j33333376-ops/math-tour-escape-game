<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>비즈네르 암호</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
      /* ===== 이 퀴즈 전용 매핑 (수식 시각화 의미색) ===== */
      --cipher-color: var(--error);   /* 암호문 */
      --key-color: var(--primary);    /* 키워드 */
      --plain-color: var(--success);  /* 평문 */
      --border-box: var(--border-color);
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* 화면 스크롤 완벽 차단 */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      box-sizing: border-box;
      gap: 20px;
      align-items: stretch;
    }

    /* 패널 영역 (좌측/상단) */
    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      width: 38vw;
      max-width: 440px;
      justify-content: center;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .control-group {
      background: var(--primary-soft);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .control-group label {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--key-color);
      margin-bottom: 8px;
    }

    .key-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1.15rem;
      font-weight: 800;
      text-align: center;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-ctrl);
      outline: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--key-color);
      transition: border-color 0.2s;
    }

    .key-input:focus {
      border-color: var(--key-color);
    }

    /* 알파벳-숫자 변환표 */
    .alpha-map {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-ctrl);
      padding: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 4px;
      text-align: center;
      margin-bottom: 20px;
    }
    .alpha-map div {
      display: flex;
      flex-direction: column;
    }
    .alpha-map span.l { color: var(--text-main); font-weight: 800; }
    .alpha-map span.n { color: var(--primary); }

    /* 채점 영역 */
    .answer-group {
      padding-top: 16px;
      border-top: 2px dashed var(--border-color);
    }

    .answer-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-ctrl);
      outline: none;
      transition: border-color 0.2s;
      text-transform: uppercase;
      min-width: 0;
    }

    .input-row input:focus {
      border-color: var(--primary);
    }

    .btn-check {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-ctrl);
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .btn-check:hover { background: var(--primary-dark); }
    .btn-check:active { transform: translateY(1px); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
    }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--error); }

    /* 계산 시각화 영역 - 스크롤 절대 제거 및 완벽 반응형 */
    .wheel-side {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 10px;
    }

    .math-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden; /* 내부 스크롤 완전 차단 */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 동적 크기 조절을 위한 내벽 박스 */
    .calculation-grid {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    /* 개별 글자 열(Column) - 절대 좌표 배치 */
    .calc-col {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 각 블록의 공통 스타일 */
    .box {
      position: absolute;
      width: 100%;
      border-radius: 20%; /* 크기에 비례하는 둥글기 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      border: 1.5px solid transparent;
    }

    .box .char { line-height: 1; }
    .box .num { font-weight: 600; opacity: 0.75; }

    .box.cipher { background: #fef2f2; border-color: #fecaca; color: var(--cipher-color); }
    .box.keyword { background: var(--primary-soft); border-color: #bfdbfe; color: var(--key-color); }
    
    /* 수식 칸은 가로로 조금 더 길게 최적화 */
    .box.math {
      background: #f8fafc; border-color: var(--border-color); color: #475569;
      border-radius: 6px;
    }
    
    .box.plain { background: #f0fdf4; border-color: #bbf7d0; color: var(--plain-color); }
    .box.empty { background: #f8fafc; border-color: var(--border-color); color: #cbd5e1; }

    /* 연산자 기호 (+, -, = , ▼) */
    .operator {
      position: absolute;
      font-weight: 800;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* 기기별 레이아웃 핏 분기 */
    @media (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding-top: 2vh; }
      .panel-side { width: 96vw; height: auto; max-width: none; padding: 16px; margin: 0 auto; }
      .wheel-side { width: 96vw; flex: 1; margin: 0 auto; padding: 0 0 2vh 0; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.2rem; margin-bottom: 4px; }
      .header-block p { display: none; }
      .alpha-map { display: none; } 
      .control-group { padding: 8px 12px; margin-bottom: 10px; }
      .answer-group { padding-top: 10px; }
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }


    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>비즈네르 암호</h2>
        <p>암호문에서 반복되는 키워드(KEY)의 값을 빼서 평문을 구하는 수학적 치환 암호입니다.</p>
      </div>

      <div class="alpha-map" id="alphaMap"></div>

      <div class="control-group">
        <label>🔑 키워드 입력</label>
        <input type="text" id="keywordInput" class="key-input" placeholder="키워드 입력" autocomplete="off" value="" maxlength="10">
      </div>

      <div class="answer-group">
        <label>💡 해독한 정답(평문)을 입력하세요</label>
        <div class="input-row">
          <input type="text" id="answerInput" placeholder="정답 입력" autocomplete="off">
          <button class="btn-check" id="checkBtn">확인</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>

    <div class="wheel-side">
      <div class="math-wrapper" id="mathWrapper">
        <div class="calculation-grid" id="calcGrid">
          <!-- JS를 통해 화면 비율에 맞춰 실시간 스케일링 배치됩니다 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ⚙️ 선생님 설정 영역
    // =========================================================================
    const CIPHER_TEXT = "WERRMQLIQD"; 
    const CORRECT_ANSWER = "MATHISBEST";
    // =========================================================================

    const cleanCipher = CIPHER_TEXT.replace(/\s/g, '').toUpperCase();
    const totalCols = cleanCipher.length;
    
    const alphaMapEl = document.getElementById('alphaMap');
    const keywordInput = document.getElementById('keywordInput');
    const mathWrapper = document.getElementById('mathWrapper');
    const calcGrid = document.getElementById('calcGrid');
    const answerInput = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    const feedback = document.getElementById('feedback');

    // 1. 알파벳 인덱스 맵 초기화
    function initAlphaMap() {
      const renderHalf = (start, end) => {
        for (let i = start; i <= end; i++) {
          const char = String.fromCharCode(i + 65);
          const div = document.createElement('div');
          div.innerHTML = `<span class="l">${char}</span><span class="n">${num = i}</span>`;
          alphaMapEl.appendChild(div);
        }
      }
      renderHalf(0, 12); renderHalf(13, 25);
    }

    // 2. 화면 크기를 픽셀 단위로 정밀 측정하여 스크롤바 없는 레이아웃 배치 (정비율 스케일러)
    function renderCalculationEngine() {
      const keyword = keywordInput.value.replace(/[^A-Za-z]/g, '').toUpperCase();
      
      const wrapperW = mathWrapper.clientWidth - 30;
      const wrapperH = mathWrapper.clientHeight - 30;
      if (wrapperW <= 0 || wrapperH <= 0) return;

      // 화면 너비에 맞춰 10개의 열 간격 계산
      let colWidth = wrapperW / totalCols;
      // 너무 커지지 않도록 한계선 설정 (최대 65px)
      if (colWidth > 65) colWidth = 65;

      // 수직 배열에 필요한 총 슬롯 비율 기반 크기 역산 (정사각형 기준 5.6배수 높이 필요)
      let boxSize = colWidth;
      const totalGridHeightNeeded = boxSize * 5.6; 

      // 만약 세로 높이가 모자라 화면을 벗어날 것 같다면, 세로 기준에 맞춰 전체 크기를 압축 다운스케일링
      if (totalGridHeightNeeded > wrapperH) {
        boxSize = wrapperH / 5.6;
        colWidth = boxSize;
      }

      // 폰트 크기를 박스 크기에 비례하여 유동적 스케일링 (가독성 확보 및 깨짐 방지)
      const charFontSize = Math.max(11, boxSize * 0.42);
      const numFontSize = Math.max(8, boxSize * 0.22);
      const mathFontSize = Math.max(9, boxSize * 0.26);
      const opFontSize = Math.max(11, boxSize * 0.35);

      // 격자 컨테이너 전체의 실제 물리 규격 설정 (중앙 정렬용)
      const finalGridW = colWidth * totalCols;
      const finalGridH = boxSize * 5.6;
      calcGrid.style.width = `${finalGridW}px`;
      calcGrid.style.height = `${finalGridH}px`;

      calcGrid.innerHTML = '';

      // 수식 컴포넌트 실시간 드로잉
      for (let i = 0; i < totalCols; i++) {
        const colX = i * colWidth;

        // 개별 열 패널 컨테이너
        const colContainer = document.createElement('div');
        colContainer.className = 'calc-col';
        colContainer.style.width = `${colWidth}px`;
        colContainer.style.height = `${finalGridH}px`;
        colContainer.style.left = `${colX}px`;
        colContainer.style.top = '0px';

        const cipherChar = cleanCipher[i];
        const cipherVal = cipherChar.charCodeAt(0) - 65;

        // 1. 암호 블록 위치
        let currentY = 0;
        const boxCipher = document.createElement('div');
        boxCipher.className = 'box cipher';
        boxCipher.style.width = `${boxSize - 4}px`;
        boxCipher.style.height = `${boxSize - 4}px`;
        boxCipher.style.top = `${currentY}px`;
        boxCipher.innerHTML = `<span class="char" style="font-size:${charFontSize}px">${cipherChar}</span><span class="num" style="font-size:${numFontSize}px">${cipherVal}</span>`;
        colContainer.appendChild(boxCipher);

        // 2. 마이너스 기호 위치
        currentY += (boxSize - 4);
        const opMinus = document.createElement('div');
        opMinus.className = 'operator';
        opMinus.style.height = `${boxSize * 0.4}px`;
        opMinus.style.top = `${currentY}px`;
        opMinus.style.fontSize = `${opFontSize}px`;
        opMinus.textContent = '-';
        colContainer.appendChild(opMinus);

        // 3. 키워드 블록 위치
        currentY += (boxSize * 0.4);
        const boxKey = document.createElement('div');
        boxKey.style.width = `${boxSize - 4}px`;
        boxKey.style.height = `${boxSize - 4}px`;
        boxKey.style.top = `${currentY}px`;

        // 4. 이퀄(=) 기호 위치
        let nextY = currentY + (boxSize - 4);
        const opEqual = document.createElement('div');
        opEqual.className = 'operator';
        opEqual.style.height = `${boxSize * 0.4}px`;
        opEqual.style.top = `${nextY}px`;
        opEqual.style.fontSize = `${opFontSize}px`;
        opEqual.textContent = '=';

        // 5. 중간 연산 수식 블록 위치
        let mathY = nextY + (boxSize * 0.4);
        const boxMath = document.createElement('div');
        boxMath.style.top = `${mathY}px`;
        boxMath.style.width = `${boxSize - 2}px`;
        boxMath.style.height = `${boxSize * 0.6}px`; // 가로형 직사각형 형태 유지

        // 6. 다운 화살표 위치
        let arrowY = mathY + (boxSize * 0.6);
        const opArrow = document.createElement('div');
        opArrow.className = 'operator';
        opArrow.style.height = `${boxSize * 0.4}px`;
        opArrow.style.top = `${arrowY}px`;
        opArrow.style.fontSize = `${opFontSize * 0.8}px`;
        opArrow.textContent = '▼';

        // 7. 최종 평문 결과 블록 위치
        let plainY = arrowY + (boxSize * 0.4);
        const boxPlain = document.createElement('div');
        boxPlain.style.width = `${boxSize - 4}px`;
        boxPlain.style.height = `${boxSize - 4}px`;
        boxPlain.style.top = `${plainY}px`;

        if (keyword.length > 0) {
          const keyChar = keyword[i % keyword.length];
          const keyVal = keyChar.charCodeAt(0) - 65;
          
          boxKey.className = 'box keyword';
          boxKey.innerHTML = `<span class="char" style="font-size:${charFontSize}px">${keyChar}</span><span class="num" style="font-size:${numFontSize}px">${keyVal}</span>`;
          
          let diff = cipherVal - keyVal;
          let mathText = `${cipherVal}-${keyVal}`;
          if (diff < 0) {
            mathText = `${cipherVal}-${keyVal}+26`;
            diff += 26;
          }
          
          boxMath.className = 'box math';
          boxMath.style.fontSize = `${mathFontSize}px`;
          boxMath.textContent = mathText;

          const plainChar = String.fromCharCode(diff + 65);
          boxPlain.className = 'box plain';
          boxPlain.innerHTML = `<span class="char" style="font-size:${charFontSize}px">${plainChar}</span><span class="num" style="font-size:${numFontSize}px">${diff}</span>`;
        } else {
          boxKey.className = 'box empty';
          boxKey.innerHTML = `<span class="char" style="font-size:${charFontSize}px">?</span>`;
          
          boxMath.className = 'box empty math';
          boxMath.style.fontSize = `${mathFontSize}px`;
          boxMath.textContent = '...';

          boxPlain.className = 'box empty';
          boxPlain.innerHTML = `<span class="char" style="font-size:${charFontSize}px">?</span>`;
        }

        colContainer.appendChild(boxKey);
        colContainer.appendChild(opEqual);
        colContainer.appendChild(boxMath);
        colContainer.appendChild(opArrow);
        colContainer.appendChild(boxPlain);
        calcGrid.appendChild(colContainer);
      }
    }

    keywordInput.addEventListener('input', renderCalculationEngine);

    // 3. 디바이스 리사이즈 및 회전 발생 시 스크롤바 탈출 가용 범위 재연산
    let resizeTimer;
    const observer = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderCalculationEngine(); 
      }, 40);
    });
    observer.observe(mathWrapper);

    // 4. 채점 시스템
    function checkAnswer() {
      const userAnswer = answerInput.value.replace(/\s/g, '').toLowerCase();
      const targetAnswer = CORRECT_ANSWER.replace(/\s/g, '').toLowerCase();
      if (userAnswer === "") return;

      if (userAnswer === targetAnswer) {
        feedback.textContent = "✅ 정답입니다! 수학실 탈출 성공!";
        feedback.className = "feedback success";
      } else {
        feedback.textContent = "❌ 틀렸습니다. 수식을 다시 확인해보세요.";
        feedback.className = "feedback error";
        setTimeout(() => {
          if (feedback.classList.contains('error')) {
            feedback.textContent = "";
            feedback.className = "feedback";
          }
        }, 1500);
      }
    }

    checkBtn.addEventListener('click', checkAnswer);
    answerInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    initAlphaMap();
    renderCalculationEngine();
  </script>
</body>
</html>
