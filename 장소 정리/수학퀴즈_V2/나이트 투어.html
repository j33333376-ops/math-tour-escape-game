<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>나이트 투어</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      width: 38vw;
      max-width: 440px;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .control-group {
      background: var(--primary-soft);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .control-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .col-badge {
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .col-badge.accent { background: var(--accent); }
    .col-badge.muted  { background: #94a3b8; }

    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; }

    .stat-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-row { display: flex; gap: 8px; }

    .btn-check, .btn-ghost {
      border-radius: var(--radius-ctrl);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex: 1;
    }
    .btn-check { background: var(--primary); color: #fff; border: none; }
    .btn-check:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-check:active:not(:disabled) { transform: translateY(1px); }
    .btn-ghost { background: var(--card-bg); color: var(--primary-dark); border: 1px solid var(--border-color); }
    .btn-ghost:hover:not(:disabled) { background: var(--primary-soft); }
    .btn-ghost:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .answer-group { padding-top: 16px; border-top: 2px dashed var(--border-color); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
      word-break: keep-all;
      line-height: 1.45;
    }
    .feedback.success { color: var(--success); }
    .feedback.error   { color: var(--error); }
    .feedback.info    { color: var(--text-muted); }

    .board-side {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 10px;
    }

    .board-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    @media (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding-top: 2vh; gap: 12px; }
      .panel-side { width: 96vw; max-width: none; padding: 16px; }
      .board-side { width: 96vw; flex: 1; padding: 0 0 2vh 0; }
      .header-block p { margin-bottom: 12px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.2rem; }
      .header-block p { display: none; }
      .control-group { padding: 8px 12px; margin-bottom: 10px; }
      .stat-row { margin-bottom: 8px; }
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    @media (orientation: portrait) {
      .panel-side { max-height: 54%; flex: 0 0 auto; }
      .board-side { flex: 1 1 auto; }
    }

    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* 부가 공통 유틸 (일부 퍼즐에서 사용) */
    .note {
      background: var(--accent-soft);
      border: 1px solid #fed7aa;
      border-radius: var(--radius-ctrl);
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #9a3412;
      line-height: 1.5;
      word-break: keep-all;
      margin-bottom: 14px;
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }


    /* ===== 나이트 투어 전용 ===== */
    .board-wrapper {
      width: min(78vmin, 560px);
      aspect-ratio: 1 / 1;
      padding: 3.2%;
    }
    .knight-board {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 0 2px var(--border-color);
    }
    .cell {
      position: relative;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-weight: 800;
      font-size: clamp(.62rem, 3vmin, 1.4rem);
      line-height: 1;
      color: #64748b;
      user-select: none;
      transition: background .15s, box-shadow .15s, color .15s;
    }
    .cell.light { background: #eef2f7; }
    .cell.dark  { background: #cbd5e1; }

    .cell.visited { color: var(--primary-dark); background: var(--primary-soft); }
    .cell.current {
      background: var(--primary);
      color: #fff;
      font-size: clamp(1rem, 4.8vmin, 2.3rem);
      box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px var(--primary-dark);
      z-index: 2;
    }

    /* 이동 가능 칸 (초록 점) */
    .cell.next {
      box-shadow: inset 0 0 0 3px var(--success);
      background: rgba(16,185,129,.16);
    }
    .cell.next::after {
      content: '';
      width: 24%; height: 24%;
      border-radius: 50%;
      background: var(--success);
      opacity: .82;
    }

    /* 바른스도르프 추천 칸 (주황 별) — .next 뒤에 선언하여 우선 적용 */
    .cell.hint {
      box-shadow: inset 0 0 0 3px var(--accent);
      background: rgba(234,88,12,.18);
      animation: hintPulse 1.15s ease-in-out infinite;
    }
    .cell.hint::after {
      content: '★';
      width: auto; height: auto;
      background: none;
      color: var(--accent);
      opacity: .95;
      font-size: clamp(.72rem, 3vmin, 1.35rem);
    }
    @keyframes hintPulse {
      0%, 100% { box-shadow: inset 0 0 0 3px var(--accent); }
      50%      { box-shadow: inset 0 0 0 5px var(--accent); }
    }

    .knight-board.done .cell { cursor: default; }

    /* 프리셋 / 힌트 버튼 */
    .preset-row { display: flex; gap: 7px; }
    .preset-btn {
      flex: 1 1 auto;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 10px;
      padding: 9px 6px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .preset-btn:hover { background: var(--primary-soft); border-color: var(--primary); }
    .preset-btn.active {
      background: var(--primary); color: #fff; border-color: var(--primary-dark);
      box-shadow: 0 4px 10px -4px var(--primary);
    }
    #hintBtn.on {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    #hintBtn.on:hover { background: #c2410c; }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>

  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>나이트 투어</h2>
        <p>나이트(♞)로 모든 칸을 한 번씩만 밟으세요.<br>초록 칸이 갈 수 있는 다음 칸입니다.</p>
      </div>

      <div class="note">
        💡 나이트는 <b>L자(가로 2·세로 1)</b>로 움직여요. <b>5×5는 모서리(구석) 칸에서 시작</b>하면 완주 경로가 반드시 있습니다. 막히면 <b>되돌리기</b>! ★ 힌트는 <b>바른스도르프 규칙</b>(다음에 갈 곳이 가장 적은 칸)을 추천해요.
      </div>

      <div class="control-group">
        <div class="control-header">
          <label>판 크기</label>
        </div>
        <div class="preset-row" id="presetRow"></div>
      </div>

      <div class="stat-row">
        <span class="col-badge" id="visitBadge">방문 0/25</span>
        <span class="col-badge muted" id="leftBadge">남은 25</span>
      </div>

      <div class="btn-row">
        <button class="btn-ghost" id="undoBtn">↶ 되돌리기</button>
        <button class="btn-ghost" id="hintBtn">💡 힌트</button>
        <button class="btn-check" id="resetBtn">🔄 다시 시작</button>
      </div>

      <div class="answer-group" style="margin-top:16px">
        <div class="feedback info" id="feedback">시작할 칸을 클릭하세요. (모서리 권장)</div>
      </div>
    </div>

    <div class="board-side">
      <div class="board-wrapper">
        <div class="knight-board" id="board"></div>
      </div>
    </div>
  </div>

  <script>

    // ==========================================================
    //  나이트 투어 — 합법 나이트 이동으로 모든 칸을 한 번씩
    //  힌트: 바른스도르프 규칙을 우선 순위로 하는 DFS 로
    //        "완주까지 이어지는" 다음 한 수를 추천 (node 검증 완료)
    //  * 5×5 는 (행+열)이 짝수인 다수색(=모서리 포함)에서만 완주 가능
    // ==========================================================

    const KNIGHT = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
    const SIZES = [5, 6, 8];
    const SOLVE_CAP = 300000;    // 힌트 DFS 반복 상한(완주 가능 위치는 즉시 발견)

    // --- DOM ---
    const boardEl    = document.getElementById('board');
    const presetRow  = document.getElementById('presetRow');
    const visitBadge = document.getElementById('visitBadge');
    const leftBadge  = document.getElementById('leftBadge');
    const undoBtn    = document.getElementById('undoBtn');
    const hintBtn    = document.getElementById('hintBtn');
    const resetBtn   = document.getElementById('resetBtn');
    const feedback   = document.getElementById('feedback');

    // --- 상태 ---
    let n = 5;
    let visited = [];   // boolean[n*n]
    let order = [];     // 방문 순서(0-based), 미방문 -1
    let path = [];      // [[r,c], ...]
    let finished = false;
    let hintOn = false;
    let cells = [];     // 셀 DOM

    function inB(r, c) { return r >= 0 && r < n && c >= 0 && c < n; }
    function isKnightMove(r1, c1, r2, c2) {
      const dr = Math.abs(r1 - r2), dc = Math.abs(c1 - c2);
      return (dr === 1 && dc === 2) || (dr === 2 && dc === 1);
    }

    // 현재 visited 기준, (r,c)에서 갈 수 있는 미방문 합법 이동
    function legalFrom(r, c) {
      const res = [];
      for (const [dr, dc] of KNIGHT) {
        const nr = r + dr, nc = c + dc;
        if (inB(nr, nc) && !visited[nr * n + nc]) res.push([nr, nc]);
      }
      return res;
    }

    function setFeedback(t, k) { feedback.textContent = t; feedback.className = 'feedback ' + k; }

    // ---- 힌트: 바른스도르프 우선 DFS 로 완주까지의 다음 한 수 찾기 ----
    function recommendNext() {
      if (path.length === 0 || finished) return { next: null, complete: false };
      const total = n * n;
      const vis = visited.slice();
      const cen = (n - 1) / 2;
      let iters = 0;

      function order2(r, c) {
        const cand = [];
        for (const [dr, dc] of KNIGHT) {
          const nr = r + dr, nc = c + dc;
          if (inB(nr, nc) && !vis[nr * n + nc]) {
            vis[nr * n + nc] = true;
            let d = 0;
            for (const [dr2, dc2] of KNIGHT) {
              const ar = nr + dr2, ac = nc + dc2;
              if (inB(ar, ac) && !vis[ar * n + ac]) d++;
            }
            vis[nr * n + nc] = false;
            const dist = Math.abs(nr - cen) + Math.abs(nc - cen);
            cand.push({ nr, nc, d, dist });
          }
        }
        cand.sort((a, b) => a.d - b.d || b.dist - a.dist);
        return cand;
      }

      function dfs(r, c, cnt) {
        if (++iters > SOLVE_CAP) return false;
        if (cnt === total) return true;
        for (const m of order2(r, c)) {
          vis[m.nr * n + m.nc] = true;
          if (dfs(m.nr, m.nc, cnt + 1)) return true;
          vis[m.nr * n + m.nc] = false;
        }
        return false;
      }

      const [sr, sc] = path[path.length - 1];
      const first = order2(sr, sc);
      for (const m of first) {
        vis[m.nr * n + m.nc] = true;
        if (dfs(m.nr, m.nc, path.length + 1)) return { next: [m.nr, m.nc], complete: true };
        vis[m.nr * n + m.nc] = false;
      }
      // 완주 경로가 없거나 상한 초과 → 그나마 나은 바른스도르프 한 수
      return { next: first.length ? [first[0].nr, first[0].nc] : null, complete: false };
    }

    // --- 보드 구성 ---
    function buildBoard() {
      boardEl.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
      boardEl.innerHTML = '';
      cells = [];
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const d = document.createElement('div');
          d.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
          d.dataset.r = r;
          d.dataset.c = c;
          boardEl.appendChild(d);
          cells.push(d);
        }
      }
    }

    function buildPresets() {
      presetRow.innerHTML = '';
      SIZES.forEach(sz => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn' + (sz === n ? ' active' : '');
        btn.textContent = sz + '×' + sz;
        btn.addEventListener('click', () => setSize(sz));
        presetRow.appendChild(btn);
      });
    }

    function setSize(sz) {
      n = sz;
      buildBoard();
      buildPresets();
      resetGame();
    }

    function resetGame() {
      visited = new Array(n * n).fill(false);
      order = new Array(n * n).fill(-1);
      path = [];
      finished = false;
      setFeedback('시작할 칸을 클릭하세요.' + (n === 5 ? ' (모서리 권장)' : ''), 'info');
      render();
    }

    function visit(r, c) { visited[r * n + c] = true; order[r * n + c] = path.length; path.push([r, c]); }
    function unvisitLast() { const [r, c] = path.pop(); visited[r * n + c] = false; order[r * n + c] = -1; }

    function render() {
      const total = n * n;
      const curCell = path.length ? path[path.length - 1] : null;
      const legal = (curCell && !finished) ? legalFrom(curCell[0], curCell[1]) : [];
      const legalSet = new Set(legal.map(([r, c]) => r * n + c));

      let hintKey = -2;
      if (hintOn && !finished && path.length > 0) {
        const rec = recommendNext();
        if (rec.next) hintKey = rec.next[0] * n + rec.next[1];
      }

      cells.forEach((el, idx) => {
        const r = Math.floor(idx / n), c = idx % n;
        el.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
        const o = order[idx];
        if (o >= 0) {
          if (o === path.length - 1) { el.classList.add('current'); el.textContent = '♞'; }
          else { el.classList.add('visited'); el.textContent = String(o + 1); }
        } else {
          el.textContent = '';
          if (legalSet.has(idx)) el.classList.add('next');
        }
        if (hintOn && !finished) {
          if (path.length === 0) {
            if ((r === 0 || r === n - 1) && (c === 0 || c === n - 1)) el.classList.add('hint');
          } else if (idx === hintKey) {
            el.classList.add('hint');
          }
        }
      });

      visitBadge.textContent = '방문 ' + path.length + '/' + total;
      leftBadge.textContent = '남은 ' + (total - path.length);
      undoBtn.disabled = path.length === 0;
      boardEl.classList.toggle('done', finished);
    }

    function afterMove(isStart) {
      const total = n * n;
      if (path.length === total) {
        finished = true;
        setFeedback('🎉 완주 성공! ' + total + '칸을 모두 한 번씩 방문했어요!', 'success');
        render();
        return;
      }
      const [cr, cc] = path[path.length - 1];
      const moves = legalFrom(cr, cc);
      if (moves.length === 0) {
        setFeedback('막혔어요! 갈 수 있는 칸이 없습니다. ↶ 되돌리기로 다른 길을 찾아보세요.', 'error');
      } else if (isStart) {
        if (n === 5 && (cr + cc) % 2 === 1) {
          setFeedback('이 칸에서는 25칸 완주가 불가능해요. 모서리(구석) 칸에서 다시 시작해 보세요.', 'error');
        } else {
          setFeedback('(' + (cr + 1) + ',' + (cc + 1) + ') 출발! 초록 칸으로 이동하세요.', 'info');
        }
      } else {
        setFeedback('좋아요! 방문 ' + path.length + '/' + total + ' · 계속 이동하세요.', 'info');
      }
      render();
    }

    function onCell(r, c) {
      if (finished) return;
      if (path.length === 0) { visit(r, c); afterMove(true); return; }

      const [cr, cc] = path[path.length - 1];
      if (visited[r * n + c]) {
        setFeedback('이미 지나온 칸이에요. 아직 방문하지 않은 칸으로 이동하세요.', 'error');
        return;
      }
      if (!isKnightMove(cr, cc, r, c)) {
        setFeedback('❌ 나이트 이동이 아니에요. L자(가로2·세로1 또는 가로1·세로2)로만 이동해요.', 'error');
        return;
      }
      visit(r, c);
      afterMove(false);
    }

    function undo() {
      if (path.length === 0) return;
      unvisitLast();
      finished = false;
      if (path.length === 0) setFeedback('처음으로 돌아왔어요. 시작 칸을 클릭하세요.', 'info');
      else setFeedback('한 수 되돌렸어요. 방문 ' + path.length + '/' + (n * n), 'info');
      render();
    }

    function toggleHint() {
      hintOn = !hintOn;
      hintBtn.classList.toggle('on', hintOn);
      if (hintOn && !finished) {
        if (path.length === 0) {
          setFeedback('★ 표시(모서리)에서 시작하면 완주하기 좋아요.', 'info');
        } else {
          const rec = recommendNext();
          if (!rec.next) setFeedback('지금 위치에선 추천할 이동이 없어요. 되돌리기를 해보세요.', 'error');
          else if (!rec.complete) setFeedback('★ 칸이 그나마 나은 수예요. (여기선 완주가 어려울 수 있어요)', 'info');
          else setFeedback('★ 칸이 완주로 이어지는 추천 이동이에요.', 'info');
        }
      }
      render();
    }

    // --- 이벤트 ---
    boardEl.addEventListener('click', (e) => {
      const el = e.target.closest('.cell');
      if (!el) return;
      onCell(parseInt(el.dataset.r, 10), parseInt(el.dataset.c, 10));
    });
    undoBtn.addEventListener('click', undo);
    hintBtn.addEventListener('click', toggleHint);
    resetBtn.addEventListener('click', resetGame);

    // --- 시작 ---
    setSize(5);

  </script>
</body>
</html>
