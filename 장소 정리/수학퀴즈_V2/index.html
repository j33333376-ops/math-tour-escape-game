<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>매쓰투어 제작을 위한 수학게임(퍼즐)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;              /* 스크롤 금지 */
    overscroll-behavior: none;
  }

  body {
    background: #f5f7fe;
    color: #1e2545;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* 파스텔 배경 */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60vw 40vh at 6% -6%,   rgba(96,165,250,.26), transparent 62%),
      radial-gradient(55vw 36vh at 94% 2%,   rgba(217,70,239,.19), transparent 62%),
      radial-gradient(62vw 40vh at 50% 106%, rgba(52,211,153,.19), transparent 62%),
      radial-gradient(40vw 30vh at 80% 55%,  rgba(251,191,36,.15), transparent 65%);
  }

  /* 뷰포트를 정확히 채우는 세로 배치 */
  .wrap {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;               /* 모바일 주소창 대응 */
    display: flex;
    flex-direction: column;
    padding: clamp(10px, 2.2vmin, 26px);
    gap: clamp(8px, 1.8vmin, 20px);
  }

  header { flex: 0 0 auto; text-align: center; }

  h1 {
    font-size: clamp(1rem, 3.6vmin, 2.5rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.25;
    word-break: keep-all;
    background: linear-gradient(96deg, #2563eb 0%, #a855f7 42%, #f43f5e 78%, #f97316 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* 7 × 4 = 28칸 — 26개 카드를 화면에 꽉 채워 배치(스크롤 없음) */
  .grid {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: clamp(5px, 1.15vmin, 14px);
  }

  .card {
    position: relative;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 1.1vmin, 12px);
    padding: clamp(4px, 1vmin, 14px);
    background: #fff;
    border: 1.5px solid #e6e9f5;
    border-radius: clamp(10px, 1.8vmin, 20px);
    box-shadow: 0 3px 12px rgba(30,37,69,.05);
    text-decoration: none;
    color: #1e2545;
    overflow: hidden;
    transition: transform .2s cubic-bezier(.2,.9,.3,1.35), box-shadow .24s, border-color .2s;
    animation: rise .45s cubic-bezier(.2,.9,.3,1.1) backwards;
    animation-delay: var(--d);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.96); } }

  .card::before {
    content: '';
    position: absolute; top: 0; left: 28%; right: 28%;
    height: 3px;
    border-radius: 0 0 3px 3px;
    background: linear-gradient(90deg, var(--g1), var(--g2));
    transition: all .26s;
  }
  .card:hover { transform: translateY(-5px); border-color: var(--g1); box-shadow: 0 18px 32px -18px var(--g1); }
  .card:hover::before { left: 10%; right: 10%; }
  .card:active { transform: translateY(-1px) scale(.985); }
  .card:focus-visible { outline: 3px solid var(--g1); outline-offset: 2px; }

  .ico {
    flex: 0 0 auto;
    width: clamp(26px, 7.4vmin, 66px);
    aspect-ratio: 1 / 1;
    border-radius: clamp(7px, 2vmin, 20px);
    display: grid; place-items: center;
    color: #fff;
    background: linear-gradient(140deg, var(--g1), var(--g2));
    box-shadow: 0 6px 14px -7px var(--g1),
                inset 0 -2px 6px rgba(0,0,0,.15),
                inset 0 2px 3px rgba(255,255,255,.45);
    transition: transform .28s cubic-bezier(.2,.9,.3,1.6), border-radius .28s;
  }
  .ico svg { width: 62%; height: 62%; }
  .card:hover .ico { transform: scale(1.1) rotate(-5deg); border-radius: clamp(9px, 2.6vmin, 24px); }

  .nm {
    font-size: clamp(.6rem, 1.75vmin, 1.05rem);
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.2;
    text-align: center;
    word-break: keep-all;
  }

  /* ---------- 세로 화면: 2열 × 8행, 가로형 카드 ---------- */
  @media (orientation: portrait) {
    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(13, minmax(0, 1fr));
    }
    .card {
      flex-direction: row;
      justify-content: flex-start;
      gap: clamp(6px, 2.2vmin, 14px);
      padding-left: clamp(6px, 2.6vmin, 16px);
    }
    .ico { width: clamp(24px, 6.4vmin, 52px); }
    .nm { text-align: left; font-size: clamp(.62rem, 1.85vmin, 1rem); }
    h1 { font-size: clamp(1rem, 4.4vmin, 2rem); }
  }

  /* 아주 좁은 세로 화면(구형 폰)은 1열이 답답하므로 유지하되 아이콘만 축소 */
  @media (orientation: portrait) and (max-width: 330px) {
    .ico { width: clamp(20px, 5.6vmin, 40px); }
    .nm { font-size: .6rem; }
  }

  /* 납작한 가로 화면(폰 가로): 8열 × 2행 */
  @media (orientation: landscape) and (max-height: 430px) {
    .grid {
      grid-template-columns: repeat(9, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }
    .ico { width: clamp(20px, 8vmin, 40px); }
    .nm { font-size: clamp(.5rem, 2vmin, .8rem); }
    h1 { font-size: clamp(.9rem, 4.6vmin, 1.4rem); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
