<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3×3 마방진</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      width: 38vw;
      max-width: 440px;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .control-group {
      background: var(--primary-soft);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .control-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .col-badge {
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .col-badge.accent { background: var(--accent); }
    .col-badge.muted  { background: #94a3b8; }

    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; }

    .stat-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-row { display: flex; gap: 8px; }

    .btn-check, .btn-ghost {
      border-radius: var(--radius-ctrl);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex: 1;
    }
    .btn-check { background: var(--primary); color: #fff; border: none; }
    .btn-check:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-check:active:not(:disabled) { transform: translateY(1px); }
    .btn-ghost { background: var(--card-bg); color: var(--primary-dark); border: 1px solid var(--border-color); }
    .btn-ghost:hover:not(:disabled) { background: var(--primary-soft); }
    .btn-ghost:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .answer-group { padding-top: 16px; border-top: 2px dashed var(--border-color); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
      word-break: keep-all;
      line-height: 1.45;
    }
    .feedback.success { color: var(--success); }
    .feedback.error   { color: var(--error); }
    .feedback.info    { color: var(--text-muted); }

    .board-side {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 10px;
    }

    .board-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    @media (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding-top: 2vh; gap: 12px; }
      .panel-side { width: 96vw; max-width: none; padding: 16px; }
      .board-side { width: 96vw; flex: 1; padding: 0 0 2vh 0; }
      .header-block p { margin-bottom: 12px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.2rem; }
      .header-block p { display: none; }
      .control-group { padding: 8px 12px; margin-bottom: 10px; }
      .stat-row { margin-bottom: 8px; }
    }

    /* ===== 마방진 전용 ===== */
    .board-wrapper {
      width: min(80vmin, 540px);
      aspect-ratio: 1 / 1;
      padding: 4%;
      flex-direction: column;
      gap: 3%;
      touch-action: none;      /* 터치 드래그가 스크롤로 새지 않게 */
      user-select: none;
    }

    .magic {
      display: grid;
      grid-template-columns: repeat(3, 1fr) 0.62fr;
      grid-template-rows: repeat(3, 1fr) 0.62fr;
      gap: 2.5%;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .msq {
      position: relative;
      border: 2px dashed var(--border-color);
      border-radius: 10px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
    }
    .msq.filled { background: var(--card-bg); border-style: solid; border-color: var(--primary); }

    /* 드래그 중 놓을 수 있는 칸 강조 */
    .msq.drop-ok {
      background: #dcfce7;
      border: 2px solid var(--success);
      transform: scale(1.05);
      box-shadow: 0 6px 14px -6px var(--success);
    }
    .msq.drop-swap {
      background: var(--accent-soft);
      border: 2px solid var(--accent);
      transform: scale(1.05);
    }

    /* 칸 안에 놓인 숫자 = 다시 끌 수 있는 조각 */
    .num {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(1.1rem, 4.5vmin, 2.2rem);
      font-weight: 800;
      color: var(--primary);
      cursor: grab;
      border-radius: 8px;
    }
    .num:active { cursor: grabbing; }
    .num.dragging { opacity: 0.22; }

    .sum {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: 10px;
      background: #f1f5f9;
      color: var(--text-muted);
      font-weight: 800;
      font-size: clamp(0.7rem, 2.6vmin, 1.1rem);
      line-height: 1.15;
      border: 2px solid transparent;
      transition: all 0.18s;
    }
    .sum.ok   { background: #dcfce7; color: #047857; border-color: var(--success); }
    .sum.over { background: #fee2e2; color: #b91c1c; border-color: var(--error); }
    .sum.diag { gap: 2px; }

    /* 숫자 보관함 */
    .tray {
      display: flex;
      flex-wrap: wrap;
      gap: 2%;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
      min-height: 14%;
      border-radius: 12px;
      border: 2px dashed transparent;
      transition: all 0.18s;
    }
    .tray.drop-ok {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .chip {
      width: 9.4%;
      aspect-ratio: 1 / 1;
      min-width: 30px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: var(--card-bg);
      color: var(--primary-dark);
      font-weight: 800;
      font-size: clamp(0.85rem, 2.8vmin, 1.3rem);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 5px rgba(15,23,42,.06);
      touch-action: none;
    }
    .chip:hover { background: var(--primary-soft); transform: translateY(-2px); }
    .chip:active { cursor: grabbing; }
    .chip.selected { background: var(--primary); color: #fff; border-color: var(--primary-dark); transform: scale(1.1); }
    .chip.dragging { opacity: 0.22; }
    .chip.used { opacity: 0; pointer-events: none; }

    /* 손가락/마우스를 따라다니는 조각 */
    .drag-ghost {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 12px 22px -8px rgba(37,99,235,.7);
      transform: translate(-50%, -50%) scale(1.12) rotate(-4deg);
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    @media (orientation: portrait) {
      .panel-side { max-height: 54%; flex: 0 0 auto; }
      .board-side { flex: 1 1 auto; }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>3×3 마방진</h2>
        <p>아래 숫자 1~9를 칸으로 <b>끌어다 놓으세요</b>.<br>가로·세로·대각선 <b>모든 줄의 합이 15</b>가 되면 성공!</p>
      </div>

      <div class="stat-row">
        <span class="col-badge muted" id="placedBadge">놓은 수 0 / 9</span>
        <span class="col-badge accent" id="lineBadge">완성된 줄 0 / 8</span>
      </div>

      <div class="btn-row">
        <button class="btn-ghost" id="hintBtn">💡 힌트</button>
        <button class="btn-check" id="resetBtn">🔄 다시 시작</button>
      </div>

      <div class="answer-group" style="margin-top:16px">
        <div class="feedback info" id="feedback">숫자를 칸으로 끌어다 놓으세요. (클릭해도 됩니다)</div>
      </div>
    </div>

    <div class="board-side">
      <div class="board-wrapper" id="wrapper">
        <div class="magic" id="magic"></div>
        <div class="tray" id="tray"></div>
      </div>
    </div>
  </div>

  <script>

    // ==========================================================
    //  3x3 마방진 — 1~9의 합 45, 한 줄의 합은 45 ÷ 3 = 15
    //  가운데 칸은 반드시 5 (네 줄이 지나므로)
    //  숫자를 드래그해서 칸에 놓는다. (클릭 방식도 그대로 지원)
    // ==========================================================
    const TARGET = 15;

    const wrapper  = document.getElementById('wrapper');
    const magicEl  = document.getElementById('magic');
    const trayEl   = document.getElementById('tray');
    const placedBadge = document.getElementById('placedBadge');
    const lineBadge   = document.getElementById('lineBadge');
    const hintBtn  = document.getElementById('hintBtn');
    const resetBtn = document.getElementById('resetBtn');
    const feedback = document.getElementById('feedback');

    let cellVals = new Array(9).fill(0);   // 0 = 비어 있음
    let selectedChip = null;               // 클릭 방식용
    let hintOn = false;
    let solved = false;
    let cellEls = [], sumEls = {}, chipEls = [];

    // 8개의 줄: 가로 3, 세로 3, 대각선 2
    const LINES = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    // ---------- 만들기 ----------
    function buildBoard() {
      magicEl.innerHTML = '';
      cellEls = [];
      sumEls = { row: [], col: [], diag: null };

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const d = document.createElement('div');
          d.className = 'msq';
          d.dataset.i = r * 3 + c;
          magicEl.appendChild(d);
          cellEls.push(d);
        }
        const s = document.createElement('div');
        s.className = 'sum';
        magicEl.appendChild(s);
        sumEls.row.push(s);
      }
      for (let c = 0; c < 3; c++) {
        const s = document.createElement('div');
        s.className = 'sum';
        magicEl.appendChild(s);
        sumEls.col.push(s);
      }
      const dg = document.createElement('div');
      dg.className = 'sum diag';
      magicEl.appendChild(dg);
      sumEls.diag = dg;
    }

    function buildTray() {
      trayEl.innerHTML = '';
      chipEls = [];
      for (let v = 1; v <= 9; v++) {
        const c = document.createElement('div');
        c.className = 'chip';
        c.dataset.v = v;
        c.textContent = v;
        trayEl.appendChild(c);
        chipEls.push(c);
      }
    }

    // ---------- 규칙 ----------
    const lineSum  = (line) => line.reduce((a, i) => a + cellVals[i], 0);
    const lineFull = (line) => line.every(i => cellVals[i] !== 0);

    function setFeedback(t, k) {
      feedback.textContent = t;
      feedback.className = 'feedback ' + k;
    }

    // ---------- 배치/회수 (드래그와 클릭이 공유) ----------
    function placeAt(i, v) {
      const prev = cellVals[i];        // 이미 있던 수는 보관함으로 돌아간다
      cellVals[i] = v;
      solved = false;
      return prev;
    }
    function removeAt(i) {
      const v = cellVals[i];
      cellVals[i] = 0;
      solved = false;
      return v;
    }
    function moveCell(from, to) {      // 칸 → 칸 (차 있으면 교환)
      const a = cellVals[from], b = cellVals[to];
      cellVals[to] = a;
      cellVals[from] = b;              // b가 0이면 그냥 이동, 아니면 교환
      solved = false;
    }

    // ---------- 그리기 ----------
    function paintSum(el, line) {
      const sum = lineSum(line), full = lineFull(line);
      el.className = 'sum';
      if (full) el.classList.add(sum === TARGET ? 'ok' : 'over');
      else if (sum > TARGET) el.classList.add('over');
      el.textContent = String(sum);
    }

    function render() {
      cellEls.forEach((el, i) => {
        el.classList.toggle('filled', cellVals[i] !== 0);
        el.innerHTML = '';
        if (cellVals[i]) {
          const n = document.createElement('div');
          n.className = 'num';
          n.dataset.cell = i;
          n.textContent = cellVals[i];
          el.appendChild(n);
        }
      });

      for (let r = 0; r < 3; r++) paintSum(sumEls.row[r], LINES[r]);
      for (let c = 0; c < 3; c++) paintSum(sumEls.col[c], LINES[3 + c]);

      const dSum = lineSum(LINES[6]), aSum = lineSum(LINES[7]);
      const dFull = lineFull(LINES[6]), aFull = lineFull(LINES[7]);
      sumEls.diag.className = 'sum diag';
      if (dFull && aFull) sumEls.diag.classList.add((dSum === TARGET && aSum === TARGET) ? 'ok' : 'over');
      sumEls.diag.innerHTML = '<span>↘' + dSum + '</span><span>↗' + aSum + '</span>';

      const used = cellVals.filter(v => v !== 0);
      chipEls.forEach(ch => {
        const v = parseInt(ch.dataset.v, 10);
        ch.classList.toggle('used', used.includes(v));
        ch.classList.toggle('selected', selectedChip === v);
      });

      const placed = used.length;
      const done = LINES.filter(l => lineFull(l) && lineSum(l) === TARGET).length;
      placedBadge.textContent = '놓은 수 ' + placed + ' / 9';
      lineBadge.textContent = '완성된 줄 ' + done + ' / 8';

      if (placed === 9 && !solved) {
        if (done === 8) {
          solved = true;
          setFeedback('🎉 마방진 완성! 8개 줄이 모두 15입니다.', 'success');
        } else {
          setFeedback('아직 아니에요. 15가 아닌 줄(빨간색)을 고쳐보세요.', 'error');
        }
      }
    }

    // ==========================================================
    //  드래그 앤 드롭 (마우스 + 터치 공용)
    //  drag = { value, fromCell(또는 null), ghost }
    // ==========================================================
    let drag = null;

    function makeGhost(value, size) {
      const g = document.createElement('div');
      g.className = 'drag-ghost';
      g.textContent = value;
      g.style.width = size + 'px';
      g.style.height = size + 'px';
      g.style.fontSize = (size * 0.5) + 'px';
      document.body.appendChild(g);
      return g;
    }

    function startDrag(e, value, fromCell, srcEl) {
      const r = srcEl.getBoundingClientRect();
      drag = { value, fromCell, srcEl, ghost: makeGhost(value, Math.max(34, r.width)), moved: false,
               startX: e.clientX, startY: e.clientY };
      srcEl.classList.add('dragging');
      moveGhost(e.clientX, e.clientY);
      selectedChip = null;
    }

    function moveGhost(x, y) {
      drag.ghost.style.left = x + 'px';
      drag.ghost.style.top  = y + 'px';
    }

    function cellUnder(x, y) {
      for (let i = 0; i < cellEls.length; i++) {
        const r = cellEls[i].getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i;
      }
      return -1;
    }
    function overTray(x, y) {
      const r = trayEl.getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    }

    function clearHighlights() {
      cellEls.forEach(el => el.classList.remove('drop-ok', 'drop-swap'));
      trayEl.classList.remove('drop-ok');
    }

    wrapper.addEventListener('pointerdown', (e) => {
      if (drag) return;

      const num = e.target.closest('.num');
      if (num) {
        e.preventDefault();
        startDrag(e, cellVals[parseInt(num.dataset.cell, 10)], parseInt(num.dataset.cell, 10), num);
        wrapper.setPointerCapture(e.pointerId);
        return;
      }
      const chip = e.target.closest('.chip');
      if (chip && !chip.classList.contains('used')) {
        e.preventDefault();
        startDrag(e, parseInt(chip.dataset.v, 10), null, chip);
        wrapper.setPointerCapture(e.pointerId);
      }
    });

    wrapper.addEventListener('pointermove', (e) => {
      if (!drag) return;
      if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 4) drag.moved = true;
      moveGhost(e.clientX, e.clientY);

      clearHighlights();
      const i = cellUnder(e.clientX, e.clientY);
      if (i >= 0 && i !== drag.fromCell) {
        cellEls[i].classList.add(cellVals[i] === 0 ? 'drop-ok' : 'drop-swap');
      } else if (drag.fromCell !== null && overTray(e.clientX, e.clientY)) {
        trayEl.classList.add('drop-ok');
      }
    });

    wrapper.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const { value, fromCell, srcEl, moved } = drag;
      const x = e.clientX, y = e.clientY;

      drag.ghost.remove();
      srcEl.classList.remove('dragging');
      drag = null;
      clearHighlights();

      if (!moved) { handleClick(value, fromCell); return; }   // 안 움직였으면 클릭으로 처리

      const i = cellUnder(x, y);
      if (i >= 0) {
        if (fromCell === null) {
          placeAt(i, value);                       // 보관함 → 칸 (있던 수는 자동 회수)
          setFeedback(value + '을(를) 놓았습니다.', 'info');
        } else if (i !== fromCell) {
          moveCell(fromCell, i);                   // 칸 → 칸 (차 있으면 교환)
          setFeedback(cellVals[i] + '을(를) 옮겼습니다.', 'info');
        }
      } else if (fromCell !== null) {
        removeAt(fromCell);                        // 칸 → 밖 (보관함으로 회수)
        setFeedback(value + '을(를) 보관함으로 되돌렸습니다.', 'info');
      }
      render();
    });

    wrapper.addEventListener('pointercancel', () => {
      if (!drag) return;
      drag.ghost.remove();
      drag.srcEl.classList.remove('dragging');
      drag = null;
      clearHighlights();
      render();
    });

    // ---------- 클릭 방식 (드래그가 어려운 경우) ----------
    function handleClick(value, fromCell) {
      if (fromCell !== null) {
        removeAt(fromCell);
        setFeedback(value + '을(를) 보관함으로 되돌렸습니다.', 'info');
        render();
        return;
      }
      selectedChip = (selectedChip === value) ? null : value;
      if (selectedChip) setFeedback(selectedChip + '을(를) 골랐습니다. 칸을 클릭하거나 끌어다 놓으세요.', 'info');
      render();
    }

    magicEl.addEventListener('click', (e) => {
      const cell = e.target.closest('.msq');
      if (!cell || selectedChip === null) return;
      placeAt(parseInt(cell.dataset.i, 10), selectedChip);
      selectedChip = null;
      render();
    });

    hintBtn.addEventListener('click', () => {
      hintOn = !hintOn;
      setFeedback(hintOn
        ? '1+2+…+9 = 45이고 가로 3줄로 나누면 한 줄은 45÷3 = 15. 가운데 칸은 4개의 줄이 지나므로 반드시 5입니다.'
        : '숫자를 칸으로 끌어다 놓으세요. (클릭해도 됩니다)', 'info');
    });

    resetBtn.addEventListener('click', () => {
      cellVals = new Array(9).fill(0);
      selectedChip = null;
      solved = false;
      setFeedback('숫자를 칸으로 끌어다 놓으세요. (클릭해도 됩니다)', 'info');
      render();
    });

    buildBoard();
    buildTray();
    render();

  </script>
</body>
</html>
