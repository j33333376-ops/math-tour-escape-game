<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>라이트 아웃 (불끄기)</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      width: 38vw;
      max-width: 440px;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .control-group {
      background: var(--primary-soft);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .control-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .col-badge {
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .col-badge.accent { background: var(--accent); }
    .col-badge.muted  { background: #94a3b8; }

    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; }

    .stat-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-row { display: flex; gap: 8px; }

    .btn-check, .btn-ghost {
      border-radius: var(--radius-ctrl);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex: 1;
    }
    .btn-check { background: var(--primary); color: #fff; border: none; }
    .btn-check:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-check:active:not(:disabled) { transform: translateY(1px); }
    .btn-ghost { background: var(--card-bg); color: var(--primary-dark); border: 1px solid var(--border-color); }
    .btn-ghost:hover:not(:disabled) { background: var(--primary-soft); }
    .btn-ghost:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .answer-group { padding-top: 16px; border-top: 2px dashed var(--border-color); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
      word-break: keep-all;
      line-height: 1.45;
    }
    .feedback.success { color: var(--success); }
    .feedback.error   { color: var(--error); }
    .feedback.info    { color: var(--text-muted); }

    .board-side {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 10px;
    }

    .board-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    @media (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding-top: 2vh; gap: 12px; }
      .panel-side { width: 96vw; max-width: none; padding: 16px; }
      .board-side { width: 96vw; flex: 1; padding: 0 0 2vh 0; }
      .header-block p { margin-bottom: 12px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.2rem; }
      .header-block p { display: none; }
      .control-group { padding: 8px 12px; margin-bottom: 10px; }
      .stat-row { margin-bottom: 8px; }
    }

    /* ===== 라이트 아웃 전용 ===== */
    .board-wrapper { width: min(78vmin, 560px); aspect-ratio: 1 / 1; padding: 3%; }

    .lights {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3%;
      width: 100%;
      height: 100%;
    }

    .light {
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: #e2e8f0;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.1s ease, box-shadow 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.9rem, 3vmin, 1.6rem);
      color: transparent;
      user-select: none;
    }
    .light:active { transform: scale(0.94); }
    .light.on {
      background: var(--accent);
      border-color: #c2410c;
      box-shadow: 0 0 18px rgba(234, 88, 12, 0.45), inset 0 2px 6px rgba(255,255,255,0.3);
      color: #fff7ed;
    }
    .light.hint { outline: 3px dashed var(--primary); outline-offset: -6px; }

    .lights.done .light { cursor: default; }

    .note {
      background: var(--accent-soft);
      border: 1px solid #fed7aa;
      border-radius: var(--radius-ctrl);
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #9a3412;
      line-height: 1.5;
      word-break: keep-all;
      margin-bottom: 14px;
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    @media (orientation: portrait) {
      .panel-side { max-height: 54%; flex: 0 0 auto; }
      .board-side { flex: 1 1 auto; }
    }

    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>라이트 아웃 (불끄기)</h2>
        <p>칸을 누르면 그 칸과 <b>상하좌우 4칸</b>이 함께 뒤집힙니다.<br>모든 불을 끄면 성공!</p>
      </div>

      <div class="note">
        💡 같은 칸을 <b>두 번</b> 누르면 처음 상태로 돌아옵니다. 그러니 각 칸은 <b>0번 또는 1번</b>만 누르면 되고, 누르는 <b>순서는 상관없습니다</b>. (2로 나눈 나머지 = 모듈러 2 연산)
      </div>

      <div class="control-group">
        <div class="control-header">
          <label>난이도 (섞기 횟수)</label>
          <span class="col-badge" id="diffBadge">4회</span>
        </div>
        <input type="range" id="diffSlider" min="2" max="12" value="4" step="1">
      </div>

      <div class="stat-row">
        <span class="col-badge muted" id="moveBadge">누른 횟수 0</span>
        <span class="col-badge accent" id="onBadge">켜진 불 0</span>
      </div>

      <div class="btn-row">
        <button class="btn-ghost" id="undoBtn">↶ 되돌리기</button>
        <button class="btn-ghost" id="againBtn">↺ 처음부터</button>
        <button class="btn-check" id="newBtn">🔄 새 문제</button>
      </div>

      <div class="answer-group" style="margin-top:16px">
        <div class="feedback info" id="feedback">불이 켜진 칸을 눌러 모두 꺼보세요.</div>
      </div>
    </div>

    <div class="board-side">
      <div class="board-wrapper">
        <div class="lights" id="lights"></div>
      </div>
    </div>
  </div>

  <script>

    // ==========================================================
    //  라이트 아웃 — 5x5, 모듈러 2(짝/홀) 연산
    //  섞기: 꺼진 상태에서 무작위로 k칸을 눌러 만든다 => 항상 풀 수 있음
    // ==========================================================
    const N = 5;

    const lightsEl  = document.getElementById('lights');
    const diffSlider = document.getElementById('diffSlider');
    const diffBadge = document.getElementById('diffBadge');
    const moveBadge = document.getElementById('moveBadge');
    const onBadge   = document.getElementById('onBadge');
    const undoBtn   = document.getElementById('undoBtn');
    const againBtn  = document.getElementById('againBtn');
    const newBtn    = document.getElementById('newBtn');
    const feedback  = document.getElementById('feedback');

    let grid = [];        // 0 = 꺼짐, 1 = 켜짐
    let initialGrid = []; // '처음부터' 용
    let moves = 0;
    let history = [];
    let finished = false;
    let cells = [];

    function idx(r, c) { return r * N + c; }

    function buildCells() {
      lightsEl.innerHTML = '';
      cells = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const d = document.createElement('div');
          d.className = 'light';
          d.dataset.r = r;
          d.dataset.c = c;
          d.textContent = '💡';
          lightsEl.appendChild(d);
          cells.push(d);
        }
      }
    }

    function press(r, c, arr) {
      const deltas = [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]];
      for (const [dr, dc] of deltas) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < N && nc >= 0 && nc < N) arr[idx(nr, nc)] ^= 1;
      }
    }

    function newPuzzle() {
      const k = parseInt(diffSlider.value, 10);
      do {
        grid = new Array(N * N).fill(0);
        const used = new Set();
        while (used.size < k) used.add(Math.floor(Math.random() * N * N));
        used.forEach(i => press(Math.floor(i / N), i % N, grid));
      } while (grid.every(v => v === 0));   // 이미 다 꺼진 상태는 다시 뽑기

      initialGrid = grid.slice();
      restart(false);
    }

    function restart(keepMsg) {
      grid = initialGrid.slice();
      moves = 0;
      history = [];
      finished = false;
      if (!keepMsg) setFeedback('불이 켜진 칸을 눌러 모두 꺼보세요.', 'info');
      render();
    }

    function setFeedback(t, k) {
      feedback.textContent = t;
      feedback.className = 'feedback ' + k;
    }

    function render() {
      const onCount = grid.reduce((a, b) => a + b, 0);
      moveBadge.textContent = '누른 횟수 ' + moves;
      onBadge.textContent = '켜진 불 ' + onCount;
      undoBtn.disabled = history.length === 0 || finished;
      lightsEl.classList.toggle('done', finished);

      cells.forEach((el, i) => el.classList.toggle('on', grid[i] === 1));

      if (onCount === 0 && !finished) {
        finished = true;
        setFeedback('🎉 모든 불을 껐습니다! ' + moves + '번 눌렀어요.', 'success');
        undoBtn.disabled = true;
      }
    }

    lightsEl.addEventListener('click', (e) => {
      if (finished) return;
      const el = e.target.closest('.light');
      if (!el) return;
      const r = parseInt(el.dataset.r, 10), c = parseInt(el.dataset.c, 10);
      press(r, c, grid);
      history.push([r, c]);
      moves++;
      render();
    });

    undoBtn.addEventListener('click', () => {
      if (finished || history.length === 0) return;
      const [r, c] = history.pop();
      press(r, c, grid);   // 같은 칸을 다시 누르면 원상복구
      moves--;
      setFeedback('되돌렸습니다.', 'info');
      render();
    });

    againBtn.addEventListener('click', () => restart(false));
    newBtn.addEventListener('click', newPuzzle);

    diffSlider.addEventListener('input', (e) => {
      diffBadge.textContent = e.target.value + '회';
      newPuzzle();
    });

    buildCells();
    newPuzzle();

  </script>
</body>
</html>
