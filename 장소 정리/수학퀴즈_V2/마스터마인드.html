<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>마스터마인드</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      width: 38vw;
      max-width: 440px;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .control-group {
      background: var(--primary-soft);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .control-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .col-badge {
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .col-badge.accent { background: var(--accent); }
    .col-badge.muted  { background: #94a3b8; }

    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; }

    .stat-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-row { display: flex; gap: 8px; }

    .btn-check, .btn-ghost {
      border-radius: var(--radius-ctrl);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex: 1;
    }
    .btn-check { background: var(--primary); color: #fff; border: none; }
    .btn-check:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-check:active:not(:disabled) { transform: translateY(1px); }
    .btn-ghost { background: var(--card-bg); color: var(--primary-dark); border: 1px solid var(--border-color); }
    .btn-ghost:hover:not(:disabled) { background: var(--primary-soft); }
    .btn-ghost:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .answer-group { padding-top: 16px; border-top: 2px dashed var(--border-color); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
      word-break: keep-all;
      line-height: 1.45;
    }
    .feedback.success { color: var(--success); }
    .feedback.error   { color: var(--error); }
    .feedback.info    { color: var(--text-muted); }

    .board-side {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 10px;
    }

    .board-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    @media (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding-top: 2vh; gap: 12px; }
      .panel-side { width: 96vw; max-width: none; padding: 16px; }
      .board-side { width: 96vw; flex: 1; padding: 0 0 2vh 0; }
      .header-block p { margin-bottom: 12px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.2rem; }
      .header-block p { display: none; }
      .control-group { padding: 8px 12px; margin-bottom: 10px; }
      .stat-row { margin-bottom: 8px; }
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    @media (orientation: portrait) {
      .panel-side { max-height: 54%; flex: 0 0 auto; }
      .board-side { flex: 1 1 auto; }
    }

    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* 부가 공통 유틸 (일부 퍼즐에서 사용) */
    .note {
      background: var(--accent-soft);
      border: 1px solid #fed7aa;
      border-radius: var(--radius-ctrl);
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #9a3412;
      line-height: 1.5;
      word-break: keep-all;
      margin-bottom: 14px;
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ===== 마스터마인드 전용 ===== */
    /* 옵션 세그먼트 컨트롤 */
    .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .opt-row + .opt-row { margin-top: 10px; }
    .opt-row > label { font-weight: 700; font-size: 0.88rem; color: var(--text-main); }
    .seg {
      display: inline-flex;
      border: 1px solid var(--border-color);
      border-radius: 9px;
      overflow: hidden;
      background: #fff;
    }
    .seg button {
      border: none;
      background: #fff;
      color: var(--text-muted);
      padding: 5px 13px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .seg button + button { border-left: 1px solid var(--border-color); }
    .seg button.on { background: var(--primary); color: #fff; }

    /* 보드: 세로로 시도 행을 쌓는다 */
    .board-wrapper {
      width: min(58vmin, 380px);
      height: min(96%, 760px);
      flex-direction: column;
      padding: clamp(10px, 2.4vmin, 18px);
      gap: clamp(6px, 1.4vmin, 12px);
    }

    .mm-board {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      gap: clamp(5px, 1.2vmin, 10px);
      user-select: none;
    }

    /* 비밀코드 행 (상단, 게임 끝나면 공개) */
    .secret-row {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.6vmin, 12px);
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-radius: 12px;
      padding: clamp(5px, 1.2vmin, 9px) clamp(8px, 1.8vmin, 14px);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.35);
    }
    .secret-row .row-tag {
      color: #cbd5e1;
      font-weight: 800;
      font-size: clamp(0.62rem, 1.7vmin, 0.86rem);
      letter-spacing: .04em;
      flex: 0 0 auto;
      width: clamp(30px, 8vmin, 46px);
    }
    .secret-row .pegs { flex: 1 1 auto; }

    /* 시도 행 영역 — 남는 공간을 10행이 균등 분할 */
    .attempts {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 1vmin, 8px);
      min-height: 0;
    }

    .attempt-row {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.6vmin, 12px);
      border-radius: 11px;
      padding: 0 clamp(6px, 1.4vmin, 11px);
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      transition: box-shadow 0.18s, border-color 0.18s, background 0.18s;
    }
    .attempt-row.done   { background: #f8fafc; }
    .attempt-row.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37,99,235,.18), 0 6px 14px -8px rgba(37,99,235,.5);
    }
    .attempt-row.future { opacity: 0.62; }

    .row-no {
      flex: 0 0 auto;
      width: clamp(16px, 4vmin, 24px);
      text-align: center;
      font-weight: 800;
      font-size: clamp(0.6rem, 1.6vmin, 0.85rem);
      color: var(--text-muted);
    }

    /* 4칸 코드 페그 묶음 */
    .pegs {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: clamp(3px, 1vmin, 8px);
      min-width: 0;
    }

    .peg {
      flex: 0 0 auto;
      height: 74%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #e2e8f0;
      box-shadow: inset 0 3px 6px rgba(15,23,42,.20), inset 0 -2px 3px rgba(255,255,255,.7);
      transition: transform 0.1s, box-shadow 0.18s, outline-color 0.18s;
    }
    .peg.filled {
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,.55),
        inset 0 -3px 6px rgba(0,0,0,.25),
        0 3px 6px rgba(15,23,42,.28);
      border: 1px solid rgba(255,255,255,.35);
    }
    .attempt-row.active .peg { cursor: pointer; }
    .attempt-row.active .peg:hover { transform: translateY(-2px); }
    .attempt-row.active .peg.slot-active {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
      box-shadow: 0 0 12px rgba(37,99,235,.5), inset 0 3px 6px rgba(15,23,42,.20);
    }

    /* 피드백 핀 2x2 */
    .pins {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 14%;
      height: 66%;
      aspect-ratio: 1 / 1;
    }
    .pin {
      border-radius: 50%;
      background: #cbd5e1;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.25);
    }
    .pin.black {
      background: radial-gradient(circle at 34% 30%, #64748b, #0f172a 70%);
      box-shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    .pin.white {
      background: radial-gradient(circle at 34% 30%, #ffffff, #cbd5e1 78%);
      box-shadow: 0 1px 2px rgba(0,0,0,.28);
      border: 1px solid #94a3b8;
    }

    /* 하단 플레이 영역: 팔레트 + 제출 */
    .play-footer {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.4vmin, 11px);
      padding-top: clamp(4px, 1vmin, 8px);
      border-top: 2px dashed var(--border-color);
    }
    .palette {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(5px, 1.6vmin, 12px);
      flex-wrap: wrap;
    }
    .swatch {
      width: clamp(26px, 6.6vmin, 42px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.6);
      cursor: pointer;
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,.55),
        inset 0 -3px 6px rgba(0,0,0,.25),
        0 3px 7px rgba(15,23,42,.28);
      transition: transform 0.12s, box-shadow 0.18s;
    }
    .swatch:hover { transform: translateY(-3px) scale(1.06); }
    .swatch:active { transform: translateY(0) scale(0.96); }

    .mm-submit {
      border: none;
      border-radius: var(--radius-ctrl);
      padding: clamp(8px, 1.8vmin, 12px) 16px;
      font-weight: 800;
      font-size: clamp(0.86rem, 2.1vmin, 1rem);
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      box-shadow: 0 6px 14px -6px rgba(234,88,12,.6);
    }
    .mm-submit:hover:not(:disabled) { background: #c2410c; }
    .mm-submit:active:not(:disabled) { transform: translateY(1px); }
    .mm-submit:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    .play-footer.hidden { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .peg, .swatch { transition: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>마스터마인드</h2>
        <p>숨겨진 <b>색 코드 4개</b>를 <b>10번</b> 안에 맞히세요.<br>제출하면 힌트 핀으로 정답에 다가갑니다.</p>
      </div>

      <div class="note">
        💡 <b>검정 핀</b> = 색과 위치가 모두 맞은 개수, <b>흰 핀</b> = 색은 있으나 위치가 틀린 개수. (중복 색도 표준 규칙으로 계산)
      </div>

      <div class="control-group">
        <div class="opt-row">
          <label>색 개수</label>
          <div class="seg" id="colorSeg">
            <button data-n="6" class="on">6색</button>
            <button data-n="8">8색</button>
          </div>
        </div>
        <div class="opt-row">
          <label>색 중복</label>
          <div class="seg" id="dupSeg">
            <button data-dup="1" class="on">허용</button>
            <button data-dup="0">금지</button>
          </div>
        </div>
      </div>

      <div class="stat-row">
        <span class="col-badge muted" id="tryBadge">시도 0 / 10</span>
        <span class="col-badge accent" id="leftBadge">남은 10회</span>
      </div>

      <div class="btn-row">
        <button class="btn-ghost" id="undoBtn">⌫ 되돌리기</button>
        <button class="btn-ghost" id="clearBtn">✕ 지우기</button>
        <button class="btn-check" id="newBtn">🔄 새 게임</button>
      </div>

      <div class="answer-group" style="margin-top:16px">
        <div class="feedback info" id="feedback">팔레트에서 색을 골라 현재 행을 채우세요.</div>
      </div>
    </div>

    <div class="board-side">
      <div class="board-wrapper">
        <div class="mm-board">
          <div class="secret-row">
            <span class="row-tag">비밀</span>
            <div class="pegs" id="secretPegs"></div>
          </div>
          <div class="attempts" id="attempts"></div>
          <div class="play-footer" id="playFooter">
            <div class="palette" id="palette"></div>
            <button class="mm-submit" id="submitBtn" disabled>제출</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>

    // ==========================================================
    //  마스터마인드 — 색 코드 4자리, 10회 시도
    //  채점(표준 중복 처리):
    //    검정 = 위치+색 모두 일치
    //    흰색 = 색은 있으나 위치가 틀림 (남은 색상 빈도의 min 합)
    // ==========================================================
    const CODE_LEN = 4;
    const MAX_ROWS = 10;

    // 색: {이름, 밝은표면, 어두운테두리}
    const COLORS = [
      { name: '빨강', base: '#ef4444', dark: '#b91c1c' },
      { name: '주황', base: '#f97316', dark: '#c2410c' },
      { name: '노랑', base: '#facc15', dark: '#ca8a04' },
      { name: '초록', base: '#22c55e', dark: '#15803d' },
      { name: '파랑', base: '#3b82f6', dark: '#1d4ed8' },
      { name: '보라', base: '#a855f7', dark: '#7c3aed' },
      { name: '청록', base: '#14b8a6', dark: '#0f766e' },
      { name: '분홍', base: '#ec4899', dark: '#be185d' }
    ];

    const secretPegsEl = document.getElementById('secretPegs');
    const attemptsEl   = document.getElementById('attempts');
    const paletteEl    = document.getElementById('palette');
    const playFooter   = document.getElementById('playFooter');
    const submitBtn    = document.getElementById('submitBtn');
    const tryBadge     = document.getElementById('tryBadge');
    const leftBadge    = document.getElementById('leftBadge');
    const undoBtn      = document.getElementById('undoBtn');
    const clearBtn     = document.getElementById('clearBtn');
    const newBtn       = document.getElementById('newBtn');
    const feedback     = document.getElementById('feedback');
    const colorSeg     = document.getElementById('colorSeg');
    const dupSeg       = document.getElementById('dupSeg');

    let colorCount = 6;    // 6 또는 8
    let allowDup   = true; // 색 중복 허용 여부
    let secret     = [];   // 비밀코드 (색 인덱스 4개)
    let rows       = [];   // 제출된 시도 [{code:[..], black, white}]
    let current    = [];   // 현재 행 (null 또는 색 인덱스)
    let active     = 0;    // 다음에 채울 칸
    let finished   = false;
    let won        = false;

    // 유리구슬 표면 그라디언트
    function sphere(ci) {
      const c = COLORS[ci];
      return 'radial-gradient(circle at 34% 30%, rgba(255,255,255,.9) 0%, rgba(255,255,255,.25) 16%, '
        + c.base + ' 56%, ' + c.dark + ' 100%)';
    }

    // ---------- 채점 함수 (node 로 검증한 표준 알고리즘) ----------
    function score(secretArr, guess) {
      let black = 0;
      const sc = {}, gc = {};
      for (let i = 0; i < CODE_LEN; i++) {
        if (secretArr[i] === guess[i]) {
          black++;
        } else {
          sc[secretArr[i]] = (sc[secretArr[i]] || 0) + 1;
          gc[guess[i]] = (gc[guess[i]] || 0) + 1;
        }
      }
      let white = 0;
      for (const k in gc) if (sc[k]) white += Math.min(sc[k], gc[k]);
      return { black, white };
    }

    function genSecret() {
      const code = [];
      if (allowDup) {
        for (let i = 0; i < CODE_LEN; i++) code.push(Math.floor(Math.random() * colorCount));
      } else {
        const pool = [];
        for (let i = 0; i < colorCount; i++) pool.push(i);
        for (let i = pool.length - 1; i > 0; i--) {   // 피셔-예이츠 셔플
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        for (let i = 0; i < CODE_LEN; i++) code.push(pool[i]);
      }
      return code;
    }

    function setFeedback(t, k) {
      feedback.textContent = t;
      feedback.className = 'feedback ' + k;
    }

    function newGame() {
      secret = genSecret();
      rows = [];
      current = new Array(CODE_LEN).fill(null);
      active = 0;
      finished = false;
      won = false;
      setFeedback('팔레트에서 색을 골라 현재 행을 채우세요.', 'info');
      buildPalette();
      render();
    }

    function buildPalette() {
      paletteEl.innerHTML = '';
      for (let i = 0; i < colorCount; i++) {
        const s = document.createElement('div');
        s.className = 'swatch';
        s.style.background = sphere(i);
        s.title = COLORS[i].name;
        s.dataset.ci = i;
        paletteEl.appendChild(s);
      }
    }

    function firstEmpty() {
      for (let i = 0; i < CODE_LEN; i++) if (current[i] === null) return i;
      return -1;
    }
    function isFull() { return current.every(v => v !== null); }

    // 페그 DOM 생성
    function makePeg(ci, cls) {
      const p = document.createElement('div');
      p.className = 'peg' + (cls || '');
      if (ci !== null && ci !== undefined) {
        p.classList.add('filled');
        p.style.background = sphere(ci);
      }
      return p;
    }

    // 피드백 핀 2x2
    function makePins(black, white) {
      const box = document.createElement('div');
      box.className = 'pins';
      for (let i = 0; i < CODE_LEN; i++) {
        const pin = document.createElement('div');
        pin.className = 'pin' + (i < black ? ' black' : (i < black + white ? ' white' : ''));
        box.appendChild(pin);
      }
      return box;
    }

    function render() {
      // 비밀 행
      secretPegsEl.innerHTML = '';
      for (let i = 0; i < CODE_LEN; i++) {
        if (finished) {
          secretPegsEl.appendChild(makePeg(secret[i]));
        } else {
          const p = makePeg(null);
          p.style.background = '#334155';
          p.style.boxShadow = 'inset 0 2px 4px rgba(0,0,0,.5)';
          p.textContent = '';
          secretPegsEl.appendChild(p);
        }
      }

      // 시도 행들 (위=1행)
      attemptsEl.innerHTML = '';
      for (let r = 0; r < MAX_ROWS; r++) {
        const row = document.createElement('div');
        row.className = 'attempt-row';
        const no = document.createElement('span');
        no.className = 'row-no';
        no.textContent = (r + 1);
        row.appendChild(no);

        const pegs = document.createElement('div');
        pegs.className = 'pegs';

        if (r < rows.length) {
          // 제출 완료 행
          row.classList.add('done');
          rows[r].code.forEach(ci => pegs.appendChild(makePeg(ci)));
          row.appendChild(pegs);
          row.appendChild(makePins(rows[r].black, rows[r].white));
        } else if (r === rows.length && !finished) {
          // 현재 활성 행
          row.classList.add('active');
          for (let i = 0; i < CODE_LEN; i++) {
            const cls = (i === active ? ' slot-active' : '');
            const p = makePeg(current[i], cls);
            p.dataset.slot = i;
            pegs.appendChild(p);
          }
          row.appendChild(pegs);
          row.appendChild(makePins(0, 0));
        } else {
          // 미래 행 (빈칸)
          row.classList.add('future');
          for (let i = 0; i < CODE_LEN; i++) pegs.appendChild(makePeg(null));
          row.appendChild(pegs);
          row.appendChild(makePins(0, 0));
        }
        attemptsEl.appendChild(row);
      }

      // 상태 뱃지 / 버튼
      tryBadge.textContent = '시도 ' + rows.length + ' / ' + MAX_ROWS;
      leftBadge.textContent = '남은 ' + (MAX_ROWS - rows.length) + '회';
      const filledAny = current.some(v => v !== null);
      undoBtn.disabled = finished || !filledAny;
      clearBtn.disabled = finished || !filledAny;
      submitBtn.disabled = finished || !isFull();
      playFooter.classList.toggle('hidden', finished);
    }

    // ---------- 상호작용 ----------
    function pickColor(ci) {
      if (finished) return;
      let slot = (current[active] === null) ? active : firstEmpty();
      if (slot === -1) slot = active;           // 꽉 찼으면 활성 칸 교체
      current[slot] = ci;
      const nxt = firstEmpty();
      active = (nxt === -1) ? slot : nxt;
      setFeedback(COLORS[ci].name + ' 칸을 채웠어요.', 'info');
      render();
    }

    function clickSlot(i) {
      if (finished) return;
      if (current[i] !== null) {
        current[i] = null;    // 채워진 칸 클릭 → 삭제
        active = i;
      } else {
        active = i;           // 빈 칸 클릭 → 그 칸 지정
      }
      render();
    }

    function undoPeg() {
      if (finished) return;
      // 가장 오른쪽에 채워진 칸을 지움
      for (let i = CODE_LEN - 1; i >= 0; i--) {
        if (current[i] !== null) { current[i] = null; active = i; break; }
      }
      render();
    }

    function clearRow() {
      if (finished) return;
      current = new Array(CODE_LEN).fill(null);
      active = 0;
      setFeedback('현재 행을 비웠습니다.', 'info');
      render();
    }

    function submit() {
      if (finished || !isFull()) return;
      const guess = current.slice();
      const res = score(secret, guess);
      rows.push({ code: guess, black: res.black, white: res.white });
      current = new Array(CODE_LEN).fill(null);
      active = 0;

      if (res.black === CODE_LEN) {
        finished = true; won = true;
        setFeedback('🎉 정답! ' + rows.length + '번 만에 비밀 코드를 맞혔어요!', 'success');
      } else if (rows.length >= MAX_ROWS) {
        finished = true; won = false;
        const names = secret.map(ci => COLORS[ci].name).join(' · ');
        setFeedback('😢 실패! 비밀 코드는 [ ' + names + ' ] 였어요. 새 게임에 도전!', 'error');
      } else {
        setFeedback('검정 ' + res.black + ' · 흰색 ' + res.white
          + '  —  남은 ' + (MAX_ROWS - rows.length) + '회', 'info');
      }
      render();
    }

    // ---------- 이벤트 ----------
    paletteEl.addEventListener('click', (e) => {
      const s = e.target.closest('.swatch');
      if (s) pickColor(parseInt(s.dataset.ci, 10));
    });

    attemptsEl.addEventListener('click', (e) => {
      const peg = e.target.closest('.peg');
      if (!peg) return;
      const row = peg.closest('.attempt-row');
      if (!row || !row.classList.contains('active')) return;
      if (peg.dataset.slot !== undefined) clickSlot(parseInt(peg.dataset.slot, 10));
    });

    submitBtn.addEventListener('click', submit);
    undoBtn.addEventListener('click', undoPeg);
    clearBtn.addEventListener('click', clearRow);
    newBtn.addEventListener('click', newGame);

    colorSeg.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      colorCount = parseInt(b.dataset.n, 10);
      [...colorSeg.children].forEach(x => x.classList.toggle('on', x === b));
      newGame();
    });

    dupSeg.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      allowDup = b.dataset.dup === '1';
      [...dupSeg.children].forEach(x => x.classList.toggle('on', x === b));
      newGame();
    });

    newGame();

  </script>
</body>
</html>
