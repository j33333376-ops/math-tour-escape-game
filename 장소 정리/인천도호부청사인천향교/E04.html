<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천도호부청사·인천향교 MATHTOUR - E03</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 공통 UI/UX 규칙 - 근대 개항기 스타일 */
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #f5f0e6; /* 연베이지 */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* 배경 이미지 */
        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 공통 버튼 */
        .btn-nav {
            position: absolute;
            background-color: #8c3030; /* 다크 레드 */
            color: white;
            border: 1px solid #d4af37; /* 앤틱 골드 */
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-nav:hover {
            background-color: #661f1f;
            transform: translateY(-2px);
        }

        #btn-prev { left: 20px; bottom: 20px; display: none; }
        #btn-next { right: 20px; bottom: 20px; display: none; }
        #btn-skip { right: 20px; bottom: 20px; }

        /* 캐릭터 래퍼 */
        .char-wrapper {
            position: absolute;
            z-index: 3;
            overflow: visible;
            transition: filter 0.2s ease-in-out;
        }

        .char-wrapper.inactive {
            filter: brightness(0.55);
        }

        /* 대화창 (유형2) */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 140px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #d4af37;
            border-radius: 4px;
            z-index: 10;
            padding: 20px 30px;
            box-sizing: border-box;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            color: #d4af37;
            font-size: 22px;
            font-weight: 700;
            margin: 0;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            color: #ffffff;
            font-size: 18px;
            line-height: 1.6;
            letter-spacing: -0.02em;
            margin: 0;
        }

        .click-indicator {
            position: absolute;
            right: 20px;
            bottom: 15px;
            color: #d4af37;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 스테이지 상단 표시바 */
        #stage-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #d4af37;
            padding: 8px 20px;
            z-index: 10;
            border-radius: 4px;
        }
        
        #stage-bar span {
            font-family: 'Nanum Myeongjo', serif;
            color: #d4af37;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지 -->
        <img class="bg-image" src="배경04.png" alt="명륜당 지붕 복원 배경">

        <!-- 스테이지 표시바 -->
        <div id="stage-bar">
            <span>인천향교 명륜당</span>
        </div>

        <!-- 등장인물: 민우 (왼쪽 배치, 배율 1.2 적용) -->
        <div id="char-민우" class="char-wrapper" style="left: 15%; bottom: 60px; width: 312px; height: 384px;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1.2); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장인물: 서연 (오른쪽 배치, 배율 1.2 적용, 왼쪽을 바라보도록 반전) -->
        <div id="char-서연" class="char-wrapper" style="right: 15%; bottom: 60px; width: 312px; height: 384px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1.2) scaleX(-1); transform-origin:bottom center; pointer-events:none;"></iframe>
        </div>

        <!-- 대화창 UI -->
        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name"></div>
            <div id="dialogue-text"></div>
            <div class="click-indicator">▼ 다음 (클릭)</div>
        </div>

        <!-- 네비게이션 버튼 -->
        <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
        <button id="btn-prev" class="btn-nav" onclick="location.href='E03.html'">이전</button>
        <button id="btn-next" class="btn-nav" onclick="location.href='index.html'">다음</button>
    </div>

    <script>
        // 스토리 및 대사 데이터 분리
        const dialogues = [
            { 
                speaker: '서연', 
                text: '성공이야! 네 완벽한 수학적 계산 덕분에 명륜당 지붕이 아주 튼튼하게 복원되었어.', 
                target: 'char-서연' 
            },
            { 
                speaker: '민우', 
                text: '선비님들이 다시 편안하게 공부하실 수 있겠어. 훌륭한 걸?', 
                target: 'char-민우' 
            },
            { 
                speaker: '서연', 
                text: '자, 이제 다음 미션 장소로 이동해 볼까?', 
                target: 'char-서연' 
            }
        ];

        let currentIndex = 0;

        function renderDialogue() {
            if (currentIndex >= dialogues.length) {
                endDialogue();
                return;
            }

            const current = dialogues[currentIndex];
            
            // 대사 텍스트 업데이트
            document.getElementById('speaker-name').innerText = current.speaker;
            document.getElementById('dialogue-text').innerText = current.text;

            // 모든 캐릭터 비활성화(어둡게)
            document.getElementById('char-민우').classList.add('inactive');
            document.getElementById('char-서연').classList.add('inactive');

            // 현재 말하는 캐릭터만 활성화(밝게)
            const activeChar = document.getElementById(current.target);
            if (activeChar) {
                activeChar.classList.remove('inactive');
            }
        }

        function advanceDialogue() {
            currentIndex++;
            renderDialogue();
        }

        function skipDialogue() {
            currentIndex = dialogues.length;
            renderDialogue(); // endDialogue로 즉시 분기됨
        }

        function endDialogue() {
            // 대화창 및 건너뛰기 버튼 숨김
            document.getElementById('dialogue-box').style.display = 'none';
            document.getElementById('btn-skip').style.display = 'none';

            // 모든 캐릭터 원래 밝기로 복구
            document.getElementById('char-민우').classList.remove('inactive');
            document.getElementById('char-서연').classList.remove('inactive');

            // 네비게이션(이전/다음) 버튼 표시
            document.getElementById('btn-prev').style.display = 'block';
            document.getElementById('btn-next').style.display = 'block';
        }

        // 페이지 로드 시 첫 대사 출력
        window.onload = () => {
            renderDialogue();
        };
    </script>

</body>
</html>
