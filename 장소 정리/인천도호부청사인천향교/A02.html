<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천도호부청사·인천향교 MATHTOUR - A02</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a1714;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      color: #2d3748;
    }

    /* 16:9 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #f5f0e6;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 2px solid #d4af37;
    }

    /* 배경 이미지 */
    #bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* 상단 스테이지 표시바 */
    #stage-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #d4af37;
      border-radius: 4px;
      padding: 8px 18px;
      color: #d4af37;
      font-family: 'Nanum Myeongjo', serif;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    /* 캐릭터 영역 (z-index: 3) */
    .char-wrapper {
      position: absolute;
      z-index: 3;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    /* 대화창 UI (z-index: 10) */
    #dialogue-box {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 130px;
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid #d4af37;
      border-radius: 6px;
      padding: 15px 25px;
      z-index: 10;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    #speaker-name {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 18px;
      font-weight: bold;
      color: #d4af37;
      margin-bottom: 8px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    #dialogue-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px;
      color: #ffffff;
      line-height: 1.6;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }

    #dialogue-hint {
      position: absolute;
      right: 20px;
      bottom: 10px;
      font-size: 12px;
      color: #d4af37;
      opacity: 0.8;
      animation: blink 1.2s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    /* 공통 버튼 디자인 */
    .btn-nav {
      position: absolute;
      z-index: 11;
      background-color: #8c3030;
      color: #ffffff;
      border: 1px solid #d4af37;
      border-radius: 4px;
      padding: 10px 24px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: background-color 0.2s;
    }

    .btn-nav:hover {
      background-color: #661f1f;
    }

    #btn-prev {
      left: 20px;
      bottom: 20px;
    }

    #btn-next, #btn-skip {
      right: 20px;
      bottom: 20px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 배경 이미지 -->
  <img id="bg-img" src="인천도호부청사_객사.png" alt="인천도호부청사 객사 배경">

  <!-- 스테이지 표시바 -->
  <div id="stage-bar">인천도호부청사 객사</div>

  <!-- 등장인물: 도호부사 (좌측) -->
  <div class="char-wrapper" id="char-도호부사" style="left: 120px; bottom: 40px; width: 260px; height: 320px; overflow: visible;">
    <iframe src="등장인물_도호부사.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
  </div>

  <!-- 등장인물: 민우 (우측 내측) -->
  <div class="char-wrapper" id="char-민우" style="left: 650px; bottom: 40px; width: 260px; height: 320px; overflow: visible;">
    <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
  </div>

  <!-- 등장인물: 서연 (우측 외측) -->
  <div class="char-wrapper" id="char-서연" style="left: 820px; bottom: 40px; width: 260px; height: 320px; overflow: visible;">
    <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
  </div>

  <!-- 대화창 UI -->
  <div id="dialogue-box" onclick="advanceDialogue()">
    <div id="speaker-name">화자</div>
    <div id="dialogue-text">대사 내용이 들어갑니다.</div>
    <div id="dialogue-hint">클릭하여 계속 ▼</div>
  </div>

  <!-- 이동 및 스킵 버튼 -->
  <button id="btn-prev" class="btn-nav" style="display: none;" onclick="goUrl('A01.html')">이전</button>
  <button id="btn-next" class="btn-nav" style="display: none;" onclick="goUrl('A03.html')">다음</button>
  <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
</div>

<script>
  // 대화 데이터 관리
  const dialogues = [
    {
      speaker: "도호부사",
      text: "어서 오게나. 자네들이 수학적 지혜로 문제를 해결해 준다는 소문을 듣고 기다리고 있었다네.",
      target: "char-도호부사"
    },
    {
      speaker: "서연",
      text: "안녕하세요, 도호부사님! 무슨 걱정이라도 있으신가요?",
      target: "char-서연"
    },
    {
      speaker: "도호부사",
      text: "다름이 아니라, 우리 객사 천장의 아름다운 단청 문양이 세월이 흘러 일부 훼손되고 말았다네.",
      target: "char-도호부사"
    },
    {
      speaker: "민우",
      text: "아, 단청 문양이군요! 화려하고 고풍스러운 기품이 느껴집니다.",
      target: "char-민우"
    },
    {
      speaker: "도호부사",
      text: "곧 중요한 손님들을 모셔야 하는데, 훼손된 부분을 원래대로 복원해야 한다네. 단청은 조화롭고 대칭적인 규칙을 가지고 있지.",
      target: "char-도호부사"
    },
    {
      speaker: "서연",
      text: "대칭성을 이용하면 본래의 아름다운 단청 문양을 완벽하게 복원할 수 있을 것 같아요!",
      target: "char-서연"
    },
    {
      speaker: "도호부사",
      text: "부디 그 대칭적인 문양의 원리를 잘 생각하여 훼손된 단청을 원래의 모습으로 복원해 주겠는가?",
      target: "char-도호부사"
    },
    {
      speaker: "민우",
      text: "걱정 마세요! 서연이와 힘을 합쳐 단청 문양을 멋지게 되살려 보겠습니다!",
      target: "char-민우"
    }
  ];

  let currentIndex = 0;

  function updateDialogue() {
    if (currentIndex < dialogues.length) {
      const current = dialogues[currentIndex];
      document.getElementById("speaker-name").innerText = current.speaker;
      document.getElementById("dialogue-text").innerText = current.text;

      // 캐릭터 하이라이트 (말하는 캐릭터만 활성화, 나머지는 비활성화)
      const wrappers = document.querySelectorAll('.char-wrapper');
      wrappers.forEach(wrapper => {
        if (wrapper.id === current.target) {
          wrapper.classList.remove('inactive');
        } else {
          wrapper.classList.add('inactive');
        }
      });
    } else {
      endDialogue();
    }
  }

  function advanceDialogue() {
    currentIndex++;
    updateDialogue();
  }

  function skipDialogue() {
    endDialogue();
  }

  function endDialogue() {
    // 대화창 및 건너뛰기 버튼 숨기기
    document.getElementById("dialogue-box").style.display = "none";
    document.getElementById("btn-skip").style.display = "none";

    // 모든 캐릭터 복구
    const wrappers = document.querySelectorAll('.char-wrapper');
    wrappers.forEach(wrapper => {
      wrapper.classList.remove('inactive');
    });

    // 이동 버튼 표시
    document.getElementById("btn-prev").style.display = "block";
    document.getElementById("btn-next").style.display = "block";
  }

  function goUrl(url) {
    if (url) {
      window.location.href = url;
    }
  }

  // 초기화
  window.onload = function() {
    updateDialogue();
  };
</script>

</body>
</html>
