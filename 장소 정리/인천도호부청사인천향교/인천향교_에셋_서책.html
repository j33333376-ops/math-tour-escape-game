<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서책</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .hsc-svg { display:block; width:100%; height:auto; }

</style>
</head>
<body>
<svg class="hsc-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="서책">
<title>서책</title>
<desc>향교 명륜당의 한적(옛 책) 더미와 붓.</desc>
<defs>
  <linearGradient id="hscCover" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9b45c"/><stop offset="1" stop-color="#a8812c"/>
  </linearGradient>
  <linearGradient id="hscCover2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fa8b8"/><stop offset="1" stop-color="#5f7f92"/>
  </linearGradient>
  <linearGradient id="hscCover3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c2745c"/><stop offset="1" stop-color="#8c452e"/>
  </linearGradient>
  <linearGradient id="hscPage" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#e0d4b4"/>
  </linearGradient>
</defs>
<ellipse cx="300" cy="518" rx="240" ry="28" fill="#4a3a20" opacity="0.2"/>
<!-- 아래 책 -->
<g transform="translate(300,470)">
  <path d="M-232,-46 L232,-46 L232,26 L-232,26 Z" fill="url(#hscPage)" stroke="#b8a678" stroke-width="4"/>
  <g stroke="#c9b890" stroke-width="2" opacity="0.8">
    <line x1="-232" y1="-32" x2="232" y2="-32"/><line x1="-232" y1="-18" x2="232" y2="-18"/>
    <line x1="-232" y1="-4" x2="232" y2="-4"/><line x1="-232" y1="10" x2="232" y2="10"/>
  </g>
  <path d="M-232,-46 L232,-46 L232,-58 L-232,-58 Z" fill="url(#hscCover)" stroke="#7d5c14" stroke-width="4"/>
  <path d="M-232,26 L232,26 L232,38 L-232,38 Z" fill="url(#hscCover)" stroke="#7d5c14" stroke-width="4"/>
  <g stroke="#7d5c14" stroke-width="4">
    <line x1="-200" y1="-58" x2="-200" y2="38"/><line x1="-160" y1="-58" x2="-160" y2="38"/>
    <line x1="160" y1="-58" x2="160" y2="38"/><line x1="200" y1="-58" x2="200" y2="38"/>
  </g>
</g>
<!-- 가운데 책 -->
<g transform="translate(292,390)">
  <path d="M-206,-40 L206,-40 L206,24 L-206,24 Z" fill="url(#hscPage)" stroke="#b8a678" stroke-width="4"/>
  <g stroke="#c9b890" stroke-width="2" opacity="0.8">
    <line x1="-206" y1="-26" x2="206" y2="-26"/><line x1="-206" y1="-12" x2="206" y2="-12"/>
    <line x1="-206" y1="2" x2="206" y2="2"/>
  </g>
  <path d="M-206,-40 L206,-40 L206,-52 L-206,-52 Z" fill="url(#hscCover2)" stroke="#3f5f70" stroke-width="4"/>
  <path d="M-206,24 L206,24 L206,36 L-206,36 Z" fill="url(#hscCover2)" stroke="#3f5f70" stroke-width="4"/>
  <g stroke="#3f5f70" stroke-width="4">
    <line x1="-176" y1="-52" x2="-176" y2="36"/><line x1="-138" y1="-52" x2="-138" y2="36"/>
    <line x1="138" y1="-52" x2="138" y2="36"/><line x1="176" y1="-52" x2="176" y2="36"/>
  </g>
</g>
<!-- 위 책 (제목 보이게) -->
<g transform="translate(300,300)">
  <path d="M-190,-52 L190,-52 L190,30 L-190,30 Z" fill="url(#hscCover3)" stroke="#6e2f1c" stroke-width="5"/>
  <path d="M-190,-52 L190,-52 L190,-64 L-190,-64 Z" fill="#a8563c" stroke="#6e2f1c" stroke-width="4"/>
  <!-- 제첨(제목표) -->
  <rect x="-160" y="-46" width="58" height="70" rx="4" fill="#f6efdc" stroke="#8c6a3a" stroke-width="3.4"/>
  <g stroke="#20201f" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M-142,-34 h22 M-131,-34 v20 M-142,-18 h22"/>
    <path d="M-142,-2 h22 M-131,-8 v22 M-142,12 h22"/>
  </g>
  <!-- 오침안정 (다섯 구멍 실) -->
  <g stroke="#3a3a3a" stroke-width="4">
    <line x1="150" y1="-64" x2="150" y2="30"/>
    <line x1="168" y1="-64" x2="168" y2="30"/>
  </g>
  <g fill="#3a3a3a">
    <circle cx="159" cy="-48" r="4"/><circle cx="159" cy="-24" r="4"/>
    <circle cx="159" cy="0" r="4"/><circle cx="159" cy="20" r="4"/>
  </g>
  <path d="M-190,-52 L190,-52" stroke="#e0a08c" stroke-width="4" opacity="0.5"/>
</g>
<!-- 붓 -->
<g transform="translate(210,200) rotate(-16)">
  <rect x="-8" y="-120" width="16" height="180" rx="8" fill="#d9b076" stroke="#8f6a34" stroke-width="3.4"/>
  <rect x="-10" y="54" width="20" height="16" rx="4" fill="#c2452e"/>
  <path d="M-10,70 C-10,108 -5,136 0,148 C5,136 10,108 10,70 Z" fill="#2b2318" stroke="#141008" stroke-width="3.4"/>
  <ellipse cx="0" cy="-120" rx="8" ry="4" fill="#8f6a34"/>
</g>
<!-- 도장 -->
<g transform="translate(452,236)">
  <rect x="-26" y="-70" width="52" height="70" rx="5" fill="#e8dcc0" stroke="#a89670" stroke-width="4"/>
  <rect x="-30" y="0" width="60" height="24" rx="5" fill="#c2452e" stroke="#8c2a1c" stroke-width="4"/>
  <path d="M-8,-70 C-8,-92 8,-92 8,-70 Z" fill="#a89670"/>
  <g stroke="#8c6a3a" stroke-width="2.4" opacity="0.7">
    <line x1="-18" y1="-52" x2="18" y2="-52"/><line x1="-18" y1="-32" x2="18" y2="-32"/>
  </g>
</g>
</svg>
</body>
</html>
