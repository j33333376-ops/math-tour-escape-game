<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천도호부청사·인천향교 MATHTOUR - 명륜당</title>
    
    <!-- 폰트 로드 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 초기화 및 배경 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* 컨테이너 외곽 배경 (어둡게) */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 16:9 게임 컨테이너 */
        #game-container {
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6; /* 기본 연베이지 배경 */
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* 배경 이미지 */
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 스테이지 상단 표시바 */
        #stage-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            border-bottom: 2px solid #d4af37; /* 앤틱 골드 */
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            padding: 12px 0;
            z-index: 20;
            box-sizing: border-box;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* 인물 래퍼 */
        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            z-index: 3;
        }

        /* 유형 1: 상황 설명 박스 (양피지 느낌) */
        #situation-box {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            max-width: 740px;
            background-color: #f5f0e6; /* 양피지 느낌의 연베이지 */
            border: 3px solid #d4af37; /* 앤틱 골드 테두리 */
            border-radius: 6px;
            padding: 35px 45px;
            box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.7);
            z-index: 10;
            text-align: center;
            
            /* 폰트 규칙 적용 */
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.25rem;
            color: #2d3748;
            line-height: 1.6;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        #situation-box strong {
            color: #8c3030; /* 다크 레드 강조 */
            font-weight: 700;
            font-size: 1.35rem;
            display: block;
            margin-top: 15px;
        }

        /* 공통 이동 버튼 */
        .btn-nav {
            position: absolute;
            background-color: #8c3030; /* 다크 레드 */
            color: white;
            border: 1px solid #d4af37; /* 앤틱 골드 */
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            letter-spacing: -0.02em;
        }

        .btn-nav:hover {
            background-color: #661f1f; /* 호버 시 어둡게 */
            transform: scale(1.05);
        }

        /* 버튼 위치 고정 */
        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next {
            right: 20px;
            bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 배경 이미지 -->
        <img src="배경01.png" class="bg-img" alt="인천향교 명륜당 배경">

        <!-- 스테이지 상단 표시바 -->
        <div id="stage-header">인천도호부청사·인천향교 MATHTOUR</div>

        <!-- 등장 인물: 민우 (좌측 배치) -->
        <div class="char-wrapper" id="char-민우" style="left: 120px; bottom: 30px;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 등장 인물: 서연 (우측 배치, 민우와 마주보도록 좌우 반전 처리) -->
        <!-- scaleX(-1) 적용 시 기준점(bottom left)에 의해 왼쪽으로 260px 이동하므로 left 값을 그만큼 더해 위치를 보정함 -->
        <div class="char-wrapper" id="char-서연" style="left: 946px; bottom: 30px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 상황 설명 박스 (유형 1) -->
        <div id="situation-box">
            <p>
                큰일이네! 며칠 전 불어닥친 태풍 때문에 명륜당 지붕 기와가 와르르 무너져 내렸어.<br>
                옛 선비들이 공부하던 소중한 곳인데...<br>
                <strong>네가 도편수가 되어 지붕을 원래대로 복원해 주지 않을래?</strong>
            </p>
        </div>

        <!-- 이동 버튼 (JS window.location.href 로 이동) -->
        <button class="btn-nav" id="btn-prev" onclick="window.location.href='index.html'">이전</button>
        <button class="btn-nav" id="btn-next" onclick="window.location.href='E02.html'">다음</button>
    </div>

</body>
</html>
