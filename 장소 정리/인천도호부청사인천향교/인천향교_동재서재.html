<!-- 원본 크기: 1200x700 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인천향교 - 동재·서재</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .jae-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="jae-svg" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천향교 동재 서재 장면">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c6e2f1"/><stop offset="100%" stop-color="#edf6f8"/>
    </linearGradient>
    <linearGradient id="grd2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9cba4"/><stop offset="100%" stop-color="#c5b489"/>
    </linearGradient>
    <linearGradient id="roof2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#586576"/><stop offset="100%" stop-color="#3a434f"/>
    </linearGradient>
    <linearGradient id="wood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a2e"/><stop offset="100%" stop-color="#6a4420"/>
    </linearGradient>
    <g id="hanok">
      <!-- 기단(돌) -->
      <rect x="-182" y="92" width="364" height="46" fill="#a9a08e" stroke="#867d6b" stroke-width="2"/>
      <!-- 마루(툇마루) -->
      <rect x="-170" y="74" width="340" height="22" fill="#a06f3c" stroke="#6a4420" stroke-width="1.5"/>
      <g stroke="#7c542b" stroke-width="1.5" opacity="0.6"><line x1="-120" y1="74" x2="-120" y2="96"/><line x1="-40" y1="74" x2="-40" y2="96"/><line x1="40" y1="74" x2="40" y2="96"/><line x1="120" y1="74" x2="120" y2="96"/></g>
      <!-- 벽/한지 창호 3칸 -->
      <g>
        <rect x="-150" y="-44" width="76" height="122" fill="#f4eed9" stroke="#8a6a3a" stroke-width="2"/>
        <rect x="-38" y="-44" width="76" height="122" fill="#f4eed9" stroke="#8a6a3a" stroke-width="2"/>
        <rect x="74" y="-44" width="76" height="122" fill="#f4eed9" stroke="#8a6a3a" stroke-width="2"/>
        <g stroke="#c19a5e" stroke-width="1.4" opacity="0.9">
          <line x1="-112" y1="-44" x2="-112" y2="78"/><line x1="0" y1="-44" x2="0" y2="78"/><line x1="112" y1="-44" x2="112" y2="78"/>
          <line x1="-150" y1="4" x2="150" y2="4"/><line x1="-150" y1="40" x2="150" y2="40"/>
        </g>
      </g>
      <!-- 기둥 4개 -->
      <g fill="url(#wood2)" stroke="#4d3216" stroke-width="1.5">
        <rect x="-172" y="-46" width="20" height="140"/><rect x="-62" y="-46" width="20" height="140"/>
        <rect x="42" y="-46" width="20" height="140"/><rect x="152" y="-46" width="20" height="140"/>
      </g>
      <!-- 상인방 -->
      <rect x="-176" y="-58" width="352" height="16" fill="#5f3f20"/>
      <!-- 지붕 -->
      <rect x="-198" y="-64" width="396" height="12" rx="4" fill="#333b45"/>
      <path d="M-196,-64 L-118,-160 L118,-160 L196,-64 Z" fill="url(#roof2)" stroke="#2c333d" stroke-width="3"/>
      <rect x="-120" y="-168" width="240" height="12" rx="5" fill="#2c333d"/>
      <g stroke="#6b7684" stroke-width="2" opacity="0.55">
        <line x1="-118" y1="-160" x2="-160" y2="-66"/><line x1="-60" y1="-160" x2="-70" y2="-66"/>
        <line x1="0" y1="-160" x2="0" y2="-66"/><line x1="60" y1="-160" x2="70" y2="-66"/><line x1="118" y1="-160" x2="160" y2="-66"/>
      </g>
      <!-- 편액(판) -->
      <rect x="-44" y="-92" width="88" height="32" rx="4" fill="#241a10" stroke="#c9a24a" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- 하늘 -->
  <rect x="0" y="0" width="1200" height="450" fill="url(#sky2)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="300" cy="80" rx="76" ry="24"/><ellipse cx="366" cy="92" rx="52" ry="18"/><ellipse cx="900" cy="66" rx="84" ry="26"/></g>
  <!-- 새 -->
  <g fill="none" stroke="#6f7f8a" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
    <path d="M560,70 q10,-9 20,0 q10,-9 20,0"/><path d="M650,58 q8,-7 16,0 q8,-7 16,0"/>
  </g>

  <!-- 뒤편 명륜당 지붕(원경) -->
  <g opacity="0.9">
    <path d="M470,300 L600,214 L730,300 Z" fill="#4b5561" stroke="#333b45" stroke-width="2.5"/>
    <rect x="500" y="300" width="200" height="10" fill="#39424f"/>
    <rect x="512" y="310" width="176" height="40" fill="#c9bfa6" stroke="#9c9078" stroke-width="2"/>
    <rect x="566" y="206" width="68" height="12" rx="4" fill="#2c333d"/>
  </g>
  <!-- 뒤 담장 -->
  <rect x="120" y="330" width="960" height="30" fill="#cbbf9f" stroke="#a89a72" stroke-width="2"/>
  <rect x="112" y="320" width="976" height="14" rx="5" fill="#4b5561"/>

  <!-- 땅(마당) -->
  <rect x="0" y="352" width="1200" height="348" fill="url(#grd2)"/>
  <!-- 잔디 가장자리 -->
  <path d="M0,470 Q300,452 600,468 Q900,452 1200,470 L1200,700 L0,700 Z" fill="#9cb56a" opacity="0.55"/>
  <!-- 가운데 박석 길 -->
  <g>
    <path d="M540,700 L560,360 L640,360 L660,700 Z" fill="#cdc3ac" stroke="#a89a72" stroke-width="2"/>
    <g stroke="#a89a72" stroke-width="1.6" opacity="0.7"><line x1="556" y1="420" x2="644" y2="420"/><line x1="552" y1="500" x2="648" y2="500"/><line x1="548" y1="590" x2="652" y2="590"/></g>
  </g>

  <!-- 은행나무 (좌측 뒤) -->
  <g transform="translate(150,300)">
    <rect x="-9" y="0" width="18" height="70" fill="#6a4a2c"/>
    <circle cy="-16" r="46" fill="#5aa653"/><circle cx="-34" cy="6" r="30" fill="#69b55f"/><circle cx="34" cy="4" r="30" fill="#69b55f"/><circle cy="-2" r="40" fill="#5aa653"/>
  </g>

  <!-- 동재 (왼쪽) -->
  <use href="#hanok" x="300" y="308"/>
  <g transform="translate(300,308)">
    <text x="0" y="-70" text-anchor="middle" font-family="'Nanum Myeongjo',serif" font-size="24" font-weight="800" fill="#e7c469">東齋</text>
  </g>
  <g transform="translate(300,470)"><rect x="-42" y="0" width="84" height="26" rx="13" fill="rgba(255,255,255,0.9)" stroke="#3a7d5a" stroke-width="2"/><text x="0" y="18" text-anchor="middle" font-family="'Jua',sans-serif" font-size="16" font-weight="700" fill="#2f6b4e">동재</text></g>

  <!-- 서재 (오른쪽) -->
  <use href="#hanok" x="900" y="308"/>
  <g transform="translate(900,308)">
    <text x="0" y="-70" text-anchor="middle" font-family="'Nanum Myeongjo',serif" font-size="24" font-weight="800" fill="#e7c469">西齋</text>
  </g>
  <g transform="translate(900,470)"><rect x="-42" y="0" width="84" height="26" rx="13" fill="rgba(255,255,255,0.9)" stroke="#3a7d5a" stroke-width="2"/><text x="0" y="18" text-anchor="middle" font-family="'Jua',sans-serif" font-size="16" font-weight="700" fill="#2f6b4e">서재</text></g>

  <!-- 마당의 서책 더미 -->
  <g transform="translate(600,632)">
    <rect x="-34" y="-6" width="68" height="12" rx="2" fill="#c86b4a" stroke="#8a3d24" stroke-width="1.5"/>
    <rect x="-30" y="-16" width="60" height="12" rx="2" fill="#d9c27a" stroke="#a8853a" stroke-width="1.5"/>
    <rect x="-26" y="-26" width="52" height="12" rx="2" fill="#7fae7a" stroke="#4a7d46" stroke-width="1.5"/>
  </g>
</svg>
</body>
</html>
