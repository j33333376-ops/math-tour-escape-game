<!-- 원본 크기: 900x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인천도호부청사 동헌</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .dgh-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="dgh-svg" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천도호부청사 동헌">
<title>인천도호부청사 동헌</title>
<desc>조선시대 관아 동헌. 팔작지붕 목조 건물과 돌 축대, 현판이 있는 정면 모습.</desc>
<defs>
  <linearGradient id="dghRoof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5c7185"/>
    <stop offset="1" stop-color="#34424f"/>
  </linearGradient>
  <linearGradient id="dghStone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b3aa96"/>
    <stop offset="1" stop-color="#8c8272"/>
  </linearGradient>
  <linearGradient id="dghWood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b4a1f"/>
    <stop offset="1" stop-color="#5a2810"/>
  </linearGradient>
  <linearGradient id="dghDoor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a2416"/>
    <stop offset="1" stop-color="#241408"/>
  </linearGradient>
  <pattern id="dghLattice" width="22" height="22" patternUnits="userSpaceOnUse">
    <rect width="22" height="22" fill="#efe3c6"/>
    <path d="M0,11 H22 M11,0 V22" stroke="#7a3b18" stroke-width="1.6"/>
  </pattern>
</defs>

<rect x="0" y="0" width="900" height="600" fill="none"/>

<!-- 그림자 -->
<ellipse cx="450" cy="580" rx="380" ry="13" fill="#000" opacity="0.12"/>

<!-- 계단 -->
<g>
  <rect x="404" y="546" width="92" height="14" fill="url(#dghStone)" stroke="#6e6555" stroke-width="1"/>
  <rect x="414" y="530" width="72" height="17" fill="url(#dghStone)" stroke="#6e6555" stroke-width="1"/>
  <rect x="424" y="513" width="52" height="18" fill="url(#dghStone)" stroke="#6e6555" stroke-width="1"/>
</g>

<!-- 축대(돌 기단) -->
<polygon points="78,560 822,560 800,478 100,478" fill="url(#dghStone)" stroke="#6e6555" stroke-width="1.5"/>
<g stroke="#6e6555" stroke-width="1" opacity="0.45">
  <line x1="93" y1="500" x2="807" y2="500"/>
  <line x1="88" y1="522" x2="812" y2="522"/>
  <line x1="83" y1="544" x2="817" y2="544"/>
</g>
<rect x="78" y="557" width="744" height="6" fill="#5c5344"/>

<!-- 마루 바닥 -->
<rect x="95" y="470" width="710" height="10" fill="#c9a876"/>

<!-- 기둥 -->
<g fill="url(#dghWood)">
  <rect x="103" y="212" width="16" height="260"/>
  <rect x="239" y="212" width="16" height="260"/>
  <rect x="375" y="212" width="16" height="260"/>
  <rect x="511" y="212" width="16" height="260"/>
  <rect x="647" y="212" width="16" height="260"/>
  <rect x="783" y="212" width="16" height="260"/>
</g>

<!-- 벽면 1,2 (좌측 두 칸) -->
<g>
  <rect x="119" y="214" width="120" height="136" fill="url(#dghLattice)" stroke="#7a3b18" stroke-width="3"/>
  <rect x="119" y="350" width="120" height="120" fill="url(#dghWood)"/>
  <rect x="255" y="214" width="120" height="136" fill="url(#dghLattice)" stroke="#7a3b18" stroke-width="3"/>
  <rect x="255" y="350" width="120" height="120" fill="url(#dghWood)"/>
</g>

<!-- 중앙 어칸 (개방된 출입구) -->
<rect x="391" y="214" width="120" height="256" fill="#1c1410"/>
<rect x="391" y="214" width="120" height="256" fill="#000" opacity="0.25"/>
<polygon points="420,470 490,470 480,400 430,400" fill="#8c8272" opacity="0.55"/>
<rect x="391" y="214" width="14" height="256" fill="url(#dghWood)" opacity="0.8"/>
<rect x="497" y="214" width="14" height="256" fill="url(#dghWood)" opacity="0.8"/>

<!-- 벽면 4,5 (우측 두 칸) -->
<g>
  <rect x="527" y="214" width="120" height="136" fill="url(#dghLattice)" stroke="#7a3b18" stroke-width="3"/>
  <rect x="527" y="350" width="120" height="120" fill="url(#dghWood)"/>
  <rect x="663" y="214" width="120" height="136" fill="url(#dghLattice)" stroke="#7a3b18" stroke-width="3"/>
  <rect x="663" y="350" width="120" height="120" fill="url(#dghWood)"/>
</g>

<!-- 처마도리(단청 띠) -->
<rect x="90" y="196" width="720" height="18" fill="#1f6b4a"/>
<rect x="90" y="196" width="720" height="6" fill="#e8c04a"/>
<rect x="90" y="208" width="720" height="6" fill="#9c3b28"/>

<!-- 공포(포작) 장식 점 -->
<g fill="#e8c04a">
  <circle cx="111" cy="204" r="3"/>
  <circle cx="247" cy="204" r="3"/>
  <circle cx="383" cy="204" r="3"/>
  <circle cx="519" cy="204" r="3"/>
  <circle cx="655" cy="204" r="3"/>
  <circle cx="791" cy="204" r="3"/>
</g>

<!-- 현판 -->
<rect x="393" y="160" width="114" height="42" rx="2" fill="#1a1410" stroke="#d4a72c" stroke-width="3"/>
<text x="450" y="188" text-anchor="middle" font-family="'Batang','Georgia',serif" font-size="24" fill="#e8c04a" font-weight="bold" letter-spacing="4">東軒</text>

<!-- 지붕 (팔작지붕) -->
<path d="M92,196
         C92,150 170,108 290,98
         L610,98
         C730,108 808,150 808,196
         C 720,178 630,170 610,174
         C 500,180 400,180 290,174
         C 270,170 180,178 92,196 Z"
      fill="url(#dghRoof)" stroke="#26313c" stroke-width="1.5"/>

<!-- 기와골 (세로 줄무늬) -->
<g stroke="#26313c" stroke-width="1" opacity="0.5">
  <path d="M140,182 C142,150 165,120 200,108" fill="none"/>
  <path d="M190,178 C193,148 215,118 250,106" fill="none"/>
  <path d="M240,175 C243,146 260,116 300,101" fill="none"/>
  <path d="M660,175 C657,146 640,116 600,101" fill="none"/>
  <path d="M710,178 C707,148 685,118 650,106" fill="none"/>
  <path d="M760,182 C758,150 735,120 700,108" fill="none"/>
</g>

<!-- 용마루 -->
<rect x="270" y="90" width="360" height="12" rx="3" fill="#1f2833"/>
<!-- 취두 (지붕 양끝 장식) -->
<ellipse cx="278" cy="90" rx="10" ry="14" fill="#1f2833"/>
<ellipse cx="622" cy="90" rx="10" ry="14" fill="#1f2833"/>

<!-- 막새(처마 끝 원형 기와) -->
<g fill="#e8c04a" opacity="0.85">
  <circle cx="115" cy="192" r="4"/>
  <circle cx="160" cy="184" r="4"/>
  <circle cx="205" cy="176" r="4"/>
  <circle cx="250" cy="172" r="4"/>
  <circle cx="650" cy="172" r="4"/>
  <circle cx="695" cy="176" r="4"/>
  <circle cx="740" cy="184" r="4"/>
  <circle cx="785" cy="192" r="4"/>
</g>

</svg>
</body>
</html>
