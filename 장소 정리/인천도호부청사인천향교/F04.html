<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천도호부청사·인천향교 MATHTOUR - F04</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            color: #2d3748;
        }

        /* 16:9 비율 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #f5f0e6;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #d4af37;
        }

        /* 배경 이미지 */
        #bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* 상단 표시바 */
        #top-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.65);
            border: 1px solid #d4af37;
            padding: 8px 18px;
            border-radius: 4px;
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* 무대 영역 (캐릭터 배치) */
        #stage-area {
            position: absolute;
            inset: 0;
            z-index: 3;
        }

        /* 인물 래퍼 및 필터 효과 */
        .char-wrapper {
            position: absolute;
            overflow: visible;
            filter: brightness(0.55);
            transition: filter 0.3s ease;
        }

        .char-wrapper.active {
            filter: brightness(1);
        }

        /* 공통 이동 버튼 스타일 */
        .btn-nav {
            position: absolute;
            z-index: 10;
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        .btn-nav:active {
            transform: scale(0.98);
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
            bottom: 20px;
        }

        /* 대화창 UI */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 86%;
            height: 140px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 16px 22px;
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            color: #ffffff;
            line-height: 1.6;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        #click-prompt {
            position: absolute;
            right: 15px;
            bottom: 10px;
            font-size: 12px;
            color: #d4af37;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <img id="bg-image" src="투호놀이장.png" alt="투호놀이장 배경">

    <div id="top-bar">인천도호부청사·인천향교 MATHTOUR</div>

    <div id="stage-area">
        <div class="char-wrapper" id="char-민우" style="left: 60px; bottom: 20px; width: 260px; height: 320px;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <div class="char-wrapper" id="char-서연" style="left: 240px; bottom: 20px; width: 260px; height: 320px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <div class="char-wrapper" id="char-투호장" style="left: 740px; bottom: 20px; width: 260px; height: 320px;">
            <iframe src="등장인물_투호장.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>
    </div>

    <div id="dialogue-box" onclick="advanceDialogue()">
        <div id="speaker-name">화자</div>
        <div id="dialogue-text">대화 내용이 입력됩니다.</div>
        <div id="click-prompt">▲ 클릭하여 계속</div>
    </div>

    <button id="btn-prev" class="btn-nav" style="display: none;" onclick="goPrev()">이전</button>
    <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
    <button id="btn-next" class="btn-nav" style="display: none;" onclick="goNext()">End</button>
</div>

<script>
    // 대화 데이터 정의
    const dialogues = [
        {
            speaker: "투호장",
            text: "화살 준비 완료! 훌륭하구나, 조합의 이치를 완벽히 깨우쳤어.",
            target: "char-투호장"
        },
        {
            speaker: "투호장",
            text: "이제 진짜 투호 경기를 하러 이동하자꾸나.",
            target: "char-투호장"
        }
    ];

    let currentIndex = 0;

    // 대화 진행 함수
    function advanceDialogue() {
        if (currentIndex < dialogues.length) {
            const current = dialogues[currentIndex];
            
            // 텍스트 및 화자 변경
            document.getElementById("speaker-name").innerText = current.speaker;
            document.getElementById("dialogue-text").innerText = current.text;

            // 캐릭터 활성화/비활성화 (밝기 조절)
            document.querySelectorAll('.char-wrapper').forEach(wrapper => {
                wrapper.classList.remove('active');
            });

            if (current.target) {
                const activeChar = document.getElementById(current.target);
                if (activeChar) {
                    activeChar.classList.add('active');
                }
            }

            currentIndex++;
        } else {
            endDialogue();
        }
    }

    // 대화 종료 처리
    function endDialogue() {
        // 대화창 및 건너뛰기 버튼 숨기기
        document.getElementById("dialogue-box").style.display = "none";
        document.getElementById("btn-skip").style.display = "none";

        // 모든 캐릭터 밝게 복구
        document.querySelectorAll('.char-wrapper').forEach(wrapper => {
            wrapper.classList.add('active');
        });

        // 이전/다음(End) 버튼 활성화
        document.getElementById("btn-prev").style.display = "block";
        document.getElementById("btn-next").style.display = "block";
    }

    // 건너뛰기 기능
    function skipDialogue() {
        endDialogue();
    }

    // 이전 페이지 이동
    function goPrev() {
        window.location.href = "F03.html";
    }

    // 다음(End) 페이지 이동
    function goNext() {
        window.location.href = "index.html";
    }

    // 초기화 실행
    window.onload = function() {
        advanceDialogue();
    };
</script>

</body>
</html>
