<!-- 원본 크기: 560x640 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인천도호부청사 투호놀이장</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .tho-svg { display:block; width:100%; height:auto; }
  .tho-shaft { animation: tho-glint 4s ease-in-out infinite; }
  @keyframes tho-glint { 0%,100% { opacity:0.9; } 50% { opacity:1; } }
</style>
</head>
<body>
<svg class="tho-svg" viewBox="0 0 560 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="투호 놀이 소품">
<title>투호 놀이</title>
<desc>마당 멍석 위에 놓인 청동 투호 항아리와 화살 다발.</desc>
<defs>
  <linearGradient id="thoBronze" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7a5a1a"/>
    <stop offset="0.25" stop-color="#d4a72c"/>
    <stop offset="0.5" stop-color="#f2d78a"/>
    <stop offset="0.75" stop-color="#c9922e"/>
    <stop offset="1" stop-color="#6e4e15"/>
  </linearGradient>
  <linearGradient id="thoBronzeDark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5a3f10"/>
    <stop offset="0.5" stop-color="#8a6218"/>
    <stop offset="1" stop-color="#4e3610"/>
  </linearGradient>
  <radialGradient id="thoMat" cx="0.5" cy="0.45" r="0.65">
    <stop offset="0" stop-color="#d8b57e"/>
    <stop offset="1" stop-color="#a2793d"/>
  </radialGradient>
  <linearGradient id="thoShaft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c9a05a"/>
    <stop offset="0.5" stop-color="#e8c98a"/>
    <stop offset="1" stop-color="#a87c3f"/>
  </linearGradient>
  <linearGradient id="thoYard" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e0d3b4"/>
    <stop offset="1" stop-color="#c9b98f"/>
  </linearGradient>
  <linearGradient id="thoWall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8e0cd"/>
    <stop offset="1" stop-color="#d2c7ac"/>
  </linearGradient>
  <linearGradient id="thoTile" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5f6b78"/>
    <stop offset="1" stop-color="#3e4854"/>
  </linearGradient>
</defs>

<!-- 마당 바닥 -->
<rect x="0" y="0" width="560" height="640" fill="url(#thoYard)"/>

<!-- 뒤쪽 흙담과 기와 -->
<rect x="0" y="196" width="560" height="132" fill="url(#thoWall)"/>
<rect x="0" y="184" width="560" height="18" rx="4" fill="url(#thoTile)"/>
<g fill="#4a5460" opacity="0.85">
  <ellipse cx="30" cy="186" rx="15" ry="7"/><ellipse cx="90" cy="186" rx="15" ry="7"/>
  <ellipse cx="150" cy="186" rx="15" ry="7"/><ellipse cx="210" cy="186" rx="15" ry="7"/>
  <ellipse cx="270" cy="186" rx="15" ry="7"/><ellipse cx="330" cy="186" rx="15" ry="7"/>
  <ellipse cx="390" cy="186" rx="15" ry="7"/><ellipse cx="450" cy="186" rx="15" ry="7"/>
  <ellipse cx="510" cy="186" rx="15" ry="7"/>
</g>
<g stroke="#bcae90" stroke-width="1.6" opacity="0.7">
  <line x1="0" y1="248" x2="560" y2="248"/>
  <line x1="0" y1="292" x2="560" y2="292"/>
</g>
<g fill="#c4b694" opacity="0.55">
  <rect x="60" y="212" width="34" height="30" rx="3"/>
  <rect x="240" y="256" width="34" height="30" rx="3"/>
  <rect x="430" y="212" width="34" height="30" rx="3"/>
</g>
<rect x="0" y="326" width="560" height="10" fill="#a8977a" opacity="0.7"/>

<!-- 담장 아래 화단 -->
<g>
  <ellipse cx="72" cy="352" rx="62" ry="16" fill="#6f9a52" opacity="0.8"/>
  <ellipse cx="492" cy="352" rx="58" ry="15" fill="#6f9a52" opacity="0.8"/>
  <g fill="#d9718f" opacity="0.85">
    <circle cx="48" cy="344" r="4"/><circle cx="86" cy="348" r="4"/>
    <circle cx="474" cy="346" r="4"/><circle cx="510" cy="348" r="4"/>
  </g>
</g>

<!-- 멍석 (짚 돗자리) -->
<ellipse cx="280" cy="582" rx="242" ry="52" fill="url(#thoMat)" stroke="#7a5a2c" stroke-width="2"/>
<g stroke="#7a5a2c" stroke-width="1.2" opacity="0.55" fill="none">
  <ellipse cx="280" cy="582" rx="210" ry="44"/>
  <ellipse cx="280" cy="582" rx="170" ry="35"/>
  <ellipse cx="280" cy="582" rx="128" ry="26"/>
  <ellipse cx="280" cy="582" rx="86" ry="17"/>
</g>
<g stroke="#8a6a3a" stroke-width="1" opacity="0.45">
  <line x1="80" y1="580" x2="60" y2="578"/>
  <line x1="120" y1="600" x2="100" y2="604"/>
  <line x1="180" y1="618" x2="168" y2="626"/>
  <line x1="380" y1="618" x2="392" y2="626"/>
  <line x1="440" y1="600" x2="458" y2="606"/>
  <line x1="480" y1="580" x2="500" y2="578"/>
</g>

<!-- 그림자 -->
<ellipse cx="240" cy="566" rx="90" ry="14" fill="#000" opacity="0.15"/>
<ellipse cx="410" cy="512" rx="70" ry="12" fill="#000" opacity="0.13"/>

<!-- ===== 화살 다발 (우측, 멍석 위에 비스듬히) ===== -->
<!-- 화살 받침대 -->
<g transform="translate(410,480)">
  <rect x="-58" y="6" width="116" height="14" rx="4" fill="#8a6a3a" stroke="#5e4522" stroke-width="1.6"/>
  <rect x="-50" y="20" width="12" height="26" rx="3" fill="#7a5c30"/>
  <rect x="38" y="20" width="12" height="26" rx="3" fill="#7a5c30"/>
</g>
<g transform="translate(410,480)">
  <g class="tho-shaft">
    <g transform="rotate(-24)"><rect x="-3" y="-190" width="6" height="230" rx="3" fill="url(#thoShaft)"/><polygon points="-3,-190 3,-190 0,-206" fill="#3a2a10"/></g>
    <g transform="rotate(-17)"><rect x="-3" y="-190" width="6" height="230" rx="3" fill="url(#thoShaft)"/><polygon points="-3,-190 3,-190 0,-206" fill="#3a2a10"/></g>
    <g transform="rotate(-10)"><rect x="-3" y="-190" width="6" height="230" rx="3" fill="url(#thoShaft)"/><polygon points="-3,-190 3,-190 0,-206" fill="#3a2a10"/></g>
    <g transform="rotate(-3)"><rect x="-3" y="-190" width="6" height="230" rx="3" fill="url(#thoShaft)"/><polygon points="-3,-190 3,-190 0,-206" fill="#3a2a10"/></g>
    <g transform="rotate(4)"><rect x="-3" y="-190" width="6" height="230" rx="3" fill="url(#thoShaft)"/><polygon points="-3,-190 3,-190 0,-206" fill="#3a2a10"/></g>
    <g transform="rotate(11)"><rect x="-3" y="-190" width="6" height="230" rx="3" fill="url(#thoShaft)"/><polygon points="-3,-190 3,-190 0,-206" fill="#3a2a10"/></g>
    <g transform="rotate(18)"><rect x="-3" y="-190" width="6" height="230" rx="3" fill="url(#thoShaft)"/><polygon points="-3,-190 3,-190 0,-206" fill="#3a2a10"/></g>
    <g transform="rotate(25)"><rect x="-3" y="-190" width="6" height="230" rx="3" fill="url(#thoShaft)"/><polygon points="-3,-190 3,-190 0,-206" fill="#3a2a10"/></g>
  </g>
  <!-- 묶음 매듭 (붉은 리본) -->
  <ellipse cx="0" cy="0" rx="24" ry="14" fill="#9c3b28" stroke="#6e2115" stroke-width="1.5"/>
  <path d="M-24,0 Q-40,-14 -34,-30" fill="none" stroke="#9c3b28" stroke-width="6" stroke-linecap="round"/>
  <path d="M24,0 Q40,10 30,26" fill="none" stroke="#9c3b28" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- ===== 투호 항아리 (청동) ===== -->
<g>
  <!-- 몸체 -->
  <path d="M215,300
           C205,300 200,310 200,320
           L200,380
           C200,395 170,410 160,420
           C148,435 145,460 145,480
           C145,505 152,530 175,545
           C180,552 178,558 175,562
           L285,562
           C282,558 280,552 285,545
           C308,530 315,505 315,480
           C315,460 312,435 300,420
           C290,410 260,395 260,380
           L260,320
           C260,310 255,300 245,300
           Z"
        fill="url(#thoBronze)" stroke="#4e3610" stroke-width="2"/>

  <!-- 옆 손잡이관 (귀 구멍) -->
  <ellipse cx="158" cy="352" rx="10" ry="17" fill="url(#thoBronzeDark)" stroke="#4e3610" stroke-width="1.5" transform="rotate(-18 158 352)"/>
  <ellipse cx="302" cy="352" rx="10" ry="17" fill="url(#thoBronzeDark)" stroke="#4e3610" stroke-width="1.5" transform="rotate(18 302 352)"/>
  <circle cx="158" cy="345" r="3.5" fill="#2a1c08"/>
  <circle cx="302" cy="345" r="3.5" fill="#2a1c08"/>

  <!-- 장식 띠 -->
  <rect x="200" y="325" width="60" height="9" fill="url(#thoBronzeDark)"/>
  <rect x="148" y="410" width="164" height="9" fill="url(#thoBronzeDark)"/>
  <g fill="#4e3610">
    <polygon points="160,468 168,468 164,478"/>
    <polygon points="180,468 188,468 184,478"/>
    <polygon points="200,468 208,468 204,478"/>
    <polygon points="220,468 228,468 224,478"/>
    <polygon points="240,468 248,468 244,478"/>
    <polygon points="260,468 268,468 264,478"/>
    <polygon points="280,468 288,468 284,478"/>
    <polygon points="300,468 308,468 304,478"/>
  </g>
  <rect x="150" y="464" width="160" height="8" fill="url(#thoBronzeDark)"/>
  <rect x="178" y="548" width="104" height="9" fill="url(#thoBronzeDark)"/>

  <!-- 아가리(입구) -->
  <ellipse cx="230" cy="300" rx="17" ry="6" fill="#3a2a10"/>
  <ellipse cx="230" cy="298" rx="17" ry="5.5" fill="none" stroke="url(#thoBronzeDark)" stroke-width="3"/>

  <!-- 항아리에 꽂힌 화살 -->
  <g class="tho-shaft">
    <rect x="212" y="175" width="6" height="128" rx="3" fill="url(#thoShaft)" transform="rotate(-4 215 300)"/>
    <rect x="227" y="168" width="6" height="135" rx="3" fill="url(#thoShaft)"/>
    <rect x="243" y="176" width="6" height="127" rx="3" fill="url(#thoShaft)" transform="rotate(5 246 300)"/>
  </g>
  <polygon points="212,175 218,175 215,160" fill="#3a2a10" transform="rotate(-4 215 300)"/>
  <polygon points="227,168 233,168 230,153" fill="#3a2a10"/>
  <polygon points="243,176 249,176 246,161" fill="#3a2a10" transform="rotate(5 246 300)"/>

  <!-- 하이라이트 -->
  <path d="M180,340 C172,380 175,470 190,540" stroke="#fff2c9" stroke-width="6" opacity="0.35" fill="none" stroke-linecap="round"/>
</g>

</svg>
</body>
</html>
