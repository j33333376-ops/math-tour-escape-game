<!-- 원본 크기: 900x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인천향교 명륜당</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .myr-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="myr-svg" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천향교 명륜당">
<title>인천향교 명륜당</title>
<desc>인천향교 명륜당. 대청마루가 훤히 보이는 강학당 정면과 마루 앞에 놓인 주판.</desc>
<defs>
  <linearGradient id="myrRoof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5c7185"/>
    <stop offset="1" stop-color="#34424f"/>
  </linearGradient>
  <linearGradient id="myrStone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b3aa96"/>
    <stop offset="1" stop-color="#8c8272"/>
  </linearGradient>
  <linearGradient id="myrWood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b4a1f"/>
    <stop offset="1" stop-color="#5a2810"/>
  </linearGradient>
  <linearGradient id="myrFloor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c9a876"/>
    <stop offset="1" stop-color="#9c7847"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="900" height="600" fill="none"/>

<!-- 그림자 -->
<ellipse cx="450" cy="580" rx="380" ry="13" fill="#000" opacity="0.12"/>

<!-- 계단 -->
<g>
  <rect x="404" y="546" width="92" height="14" fill="url(#myrStone)" stroke="#6e6555" stroke-width="1"/>
  <rect x="414" y="530" width="72" height="17" fill="url(#myrStone)" stroke="#6e6555" stroke-width="1"/>
  <rect x="424" y="513" width="52" height="18" fill="url(#myrStone)" stroke="#6e6555" stroke-width="1"/>
</g>

<!-- 축대 -->
<polygon points="78,560 822,560 800,478 100,478" fill="url(#myrStone)" stroke="#6e6555" stroke-width="1.5"/>
<g stroke="#6e6555" stroke-width="1" opacity="0.45">
  <line x1="93" y1="500" x2="807" y2="500"/>
  <line x1="88" y1="522" x2="812" y2="522"/>
  <line x1="83" y1="544" x2="817" y2="544"/>
</g>
<rect x="78" y="557" width="744" height="6" fill="#5c5344"/>

<!-- 대청마루 바닥 -->
<rect x="95" y="470" width="710" height="10" fill="#c9a876"/>

<!-- 기둥 -->
<g fill="url(#myrWood)">
  <rect x="103" y="212" width="16" height="260"/>
  <rect x="239" y="212" width="16" height="260"/>
  <rect x="375" y="212" width="16" height="260"/>
  <rect x="511" y="212" width="16" height="260"/>
  <rect x="647" y="212" width="16" height="260"/>
  <rect x="783" y="212" width="16" height="260"/>
</g>

<!-- 개방된 대청마루 내부 (5칸 전체 개방) -->
<g>
  <rect x="119" y="214" width="120" height="256" fill="url(#myrFloor)"/>
  <rect x="255" y="214" width="120" height="256" fill="url(#myrFloor)"/>
  <rect x="391" y="214" width="120" height="256" fill="url(#myrFloor)"/>
  <rect x="527" y="214" width="120" height="256" fill="url(#myrFloor)"/>
  <rect x="663" y="214" width="120" height="256" fill="url(#myrFloor)"/>
</g>
<!-- 마루 널판 결 -->
<g stroke="#7a5a30" stroke-width="1" opacity="0.4">
  <line x1="119" y1="290" x2="783" y2="290"/>
  <line x1="119" y1="360" x2="783" y2="360"/>
  <line x1="119" y1="430" x2="783" y2="430"/>
</g>
<!-- 안쪽 뒷벽 실루엣(원근감) -->
<g fill="#5a4226" opacity="0.55">
  <rect x="119" y="214" width="120" height="46"/>
  <rect x="255" y="214" width="120" height="46"/>
  <rect x="391" y="214" width="120" height="46"/>
  <rect x="527" y="214" width="120" height="46"/>
  <rect x="663" y="214" width="120" height="46"/>
</g>
<!-- 안쪽 배경 기둥(원근감) -->
<g fill="#3f2e18" opacity="0.6">
  <rect x="236" y="230" width="6" height="240"/>
  <rect x="372" y="230" width="6" height="240"/>
  <rect x="508" y="230" width="6" height="240"/>
  <rect x="644" y="230" width="6" height="240"/>
</g>
<!-- 그림자 상단 음영 -->
<g fill="#000" opacity="0.12">
  <rect x="119" y="214" width="664" height="24"/>
</g>

<!-- 마루 문턱 -->
<rect x="95" y="466" width="710" height="6" fill="#7a5a30"/>

<!-- 처마도리(단청 띠) -->
<rect x="90" y="196" width="720" height="18" fill="#1f6b4a"/>
<rect x="90" y="196" width="720" height="6" fill="#e8c04a"/>
<rect x="90" y="208" width="720" height="6" fill="#9c3b28"/>

<!-- 공포 장식 점 -->
<g fill="#e8c04a">
  <circle cx="111" cy="204" r="3"/>
  <circle cx="247" cy="204" r="3"/>
  <circle cx="383" cy="204" r="3"/>
  <circle cx="519" cy="204" r="3"/>
  <circle cx="655" cy="204" r="3"/>
  <circle cx="791" cy="204" r="3"/>
</g>

<!-- 현판 -->
<rect x="384" y="160" width="132" height="42" rx="2" fill="#1a1410" stroke="#d4a72c" stroke-width="3"/>
<text x="450" y="188" text-anchor="middle" font-family="'Batang','Georgia',serif" font-size="22" fill="#e8c04a" font-weight="bold" letter-spacing="3">明倫堂</text>

<!-- 지붕 (팔작지붕) -->
<path d="M92,196
         C92,150 170,108 290,98
         L610,98
         C730,108 808,150 808,196
         C 720,178 630,170 610,174
         C 500,180 400,180 290,174
         C 270,170 180,178 92,196 Z"
      fill="url(#myrRoof)" stroke="#26313c" stroke-width="1.5"/>
<g stroke="#26313c" stroke-width="1" opacity="0.5">
  <path d="M140,182 C142,150 165,120 200,108" fill="none"/>
  <path d="M190,178 C193,148 215,118 250,106" fill="none"/>
  <path d="M240,175 C243,146 260,116 300,101" fill="none"/>
  <path d="M660,175 C657,146 640,116 600,101" fill="none"/>
  <path d="M710,178 C707,148 685,118 650,106" fill="none"/>
  <path d="M760,182 C758,150 735,120 700,108" fill="none"/>
</g>
<rect x="270" y="90" width="360" height="12" rx="3" fill="#1f2833"/>
<ellipse cx="278" cy="90" rx="10" ry="14" fill="#1f2833"/>
<ellipse cx="622" cy="90" rx="10" ry="14" fill="#1f2833"/>
<g fill="#e8c04a" opacity="0.85">
  <circle cx="115" cy="192" r="4"/>
  <circle cx="160" cy="184" r="4"/>
  <circle cx="205" cy="176" r="4"/>
  <circle cx="250" cy="172" r="4"/>
  <circle cx="650" cy="172" r="4"/>
  <circle cx="695" cy="176" r="4"/>
  <circle cx="740" cy="184" r="4"/>
  <circle cx="785" cy="192" r="4"/>
</g>

<!-- ===== 마루 앞 소품: 주판(算盤) ===== -->
<g transform="translate(596,494)">
  <ellipse cx="46" cy="60" rx="66" ry="9" fill="#000" opacity="0.18"/>
  <rect x="0" y="0" width="92" height="50" rx="3" fill="url(#myrWood)" stroke="#3a1e0d" stroke-width="2"/>
  <rect x="8" y="8" width="76" height="34" fill="#f2e2b8"/>
  <line x1="8" y1="20" x2="84" y2="20" stroke="#3a1e0d" stroke-width="1.5"/>
  <g stroke="#5a2810" stroke-width="1.3">
    <line x1="16" y1="8" x2="16" y2="42"/>
    <line x1="28" y1="8" x2="28" y2="42"/>
    <line x1="40" y1="8" x2="40" y2="42"/>
    <line x1="52" y1="8" x2="52" y2="42"/>
    <line x1="64" y1="8" x2="64" y2="42"/>
    <line x1="76" y1="8" x2="76" y2="42"/>
  </g>
  <!-- 위쪽 알(하늘색/금색) -->
  <g fill="#e8c04a" stroke="#8a6218" stroke-width="0.6">
    <ellipse cx="16" cy="13" rx="5" ry="4"/>
    <ellipse cx="40" cy="13" rx="5" ry="4"/>
    <ellipse cx="64" cy="13" rx="5" ry="4"/>
  </g>
  <g fill="#f2e2b8" stroke="#8a6218" stroke-width="0.6">
    <ellipse cx="28" cy="13" rx="5" ry="4"/>
    <ellipse cx="52" cy="13" rx="5" ry="4"/>
    <ellipse cx="76" cy="13" rx="5" ry="4"/>
  </g>
  <!-- 아래쪽 알(적갈색) -->
  <g fill="#9c3b28" stroke="#5a2013" stroke-width="0.6">
    <ellipse cx="16" cy="30" rx="5" ry="4"/>
    <ellipse cx="16" cy="37" rx="5" ry="4"/>
    <ellipse cx="40" cy="30" rx="5" ry="4"/>
    <ellipse cx="64" cy="30" rx="5" ry="4"/>
    <ellipse cx="64" cy="37" rx="5" ry="4"/>
  </g>
  <g fill="#c9744a" stroke="#5a2013" stroke-width="0.6">
    <ellipse cx="28" cy="34" rx="5" ry="4"/>
    <ellipse cx="52" cy="34" rx="5" ry="4"/>
    <ellipse cx="76" cy="30" rx="5" ry="4"/>
    <ellipse cx="76" cy="37" rx="5" ry="4"/>
  </g>
</g>

</svg>
</body>
</html>
