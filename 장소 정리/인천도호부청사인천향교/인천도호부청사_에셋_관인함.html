<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관인함</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .dgh-svg { display:block; width:100%; height:auto; }

</style>
</head>
<body>
<svg class="dgh-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="관인함">
<title>관인함</title>
<desc>도호부 관아의 관인(官印)과 인주 함.</desc>
<defs>
  <linearGradient id="dghBox" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8c3a24"/><stop offset="0.5" stop-color="#6e2a18"/><stop offset="1" stop-color="#4a1a0e"/>
  </linearGradient>
  <linearGradient id="dghSeal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5a3f10"/><stop offset="0.3" stop-color="#c9922e"/>
    <stop offset="0.55" stop-color="#f2d78a"/><stop offset="0.8" stop-color="#b8862a"/>
    <stop offset="1" stop-color="#4e3610"/>
  </linearGradient>
  <radialGradient id="dghPad" cx="0.4" cy="0.34" r="0.8">
    <stop offset="0" stop-color="#e6403a"/><stop offset="1" stop-color="#8c1f18"/>
  </radialGradient>
</defs>
<ellipse cx="300" cy="536" rx="240" ry="28" fill="#4a2418" opacity="0.22"/>
<!-- 함 뚜껑(뒤로 열림) -->
<g transform="translate(300,244)">
  <path d="M-208,0 L208,0 L188,-104 L-188,-104 Z" fill="#7d3020" stroke="#3a1208" stroke-width="5"/>
  <path d="M-188,-104 L188,-104 L172,-124 L-172,-124 Z" fill="#a8482e" stroke="#3a1208" stroke-width="4"/>
  <!-- 뚜껑 장식 -->
  <g fill="#e8b64c" opacity="0.9">
    <circle cx="0" cy="-58" r="26" fill="none" stroke="#e8b64c" stroke-width="5"/>
    <path d="M0,-78 l7,15 l16,2 l-12,11 l3,16 l-14,-8 l-14,8 l3,-16 l-12,-11 l16,-2 Z"/>
    <circle cx="-120" cy="-56" r="10"/><circle cx="120" cy="-56" r="10"/>
  </g>
</g>
<!-- 함 몸통 -->
<path d="M92,244 L508,244 L508,432 C508,452 492,466 472,466 L128,466 C108,466 92,452 92,432 Z"
      fill="url(#dghBox)" stroke="#3a1208" stroke-width="6"/>
<path d="M92,244 L508,244 L508,272 L92,272 Z" fill="#a8482e" stroke="#3a1208" stroke-width="4"/>
<!-- 금속 모서리 -->
<g fill="#c9922e" stroke="#6e4a10" stroke-width="3.4">
  <path d="M92,244 L146,244 L146,262 L110,262 L110,300 L92,300 Z"/>
  <path d="M508,244 L454,244 L454,262 L490,262 L490,300 L508,300 Z"/>
  <path d="M92,466 L92,412 L110,412 L110,448 L146,448 L146,466 Z"/>
  <path d="M508,466 L508,412 L490,412 L490,448 L454,448 L454,466 Z"/>
</g>
<!-- 자물쇠 고리 -->
<rect x="272" y="232" width="56" height="46" rx="6" fill="#c9922e" stroke="#6e4a10" stroke-width="4"/>
<circle cx="300" cy="290" r="22" fill="none" stroke="#c9922e" stroke-width="8"/>
<!-- 내부: 붉은 비단 -->
<rect x="118" y="288" width="364" height="160" rx="8" fill="#8c1f18" stroke="#5a1008" stroke-width="4"/>
<g stroke="#c2452e" stroke-width="3" opacity="0.6">
  <line x1="118" y1="316" x2="482" y2="316"/><line x1="118" y1="420" x2="482" y2="420"/>
</g>
<!-- 관인 -->
<g transform="translate(228,364)">
  <rect x="-58" y="-6" width="116" height="76" rx="6" fill="url(#dghSeal)" stroke="#4e3610" stroke-width="4.4"/>
  <rect x="-16" y="-76" width="32" height="72" rx="8" fill="url(#dghSeal)" stroke="#4e3610" stroke-width="4"/>
  <!-- 손잡이 거북 -->
  <ellipse cx="0" cy="-84" rx="30" ry="18" fill="#c9922e" stroke="#4e3610" stroke-width="4"/>
  <circle cx="24" cy="-92" r="9" fill="#c9922e" stroke="#4e3610" stroke-width="3"/>
  <g fill="none" stroke="#4e3610" stroke-width="2.4">
    <path d="M-14,-84 h28 M0,-96 v24"/>
  </g>
  <!-- 인면 글자 -->
  <g stroke="#5a3f10" stroke-width="3" opacity="0.75" fill="none">
    <path d="M-38,14 h30 M-23,14 v42 M-38,50 h30"/>
    <path d="M10,14 h30 M25,8 v50 M10,50 h30"/>
  </g>
  <path d="M-48,4 L-48,62" stroke="#fff2c9" stroke-width="7" opacity="0.4" stroke-linecap="round"/>
</g>
<!-- 인주함 -->
<g transform="translate(400,398)">
  <ellipse rx="66" ry="26" fill="#c9922e" stroke="#6e4a10" stroke-width="4.4"/>
  <path d="M-66,0 L-66,-16 C-66,-32 -30,-42 0,-42 C30,-42 66,-32 66,-16 L66,0 Z" fill="#e0a83c" stroke="#6e4a10" stroke-width="4.4"/>
  <ellipse cy="-16" rx="66" ry="26" fill="#8a6218" stroke="#6e4a10" stroke-width="4"/>
  <ellipse cy="-18" rx="52" ry="19" fill="url(#dghPad)"/>
  <ellipse cx="-16" cy="-24" rx="18" ry="7" fill="#ff8478" opacity="0.5"/>
</g>
<!-- 인주함 뚜껑 -->
<g transform="translate(506,442) rotate(14)">
  <ellipse rx="52" ry="20" fill="#e0a83c" stroke="#6e4a10" stroke-width="4"/>
  <ellipse cy="-5" rx="52" ry="20" fill="#f2c14e" stroke="#6e4a10" stroke-width="4"/>
  <circle cy="-5" r="12" fill="#c9922e" stroke="#6e4a10" stroke-width="3"/>
</g>
<!-- 광택 -->
<path d="M110,300 L110,440" stroke="#ffffff" stroke-width="8" opacity="0.15" stroke-linecap="round"/>
</svg>
</body>
</html>
