<!-- 원본 크기: 950x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인천향교 대성전</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .dsj-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="dsj-svg" viewBox="0 0 950 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천향교 대성전">
<title>인천향교 대성전</title>
<desc>인천향교의 대성전. 맞배지붕 목조 건물과 돌계단, 옆으로 이어지는 기와 담장.</desc>
<defs>
  <linearGradient id="dsjRoof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#546274"/>
    <stop offset="1" stop-color="#2e3844"/>
  </linearGradient>
  <linearGradient id="dsjStone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b3aa96"/>
    <stop offset="1" stop-color="#8c8272"/>
  </linearGradient>
  <linearGradient id="dsjWood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7a3f1c"/>
    <stop offset="1" stop-color="#4e2712"/>
  </linearGradient>
  <linearGradient id="dsjWall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4efe1"/>
    <stop offset="1" stop-color="#e2dac4"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="950" height="600" fill="none"/>

<!-- 그림자 -->
<ellipse cx="430" cy="576" rx="380" ry="12" fill="#000" opacity="0.12"/>

<!-- ===== 담장(옆으로 이어짐) ===== -->
<g>
  <rect x="790" y="330" width="150" height="200" fill="url(#dsjStone)" stroke="#6e6555" stroke-width="1"/>
  <rect x="790" y="330" width="150" height="60" fill="url(#dsjWall)"/>
  <rect x="785" y="322" width="160" height="14" fill="#3a4552"/>
  <g fill="#546274">
    <path d="M790,322 q6,-12 12,0 Z"/>
    <path d="M814,322 q6,-12 12,0 Z"/>
    <path d="M838,322 q6,-12 12,0 Z"/>
    <path d="M862,322 q6,-12 12,0 Z"/>
    <path d="M886,322 q6,-12 12,0 Z"/>
    <path d="M910,322 q6,-12 12,0 Z"/>
  </g>
  <g stroke="#6e6555" stroke-width="1" opacity="0.4">
    <line x1="795" y1="410" x2="935" y2="410"/>
    <line x1="795" y1="460" x2="935" y2="460"/>
    <line x1="795" y1="500" x2="935" y2="500"/>
  </g>
</g>

<!-- ===== 계단 ===== -->
<g>
  <rect x="380" y="546" width="100" height="14" fill="url(#dsjStone)" stroke="#6e6555" stroke-width="1"/>
  <rect x="392" y="530" width="76" height="17" fill="url(#dsjStone)" stroke="#6e6555" stroke-width="1"/>
  <rect x="404" y="513" width="52" height="18" fill="url(#dsjStone)" stroke="#6e6555" stroke-width="1"/>
</g>

<!-- ===== 축대(돌 기단) ===== -->
<polygon points="60,560 800,560 780,478 80,478" fill="url(#dsjStone)" stroke="#6e6555" stroke-width="1.5"/>
<g stroke="#6e6555" stroke-width="1" opacity="0.45">
  <line x1="75" y1="500" x2="785" y2="500"/>
  <line x1="70" y1="522" x2="790" y2="522"/>
  <line x1="65" y1="544" x2="795" y2="544"/>
</g>
<rect x="60" y="558" width="740" height="6" fill="#5c5344"/>

<!-- 마루 바닥 -->
<rect x="76" y="470" width="710" height="10" fill="#c9a876"/>

<!-- 기둥 -->
<g fill="url(#dsjWood)">
  <rect x="90"  y="212" width="16" height="260"/>
  <rect x="226" y="212" width="16" height="260"/>
  <rect x="362" y="212" width="16" height="260"/>
  <rect x="498" y="212" width="16" height="260"/>
  <rect x="634" y="212" width="16" height="260"/>
  <rect x="770" y="212" width="16" height="260"/>
</g>

<!-- 회벽 벽면 (좌측 두 칸 + 우측 두 칸, 상부 작은 살창) -->
<g>
  <rect x="106" y="214" width="120" height="256" fill="url(#dsjWall)" stroke="#c9bfa2" stroke-width="1.5"/>
  <rect x="140" y="240" width="52" height="34" fill="#efe3c6" stroke="#7a3f1c" stroke-width="2"/>
  <line x1="166" y1="240" x2="166" y2="274" stroke="#7a3f1c" stroke-width="1.5"/>
  <line x1="140" y1="257" x2="192" y2="257" stroke="#7a3f1c" stroke-width="1.5"/>

  <rect x="242" y="214" width="120" height="256" fill="url(#dsjWall)" stroke="#c9bfa2" stroke-width="1.5"/>
  <rect x="276" y="240" width="52" height="34" fill="#efe3c6" stroke="#7a3f1c" stroke-width="2"/>
  <line x1="302" y1="240" x2="302" y2="274" stroke="#7a3f1c" stroke-width="1.5"/>
  <line x1="276" y1="257" x2="328" y2="257" stroke="#7a3f1c" stroke-width="1.5"/>

  <rect x="514" y="214" width="120" height="256" fill="url(#dsjWall)" stroke="#c9bfa2" stroke-width="1.5"/>
  <rect x="548" y="240" width="52" height="34" fill="#efe3c6" stroke="#7a3f1c" stroke-width="2"/>
  <line x1="574" y1="240" x2="574" y2="274" stroke="#7a3f1c" stroke-width="1.5"/>
  <line x1="548" y1="257" x2="600" y2="257" stroke="#7a3f1c" stroke-width="1.5"/>

  <rect x="650" y="214" width="120" height="256" fill="url(#dsjWall)" stroke="#c9bfa2" stroke-width="1.5"/>
  <rect x="684" y="240" width="52" height="34" fill="#efe3c6" stroke="#7a3f1c" stroke-width="2"/>
  <line x1="710" y1="240" x2="710" y2="274" stroke="#7a3f1c" stroke-width="1.5"/>
  <line x1="684" y1="257" x2="736" y2="257" stroke="#7a3f1c" stroke-width="1.5"/>
</g>

<!-- 중앙 어칸 (닫힌 양여닫이문) -->
<rect x="378" y="214" width="120" height="256" fill="url(#dsjWall)" stroke="#c9bfa2" stroke-width="1.5"/>
<g fill="url(#dsjWood)" stroke="#3a1e0d" stroke-width="1.5">
  <rect x="382" y="228" width="56" height="228"/>
  <rect x="440" y="228" width="56" height="228"/>
</g>
<g stroke="#c9a24a" stroke-width="1.4" opacity="0.8">
  <line x1="382" y1="290" x2="438" y2="290"/>
  <line x1="382" y1="350" x2="438" y2="350"/>
  <line x1="382" y1="410" x2="438" y2="410"/>
  <line x1="440" y1="290" x2="496" y2="290"/>
  <line x1="440" y1="350" x2="496" y2="350"/>
  <line x1="440" y1="410" x2="496" y2="410"/>
</g>
<circle cx="432" cy="350" r="5" fill="#c9a24a"/>
<circle cx="446" cy="350" r="5" fill="#c9a24a"/>

<!-- 처마도리(단청 띠) -->
<rect x="72" y="196" width="720" height="18" fill="#1f6b4a"/>
<rect x="72" y="196" width="720" height="6" fill="#e8c04a"/>
<rect x="72" y="208" width="720" height="6" fill="#9c3b28"/>

<!-- 현판 -->
<rect x="374" y="160" width="128" height="42" rx="2" fill="#1a1410" stroke="#d4a72c" stroke-width="3"/>
<text x="438" y="188" text-anchor="middle" font-family="'Batang','Georgia',serif" font-size="22" fill="#e8c04a" font-weight="bold" letter-spacing="3">大成殿</text>

<!-- ===== 맞배지붕 (완만 트라페조이드, 처마 플레어 없음) ===== -->
<polygon points="60,196 260,100 616,100 816,196" fill="url(#dsjRoof)" stroke="#22303c" stroke-width="1.5"/>

<!-- 지붕 기와골 -->
<g stroke="#22303c" stroke-width="1" opacity="0.5">
  <line x1="140" y1="182" x2="220" y2="116"/>
  <line x1="200" y1="176" x2="270" y2="110"/>
  <line x1="260" y1="170" x2="320" y2="104"/>
  <line x1="620" y1="170" x2="560" y2="104"/>
  <line x1="680" y1="176" x2="610" y2="110"/>
  <line x1="740" y1="182" x2="660" y2="116"/>
</g>

<!-- 용마루 -->
<rect x="248" y="92" width="380" height="12" rx="2" fill="#1f2833"/>

<!-- 박공(풍판) - 맞배지붕 특유의 노출된 삼각 널판 -->
<polygon points="816,196 816,138 866,196" fill="#e6dcc2" stroke="#8c8272" stroke-width="1.5"/>
<g stroke="#8c8272" stroke-width="1.5">
  <line x1="816" y1="196" x2="850" y2="150"/>
  <line x1="866" y1="196" x2="832" y2="150"/>
</g>
<circle cx="841" cy="170" r="5" fill="#8c8272"/>

</svg>
</body>
</html>
