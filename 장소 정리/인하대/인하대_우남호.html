<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인하대 - 우남호</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .wn-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="wn-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인하대 우남호 (대한항공 DC-3 전시기)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c5e0f2"/><stop offset="100%" stop-color="#eef6fb"/></linearGradient>
    <linearGradient id="fus" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbfdff"/><stop offset="50%" stop-color="#e8edf1"/><stop offset="100%" stop-color="#c0cad4"/></linearGradient>
    <linearGradient id="wingg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dfe6ec"/><stop offset="100%" stop-color="#a8b4c0"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="250" cy="70" rx="76" ry="22"/><ellipse cx="960" cy="60" rx="84" ry="24"/></g>

  <!-- 원경 캠퍼스 건물 -->
  <g opacity="0.55">
    <rect x="40" y="180" width="120" height="360" fill="#b8c4cc"/>
    <g fill="#dfe8ee"><rect x="56" y="200" width="26" height="20"/><rect x="96" y="200" width="26" height="20"/><rect x="56" y="236" width="26" height="20"/><rect x="96" y="236" width="26" height="20"/><rect x="56" y="272" width="26" height="20"/><rect x="96" y="272" width="26" height="20"/><rect x="56" y="308" width="26" height="20"/><rect x="96" y="308" width="26" height="20"/></g>
    <rect x="180" y="260" width="150" height="280" fill="#c9b8a8"/>
    <g fill="#e8ddd0"><rect x="198" y="282" width="28" height="22"/><rect x="242" y="282" width="28" height="22"/><rect x="286" y="282" width="28" height="22"/><rect x="198" y="322" width="28" height="22"/><rect x="242" y="322" width="28" height="22"/><rect x="286" y="322" width="28" height="22"/></g>
    <rect x="880" y="240" width="140" height="300" fill="#b8c4cc"/>
    <g fill="#dfe8ee"><rect x="896" y="262" width="26" height="20"/><rect x="936" y="262" width="26" height="20"/><rect x="976" y="262" width="26" height="20"/><rect x="896" y="300" width="26" height="20"/><rect x="936" y="300" width="26" height="20"/><rect x="976" y="300" width="26" height="20"/></g>
  </g>

  <!-- 횃불 조형 기둥 원경 -->
  <g transform="translate(1080,540)" opacity="0.85">
    <rect x="-12" y="-330" width="24" height="330" fill="#8a6a48" stroke="#6e5232" stroke-width="3"/>
    <g stroke="#6e5232" stroke-width="2" opacity="0.7"><line x1="-12" y1="-280" x2="12" y2="-280"/><line x1="-12" y1="-220" x2="12" y2="-220"/><line x1="-12" y1="-160" x2="12" y2="-160"/><line x1="-12" y1="-100" x2="12" y2="-100"/></g>
    <path d="M0,-330 Q-20,-354 -10,-382 Q-4,-398 8,-410 Q4,-390 14,-378 Q26,-362 16,-344 Q8,-332 0,-330 Z" fill="#7a4c1e" stroke="#5f3a14" stroke-width="2.5"/>
    <ellipse cx="0" cy="4" rx="40" ry="10" fill="#b3ac9c"/>
  </g>

  <!-- 나무 -->
  <g transform="translate(150,560)"><rect x="-9" y="0" width="18" height="60" fill="#6a4a2c"/><circle cy="-30" r="56" fill="#5aa653"/><circle cx="-38" cy="-2" r="36" fill="#69b55f"/><circle cx="38" cy="-2" r="36" fill="#69b55f"/></g>
  <g transform="translate(1010,570)"><rect x="-8" y="0" width="16" height="50" fill="#6a4a2c"/><circle cy="-24" r="46" fill="#5aa653"/><circle cx="-30" cy="0" r="28" fill="#69b55f"/><circle cx="30" cy="0" r="28" fill="#69b55f"/></g>

  <!-- 잔디밭 -->
  <rect x="0" y="560" width="1200" height="160" fill="#9cc487"/>
  <path d="M0,560 Q600,548 1200,560 L1200,576 Q600,564 0,576 Z" fill="#8ab475"/>

  <!-- ===== 우남호 (대한항공 DC-3) : 측면 ===== -->
  <g transform="translate(600,468) rotate(11)">
    <ellipse cx="-20" cy="152" rx="360" ry="22" fill="#6e9c5c" opacity="0.55" transform="rotate(-11)"/>

    <!-- 수평꼬리날개 -->
    <polygon points="218,-16 324,2 334,16 234,4" fill="url(#wingg)" stroke="#8a97a4" stroke-width="3.5"/>

    <!-- 동체 -->
    <path d="M-330,-8
             Q-326,-32 -290,-42
             Q-240,-52 -180,-52
             L130,-52
             Q190,-50 222,-58
             Q246,-122 290,-138
             Q318,-146 312,-118
             Q307,-92 293,-72
             L305,-18
             Q301,-2 283,2
             Q220,18 140,24
             L-120,30
             Q-240,30 -296,16
             Q-324,8 -330,-8 Z"
          fill="url(#fus)" stroke="#8a97a4" stroke-width="4"/>
    <!-- 러더 라인 -->
    <path d="M236,-52 Q258,-104 293,-126" stroke="#8a97a4" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- 남색 창문 밴드 (기수~꼬리 앞까지) -->
    <path d="M-292,-40 Q-250,-49 -180,-49 L150,-49 Q185,-48 205,-44 L200,-26 L-282,-22 Q-292,-30 -292,-40 Z" fill="#1f3f6e"/>
    <!-- 조종석 창 -->
    <g fill="#0e1e38">
      <polygon points="-298,-34 -260,-44 -256,-28 -290,-24"/>
      <polygon points="-252,-45 -226,-46 -224,-30 -250,-29"/>
    </g>
    <!-- 객실 창(밴드 속 흰 창) -->
    <g fill="#eef4fa">
      <rect x="-150" y="-40" width="15" height="12" rx="3"/><rect x="-120" y="-40" width="15" height="12" rx="3"/><rect x="-90" y="-40" width="15" height="12" rx="3"/><rect x="-60" y="-40" width="15" height="12" rx="3"/><rect x="-30" y="-40" width="15" height="12" rx="3"/><rect x="0" y="-40" width="15" height="12" rx="3"/><rect x="30" y="-40" width="15" height="12" rx="3"/><rect x="60" y="-40" width="15" height="12" rx="3"/><rect x="90" y="-40" width="15" height="12" rx="3"/><rect x="120" y="-40" width="15" height="12" rx="3"/>
    </g>
    <!-- 밴드 위 흰 글씨 -->
    <text x="-192" y="-29" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="19" font-weight="800" fill="#ffffff">대한항공</text>
    <text x="-192" y="-13" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" font-weight="700" letter-spacing="1" fill="#dfeaf6">KOREAN AIR LINES</text>
    <!-- 동체 하이라이트 -->
    <path d="M-300,-14 Q-240,-16 -160,-16 L120,-14" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>

    <!-- 꼬리바퀴 -->
    <g><line x1="246" y1="12" x2="260" y2="80" stroke="#5b6670" stroke-width="6"/><circle cx="262" cy="92" r="13" fill="#26333d" stroke="#141c22" stroke-width="3"/></g>

    <!-- 날개(저익, 근측이 앞으로) -->
    <polygon points="-36,10 62,24 -258,128 -332,106" fill="url(#wingg)" stroke="#8a97a4" stroke-width="4"/>
    <path d="M-60,20 L-310,104" stroke="#98a6b4" stroke-width="2.5" opacity="0.8"/>

    <!-- 엔진 나셀 + 프로펠러 + 랜딩기어 (추진선: 동체 중하단 높이) -->
    <g transform="translate(-160,66) rotate(5)">
      <!-- 나셀 몸통(동체 옆에 붙은 원통) -->
      <path d="M-52,-28 Q0,-36 48,-20 Q60,-8 54,10 Q12,28 -48,24 Q-62,10 -62,-2 Q-62,-18 -52,-28 Z" fill="#5b6670" stroke="#42505c" stroke-width="4"/>
      <!-- 카울 전면 -->
      <ellipse cx="-54" cy="-2" rx="14" ry="27" fill="#3d4a56" stroke="#26333d" stroke-width="3"/>
      <!-- 랜딩기어(나셀 아래로 길게, 바퀴가 지면에) -->
      <g stroke="#5b6670" stroke-width="7"><line x1="-20" y1="20" x2="-16" y2="102"/><line x1="12" y1="18" x2="-2" y2="102"/></g>
      <line x1="-16" y1="76" x2="-2" y2="76" stroke="#5b6670" stroke-width="5"/>
      <circle cx="-9" cy="122" r="26" fill="#26333d" stroke="#141c22" stroke-width="4"/>
      <circle cx="-9" cy="122" r="8" fill="#8a97a4"/>
      <!-- 프로펠러(3엽, 빨간 팁) : 나셀 앞 -->
      <g stroke="#42505c" stroke-width="14" stroke-linecap="round" opacity="0.92">
        <line x1="-62" y1="-2" x2="-62" y2="-100"/>
        <line x1="-62" y1="-2" x2="18" y2="48"/>
        <line x1="-62" y1="-2" x2="-142" y2="48"/>
      </g>
      <g stroke="#9aa8b4" stroke-width="8" stroke-linecap="round">
        <line x1="-62" y1="-4" x2="-62" y2="-95"/>
        <line x1="-62" y1="-3" x2="14" y2="45"/>
        <line x1="-62" y1="-3" x2="-138" y2="45"/>
      </g>
      <g stroke="#c0392b" stroke-width="12" stroke-linecap="round">
        <line x1="-62" y1="-88" x2="-62" y2="-100"/><line x1="8" y1="42" x2="19" y2="49"/><line x1="-132" y1="42" x2="-143" y2="49"/>
      </g>
      <!-- 스피너 -->
      <circle cx="-62" cy="-2" r="13" fill="#8a97a4" stroke="#5b6670" stroke-width="3"/>
      <circle cx="-62" cy="-2" r="4.5" fill="#42505c"/>
    </g>
  </g>

  <!-- 안내판 -->
  <g transform="translate(880,624)">
    <g stroke="#6e5232" stroke-width="5"><line x1="-18" y1="0" x2="-18" y2="-52"/><line x1="18" y1="0" x2="18" y2="-52"/></g>
    <rect x="-58" y="-98" width="116" height="52" rx="7" fill="#f2ead3" stroke="#8a6540" stroke-width="3.5"/>
    <text x="0" y="-75" text-anchor="middle" font-family="'Jua',sans-serif" font-size="16" font-weight="700" fill="#5a3d1f">우남호</text>
    <text x="0" y="-57" text-anchor="middle" font-family="'Jua',sans-serif" font-size="10" fill="#7a5a36">우리나라 최초 민간 항공기</text>
  </g>

  <!-- 관람객 -->
  <g><circle cx="270" cy="656" r="10" fill="#e8c9a8"/><rect x="261" y="665" width="18" height="30" rx="6" fill="#c0392b"/></g>
  <g><circle cx="322" cy="664" r="9" fill="#e8c9a8"/><rect x="314" y="672" width="16" height="26" rx="6" fill="#2b6cb0"/></g>

  <!-- 사인 -->
  <g transform="translate(600,694)">
    <rect x="-72" y="-22" width="144" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#1f3f6e" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#1f3f6e">우남호</text>
  </g>
</svg>
</body>
</html>
