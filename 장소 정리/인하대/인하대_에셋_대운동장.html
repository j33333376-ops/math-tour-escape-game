<!-- 원본 크기: 1400x560 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인하대학교 대운동장</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .ihg-svg { display:block; width:100%; height:auto; }
  .ihg-track { fill:#bd5a34; stroke:#8f4326; stroke-width:2; }
  .ihg-lane { fill:none; stroke:#f4ede0; stroke-width:2.2; stroke-dasharray:16,10; opacity:0.85; }
  .ihg-grass { fill:#5aa04a; stroke:#f4ede0; stroke-width:3; }
  .ihg-grass-stripe { fill:#63aa52; opacity:0.55; }
  .ihg-line { stroke:#f8f5ec; stroke-width:2.6; fill:none; }
  .ihg-goal { stroke:#f8f5ec; stroke-width:2; fill:none; }
  .ihg-stand-base { fill:#8d8d8d; stroke:#63636b; stroke-width:1.2; }
  .ihg-stand-step { fill:#9c9ca4; }
  .ihg-roof { fill:#3f4652; stroke:#282e38; stroke-width:1.2; }
  .ihg-pole { fill:#5a5a5a; }
  .ihg-light { fill:#f6e9a8; stroke:#c9b04a; stroke-width:1; }
  .ihg-flag { fill:#12406f; }
  @keyframes ihgFlagWave { 0%,100% { transform: skewY(0deg); } 50% { transform: skewY(4deg); } }
  .ihg-flagwave { animation: ihgFlagWave 3s ease-in-out infinite; transform-origin: 0% 50%; }
</style>
</head>
<body>
<svg class="ihg-svg" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인하대학교 대운동장 트랙과 필드">
<title>인하대학교 대운동장</title>

<!-- 그림자 -->
<ellipse cx="700" cy="500" rx="600" ry="18" fill="#000" opacity="0.08"/>

<!-- 조명탑 4개 -->
<g class="ihg-pole">
  <rect x="94" y="70" width="8" height="200"/>
  <rect x="1298" y="70" width="8" height="200"/>
</g>
<g class="ihg-light">
  <rect x="70" y="50" width="56" height="22" rx="3"/>
  <rect x="1274" y="50" width="56" height="22" rx="3"/>
</g>
<g fill="#f6e9a8" opacity="0.35">
  <circle cx="98" cy="61" r="30"/>
  <circle cx="1302" cy="61" r="30"/>
</g>

<!-- 트랙 (외곽 붉은 우레탄) -->
<rect class="ihg-track" x="140" y="140" width="1120" height="360" rx="180" ry="180"/>

<!-- 레인 구분선 -->
<rect class="ihg-lane" x="152" y="152" width="1096" height="336" rx="168" ry="168"/>
<rect class="ihg-lane" x="166" y="166" width="1068" height="308" rx="154" ry="154"/>
<rect class="ihg-lane" x="180" y="180" width="1040" height="280" rx="140" ry="140"/>
<rect class="ihg-lane" x="194" y="194" width="1012" height="252" rx="126" ry="126"/>

<!-- 내부 잔디 필드 -->
<rect class="ihg-grass" x="200" y="200" width="1000" height="240" rx="120" ry="120"/>
<g class="ihg-grass-stripe">
  <rect x="240" y="200" width="60" height="240"/>
  <rect x="360" y="200" width="60" height="240"/>
  <rect x="480" y="200" width="60" height="240"/>
  <rect x="600" y="200" width="60" height="240"/>
  <rect x="720" y="200" width="60" height="240"/>
  <rect x="840" y="200" width="60" height="240"/>
  <rect x="960" y="200" width="60" height="240"/>
  <rect x="1080" y="200" width="60" height="240"/>
</g>

<!-- 필드 마킹 -->
<line class="ihg-line" x1="700" y1="200" x2="700" y2="440"/>
<circle class="ihg-line" cx="700" cy="320" r="55"/>
<circle cx="700" cy="320" r="3.4" fill="#f8f5ec"/>

<!-- 좌측 골 구역 -->
<rect class="ihg-goal" x="210" y="270" width="70" height="100"/>
<rect class="ihg-goal" x="210" y="296" width="30" height="48"/>
<rect x="200" y="308" width="10" height="24" fill="#f8f5ec"/>

<!-- 우측 골 구역 -->
<rect class="ihg-goal" x="1120" y="270" width="70" height="100"/>
<rect class="ihg-goal" x="1160" y="296" width="30" height="48"/>
<rect x="1190" y="308" width="10" height="24" fill="#f8f5ec"/>

<!-- 관중석 (상단) -->
<g class="ihg-stand-base">
  <rect x="380" y="96" width="640" height="46"/>
</g>
<g class="ihg-stand-step">
  <rect x="400" y="70" width="600" height="10"/>
  <rect x="415" y="82" width="570" height="10"/>
</g>
<!-- 지붕 -->
<g class="ihg-pole">
  <rect x="392" y="60" width="7" height="40"/>
  <rect x="560" y="52" width="7" height="48"/>
  <rect x="700" y="48" width="7" height="52"/>
  <rect x="840" y="52" width="7" height="48"/>
  <rect x="1000" y="60" width="7" height="40"/>
</g>
<rect class="ihg-roof" x="370" y="38" width="660" height="16" rx="4"/>

<!-- 관중 점점이 -->
<g opacity="0.9">
  <circle cx="430" cy="76" r="3.5" fill="#c0442f"/>
  <circle cx="450" cy="76" r="3.5" fill="#2a5a8a"/>
  <circle cx="470" cy="76" r="3.5" fill="#e8b23a"/>
  <circle cx="490" cy="76" r="3.5" fill="#3f8a4a"/>
  <circle cx="620" cy="88" r="3.5" fill="#c0442f"/>
  <circle cx="640" cy="88" r="3.5" fill="#2a5a8a"/>
  <circle cx="660" cy="88" r="3.5" fill="#e8b23a"/>
  <circle cx="780" cy="76" r="3.5" fill="#3f8a4a"/>
  <circle cx="800" cy="76" r="3.5" fill="#c0442f"/>
  <circle cx="820" cy="76" r="3.5" fill="#2a5a8a"/>
  <circle cx="920" cy="88" r="3.5" fill="#e8b23a"/>
  <circle cx="940" cy="88" r="3.5" fill="#3f8a4a"/>
</g>

<!-- 코너 깃발 -->
<g class="ihg-flagwave">
  <line x1="150" y1="320" x2="150" y2="290" stroke="#5a5a5a" stroke-width="2"/>
  <path class="ihg-flag" d="M150,290 L172,297 L150,304 Z"/>
</g>
<g class="ihg-flagwave">
  <line x1="1250" y1="320" x2="1250" y2="290" stroke="#5a5a5a" stroke-width="2"/>
  <path class="ihg-flag" d="M1250,290 L1272,297 L1250,304 Z"/>
</g>

</svg>
</body>
</html>
