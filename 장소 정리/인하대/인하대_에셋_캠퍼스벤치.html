<!-- 원본 크기: 1000x500 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠퍼스 벤치</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .ihv-svg { display:block; width:100%; height:auto; }
  .ihv-glow { animation: ihv-glow 4s ease-in-out infinite; }
  @keyframes ihv-glow { 0%,100% { opacity:0.35; } 50% { opacity:0.85; } }
  .ihv-leaf { animation: ihv-leaf 6s ease-in-out infinite; }
  @keyframes ihv-leaf { 0% { transform: translate(0,0) rotate(0deg); opacity:1; } 100% { transform: translate(-46px,110px) rotate(180deg); opacity:0; } }
</style>
</head>
<body>
<svg class="ihv-svg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="캠퍼스 벤치">
<title>캠퍼스 벤치</title>
<desc>인하대 캠퍼스길의 나무 벤치와 가로등, 은행잎.</desc>
<defs>
  <linearGradient id="ihvWood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c99a5c"/><stop offset="0.5" stop-color="#a8763a"/><stop offset="1" stop-color="#7d5424"/>
  </linearGradient>
  <linearGradient id="ihvIron" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2b3138"/><stop offset="0.4" stop-color="#5a626a"/><stop offset="1" stop-color="#20262c"/>
  </linearGradient>
  <radialGradient id="ihvLamp" cx="0.4" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#fffbe0"/><stop offset="1" stop-color="#f2c14e"/>
  </radialGradient>
</defs>
<ellipse cx="420" cy="462" rx="330" ry="26" fill="#3a3428" opacity="0.2"/>
<!-- 가로등 -->
<g transform="translate(858,0)">
  <rect x="-12" y="130" width="24" height="330" rx="8" fill="url(#ihvIron)"/>
  <path d="M-34,460 L34,460 L44,478 L-44,478 Z" fill="#20262c" stroke="#12171c" stroke-width="4"/>
  <path d="M-26,130 L26,130 L18,96 L-18,96 Z" fill="#2b3138" stroke="#12171c" stroke-width="3.4"/>
  <path d="M-40,96 L40,96 L26,44 L-26,44 Z" fill="#3a4650" stroke="#12171c" stroke-width="4.4"/>
  <ellipse class="ihv-glow" cy="72" rx="66" ry="52" fill="#ffe9a8"/>
  <path d="M-30,90 L30,90 L20,50 L-20,50 Z" fill="url(#ihvLamp)"/>
  <path d="M-44,44 L44,44 L0,14 Z" fill="#20262c" stroke="#12171c" stroke-width="4"/>
  <circle cy="10" r="7" fill="#5a626a"/>
  <g stroke="#5a626a" stroke-width="4">
    <line x1="-12" y1="200" x2="12" y2="200"/><line x1="-12" y1="300" x2="12" y2="300"/>
  </g>
</g>
<!-- 벤치 -->
<g transform="translate(380,0)">
  <!-- 뒷다리/등받이 프레임 -->
  <path d="M-282,470 L-282,214 C-282,200 -270,190 -256,190 L-244,190 C-230,190 -220,200 -220,214 L-220,470 Z" fill="url(#ihvIron)"/>
  <path d="M244,470 L244,214 C244,200 256,190 270,190 L282,190 C296,190 306,200 306,214 L306,470 Z" fill="url(#ihvIron)"/>
  <!-- 앞다리 -->
  <path d="M-246,340 L-246,470 L-206,470 L-206,340 Z" fill="url(#ihvIron)"/>
  <path d="M270,340 L270,470 L310,470 L310,340 Z" fill="url(#ihvIron)"/>
  <!-- 좌판 -->
  <g>
    <rect x="-300" y="322" width="626" height="24" rx="10" fill="url(#ihvWood)" stroke="#5e4220" stroke-width="4"/>
    <rect x="-300" y="352" width="626" height="24" rx="10" fill="url(#ihvWood)" stroke="#5e4220" stroke-width="4"/>
    <rect x="-300" y="382" width="626" height="24" rx="10" fill="url(#ihvWood)" stroke="#5e4220" stroke-width="4"/>
  </g>
  <!-- 등받이 -->
  <g>
    <rect x="-286" y="196" width="598" height="24" rx="10" fill="url(#ihvWood)" stroke="#5e4220" stroke-width="4"/>
    <rect x="-286" y="234" width="598" height="24" rx="10" fill="url(#ihvWood)" stroke="#5e4220" stroke-width="4"/>
    <rect x="-286" y="272" width="598" height="24" rx="10" fill="url(#ihvWood)" stroke="#5e4220" stroke-width="4"/>
  </g>
  <!-- 나무결 -->
  <g stroke="#8f6a34" stroke-width="2.4" opacity="0.55">
    <line x1="-240" y1="334" x2="220" y2="334"/><line x1="-240" y1="364" x2="220" y2="364"/>
    <line x1="-240" y1="394" x2="220" y2="394"/>
    <line x1="-240" y1="208" x2="220" y2="208"/><line x1="-240" y1="246" x2="220" y2="246"/>
  </g>
  <!-- 팔걸이 -->
  <path d="M-300,322 L-300,300 C-300,292 -292,286 -284,286 L-244,286" fill="none" stroke="url(#ihvIron)" stroke-width="14" stroke-linecap="round"/>
  <path d="M326,322 L326,300 C326,292 318,286 310,286 L270,286" fill="none" stroke="url(#ihvIron)" stroke-width="14" stroke-linecap="round"/>
  <!-- 명패 -->
  <rect x="-52" y="240" width="104" height="26" rx="5" fill="#1f3f7c" stroke="#122f5e" stroke-width="3"/>
  <text x="0" y="259" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffd94f">INHA UNIV.</text>
</g>
<!-- 은행잎 (바닥) -->
<g fill="#f2c14e" stroke="#c99a2c" stroke-width="2">
  <path d="M120,468 q-26,-22 -6,-38 q22,-12 32,10 q4,20 -26,28 Z"/>
  <path d="M212,478 q-22,-18 -5,-32 q19,-10 27,8 q3,17 -22,24 Z" opacity="0.9"/>
  <path d="M640,472 q-24,-20 -6,-35 q20,-11 29,9 q4,18 -23,26 Z"/>
  <path d="M744,480 q-20,-17 -5,-30 q17,-9 25,8 q3,16 -20,22 Z" opacity="0.9"/>
</g>
<!-- 떨어지는 은행잎 -->
<g fill="#e8b03c" stroke="#c99a2c" stroke-width="2">
  <path class="ihv-leaf" d="M300,180 q-22,-18 -5,-32 q19,-10 27,8 q3,17 -22,24 Z"/>
  <path class="ihv-leaf" d="M520,140 q-20,-17 -5,-30 q17,-9 25,8 q3,16 -20,22 Z" style="animation-delay:2.4s"/>
  <path class="ihv-leaf" d="M180,120 q-20,-17 -5,-30 q17,-9 25,8 q3,16 -20,22 Z" style="animation-delay:4.2s"/>
</g>
</svg>
</body>
</html>
