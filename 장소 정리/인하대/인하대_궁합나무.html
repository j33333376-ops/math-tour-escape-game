<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인하대 - 궁합나무</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .ct-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="ct-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인하대 궁합나무">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe0e6"/><stop offset="55%" stop-color="#fdeef1"/><stop offset="100%" stop-color="#f2f7ee"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="500" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="230" cy="80" rx="76" ry="22"/><ellipse cx="960" cy="66" rx="84" ry="24"/></g>
  <!-- 떠다니는 꽃잎 -->
  <g fill="#f2a8bc" opacity="0.85">
    <ellipse cx="300" cy="170" rx="7" ry="4" transform="rotate(-24 300 170)"/><ellipse cx="380" cy="120" rx="6" ry="3.5" transform="rotate(18 380 120)"/><ellipse cx="860" cy="140" rx="7" ry="4" transform="rotate(-12 860 140)"/><ellipse cx="940" cy="200" rx="6" ry="3.5" transform="rotate(24 940 200)"/><ellipse cx="620" cy="90" rx="6" ry="3.5" transform="rotate(10 620 90)"/>
  </g>

  <!-- 잔디 -->
  <rect x="0" y="500" width="1200" height="220" fill="#9cc487"/>
  <path d="M0,500 Q600,486 1200,500 L1200,516 Q600,502 0,516 Z" fill="#8ab475"/>

  <!-- 궁합나무 : 두 그루가 얽혀 하나의 하트 수관 -->
  <g transform="translate(600,500)">
    <!-- 수관(하트 모양) -->
    <path d="M0,-190 C-30,-260 -140,-268 -170,-196 C-196,-136 -120,-84 0,-40 C120,-84 196,-136 170,-196 C140,-268 30,-260 0,-190 Z"
          fill="#5aa653" stroke="#3f8a3f" stroke-width="5"/>
    <g fill="#69b55f">
      <circle cx="-120" cy="-200" r="42"/><circle cx="120" cy="-200" r="42"/><circle cx="-60" cy="-236" r="38"/><circle cx="60" cy="-236" r="38"/><circle cx="-140" cy="-140" r="34"/><circle cx="140" cy="-140" r="34"/><circle cx="-70" cy="-100" r="34"/><circle cx="70" cy="-100" r="34"/><circle cx="0" cy="-70" r="30"/>
    </g>
    <!-- 꽃 몇 송이 -->
    <g fill="#f2a8bc">
      <circle cx="-100" cy="-180" r="8"/><circle cx="96" cy="-210" r="8"/><circle cx="-30" cy="-120" r="8"/><circle cx="52" cy="-140" r="8"/><circle cx="0" cy="-230" r="8"/><circle cx="150" cy="-170" r="7"/><circle cx="-150" cy="-170" r="7"/>
    </g>
    <g fill="#ffffff"><circle cx="-100" cy="-180" r="3"/><circle cx="96" cy="-210" r="3"/><circle cx="-30" cy="-120" r="3"/><circle cx="52" cy="-140" r="3"/><circle cx="0" cy="-230" r="3"/></g>

    <!-- 두 줄기(서로 꼬임) -->
    <g fill="none" stroke-linecap="round">
      <path d="M-56,0 C-52,-40 -18,-60 12,-92 C34,-116 30,-140 18,-158" stroke="#7a5230" stroke-width="26"/>
      <path d="M56,0 C52,-40 18,-60 -12,-92 C-34,-116 -30,-140 -18,-158" stroke="#96693f" stroke-width="26"/>
      <path d="M-56,0 C-52,-40 -18,-60 12,-92 C34,-116 30,-140 18,-158" stroke="#5f3d1f" stroke-width="4" opacity="0.5"/>
      <!-- 가지 -->
      <path d="M14,-96 C48,-112 84,-118 118,-146" stroke="#7a5230" stroke-width="14"/>
      <path d="M-14,-96 C-48,-112 -84,-118 -118,-146" stroke="#96693f" stroke-width="14"/>
    </g>
    <!-- 뿌리목 -->
    <path d="M-70,0 Q-60,-14 -44,-8 L44,-8 Q60,-14 70,0 Z" fill="#7a5230"/>

    <!-- 보호 울타리 -->
    <g stroke="#8a6540" stroke-width="6" stroke-linecap="round">
      <line x1="-190" y1="-6" x2="-190" y2="34"/><line x1="-114" y1="2" x2="-114" y2="42"/><line x1="114" y1="2" x2="114" y2="42"/><line x1="190" y1="-6" x2="190" y2="34"/>
      <line x1="-206" y1="8" x2="-98" y2="20"/><line x1="98" y1="20" x2="206" y2="8"/>
    </g>

    <!-- 소원 리본 -->
    <g font-family="'Jua',sans-serif" font-size="11" text-anchor="middle">
      <g transform="translate(-150,-96) rotate(-8)"><rect x="-20" y="-10" width="40" height="22" rx="4" fill="#ffd23f" stroke="#d9a32b" stroke-width="2"/><text y="6" fill="#7a5a1f">합격</text></g>
      <g transform="translate(152,-108) rotate(10)"><rect x="-20" y="-10" width="40" height="22" rx="4" fill="#a8d8ea" stroke="#5a93ad" stroke-width="2"/><text y="6" fill="#1f4e5f">사랑</text></g>
      <g transform="translate(96,-58) rotate(-6)"><rect x="-20" y="-10" width="40" height="22" rx="4" fill="#f2a8bc" stroke="#c96a86" stroke-width="2"/><text y="6" fill="#7a2f45">우정</text></g>
    </g>
  </g>

  <!-- 커플 -->
  <g transform="translate(430,610)">
    <circle cx="0" cy="-30" r="11" fill="#e8c9a8"/><rect x="-10" y="-20" width="20" height="34" rx="7" fill="#c0392b"/>
    <circle cx="34" cy="-28" r="11" fill="#e8c9a8"/><rect x="24" y="-18" width="20" height="34" rx="7" fill="#2b6cb0"/>
    <path d="M10,-2 Q17,4 24,-2" stroke="#e8c9a8" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 머리 위 하트 -->
    <path d="M17,-56 c-3,-7 -13,-6 -13,2 c0,6 8,10 13,14 c5,-4 13,-8 13,-14 c0,-8 -10,-9 -13,-2 Z" fill="#e05e7a"/>
  </g>
  <!-- 사진 찍는 사람 -->
  <g transform="translate(800,616)">
    <circle cx="0" cy="-28" r="10" fill="#e8c9a8"/><rect x="-9" y="-19" width="18" height="30" rx="6" fill="#2f855a"/>
    <rect x="8" y="-32" width="18" height="12" rx="3" fill="#3d4a56"/><circle cx="17" cy="-26" r="3.5" fill="#8fd0e4"/>
  </g>

  <!-- 사인 -->
  <g transform="translate(600,684)">
    <rect x="-86" y="-22" width="172" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#c96a86" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#a04360">궁합나무</text>
  </g>
</svg>
</body>
</html>
