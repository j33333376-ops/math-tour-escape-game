<!-- 원본 크기: 500x750 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전공 서적</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .ihb-svg { display:block; width:100%; height:auto; }

</style>
</head>
<body>
<svg class="ihb-svg" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전공 서적">
<title>전공 서적</title>
<desc>인하대 공대생의 전공 서적 더미와 안경, 커피.</desc>
<defs>
  <linearGradient id="ihbB1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f6fb4"/><stop offset="1" stop-color="#1f3f7c"/>
  </linearGradient>
  <linearGradient id="ihbB2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c2452e"/><stop offset="1" stop-color="#8c1f18"/>
  </linearGradient>
  <linearGradient id="ihbB3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f8f6c"/><stop offset="1" stop-color="#215f46"/>
  </linearGradient>
  <linearGradient id="ihbB4" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8b03c"/><stop offset="1" stop-color="#a8781c"/>
  </linearGradient>
  <linearGradient id="ihbPage" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fdfaf2"/><stop offset="0.5" stop-color="#eee7d6"/><stop offset="1" stop-color="#d9d0ba"/>
  </linearGradient>
</defs>
<ellipse cx="250" cy="712" rx="196" ry="22" fill="#2a3040" opacity="0.2"/>
<!-- 1층 -->
<g transform="translate(250,660)">
  <path d="M-190,-34 L190,-34 L190,34 L-190,34 Z" fill="url(#ihbB1)" stroke="#122f5e" stroke-width="4.4"/>
  <path d="M-190,-34 L190,-34 L190,-22 L-190,-22 Z" fill="#5f8fd0"/>
  <path d="M-176,-22 L176,-22 L176,22 L-176,22 Z" fill="url(#ihbPage)" opacity="0.15"/>
  <rect x="-166" y="-14" width="332" height="14" rx="4" fill="#ffd94f" opacity="0.85"/>
  <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#dbe8ff">공업수학</text>
</g>
<!-- 2층 -->
<g transform="translate(238,594) rotate(-2)">
  <path d="M-178,-32 L178,-32 L178,32 L-178,32 Z" fill="url(#ihbB2)" stroke="#6e120c" stroke-width="4.4"/>
  <path d="M-178,-32 L178,-32 L178,-20 L-178,-20 Z" fill="#e6706a"/>
  <rect x="-156" y="-12" width="312" height="12" rx="4" fill="#ffe9a8" opacity="0.85"/>
  <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffe4e0">일반물리학</text>
</g>
<!-- 3층 -->
<g transform="translate(262,530) rotate(3)">
  <path d="M-166,-30 L166,-30 L166,30 L-166,30 Z" fill="url(#ihbB3)" stroke="#144534" stroke-width="4.4"/>
  <path d="M-166,-30 L166,-30 L166,-19 L-166,-19 Z" fill="#6fbf9c"/>
  <rect x="-144" y="-11" width="288" height="12" rx="4" fill="#dff2e8" opacity="0.7"/>
  <text x="0" y="17" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#dff2e8">선형대수</text>
</g>
<!-- 4층 -->
<g transform="translate(246,472) rotate(-3)">
  <path d="M-150,-26 L150,-26 L150,26 L-150,26 Z" fill="url(#ihbB4)" stroke="#7d5814" stroke-width="4.4"/>
  <path d="M-150,-26 L150,-26 L150,-16 L-150,-16 Z" fill="#ffd98a"/>
  <text x="0" y="14" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#5a3f08">회로이론</text>
</g>
<!-- 펼친 책 (맨 위) -->
<g transform="translate(250,368)">
  <path d="M0,60 C-46,26 -132,14 -186,20 L-186,-56 C-132,-62 -46,-50 0,-16 Z" fill="url(#ihbPage)" stroke="#c4b899" stroke-width="4.4"/>
  <path d="M0,60 C46,26 132,14 186,20 L186,-56 C132,-62 46,-50 0,-16 Z" fill="url(#ihbPage)" stroke="#c4b899" stroke-width="4.4"/>
  <path d="M0,-16 L0,60" stroke="#b8ab8c" stroke-width="4"/>
  <!-- 글줄 -->
  <g stroke="#a89a7c" stroke-width="2.6" opacity="0.8">
    <line x1="-166" y1="-32" x2="-24" y2="-8"/><line x1="-166" y1="-12" x2="-24" y2="10"/>
    <line x1="-166" y1="8" x2="-24" y2="28"/><line x1="-166" y1="28" x2="-70" y2="42"/>
    <line x1="24" y1="-8" x2="166" y2="-32"/><line x1="24" y1="10" x2="166" y2="-12"/>
    <line x1="24" y1="28" x2="166" y2="8"/><line x1="70" y1="42" x2="166" y2="28"/>
  </g>
  <!-- 수식 -->
  <g fill="#2f4a7c" font-family="serif" font-style="italic">
    <text x="-100" y="-38" text-anchor="middle" font-size="26">∫f(x)dx</text>
    <text x="98" y="-40" text-anchor="middle" font-size="26">E=mc²</text>
  </g>
  <!-- 책갈피 -->
  <path d="M120,-52 L146,-56 L146,44 L133,32 L120,46 Z" fill="#c2452e" stroke="#8c1f18" stroke-width="3"/>
</g>
<!-- 안경 -->
<g transform="translate(150,288) rotate(-10)">
  <circle cx="-42" cy="0" r="34" fill="#cfe4f2" fill-opacity="0.4" stroke="#3a4650" stroke-width="6"/>
  <circle cx="42" cy="0" r="34" fill="#cfe4f2" fill-opacity="0.4" stroke="#3a4650" stroke-width="6"/>
  <path d="M-8,-4 q8,-10 16,0" fill="none" stroke="#3a4650" stroke-width="5"/>
  <path d="M-76,-6 L-108,-18" stroke="#3a4650" stroke-width="5" stroke-linecap="round"/>
  <path d="M76,-6 L108,-18" stroke="#3a4650" stroke-width="5" stroke-linecap="round"/>
  <path d="M-58,-16 q16,-10 32,-2" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
</g>
<!-- 커피컵 -->
<g transform="translate(380,236)">
  <path d="M-44,-70 L44,-70 L34,52 C33,64 24,72 12,72 L-12,72 C-24,72 -33,64 -34,52 Z"
        fill="#f2f0ea" stroke="#8f9aa4" stroke-width="4.4"/>
  <path d="M-46,-84 L46,-84 L44,-64 L-44,-64 Z" fill="#c2452e" stroke="#8c1f18" stroke-width="4"/>
  <rect x="-50" y="-96" width="100" height="16" rx="6" fill="#e6403a" stroke="#8c1f18" stroke-width="3.4"/>
  <rect x="-36" y="-40" width="72" height="46" rx="6" fill="#1f3f7c"/>
  <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ffd94f">INHA</text>
  <path d="M-34,-60 L-30,44" stroke="#ffffff" stroke-width="8" opacity="0.6" stroke-linecap="round"/>
</g>
<!-- 연필 -->
<g transform="translate(120,430) rotate(74)">
  <rect x="-9" y="-90" width="18" height="150" rx="3" fill="#f2c14e" stroke="#a8781c" stroke-width="3"/>
  <path d="M-9,60 L9,60 L0,88 Z" fill="#e0bb84" stroke="#a8781c" stroke-width="3"/>
  <path d="M-4,78 L4,78 L0,88 Z" fill="#3a3a3a"/>
  <rect x="-9" y="-102" width="18" height="14" rx="3" fill="#8f9aa4"/>
  <rect x="-9" y="-118" width="18" height="18" rx="4" fill="#f28fa0"/>
</g>
</svg>
</body>
</html>
