<!-- 원본 크기: 1200x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인하대학교 캠퍼스길</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .icg-svg { display:block; width:100%; height:auto; }
  .icg-ground { fill:#7fae6a; }
  .icg-ground-line { stroke:#6c9a58; stroke-width:1.5; stroke-dasharray:10,8; opacity:0.6; }
  .icg-path { fill:none; stroke:#cdc4ab; stroke-linecap:butt; }
  .icg-path-edge { fill:none; stroke:#a99e80; stroke-width:2; }
  .icg-path-dash { fill:none; stroke:#fff; stroke-width:2; stroke-dasharray:10,10; opacity:0.55; }
  .icg-bldA-wall { fill:#d8d3c6; stroke:#a89f8a; stroke-width:1; }
  .icg-bldA-band { fill:#c3bcaa; }
  .icg-bldA-glass { fill:url(#icgGlassA); }
  .icg-bldB-wall { fill:url(#icgBrickB); stroke:#6e2418; stroke-width:1; }
  .icg-bldB-trim { fill:#f2ede0; stroke:#c9c2ab; stroke-width:0.8; }
  .icg-bldB-glass { fill:url(#icgGlassB); }
  .icg-sign-bg { fill:#123a6b; }
  .icg-sign-text { fill:#fff; font-family:"Malgun Gothic", sans-serif; font-size:22px; font-weight:bold; text-anchor:middle; }
  .icg-tree-trunk { fill:#6a4a2a; }
  .icg-tree-dark { fill:#4f7a3c; }
  .icg-tree-light { fill:#6fa85a; opacity:0.9; }
  .icg-lamp-pole { fill:#4a4a4a; }
  .icg-lamp-glow { fill:#ffe9a8; opacity:0.75; }
  @keyframes icgLampGlow { 0%,100% { opacity:0.55; } 50% { opacity:0.9; } }
  .icg-lamp-glow { animation: icgLampGlow 3.2s ease-in-out infinite; }
</style>
</head>
<body>
<svg class="icg-svg" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인하대학교 캠퍼스 단과대 A동 B동과 갈림길">
<title>인하대학교 캠퍼스길</title>
<defs>
  <linearGradient id="icgGlassA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9cc0d4"/>
    <stop offset="1" stop-color="#6a94aa"/>
  </linearGradient>
  <linearGradient id="icgGlassB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fb0c4"/>
    <stop offset="1" stop-color="#5f8298"/>
  </linearGradient>
  <pattern id="icgBrickB" width="22" height="11" patternUnits="userSpaceOnUse">
    <rect width="22" height="11" fill="#9c4530"/>
    <rect x="0" y="0" width="10" height="5" fill="#ac5138" stroke="#6e2418" stroke-width="0.4"/>
    <rect x="11" y="0" width="10" height="5" fill="#ac5138" stroke="#6e2418" stroke-width="0.4"/>
    <rect x="-5" y="6" width="10" height="5" fill="#ac5138" stroke="#6e2418" stroke-width="0.4"/>
    <rect x="6" y="6" width="10" height="5" fill="#ac5138" stroke="#6e2418" stroke-width="0.4"/>
    <rect x="17" y="6" width="10" height="5" fill="#ac5138" stroke="#6e2418" stroke-width="0.4"/>
  </pattern>
</defs>

<!-- 하단 잔디 지면대 -->
<rect class="icg-ground" x="0" y="556" width="1200" height="44"/>

<path class="icg-path-edge" d="M600,600 L600,428"/>

<path class="icg-path-edge" d="M600,428 L268,372"/>
<path class="icg-path" d="M600,428 L268,372" stroke-width="58"/>

<path class="icg-path-dash" d="M600,596 L600,432"/>
<path class="icg-path-dash" d="M600,426 L272,374"/>
<path class="icg-path-dash" d="M600,426 L928,374"/>
