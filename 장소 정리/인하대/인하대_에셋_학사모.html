<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학사모와 졸업장</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .ihh-svg { display:block; width:100%; height:auto; }
  .ihh-tassel { animation: ihh-tassel 4.6s ease-in-out infinite; transform-origin: 452px 208px; }
  @keyframes ihh-tassel { 0%,100% { transform: rotate(-6deg);} 50% { transform: rotate(6deg);} }
</style>
</head>
<body>
<svg class="ihh-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="학사모와 졸업장">
<title>학사모와 졸업장</title>
<desc>인하대 졸업식의 학사모와 리본 묶인 졸업장.</desc>
<defs>
  <linearGradient id="ihhCap" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#31456e"/><stop offset="0.6" stop-color="#1f3054"/><stop offset="1" stop-color="#131f3a"/>
  </linearGradient>
  <linearGradient id="ihhBoard" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b5280"/><stop offset="0.5" stop-color="#243962"/><stop offset="1" stop-color="#152342"/>
  </linearGradient>
  <linearGradient id="ihhScroll" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf9ee"/><stop offset="1" stop-color="#e4d9bd"/>
  </linearGradient>
  <linearGradient id="ihhGold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a5f18"/><stop offset="0.4" stop-color="#ffd94f"/><stop offset="1" stop-color="#a8781c"/>
  </linearGradient>
</defs>
<ellipse cx="300" cy="540" rx="240" ry="28" fill="#1c2438" opacity="0.2"/>
<!-- 졸업장 -->
<g transform="translate(300,470) rotate(-4)">
  <path d="M-210,-46 L210,-46 L210,46 L-210,46 Z" fill="url(#ihhScroll)" stroke="#c4b48c" stroke-width="4.4"/>
  <ellipse cx="-210" cy="0" rx="18" ry="46" fill="#f6f0e0" stroke="#c4b48c" stroke-width="4.4"/>
  <ellipse cx="210" cy="0" rx="18" ry="46" fill="#e8dcc0" stroke="#c4b48c" stroke-width="4.4"/>
  <g stroke="#c9bb96" stroke-width="3" opacity="0.8">
    <line x1="-160" y1="-22" x2="160" y2="-22"/><line x1="-160" y1="-4" x2="160" y2="-4"/>
    <line x1="-160" y1="14" x2="120" y2="14"/>
  </g>
  <!-- 리본 -->
  <rect x="-34" y="-52" width="68" height="104" fill="#c2201a"/>
  <path d="M-34,-52 C-70,-72 -92,-56 -80,-32 C-66,-42 -48,-46 -34,-44 Z" fill="#e6403a" stroke="#8c1f18" stroke-width="3"/>
  <path d="M34,-52 C70,-72 92,-56 80,-32 C66,-42 48,-46 34,-44 Z" fill="#e6403a" stroke="#8c1f18" stroke-width="3"/>
  <circle r="16" fill="#ffd94f" stroke="#a8781c" stroke-width="3.4"/>
</g>
<!-- 학사모 -->
<g transform="translate(280,240)">
  <!-- 모자통 -->
  <path d="M-96,20 C-96,64 -60,90 0,90 C60,90 96,64 96,20 L96,-14 L-96,-14 Z"
        fill="url(#ihhCap)" stroke="#0d1526" stroke-width="5"/>
  <ellipse cy="20" rx="96" ry="34" fill="#26375c" opacity="0"/>
  <path d="M-96,20 C-70,44 70,44 96,20" fill="none" stroke="#0d1526" stroke-width="4" opacity="0.5"/>
  <!-- 판 -->
  <path d="M0,-104 L200,-30 L0,44 L-200,-30 Z" fill="url(#ihhBoard)" stroke="#0d1526" stroke-width="5.4"/>
  <path d="M0,-104 L200,-30 L0,44 L-200,-30 Z" fill="none" stroke="#5f7fb4" stroke-width="2.4" opacity="0.6"/>
  <path d="M0,-104 L0,44" stroke="#0d1526" stroke-width="2" opacity="0.35"/>
  <path d="M-200,-30 L200,-30" stroke="#0d1526" stroke-width="2" opacity="0.35"/>
  <!-- 판 하이라이트 -->
  <path d="M0,-98 L182,-32 L0,-64 Z" fill="#5f7fb4" opacity="0.25"/>
  <!-- 단추 -->
  <circle cy="-30" r="14" fill="url(#ihhGold)" stroke="#6e4a10" stroke-width="3.4"/>
  <circle cy="-30" r="6" fill="#fff2b8"/>
</g>
<!-- 술 -->
<g class="ihh-tassel">
  <path d="M280,210 C356,214 424,206 452,208" fill="none" stroke="#ffd94f" stroke-width="6"/>
  <path d="M452,208 C458,238 456,266 448,290" fill="none" stroke="#ffd94f" stroke-width="6"/>
  <rect x="428" y="284" width="42" height="18" rx="8" fill="url(#ihhGold)" stroke="#6e4a10" stroke-width="3"/>
  <g stroke="#ffd94f" stroke-width="5" stroke-linecap="round">
    <line x1="434" y1="302" x2="428" y2="376"/>
    <line x1="443" y1="302" x2="440" y2="386"/>
    <line x1="452" y1="302" x2="452" y2="390"/>
    <line x1="461" y1="302" x2="464" y2="384"/>
    <line x1="468" y1="302" x2="476" y2="372"/>
  </g>
</g>
</svg>
</body>
</html>
