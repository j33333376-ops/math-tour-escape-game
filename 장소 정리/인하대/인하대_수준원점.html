<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인하대 - 수준원점</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .bm-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="bm-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="대한민국 수준원점">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c5e0f2"/><stop offset="100%" stop-color="#eef6fb"/></linearGradient>
    <linearGradient id="stoneb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e6e2d8"/><stop offset="100%" stop-color="#c9c3b4"/></linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8fa8b6"/><stop offset="100%" stop-color="#6a8492"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="500" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="250" cy="80" rx="76" ry="22"/><ellipse cx="940" cy="66" rx="84" ry="24"/></g>

  <!-- 뒤편 캠퍼스 나무들 -->
  <g opacity="0.8">
    <g transform="translate(150,500)"><rect x="-8" y="0" width="16" height="56" fill="#6a4a2c"/><circle cy="-22" r="46" fill="#5aa653"/><circle cx="-30" cy="2" r="30" fill="#69b55f"/><circle cx="30" cy="2" r="30" fill="#69b55f"/></g>
    <g transform="translate(1050,500)"><rect x="-8" y="0" width="16" height="56" fill="#6a4a2c"/><circle cy="-22" r="46" fill="#5aa653"/><circle cx="-30" cy="2" r="30" fill="#69b55f"/><circle cx="30" cy="2" r="30" fill="#69b55f"/></g>
    <g transform="translate(280,510)" opacity="0.8"><rect x="-6" y="0" width="12" height="42" fill="#6a4a2c"/><circle cy="-16" r="34" fill="#69b55f"/></g>
    <g transform="translate(920,510)" opacity="0.8"><rect x="-6" y="0" width="12" height="42" fill="#6a4a2c"/><circle cy="-16" r="34" fill="#69b55f"/></g>
  </g>

  <!-- 잔디밭 -->
  <rect x="0" y="500" width="1200" height="220" fill="#9cc487"/>
  <path d="M0,500 Q600,486 1200,500 L1200,516 Q600,502 0,516 Z" fill="#8ab475"/>
  <!-- 진입 보도 -->
  <polygon points="520,720 552,560 648,560 680,720" fill="#d8cfbc"/>
  <g stroke="#bfb49c" stroke-width="3"><line x1="540" y1="660" x2="660" y2="660"/><line x1="548" y1="614" x2="652" y2="614"/><line x1="554" y1="584" x2="646" y2="584"/></g>

  <!-- 수준원점 원형 보호각 -->
  <g transform="translate(600,470)">
    <!-- 기단 -->
    <ellipse cx="0" cy="92" rx="150" ry="26" fill="#b3ac9c"/>
    <rect x="-150" y="60" width="300" height="32" fill="url(#stoneb)" stroke="#a39a86" stroke-width="3"/>
    <ellipse cx="0" cy="60" rx="150" ry="26" fill="#dcd6ca" stroke="#a39a86" stroke-width="3"/>
    <!-- 원형 몸체(화강암 원통) -->
    <path d="M-108,58 L-108,-96 Q-108,-116 -88,-118 L88,-118 Q108,-116 108,-96 L108,58 Z" fill="url(#stoneb)" stroke="#a39a86" stroke-width="3.5"/>
    <!-- 돌 줄눈 -->
    <g stroke="#c3bba8" stroke-width="2.5" opacity="0.9">
      <line x1="-108" y1="-70" x2="108" y2="-70"/><line x1="-108" y1="-26" x2="108" y2="-26"/><line x1="-108" y1="18" x2="108" y2="18"/>
      <line x1="-54" y1="-118" x2="-54" y2="-70"/><line x1="54" y1="-118" x2="54" y2="-70"/>
      <line x1="0" y1="-70" x2="0" y2="-26"/><line x1="-72" y1="-26" x2="-72" y2="18"/><line x1="72" y1="-26" x2="72" y2="18"/>
    </g>
    <!-- 돔 지붕 -->
    <path d="M-118,-112 Q0,-198 118,-112 Z" fill="url(#dome)" stroke="#54707e" stroke-width="3.5"/>
    <ellipse cx="0" cy="-112" rx="118" ry="16" fill="#7d97a5" stroke="#54707e" stroke-width="3"/>
    <circle cx="0" cy="-172" r="9" fill="#54707e"/>
    <!-- 청동 문 -->
    <rect x="-38" y="-58" width="76" height="116" rx="8" fill="#5f6e4e" stroke="#42502f" stroke-width="3.5"/>
    <line x1="0" y1="-58" x2="0" y2="58" stroke="#42502f" stroke-width="3"/>
    <circle cx="-10" cy="4" r="4" fill="#c9a24a"/><circle cx="10" cy="4" r="4" fill="#c9a24a"/>
    <g stroke="#42502f" stroke-width="2" opacity="0.8"><rect x="-30" y="-48" width="22" height="40" fill="none" rx="4"/><rect x="8" y="-48" width="22" height="40" fill="none" rx="4"/></g>
    <!-- 현판 -->
    <rect x="-86" y="-104" width="172" height="34" rx="6" fill="#3d4a56" stroke="#26333d" stroke-width="2.5"/>
    <text x="0" y="-80" text-anchor="middle" font-family="'Nanum Myeongjo',serif" font-size="21" font-weight="800" fill="#f2ead3">대한민국 수준원점</text>
  </g>

  <!-- 안내석 : 해발 기준 -->
  <g transform="translate(320,590)">
    <polygon points="-64,44 64,44 54,-34 -54,-34" fill="#8f887a" stroke="#6e6858" stroke-width="3"/>
    <text x="0" y="-6" text-anchor="middle" font-family="'Jua',sans-serif" font-size="17" fill="#f7f5ef">해발고도 기준</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Jua',sans-serif" font-size="19" font-weight="700" fill="#ffd23f">26.6871m</text>
  </g>
  <!-- 측량 기사 -->
  <g transform="translate(880,600)">
    <g stroke="#8a6540" stroke-width="4"><line x1="0" y1="0" x2="-16" y2="44"/><line x1="0" y1="0" x2="16" y2="44"/><line x1="0" y1="2" x2="0" y2="46"/></g>
    <rect x="-12" y="-22" width="24" height="18" rx="4" fill="#3f6b82" stroke="#2c4f63" stroke-width="2.5"/>
    <circle cx="18" cy="-36" r="9" fill="#e8c9a8"/>
    <rect x="10" y="-28" width="16" height="26" rx="6" fill="#e05e2b"/>
  </g>

  <!-- 사인 -->
  <g transform="translate(600,684)">
    <rect x="-86" y="-22" width="172" height="42" rx="10" fill="rgba(255,255,255,0.94)" stroke="#54707e" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#3d4a56">수준원점</text>
  </g>
</svg>
</body>
</html>
