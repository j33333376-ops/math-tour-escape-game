<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>점박이물범</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .ojm-svg { display:block; width:100%; height:auto; }
  .ojm-breathe { animation: ojm-breathe 4.4s ease-in-out infinite; transform-origin: 300px 400px; }
  @keyframes ojm-breathe { 0%,100% { transform: scale(1);} 50% { transform: scale(1.015);} }
  .ojm-flip { animation: ojm-flip 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 50%; }
  @keyframes ojm-flip { 0%,100% { transform: rotate(-5deg);} 50% { transform: rotate(6deg);} }
</style>
</head>
<body>
<svg class="ojm-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="점박이물범">
<title>점박이물범</title>
<desc>백령도 앞바다의 천연기념물 점박이물범.</desc>
<defs>
  <linearGradient id="ojmBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b8c2c8"/><stop offset="0.5" stop-color="#8f9ca4"/><stop offset="1" stop-color="#5f6b74"/>
  </linearGradient>
  <linearGradient id="ojmRock" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a29a8c"/><stop offset="1" stop-color="#665f54"/>
  </linearGradient>
</defs>
<!-- 갯바위 -->
<path d="M40,470 C80,412 160,388 236,400 C300,368 400,368 464,400 C528,392 566,424 574,470 Z"
      fill="url(#ojmRock)" stroke="#4d463d" stroke-width="5"/>
<g fill="#8c8477" opacity="0.7">
  <ellipse cx="140" cy="440" rx="30" ry="13"/><ellipse cx="480" cy="442" rx="26" ry="11"/>
</g>
<!-- 뒷지느러미 -->
<g class="ojm-flip">
  <path d="M120,368 C74,340 44,326 22,332 C40,352 44,376 34,396 C58,400 92,392 122,378 Z"
        fill="url(#ojmBody)" stroke="#4a545c" stroke-width="4.4"/>
  <g stroke="#4a545c" stroke-width="2.4" opacity="0.6" fill="none">
    <path d="M40,340 L96,368"/><path d="M34,362 L104,378"/><path d="M36,384 L108,384"/>
  </g>
</g>
<g class="ojm-breathe">
  <!-- 몸통 -->
  <path d="M120,376
           C112,318 168,272 258,264
           C348,256 436,286 470,336
           C500,380 480,424 424,436
           C340,454 190,442 140,414
           C122,404 120,392 120,376 Z"
        fill="url(#ojmBody)" stroke="#4a545c" stroke-width="6"/>
  <!-- 배 -->
  <path d="M154,410 C230,438 370,444 442,420 C400,442 250,450 168,428 Z" fill="#e2e8ec" opacity="0.75"/>
  <!-- 앞지느러미 -->
  <path d="M270,410 C258,444 268,470 296,478 C322,484 344,466 340,438 C338,420 320,406 296,404 Z"
        fill="#7d8a94" stroke="#4a545c" stroke-width="4.4"/>
  <g stroke="#4a545c" stroke-width="2.4" opacity="0.6" fill="none">
    <path d="M282,424 L288,472"/><path d="M300,414 L308,478"/><path d="M318,414 L328,468"/>
  </g>
  <!-- 반점 -->
  <g fill="#4a545c" opacity="0.55">
    <ellipse cx="200" cy="316" rx="15" ry="10"/><ellipse cx="252" cy="298" rx="13" ry="9"/>
    <ellipse cx="306" cy="300" rx="15" ry="10"/><ellipse cx="358" cy="312" rx="13" ry="9"/>
    <ellipse cx="410" cy="330" rx="14" ry="9"/>
    <ellipse cx="176" cy="358" rx="13" ry="9"/><ellipse cx="230" cy="346" rx="15" ry="10"/>
    <ellipse cx="284" cy="348" rx="13" ry="9"/><ellipse cx="336" cy="356" rx="14" ry="9"/>
    <ellipse cx="392" cy="372" rx="13" ry="9"/><ellipse cx="440" cy="358" rx="12" ry="8"/>
    <ellipse cx="206" cy="392" rx="12" ry="8"/><ellipse cx="262" cy="386" rx="13" ry="9"/>
    <ellipse cx="366" cy="398" rx="12" ry="8"/>
  </g>
  <!-- 머리 -->
  <path d="M410,300 C420,258 462,236 506,246 C550,256 570,300 552,338 C534,374 484,384 448,362 C420,346 406,326 410,300 Z"
        fill="#a2aeb6" stroke="#4a545c" stroke-width="5"/>
  <!-- 주둥이 -->
  <path d="M520,318 C554,314 574,326 572,344 C570,362 546,370 518,362 Z" fill="#c4ced4" stroke="#4a545c" stroke-width="4"/>
  <ellipse cx="562" cy="334" rx="11" ry="8" fill="#3a4650"/>
  <path d="M536,354 q14,8 22,0" fill="none" stroke="#4a545c" stroke-width="3.4" stroke-linecap="round"/>
  <!-- 수염 -->
  <g stroke="#e6ecf0" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M534,336 L582,326"/><path d="M534,344 L586,344"/><path d="M534,352 L580,362"/>
    <path d="M528,332 L570,314"/>
  </g>
  <!-- 눈 -->
  <circle cx="480" cy="292" r="17" fill="#1f272e"/>
  <circle cx="474" cy="286" r="6" fill="#ffffff"/>
  <circle cx="486" cy="298" r="3" fill="#ffffff" opacity="0.7"/>
  <!-- 귀구멍 -->
  <ellipse cx="432" cy="312" rx="5" ry="8" fill="#4a545c" opacity="0.7"/>
</g>
<!-- 물결 -->
<g fill="none" stroke="#7fb4c4" stroke-width="8" stroke-linecap="round" opacity="0.85">
  <path d="M28,500 q32,-14 64,0 q32,14 64,0"/>
  <path d="M420,506 q32,-14 64,0 q32,14 64,0"/>
  <path d="M180,540 q34,-14 68,0 q34,14 68,0 q34,-14 68,0"/>
</g>
</svg>
</body>
</html>
