<!-- 원본 크기: 800x440 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덕적도 해안</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .djd-svg { display:block; width:100%; height:auto; }
  .djd-w1 { animation: djd-drift 7s ease-in-out infinite; transform-origin: center; }
  .djd-w2 { animation: djd-drift 9s ease-in-out infinite reverse; transform-origin: center; }
  .djd-w3 { animation: djd-drift 5.5s ease-in-out infinite; transform-origin: center; }
  @keyframes djd-drift {
    0%,100% { transform: translateX(0); opacity: 0.75; }
    50% { transform: translateX(14px); opacity: 1; }
  }
  .djd-glint { animation: djd-glint 4s ease-in-out infinite; }
  @keyframes djd-glint {
    0%,100% { opacity: 0.25; }
    50% { opacity: 0.55; }
  }
  .djd-boat { animation: djd-bob 6s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes djd-bob {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-3px) rotate(1deg); }
  }
</style>
</head>
<body>
<svg class="djd-svg" viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="덕적도 서포리 해안 모래사장과 방파제">
<title>덕적도 해안</title>
<desc>인천 옹진군 덕적도 서포리의 모래해안과 방파제 등대, 해송 숲과 고깃배</desc>
<defs>
  <linearGradient id="djdSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c3e4f2"/>
    <stop offset="0.65" stop-color="#e7f4f8"/>
    <stop offset="1" stop-color="#f8f2df"/>
  </linearGradient>
  <linearGradient id="djdSea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#356f92"/>
    <stop offset="0.5" stop-color="#5fa8c4"/>
    <stop offset="1" stop-color="#9dcdda"/>
  </linearGradient>
  <linearGradient id="djdSand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4e6bd"/>
    <stop offset="0.5" stop-color="#ecd6a0"/>
    <stop offset="1" stop-color="#d8c184"/>
  </linearGradient>
  <linearGradient id="djdRock" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a49a8c"/>
    <stop offset="0.5" stop-color="#847a6c"/>
    <stop offset="1" stop-color="#5c5448"/>
  </linearGradient>
  <radialGradient id="djdSun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="djdPine" cx="0.4" cy="0.3" r="0.8">
    <stop offset="0" stop-color="#5f8a52"/>
    <stop offset="1" stop-color="#385c34"/>
  </radialGradient>
</defs>

<!-- 하늘 -->
<rect x="0" y="0" width="800" height="230" fill="url(#djdSky)"/>
<circle cx="128" cy="62" r="28" fill="#fdf3c8" opacity="0.9"/>
<circle cx="128" cy="62" r="42" fill="#fdf3c8" opacity="0.3"/>
<g fill="#ffffff" opacity="0.85">
  <ellipse cx="560" cy="48" rx="50" ry="17"/>
  <ellipse cx="606" cy="42" rx="34" ry="20"/>
  <ellipse cx="520" cy="54" rx="26" ry="12"/>
  <ellipse cx="300" cy="36" rx="38" ry="13"/>
</g>
<g fill="none" stroke="#5f7078" stroke-width="2" stroke-linecap="round" opacity="0.65">
  <path d="M400,86 q9,-8 18,0 q9,-8 18,0"/>
  <path d="M462,64 q7,-6 14,0 q7,-6 14,0"/>
  <path d="M348,104 q6,-5 12,0 q6,-5 12,0"/>
</g>

<!-- 원경 섬 그림자 -->
<path d="M0,216 C40,190 90,196 130,180 C170,196 210,192 250,214 Z" fill="#8ba3ab" opacity="0.5"/>
<path d="M300,214 C340,194 380,200 420,186 C456,202 490,198 520,214 Z" fill="#8ba3ab" opacity="0.35"/>

<!-- 바다 -->
<rect x="0" y="210" width="800" height="86" fill="url(#djdSea)"/>
<g fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
  <path d="M30,226 C100,222 160,230 230,226"/>
  <path d="M300,238 C370,234 430,242 500,238"/>
  <path d="M560,224 C630,220 690,228 760,224"/>
  <path d="M100,262 C170,258 230,266 300,262"/>
  <path d="M480,272 C550,268 610,276 680,272"/>
</g>
<ellipse class="djd-glint" cx="560" cy="256" rx="150" ry="40" fill="url(#djdSun)"/>

<!-- 고깃배 -->
<g class="djd-boat" transform="translate(210,244)">
  <path d="M-34,0 L34,0 L26,14 L-26,14 Z" fill="#e8e2d4" stroke="#8d8474" stroke-width="1.4"/>
  <rect x="-12" y="-16" width="22" height="16" rx="2" fill="#dcd4c2" stroke="#8d8474" stroke-width="1.2"/>
  <rect x="-6" y="-12" width="9" height="7" fill="#8fc0d4"/>
  <path d="M16,0 L16,-24" stroke="#8d8474" stroke-width="2" stroke-linecap="round"/>
  <path d="M16,-24 L16,-12 L30,-14 Z" fill="#d8604e"/>
  <path d="M-30,14 q30,7 60,0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
</g>

<!-- 방파제 (우측에서 바다로 뻗어나감) -->
<g>
  <path d="M600,268 L788,214 L788,240 L610,296 Z" fill="url(#djdRock)" stroke="#4a4438" stroke-width="1"/>
  <g fill="#8c8272" stroke="#4a4438" stroke-width="0.8">
    <polygon points="626,272 646,264 640,250 618,258"/>
    <polygon points="660,260 682,252 674,238 652,246"/>
    <polygon points="694,248 716,240 708,226 686,234"/>
    <polygon points="728,236 750,228 742,214 720,222"/>
    <polygon points="758,226 780,218 772,204 750,212"/>
  </g>
  <!-- 방파제 등대 -->
  <rect x="754" y="176" width="14" height="38" fill="#d84a3a"/>
  <rect x="752" y="188" width="18" height="8" fill="#ffffff"/>
  <rect x="750" y="172" width="22" height="8" rx="2" fill="#f2ede0" stroke="#b0a795" stroke-width="0.8"/>
  <polygon points="750,172 772,172 761,158" fill="#d84a3a"/>
  <circle cx="761" cy="166" r="3" fill="#ffe9a0"/>
</g>

<!-- 파도 -->
<g class="djd-w1" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" stroke-linecap="round">
  <path d="M0,292 C90,284 170,300 260,292 C350,284 430,300 520,292 C610,285 700,296 800,290"/>
</g>
<path d="M0,298 C140,292 280,304 420,298 C560,292 690,304 800,298 L800,320 L0,320 Z" fill="#ddeff2" opacity="0.8"/>

<!-- 모래 해안 -->
<path d="M0,314 C140,308 280,320 420,314 C560,308 690,320 800,314 L800,440 L0,440 Z" fill="url(#djdSand)"/>
<g stroke="#c9ad78" stroke-width="1.3" opacity="0.5" fill="none">
  <path d="M20,338 C110,333 190,342 280,337 C370,332 450,341 540,336 C630,331 710,340 790,335"/>
  <path d="M0,366 C90,361 170,370 260,365 C350,360 430,369 520,364 C610,359 700,368 790,363"/>
  <path d="M20,398 C110,393 190,402 280,397 C370,392 450,401 540,396 C630,391 710,400 790,395"/>
  <path d="M0,426 C90,421 170,430 260,425 C350,420 430,429 520,424 C610,419 700,428 790,423"/>
</g>
<g fill="#b89968" opacity="0.3">
  <ellipse cx="140" cy="352" rx="44" ry="8"/>
  <ellipse cx="420" cy="384" rx="52" ry="9"/>
  <ellipse cx="680" cy="358" rx="40" ry="7"/>
</g>

<!-- 해송 (좌측 언덕) -->
<g>
  <path d="M0,314 C40,286 90,278 140,290 L140,314 Z" fill="#6f9a52"/>
  <g>
    <path d="M64,300 C62,282 70,272 66,258" stroke="#6b5236" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="66" cy="252" rx="30" ry="14" fill="url(#djdPine)"/>
    <ellipse cx="58" cy="238" rx="22" ry="11" fill="url(#djdPine)"/>
  </g>
  <g>
    <path d="M116,306 C114,290 122,282 118,270" stroke="#6b5236" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="118" cy="266" rx="24" ry="11" fill="url(#djdPine)"/>
    <ellipse cx="112" cy="255" rx="17" ry="9" fill="url(#djdPine)"/>
  </g>
</g>

<!-- 파라솔 -->
<g transform="translate(320,372)">
  <ellipse cx="0" cy="22" rx="30" ry="6" fill="#c0a271" opacity="0.35"/>
  <path d="M0,20 L0,-14" stroke="#8d8474" stroke-width="3" stroke-linecap="round"/>
  <path d="M-34,-14 q34,-24 68,0 Z" fill="#e86b5a"/>
  <path d="M-34,-14 q17,-12 34,-12 l0,12 Z" fill="#f7f2e6"/>
  <path d="M0,-26 l0,-6" stroke="#8d8474" stroke-width="2.4" stroke-linecap="round"/>
</g>

<!-- 흩어진 조개와 자갈 -->
<g opacity="0.9">
  <path d="M480,404 q10,-11 20,0 q-10,5 -20,0 Z" fill="#f8f1de" stroke="#c9b98e" stroke-width="0.8"/>
  <path d="M182,420 q8,-9 16,0 q-8,4 -16,0 Z" fill="#f8f1de" stroke="#c9b98e" stroke-width="0.8"/>
  <ellipse cx="600" cy="412" rx="7" ry="4" fill="#cbb78a"/>
  <ellipse cx="722" cy="392" rx="6" ry="3.4" fill="#cbb78a"/>
  <ellipse cx="60" cy="396" rx="5" ry="3" fill="#cbb78a"/>
</g>
<g fill="#c9b184" opacity="0.55">
  <ellipse cx="560" cy="352" rx="6" ry="4"/>
  <ellipse cx="578" cy="364" rx="6" ry="4"/>
  <ellipse cx="596" cy="376" rx="6" ry="4"/>
</g>
</svg>
</body>
</html>
