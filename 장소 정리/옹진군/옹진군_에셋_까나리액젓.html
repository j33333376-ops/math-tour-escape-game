<!-- 원본 크기: 500x750 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>까나리 액젓</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .oky-svg { display:block; width:100%; height:auto; }
  .oky-shine { animation: oky-shine 4.6s ease-in-out infinite; }
  @keyframes oky-shine { 0%,100% { opacity:0.2; } 50% { opacity:0.55; } }
</style>
</head>
<body>
<svg class="oky-svg" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="까나리 액젓">
<title>까나리 액젓</title>
<desc>백령도 특산 까나리 액젓 유리병.</desc>
<defs>
  <linearGradient id="okyGlass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6b4a1c"/><stop offset="0.2" stop-color="#a8752c"/>
    <stop offset="0.42" stop-color="#d9a24c"/><stop offset="0.62" stop-color="#a8752c"/>
    <stop offset="1" stop-color="#5f3f16"/>
  </linearGradient>
  <linearGradient id="okyNeck" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7d5a24"/><stop offset="0.4" stop-color="#c99a3e"/><stop offset="1" stop-color="#6b4a1c"/>
  </linearGradient>
  <linearGradient id="okyCap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f4c96"/><stop offset="0.35" stop-color="#5f96d8"/>
    <stop offset="0.65" stop-color="#2f6fc4"/><stop offset="1" stop-color="#183f7c"/>
  </linearGradient>
</defs>
<ellipse cx="250" cy="712" rx="148" ry="22" fill="#4a3a1c" opacity="0.24"/>
<!-- 뚜껑 -->
<rect x="188" y="52" width="124" height="60" rx="8" fill="url(#okyCap)" stroke="#122f5e" stroke-width="4.4"/>
<g stroke="#122f5e" stroke-width="2.4" opacity="0.55">
  <line x1="204" y1="56" x2="204" y2="108"/><line x1="222" y1="56" x2="222" y2="108"/>
  <line x1="240" y1="56" x2="240" y2="108"/><line x1="258" y1="56" x2="258" y2="108"/>
  <line x1="276" y1="56" x2="276" y2="108"/><line x1="294" y1="56" x2="294" y2="108"/>
</g>
<rect x="182" y="106" width="136" height="16" rx="6" fill="#183f7c" stroke="#122f5e" stroke-width="3.4"/>
<!-- 목 -->
<path d="M206,122 L294,122 L300,190 L200,190 Z" fill="url(#okyNeck)" stroke="#4a300e" stroke-width="4"/>
<!-- 어깨 -->
<path d="M200,190 C168,214 142,250 138,296 L362,296 C358,250 332,214 300,190 Z" fill="url(#okyGlass)" stroke="#4a300e" stroke-width="5"/>
<!-- 몸통 -->
<path d="M138,296 L362,296 L362,656 C362,676 348,690 328,690 L172,690 C152,690 138,676 138,656 Z"
      fill="url(#okyGlass)" stroke="#4a300e" stroke-width="5"/>
<!-- 액젓 수면 -->
<path d="M140,332 C200,344 300,344 360,332 L360,340 C300,352 200,352 140,340 Z" fill="#8f5f1c" opacity="0.8"/>
<!-- 라벨 -->
<g>
  <rect x="128" y="390" width="244" height="216" rx="10" fill="#f6efdc" stroke="#8c6a3a" stroke-width="4.4"/>
  <rect x="128" y="390" width="244" height="42" rx="10" fill="#1f5f8c"/>
  <text x="250" y="421" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f6efdc">백령도 특산</text>
  <text x="250" y="490" text-anchor="middle" font-family="serif" font-size="50" font-weight="bold" fill="#8c3a24">까나리</text>
  <text x="250" y="540" text-anchor="middle" font-family="serif" font-size="44" font-weight="bold" fill="#8c3a24">액 젓</text>
  <line x1="160" y1="558" x2="340" y2="558" stroke="#c9a35c" stroke-width="3"/>
  <!-- 까나리 그림 -->
  <g transform="translate(250,582)">
    <path d="M-60,0 C-40,-11 20,-11 44,0 C20,11 -40,11 -60,0 Z" fill="#8fa8b8" stroke="#4f6674" stroke-width="2.4"/>
    <path d="M44,0 L66,-11 L62,0 L66,11 Z" fill="#8fa8b8" stroke="#4f6674" stroke-width="2.4"/>
    <circle cx="-40" cy="-2" r="3" fill="#2b3138"/>
    <path d="M-14,-8 q10,-8 22,-3" fill="none" stroke="#4f6674" stroke-width="2"/>
  </g>
  <text x="250" y="600" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6b5a38">500ml</text>
</g>
<!-- 병 광택 -->
<path class="oky-shine" d="M174,220 C160,300 160,520 178,650" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
<path d="M330,240 C340,320 340,520 326,640" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.18" stroke-linecap="round"/>
<!-- 바닥 -->
<path d="M138,656 C200,672 300,672 362,656 L362,668 C300,684 200,684 138,668 Z" fill="#3f2a0c" opacity="0.5"/>
</svg>
</body>
</html>
