<!-- 원본 크기: 900x420 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사곶사빈</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .sgb-svg { display:block; width:100%; height:auto; }
  .sgb-wave { animation: sgb-drift 7s ease-in-out infinite; transform-origin: center; }
  @keyframes sgb-drift {
    0%,100% { transform: translateX(0); opacity:0.6; }
    50% { transform: translateX(10px); opacity:0.9; }
  }
  .sgb-shimmer { animation: sgb-shimmer 5s ease-in-out infinite; }
  @keyframes sgb-shimmer {
    0%,100% { opacity: 0.12; }
    50% { opacity: 0.34; }
  }
  .sgb-gull { animation: sgb-gull 9s ease-in-out infinite; }
  @keyframes sgb-gull {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(26px,-10px); }
  }
</style>
</head>
<body>
<svg class="sgb-svg" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="백령도 사곶해변 천연 비행장 모래사장">
<title>사곶사빈</title>
<desc>인천 옹진군 백령도 사곶해변. 규조토가 단단히 다져져 비행기가 내릴 수 있는 넓은 모래사장과 얕은 바다, 멀리 보이는 해안 절벽</desc>
<defs>
  <linearGradient id="sgbSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfeaf5"/>
    <stop offset="0.6" stop-color="#e8f5f8"/>
    <stop offset="1" stop-color="#f6f4e6"/>
  </linearGradient>
  <linearGradient id="sgbSea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4f96b4"/>
    <stop offset="0.55" stop-color="#7dbcd0"/>
    <stop offset="1" stop-color="#b6dce4"/>
  </linearGradient>
  <linearGradient id="sgbLand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e4d9b6"/>
    <stop offset="0.45" stop-color="#efe8d2"/>
    <stop offset="1" stop-color="#ded2ac"/>
  </linearGradient>
  <linearGradient id="sgbCliff" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9b0ac"/>
    <stop offset="1" stop-color="#7d8681"/>
  </linearGradient>
  <linearGradient id="sgbShine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- 하늘 -->
<rect x="0" y="0" width="900" height="200" fill="url(#sgbSky)"/>
<g fill="#ffffff" opacity="0.85">
  <ellipse cx="150" cy="52" rx="52" ry="19"/>
  <ellipse cx="196" cy="46" rx="36" ry="22"/>
  <ellipse cx="106" cy="58" rx="30" ry="14"/>
  <ellipse cx="690" cy="40" rx="46" ry="16"/>
  <ellipse cx="734" cy="36" rx="32" ry="19"/>
</g>

<!-- 원경: 백령도 해안 절벽과 구릉 -->
<path d="M0,168 L70,150 L140,158 L215,132 L300,152 L360,144 L420,160 L470,150 L520,164 L560,158 L600,168 L900,168 L900,190 L0,190 Z" fill="url(#sgbCliff)" opacity="0.55"/>
<path d="M600,168 L648,140 L676,150 L700,126 L736,146 L768,134 L800,152 L840,142 L900,158 L900,190 L600,190 Z" fill="url(#sgbCliff)"/>
<g fill="#6d7671" opacity="0.5">
  <polygon points="700,126 712,150 688,150"/>
  <polygon points="768,134 780,156 756,156"/>
</g>
<g fill="#5f6b60" opacity="0.6">
  <ellipse cx="660" cy="152" rx="14" ry="8"/>
  <ellipse cx="812" cy="150" rx="12" ry="7"/>
</g>

<!-- 바다 -->
<path d="M0,186 C160,182 320,190 460,186 C600,182 760,190 900,186 L900,268 L0,268 Z" fill="url(#sgbSea)"/>
<g fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.45" stroke-linecap="round">
  <path d="M40,204 C110,200 170,208 240,204"/>
  <path d="M320,212 C390,208 450,216 520,212"/>
  <path d="M600,202 C670,198 730,206 800,202"/>
  <path d="M120,232 C190,228 250,236 320,232"/>
  <path d="M520,238 C590,234 650,242 720,238"/>
</g>

<!-- 밀려오는 파도선 -->
<g class="sgb-wave" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" stroke-linecap="round">
  <path d="M0,262 C120,254 220,270 340,262 C460,254 560,270 680,262 C790,255 850,266 900,262"/>
</g>
<path d="M0,268 C150,262 300,274 450,268 C600,262 750,274 900,268 L900,290 L0,290 Z" fill="#d8ecef" opacity="0.75"/>

<!-- 젖은 모래(반사면) -->
<path d="M0,286 C150,280 300,292 450,286 C600,280 750,292 900,286 L900,320 L0,320 Z" fill="#cfc9a8" opacity="0.85"/>

<!-- 단단한 사빈(천연 활주로) -->
<path d="M0,314 C160,308 320,320 460,314 C600,308 760,320 900,314 L900,420 L0,420 Z" fill="url(#sgbLand)"/>

<!-- 리플마크(잔물결 무늬) -->
<g stroke="#cbbd90" stroke-width="1.3" opacity="0.5" fill="none">
  <path d="M20,330 C120,325 220,334 320,329 C420,324 520,333 620,328 C720,323 820,332 890,327"/>
  <path d="M10,346 C110,341 210,350 310,345 C410,340 510,349 610,344 C710,339 810,348 890,343"/>
  <path d="M0,364 C100,359 200,368 300,363 C400,358 500,367 600,362 C700,357 800,366 890,361"/>
  <path d="M20,382 C120,377 220,386 320,381 C420,376 520,385 620,380 C720,375 820,384 890,379"/>
  <path d="M0,400 C100,395 200,404 300,399 C400,394 500,403 600,398 C700,393 800,402 890,397"/>
</g>

<!-- 활주로처럼 곧게 뻗은 다짐 자국 -->
<rect class="sgb-shimmer" x="0" y="336" width="900" height="12" fill="url(#sgbShine)"/>
<rect class="sgb-shimmer" x="0" y="386" width="900" height="10" fill="url(#sgbShine)" style="animation-delay:1.2s"/>

<!-- 간조 물웅덩이 -->
<g fill="#bcdfe6" opacity="0.6">
  <ellipse cx="170" cy="360" rx="40" ry="8"/>
  <ellipse cx="500" cy="392" rx="52" ry="10"/>
  <ellipse cx="742" cy="352" rx="34" ry="7"/>
</g>
<g fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6">
  <ellipse cx="170" cy="360" rx="40" ry="8"/>
  <ellipse cx="500" cy="392" rx="52" ry="10"/>
  <ellipse cx="742" cy="352" rx="34" ry="7"/>
</g>

<!-- 조개껍데기와 자갈 -->
<g opacity="0.85">
  <path d="M262,404 q10,-11 20,0 q-10,5 -20,0 Z" fill="#f3ece0" stroke="#cdbfa0" stroke-width="0.8"/>
  <path d="M646,376 q9,-10 18,0 q-9,4 -18,0 Z" fill="#f7f0e4" stroke="#cdbfa0" stroke-width="0.8"/>
  <ellipse cx="380" cy="414" rx="7" ry="4" fill="#c9bea4"/>
  <ellipse cx="828" cy="404" rx="6" ry="3.5" fill="#c9bea4"/>
  <ellipse cx="98" cy="392" rx="5" ry="3" fill="#c9bea4"/>
</g>

<!-- 경비행기(천연 비행장 상징) -->
<g transform="translate(560,300) scale(0.9)">
  <ellipse cx="0" cy="26" rx="52" ry="6" fill="#a89b78" opacity="0.35"/>
  <path d="M-46,10 L28,10 L44,2 L28,-6 L-46,-4 Z" fill="#f4f6f7" stroke="#9aa6ac" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M-46,-4 L-58,-14 L-50,-14 L-40,-5 Z" fill="#e6ebee" stroke="#9aa6ac" stroke-width="1.2"/>
  <path d="M-14,2 L26,2 L18,-16 L-6,-16 Z" fill="#dbe6ec" stroke="#9aa6ac" stroke-width="1.2"/>
  <rect x="-4" y="-14" width="10" height="9" rx="2" fill="#8fbdd4" stroke="#7d98a6" stroke-width="0.8"/>
  <path d="M-30,10 L-30,22" stroke="#7d8a90" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M12,10 L12,22" stroke="#7d8a90" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="-30" cy="24" r="4" fill="#4a545a"/>
  <circle cx="12" cy="24" r="4" fill="#4a545a"/>
  <path d="M44,2 L44,-12" stroke="#c8453c" stroke-width="3" stroke-linecap="round"/>
  <path d="M-46,4 L-52,4" stroke="#c8453c" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- 갈매기 -->
<g class="sgb-gull" fill="none" stroke="#5b6a72" stroke-width="2" stroke-linecap="round" opacity="0.8">
  <path d="M250,86 q10,-9 20,0 q10,-9 20,0"/>
  <path d="M330,64 q8,-7 16,0 q8,-7 16,0"/>
  <path d="M812,92 q9,-8 18,0 q9,-8 18,0"/>
</g>
</svg>
</body>
</html>
