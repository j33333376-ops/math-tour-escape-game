<!-- 원본 크기: 900x400 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>십리포 해안</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .srp-svg { display:block; width:100%; height:auto; }
  .srp-leaf { animation: srp-sway 5s ease-in-out infinite; transform-origin: center bottom; }
  .srp-leaf2 { animation: srp-sway 6.5s ease-in-out infinite reverse; transform-origin: center bottom; }
  @keyframes srp-sway {
    0%,100% { transform: rotate(-1.2deg); }
    50% { transform: rotate(1.4deg); }
  }
  .srp-wave { animation: srp-drift 7s ease-in-out infinite; transform-origin: center; }
  @keyframes srp-drift {
    0%,100% { transform: translateX(0); opacity:0.6; }
    50% { transform: translateX(10px); opacity:0.9; }
  }
</style>
</head>
<body>
<svg class="srp-svg" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="영흥도 십리포 해안 소사나무 방풍림과 완만한 해안선">
<title>십리포 해안</title>
<desc>인천 옹진군 영흥도 십리포의 소사나무 방풍림, 모래 해안선과 갯바위, 멀리 보이는 섬</desc>
<defs>
  <linearGradient id="srpSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe0ef"/>
    <stop offset="0.7" stop-color="#e6f3f7"/>
    <stop offset="1" stop-color="#f6f3e6"/>
  </linearGradient>
  <linearGradient id="srpSea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f7f9e"/>
    <stop offset="0.55" stop-color="#6ba8c2"/>
    <stop offset="1" stop-color="#a5cfdd"/>
  </linearGradient>
  <linearGradient id="srpSand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8d9a8"/>
    <stop offset="1" stop-color="#cfb87e"/>
  </linearGradient>
  <linearGradient id="srpHill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fae5c"/>
    <stop offset="1" stop-color="#5f8340"/>
  </linearGradient>
  <radialGradient id="srpCanopy" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#7fa85a"/>
    <stop offset="1" stop-color="#4c7038"/>
  </radialGradient>
</defs>

<!-- 하늘 -->
<rect x="0" y="0" width="900" height="230" fill="url(#srpSky)"/>
<g fill="#ffffff" opacity="0.8">
  <ellipse cx="640" cy="44" rx="52" ry="17"/>
  <ellipse cx="688" cy="38" rx="34" ry="20"/>
  <ellipse cx="596" cy="50" rx="28" ry="13"/>
  <ellipse cx="150" cy="34" rx="40" ry="14"/>
</g>
<g fill="none" stroke="#66757d" stroke-width="2" stroke-linecap="round" opacity="0.6">
  <path d="M508,70 q9,-8 18,0 q9,-8 18,0"/>
  <path d="M576,92 q7,-6 14,0 q7,-6 14,0"/>
</g>

<!-- 원경 섬 -->
<path d="M600,206 C640,178 676,186 706,168 C736,186 780,180 820,204 Z" fill="#8fa3a8" opacity="0.6"/>
<path d="M820,208 C848,190 872,196 900,184 L900,212 Z" fill="#8fa3a8" opacity="0.45"/>

<!-- 바다 -->
<rect x="0" y="204" width="900" height="76" fill="url(#srpSea)"/>
<g fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
  <path d="M40,220 C110,216 170,224 240,220"/>
  <path d="M330,230 C400,226 460,234 530,230"/>
  <path d="M620,218 C690,214 750,222 820,218"/>
  <path d="M120,252 C190,248 250,256 320,252"/>
  <path d="M540,258 C610,254 670,262 740,258"/>
</g>

<!-- 파도 -->
<g class="srp-wave" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" stroke-linecap="round">
  <path d="M0,278 C120,270 220,286 340,278 C460,270 560,286 680,278 C790,271 850,282 900,278"/>
</g>
<path d="M0,284 C150,278 300,290 450,284 C600,278 750,290 900,284 L900,306 L0,306 Z" fill="#ddeff2" opacity="0.8"/>

<!-- 모래 해안 -->
<path d="M0,300 C160,294 320,306 460,300 C600,294 760,306 900,300 L900,400 L0,400 Z" fill="url(#srpSand)"/>
<g stroke="#c4ab74" stroke-width="1.2" opacity="0.5" fill="none">
  <path d="M20,326 C120,321 220,330 320,325 C420,320 520,329 620,324 C720,319 820,328 890,323"/>
  <path d="M0,352 C100,347 200,356 300,351 C400,346 500,355 600,350 C700,345 800,354 890,349"/>
  <path d="M20,380 C120,375 220,384 320,379 C420,374 520,383 620,378 C720,373 820,382 890,377"/>
</g>

<!-- 방풍림 둔덕 (좌우) -->
<path d="M0,300 C60,262 150,250 240,262 C330,274 400,262 460,276 L460,300 Z" fill="url(#srpHill)"/>
<path d="M900,300 L900,266 C840,250 780,258 720,272 C680,282 640,278 600,290 L600,300 Z" fill="url(#srpHill)"/>
<g stroke="#527035" stroke-width="1.6" opacity="0.5" fill="none" stroke-linecap="round">
  <path d="M60,292 C68,282 64,272 74,262"/>
  <path d="M110,288 C118,278 114,268 124,258"/>
  <path d="M300,290 C308,280 304,270 314,262"/>
  <path d="M760,288 C768,278 764,268 774,260"/>
  <path d="M830,286 C838,276 834,266 844,258"/>
</g>

<!-- 소사나무 군락 (뒤쪽) -->
<g opacity="0.9">
  <path d="M96,268 C94,250 104,240 98,226" stroke="#6b5236" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="98" cy="220" r="21" fill="url(#srpCanopy)"/>
  <path d="M176,262 C174,244 184,234 178,220" stroke="#6b5236" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="178" cy="214" r="18" fill="url(#srpCanopy)"/>
  <path d="M800,266 C802,248 792,238 798,224" stroke="#6b5236" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="798" cy="218" r="19" fill="url(#srpCanopy)"/>
  <path d="M726,272 C728,256 720,246 724,234" stroke="#6b5236" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <circle cx="724" cy="228" r="15" fill="url(#srpCanopy)"/>
</g>

<!-- 소사나무 (앞쪽 큰 나무, 바람에 휜 줄기) -->
<g class="srp-leaf">
  <ellipse cx="252" cy="322" rx="34" ry="7" fill="#a58f5c" opacity="0.35"/>
  <path d="M250,322 C246,292 262,274 250,252 C240,234 258,220 246,202" fill="none" stroke="#5a4326" stroke-width="7" stroke-linecap="round"/>
  <path d="M250,300 C256,286 242,276 252,262" fill="none" stroke="#6b5236" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="238" cy="198" rx="36" ry="25" fill="url(#srpCanopy)"/>
  <ellipse cx="270" cy="210" rx="27" ry="20" fill="url(#srpCanopy)"/>
  <ellipse cx="250" cy="220" rx="31" ry="18" fill="#6a9a4a" opacity="0.7"/>
</g>

<g class="srp-leaf2">
  <ellipse cx="372" cy="334" rx="38" ry="8" fill="#a58f5c" opacity="0.35"/>
  <path d="M370,334 C362,306 380,290 366,268 C356,252 372,236 358,218" fill="none" stroke="#5a4326" stroke-width="8" stroke-linecap="round"/>
  <path d="M370,312 C376,296 358,286 370,270" fill="none" stroke="#6b5236" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="348" cy="214" rx="42" ry="29" fill="url(#srpCanopy)"/>
  <ellipse cx="388" cy="228" rx="30" ry="22" fill="url(#srpCanopy)"/>
  <ellipse cx="364" cy="238" rx="33" ry="18" fill="#6a9a4a" opacity="0.7"/>
</g>

<g class="srp-leaf">
  <ellipse cx="472" cy="328" rx="30" ry="7" fill="#a58f5c" opacity="0.35"/>
  <path d="M470,328 C464,302 480,286 468,264 C460,248 474,234 462,216" fill="none" stroke="#5a4326" stroke-width="6.5" stroke-linecap="round"/>
  <ellipse cx="454" cy="212" rx="33" ry="23" fill="url(#srpCanopy)"/>
  <ellipse cx="484" cy="224" rx="25" ry="18" fill="url(#srpCanopy)"/>
</g>

<!-- 갯바위 -->
<g>
  <ellipse cx="620" cy="316" rx="40" ry="14" fill="#8a8272"/>
  <ellipse cx="612" cy="310" rx="26" ry="12" fill="#9c9484"/>
  <ellipse cx="656" cy="322" rx="20" ry="9" fill="#7d7566"/>
  <ellipse cx="596" cy="322" rx="16" ry="7" fill="#7d7566"/>
  <g fill="#6f6a5c" opacity="0.6">
    <ellipse cx="606" cy="306" rx="7" ry="3"/>
    <ellipse cx="628" cy="312" rx="6" ry="2.6"/>
  </g>
</g>
<g>
  <ellipse cx="820" cy="336" rx="26" ry="10" fill="#8a8272"/>
  <ellipse cx="812" cy="330" rx="17" ry="8" fill="#9c9484"/>
</g>

<!-- 모래 위 조개와 발자국 -->
<g opacity="0.85">
  <path d="M126,362 q9,-10 18,0 q-9,4 -18,0 Z" fill="#f6efdd" stroke="#c9b98e" stroke-width="0.8"/>
  <path d="M534,374 q8,-9 16,0 q-8,4 -16,0 Z" fill="#f6efdd" stroke="#c9b98e" stroke-width="0.8"/>
  <ellipse cx="700" cy="360" rx="6" ry="3.4" fill="#cbb78a"/>
</g>
<g fill="#c9b184" opacity="0.6">
  <ellipse cx="300" cy="356" rx="6" ry="4"/>
  <ellipse cx="318" cy="368" rx="6" ry="4"/>
  <ellipse cx="336" cy="380" rx="6" ry="4"/>
</g>
</svg>
</body>
</html>
