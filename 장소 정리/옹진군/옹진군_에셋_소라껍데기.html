<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소라 껍데기</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .osr-svg { display:block; width:100%; height:auto; }
  .osr-shine { animation: osr-shine 4.4s ease-in-out infinite; }
  @keyframes osr-shine { 0%,100% { opacity:0.25; } 50% { opacity:0.65; } }
</style>
</head>
<body>
<svg class="osr-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소라 껍데기">
<title>소라 껍데기</title>
<desc>섬 해변에서 주운 나선 무늬 소라 껍데기.</desc>
<defs>

    <stop offset="0" stop-color="#fdf2df"/><stop offset="0.4" stop-color="#eccfa4"/>
    <stop offset="0.72" stop-color="#c99a68"/><stop offset="1" stop-color="#96683a"/>
  </linearGradient>
  <radialGradient id="osrMouth" cx="0.45" cy="0.4" r="0.8">
    <stop offset="0" stop-color="#ffeadf"/><stop offset="0.6" stop-color="#f4c0ac"/><stop offset="1" stop-color="#d08a72"/>

</defs>
<ellipse cx="300" cy="524" rx="216" ry="30" fill="#5a4a2c" opacity="0.2"/>

<path d="M300,64

<g fill="none" stroke="#a87a48" stroke-width="5" opacity="0.85">
  <path d="M300,64 C242,110 218,180 226,254 C234,330 282,390 350,412"/>
  <path d="M280,110 C238,152 224,208 234,266 C244,326 282,372 336,392"/>

</g>
<!-- 돌기 -->
<g fill="#d9b184" stroke="#8a6034" stroke-width="3.4">
  <path d="M168,178 l-40,-22 l38,-8 Z"/>
  <path d="M158,262 l-44,-6 l38,-22 Z"/>
  <path d="M176,344 l-44,12 l32,-32 Z"/>
  <path d="M204,414 l-36,32 l18,-44 Z"/>
  <path d="M462,158 l38,-26 l-6,38 Z"/>
  <path d="M496,244 l40,-6 l-32,32 Z"/>
</g>
<!-- 갈색 줄무늬 -->
<g fill="none" stroke="#96683a" stroke-width="4" opacity="0.5">
  <path d="M218,120 C246,142 264,180 268,222"/>
  <path d="M330,80 C356,110 372,152 374,196"/>
  <path d="M430,140 C446,178 448,222 436,262"/>
  <path d="M196,340 C226,364 262,378 300,382"/>
  <path d="M240,440 C282,466 336,478 386,472"/>
</g>
<!-- 입구 -->
<path d="M470,304
         C512,332 522,388 498,432
         C474,478 418,510 356,506

         C424,332 442,312 470,304 Z"
      fill="url(#osrMouth)" stroke="#8a6034" stroke-width="5"/>
<path d="M462,326 C492,352 496,398 476,430 C456,462 418,484 380,486 C412,452 428,406 428,364 C428,344 442,330 462,326 Z"
      fill="#c9765c" opacity="0.35"/>
<path d="M472,318 C504,346 510,394 488,430" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.55"/>
<!-- 광택 -->
<ellipse class="osr-shine" cx="272" cy="150" rx="46" ry="26" transform="rotate(-38 272 150)" fill="#ffffff"/>
<ellipse cx="220" cy="300" rx="20" ry="52" transform="rotate(-10 220 300)" fill="#ffffff" opacity="0.2"/>

<g fill="#dcc9a4" opacity="0.9">
  <ellipse cx="140" cy="508" rx="12" ry="6"/><ellipse cx="470" cy="522" rx="10" ry="5"/>
  <ellipse cx="196" cy="528" rx="8" ry="4"/>

</html>
