<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부평종합시장 점포거리</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .bmkt-svg { display:block; width:100%; height:auto; }
  .bmkt-roof { fill:url(#bmktRoof); stroke:#8a94a0; stroke-width:1; }
  .bmkt-truss { stroke:#7a8490; stroke-width:2; fill:none; }
  .bmkt-wall { fill:#e9e3d6; stroke:#c8bfa8; stroke-width:1; }
  .bmkt-glass { fill:#8fb0bc; opacity:0.6; }
  .bmkt-sign-text { fill:#fff; font-family:'Malgun Gothic',sans-serif; font-weight:bold; text-anchor:middle; }
  .bmkt-ground { fill:#d8d2c2; }
  .bmkt-groundline { stroke:#bdb59c; stroke-width:1; opacity:0.6; }
  @keyframes bmktFlap { 0%,100% { transform:skewX(0deg); } 50% { transform:skewX(0.6deg); } }
  .bmkt-awn { animation: bmktFlap 4.5s ease-in-out infinite; transform-origin:top; }
</style>
</head>
<body>
<!-- 원본 크기: 1000x380 -->
<svg class="bmkt-svg" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="부평종합시장 점포거리">
<title>부평종합시장 점포거리</title>
<desc>알록달록한 차양과 간판이 늘어선 부평종합시장의 아케이드 점포 거리.</desc>
<defs>
  <linearGradient id="bmktRoof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dce6ea"/>
    <stop offset="1" stop-color="#b9c8d0"/>
  </linearGradient>
</defs>

<!-- 아케이드 유리 지붕 -->
<polygon class="bmkt-roof" points="0,70 1000,70 1000,42 0,42"/>
<g class="bmkt-truss">
  <line x1="60" y1="42" x2="60" y2="70"/>
  <line x1="200" y1="42" x2="200" y2="70"/>
  <line x1="340" y1="42" x2="340" y2="70"/>
  <line x1="480" y1="42" x2="480" y2="70"/>
  <line x1="620" y1="42" x2="620" y2="70"/>
  <line x1="760" y1="42" x2="760" y2="70"/>
  <line x1="900" y1="42" x2="900" y2="70"/>
</g>
<rect x="0" y="68" width="1000" height="4" fill="#8a94a0"/>

<!-- 점포 1 (빨강 - 청과) -->
<g>
  <rect class="bmkt-wall" x="10" y="140" width="180" height="190"/>
  <rect class="bmkt-glass" x="26" y="200" width="60" height="90"/>
  <rect class="bmkt-glass" x="104" y="200" width="60" height="90"/>
  <polygon class="bmkt-awn" points="4,140 196,140 186,110 14,110" fill="#d94f4f"/>
  <g fill="#f3ece0" opacity="0.9">
    <polygon points="14,110 44,110 34,140 4,140"/>
    <polygon points="74,110 104,110 96,140 66,140"/>
    <polygon points="134,110 164,110 156,140 126,140"/>
  </g>
  <rect x="16" y="88" width="168" height="26" rx="3" fill="#a5321f"/>
  <text class="bmkt-sign-text" x="100" y="106" font-size="15">청과</text>
</g>

<!-- 점포 2 (청록 - 정육점) -->
<g>
  <rect class="bmkt-wall" x="205" y="140" width="180" height="190"/>
  <rect class="bmkt-glass" x="221" y="200" width="60" height="90"/>
  <rect class="bmkt-glass" x="299" y="200" width="60" height="90"/>
  <polygon class="bmkt-awn" points="199,140 391,140 381,110 209,110" fill="#2f8f7f"/>
  <g fill="#f3ece0" opacity="0.9">
    <polygon points="209,110 239,110 229,140 199,140"/>
    <polygon points="269,110 299,110 291,140 261,140"/>
    <polygon points="329,110 359,110 351,140 321,140"/>
  </g>
  <rect x="211" y="88" width="168" height="26" rx="3" fill="#1c5c50"/>
  <text class="bmkt-sign-text" x="295" y="106" font-size="15">정육점</text>
</g>

<!-- 점포 3 (겨자색 - 떡집) -->
<g>
  <rect class="bmkt-wall" x="400" y="140" width="180" height="190"/>
  <rect class="bmkt-glass" x="416" y="200" width="60" height="90"/>
  <rect class="bmkt-glass" x="494" y="200" width="60" height="90"/>
  <polygon class="bmkt-awn" points="394,140 586,140 576,110 404,110" fill="#d9a02f"/>
  <g fill="#f3ece0" opacity="0.9">
    <polygon points="404,110 434,110 424,140 394,140"/>
    <polygon points="464,110 494,110 486,140 456,140"/>
    <polygon points="524,110 554,110 546,140 516,140"/>
  </g>
  <rect x="406" y="88" width="168" height="26" rx="3" fill="#8a6414"/>
  <text class="bmkt-sign-text" x="490" y="106" font-size="15">떡집</text>
</g>

<!-- 점포 4 (파랑 - 분식) -->
<g>
  <rect class="bmkt-wall" x="595" y="140" width="180" height="190"/>
  <rect class="bmkt-glass" x="611" y="200" width="60" height="90"/>
  <rect class="bmkt-glass" x="689" y="200" width="60" height="90"/>
  <polygon class="bmkt-awn" points="589,140 781,140 771,110 599,110" fill="#3a6ea5"/>
  <g fill="#f3ece0" opacity="0.9">
    <polygon points="599,110 629,110 619,140 589,140"/>
    <polygon points="659,110 689,110 681,140 651,140"/>
    <polygon points="719,110 749,110 741,140 711,140"/>
  </g>
  <rect x="601" y="88" width="168" height="26" rx="3" fill="#1f4468"/>
  <text class="bmkt-sign-text" x="685" y="106" font-size="15">분식</text>
</g>

<!-- 점포 5 (보라 - 잡화) -->
<g>
  <rect class="bmkt-wall" x="790" y="140" width="200" height="190"/>
  <rect class="bmkt-glass" x="806" y="200" width="65" height="90"/>
  <rect class="bmkt-glass" x="899" y="200" width="65" height="90"/>
  <polygon class="bmkt-awn" points="784,140 996,140 986,110 794,110" fill="#8a5ac0"/>
  <g fill="#f3ece0" opacity="0.9">
    <polygon points="794,110 824,110 814,140 784,140"/>
    <polygon points="864,110 894,110 886,140 856,140"/>
    <polygon points="934,110 964,110 956,140 926,140"/>
  </g>
  <rect x="796" y="88" width="188" height="26" rx="3" fill="#553a7a"/>
  <text class="bmkt-sign-text" x="890" y="106" font-size="15">잡화</text>
</g>

<!-- 바닥 -->
<rect class="bmkt-ground" x="0" y="330" width="1000" height="50"/>
<g class="bmkt-groundline">
  <line x1="0" y1="345" x2="1000" y2="345"/>
  <line x1="0" y1="362" x2="1000" y2="362"/>
  <line x1="100" y1="330" x2="100" y2="380"/>
  <line x1="300" y1="330" x2="300" y2="380"/>
  <line x1="500" y1="330" x2="500" y2="380"/>
  <line x1="700" y1="330" x2="700" y2="380"/>
  <line x1="900" y1="330" x2="900" y2="380"/>
</g>
</svg>
</body>
</html>
