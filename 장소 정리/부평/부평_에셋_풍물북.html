<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>풍물놀이 북</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .bpb-svg { display:block; width:100%; height:auto; }
  .bpb-hit { animation: bpb-hit 2.6s ease-in-out infinite; transform-origin: 470px 130px; }
  @keyframes bpb-hit { 0%,100% { transform: rotate(-18deg);} 55% { transform: rotate(6deg);} }
</style>
</head>
<body>
<svg class="bpb-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="풍물놀이 북">
<title>풍물놀이 북</title>
<desc>부평 풍물대축제의 소고와 북. 단청색 몸통에 오방색 끈.</desc>
<defs>
  <linearGradient id="bpbBody" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6e2418"/><stop offset="0.35" stop-color="#b8412e"/>
    <stop offset="0.6" stop-color="#8c2f20"/><stop offset="1" stop-color="#5a1c12"/>
  </linearGradient>
  <radialGradient id="bpbSkin" cx="0.36" cy="0.3" r="0.82">
    <stop offset="0" stop-color="#fdf6e4"/><stop offset="0.7" stop-color="#efe0bc"/><stop offset="1" stop-color="#d4bf90"/>
  </radialGradient>
</defs>
<ellipse cx="300" cy="544" rx="212" ry="30" fill="#4a2418" opacity="0.22"/>
<!-- 북 몸통(측면) -->
<path d="M96,214 C96,214 84,300 96,392 L118,404 C104,314 116,222 116,222 Z" fill="url(#bpbBody)" stroke="#40120a" stroke-width="4"/>
<path d="M504,214 C504,214 516,300 504,392 L482,404 C496,314 484,222 484,222 Z" fill="#5a1c12" stroke="#40120a" stroke-width="4"/>
<path d="M108,220 C108,220 96,304 108,396 C160,436 440,436 492,396 C504,304 492,220 492,220 Z" fill="url(#bpbBody)" stroke="#40120a" stroke-width="5"/>
<!-- 가죽 면 -->
<ellipse cx="300" cy="220" rx="196" ry="126" fill="url(#bpbSkin)" stroke="#8c6a3a" stroke-width="6"/>
<ellipse cx="300" cy="220" rx="168" ry="106" fill="none" stroke="#c9b08a" stroke-width="3"/>
<!-- 삼태극 -->
<g transform="translate(300,220)">
  <circle r="76" fill="#f8f2e2" stroke="#8c6a3a" stroke-width="3"/>
  <path d="M0,-76 A76,76 0 0 1 65,38 A38,38 0 0 0 0,0 A38,38 0 0 1 0,-76 Z" fill="#c2201a"/>
  <path d="M65,38 A76,76 0 0 1 -65,38 A38,38 0 0 0 0,0 A38,38 0 0 1 65,38 Z" fill="#1f5f8c"/>
  <path d="M-65,38 A76,76 0 0 1 0,-76 A38,38 0 0 0 0,0 A38,38 0 0 1 -65,38 Z" fill="#e8b64c"/>
</g>
<!-- 못 장식 -->
<g fill="#e8b64c" stroke="#8c5a1c" stroke-width="2">
  <circle cx="300" cy="98" r="9"/><circle cx="420" cy="128" r="9"/><circle cx="482" cy="216" r="9"/>
  <circle cx="418" cy="308" r="9"/><circle cx="300" cy="342" r="9"/><circle cx="182" cy="308" r="9"/>
  <circle cx="118" cy="216" r="9"/><circle cx="180" cy="128" r="9"/>
</g>
<!-- 오방색 끈 -->
<g stroke-width="9" fill="none" stroke-linecap="round">
  <path d="M112,262 C60,290 46,352 66,404" stroke="#c2201a"/>
  <path d="M124,286 C76,314 64,368 84,414" stroke="#1f5f8c"/>
  <path d="M488,262 C540,290 554,352 534,404" stroke="#e8b64c"/>
  <path d="M476,286 C524,314 536,368 516,414" stroke="#2f7a3c"/>
</g>
<!-- 북채 -->
<g class="bpb-hit">
  <rect x="452" y="122" width="128" height="17" rx="8" fill="#c49a5c" stroke="#8f6a34" stroke-width="3"/>
  <circle cx="462" cy="130" r="24" fill="#f2e6cc" stroke="#8f6a34" stroke-width="3.4"/>
  <circle cx="456" cy="124" r="8" fill="#ffffff" opacity="0.6"/>
</g>
<!-- 광택 -->
<ellipse cx="220" cy="164" rx="60" ry="26" transform="rotate(-18 220 164)" fill="#ffffff" opacity="0.4"/>
<path d="M140,240 C132,300 138,352 152,392" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.18" stroke-linecap="round"/>
</svg>
</body>
</html>
