<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>부평 - 평리단길</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .pr-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="pr-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="부평 평리단길">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd9a8"/><stop offset="60%" stop-color="#ffeacd"/><stop offset="100%" stop-color="#fdf4e6"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b9aa96"/><stop offset="100%" stop-color="#a3937d"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="440" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.6"><ellipse cx="300" cy="80" rx="70" ry="20"/><ellipse cx="900" cy="60" rx="80" ry="22"/></g>

  <!-- 왼쪽 상점들 -->
  <g>
    <!-- 카페 -->
    <rect x="0" y="180" width="300" height="300" fill="#efe3d0" stroke="#c9b394" stroke-width="3"/>
    <rect x="0" y="180" width="300" height="16" fill="#c9b394"/>
    <g transform="translate(150,246)">
      <rect x="-96" y="-24" width="192" height="42" rx="9" fill="#5a4632"/>

    </g>
    <!-- 차양 -->
    <g>
      <path d="M20,300 L280,300 L268,342 L32,342 Z" fill="#c96a4e"/>

      <path d="M20,300 L280,300 L268,342 L32,342 Z" fill="none" stroke="#a04c34" stroke-width="3"/>
    </g>
    <!-- 쇼윈도 -->
    <rect x="40" y="352" width="130" height="112" fill="#bfe0ea" stroke="#8a7250" stroke-width="3"/>
    <line x1="105" y1="352" x2="105" y2="464" stroke="#8a7250" stroke-width="2"/>
    <rect x="196" y="352" width="72" height="112" fill="#5a4632" stroke="#3f3020" stroke-width="3"/>
    <circle cx="252" cy="410" r="4" fill="#c9a24a"/>
    <!-- 입간판 -->
    <g transform="translate(90,500)"><polygon points="-26,0 26,0 20,-56 -20,-56" fill="#f2ead3" stroke="#8a7250" stroke-width="3"/><text x="0" y="-24" text-anchor="middle" font-family="'Jua',sans-serif" font-size="14" fill="#7a5a36">OPEN</text></g>
  </g>

  <!-- 오른쪽 상점들 -->
  <g>
    <rect x="900" y="160" width="300" height="320" fill="#dfe8ea" stroke="#a9bfc6" stroke-width="3"/>
    <rect x="900" y="160" width="300" height="16" fill="#a9bfc6"/>
    <g transform="translate(1050,230)">
      <rect x="-98" y="-24" width="196" height="42" rx="9" fill="#2f5d5a"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="21" font-weight="700" fill="#ffffff">브런치 상점</text>
    </g>
    <path d="M920,296 L1180,296 L1168,338 L932,338 Z" fill="#3f7f78"/>
    <g fill="#eaf4f2"><path d="M952,296 L984,296 L980,338 L946,338 Z"/><path d="M1016,296 L1048,296 L1046,338 L1012,338 Z"/><path d="M1080,296 L1112,296 L1112,338 L1078,338 Z"/><path d="M1144,296 L1168,296 L1162,338 L1142,338 Z"/></g>
    <path d="M920,296 L1180,296 L1168,338 L932,338 Z" fill="none" stroke="#2c5a54" stroke-width="3"/>
    <rect x="936" y="348" width="150" height="116" fill="#bfe0ea" stroke="#6a8790" stroke-width="3"/>
    <line x1="1011" y1="348" x2="1011" y2="464" stroke="#6a8790" stroke-width="2"/>
    <rect x="1108" y="348" width="66" height="116" fill="#37474f" stroke="#26333a" stroke-width="3"/>
    <circle cx="1158" cy="408" r="4" fill="#c9a24a"/>
    <!-- 야외 테이블 -->
    <g transform="translate(1010,520)">
      <circle cx="0" cy="-26" r="30" fill="#f2ead3" stroke="#8a7250" stroke-width="3"/>
      <line x1="0" y1="4" x2="0" y2="36" stroke="#8a7250" stroke-width="4"/>
      <rect x="-52" y="-6" width="18" height="34" rx="4" fill="#c96a4e"/>
      <rect x="34" y="-6" width="18" height="34" rx="4" fill="#c96a4e"/>
    </g>
  </g>

  <!-- 거리 -->
  <path d="M300,480 L900,480 L1200,720 L0,720 Z" fill="url(#road)"/>
  <path d="M300,480 L900,480" stroke="#8f8069" stroke-width="3"/>
  <g stroke="#cabfa9" stroke-width="4" opacity="0.7">
    <line x1="420" y1="530" x2="330" y2="720"/><line x1="600" y1="530" x2="600" y2="720"/><line x1="780" y1="530" x2="870" y2="720"/>
    <line x1="360" y1="560" x2="840" y2="560"/><line x1="320" y1="620" x2="880" y2="620"/><line x1="270" y1="690" x2="930" y2="690"/>
  </g>

  <!-- 골목 안쪽 건물 -->
  <g opacity="0.85">
    <rect x="380" y="240" width="200" height="240" fill="#e8d6c2" stroke="#c0a684" stroke-width="3"/>
    <rect x="380" y="240" width="200" height="14" fill="#c0a684"/>
    <g fill="#bfe0ea" stroke="#a08662" stroke-width="2"><rect x="400" y="270" width="48" height="52"/><rect x="470" y="270" width="48" height="52"/><rect x="400" y="350" width="48" height="52"/><rect x="470" y="350" width="48" height="52"/></g>
    <rect x="404" y="420" width="60" height="60" fill="#8a6a48"/>
    <g transform="translate(480,446)"><rect x="-56" y="-18" width="112" height="30" rx="7" fill="#b0562e"/><text x="0" y="4" text-anchor="middle" font-family="'Jua',sans-serif" font-size="15" fill="#ffe9c9">분식집</text></g>
    <rect x="620" y="280" width="180" height="200" fill="#d8e2d2" stroke="#a8bda0" stroke-width="3"/>
    <rect x="620" y="280" width="180" height="12" fill="#a8bda0"/>
    <g fill="#bfe0ea" stroke="#8aa080" stroke-width="2"><rect x="640" y="308" width="44" height="48"/><rect x="704" y="308" width="44" height="48"/></g>
    <rect x="648" y="410" width="54" height="70" fill="#5a7050"/>
    <g transform="translate(714,388)"><rect x="-50" y="-16" width="100" height="28" rx="7" fill="#2f5d4e"/><text x="0" y="4" text-anchor="middle" font-family="'Jua',sans-serif" font-size="14" fill="#ffffff">소품샵</text></g>
  </g>

  <!-- 전구 조명줄 -->
  <g>
    <path d="M290,200 Q600,300 910,180" fill="none" stroke="#8a7250" stroke-width="3"/>
    <g fill="#ffd23f" stroke="#c99a1e" stroke-width="1.5">
      <circle cx="360" cy="228" r="7"/><circle cx="440" cy="252" r="7"/><circle cx="520" cy="266" r="7"/><circle cx="600" cy="272" r="7"/><circle cx="680" cy="266" r="7"/><circle cx="760" cy="250" r="7"/><circle cx="840" cy="222" r="7"/>
    </g>
    <path d="M290,340 Q600,430 910,330" fill="none" stroke="#8a7250" stroke-width="3" opacity="0.9"/>
    <g fill="#ffd23f" stroke="#c99a1e" stroke-width="1.5">
      <circle cx="380" cy="376" r="7"/><circle cx="470" cy="398" r="7"/><circle cx="560" cy="408" r="7"/><circle cx="650" cy="406" r="7"/><circle cx="740" cy="392" r="7"/><circle cx="830" cy="364" r="7"/>
    </g>
  </g>

  <!-- 사람들 -->
  <g><circle cx="480" cy="560" r="11" fill="#e8c9a8"/><rect x="470" y="570" width="20" height="36" rx="7" fill="#c0392b"/></g>
  <g><circle cx="520" cy="572" r="11" fill="#e8c9a8"/><rect x="510" y="582" width="20" height="36" rx="7" fill="#2b6cb0"/></g>
  <g><circle cx="720" cy="590" r="12" fill="#e8c9a8"/><rect x="709" y="601" width="22" height="40" rx="8" fill="#2f855a"/></g>
  <g><circle cx="250" cy="600" r="12" fill="#e8c9a8"/><rect x="239" y="611" width="22" height="40" rx="8" fill="#6b46c1"/></g>

  <!-- 사인 -->
  <g transform="translate(600,672)">
    <rect x="-110" y="-26" width="220" height="46" rx="11" fill="rgba(255,255,255,0.94)" stroke="#c96a4e" stroke-width="2.5"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="25" font-weight="700" fill="#a04c34">부평 평리단길</text>
  </g>
</svg>
</body>
</html>
