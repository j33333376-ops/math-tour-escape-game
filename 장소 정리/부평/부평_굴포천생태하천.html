<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>부평 - 굴포천 생태하천</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .gp-svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<svg class="gp-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="굴포천 생태하천">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfe1f4"/><stop offset="100%" stop-color="#eaf5fb"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8fc8dd"/><stop offset="100%" stop-color="#5da4c4"/></linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a4cb8e"/><stop offset="100%" stop-color="#7fae6c"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="420" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7"><ellipse cx="240" cy="80" rx="76" ry="22"/><ellipse cx="920" cy="66" rx="84" ry="24"/></g>

  <!-- 원경 아파트 -->
  <g opacity="0.55">
    <rect x="60" y="200" width="90" height="220" fill="#b6c8d4"/><rect x="170" y="240" width="70" height="180" fill="#c3d3dd"/>
    <rect x="940" y="220" width="90" height="200" fill="#b6c8d4"/><rect x="1050" y="180" width="100" height="240" fill="#c3d3dd"/>
    <g fill="#dfeaf1">
      <rect x="74" y="220" width="18" height="14"/><rect x="104" y="220" width="18" height="14"/><rect x="74" y="252" width="18" height="14"/><rect x="104" y="252" width="18" height="14"/><rect x="74" y="284" width="18" height="14"/><rect x="104" y="284" width="18" height="14"/>
      <rect x="1064" y="204" width="20" height="14"/><rect x="1098" y="204" width="20" height="14"/><rect x="1064" y="238" width="20" height="14"/><rect x="1098" y="238" width="20" height="14"/><rect x="1064" y="272" width="20" height="14"/><rect x="1098" y="272" width="20" height="14"/>
    </g>
  </g>
  <!-- 갈매기/철새 -->
  <g stroke="#5b7386" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M340,140 q10,-10 20,0 q10,-10 20,0"/><path d="M820,120 q9,-9 18,0 q9,-9 18,0"/>
  </g>

  <!-- 양쪽 둔치(산책로 포함) -->
  <path d="M0,420 L1200,420 L1200,500 Q600,470 0,500 Z" fill="url(#bank)"/>
  <path d="M0,640 Q600,600 1200,640 L1200,720 L0,720 Z" fill="url(#bank)"/>
  <!-- 산책로 -->
  <path d="M0,436 L1200,436 L1200,462 Q600,438 0,462 Z" fill="#d8c9a2"/>
  <path d="M0,676 Q600,636 1200,676 L1200,700 Q600,660 0,700 Z" fill="#d8c9a2"/>

  <!-- 하천 -->
  <path d="M0,500 Q600,470 1200,500 L1200,640 Q600,600 0,640 Z" fill="url(#water)"/>
  <g stroke="#e8f4f9" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M150,540 q24,-9 48,0 q24,9 48,0"/><path d="M480,570 q24,-9 48,0 q24,9 48,0"/>
    <path d="M820,545 q24,-9 48,0 q24,9 48,0"/><path d="M1010,590 q24,-9 48,0"/>
  </g>
  <!-- 징검다리 -->
  <g fill="#b3ac9c" stroke="#8f887a" stroke-width="3">
    <ellipse cx="520" cy="512" rx="26" ry="12"/>
    <ellipse cx="560" cy="540" rx="26" ry="12"/>
    <ellipse cx="600" cy="566" rx="26" ry="12"/>
    <ellipse cx="640" cy="540" rx="26" ry="12"/>
    <ellipse cx="680" cy="514" rx="26" ry="12"/>
  </g>

  <!-- 왼쪽 갈대·부들 -->
  <g stroke="#7a9a4e" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M120,500 q-6,-52 -16,-84"/><path d="M142,498 q0,-58 8,-92"/><path d="M164,500 q8,-48 18,-78"/>
    <path d="M1040,502 q-6,-50 -14,-80"/><path d="M1062,500 q0,-56 8,-88"/>
  </g>
  <g fill="#8a6a3c">
    <ellipse cx="104" cy="424" rx="7" ry="20" transform="rotate(-10 104 424)"/><ellipse cx="150" cy="412" rx="7" ry="20"/><ellipse cx="182" cy="430" rx="7" ry="19" transform="rotate(12 182 430)"/>
    <ellipse cx="1026" cy="430" rx="7" ry="19" transform="rotate(-9 1026 430)"/><ellipse cx="1070" cy="418" rx="7" ry="20"/>
  </g>

  <!-- 백로 -->
  <g transform="translate(320,560)">
    <ellipse cx="0" cy="0" rx="26" ry="15" fill="#f7fafc" stroke="#c3ccd3" stroke-width="2.5"/>
    <path d="M18,-8 Q34,-26 30,-46" stroke="#f7fafc" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="32" cy="-50" r="8" fill="#f7fafc" stroke="#c3ccd3" stroke-width="2"/>
    <polygon points="39,-51 56,-48 39,-45" fill="#e8b23f"/>
    <circle cx="34" cy="-52" r="2" fill="#26333d"/>
    <line x1="-2" y1="14" x2="-2" y2="34" stroke="#e8b23f" stroke-width="3"/>
    <line x1="6" y1="14" x2="8" y2="34" stroke="#e8b23f" stroke-width="3"/>
  </g>
  <!-- 오리 -->
  <g transform="translate(840,586)">
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#8a6a48" stroke="#5f4630" stroke-width="2.5"/>
    <circle cx="14" cy="-10" r="8" fill="#2f5d4e"/>
    <polygon points="21,-10 32,-8 21,-5" fill="#e8b23f"/>
    <path d="M-24,2 q-6,-4 -4,-9" stroke="#e8f4f9" stroke-width="2.5" fill="none"/>
  </g>

  <!-- 하류 데크 전망대 -->
  <g>
    <rect x="880" y="452" width="130" height="14" rx="4" fill="#b98d5e" stroke="#8a6540" stroke-width="2.5"/>
    <g stroke="#8a6540" stroke-width="3"><line x1="892" y1="452" x2="892" y2="424"/><line x1="922" y1="452" x2="922" y2="424"/><line x1="952" y1="452" x2="952" y2="424"/><line x1="982" y1="452" x2="982" y2="424"/><line x1="1002" y1="452" x2="1002" y2="424"/></g>
    <line x1="884" y1="424" x2="1010" y2="424" stroke="#8a6540" stroke-width="4"/>
  </g>

  <!-- 산책하는 사람들 -->
  <g><circle cx="420" cy="686" r="10" fill="#e8c9a8"/><rect x="411" y="695" width="18" height="24" rx="6" fill="#c0392b"/></g>
  <g><circle cx="470" cy="682" r="9" fill="#e8c9a8"/><rect x="462" y="690" width="16" height="22" rx="6" fill="#2b6cb0"/></g>
  <g><circle cx="760" cy="446" r="8" fill="#e8c9a8"/><rect x="753" y="453" width="14" height="20" rx="5" fill="#2f855a"/></g>

  <!-- 사인 -->
  <g transform="translate(600,690)">
    <rect x="-118" y="-24" width="236" height="44" rx="10" fill="rgba(255,255,255,0.94)" stroke="#3f7f9d" stroke-width="2.5"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Jua','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#1f4e79">굴포천 생태하천</text>
  </g>
</svg>
</body>
</html>
