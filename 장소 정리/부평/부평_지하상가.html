<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부평 지하상가</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .bung-svg { display:block; width:100%; height:auto; }
  .bung-floor { fill:url(#bungFloor); }
  .bung-ceiling { fill:#cfd6da; }
  .bung-wall-l { fill:#e7e2d4; }
  .bung-wall-r { fill:#ddd8ca; }
  .bung-tile { stroke:#b7b1a0; stroke-width:1; opacity:0.6; }
  .bung-far { fill:url(#bungFar); }
  .bung-light { fill:#eafcff; opacity:0.9; }
  .bung-light-glow { fill:#eafcff; opacity:0.25; }
  .bung-sign-board { fill:#1f4a5c; stroke:#0f2c38; stroke-width:2; }
  .bung-sign-text { fill:#eafcff; font-family:'Malgun Gothic',sans-serif; font-weight:bold; text-anchor:middle; }
  .bung-rod { stroke:#8a8f92; stroke-width:3; }
  @keyframes bungFlicker { 0%,100% { opacity:0.9; } 48% { opacity:0.9; } 50% { opacity:0.55; } 52% { opacity:0.9; } }
  .bung-flick { animation: bungFlicker 6s linear infinite; }
</style>
</head>
<body>
<!-- 원본 크기: 900x520 -->
<svg class="bung-svg" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="부평 지하상가">
<title>부평 지하상가</title>
<desc>형광등이 늘어선 천장과 양옆 점포 쇼윈도, 방향 표지판이 있는 미로형 지하상가 통로.</desc>
<defs>
  <linearGradient id="bungFloor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cdc7b6"/>
    <stop offset="1" stop-color="#a89f89"/>
  </linearGradient>
  <radialGradient id="bungFar" cx="0.5" cy="0.4" r="0.8">
    <stop offset="0" stop-color="#3a4a52"/>
    <stop offset="1" stop-color="#131c20"/>
  </radialGradient>
</defs>

<!-- 천장 -->
<polygon class="bung-ceiling" points="0,50 900,50 620,168 280,168"/>
<!-- 바닥 -->
<polygon class="bung-floor" points="0,510 900,510 620,340 280,340"/>
<!-- 좌측 벽 -->
<polygon class="bung-wall-l" points="0,50 0,510 280,340 280,168"/>
<!-- 우측 벽 -->
<polygon class="bung-wall-r" points="900,50 900,510 620,340 620,168"/>
<!-- 안쪽(막다른 통로) -->
<rect class="bung-far" x="280" y="168" width="340" height="172"/>
<g stroke="#4a5a62" stroke-width="1.5" opacity="0.6">
  <line x1="340" y1="168" x2="340" y2="340"/>
  <line x1="560" y1="168" x2="560" y2="340"/>
  <line x1="280" y1="230" x2="620" y2="230"/>
  <line x1="280" y1="280" x2="620" y2="280"/>
</g>
<!-- 안쪽 유도등 -->
<rect x="420" y="240" width="60" height="24" rx="3" fill="#4fd0e0" opacity="0.85"/>
<text class="bung-sign-text" x="450" y="257" font-size="11" fill="#062028">EXIT</text>

<!-- 바닥 타일선 (소실점 방향 수렴) -->
<g class="bung-tile">
  <line x1="0" y1="510" x2="280" y2="340"/>
  <line x1="150" y1="510" x2="330" y2="340"/>
  <line x1="300" y1="510" x2="370" y2="340"/>
  <line x1="450" y1="510" x2="450" y2="340"/>
  <line x1="600" y1="510" x2="530" y2="340"/>
  <line x1="750" y1="510" x2="570" y2="340"/>
  <line x1="900" y1="510" x2="620" y2="340"/>
  <line x1="0" y1="460" x2="900" y2="460"/>
  <line x1="60" y1="410" x2="840" y2="410"/>
  <line x1="150" y1="370" x2="750" y2="370"/>
</g>

<!-- 좌측 점포 쇼윈도 (원근 축소) -->
<g>
  <rect x="15" y="210" width="140" height="120" rx="3" fill="#f5c9d8" opacity="0.85" stroke="#c98aa0" stroke-width="2"/>
  <rect x="35" y="230" width="100" height="70" fill="#fff" opacity="0.5"/>
  <rect x="170" y="228" width="70" height="70" rx="2" fill="#c9e3f5" opacity="0.85" stroke="#8ab0c9" stroke-width="1.5"/>
  <rect x="252" y="238" width="36" height="46" rx="2" fill="#f5e6a8" opacity="0.85" stroke="#c9b168" stroke-width="1"/>
</g>
<!-- 우측 점포 쇼윈도 -->
<g>
  <rect x="745" y="210" width="140" height="120" rx="3" fill="#c9d8f5" opacity="0.85" stroke="#8a9fc9" stroke-width="2"/>
  <rect x="765" y="230" width="100" height="70" fill="#fff" opacity="0.5"/>
  <rect x="660" y="228" width="70" height="70" rx="2" fill="#d8f5c9" opacity="0.85" stroke="#a0c98a" stroke-width="1.5"/>
  <rect x="612" y="238" width="36" height="46" rx="2" fill="#f5c9c9" opacity="0.85" stroke="#c98a8a" stroke-width="1"/>
</g>

<!-- 천장 형광등 (원근 축소, 소실점으로 수렴) -->
<g>
  <rect class="bung-light-glow" x="20" y="80" width="180" height="26" rx="4"/>
  <rect class="bung-light bung-flick" x="30" y="86" width="160" height="14" rx="4"/>
  <rect class="bung-light-glow" x="700" y="80" width="180" height="26" rx="4"/>
  <rect class="bung-light bung-flick" x="710" y="86" width="160" height="14" rx="4"/>
  <rect class="bung-light-glow" x="330" y="120" width="90" height="16" rx="3"/>
  <rect class="bung-light" x="335" y="124" width="80" height="9" rx="3"/>
  <rect class="bung-light-glow" x="480" y="120" width="90" height="16" rx="3"/>
  <rect class="bung-light" x="485" y="124" width="80" height="9" rx="3"/>
  <rect class="bung-light-glow" x="400" y="178" width="50" height="10" rx="2"/>
  <rect class="bung-light" x="403" y="180" width="44" height="6" rx="2"/>
</g>

<!-- 방향 표지판 (천장 매달림) -->
<g>
  <line class="bung-rod" x1="380" y1="70" x2="380" y2="108"/>
  <line class="bung-rod" x1="520" y1="70" x2="520" y2="108"/>
  <rect class="bung-sign-board" x="330" y="108" width="240" height="60" rx="4"/>
  <line x1="330" y1="138" x2="570" y2="138" stroke="#0f2c38" stroke-width="1.5"/>
  <text class="bung-sign-text" x="450" y="128" font-size="15">◀ A구역　B구역 ▶</text>
  <text class="bung-sign-text" x="450" y="158" font-size="15">↑ 출구 · 화장실</text>
</g>
</svg>
</body>
</html>
