<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부평종합시장 과일가게</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .bfrt-svg { display:block; width:100%; height:auto; }
  .bfrt-pole { fill:#b23a3a; }
  .bfrt-awning-a { fill:#d94f4f; }
  .bfrt-awning-b { fill:#f3ece0; }
  .bfrt-counter { fill:url(#bfrtWood); stroke:#6b4322; stroke-width:2; }
  .bfrt-countertop { fill:#d9b077; stroke:#a5793f; stroke-width:1.5; }
  .bfrt-crate { fill:#c98a4b; stroke:#7a5326; stroke-width:1.5; }
  .bfrt-basket { fill:#c08a4f; stroke:#7a5326; stroke-width:1.5; }
  .bfrt-apple { fill:url(#bfrtApple); stroke:#7a1414; stroke-width:0.6; }
  .bfrt-orange { fill:url(#bfrtOrange); stroke:#a05a10; stroke-width:0.6; }
  .bfrt-melon { fill:url(#bfrtMelon); stroke:#204a1c; stroke-width:1; }
  .bfrt-stripe { stroke:#1f4a1c; stroke-width:2.5; fill:none; opacity:0.75; }
  .bfrt-tag { fill:#f6ecd2; stroke:#a5793f; stroke-width:1.2; }
  .bfrt-tag-text { fill:#6b3018; font-family:'Malgun Gothic',sans-serif; font-weight:bold; text-anchor:middle; }
  @keyframes bfrtSwing { 0%,100% { transform:rotate(-2deg); } 50% { transform:rotate(2deg); } }
  .bfrt-tagwrap { animation: bfrtSwing 4s ease-in-out infinite; transform-origin: 150px 190px; }
</style>
</head>
<body>
<!-- 원본 크기: 820x520 -->
<svg class="bfrt-svg" viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="부평종합시장 과일가게">
<title>부평종합시장 과일가게</title>
<desc>줄무늬 차양 아래 사과 바구니, 수박 더미, 오렌지가 담긴 나무 상자가 진열된 재래시장 과일가게.</desc>
<defs>
  <linearGradient id="bfrtWood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a5713c"/>
    <stop offset="1" stop-color="#7c5028"/>
  </linearGradient>
  <radialGradient id="bfrtApple" cx="0.35" cy="0.3" r="0.8">
    <stop offset="0" stop-color="#ff8a7a"/>
    <stop offset="0.45" stop-color="#e0362f"/>
    <stop offset="1" stop-color="#8f1414"/>
  </radialGradient>
  <radialGradient id="bfrtOrange" cx="0.35" cy="0.3" r="0.8">
    <stop offset="0" stop-color="#ffd58a"/>
    <stop offset="0.5" stop-color="#f5941f"/>
    <stop offset="1" stop-color="#c06a0a"/>
  </radialGradient>
  <radialGradient id="bfrtMelon" cx="0.35" cy="0.28" r="0.85">
    <stop offset="0" stop-color="#7ec96a"/>
    <stop offset="0.6" stop-color="#4a9a3e"/>
    <stop offset="1" stop-color="#2c6a24"/>
  </radialGradient>
</defs>

<!-- 차양 (줄무늬 천막) -->
<g>
  <rect x="20" y="10" width="780" height="60" fill="#d94f4f"/>
  <g fill="#f3ece0">
    <rect x="55" y="10" width="45" height="60"/>
    <rect x="145" y="10" width="45" height="60"/>
    <rect x="235" y="10" width="45" height="60"/>
    <rect x="325" y="10" width="45" height="60"/>
    <rect x="415" y="10" width="45" height="60"/>
    <rect x="505" y="10" width="45" height="60"/>
    <rect x="595" y="10" width="45" height="60"/>
    <rect x="685" y="10" width="45" height="60"/>
  </g>
  <!-- 스캘럽 하단 장식 -->
  <g>
    <polygon points="20,70 55,70 37.5,92" fill="#d94f4f"/>
    <polygon points="55,70 100,70 77.5,92" fill="#f3ece0"/>
    <polygon points="100,70 145,70 122.5,92" fill="#d94f4f"/>
    <polygon points="145,70 190,70 167.5,92" fill="#f3ece0"/>
    <polygon points="190,70 235,70 212.5,92" fill="#d94f4f"/>
    <polygon points="235,70 280,70 257.5,92" fill="#f3ece0"/>
    <polygon points="280,70 325,70 302.5,92" fill="#d94f4f"/>
    <polygon points="325,70 370,70 347.5,92" fill="#f3ece0"/>
    <polygon points="370,70 415,70 392.5,92" fill="#d94f4f"/>
    <polygon points="415,70 460,70 437.5,92" fill="#f3ece0"/>
    <polygon points="460,70 505,70 482.5,92" fill="#d94f4f"/>
    <polygon points="505,70 550,70 527.5,92" fill="#f3ece0"/>
    <polygon points="550,70 595,70 572.5,92" fill="#d94f4f"/>
    <polygon points="595,70 640,70 617.5,92" fill="#f3ece0"/>
    <polygon points="640,70 685,70 662.5,92" fill="#d94f4f"/>
    <polygon points="685,70 730,70 707.5,92" fill="#f3ece0"/>
    <polygon points="730,70 800,70 765,92" fill="#d94f4f"/>
  </g>
</g>

<!-- 지지 기둥 -->
<rect class="bfrt-pole" x="55" y="65" width="12" height="280"/>
<rect class="bfrt-pole" x="753" y="65" width="12" height="280"/>

<!-- 진열대(카운터) -->
<rect class="bfrt-counter" x="40" y="345" width="740" height="130"/>
<g stroke="#5c3a1c" stroke-width="1" opacity="0.5">
  <line x1="90" y1="345" x2="90" y2="475"/>
  <line x1="180" y1="345" x2="180" y2="475"/>
  <line x1="270" y1="345" x2="270" y2="475"/>
  <line x1="360" y1="345" x2="360" y2="475"/>
  <line x1="450" y1="345" x2="450" y2="475"/>
  <line x1="540" y1="345" x2="540" y2="475"/>
  <line x1="630" y1="345" x2="630" y2="475"/>
  <line x1="720" y1="345" x2="720" y2="475"/>
</g>
<rect class="bfrt-countertop" x="40" y="335" width="740" height="14"/>

<!-- 좌측: 사과 바구니 -->
<g>
  <polygon class="bfrt-basket" points="85,340 235,340 220,255 100,255"/>
  <g stroke="#7a5326" stroke-width="1" opacity="0.6">
    <line x1="95" y1="270" x2="225" y2="270"/>
    <line x1="98" y1="290" x2="222" y2="290"/>
    <line x1="102" y1="310" x2="218" y2="310"/>
    <line x1="106" y1="328" x2="214" y2="328"/>
  </g>
  <ellipse cx="160" cy="255" rx="60" ry="10" fill="#9c6a34" stroke="#7a5326" stroke-width="1.5"/>

  <!-- 사과 피라미드 -->
  <g class="bfrt-apple">
    <circle cx="112" cy="252" r="18"/>
    <circle cx="146" cy="256" r="18"/>
    <circle cx="180" cy="254" r="18"/>
    <circle cx="210" cy="250" r="18"/>
    <circle cx="128" cy="232" r="18"/>
    <circle cx="162" cy="234" r="18"/>
    <circle cx="196" cy="232" r="18"/>
    <circle cx="144" cy="212" r="18"/>
    <circle cx="178" cy="212" r="18"/>
    <circle cx="160" cy="192" r="18"/>
  </g>
  <g fill="#fff" opacity="0.35">
    <ellipse cx="106" cy="245" rx="4" ry="6"/>
    <ellipse cx="154" cy="187" rx="4" ry="6"/>
    <ellipse cx="188" cy="226" rx="4" ry="6"/>
  </g>
  <g stroke="#4a7a2a" stroke-width="2" stroke-linecap="round">
    <line x1="160" y1="176" x2="163" y2="168"/>
  </g>
</g>

<!-- 가격표 (매달린 팻말) -->
<g class="bfrt-tagwrap">
  <line x1="150" y1="188" x2="150" y2="200" stroke="#6b4322" stroke-width="1.5"/>
  <rect class="bfrt-tag" x="112" y="200" width="76" height="34" rx="3"/>
  <text class="bfrt-tag-text" x="150" y="216" font-size="11">사과 한바구니</text>
  <text class="bfrt-tag-text" x="150" y="229" font-size="11">5,000원</text>
</g>

<!-- 중앙: 수박 더미 -->
<g>
  <ellipse class="bfrt-melon" cx="345" cy="322" rx="58" ry="44"/>
  <ellipse class="bfrt-melon" cx="455" cy="322" rx="58" ry="44"/>
  <ellipse class="bfrt-melon" cx="400" cy="248" rx="58" ry="44"/>
  <g class="bfrt-stripe">
    <path d="M300,300 Q345,282 390,300"/>
    <path d="M300,322 Q345,306 390,322"/>
    <path d="M300,344 Q345,330 388,344"/>
    <path d="M410,300 Q455,282 500,300"/>
    <path d="M410,322 Q455,306 500,322"/>
    <path d="M412,344 Q455,330 500,344"/>
    <path d="M355,226 Q400,208 445,226"/>
    <path d="M354,248 Q400,232 446,248"/>
    <path d="M356,270 Q400,256 444,270"/>
  </g>
  <!-- 잘린 수박 조각 (속살 보이기) -->
  <g transform="translate(560,340)">
    <path d="M0,0 A46,46 0 0 1 60,-20 L20,-6 Z" fill="url(#bfrtMelon)" stroke="#204a1c" stroke-width="1"/>
    <path d="M4,-4 A38,38 0 0 1 50,-18 L18,-8 Z" fill="#f4718a"/>
    <g fill="#3a2418">
      <circle cx="24" cy="-12" r="1.6"/>
      <circle cx="32" cy="-14" r="1.6"/>
      <circle cx="16" cy="-10" r="1.6"/>
    </g>
  </g>
</g>

<!-- 우측: 나무상자 오렌지 -->
<g>
  <rect class="bfrt-crate" x="590" y="300" width="150" height="45"/>
  <g stroke="#7a5326" stroke-width="1.2" opacity="0.6">
    <line x1="590" y1="312" x2="740" y2="312"/>
    <line x1="590" y1="330" x2="740" y2="330"/>
    <line x1="615" y1="300" x2="615" y2="345"/>
    <line x1="665" y1="300" x2="665" y2="345"/>
    <line x1="715" y1="300" x2="715" y2="345"/>
  </g>
  <rect class="bfrt-crate" x="605" y="255" width="120" height="45"/>
  <g stroke="#7a5326" stroke-width="1.2" opacity="0.6">
    <line x1="605" y1="267" x2="725" y2="267"/>
    <line x1="605" y1="285" x2="725" y2="285"/>
    <line x1="630" y1="255" x2="630" y2="300"/>
    <line x1="700" y1="255" x2="700" y2="300"/>
  </g>
  <g class="bfrt-orange">
    <circle cx="625" cy="248" r="15"/>
    <circle cx="655" cy="244" r="15"/>
    <circle cx="685" cy="248" r="15"/>
    <circle cx="710" cy="252" r="14"/>
    <circle cx="640" cy="228" r="15"/>
    <circle cx="670" cy="226" r="15"/>
    <circle cx="698" cy="230" r="14"/>
    <circle cx="655" cy="210" r="14"/>
  </g>
  <g fill="#fff" opacity="0.3">
    <ellipse cx="620" cy="242" rx="3" ry="5"/>
    <ellipse cx="650" cy="204" rx="3" ry="5"/>
  </g>
</g>
</svg>
</body>
</html>
