<!-- 원본 크기: 1000x500 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지하상가 네온 간판</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .bns-svg { display:block; width:100%; height:auto; }
  .bns-blink { animation: bns-blink 1.8s ease-in-out infinite; }
  @keyframes bns-blink { 0%,100% { opacity:0.45; } 50% { opacity:1; } }
  .bns-run circle { animation: bns-run 1.6s linear infinite; }
  @keyframes bns-run { 0%,100% { opacity:0.3; } 40% { opacity:1; } }
</style>
</head>
<body>
<svg class="bns-svg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="지하상가 네온 간판">
<title>지하상가 네온 간판</title>
<desc>부평 지하상가의 화살표 네온 간판.</desc>
<defs>
  <linearGradient id="bnsPanel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b3446"/><stop offset="1" stop-color="#161d2a"/>
  </linearGradient>
  <filter id="bnsGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>
<!-- 매달린 체인 -->
<g stroke="#7d848c" stroke-width="6" stroke-linecap="round">
  <line x1="230" y1="12" x2="230" y2="74"/><line x1="770" y1="12" x2="770" y2="74"/>
</g>
<!-- 간판 몸체 -->
<rect x="70" y="74" width="860" height="272" rx="26" fill="url(#bnsPanel)" stroke="#0d1219" stroke-width="7"/>
<rect x="94" y="98" width="812" height="224" rx="16" fill="none" stroke="#3d4a60" stroke-width="3"/>
<!-- 네온 글자판 -->
<g filter="url(#bnsGlow)" opacity="0.75">
  <rect x="134" y="132" width="420" height="72" rx="36" fill="#ff4d8f"/>
  <rect x="134" y="234" width="300" height="52" rx="26" fill="#4de0ff"/>
</g>
<rect x="134" y="132" width="420" height="72" rx="36" fill="none" stroke="#ff8fc0" stroke-width="9"/>
<rect x="134" y="234" width="300" height="52" rx="26" fill="none" stroke="#9cf0ff" stroke-width="7"/>
<text x="344" y="184" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="bold" fill="#ffe9f4">지하상가</text>
<text x="284" y="272" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#e2fbff">UNDERGROUND</text>
<!-- 네온 화살표 -->
<g>
  <g filter="url(#bnsGlow)" opacity="0.8">
    <path d="M600,210 L790,210 L790,158 L890,236 L790,314 L790,262 L600,262 Z" fill="#ffd94f"/>
  </g>
  <path d="M600,210 L790,210 L790,158 L890,236 L790,314 L790,262 L600,262 Z"
        fill="none" stroke="#fff2b8" stroke-width="9" stroke-linejoin="round"/>
</g>
<!-- 러닝 전구 -->
<g class="bns-run" fill="#ffe9a8">
  <circle cx="614" cy="236" r="8"/>
  <circle cx="654" cy="236" r="8" style="animation-delay:.2s"/>
  <circle cx="694" cy="236" r="8" style="animation-delay:.4s"/>
  <circle cx="734" cy="236" r="8" style="animation-delay:.6s"/>
  <circle cx="774" cy="236" r="8" style="animation-delay:.8s"/>
</g>
<!-- 테두리 전구 -->
<g class="bns-blink" fill="#ffe9a8">
  <circle cx="104" cy="108" r="7"/><circle cx="104" cy="312" r="7"/>
  <circle cx="896" cy="108" r="7"/><circle cx="896" cy="312" r="7"/>
  <circle cx="500" cy="90" r="7"/><circle cx="500" cy="330" r="7"/>
</g>
<!-- 하단 지지 -->
<rect x="380" y="346" width="240" height="18" rx="9" fill="#3d4a60" stroke="#0d1219" stroke-width="4"/>
<!-- 계단 아이콘 -->
<g transform="translate(500,414)" fill="#3d4a60">
  <rect x="-120" y="-14" width="240" height="16" rx="6"/>
  <path d="M-96,2 h40 v18 h40 v18 h40 v18 h40" fill="none" stroke="#8f9aa8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
</body>
</html>
