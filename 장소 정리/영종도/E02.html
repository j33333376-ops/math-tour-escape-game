<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영종도 MATHTOUR - E02</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 16:9 프레임 게임 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background-color: #0b0c10;
      overflow: hidden;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    /* SF 배경 및 오버레이 */
    .bg-scenery {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #0d2847 0%, #081b33 60%, #020514 100%);
      z-index: 0;
    }

    .bg-radar-overlay {
      position: absolute;
      inset: 0;
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      z-index: 1;
    }

    /* 상단 헤더 바 */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 42px;
      background: rgba(11, 12, 16, 0.85);
      border-bottom: 2px solid #00f0ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
      backdrop-filter: blur(5px);
    }

    .header-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 18px;
      color: #00f0ff;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .header-info {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 13px;
      color: #e0ffff;
    }

    /* 중앙 메인 레이더/슬라이더 컨테이너 (위로 올려서 시야 확보) */
    .main-radar-container {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      height: 310px;
      background: rgba(0, 240, 255, 0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 10px;
      padding: 15px;
      z-index: 5;
      display: flex;
      gap: 20px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
    }

    /* 레이더 비주얼 그래픽 박스 */
    .radar-display {
      flex: 1.4;
      background: rgba(8, 27, 51, 0.8);
      border: 1px solid #00f0ff;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }

    /* 슬라이더 컨트롤 패널 */
    .radar-controls {
      flex: 1;
      background: rgba(11, 12, 16, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 25px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 14px;
      color: #00f0ff;
    }

    .control-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #1a3a5c;
      border-radius: 3px;
      outline: none;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00f0ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00f0ff;
    }

    /* 등장인물 영역 (z-index: 3 - 대화창과 레이더 뒤, 양쪽 구석에 작게 배치) */
    .stage-area {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .char-wrapper {
      transition: filter 0.2s ease;
    }

    .char-wrapper.inactive {
      filter: brightness(0.55);
    }

    /* 하단 대화창 UI (z-index: 10) */
    #dialogue-box {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 120px;
      background: rgba(11, 12, 16, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 15px 20px;
      z-index: 10;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .dialogue-speaker {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 17px;
      color: #ff003c; /* 기본 인보 색상 */
      margin-bottom: 8px;
    }

    .dialogue-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #ffffff;
    }

    .click-prompt {
      position: absolute;
      right: 15px;
      bottom: 10px;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 11px;
      color: rgba(0, 240, 255, 0.6);
    }

    /* Skip / Nav 버튼 */
    .btn-nav {
      position: absolute;
      bottom: 28px;
      right: 35px;
      padding: 6px 18px;
      background: rgba(11, 12, 16, 0.9);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-family: 'Black Han Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      z-index: 15;
      transition: all 0.2s ease;
      box-shadow: 0 0 8px #00f0ff;
    }

    .btn-nav:hover {
      background-color: #00f0ff;
      color: #0b0c10;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="bg-scenery"></div>
    <div class="bg-radar-overlay"></div>

    <!-- 상단 헤더 바 -->
    <header class="header-bar">
      <div class="header-title">영종도 MATHTOUR</div>
      <div class="header-info">SECTOR 02: 항공 관측 레이더 모듈</div>
    </header>

    <!-- 메인 레이더 & 슬라이더 조작 창 (화면 중앙 상단에 깔끔하게 노출) -->
    <div class="main-radar-container">
      <div class="radar-display">
        <svg width="100%" height="100%" viewBox="0 0 400 260">
          <!-- 격자선 -->
          <defs>
            <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
              <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#grid)" />
          
          <!-- 삼각형 및 삼각비 요소 -->
          <polygon points="50,210 320,210 320,80" fill="rgba(0, 240, 255, 0.1)" stroke="#00f0ff" stroke-width="2"/>
          <line x1="320" y1="210" x2="320" y2="80" stroke="#ff003c" stroke-width="3"/>
          <circle cx="320" cy="80" r="6" fill="#ff003c"/>
          
          <!-- 텍스트 표시 -->
          <text x="325" y="75" fill="#ffffff" font-family="Nanum Gothic Coding" font-size="12">TARGET (A)</text>
          <text x="330" y="150" fill="#ff003c" font-family="Nanum Gothic Coding" font-size="12">높이 = ?</text>
          <text x="150" y="230" fill="#e0ffff" font-family="Nanum Gothic Coding" font-size="12">수평거리(밑변) = 2200m</text>
          <text x="80" y="200" fill="#00f0ff" font-family="Nanum Gothic Coding" font-size="12">∠ = 24.5°</text>
        </svg>
      </div>

      <div class="radar-controls">
        <div class="control-group">
          <div class="control-label">
            <span>수평거리 (m)</span>
            <span id="val-dist">2200</span>
          </div>
          <input type="range" class="control-slider" min="1000" max="3000" value="2200" id="slider-dist">
        </div>

        <div class="control-group">
          <div class="control-label">
            <span>관측 앙각 ( ° )</span>
            <span id="val-angle">24.5</span>
          </div>
          <input type="range" class="control-slider" min="10" max="60" value="24.5" step="0.5" id="slider-angle">
        </div>
      </div>
    </div>

    <!-- 등장인물 무대 (scale 0.5로 축소 + 레이더/대화창 오버랩 방지를 위해 좌/우 구석 바닥 배치) -->
    <div class="stage-area">
      <!-- 서연 (왼쪽 구석) -->
      <div class="char-wrapper inactive" id="char-서연" style="position:absolute; left:20px; bottom:20px; width:130px; height:160px; overflow:visible;">
        <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.5); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>

      <!-- 민우 (서연 옆) -->
      <div class="char-wrapper inactive" id="char-민우" style="position:absolute; left:130px; bottom:20px; width:130px; height:160px; overflow:visible;">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.5); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>

      <!-- 인보 (오른쪽 구석) -->
      <div class="char-wrapper" id="char-인보" style="position:absolute; right:20px; bottom:20px; width:130px; height:160px; overflow:visible;">
        <iframe src="등장인물_인보.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.5) scaleX(-1); transform-origin:bottom right; pointer-events:none;"></iframe>
      </div>
    </div>

    <!-- 하단 대화창 (클릭 시 다음 대사 진행) -->
    <div id="dialogue-box" onclick="advanceDialogue()">
      <div class="dialogue-speaker" id="speaker-name">인보</div>
      <div class="dialogue-text" id="dialogue-text">레이더 화면을 봐주세요. 슬라이더를 직접 움직여 볼까요?</div>
      <div class="click-prompt">CLICK TO CONTINUE ▶</div>
    </div>

    <button class="btn-nav" id="btn-skip" onclick="skipDialogue()">건너뛰기</button>
  </div>

  <script>
    // 대화 진행 스크립트 데이터
    const dialogues = [
      { speaker: "인보", text: "레이더 화면을 봐주세요. 슬라이더를 직접 움직여 볼까요?", target: "char-인보", color: "#ff003c" },
      { speaker: "민우", text: "오! 수평거리와 앙각 슬라이더를 조절하니까 화면의 직각삼각형 모양이 바뀌네!", target: "char-민우", color: "#00f0ff" },
      { speaker: "서연", text: "밑변의 길이와 각도를 알면 삼각비(tan)를 이용해서 높이를 알아낼 수 있겠어!", target: "char-서연", color: "#00f0ff" }
    ];

    let currentIndex = 0;

    function updateDialogue() {
      const current = dialogues[currentIndex];
      document.getElementById("speaker-name").innerText = current.speaker;
      document.getElementById("speaker-name").style.color = current.color;
      document.getElementById("dialogue-text").innerText = current.text;

      // 말하는 캐릭터만 강조 (brightness 1.0), 나머지는 inactive (brightness 0.55)
      document.querySelectorAll('.char-wrapper').forEach(wrapper => {
        wrapper.classList.add('inactive');
      });

      if (current.target) {
        const activeChar = document.getElementById(current.target);
        if (activeChar) activeChar.classList.remove('inactive');
      }
    }

    function advanceDialogue() {
      currentIndex++;
      if (currentIndex >= dialogues.length) {
        // 대화가 종료되면 퀴즈/다음 단계로 이동
        window.location.href = "E03.html";
      } else {
        updateDialogue();
      }
    }

    function skipDialogue() {
      window.location.href = "E03.html";
    }

    // 슬라이더 이벤트 연동
    document.getElementById('slider-dist').addEventListener('input', (e) => {
      document.getElementById('val-dist').innerText = e.target.value;
    });

    document.getElementById('slider-angle').addEventListener('input', (e) => {
      document.getElementById('val-angle').innerText = e.target.value;
    });

    // 초기 실행
    updateDialogue();
  </script>

</body>
</html>
