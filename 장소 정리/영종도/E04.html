<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영종도 MATHTOUR - 미션 완료</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 16:9 프레임 게임 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background-color: #0b0c10;
      overflow: hidden;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    /* 배경 및 그리드 오버레이 */
    .bg-scenery {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, #0d2847 0%, #081b33 60%, #020514 100%);
      z-index: 0;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-size: 35px 35px;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      z-index: 1;
    }

    /* 상단 헤더 바 */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 42px;
      background: rgba(11, 12, 16, 0.85);
      border-bottom: 2px solid #00f0ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }

    .header-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 18px;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    .header-info {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 13px;
      color: #e0ffff;
    }

    /* 중앙 결과 보드 */
    .result-card {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #00f0ff;
      border-radius: 10px;
      padding: 16px 24px;
      z-index: 10;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-badge {
      align-self: center;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid #00f0ff;
      padding: 5px 20px;
      border-radius: 20px;
      font-family: 'Black Han Sans', sans-serif;
      font-size: 17px;
      color: #00f0ff;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    /* 대화 및 소감 영역 */
    .dialogue-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dialogue-row {
      background: rgba(8, 27, 51, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dialogue-row .speaker {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 14px;
      min-width: 40px;
    }

    .speaker.inbo { color: #ff003c; }
    .speaker.minwoo { color: #00f0ff; }
    .speaker.seoyeon { color: #00f0ff; }

    .dialogue-row .text {
      color: #ffffff;
      line-height: 1.3;
    }

    /* 한 줄 소감 남기기 창 */
    .review-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 6px;
      padding: 8px 14px;
      margin-top: 2px;
    }

    .review-label {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 13px;
      color: #00f0ff;
      white-space: nowrap;
    }

    .review-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
    }

    .review-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    /* -------------------------------------------------- */
    /* 등장인물 무대 영역 (위치를 위로 대폭 올림) */
    /* -------------------------------------------------- */
    .stage-area {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* 서연 (좌측 전경) */
    .char-seoyeon {
      position: absolute;
      left: 32%;
      bottom: 60px; /* 위로 끌어올림 */
      width: 130px;
      height: 160px;
      z-index: 5;
    }

    /* 민우 (서연 오른쪽, 전경) */
    .char-minwoo {
      position: absolute;
      left: 46%;
      bottom: 60px; /* 위로 끌어올림 */
      width: 130px;
      height: 160px;
      z-index: 5;
    }

    /* 인보 (민우 뒤쪽, 멀리) */
    .char-inbo {
      position: absolute;
      left: 58%;
      bottom: 80px; /* 더 위로 올리고 작게 배치 */
      width: 110px;
      height: 140px;
      z-index: 4;
      opacity: 0.95;
    }

    /* 네비게이션 버튼 */
    .btn-nav {
      position: absolute;
      bottom: 20px;
      padding: 8px 24px;
      background: rgba(11, 12, 16, 0.9);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-family: 'Black Han Sans', sans-serif;
      font-size: 15px;
      cursor: pointer;
      border-radius: 4px;
      z-index: 20;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      transition: all 0.2s;
    }

    .btn-nav:hover {
      background: #00f0ff;
      color: #0b0c10;
    }

    #btn-prev { left: 25px; }
    #btn-end { right: 25px; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="bg-scenery"></div>
    <div class="bg-grid"></div>

    <!-- 상단 헤더 -->
    <header class="header-bar">
      <div class="header-title">영종도 MATHTOUR</div>
      <div class="header-info">SECTOR 02: 관제사 미션 완료</div>
    </header>

    <!-- 결과 카드 메인 상자 -->
    <div class="result-card">
      <div class="result-badge">✈️ 이륙 허가 승인 (MISSION CLEARED)</div>

      <div class="dialogue-list">
        <div class="dialogue-row">
          <span class="speaker inbo">인보</span>
          <span class="text">"삐빅! 이륙 허가 승인! 정확한 고도를 계산해 내셨습니다. 관제사 미션 성공입니다!"</span>
        </div>
        <div class="dialogue-row">
          <span class="speaker minwoo">민우</span>
          <span class="text">"우와, 성공이다! 교실에서 배운 삼각비가 실제 비행기 높이 재는 데 쓰이니까 진짜 신기하다."</span>
        </div>
        <div class="dialogue-row">
          <span class="speaker seoyeon">서연</span>
          <span class="text">"맞아! 오늘 영종도 투어 와서 수학의 유용성을 제대로 느끼고 가네. 완료 도장 받자!"</span>
        </div>
      </div>

      <!-- 한 줄 소감 -->
      <div class="review-box">
        <span class="review-label">＞ 한 줄 소감 남기기:</span>
        <input type="text" class="review-input" placeholder="삼각비로 비행기 고도를 산출해본 소감을 적어보세요..." />
      </div>
    </div>

    <!-- 캐릭터 배치 영역 (bottom 위치 상향으로 얼굴/상체 노출) -->
    <div class="stage-area">
      <!-- 서연 -->
      <div class="char-seoyeon">
        <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.5); transform-origin:top left; pointer-events:none;"></iframe>
      </div>

      <!-- 민우 (서연 옆) -->
      <div class="char-minwoo">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.5); transform-origin:top left; pointer-events:none;"></iframe>
      </div>

      <!-- 인보 (민우 뒤쪽 멀리) -->
      <div class="char-inbo">
        <iframe src="등장인물_인보.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.4); transform-origin:top left; pointer-events:none;"></iframe>
      </div>
    </div>

    <!-- 하단 이동 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="history.back()">이전</button>
    <button class="btn-nav" id="btn-end" onclick="alert('축하합니다! 미션을 완료했습니다.')">End</button>
  </div>

</body>
</html>
