<!DOCTYPE html>

<title>영종도 영종진공원</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .yjj-svg { display:block; width:100%; height:auto; }

  .yjj-stone { fill:#a49682; stroke:#7d7160; stroke-width:1; }
  .yjj-stone2 { fill:#b2a48f; stroke:#8a7d68; stroke-width:1; }
  .yjj-stone3 { fill:#968a76; stroke:#726650; stroke-width:1; }
  .yjj-roof { fill:#5c4632; }
  .yjj-roof-dark { fill:#3f3020; }

  @keyframes yjjSmoke {
    0% { transform: translateY(0) scale(1); opacity: 0.5; }
    100% { transform: translateY(-26px) scale(1.6); opacity: 0; }
  }
  .yjj-smoke { animation: yjjSmoke 3.2s ease-out infinite; }
  .yjj-smoke:nth-child(2) { animation-delay: 1.1s; }
  .yjj-smoke:nth-child(3) { animation-delay: 2.2s; }

  @keyframes yjjFlag {
    0%, 100% { transform: skewX(0deg); }
    50% { transform: skewX(-6deg); }
  }
  .yjj-flag { animation: yjjFlag 3s ease-in-out infinite; transform-origin: left center; }
</style>
</head>
