<!-- 원본 크기: 900x480 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영종도 레일바이크</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .rbk-svg { display:block; width:100%; height:auto; }

  .rbk-rail { fill:#8b8f93; }
  .rbk-rail-dark { fill:#5c6266; }
  .rbk-sleeper { fill:#7a5a38; }
  .rbk-cart { fill:#e3572f; }
  .rbk-canopy { fill:url(#rbkCanopyGrad); }

  @keyframes rbkSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .rbk-wheel { animation: rbkSpin 3s linear infinite; transform-box: fill-box; transform-origin: center; }

  @keyframes rbkGlint {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.5; }
  }
  .rbk-shine { animation: rbkGlint 3.4s ease-in-out infinite; }
</style>
</head>
<body>
<svg class="rbk-svg" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="씨사이드파크 레일바이크">
<title>영종도 레일바이크</title>
<defs>
  <linearGradient id="rbkCanopyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd873"/>
    <stop offset="1" stop-color="#f0a83f"/>
  </linearGradient>
  <linearGradient id="rbkBodyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ef6b3f"/>
    <stop offset="1" stop-color="#c8451f"/>
  </linearGradient>
</defs>

<!-- ════════════════════════════════
     철제 레일 (원근감 있는 두 줄)
════════════════════════════════ -->
<!-- 침목 -->
<g class="rbk-sleeper">
  <rect x="10"  y="398" width="46" height="14" rx="2"/>
  <rect x="90"  y="400" width="46" height="14" rx="2"/>
  <rect x="170" y="402" width="46" height="14" rx="2"/>
  <rect x="700" y="402" width="46" height="14" rx="2"/>
  <rect x="780" y="400" width="46" height="14" rx="2"/>
  <rect x="855" y="398" width="46" height="14" rx="2"/>
</g>

<!-- 자갈 노반 -->
<path d="M0,410 Q450,432 900,410 L900,450 L0,450 Z" fill="#b7a98c" opacity="0.55"/>

<!-- 레일 (좌/우) -->
<path class="rbk-rail" d="M0,392 Q450,415 900,392 L900,398 Q450,421 0,398 Z"/>
<path class="rbk-rail-dark" d="M0,398 Q450,421 900,398 L900,402 Q450,425 0,402 Z"/>
<path class="rbk-rail" d="M40,370 Q450,392 860,370 L860,376 Q450,398 40,376 Z"/>
<path class="rbk-rail-dark" d="M40,376 Q450,398 860,376 L860,380 Q450,402 40,380 Z"/>

<!-- 침목 가로대 (레일 사이) -->
<g stroke="#7a5a38" stroke-width="6" opacity="0.85">
  <line x1="120" y1="382" x2="126" y2="404"/>
  <line x1="260" y1="378" x2="264" y2="400"/>
  <line x1="620" y1="378" x2="616" y2="400"/>
  <line x1="770" y1="382" x2="764" y2="404"/>
</g>

<!-- ════════════════════════════════
     레일바이크 카트 (4인승, 지붕형)
════════════════════════════════ -->
<g>
  <!-- 그림자 -->
  <ellipse cx="450" cy="404" rx="185" ry="14" fill="#000" opacity="0.12"/>

  <!-- 하부 프레임 -->
  <rect x="290" y="330" width="320" height="16" rx="4" fill="#5c6266"/>
  <!-- 바퀴 4개 (레일 위) -->
  <g class="rbk-wheel"><circle cx="330" cy="360" r="20" fill="#2a2a2a"/><circle cx="330" cy="360" r="10" fill="#8b8f93"/><line x1="330" y1="350" x2="330" y2="370" stroke="#5c6266" stroke-width="2"/><line x1="320" y1="360" x2="340" y2="360" stroke="#5c6266" stroke-width="2"/></g>
  <g class="rbk-wheel"><circle cx="570" cy="360" r="20" fill="#2a2a2a"/><circle cx="570" cy="360" r="10" fill="#8b8f93"/><line x1="570" y1="350" x2="570" y2="370" stroke="#5c6266" stroke-width="2"/><line x1="560" y1="360" x2="580" y2="360" stroke="#5c6266" stroke-width="2"/></g>

  <!-- 차체 본체 -->
  <rect x="300" y="270" width="300" height="66" rx="14" fill="url(#rbkBodyGrad)"/>
  <rect class="rbk-shine" x="315" y="278" width="90" height="20" rx="6" fill="#fff"/>

  <!-- 좌석 4개 (2x2, 등받이) -->
  <g fill="#3a3a3a">
    <rect x="322" y="250" width="40" height="34" rx="8"/>
    <rect x="392" y="250" width="40" height="34" rx="8"/>
    <rect x="470" y="250" width="40" height="34" rx="8"/>
    <rect x="540" y="250" width="40" height="34" rx="8"/>
  </g>
  <g fill="#555">
    <rect x="326" y="280" width="32" height="10" rx="3"/>
    <rect x="396" y="280" width="32" height="10" rx="3"/>
    <rect x="474" y="280" width="32" height="10" rx="3"/>
    <rect x="544" y="280" width="32" height="10" rx="3"/>
  </g>

  <!-- 페달/발판 -->
  <g fill="#2a2a2a">
    <rect x="330" y="332" width="24" height="8" rx="2"/>
    <rect x="546" y="332" width="24" height="8" rx="2"/>
  </g>

  <!-- 지붕 지지대 -->
  <g stroke="#c98d2c" stroke-width="6" stroke-linecap="round">
    <line x1="315" y1="250" x2="300" y2="192"/>
    <line x1="585" y1="250" x2="600" y2="192"/>
    <line x1="315" y1="284" x2="300" y2="200" opacity="0"/>
  </g>
  <g stroke="#c98d2c" stroke-width="6" stroke-linecap="round">
    <line x1="450" y1="250" x2="450" y2="188"/>
  </g>

  <!-- 캐노피 지붕 (줄무늬) -->
  <path class="rbk-canopy" d="M270,196 Q450,150 630,196 Q630,210 590,206 Q450,178 310,206 Q270,210 270,196 Z"/>
  <g fill="#e3572f" opacity="0.85">
    <path d="M330,200 Q345,182 365,178 L370,192 Q352,196 340,208 Z"/>
    <path d="M420,182 Q450,170 480,182 L478,196 Q450,186 422,196 Z"/>
    <path d="M540,200 Q525,182 505,178 L500,192 Q518,196 530,208 Z"/>
  </g>
  <path d="M270,196 Q450,150 630,196" fill="none" stroke="#c98d2c" stroke-width="2" opacity="0.6"/>

  <!-- 전면 안전바 -->
  <path d="M300,336 Q300,300 330,290" fill="none" stroke="#5c6266" stroke-width="6" stroke-linecap="round"/>
  <path d="M600,336 Q600,300 570,290" fill="none" stroke="#5c6266" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- 배경 안내판 (씨사이드파크) -->
<g transform="translate(760,300)">
  <rect x="-4" y="0" width="8" height="70" fill="#8a8a86"/>
  <rect x="-46" y="-40" width="92" height="42" rx="4" fill="#2f6e4a"/>
  <text x="0" y="-22" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff" font-weight="bold">씨사이드파크</text>
  <text x="0" y="-7" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">레일바이크</text>
</g>
</svg>
</body>
</html>
