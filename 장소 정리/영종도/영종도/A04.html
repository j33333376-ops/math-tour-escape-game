<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영종도 MATHTOUR - A04</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #0b0c10;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        /* 배경 이미지 */
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.85) contrast(1.1);
        }

        /* 오버레이 효과 (사이버네틱 SF 느낌 추가) */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(11, 12, 16, 0.3) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(11, 12, 16, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        /* 헤더 바 */
        #header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: rgba(11, 12, 16, 0.85);
            border-bottom: 2px solid #00f0ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            box-shadow: 0 2px 10px rgba(0, 240, 255, 0.3);
        }

        .stage-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.1rem;
            color: #00f0ff;
            letter-spacing: 0.1em;
            text-shadow: 0 0 5px #00f0ff;
        }

        .system-status {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 0.85rem;
            color: #e0ffff;
        }

        /* 캐시/인물 레이어 */
        #stage-area {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        /* 등장인물 래퍼 */
        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out, filter 0.2s ease;
            bottom: 60px;
        }

        /* 초기 등장 애니메이션 */
        .char-enter {
            animation: slideUpFade 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
        }

        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 비활성화 인물 (어둡게) */
        .char-wrapper.inactive {
            filter: brightness(0.4) grayscale(0.3);
        }

        /* 대화 종료 후 가운데 모이기 및 사라지기 효과 */
        .char-wrapper.move-center-left {
            left: calc(50% - 200px) !important;
            opacity: 0 !important;
            transform: scale(0.8) !important;
        }

        .char-wrapper.move-center-right {
            left: calc(50% - 60px) !important;
            opacity: 0 !important;
            transform: scale(0.8) !important;
        }

        /* 대화창 UI (홀로그램 스크린) */
        #dialogue-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 150px;
            background: rgba(11, 12, 16, 0.75);
            backdrop-filter: blur(10px);
            border: 2px solid #00f0ff;
            border-radius: 8px;
            padding: 20px 25px;
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #dialogue-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20px;
            width: 40px;
            height: 2px;
            background: #e0ffff;
            box-shadow: 0 0 8px #e0ffff;
        }

        #speaker-name {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.25rem;
            color: #00f0ff;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #speaker-name::after {
            content: '';
            display: inline-block;
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.5), transparent);
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.05rem;
            line-height: 1.6;
            letter-spacing: 0.05em;
            color: #ffffff;
            word-break: keep-all;
        }

        .click-indicator {
            position: absolute;
            right: 20px;
            bottom: 12px;
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 0.8rem;
            color: #00f0ff;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        /* 공통 이동 버튼 */
        .btn-nav {
            position: absolute;
            padding: 10px 24px;
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            z-index: 15;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            border-radius: 2px;
        }

        .btn-nav:hover {
            background: #00f0ff;
            color: #0b0c10;
            box-shadow: 0 0 20px #00f0ff;
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
            bottom: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 배경 이미지 -->
    <img src="인천대교.png" alt="인천대교 배경" class="bg-img">
    <div class="grid-overlay"></div>

    <!-- 헤더 바 -->
    <div id="header-bar">
        <span class="stage-title">EPILOGUE : 인천대교와 수학적 원리</span>
        <span class="system-status">SYSTEM LOG // MISSION_COMPLETE</span>
    </div>

    <!-- 무대 레이어 (캐릭터 배치) -->
    <div id="stage-area">
        <!-- 민우 (좌측 배치) -->
        <div class="char-wrapper char-enter" id="char-민우" style="left: 180px;">
            <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>

        <!-- 서연 (우측 배치, 마주보도록 좌우 반전 적용) -->
        <div class="char-wrapper char-enter" id="char-서연" style="left: 626px;">
            <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(1) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
        </div>
    </div>

    <!-- 대화창 UI -->
    <div id="dialogue-box" onclick="advanceDialogue()">
        <div id="speaker-name">화자 이름</div>
        <div id="dialogue-text">대사 내용이 들어갑니다.</div>
        <div class="click-indicator">CLICK TO CONTINUE ▶</div>
    </div>

    <!-- 네비게이션 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="goToUrl('A03.html')">이전</button>
    <button class="btn-nav" id="btn-skip" onclick="finishDialogue()">건너뛰기</button>
    <button class="btn-nav hidden" id="btn-next" onclick="goToUrl('index.html')">End</button>
</div>

<script>
    // 대화 데이터 스크립트
    const dialogues = [
        {
            speaker: "민우",
            text: "웅장한 인천대교를 이렇게 직접 눈앞에서 바라보고 있으니까, 정말 감회가 새롭다.",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "맞아. 저 거대한 다리가 거센 바람과 파도를 견딜 수 있는 것도 전부 정밀한 수학적 설계 덕분이라는 게 실감이 나.",
            target: "char-서연"
        },
        {
            speaker: "민우",
            text: "그러게. 교량의 현수선 곡선부터 하중 분산 연산까지... 우리가 오늘 탐사하면서 풀었던 기하학과 방정식들이 다 연결되어 있었어.",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "수학은 단순한 교과서 속 공식이 아니라, 우리 실생활과 미래 건축 기술을 받쳐주는 아주 강력한 도구였던 거야.",
            target: "char-서연"
        },
        {
            speaker: "민우",
            text: "응! 이번 영종도 매쓰투어를 통해 우리 주변의 세상을 수학의 눈으로 보는 법을 배우게 된 것 같아.",
            target: "char-민우"
        },
        {
            speaker: "서연",
            text: "좋아! 앞으로 마주할 또 다른 비밀들도 이 수학적 사고력으로 완벽하게 해결해 내자고!",
            target: "char-서연"
        }
    ];

    let currentIndex = 0;
    let isFinished = false;

    // 대화 진행 함수
    function advanceDialogue() {
        if (isFinished) return;

        if (currentIndex < dialogues.length) {
            const current = dialogues[currentIndex];
            
            // 화자 이름 및 대사 업데이트
            document.getElementById("speaker-name").innerText = current.speaker;
            document.getElementById("dialogue-text").innerText = current.text;

            // 말하는 인물 강조 (화자 외 inactive 처리)
            const minwoo = document.getElementById("char-민우");
            const seoyeon = document.getElementById("char-서연");

            if (current.target === "char-민우") {
                minwoo.classList.remove("inactive");
                seoyeon.classList.add("inactive");
            } else if (current.target === "char-서연") {
                seoyeon.classList.remove("inactive");
                minwoo.classList.add("inactive");
            } else {
                minwoo.classList.remove("inactive");
                seoyeon.classList.remove("inactive");
            }

            currentIndex++;
        } else {
            finishDialogue();
        }
    }

    // 대화 완료 및 연출 함수
    function finishDialogue() {
        if (isFinished) return;
        isFinished = true;

        // 대화창 및 건너뛰기 버튼 숨기기
        document.getElementById("dialogue-box").style.display = "none";
        document.getElementById("btn-skip").classList.add("hidden");

        // 캐릭터 원래 밝기로 복구
        const minwoo = document.getElementById("char-민우");
        const seoyeon = document.getElementById("char-서연");
        minwoo.classList.remove("inactive");
        seoyeon.classList.remove("inactive");

        // 캐릭터 중앙 이동 및 사라짐 효과
        setTimeout(() => {
            minwoo.classList.add("move-center-left");
            seoyeon.classList.add("move-center-right");
        }, 200);

        // 연출 완료 후 End 버튼 표시
        setTimeout(() => {
            document.getElementById("btn-next").classList.remove("hidden");
        }, 1000);
    }

    // 페이지 이동 함수
    function goToUrl(url) {
        if (url && url !== "(없음)" && url !== "") {
            window.location.href = url;
        } else {
            window.location.href = "index.html";
        }
    }

    // 초기화 및 첫 대화 시작
    window.onload = () => {
        advanceDialogue();
    };
</script>

</body>
</html>
