<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영종도 MATHTOUR - E01</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 16:9 프레임 게임 컨테이너 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      background-color: #0b0c10;
      overflow: hidden;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    /* SF 배경 */
    .bg-scenery {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #0d2847 0%, #081b33 60%, #020514 100%);
      z-index: 0;
    }

    .bg-radar-overlay {
      position: absolute;
      inset: 0;
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      z-index: 1;
    }

    /* 바닥 가이드 라인 */
    .ground-line {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 100%;
      height: 2px;
      background: repeating-linear-gradient(90deg, #00f0ff, #00f0ff 15px, transparent 15px, transparent 30px);
      z-index: 2;
    }

    /* 상단 헤더 바 */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 42px;
      background: rgba(11, 12, 16, 0.85);
      border-bottom: 2px solid #00f0ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
      backdrop-filter: blur(5px);
    }

    .header-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 18px;
      color: #00f0ff;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .header-info {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 13px;
      color: #e0ffff;
    }

    /* 등장인물 무대 영역 (z-index: 3) */
    .stage-area {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .char-wrapper {
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    /* 브리핑 / 스토리 박스 (z-index: 10) */
    .situation-box {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      width: 86%;
      max-width: 900px;
      background: rgba(0, 240, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      padding: 18px 24px;
      z-index: 10;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .briefing-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 20px;
      color: #00f0ff;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
      margin-bottom: 2px;
    }

    .script-summary {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dialogue-line {
      display: flex;
      gap: 10px;
      align-items: baseline;
      background: rgba(11, 12, 16, 0.65);
      padding: 8px 14px;
      border-radius: 6px;
      border-left: 3px solid #00f0ff;
    }

    .dialogue-line.inbo {
      border-left-color: #ff003c;
    }

    .speaker-tag {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 15px;
      color: #00f0ff;
      min-width: 45px;
    }

    .dialogue-line.inbo .speaker-tag {
      color: #ff003c;
    }

    .text-content {
      color: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* 공통 이동 버튼 규칙 */
    .btn-nav {
      position: absolute;
      bottom: 15px;
      padding: 8px 22px;
      background: transparent;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-family: 'Black Han Sans', sans-serif;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      z-index: 20;
      box-shadow: 0 0 10px #00f0ff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-nav:hover {
      background-color: #00f0ff;
      color: #0b0c10;
      box-shadow: 0 0 15px #00f0ff;
    }

    #btn-prev {
      left: 20px;
    }

    #btn-next {
      right: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="bg-scenery"></div>
    <div class="bg-radar-overlay"></div>
    <div class="ground-line"></div>

    <!-- 상단 헤더 바 -->
    <header class="header-bar">
      <div class="header-title">영종도 MATHTOUR</div>
      <div class="header-info">SECTOR 01: 공항전망대 관제실</div>
    </header>

    <!-- 중앙 브리핑 / 상황 연출 박스 -->
    <div class="situation-box">
      <div class="briefing-title">MISSION BRIEFING</div>
      <div class="script-summary">
        <div class="dialogue-line">
          <span class="speaker-tag">서연</span>
          <span class="text-content">"와, 민우야! 영종도 투어 오길 잘했다. 전망대 오니까 비행기 이착륙하는 게 진짜 잘 보인다!"</span>
        </div>
        <div class="dialogue-line">
          <span class="speaker-tag">민우</span>
          <span class="text-content">"그러게! 근데 저 비행기는 지금 얼마나 높이 떠 있는 걸까?"</span>
        </div>
        <div class="dialogue-line inbo">
          <span class="speaker-tag">인보</span>
          <span class="text-content">"삐빅! 환영합니다! 민우 학생, 서연 학생! 저는 공항전망대 안내 로봇 '인보'입니다. 오늘 두 분은 일일 항공 관제사가 되어 삼각비로 비행기 고도를 맞히는 미션을 맡게 되었습니다!"</span>
        </div>
      </div>
    </div>

    <!-- 등장인물 무대 (서연·민우는 나란히 왼쪽, 인보는 오른쪽 끝) -->
    <div class="stage-area">
      <!-- 서연 (왼쪽: left 120px) -->
      <div class="char-wrapper" id="char-서연" style="position:absolute; left:120px; bottom:25px; width:182px; height:224px; overflow:visible;">
        <iframe src="등장인물_서연.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.7); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>

      <!-- 민우 (서연 바로 옆: left 270px) -->
      <div class="char-wrapper" id="char-민우" style="position:absolute; left:270px; bottom:25px; width:182px; height:224px; overflow:visible;">
        <iframe src="등장인물_민우.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.7); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>

      <!-- 인보 (오른쪽 독립 배치: left 750px, 학생들을 바라보게 좌우 반전) -->
      <div class="char-wrapper" id="char-인보" style="position:absolute; left:750px; bottom:25px; width:182px; height:224px; overflow:visible;">
        <iframe src="등장인물_인보.html" scrolling="no" style="border:0; width:260px; height:320px; transform:scale(0.7) scaleX(-1); transform-origin:bottom left; pointer-events:none;"></iframe>
      </div>
    </div>

    <!-- 네비게이션 버튼 -->
    <button class="btn-nav" id="btn-prev" onclick="window.location.href='index.html'">이전</button>
    <button class="btn-nav" id="btn-next" onclick="window.location.href='E02.html'">다음</button>
  </div>

</body>
</html>
