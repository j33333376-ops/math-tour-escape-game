<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영종도 MATHTOUR - C04</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    :root {
      --cyan: #00f0ff;
      --cyan-light: #e0ffff;
      --red: #ff003c;
      --black: #0b0c10;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070a;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Noto Sans KR', sans-serif;
    }

    #game-container {
      position: relative;
      width: min(100vw, 1066px);
      max-width: 1066px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--black);
      box-shadow: 0 0 32px rgba(0,240,255,.18);
      isolation: isolate;
    }

    #background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(.78) saturate(.92) contrast(1.05);
    }

    #scene-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(4,9,15,.48), transparent 28%, transparent 72%, rgba(4,9,15,.66)),
        radial-gradient(circle at 50% 45%, transparent 0 42%, rgba(0,0,0,.26) 82%);
    }

    #scanlines {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: .16;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.06) 0,
        rgba(255,255,255,.06) 1px,
        transparent 1px,
        transparent 4px
      );
    }

    #stage-bar {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 30;
      width: 100%;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid rgba(0,240,255,.8);
      background: rgba(3,10,16,.78);
      box-shadow: 0 0 14px rgba(0,240,255,.35);
      backdrop-filter: blur(8px);
      font-family: 'Nanum Gothic Coding', monospace;
      letter-spacing: .08em;
    }

    #stage-title {
      font-family: 'Black Han Sans', sans-serif;
      color: var(--cyan-light);
      font-size: clamp(14px, 1.7vw, 20px);
      text-shadow: 0 0 10px rgba(0,240,255,.7);
    }

    #stage-code {
      color: var(--cyan);
      font-size: clamp(10px, 1.15vw, 14px);
    }

    #arrival-flash {
      position: absolute;
      inset: 0;
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(224,255,255,.9), rgba(0,240,255,.35) 26%, transparent 62%);
      animation: arrivalFlash 1.1s ease-out .15s both;
    }

    @keyframes arrivalFlash {
      0% { opacity: 0; transform: scale(.75); }
      20% { opacity: .9; }
      100% { opacity: 0; transform: scale(1.2); }
    }

    .arrival-ring {
      position: absolute;
      left: 50%;
      top: 52%;
      z-index: 4;
      width: 210px;
      height: 82px;
      border: 2px solid rgba(0,240,255,.85);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.3);
      opacity: 0;
      box-shadow: 0 0 22px rgba(0,240,255,.65), inset 0 0 18px rgba(0,240,255,.28);
      animation: ringExpand 1.25s ease-out .2s both;
      pointer-events: none;
    }

    .arrival-ring:nth-of-type(2) { animation-delay: .4s; }

    @keyframes ringExpand {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
      25% { opacity: .9; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
    }

    .char-wrapper {
      position: absolute;
      bottom: 40px;
      z-index: 12;
      width: 221px;
      height: 272px;
      overflow: visible;
      opacity: 0;
      transition: filter .2s, left 1.2s ease, opacity .8s ease, transform 1.2s ease;
      filter: drop-shadow(0 0 12px rgba(0,240,255,.18));
    }

    .char-wrapper iframe {
      border: 0;
      width: 260px;
      height: 320px;
      transform: scale(.85);
      transform-origin: bottom left;
      pointer-events: none;
    }

    #char-민우 {
      left: -235px;
      animation: enterMinwoo 1.1s cubic-bezier(.22,.8,.26,1) .55s forwards;
    }

    #char-서연 {
      left: 1080px;
      animation: enterSeoyeon 1.1s cubic-bezier(.22,.8,.26,1) .75s forwards;
    }

    #char-서연 iframe {
      transform: scale(.85) scaleX(-1);
      transform-origin: bottom left;
    }

    @keyframes enterMinwoo {
      to { left: 110px; opacity: 1; }
    }

    @keyframes enterSeoyeon {
      to { left: 735px; opacity: 1; }
    }

    .inactive {
      filter: brightness(.55) drop-shadow(0 0 8px rgba(0,240,255,.1));
    }

    .exit-center {
      opacity: 0 !important;
      transform: translateY(-8px) scale(.72) !important;
      filter: brightness(1.4) blur(2px) drop-shadow(0 0 25px rgba(0,240,255,.75)) !important;
    }

    #char-민우.exit-center { left: 426px !important; }
    #char-서연.exit-center { left: 500px !important; }

    #drone-wrapper {
      position: absolute;
      left: 50%;
      top: 59%;
      z-index: 5;
      width: 132px;
      height: 82px;
      overflow: hidden;
      transform: translate(-50%, -50%) rotate(-4deg);
      filter: saturate(.72) brightness(.83) drop-shadow(0 0 12px rgba(255,0,60,.45));
      animation: droneFloat 3.2s ease-in-out infinite;
    }

    #drone-wrapper iframe {
      border: 0;
      width: 600px;
      height: 600px;
      transform: scale(.22);
      transform-origin: top left;
      pointer-events: none;
    }

    #water-ripple {
      position: absolute;
      left: 50%;
      top: 67%;
      z-index: 4;
      width: 160px;
      height: 32px;
      border: 2px solid rgba(0,240,255,.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(0,240,255,.3);
      animation: waterPulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    #water-ripple::after {
      content: '';
      position: absolute;
      inset: 7px 22px;
      border: 1px solid rgba(224,255,255,.4);
      border-radius: 50%;
    }

    @keyframes droneFloat {
      0%,100% { transform: translate(-50%, -50%) rotate(-4deg) translateY(0); }
      50% { transform: translate(-50%, -50%) rotate(3deg) translateY(7px); }
    }

    @keyframes waterPulse {
      0%,100% { transform: translate(-50%, -50%) scale(.88); opacity: .35; }
      50% { transform: translate(-50%, -50%) scale(1.12); opacity: .8; }
    }

    #mission-status {
      position: absolute;
      left: 50%;
      top: 60px;
      z-index: 8;
      transform: translateX(-50%);
      padding: 8px 18px;
      border: 1px solid rgba(0,240,255,.6);
      background: rgba(0,20,28,.58);
      color: var(--cyan-light);
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: clamp(10px, 1.2vw, 14px);
      letter-spacing: .08em;
      box-shadow: 0 0 12px rgba(0,240,255,.18);
      backdrop-filter: blur(7px);
    }

    /* C01·C02·C03과 동일한 대화 박스 및 이동 버튼 규격 */
    #dialogue-box {
      position: absolute;
      left: 50%;
      bottom: 92px;
      z-index: 20;
      width: min(76%, 800px);
      min-height: 112px;
      padding: 17px 24px 18px;
      overflow: hidden;
      border: 1px solid rgba(0, 240, 255, 0.75);
      border-left: 5px solid var(--cyan);
      background: rgba(0, 35, 48, 0.42);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.3), inset 0 0 22px rgba(0, 240, 255, 0.08);
      transform: translateX(-50%);
      cursor: pointer;
      user-select: none;
    }

    #dialogue-box::after {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.12), transparent);
      animation: boxScan 4.2s linear infinite;
      pointer-events: none;
    }

    #speaker-name {
      position: relative;
      z-index: 1;
      min-height: 25px;
      margin-bottom: 5px;
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(15px, 1.9vw, 21px);
      color: var(--cyan);
      letter-spacing: .08em;
      text-shadow: 0 0 7px rgba(0,240,255,.8);
    }

    #dialogue-text {
      position: relative;
      z-index: 1;
      min-height: 49px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: clamp(12px, 1.52vw, 17px);
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: .05em;
      color: #fff;
      text-shadow: 0 2px 3px #000;
    }

    #dialogue-progress {
      position: absolute;
      right: 18px;
      bottom: 8px;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: clamp(9px, 1vw, 11px);
      color: rgba(224,255,255,.72);
    }

    #dialogue-guide {
      position: absolute;
      right: 18px;
      top: 12px;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: clamp(8px, .95vw, 10px);
      color: rgba(0,240,255,.78);
      animation: guideBlink 1.2s ease-in-out infinite alternate;
    }

    .btn-nav {
      position: absolute;
      z-index: 30;
      min-width: 116px;
      padding: 10px 20px;
      border: 2px solid var(--cyan);
      background: rgba(0,0,0,.72);
      box-shadow: 0 0 10px var(--cyan);
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: clamp(12px, 1.4vw, 16px);
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: .08em;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .btn-nav:hover,
    .btn-nav:focus-visible {
      color: #000;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan), 0 0 22px rgba(0,240,255,.8);
      transform: translateY(-2px);
      outline: none;
    }

    .btn-nav:active { transform: translateY(0); }

    #btn-prev { left: 20px; bottom: 20px; display: none; }
    #btn-next, #btn-skip { right: 20px; bottom: 20px; }
    #btn-next { display: none; }
    #btn-skip { background: rgba(0,0,0,.72); }

    @keyframes boxScan {
      from { left: -40%; }
      to { left: 120%; }
    }

    @keyframes guideBlink {
      from { opacity: .45; }
      to { opacity: 1; }
    }

    #end-panel {
      position: absolute;
      left: 50%;
      top: 46%;
      z-index: 25;
      width: min(64%, 620px);
      padding: 26px 30px;
      border: 1px solid rgba(0,240,255,.82);
      background: rgba(0,20,28,.74);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 28px rgba(0,240,255,.35), inset 0 0 24px rgba(0,240,255,.07);
      transform: translate(-50%, -50%) scale(.94);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transition: opacity .55s ease, transform .55s ease;
    }

    #end-panel.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    #end-panel h2 {
      margin: 0 0 10px;
      color: var(--cyan);
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(23px, 3vw, 36px);
      text-shadow: 0 0 12px rgba(0,240,255,.7);
    }

    #end-panel p {
      margin: 0;
      color: var(--cyan-light);
      line-height: 1.7;
      letter-spacing: .05em;
      font-size: clamp(12px, 1.4vw, 16px);
    }

    #end-button {
      margin-top: 18px;
      position: static;
      display: inline-block;
    }

    @media (max-width: 760px) {
      .char-wrapper { width: 156px; height: 192px; bottom: 62px; }
      .char-wrapper iframe { transform: scale(.6); }
      #char-서연 iframe { transform: scale(.6) scaleX(-1); }
      @keyframes enterMinwoo { to { left: 34px; opacity: 1; } }
      @keyframes enterSeoyeon { to { left: calc(100% - 190px); opacity: 1; } }
      #char-민우.exit-center { left: 38% !important; }
      #char-서연.exit-center { left: 48% !important; }
      #dialogue-box { bottom: 60px; width: 78%; min-height: 85px; padding: 10px 14px 13px; }
      #dialogue-guide { top: 6px; right: 10px; }
      #dialogue-progress { right: 10px; bottom: 4px; }
      .btn-nav { min-width: 82px; padding: 6px 10px; }
      #btn-prev { left: 12px; bottom: 12px; }
      #btn-next, #btn-skip { right: 12px; bottom: 12px; }
      #mission-status { top: 52px; }
      #drone-wrapper { width: 110px; height: 70px; }
      #water-ripple { width: 130px; }
    }
  </style>
</head>
<body>
  <main id="game-container" aria-label="영종도 MATHTOUR 마지막 대화 장면">
    <img id="background" src="을왕리해수욕장.png" alt="을왕리해수욕장 배경" />
    <div id="scene-overlay"></div>
    <div id="scanlines"></div>

    <header id="stage-bar">
      <div id="stage-title">드론 요격 완료 · 작전 종료</div>
      <div id="stage-code">C04 · MISSION DEBRIEF</div>
    </header>

    <div id="arrival-flash"></div>
    <div class="arrival-ring"></div>
    <div class="arrival-ring"></div>

    <div id="mission-status">TARGET NEUTRALIZED · DRONE AFLOAT</div>

    <div id="drone-wrapper" aria-label="수면 위에 떠 있는 드론">
      <iframe src="드론.html" scrolling="no" title="요격된 드론"></iframe>
    </div>
    <div id="water-ripple"></div>

    <div class="char-wrapper" id="char-민우">
      <iframe src="등장인물_민우.html" scrolling="no" title="민우"></iframe>
    </div>

    <div class="char-wrapper inactive" id="char-서연">
      <iframe src="등장인물_서연.html" scrolling="no" title="서연"></iframe>
    </div>

    <section id="dialogue-box" role="button" tabindex="0" aria-label="대화 계속하기" onclick="advanceDialogue()">
      <div id="speaker-name">민우</div>
      <div id="dialogue-text"></div>
      <div id="dialogue-guide">CLICK / SPACE ▶</div>
      <div id="dialogue-progress">01 / 08</div>
    </section>

    <button class="btn-nav" id="btn-prev" type="button" onclick="goToScene('C03.html')">◀ 이전</button>
    <button class="btn-nav" id="btn-skip" type="button" onclick="skipDialogue(event)">건너뛰기</button>

    <section id="end-panel" aria-live="polite">
      <h2>MISSION COMPLETE</h2>
      <p>
        이차함수의 그래프를 활용한 드론 요격 작전이 종료되었습니다.<br />
        다음 목적지는 영종도 레일바이크입니다.
      </p>
      <button class="btn-nav" id="end-button" type="button" onclick="goToScene('index.html')">End</button>
    </section>
  </main>

  <script>
    const dialogues = [
      {
        speaker: '민우',
        text: '성공이야! 우리가 만든 포물선 궤적이 드론을 정확히 맞혔어.',
        target: 'char-민우'
      },
      {
        speaker: '서연',
        text: '드론이 수면 위에 둥둥 떠 있어. 더 이상 불법 촬영은 못 하겠네.',
        target: 'char-서연'
      },
      {
        speaker: '민우',
        text: '꼭짓점과 대칭축을 생각하면서 계수를 바꾸니까 돌의 경로를 정확히 조절할 수 있었어.',
        target: 'char-민우'
      },
      {
        speaker: '서연',
        text: '이차함수의 그래프가 단순히 문제집 속 그림이 아니라 실제 움직임을 예측하는 데도 쓰일 수 있다는 게 신기해.',
        target: 'char-서연'
      },
      {
        speaker: '민우',
        text: '포물선의 모양과 위치를 수식으로 표현할 수 있으니까 비행 경로나 분수의 물줄기 같은 것도 분석할 수 있겠지?',
        target: 'char-민우'
      },
      {
        speaker: '서연',
        text: '맞아. 수학은 현실을 설명하고 문제를 해결하는 도구라는 걸 이번 작전에서 확실히 느꼈어.',
        target: 'char-서연'
      },
      {
        speaker: '민우',
        text: '그럼 다음 수학 탐험 장소로 이동하자. 이번 목적지는 영종도 레일바이크야!',
        target: 'char-민우'
      },
      {
        speaker: '서연',
        text: '좋아! 레일바이크에서는 또 어떤 수학 원리를 발견하게 될지 기대된다. 출발하자!',
        target: 'char-서연'
      }
    ];

    let currentIndex = 0;
    let typingTimer = null;
    let isTyping = false;
    let currentFullText = '';
    let sceneFinished = false;

    const speakerName = document.getElementById('speaker-name');
    const dialogueText = document.getElementById('dialogue-text');
    const dialogueProgress = document.getElementById('dialogue-progress');
    const dialogueBox = document.getElementById('dialogue-box');
    const btnSkip = document.getElementById('btn-skip');
    const btnPrev = document.getElementById('btn-prev');
    const endPanel = document.getElementById('end-panel');
    const characters = [...document.querySelectorAll('.char-wrapper')];

    function setActiveCharacter(targetId) {
      characters.forEach((character) => {
        character.classList.toggle('inactive', character.id !== targetId);
      });
    }

    function typeText(text) {
      clearInterval(typingTimer);
      currentFullText = text;
      dialogueText.textContent = '';
      isTyping = true;
      let index = 0;

      typingTimer = setInterval(() => {
        dialogueText.textContent += text[index] ?? '';
        index += 1;
        if (index >= text.length) {
          clearInterval(typingTimer);
          isTyping = false;
        }
      }, 28);
    }

    function showDialogue(index) {
      const item = dialogues[index];
      speakerName.textContent = item.speaker;
      dialogueProgress.textContent = `${String(index + 1).padStart(2, '0')} / ${String(dialogues.length).padStart(2, '0')}`;
      setActiveCharacter(item.target);
      typeText(item.text);
    }

    function advanceDialogue() {
      if (sceneFinished) return;

      if (isTyping) {
        clearInterval(typingTimer);
        dialogueText.textContent = currentFullText;
        isTyping = false;
        return;
      }

      currentIndex += 1;
      if (currentIndex >= dialogues.length) {
        finishDialogue();
        return;
      }
      showDialogue(currentIndex);
    }

    function skipDialogue(event) {
      event.stopPropagation();
      finishDialogue();
    }

    function finishDialogue() {
      if (sceneFinished) return;
      sceneFinished = true;
      clearInterval(typingTimer);
      isTyping = false;
      dialogueBox.style.display = 'none';
      btnSkip.style.display = 'none';
      characters.forEach((character) => {
        character.classList.remove('inactive');
        character.classList.add('exit-center');
      });

      setTimeout(() => {
        btnPrev.style.display = 'block';
        endPanel.classList.add('show');
      }, 1150);
    }

    function goToScene(url) {
      window.location.href = url;
    }

    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        advanceDialogue();
      }
    });

    window.addEventListener('load', () => {
      setTimeout(() => showDialogue(0), 850);
    });
  </script>
</body>
</html>
