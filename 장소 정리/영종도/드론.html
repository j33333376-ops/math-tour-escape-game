<!DOCTYPE html>
<!-- 원본 크기: 1000x500 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>드론</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .propeller {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.7s linear infinite;
    }

    .propeller.reverse {
      animation-direction: reverse;
    }

    .camera-lens {
      animation: lensGlow 2.2s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes lensGlow {
      0%, 100% {
        opacity: 0.75;
      }
      50% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <svg
    viewBox="0 0 1000 500"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="카메라가 달린 개인용 쿼드콥터 드론"
  >
    <defs>
      <linearGradient id="bodyGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#eef4f8" />
        <stop offset="45%" stop-color="#9eabb5" />
        <stop offset="100%" stop-color="#45535d" />
      </linearGradient>

      <linearGradient id="darkGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#53616b" />
        <stop offset="100%" stop-color="#182229" />
      </linearGradient>

      <linearGradient id="armGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#aebac2" />
        <stop offset="45%" stop-color="#586873" />
        <stop offset="100%" stop-color="#27343c" />
      </linearGradient>

      <radialGradient id="lensGradient" cx="38%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#bff7ff" />
        <stop offset="20%" stop-color="#3ccbf0" />
        <stop offset="52%" stop-color="#17618c" />
        <stop offset="78%" stop-color="#081d32" />
        <stop offset="100%" stop-color="#02070c" />
      </radialGradient>

      <radialGradient id="hubGradient" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#dbe5eb" />
        <stop offset="42%" stop-color="#778792" />
        <stop offset="100%" stop-color="#263139" />
      </radialGradient>

      <filter id="objectShadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow
          dx="0"
          dy="8"
          stdDeviation="7"
          flood-color="#061018"
          flood-opacity="0.45"
        />
      </filter>

      <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <clipPath id="bodyClip">
        <path d="M354 178
                 Q374 129 432 116
                 Q500 99 568 116
                 Q626 129 646 178
                 L625 270
                 Q610 324 554 341
                 Q500 356 446 341
                 Q390 324 375 270 Z" />
      </clipPath>
    </defs>

    <g filter="url(#objectShadow)">
      <!-- 후면 암 -->
      <path
        d="M391 185 L231 105 Q213 99 196 111 L171 130 L195 162
           Q210 176 232 170 L407 220 Z"
        fill="url(#armGradient)"
        stroke="#17242c"
        stroke-width="8"
        stroke-linejoin="round"
      />

      <path
        d="M609 185 L769 105 Q787 99 804 111 L829 130 L805 162
           Q790 176 768 170 L593 220 Z"
        fill="url(#armGradient)"
        stroke="#17242c"
        stroke-width="8"
        stroke-linejoin="round"
      />

      <!-- 전면 암 -->
      <path
        d="M399 257 L226 326 Q207 333 195 351 L174 382 L213 401
           Q232 410 247 394 L423 303 Z"
        fill="url(#armGradient)"
        stroke="#17242c"
        stroke-width="8"
        stroke-linejoin="round"
      />

      <path
        d="M601 257 L774 326 Q793 333 805 351 L826 382 L787 401
           Q768 410 753 394 L577 303 Z"
        fill="url(#armGradient)"
        stroke="#17242c"
        stroke-width="8"
        stroke-linejoin="round"
      />

      <!-- 모터 지지대 -->
      <g fill="url(#darkGradient)" stroke="#101a20" stroke-width="7">
        <ellipse cx="178" cy="137" rx="51" ry="36" />
        <ellipse cx="822" cy="137" rx="51" ry="36" />
        <ellipse cx="183" cy="374" rx="51" ry="36" />
        <ellipse cx="817" cy="374" rx="51" ry="36" />
      </g>

      <!-- 프로펠러 -->
      <g class="propeller">
        <ellipse
          cx="178"
          cy="137"
          rx="152"
          ry="18"
          fill="#6d7d87"
          fill-opacity="0.65"
          stroke="#34434d"
          stroke-width="5"
        />
        <ellipse
          cx="178"
          cy="137"
          rx="18"
          ry="92"
          fill="#8697a1"
          fill-opacity="0.55"
          stroke="#34434d"
          stroke-width="5"
        />
      </g>

      <g class="propeller reverse">
        <ellipse
          cx="822"
          cy="137"
          rx="152"
          ry="18"
          fill="#6d7d87"
          fill-opacity="0.65"
          stroke="#34434d"
          stroke-width="5"
        />
        <ellipse
          cx="822"
          cy="137"
          rx="18"
          ry="92"
          fill="#8697a1"
          fill-opacity="0.55"
          stroke="#34434d"
          stroke-width="5"
        />
      </g>

      <g class="propeller reverse">
        <ellipse
          cx="183"
          cy="374"
          rx="152"
          ry="18"
          fill="#6d7d87"
          fill-opacity="0.65"
          stroke="#34434d"
          stroke-width="5"
        />
        <ellipse
          cx="183"
          cy="374"
          rx="18"
          ry="92"
          fill="#8697a1"
          fill-opacity="0.55"
          stroke="#34434d"
          stroke-width="5"
        />
      </g>

      <g class="propeller">
        <ellipse
          cx="817"
          cy="374"
          rx="152"
          ry="18"
          fill="#6d7d87"
          fill-opacity="0.65"
          stroke="#34434d"
          stroke-width="5"
        />
        <ellipse
          cx="817"
          cy="374"
          rx="18"
          ry="92"
          fill="#8697a1"
          fill-opacity="0.55"
          stroke="#34434d"
          stroke-width="5"
        />
      </g>

      <!-- 모터 허브 -->
      <g fill="url(#hubGradient)" stroke="#172229" stroke-width="7">
        <circle cx="178" cy="137" r="33" />
        <circle cx="822" cy="137" r="33" />
        <circle cx="183" cy="374" r="33" />
        <circle cx="817" cy="374" r="33" />
      </g>

      <g fill="#1b272e">
        <circle cx="178" cy="137" r="12" />
        <circle cx="822" cy="137" r="12" />
        <circle cx="183" cy="374" r="12" />
        <circle cx="817" cy="374" r="12" />
      </g>

      <!-- 중앙 본체 -->
      <path
        d="M354 178
           Q374 129 432 116
           Q500 99 568 116
           Q626 129 646 178
           L625 270
           Q610 324 554 341
           Q500 356 446 341
           Q390 324 375 270 Z"
        fill="url(#bodyGradient)"
        stroke="#18252d"
        stroke-width="10"
        stroke-linejoin="round"
      />

      <!-- 본체 상단 패널 -->
      <path
        d="M400 170
           Q421 137 462 130
           Q500 123 538 130
           Q579 137 600 170
           L574 200
           Q500 185 426 200 Z"
        fill="#dce6eb"
        stroke="#61717b"
        stroke-width="6"
      />

      <path
        d="M433 149 Q500 128 567 149"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.6"
        stroke-width="7"
        stroke-linecap="round"
      />

      <!-- 본체 측면 어두운 패널 -->
      <g clip-path="url(#bodyClip)">
        <path
          d="M343 231 Q399 205 443 221 L430 335 L360 307 Z"
          fill="#384850"
          opacity="0.82"
        />
        <path
          d="M657 231 Q601 205 557 221 L570 335 L640 307 Z"
          fill="#384850"
          opacity="0.82"
        />
      </g>

      <!-- 상태 표시등 -->
      <g filter="url(#softGlow)">
        <circle cx="404" cy="258" r="8" fill="#28e5ff" />
        <circle cx="596" cy="258" r="8" fill="#ff5569" />
      </g>

      <!-- 전면 센서 -->
      <g>
        <rect
          x="457"
          y="212"
          width="86"
          height="31"
          rx="15"
          fill="#26353e"
          stroke="#101a20"
          stroke-width="5"
        />
        <circle cx="481" cy="227.5" r="8" fill="#62e2f6" />
        <circle cx="519" cy="227.5" r="8" fill="#62e2f6" />
      </g>

      <!-- 카메라 마운트 -->
      <path
        d="M454 329 L462 365
           Q466 382 483 388
           L517 388
           Q534 382 538 365
           L546 329 Z"
        fill="url(#darkGradient)"
        stroke="#131e25"
        stroke-width="8"
        stroke-linejoin="round"
      />

      <rect
        x="444"
        y="365"
        width="112"
        height="78"
        rx="26"
        fill="#303e47"
        stroke="#111b21"
        stroke-width="9"
      />

      <!-- 카메라 렌즈 -->
      <circle
        cx="500"
        cy="404"
        r="38"
        fill="#101b22"
        stroke="#697a84"
        stroke-width="7"
      />

      <circle
        class="camera-lens"
        cx="500"
        cy="404"
        r="28"
        fill="url(#lensGradient)"
        stroke="#02080c"
        stroke-width="5"
      />

      <circle
        cx="490"
        cy="394"
        r="8"
        fill="#e6fcff"
        opacity="0.9"
      />

      <circle
        cx="511"
        cy="415"
        r="5"
        fill="#40d6ff"
        opacity="0.7"
      />

      <!-- 착륙 다리 -->
      <path
        d="M406 306 L375 402 Q371 416 386 421 L430 430"
        fill="none"
        stroke="#26343c"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M594 306 L625 402 Q629 416 614 421 L570 430"
        fill="none"
        stroke="#26343c"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M379 421 Q404 435 438 433"
        fill="none"
        stroke="#111b21"
        stroke-width="10"
        stroke-linecap="round"
      />

      <path
        d="M621 421 Q596 435 562 433"
        fill="none"
        stroke="#111b21"
        stroke-width="10"
        stroke-linecap="round"
      />

      <!-- 본체 중앙 표시 -->
      <path
        d="M480 275 L500 255 L520 275 L500 295 Z"
        fill="#34444d"
        stroke="#1a272e"
        stroke-width="4"
      />

      <path
        d="M489 275 L500 264 L511 275 L500 286 Z"
        fill="#7de9fa"
        opacity="0.9"
      />
    </g>
  </svg>
</body>
</html>
