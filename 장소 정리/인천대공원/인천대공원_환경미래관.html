<!-- 원본 크기: 반응형 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인천대공원 환경미래관</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    background: linear-gradient(180deg,#dcedf7 0%, #e7f1ea 52%, #d8ead0 100%);
    color:#20362b;
    padding: 30px 20px 46px;
    display:flex; align-items:center; justify-content:center;
  }

  /* ===== 환경미래관 홀 ===== */
  .hall { max-width:1280px; width:100%; margin:0 auto; display:flex; flex-direction:column; align-items:center; }
  .hall-title { text-align:center; }
  .hall-title h1 {
    font-family:'Black Han Sans', sans-serif; font-size:2.7rem; color:#137a4b;
    letter-spacing:1px; line-height:1.1;
    text-shadow:0 2px 0 #fff, 0 4px 10px rgba(19,122,75,.15);
  }
  .hall-title h1 .eco { color:#0284c7; }
  .hall-title p { color:#3aa17a; font-size:.82rem; font-weight:700; letter-spacing:4px; margin-top:6px; }
  .hall-sub { margin-top:10px; color:#5b7566; font-size:.95rem; font-weight:500; }

  .exhibits {
    margin-top: 0; width:100%;
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center;
    gap: 46px 90px; position:relative; padding: 0 10px 34px;
  }
  /* 전시장 바닥 */
  .exhibits::before {
    content:''; position:absolute; left:2%; right:2%; bottom:12px; height:60px;
    background: radial-gradient(60% 100% at 50% 0, rgba(120,150,110,.28), rgba(120,150,110,0) 70%);
    z-index:0;
  }
  .exhibit { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; }
  .stage { display:flex; align-items:flex-end; justify-content:center; position:relative; }
  .stage::after { /* 접지 그림자 */
    content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    width:78%; height:22px; background:radial-gradient(50% 50% at 50% 50%, rgba(30,40,25,.22), rgba(30,40,25,0) 72%);
    z-index:-1;
  }
  .stp-svg { display:block; height: 430px; width:auto; filter: drop-shadow(0 10px 10px rgba(0,0,0,.12)); }
  .caption {
    margin-top: 16px; background:#ffffff; border:2px solid #cfe3d4; border-radius:12px;
    padding: 8px 20px; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,.08);
  }
  .caption b { display:block; color:#1f6a46; font-size:1rem; font-weight:700; }
  .caption span { display:block; color:#7b9184; font-size:.72rem; letter-spacing:1px; margin-top:2px; }

  /* 시계는 크기가 커서 축소 배치 */
  .clock-holder { zoom: 0.82; }

  /* ======================================================= */
  /* ===== 기후위기시계 (원본 CSS 그대로 병합) ===== */
  /* ======================================================= */
  .clock-wrapper { display:flex; flex-direction:column; align-items:center; position:relative; }
  .top-section { display:flex; align-items:flex-end; position:relative; left:-160px; margin-bottom:-5px; z-index:10; }
  .seal-scale-wrapper { width:220px; height:90px; position:relative; z-index:12; margin-right:-15px; }
  .seal-container { display:flex; align-items:flex-end; gap:15px; transform:scale(0.45); transform-origin:bottom left; position:absolute; bottom:0; left:0; }
  .seal { width:140px; height:180px; border-radius:50% 50% 45% 45% / 60% 60% 40% 40%; position:relative; box-shadow:inset -10px -15px 15px rgba(0,0,0,0.05); }
  .face { position:absolute; top:45px; width:100%; height:50px; }
  .eye { width:12px; height:15px; background-color:#333; border-radius:50%; position:absolute; top:10px; }
  .eye::after { content:''; position:absolute; top:2px; right:2px; width:4px; height:4px; background-color:white; border-radius:50%; }
  .eye.left { left:40px; } .eye.right { right:40px; }
  .nose { width:10px; height:8px; background-color:#333; border-radius:50%; position:absolute; top:25px; left:50%; transform:translateX(-50%); }
  .mouth { width:20px; height:12px; border-bottom:3px solid #333; border-radius:0 0 10px 10px; position:absolute; top:30px; left:50%; transform:translateX(-50%); }
  .flipper { width:40px; height:25px; border-radius:20px; position:absolute; top:90px; }
  .hat { position:absolute; top:-15px; left:50%; transform:translateX(-50%); width:50px; height:25px; border-radius:25px 25px 0 0; z-index:2; }
  .hat-brim { position:absolute; bottom:0; left:-10px; width:70px; height:8px; border-radius:5px; }
  .blue-seal { background-color:#8cd1eb; transform:rotate(-5deg); }
  .blue-seal .hat { background-color:#ffde59; transform:translateX(-50%) rotate(-15deg); }
  .blue-seal .hat-brim { background-color:#f5c71a; }
  .blue-seal .flipper { background-color:#8cd1eb; }
  .blue-seal .flipper.left { left:-15px; transform:rotate(-30deg); }
  .blue-seal .flipper.right { right:-5px; top:110px; transform:rotate(20deg); }
  .blue-seal .mouth { height:15px; background-color:#c94f61; border:2px solid #333; border-top:none; }
  .pink-seal { background-color:#f8b4c4; height:170px; z-index:1; }
  .pink-seal .hat { background-color:#ec5895; top:-10px; }
  .pink-seal .hat-brim { background-color:#d13d78; }
  .pink-seal .flipper { background-color:#f8b4c4; }
  .pink-seal .flipper.left { left:15px; top:110px; transform:rotate(45deg); width:30px; }
  .pink-seal .flipper.right { right:15px; top:110px; transform:rotate(-45deg); width:30px; }
  .pink-seal .spots { position:absolute; bottom:30px; left:20px; width:15px; height:15px; background-color:#d93d59; border-radius:50%; box-shadow:15px -10px 0 #d93d59, -5px -20px 0 -3px #d93d59; }
  .white-seal { background-color:#ffffff; height:160px; transform:rotate(5deg); }
  .white-seal .hat { background-color:#5bb3e4; width:40px; left:40%; top:-5px; transform:rotate(10deg); }
  .white-seal .hat-brim { background-color:#4092bf; width:60px; left:-10px; }
  .white-seal .flipper { background-color:#ffffff; box-shadow:-2px 2px 5px rgba(0,0,0,0.05); }
  .white-seal .flipper.left { left:20px; top:100px; transform:rotate(30deg); }
  .white-seal .flipper.right { right:-10px; transform:rotate(-30deg); }
  .white-seal .spots { position:absolute; bottom:25px; left:20px; width:12px; height:12px; background-color:#add8e6; border-radius:50%; box-shadow:12px -15px 0 -2px #add8e6; }
  .top-sign { background:linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%); padding:15px 40px; border-radius:10px 40px 0 0; border:2px solid #bae6fd; border-bottom:none; text-align:center; box-shadow:0 -5px 10px rgba(0,0,0,0.05); position:relative; z-index:11; }
  .top-sign h1 { color:#0284c7; font-family:'Black Han Sans', sans-serif; font-size:1.8rem; letter-spacing:1px; margin-bottom:2px; }
  .top-sign p { color:#38bdf8; font-size:0.7rem; font-weight:700; letter-spacing:2px; }
  .display-frame { background-color:#333; border:12px solid #555; border-radius:5px; padding:15px 25px; box-shadow:0 10px 30px rgba(0,0,0,0.3), inset 0 0 20px rgba(0,0,0,0.8); position:relative; z-index:20; width:100%; max-width:900px; }
  .display-screen { background-color:#0a0a0a; border-radius:3px; padding:20px; display:flex; flex-direction:column; gap:15px; }
  .time-row { display:flex; justify-content:center; align-items:baseline; gap:15px; font-family:'Share Tech Mono', monospace; }
  .led-number { color:#ffffff; font-size:5rem; text-shadow:0 0 10px rgba(255,255,255,0.7); line-height:1; }
  .led-text { color:#fbbf24; font-size:2.2rem; text-shadow:0 0 8px rgba(251,191,36,0.6); margin-right:10px; }
  .colon { animation:blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .message-row { text-align:center; font-size:1.4rem; font-weight:700; letter-spacing:1px; word-spacing:2px; }
  .text-red { color:#ef4444; text-shadow:0 0 8px rgba(239,68,68,0.6); margin-right:15px; }
  .text-green { color:#4ade80; text-shadow:0 0 8px rgba(74,222,128,0.6); }
  .legs { display:flex; justify-content:space-between; width:85%; margin-top:-5px; }
  .leg { width:35px; height:180px; background:linear-gradient(90deg,#111 0%,#333 50%,#111 100%); border-radius:0 0 5px 5px; box-shadow:5px 5px 15px rgba(0,0,0,0.2); }

  @media (max-width: 900px) {
    .exhibits { gap: 34px; }
    .clock-holder { zoom: 0.6; }
    .stp-svg { height: 320px; }
    .hall-title h1 { font-size:2rem; }
  }
</style>

<script>
  let deadline = new Date("2029-07-22T16:00:00Z").getTime();
  async function fetchApiData() {
    try {
      const res = await fetch("https://api.climateclock.world/v2/clock.json");
      const json = await res.json();
      const modules = json.data.modules;
      for (let key in modules) {
        if (modules[key].type === "timer" && modules[key].flavor === "deadline") {
          deadline = new Date(modules[key].timestamp).getTime(); break;
        }
      }
    } catch (e) { console.error("API 호출 에러", e); }
  }
  function updateDisplay() {
    const now = new Date().getTime();
    const diff = deadline - now;
    if (diff <= 0) {
      document.getElementById("val-years").innerText = "0";
      document.getElementById("val-days").innerText = "000";
      document.getElementById("val-time").innerHTML = "00<span class='colon'>:</span>00<span class='colon'>:</span>00";
      return;
    }
    const msSec=1000, msMin=msSec*60, msHour=msMin*60, msDay=msHour*24, daysInYear=365.2425;
    const totalDays = diff/msDay;
    const y = Math.floor(totalDays/daysInYear);
    const d = Math.floor(totalDays % daysInYear);
    const h = Math.floor((diff % msDay)/msHour);
    const m = Math.floor((diff % msHour)/msMin);
    const s = Math.floor((diff % msMin)/msSec);
    document.getElementById("val-years").innerText = y;
    document.getElementById("val-days").innerText = String(d).padStart(3,'0');
    document.getElementById("val-time").innerHTML =
      `${String(h).padStart(2,'0')}<span class="colon">:</span>${String(m).padStart(2,'0')}<span class="colon">:</span>${String(s).padStart(2,'0')}`;
  }
  fetchApiData().then(() => { updateDisplay(); setInterval(updateDisplay, 1000); });
</script>
