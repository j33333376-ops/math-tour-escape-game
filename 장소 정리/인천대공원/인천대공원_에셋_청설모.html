<!-- 원본 크기: 600x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청설모</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .ids2-svg { display:block; width:100%; height:auto; }
  .ids2-tail { animation: ids2-tail 4.2s ease-in-out infinite; transform-origin: 190px 400px; }
  @keyframes ids2-tail { 0%,100% { transform: rotate(-5deg);} 50% { transform: rotate(5deg);} }
  .ids2-ear { animation: ids2-ear 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes ids2-ear { 0%,88%,100% { transform: rotate(0deg);} 94% { transform: rotate(-10deg);} }
</style>
</head>
<body>
<svg class="ids2-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="청설모">
<title>청설모</title>
<desc>인천대공원 수목원의 청설모. 도토리를 든 모습.</desc>
<defs>
  <linearGradient id="ids2Fur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a7a6c"/><stop offset="0.55" stop-color="#6b5c50"/><stop offset="1" stop-color="#463b32"/>
  </linearGradient>
  <linearGradient id="ids2Tail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#463b32"/><stop offset="0.5" stop-color="#7d6e60"/><stop offset="1" stop-color="#a89684"/>
  </linearGradient>
  <linearGradient id="ids2Acorn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e0bb84"/><stop offset="1" stop-color="#a8763a"/>
  </linearGradient>
</defs>
<ellipse cx="320" cy="552" rx="200" ry="26" fill="#3f3a28" opacity="0.2"/>
<!-- 꼬리 -->
<g class="ids2-tail">
  <path d="M196,430
           C120,420 62,352 74,262
           C84,186 146,132 214,140
           C186,178 158,232 158,286
           C158,342 182,392 214,414 Z"
        fill="url(#ids2Tail)" stroke="#33291f" stroke-width="5"/>
  <g fill="none" stroke="#a89684" stroke-width="4" opacity="0.6">
    <path d="M116,376 C96,320 100,246 132,196"/>
    <path d="M144,394 C124,336 128,254 164,204"/>
  </g>
</g>
<!-- 뒷다리 -->
<path d="M254,470 C230,486 218,514 226,538 L286,538 C278,514 282,490 296,472 Z" fill="url(#ids2Fur)" stroke="#33291f" stroke-width="4"/>
<!-- 몸통 -->
<path d="M240,392
         C232,318 282,262 350,258
         C418,254 464,300 462,368
         C460,436 420,494 356,504
         C290,514 248,462 240,392 Z"
      fill="url(#ids2Fur)" stroke="#33291f" stroke-width="5.4"/>
<!-- 배 -->
<path d="M300,398 C316,352 366,330 414,344 C438,398 424,462 380,486 C334,510 296,462 300,398 Z"
      fill="#e0d4c4" opacity="0.85"/>
<!-- 앞다리 -->
<path d="M356,394 C336,412 330,438 342,456 C360,450 380,452 392,462 C402,440 396,410 378,396 Z"
      fill="#7d6e60" stroke="#33291f" stroke-width="4"/>
<!-- 앞발 -->
<g fill="#8a7a6c" stroke="#33291f" stroke-width="3">
  <ellipse cx="384" cy="336" rx="24" ry="18" transform="rotate(-24 384 336)"/>
  <ellipse cx="424" cy="356" rx="22" ry="17" transform="rotate(18 424 356)"/>
</g>
<!-- 도토리 -->
<g transform="translate(408,330) rotate(-12)">
  <path d="M-26,-4 C-26,30 -12,52 0,52 C12,52 26,30 26,-4 Z" fill="url(#ids2Acorn)" stroke="#7d5424" stroke-width="4"/>
  <path d="M-30,-6 C-30,-24 -16,-32 0,-32 C16,-32 30,-24 30,-6 Z" fill="#8a5a28" stroke="#5e3c14" stroke-width="4"/>
  <g stroke="#5e3c14" stroke-width="2.4" opacity="0.7">
    <path d="M-24,-14 h48"/><path d="M-28,-22 h56"/>
  </g>
  <path d="M0,-32 L0,-46" stroke="#5e3c14" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="-12" cy="14" rx="7" ry="14" fill="#ffffff" opacity="0.3"/>
</g>
<!-- 머리 -->
<circle cx="400" cy="252" r="72" fill="url(#ids2Fur)" stroke="#33291f" stroke-width="5.4"/>
<!-- 볼과 주둥이 -->
<path d="M448,258 C486,252 512,266 510,286 C508,308 480,318 448,308 Z" fill="#a89684" stroke="#33291f" stroke-width="4"/>
<ellipse cx="504" cy="282" rx="12" ry="9" fill="#3a2b22"/>
<path d="M478,300 q16,10 26,-2" fill="none" stroke="#33291f" stroke-width="3.4" stroke-linecap="round"/>
<!-- 수염 -->
<g stroke="#e0d4c4" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
  <path d="M486,286 L544,272"/><path d="M486,294 L548,296"/><path d="M486,302 L542,318"/>
</g>
<!-- 눈 -->
<circle cx="432" cy="232" r="17" fill="#1f1a14"/>
<circle cx="427" cy="226" r="6" fill="#ffffff"/>
<!-- 귀(붓털) -->
<g class="ids2-ear">
  <path d="M366,190 C356,146 366,112 384,110 C402,110 410,144 402,188 Z" fill="#6b5c50" stroke="#33291f" stroke-width="4"/>
  <path d="M382,140 C376,116 380,98 388,96" fill="none" stroke="#33291f" stroke-width="5" stroke-linecap="round"/>
</g>
<g class="ids2-ear" style="animation-delay:1.1s">
  <path d="M430,182 C428,140 442,110 460,112 C478,116 480,150 466,190 Z" fill="#7d6e60" stroke="#33291f" stroke-width="4"/>
  <path d="M456,142 C456,118 462,102 470,102" fill="none" stroke="#33291f" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- 나뭇가지 -->
<path d="M120,552 C220,536 420,536 540,552" fill="none" stroke="#6b5236" stroke-width="20" stroke-linecap="round"/>
<path d="M180,548 q30,-22 62,-14" fill="none" stroke="#6b5236" stroke-width="8" stroke-linecap="round"/>
<g fill="#5f9c3c">
  <ellipse cx="248" cy="528" rx="22" ry="10" transform="rotate(-18 248 528)"/>
  <ellipse cx="510" cy="534" rx="20" ry="9" transform="rotate(16 510 534)"/>
</g>
</svg>
</body>
</html>
