<!DOCTYPE html>
<html lang="ko">
<head>

<title>인천대공원 백범광장</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Myeongjo:wght@700;800&display=swap');
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .bbp-svg { display:block; width:100%; height:auto; }
  .bbp-title { font-family:'Jua','Malgun Gothic',sans-serif; }
  .bbp-stone { font-family:'Nanum Myeongjo','Batang',serif; }
  .bbp-cloud { animation: bbp-drift 32s ease-in-out infinite; }
  @keyframes bbp-drift { 0%,100%{transform:translateX(0);} 50%{transform:translateX(28px);} }
  .bbp-leaf { animation: bbp-sway 6.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes bbp-sway { 0%,100%{transform:rotate(-1.4deg);} 50%{transform:rotate(1.4deg);} }
  .bbp-flag { animation: bbp-wave 3.6s ease-in-out infinite; transform-box:fill-box; transform-origin:0% 50%; }
  @keyframes bbp-wave { 0%,100%{transform:skewY(0deg) scaleX(1);} 25%{transform:skewY(2.4deg) scaleX(.98);} 75%{transform:skewY(-2.4deg) scaleX(.98);} }
</style>
</head>
<body>
<svg class="bbp-svg" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천대공원 백범광장">
<title>인천대공원 백범광장</title>
<desc>입구의 '백범광장' 표석과, 두루마기를 입고 둥근 안경을 쓴 백범 김구 선생의 전신 청동 입상이 화강암 대좌 위에 서 있는 인천대공원 백범광장. 태극기가 함께 게양되어 있다.</desc>

<defs>
  <linearGradient id="bbp-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9d4ee"/><stop offset="0.6" stop-color="#d3ebf3"/><stop offset="1" stop-color="#edf5e6"/>
  </linearGradient>
  <linearGradient id="bbp-lawn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8cbb5d"/><stop offset="1" stop-color="#57893a"/>
  </linearGradient>
  <linearGradient id="bbp-plaza" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e0d7bf"/><stop offset="1" stop-color="#c3b491"/>
  </linearGradient>
  <radialGradient id="bbp-tree" cx="0.36" cy="0.28" r="0.8">
    <stop offset="0" stop-color="#77ab54"/><stop offset="1" stop-color="#3c6e30"/>
  </radialGradient>
  <linearGradient id="bbp-granite" x1="0" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#d8d3c8"/><stop offset="0.5" stop-color="#b3ada0"/><stop offset="1" stop-color="#847e72"/>
  </linearGradient>
  <linearGradient id="bbp-granite2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9a948a"/><stop offset="0.5" stop-color="#c4beb2"/><stop offset="1" stop-color="#8f897e"/>
  </linearGradient>
  <linearGradient id="bbp-bronze" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#a4a58c"/><stop offset="0.5" stop-color="#727659"/><stop offset="1" stop-color="#484c39"/>
  </linearGradient>
  <linearGradient id="bbp-bronze2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#82856a"/><stop offset="1" stop-color="#494d3a"/>

  <linearGradient id="bbp-pole" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9aa1a8"/><stop offset="0.5" stop-color="#e2e6ea"/><stop offset="1" stop-color="#8a9199"/>
  </linearGradient>
</defs>

        <rect x="-13" y="-9" width="10" height="4"/><rect x="3" y="-9" width="10" height="4"/>

      <g transform="translate(532,235) rotate(-33.69)">
        <rect x="-13" y="-9" width="10" height="4"/><rect x="3" y="-9" width="10" height="4"/>
        <rect x="-13" y="-2" width="10" height="4"/><rect x="3" y="-2" width="10" height="4"/>
        <rect x="-13" y="5" width="10" height="4"/><rect x="3" y="5" width="10" height="4"/>
      </g>
    </g>
  </g>
</g>
