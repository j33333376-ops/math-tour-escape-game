<!-- 원본 크기: 500x750 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활과 화살통</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .idh-svg { display:block; width:100%; height:auto; }
  .idh-string { animation: idh-string 3.4s ease-in-out infinite; }
  @keyframes idh-string { 0%,100% { opacity:0.85; } 50% { opacity:1; } }
</style>
</head>
<body>
<svg class="idh-svg" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="활과 화살통">
<title>활과 화살통</title>
<desc>인천대공원 궁도장의 국궁과 화살이 담긴 전통 화살통.</desc>
<defs>
  <linearGradient id="idhBow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5f3a18"/><stop offset="0.35" stop-color="#a8763a"/>
    <stop offset="0.6" stop-color="#7d5424"/><stop offset="1" stop-color="#4a2c10"/>
  </linearGradient>
  <linearGradient id="idhQuiver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5f2418"/><stop offset="0.34" stop-color="#a8482e"/>
    <stop offset="0.62" stop-color="#7d3020"/><stop offset="1" stop-color="#4a1a10"/>
  </linearGradient>
  <linearGradient id="idhShaft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c9a05a"/><stop offset="0.5" stop-color="#e8c98a"/><stop offset="1" stop-color="#a87c3f"/>
  </linearGradient>
</defs>
<ellipse cx="250" cy="714" rx="164" ry="22" fill="#3a2a18" opacity="0.22"/>
<!-- 활 -->
<g transform="translate(150,0)">
  <path d="M40,60 C6,140 -10,300 -6,420 C-2,540 14,640 44,700"
        fill="none" stroke="url(#idhBow)" stroke-width="22" stroke-linecap="round"/>
  <path d="M40,60 C60,74 66,92 62,110" fill="none" stroke="#5f3a18" stroke-width="16" stroke-linecap="round"/>
  <path d="M44,700 C64,686 70,668 66,650" fill="none" stroke="#5f3a18" stroke-width="16" stroke-linecap="round"/>
  <!-- 시위 -->
  <path class="idh-string" d="M58,102 C34,300 34,470 60,656" fill="none" stroke="#f2ece0" stroke-width="4.4"/>
  <!-- 손잡이 -->
  <rect x="-24" y="352" width="42" height="76" rx="10" fill="#4a2c10" stroke="#2f1a08" stroke-width="3.4"/>
  <g stroke="#c9a05a" stroke-width="3" opacity="0.8">
    <line x1="-24" y1="368" x2="18" y2="362"/><line x1="-24" y1="390" x2="18" y2="384"/>
    <line x1="-24" y1="412" x2="18" y2="406"/>
  </g>
  <!-- 각궁 무늬 -->
  <g stroke="#e0bb84" stroke-width="3" opacity="0.6" fill="none">
    <path d="M12,180 q10,-6 18,-2"/><path d="M2,262 q10,-6 18,-2"/>
    <path d="M2,520 q10,6 18,2"/><path d="M12,600 q10,6 18,2"/>
  </g>
</g>
<!-- 화살통 -->
<g transform="translate(348,0)">
  <!-- 화살 -->
  <g>
    <g transform="rotate(-9 0 400)">
      <rect x="-6" y="76" width="12" height="330" rx="6" fill="url(#idhShaft)"/>
      <path d="M-6,76 L6,76 L0,54 Z" fill="#3a2a10"/>
      <path d="M-6,116 l-16,-22 l16,-4 Z" fill="#e6403a"/>
      <path d="M6,116 l16,-22 l-16,-4 Z" fill="#e6403a"/>
    </g>
    <g transform="rotate(-2 0 400)">
      <rect x="-6" y="62" width="12" height="344" rx="6" fill="url(#idhShaft)"/>
      <path d="M-6,62 L6,62 L0,40 Z" fill="#3a2a10"/>
      <path d="M-6,102 l-16,-22 l16,-4 Z" fill="#f2c14e"/>
      <path d="M6,102 l16,-22 l-16,-4 Z" fill="#f2c14e"/>
    </g>
    <g transform="rotate(6 0 400)">
      <rect x="-6" y="80" width="12" height="326" rx="6" fill="url(#idhShaft)"/>
      <path d="M-6,80 L6,80 L0,58 Z" fill="#3a2a10"/>
      <path d="M-6,120 l-16,-22 l16,-4 Z" fill="#1f5f8c"/>
      <path d="M6,120 l16,-22 l-16,-4 Z" fill="#1f5f8c"/>
    </g>
    <g transform="rotate(13 0 400)">
      <rect x="-6" y="94" width="12" height="312" rx="6" fill="url(#idhShaft)"/>
      <path d="M-6,94 L6,94 L0,72 Z" fill="#3a2a10"/>
      <path d="M-6,134 l-16,-22 l16,-4 Z" fill="#2f7a3c"/>
      <path d="M6,134 l16,-22 l-16,-4 Z" fill="#2f7a3c"/>
    </g>
  </g>
  <!-- 통 -->
  <path d="M-64,376 L64,376 L54,690 C53,704 44,712 32,712 L-32,712 C-44,712 -53,704 -54,690 Z"
        fill="url(#idhQuiver)" stroke="#3a1208" stroke-width="5"/>
  <ellipse cx="0" cy="376" rx="64" ry="18" fill="#c25a3c" stroke="#3a1208" stroke-width="4.4"/>
  <ellipse cx="0" cy="376" rx="48" ry="12" fill="#5f2418"/>
  <!-- 금속 테 -->
  <g fill="#c9922e" stroke="#6e4a10" stroke-width="3">
    <rect x="-62" y="430" width="124" height="22" rx="6"/>
    <rect x="-58" y="592" width="116" height="22" rx="6"/>
  </g>
  <!-- 문양 -->
  <g fill="#e8b64c" opacity="0.85">
    <path d="M0,486 l14,20 l-14,20 l-14,-20 Z"/>
    <circle cx="-30" cy="506" r="7"/><circle cx="30" cy="506" r="7"/>
    <path d="M0,540 q18,12 0,24 q-18,-12 0,-24 Z"/>
  </g>
  <!-- 끈 -->
  <path d="M-62,440 C-104,470 -108,560 -60,606" fill="none" stroke="#c9a35c" stroke-width="9" stroke-linecap="round"/>
  <!-- 광택 -->
  <path d="M-44,392 C-52,470 -52,600 -42,690" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.22" stroke-linecap="round"/>
  <!-- 굽 -->
  <ellipse cx="0" cy="712" rx="54" ry="12" fill="#4a1a10" stroke="#2f1008" stroke-width="3.4"/>
</g>
</svg>
</body>
</html>
