<!-- 원본 크기: 440x470 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사막여우</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .ff-svg { display:block; width:100%; height:auto; }
  .ff-earL { animation: ff-earL 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  .ff-earR { animation: ff-earR 5.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes ff-earL { 0%,88%,100%{transform:rotate(0);} 94%{transform:rotate(-6deg);} }
  @keyframes ff-earR { 0%,84%,100%{transform:rotate(0);} 90%{transform:rotate(6deg);} }
  .ff-eye { animation: ff-blink 5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
  @keyframes ff-blink { 0%,92%,100%{transform:scaleY(1);} 96%{transform:scaleY(0.1);} }
  .ff-tail { animation: ff-tail 5.4s ease-in-out infinite; transform-box:fill-box; transform-origin:80% 20%; }
  @keyframes ff-tail { 0%,100%{transform:rotate(-2.5deg);} 50%{transform:rotate(2.5deg);} }
  .ff-body { animation: ff-breathe 4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes ff-breathe { 0%,100%{transform:scale(1);} 50%{transform:scale(1.015);} }
</style>
</head>
<body>
<svg class="ff-svg" viewBox="0 0 440 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="사막여우">
<title>사막여우</title>
<desc>커다란 귀와 크고 까만 눈, 복슬복슬한 꼬리를 가진 앉아 있는 귀여운 사막여우.</desc>
<defs>
  <linearGradient id="ff-fur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f8eed6"/><stop offset="0.6" stop-color="#eeddb6"/><stop offset="1" stop-color="#ddc494"/>
  </linearGradient>
  <linearGradient id="ff-tailg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4e8cc"/><stop offset="1" stop-color="#dcc190"/>
  </linearGradient>
  <radialGradient id="ff-earin" cx="0.5" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#f4cfc4"/><stop offset="1" stop-color="#d79f92"/>
  </radialGradient>
  <radialGradient id="ff-eye" cx="0.38" cy="0.32" r="0.75">
    <stop offset="0" stop-color="#5a4632"/><stop offset="1" stop-color="#1f1710"/>
  </radialGradient>
</defs>

<!-- 그림자 -->
<ellipse cx="222" cy="444" rx="140" ry="20" fill="#7a6034" opacity="0.18"/>

<!-- 꼬리(몸 뒤) -->
<g class="ff-tail">
  <path d="M120,300 C60,300 30,346 44,392 C56,428 96,436 128,420 C110,392 108,352 130,320 Z"
        fill="url(#ff-tailg)" stroke="#cdb182" stroke-width="3" stroke-linejoin="round"/>
  <path d="M44,392 C56,428 96,436 128,420 C104,414 74,404 56,384 Z" fill="#6f5b40" opacity="0.85"/>
  <path d="M120,300 C86,312 66,340 62,368" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
</g>

<g class="ff-body">
<!-- 몸통(앉은 자세) -->
<path d="M150,250 C150,196 190,168 222,168 C254,168 296,196 296,252
         C302,300 306,360 300,404 C296,428 270,438 222,438
         C176,438 150,428 146,404 C140,360 146,300 150,250 Z"
      fill="url(#ff-fur)" stroke="#cdb182" stroke-width="3" stroke-linejoin="round"/>
<!-- 앞다리 -->
<path d="M188,392 C186,412 186,426 190,436 L210,436 C210,422 208,406 204,390 Z" fill="url(#ff-fur)" stroke="#cdb182" stroke-width="2.5"/>
<path d="M240,392 C238,412 240,426 244,436 L264,436 C262,422 260,406 258,390 Z" fill="url(#ff-fur)" stroke="#cdb182" stroke-width="2.5"/>
<ellipse cx="200" cy="436" rx="16" ry="7" fill="#f6ecd4" stroke="#cdb182" stroke-width="2"/>
<ellipse cx="254" cy="436" rx="16" ry="7" fill="#f6ecd4" stroke="#cdb182" stroke-width="2"/>
<!-- 가슴 흰 털 -->
<path d="M222,220 C204,250 202,320 214,392 C222,404 226,404 232,392 C244,320 240,250 222,220 Z" fill="#fbf4e2" opacity="0.85"/>

<!-- ===== 머리 ===== -->
<!-- 귀(왼) — 넓은 삼각형 큰 귀 -->
<g class="ff-earL">
  <path d="M112,32 C146,66 188,116 212,158 C192,170 170,176 152,178 C134,128 114,74 112,32 Z"
        fill="url(#ff-fur)" stroke="#cdb182" stroke-width="3" stroke-linejoin="round"/>
  <path d="M126,56 C154,86 186,128 200,156 C186,164 170,168 158,166 C146,124 128,84 126,56 Z" fill="url(#ff-earin)"/>
  <g stroke="#fbf4e2" stroke-width="4" opacity="0.55" stroke-linecap="round"><path d="M138,72 C160,100 182,132 194,154"/></g>
</g>
<!-- 귀(오) — 넓은 삼각형 큰 귀 -->
<g class="ff-earR">
  <path d="M332,32 C298,66 256,116 232,158 C252,170 274,176 292,178 C310,128 330,74 332,32 Z"
        fill="url(#ff-fur)" stroke="#cdb182" stroke-width="3" stroke-linejoin="round"/>
  <path d="M318,56 C290,86 258,128 244,156 C258,164 274,168 286,166 C298,124 316,84 318,56 Z" fill="url(#ff-earin)"/>
  <g stroke="#fbf4e2" stroke-width="4" opacity="0.55" stroke-linecap="round"><path d="M306,72 C284,100 262,132 250,154"/></g>
</g>
<!-- 얼굴 -->
<path d="M222,120 C176,120 158,158 158,196 C158,236 186,262 222,262 C258,262 286,236 286,196 C286,158 268,120 222,120 Z"
      fill="url(#ff-fur)" stroke="#cdb182" stroke-width="3"/>
<!-- 이마~볼 흰 털 -->
<path d="M222,140 C198,150 186,196 196,236 C206,252 238,252 248,236 C258,196 246,150 222,140 Z" fill="#fbf4e2"/>
<!-- 눈 -->
<g class="ff-eye">
  <ellipse cx="196" cy="196" rx="16" ry="19" fill="url(#ff-eye)"/>
  <circle cx="191" cy="189" r="4.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="200" cy="200" r="2.2" fill="#ffffff" opacity="0.5"/>
</g>
<g class="ff-eye" style="animation-delay:.12s">
  <ellipse cx="248" cy="196" rx="16" ry="19" fill="url(#ff-eye)"/>
  <circle cx="243" cy="189" r="4.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="252" cy="200" r="2.2" fill="#ffffff" opacity="0.5"/>
</g>
<!-- 눈 위 옅은 무늬 -->
<path d="M182,176 C190,168 202,168 208,174 M262,176 C254,168 242,168 236,174" fill="none" stroke="#d8bd8e" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
<!-- 주둥이 -->
<path d="M204,224 C204,248 214,262 222,262 C230,262 240,248 240,224 Z" fill="#fbf4e2"/>
<ellipse cx="222" cy="230" rx="9" ry="6.5" fill="#2b2118"/>
<path d="M222,236 L222,248" stroke="#7a5b48" stroke-width="2.4" stroke-linecap="round"/>
<path d="M222,248 C216,254 210,254 206,250 M222,248 C228,254 234,254 238,250" fill="none" stroke="#7a5b48" stroke-width="2.4" stroke-linecap="round"/>
<!-- 수염 -->
<g stroke="#b6a074" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
  <path d="M206,232 C182,230 164,232 150,238"/><path d="M206,238 C184,240 168,246 156,254"/>
  <path d="M238,232 C262,230 280,232 294,238"/><path d="M238,238 C260,240 276,246 288,254"/>
</g>
</g>
</svg>
</body>
</html>
