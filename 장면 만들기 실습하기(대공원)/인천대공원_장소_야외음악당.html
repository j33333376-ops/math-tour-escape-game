<!-- 원본 크기: 900x520 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인천대공원 야외음악당</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .oamh-svg { display:block; width:100%; height:auto; }
  .oamh-note { animation: oamh-float 3.5s ease-in-out infinite; }
  @keyframes oamh-float { 0% { transform: translateY(0); opacity:0.9; } 100% { transform: translateY(-30px); opacity:0; } }
  .oamh-leaf { animation: oamh-sway 5.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes oamh-sway { 0%,100% { transform: rotate(-1.5deg);} 50% { transform: rotate(1.5deg);} }
  .oamh-cloud { animation: oamh-drift 17s ease-in-out infinite; }
  @keyframes oamh-drift { 0%,100% { transform: translateX(0);} 50% { transform: translateX(20px);} }
</style>
</head>
<body>
<svg class="oamh-svg" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천대공원 야외음악당">
<title>인천대공원 야외음악당</title>
<desc>조가비 형태의 곡면 지붕을 가진 야외 공연 무대와 부채꼴 계단식 객석, 주변 숲.</desc>
<defs>
  <linearGradient id="oamh-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe2f2"/>
    <stop offset="0.7" stop-color="#e6f2f7"/>
    <stop offset="1" stop-color="#f5f4e6"/>
  </linearGradient>
  <linearGradient id="oamh-shell" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffbf0"/>
    <stop offset="0.6" stop-color="#f0e6cd"/>
    <stop offset="1" stop-color="#dccdaa"/>
  </linearGradient>
  <radialGradient id="oamh-inner" cx="0.5" cy="0.9" r="0.85">
    <stop offset="0" stop-color="#c9b58c"/>
    <stop offset="0.6" stop-color="#a48c62"/>
    <stop offset="1" stop-color="#7d6844"/>
  </radialGradient>
  <linearGradient id="oamh-stage" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a8663c"/>
    <stop offset="1" stop-color="#7d4a29"/>
  </linearGradient>
  <linearGradient id="oamh-lawn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fbf62"/>
    <stop offset="1" stop-color="#537f3c"/>
  </linearGradient>
  <radialGradient id="oamh-tree" cx="0.36" cy="0.3" r="0.78">
    <stop offset="0" stop-color="#6fa855"/>
    <stop offset="1" stop-color="#376a32"/>
  </radialGradient>
</defs>

<!-- 하늘 -->
<rect x="0" y="0" width="900" height="330" fill="url(#oamh-sky)"/>

  <ellipse cx="182" cy="46" rx="32" ry="19"/>
  <ellipse cx="98" cy="60" rx="26" ry="12"/>

</g>

  <path d="M600,58 q7,-6 14,0 q7,-6 14,0"/>
</g>

<!-- 뒤편 숲 -->

<!-- 잔디 -->

<rect x="0" y="322" width="900" height="8" fill="#a6d47c" opacity="0.55"/>
