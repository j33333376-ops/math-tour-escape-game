<style>

  .zoo-title { font-family:'Jua','Malgun Gothic',sans-serif; }
  .zoo-cloud { animation: zoo-drift 28s ease-in-out infinite; }
  @keyframes zoo-drift { 0%,100%{transform:translateX(0);} 50%{transform:translateX(30px);} }
  .zoo-leaf { animation: zoo-sway 6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes zoo-sway { 0%,100%{transform:rotate(-1.6deg);} 50%{transform:rotate(1.6deg);} }
  .zoo-bunt { animation: zoo-bunt 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 0%; }
  @keyframes zoo-bunt { 0%,100%{transform:translateY(0);} 50%{transform:translateY(3px);} }
  .zoo-balloon { animation: zoo-bal 5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes zoo-bal { 0%,100%{transform:translate(0,0) rotate(-2deg);} 50%{transform:translate(4px,-6px) rotate(2deg);} }
  .zoo-monkey { animation: zoo-mk 3.8s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 0%; }
  @keyframes zoo-mk { 0%,100%{transform:rotate(-2deg);} 50%{transform:rotate(2deg);} }
  .zoo-meer { animation: zoo-meer 4.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes zoo-meer { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
  .zoo-tail { animation: zoo-tail 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:0% 100%; }
  @keyframes zoo-tail { 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
  .zoo-ear { animation: zoo-ear 4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes zoo-ear { 0%,100%{transform:rotate(0);} 50%{transform:rotate(-6deg);} }
</style>
</head>
