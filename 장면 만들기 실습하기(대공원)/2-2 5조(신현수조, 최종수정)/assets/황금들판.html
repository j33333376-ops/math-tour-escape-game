<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조선시대 벼농사 풍경 (Pure CSS - 무가옥 버전)</title>
  <style>
    /* 기본 여백 초기화 및 중앙 정렬 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #151617;
      font-family: 'Malgun Gothic', sans-serif;
    }

    /* 16:9 비율 컨테이너 */
    .canvas-16-9 {
      position: relative;
      width: 90vw;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      background: linear-gradient(to bottom, #ff8a65, #ffb74d, #ffe082); /* 따뜻하게 차오르는 여명 하늘 */
      border: 10px solid #2e1c0c; /* 어두운 전통 목판 프레임 */
      border-radius: 6px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* 아침 안개 및 구름 효과 */
    .fog {
      position: absolute;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 100px;
      filter: blur(12px);
    }
    .fog-1 {
      top: 20%;
      left: -5%;
      width: 40%;
      height: 8%;
    }
    .fog-2 {
      top: 30%;
      right: -5%;
      width: 50%;
      height: 10%;
    }

    /* 첩첩산중 산등성이 (동양화 느낌의 겹 레이어) */
    .mountain-layer {
      position: absolute;
      width: 120%;
      left: -10%;
      bottom: 40%;
      height: 50%;
    }
    .mountain {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
    }
    /* 제일 먼 은은한 산 */
    .mountain-far {
      background: linear-gradient(to top, #5c6858, #869681);
      clip-path: polygon(0% 100%, 15% 45%, 35% 20%, 55% 55%, 75% 30%, 90% 60%, 100% 45%, 100% 100%);
      opacity: 0.45;
    }
    /* 중간 깊이의 산 */
    .mountain-mid {
      background: linear-gradient(to top, #445240, #6d8069);
      clip-path: polygon(0% 100%, 10% 70%, 25% 40%, 45% 65%, 65% 35%, 85% 60%, 100% 50%, 100% 100%);
      opacity: 0.75;
    }
    /* 가장 가까운 어두운 산 */
    .mountain-near {
      background: linear-gradient(to top, #2e3b2b, #4b5e47);
      clip-path: polygon(0% 100%, 5% 85%, 20% 60%, 40% 45%, 60% 75%, 80% 50%, 95% 70%, 100% 65%, 100% 100%);
      opacity: 0.95;
    }

    /* 벼농사용 대규모 계단식 논 영역 */
    .rice-paddy-container {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 48%;
      z-index: 2;
    }
    /* 곡선을 그리는 황토 논둑과 논바닥 */
    .paddy-field {
      position: absolute;
      width: 130%;
      left: -15%;
      border-radius: 50% 50% 0 0 / 10% 10% 0 0;
      box-shadow: inset 0 6px 20px rgba(0,0,0,0.2);
    }
    /* 원경 논 */
    .field-3 {
      bottom: 24%;
      height: 60%;
      background: linear-gradient(to bottom, #8ea184, #6b8260);
      border-top: 5px solid #4a3424;
    }
    /* 중경 논 (물이 고여있어 은은하게 빛을 반사하는 비주얼) */
    .field-2 {
      bottom: 11%;
      height: 75%;
      background: linear-gradient(to bottom, #99c286, #7da369, #4a6b39);
      border-top: 6px solid #3d2719;
    }
    /* 전경 논 (가장 크고 또렷하게 보임) */
    .field-1 {
      bottom: -15%;
      height: 95%;
      background: linear-gradient(to bottom, #addb84, #87ba5d, #3c6e26);
      border-top: 8px solid #2e1c0c;
    }

    /* 논 사이를 가로지르는 비정형의 논둑길 */
    .clay-path {
      position: absolute;
      bottom: 0;
      left: 35%;
      width: 15%;
      height: 55%;
      background: #795548;
      clip-path: polygon(45% 0%, 55% 0%, 85% 100%, 0% 100%);
      opacity: 0.9;
      z-index: 3;
    }

    /* 벼 그래픽 요소 */
    .rice-field-overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }
    /* 한 포기의 벼 (잎줄기 3개로 디테일 향상) */
    .rice-stalk {
      position: absolute;
      width: 18px;
      height: 38px;
    }
    .rice-stalk::before,
    .rice-stalk::after,
    .rice-stalk .main-leaf {
      content: '';
      position: absolute;
      bottom: 0;
      width: 2.5px;
      background: linear-gradient(to top, #1b5e20, #a1d971);
      border-radius: 50% 50% 0 0;
      transform-origin: bottom center;
    }
    /* 좌측 잎 */
    .rice-stalk::before {
      left: 2px;
      height: 75%;
      transform: rotate(-22deg);
    }
    /* 중앙 잎 */
    .rice-stalk .main-leaf {
      left: 7.5px;
      height: 100%;
    }
    /* 우측 잎 */
    .rice-stalk::after {
      left: 13px;
      height: 85%;
      transform: rotate(18deg);
    }

    /* 벼 크기 조절 (원근 대비) */
    .r-large { transform: scale(1.5); }
    .r-medium { transform: scale(1.0); }
    .r-small { transform: scale(0.65); }

    /* 논 위의 모내기 대형 배치 (균형감 있는 격자 느낌) */
    /* 전경 (가장 앞 논) */
    .rp-1 { bottom: 6%; left: 8%; }
    .rp-2 { bottom: 3%; left: 22%; }
    .rp-3 { bottom: 5%; left: 58%; }
    .rp-4 { bottom: 2%; left: 76%; }
    .rp-5 { bottom: 7%; left: 91%; }

    /* 중경 (중간 논) */
    .rp-6 { bottom: 18%; left: 12%; }
    .rp-7 { bottom: 15%; left: 27%; }
    .rp-8 { bottom: 20%; left: 52%; }
    .rp-9 { bottom: 16%; left: 72%; }
    .rp-10 { bottom: 19%; left: 86%; }

    /* 원경 (가장 먼 논) */
    .rp-11 { bottom: 29%; left: 16%; }
    .rp-12 { bottom: 27%; left: 30%; }
    .rp-13 { bottom: 30%; left: 54%; }
    .rp-14 { bottom: 28%; left: 68%; }
    .rp-15 { bottom: 29%; left: 82%; }
  </style>
</head>
<body>

  <div class="canvas-16-9">
    <div class="fog fog-1"></div>
    <div class="fog fog-2"></div>

    <div class="mountain-layer">
      <div class="mountain mountain-far"></div>
      <div class="mountain mountain-mid"></div>
      <div class="mountain mountain-near"></div>
    </div>

    <div class="rice-paddy-container">
      <div class="paddy-field field-3"></div> <div class="clay-path"></div>           <div class="paddy-field field-2"></div> <div class="paddy-field field-1"></div> </div>

    <div class="rice-field-overlay">
      <div class="rice-stalk r-large rp-1"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-large rp-2"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-large rp-3"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-large rp-4"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-large rp-5"><div class="main-leaf"></div></div>

      <div class="rice-stalk r-medium rp-6"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-medium rp-7"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-medium rp-8"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-medium rp-9"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-medium rp-10"><div class="main-leaf"></div></div>

      <div class="rice-stalk r-small rp-11"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-small rp-12"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-small rp-13"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-small rp-14"><div class="main-leaf"></div></div>
      <div class="rice-stalk r-small rp-15"><div class="main-leaf"></div></div>
    </div>
  </div>

</body>
</html>
