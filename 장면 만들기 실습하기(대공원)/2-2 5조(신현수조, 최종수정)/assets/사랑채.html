<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한옥 사랑채 마당 (Pure SVG)</title>
  <style>
    /* 화면 중앙 정렬 및 배경 스타일 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121318;
      font-family: 'Malgun Gothic', sans-serif;
    }

    /* 16:9 고정 비율 컨테이너 */
    .canvas-container {
      position: relative;
      width: 90vw;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      border: 8px solid #2b1a08; /* 고풍스러운 한옥 목조 프레임 느낌 */
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      overflow: hidden;
      background-color: #fce4ec;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
      <defs>
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f57c00" />
          <stop offset="40%" stop-color="#ffb74d" />
          <stop offset="100%" stop-color="#ffe082" />
        </linearGradient>

        <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#556b2f" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#2d3b1e" stop-opacity="0.9"/>
        </linearGradient>

        <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#455a64" />
          <stop offset="100%" stop-color="#212121" />
        </linearGradient>

        <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#4e342e" />
          <stop offset="50%" stop-color="#6d4c41" />
          <stop offset="100%" stop-color="#3e2723" />
        </linearGradient>

        <linearGradient id="yardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#7cb342" />
          <stop offset="100%" stop-color="#4b830d" />
        </linearGradient>

        <radialGradient id="paperGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#f5f5f5" />
        </radialGradient>

        <radialGradient id="stoneGrad" cx="40%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#b0bec5" />
          <stop offset="80%" stop-color="#78909c" />
          <stop offset="100%" stop-color="#455a64" />
        </radialGradient>
      </defs>

      <rect width="1600" height="900" fill="url(#skyGrad)" />

      <path d="M0 500 Q 250 300 450 380 T 900 320 T 1350 400 T 1600 350 L 1600 650 L 0 650 Z" fill="url(#mountainGrad)" />

      <rect x="100" y="520" width="1400" height="110" fill="#757575" />
      <rect x="80" y="590" width="1440" height="40" fill="#424242" />

      <rect x="150" y="240" width="1300" height="285" fill="#fcfbe3" stroke="#3e2723" stroke-width="4" />

      <g id="window">
        <rect x="220" y="270" width="220" height="190" fill="url(#paperGrad)" stroke="#5d4037" stroke-width="8" />
        <line x1="330" y1="270" x2="330" y2="460" stroke="#5d4037" stroke-width="4" />
        <line x1="220" y1="365" x2="440" y2="365" stroke="#5d4037" stroke-width="4" />
        <line x1="275" y1="270" x2="275" y2="460" stroke="#5d4037" stroke-width="2" />
        <line x1="385" y1="270" x2="385" y2="460" stroke="#5d4037" stroke-width="2" />
        <line x1="220" y1="317" x2="440" y2="317" stroke="#5d4037" stroke-width="2" />
        <line x1="220" y1="412" x2="440" y2="412" stroke="#5d4037" stroke-width="2" />
      </g>

      <use href="#window" x="470" />

      <use href="#window" x="940" />

      <rect x="150" y="240" width="40" height="280" fill="url(#woodGrad)" />
      <rect x="450" y="240" width="45" height="280" fill="url(#woodGrad)" />
      <rect x="800" y="240" width="45" height="280" fill="url(#woodGrad)" />
      <rect x="1110" y="240" width="45" height="280" fill="url(#woodGrad)" />
      <rect x="1410" y="240" width="40" height="280" fill="url(#woodGrad)" />

      <rect x="130" y="490" width="1340" height="40" fill="url(#woodGrad)" stroke="#27120f" stroke-width="2" />
      <line x1="130" y1="500" x2="1470" y2="500" stroke="#27120f" stroke-width="1" />
      <line x1="130" y1="510" x2="1470" y2="510" stroke="#27120f" stroke-width="2" />
      <line x1="130" y1="520" x2="1470" y2="520" stroke="#27120f" stroke-width="1" />

      <path d="M120 242 L1480 242 L1450 200 L150 200 Z" fill="repeating-linear-gradient(90deg, #3e2723, #3e2723 15px, #5d4037 15px, #5d4037 30px)" />
      <path d="M60 210 Q 800 130 1540 210 L 1480 120 Q 800 60 120 120 Z" fill="url(#roofGrad)" />
      <path d="M110 125 Q 800 50 1490 125 L 1470 105 Q 800 30 130 105 Z" fill="#1b262c" />

      <path d="M0 610 L1600 610 L1600 900 L0 900 Z" fill="url(#yardGrad)" />

      <g id="stepping-stones">
        <ellipse cx="800" cy="650" rx="60" ry="25" fill="url(#stoneGrad)" transform="rotate(-5, 800, 650)" />
        <ellipse cx="730" cy="690" rx="80" ry="30" fill="url(#stoneGrad)" transform="rotate(10, 730, 690)" />
        <ellipse cx="850" cy="740" rx="100" ry="35" fill="url(#stoneGrad)" transform="rotate(-15, 850, 740)" />
        <ellipse cx="760" cy="810" rx="130" ry="45" fill="url(#stoneGrad)" transform="rotate(8, 760, 810)" />
        <ellipse cx="890" cy="880" rx="160" ry="55" fill="url(#stoneGrad)" transform="rotate(-5, 890, 880)" />
      </g>

      <path d="M720 595 L880 595 L900 620 L700 620 Z" fill="url(#stoneGrad)" stroke="#37474f" stroke-width="3" />
    </svg>
  </div>

</body>
</html>
