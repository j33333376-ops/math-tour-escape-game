<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학 개념 어드벤처 - 함수의 개념</title>
  <style>
    /* 기본 테마 및 레이아웃 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 16:9 비율 고정 컨테이너 */
    #game-container {
      position: relative;
      width: 1000px;
      height: 562.5px; /* 16:9 고정 */
      background: #222;
      border: 8px solid #3e2723;
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* 배경 레이어 */
    #background-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    #background-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* 캐릭터 레이어 */
    #characters-layer {
      position: absolute;
      bottom: 110px;
      width: 100%;
      height: 320px;
      display: flex;
      justify-content: space-between;
      padding: 0 100px;
      z-index: 2;
      pointer-events: none;
    }
    .char-wrapper {
      width: 260px;
      height: 320px;
      position: relative;
      transition: filter .25s ease, opacity .25s ease, transform .25s ease;
      transform-origin: bottom center;
    }
    .char-wrapper iframe {
      width: 260px;
      height: 320px;
      border: 0;
      pointer-events: none;
    }

    /* 대화 캐릭터 강조 스타일 */
    .active-speaker {
      filter: brightness(1.12) saturate(1.08);
      opacity: 1;
      transform: scale(1.04);
    }
    .inactive-speaker {
      filter: brightness(0.48) saturate(0.7);
      opacity: 0.72;
      transform: scale(0.96);
    }

    /* UI 레이어 (상단 HUD, 대화창, 퀴즈 영역) */
    #ui-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      padding: 15px;
      pointer-events: none;
    }

    /* 상단 HUD */
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(46, 28, 12, 0.85);
      border: 2px solid #d8b46a;
      border-radius: 8px;
      padding: 8px 16px;
      pointer-events: auto;
    }
    #hud .title {
      font-weight: bold;
      color: #ffd54f;
      font-size: 16px;
    }
    #hud .status {
      font-size: 14px;
      color: #e0e0e0;
    }

    /* 하단 대화창 */
    #dialogue-box {
      width: 100%;
      height: 110px;
      background: rgba(26, 18, 10, 0.92);
      border: 3px solid #b19457;
      border-radius: 8px;
      padding: 12px 20px;
      position: relative;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
    }
    #dialogue-box .speaker-name {
      font-weight: bold;
      color: #ffd54f;
      font-size: 16px;
      margin-bottom: 4px;
    }
    #dialogue-box .text-content {
      font-size: 14px;
      line-height: 1.5;
      color: #f5f5f5;
    }
    #dialogue-box .next-indicator {
      position: absolute;
      right: 15px;
      bottom: 10px;
      font-size: 11px;
      color: #b19457;
      animation: bounce 1s infinite alternate;
    }

    /* 중앙 메인 콘텐츠 영역 (퀴즈, 미션 등) */
    #main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* 퀴즈 카드 디자인 */
    .quiz-card {
      background: rgba(20, 15, 10, 0.95);
      border: 3px solid #d8b46a;
      border-radius: 10px;
      width: 650px;
      max-height: 290px;
      overflow-y: auto;
      padding: 16px 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.9);
      pointer-events: auto;
      animation: fadeInUp 0.4s ease-out;
    }
    .quiz-title {
      font-size: 15px;
      color: #ffd54f;
      margin-bottom: 8px;
      font-weight: bold;
      border-bottom: 1px solid #5d4037;
      padding-bottom: 5px;
    }
    .quiz-question {
      font-size: 13px;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 12px;
    }

    /* 선택지 레이아웃 (2열 우선, 반응형) */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .choice-btn {
      background: #3e2723;
      border: 1.5px solid #8d6e63;
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      transition: all 0.2s;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: break-word;
      display: flex;
      align-items: center;
    }
    .choice-btn:hover {
      background: #5d4037;
      border-color: #ffd54f;
    }
    .choice-btn .math {
      font-weight: bold;
      color: #ffeb3b;
      margin-right: 4px;
    }

    /* 결과 피드백 스타일 */
    .feedback-box {
      font-size: 13px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      text-align: center;
      margin-top: 6px;
      display: none;
    }
    .feedback-success {
      background: linear-gradient(135deg, #fffaf0, #f3e4bd); color: #3d2a17;
      border: 2px solid #b38b3d; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .35); animation: gateUnlock .55s ease-out;
    }
    .success-stage { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .answer-seal { flex: 0 0 auto; width: 54px; height: 54px; display: grid; place-items: center; border: 4px double #a51f1f; color: #a51f1f; border-radius: 10px; font-family: serif; font-size: 1.15rem; font-weight: 900; transform: rotate(-7deg); animation: sealStamp .42s cubic-bezier(.2,.9,.25,1.35); }
    .unlock-copy { text-align: left; line-height: 1.45; }
    .unlock-title { display: block; color: #8a5a12; font-size: 1rem; }
    .unlock-hint { display: block; margin-top: 3px; color: #6f5a3f; font-size: .78rem; }
    @keyframes sealStamp { from { opacity: 0; transform: scale(2.1) rotate(-14deg); } to { opacity: 1; transform: scale(1) rotate(-7deg); } }
    @keyframes gateUnlock { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .answer-seal, .feedback-success { animation: none; } }
    .feedback-failure {
      background: rgba(198, 40, 40, 0.9);
      color: #fff;
      border: 1.5px solid #e57373;
    }

    /* 체크리스트 및 최종 완료 카드 */
    .finish-card {
      background: rgba(25, 18, 12, 0.95);
      border: 4px solid #ffd54f;
      border-radius: 12px;
      width: 580px;
      padding: 20px;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .finish-title {
      font-size: 20px;
      color: #ffd54f;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .checklist {
      text-align: left;
      margin: 15px auto;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px dashed #d8b46a;
    }
    .checklist-item {
      font-size: 13px;
      margin-bottom: 8px;
      color: #e0e0e0;
      display: flex;
      align-items: center;
    }
    .checklist-item::before {
      content: "✓";
      color: #ffd54f;
      font-weight: bold;
      margin-right: 8px;
    }
    .finish-btn {
      background: linear-gradient(135deg, #ffd54f, #ffb300);
      border: none;
      border-radius: 6px;
      color: #3e2723;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(255, 213, 79, 0.4);
    }
    .finish-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(255, 213, 79, 0.6);
    }

    /* 수학 수식 공통 클래스 */
    .math-expr {
      font-family: 'Times New Roman', Times, serif;
      font-style: italic;
      color: #ffeb3b;
      padding: 0 2px;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      line-height: 1;
      padding: 0 4px;
      font-size: 0.9em;
    }
    .frac span:first-child {
      border-bottom: 1px solid #ffeb3b;
      padding-bottom: 1px;
    }
    .frac span:last-child {
      padding-top: 1px;
    }

    /* 직접 생성 대체 배경 (황금 들판 분위기) */
    .fallback-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #d88a44, #ffb300, #4e342e);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .fallback-mountains {
      width: 100%;
      height: 40%;
      background: #5d4037;
      clip-path: polygon(0 100%, 20% 30%, 40% 60%, 60% 20%, 80% 50%, 100% 10%, 100% 100%);
      opacity: 0.7;
    }
    .fallback-field {
      width: 100%;
      height: 35%;
      background: linear-gradient(to bottom, #fbc02d, #f57f17);
    }

    /* 애니메이션 효과 */
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="background-wrapper"></div>

    <div id="characters-layer">
      <div id="char-manim" class="char-wrapper"></div>
      <div id="char-dolsoe" class="char-wrapper"></div>
    </div>

    <div id="ui-layer">
      <div id="hud">
        <div class="title">수학 개념 어드벤처 ─ 제6장: 함수의 개념</div>
        <div class="status" id="hud-status">수확 진행률: 0%</div>
      </div>

      <div id="main-content">
        </div>

      <div id="dialogue-box" onclick="handleDialogueProgress()">
        <div class="speaker-name" id="speaker-name">시스템</div>
        <div class="text-content" id="text-content">로딩 중... 화면을 클릭하거나 Enter를 눌러 진행하세요.</div>
        <div class="next-indicator">▶ 클릭/Enter로 진행</div>
      </div>
    </div>
  </div>

  <script>
    // --- 에셋 파일 정보 설정 ---
    const ASSETS = {
      manim: 'assets/마님.html',
      dolsoe: 'assets/돌쇠.html',
      background: 'assets/황금들판.html'
    };

    // --- 에셋 비동기 로딩 및 예외 처리 ---
    async function loadAssets() {
      // 1. 배경 로딩
      const bgWrapper = document.getElementById('background-wrapper');
      try {
        const response = await fetch(ASSETS.background);
        if (response.ok) {
          const html = await response.text();
          bgWrapper.innerHTML = html;
        } else {
          throw new Error();
        }
      } catch (err) {
        // fetch 실패 시 iframe 대체 시도 후 1.2초 후 체크하여 실패 시 CSS 대체 배경 생성
        const iframe = document.createElement('iframe');
        iframe.src = ASSETS.background;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = '0';
        bgWrapper.appendChild(iframe);

        setTimeout(() => {
          try {
            // iframe 접근 불가 또는 로드 실패 여부 체크
            if (!iframe.contentDocument && !iframe.contentWindow) {
              throw new Error();
            }
          } catch(e) {
            bgWrapper.innerHTML = `
              <div class="fallback-bg">
                <div class="fallback-mountains"></div>
                <div class="fallback-field"></div>
              </div>
            `;
          }
        }, 1200);
      }

      // 2. 캐릭터 로딩 (마님, 돌쇠)
      loadCharacter('char-manim', ASSETS.manim);
      loadCharacter('char-dolsoe', ASSETS.dolsoe);
    }

    async function loadCharacter(wrapperId, fileName) {
      const wrapper = document.getElementById(wrapperId);
      try {
        const response = await fetch(fileName);
        if (response.ok) {
          const html = await response.text();
          wrapper.innerHTML = html;
          // 불필요한 설명 요소 숨김
          const captions = wrapper.querySelectorAll('p, small, figcaption, .caption, .description, .hint, .label');
          captions.forEach(el => el.style.display = 'none');
        } else {
          throw new Error();
        }
      } catch (err) {
        // fetch 실패 시 iframe으로 로드 처리
        wrapper.innerHTML = `<iframe src="${fileName}" scrolling="no"></iframe>`;
      }
    }

    // --- 시나리오 시퀀스 데이터 ---
    const script = [
      {
        speaker: '시스템',
        text: '지난 시간, 돌쇠는 <b>연립일차방정식</b>으로 두 수로의 개방 시간을 계산해 논에 필요한 물을 채웠습니다.'
      },
      {
        speaker: '마님',
        text: '돌쇠야! 드디어 가을 수확 철이구나. 들판 가득 익은 저 황금빛 벼들이 보이지? 해가 저물기 전에 모두 창고로 날라야 하느니라!'
      },
      {
        speaker: '돌쇠',
        text: '마님, 걱정 마세유! 수레를 이용해 벼를 안전하게 창고로 옮겨 보겠어유!'
      },
      {
        speaker: '마님',
        text: '오냐, 그런데 무작정 서두르기보다 계획이 필요하단다. 수레의 속도를 어떻게 조절하느냐에 따라 남아있는 벼의 양이 실시간으로 결정되지 않겠느냐?'
      },
      {
        speaker: '돌쇠',
        text: '수레의 속도가 정해지면 남은 벼의 양도 하나로 정해지는군유!'
      },
      {
        speaker: '마님',
        text: '그렇지! 이처럼 <b style="color:#ffd54f;">입력값 x가 정해짐에 따라 출력값 y가 오직 하나씩만 대응하는 관계</b>를 수학에서는 <b>함수</b>라 부른단다.'
      },
      {
        speaker: '돌쇠',
        text: '입력값 <span class="math-expr">x</span>가 정해지면 출력값 <span class="math-expr">y</span>가 하나로 결정되는 관계가 함수군유! 저도 구별해 보겠어유.'
      },
      {
        speaker: '마님',
        text: '좋다. 그럼 먼저 창고로 가는 거리와 속도의 관계 속에서 어떤 것이 함수 관계를 만족하는지 맞춰 보아라!'
      },
      // 퀴즈 1 (함수의 뜻 판별 및 기울기 유추)
      {
        speaker: '퀴즈1',
        text: '함수의 기본 조건과 수레의 운동에 대한 함수적 성질을 정확히 이해해 보자!'
      },
      {
        speaker: '돌쇠',
        text: '우와! 신기합니다. 입력값 하나에 결과가 딱 하나씩만 매칭되어야 함수가 되는 거군요!'
      },
      {
        speaker: '마님',
        text: '이해력이 아주 훌륭하구나! 그럼 이번에는 수레의 속도 <span class="math-expr">x</span>와 창고에 도착하는 시간 <span class="math-expr">y</span>의 수학적 변화에 대해 더 깊이 알아보자.'
      },
      {
        speaker: '돌쇠',
        text: '시간과 속도의 관계를 천천히 살펴보겠어유!'
      },
      // 퀴즈 2 (x절편, y절편 개념 문제)
      {
        speaker: '퀴즈2',
        text: '벼를 싣고 출발한 수레가 목적지에 다다를 때의 상황을 나타내는 그래프의 성질을 분석해 보자!'
      },
      {
        speaker: '마님',
        text: '정말 똑똑하구나, 돌쇠야! 그래프의 축과 만나는 지점을 이해하는 것은 함수 분석의 든든한 밑거름이지.'
      },
      {
        speaker: '돌쇠',
        text: '고마워유! 이제 남은 벼를 창고로 옮기는 마지막 문제도 풀어 보겠어유!'
      },
      // 최종 미션 (응용 문제)
      {
        speaker: '최종미션',
        text: '마지막 최종 미션! 벼를 안전하게 모두 수확하기 위한 완벽한 함수 응용 문제를 해결해라!'
      },
      {
        speaker: '마님',
        text: '대단하구나 돌쇠야! 네 덕분에 벼들이 상하기 전에 해가 지기 전 모두 창고로 안전하게 대피할 수 있게 되었단다.'
      },
      {
        speaker: '돌쇠',
        text: '함수로 두 양의 관계를 살펴보니 수확 계획을 세울 수 있었어유. 대풍년의 비책을 완성했어유!'
      },
      {
        speaker: '완료',
        text: '모든 미션을 클리어했습니다! 훌륭하게 단원을 정복한 당신을 축하합니다.'
      }
    ];

    let currentStep = 0;
    let quizActive = false;

    // --- 대화창 및 캐릭터 활성화 업데이트 ---
    function updateDialogue() {
      if (currentStep >= script.length) return;
      const data = script[currentStep];

      const speakerNameEl = document.getElementById('speaker-name');
      const textContentEl = document.getElementById('text-content');
      const dialogueBox = document.getElementById('dialogue-box');

      // 퀴즈 단계인 경우 대화창 레이아웃 숨김/축소 처리
      if (data.speaker === '퀴즈1' || data.speaker === '퀴즈2' || data.speaker === '최종미션') {
        dialogueBox.style.display = 'none';
        triggerQuiz(data.speaker);
        return;
      } else {
        dialogueBox.style.display = 'block';
      }

      speakerNameEl.innerText = data.speaker;
      textContentEl.innerHTML = data.text;

      // 스피커 강조 처리
      const manimWrapper = document.getElementById('char-manim');
      const dolsoeWrapper = document.getElementById('char-dolsoe');

      if (data.speaker === '마님') {
        manimWrapper.className = 'char-wrapper active-speaker';
        dolsoeWrapper.className = 'char-wrapper inactive-speaker';
      } else if (data.speaker === '돌쇠') {
        manimWrapper.className = 'char-wrapper inactive-speaker';
        dolsoeWrapper.className = 'char-wrapper active-speaker';
      } else {
        // 시스템이나 완료 단계 등은 둘 다 밝게 처리
        manimWrapper.className = 'char-wrapper';
        dolsoeWrapper.className = 'char-wrapper';
      }
    }

    // 대화 진행 함수
    function handleDialogueProgress() {
      if (quizActive) return; // 퀴즈 풀기 중에는 진행 불가
      currentStep++;
      if (currentStep < script.length) {
        updateDialogue();
      }
    }

    // --- 퀴즈 출제 시스템 ---
    function triggerQuiz(quizType) {
      quizActive = true;
      const mainContent = document.getElementById('main-content');
      mainContent.innerHTML = ''; // 기존 내용 청소

      const card = document.createElement('div');
      card.className = 'quiz-card';

      if (quizType === '퀴즈1') {
        card.innerHTML = `
          <div class="quiz-title">수학 퀴즈 1단계: 함수의 개념 판별과 기울기</div>
          <div class="quiz-question">
            창고까지의 거리 <span class="math-expr">y</span>(m)가 수레가 달린 시간 <span class="math-expr">x</span>(초)에 따라 변할 때, 다음 중 <b><span class="math-expr">y</span>가 <span class="math-expr">x</span>의 함수가 아닌 것</b>은 무엇일까요?
          </div>
          <div class="choices-grid">
            <button class="choice-btn" onclick="checkAnswer(this, false, 1)">
              <span class="math">①</span> 시속 5m로 <span class="math-expr">x</span>초 동안 달린 거리 <span class="math-expr">y</span>m
            </button>
            <button class="choice-btn" onclick="checkAnswer(this, false, 1)">
              <span class="math">②</span> <span class="math-expr">x</span>초 동안 달리고 남은 벼의 수확량 <span class="math-expr">y</span>개
            </button>
            <button class="choice-btn" onclick="checkAnswer(this, true, 1)">
              <span class="math">③</span> 수레 속도가 <span class="math-expr">x</span>m/s 일 때, 돌쇠의 기분 지수 <span class="math-expr">y</span>
            </button>
            <button class="choice-btn" onclick="checkAnswer(this, false, 1)">
              <span class="math">④</span> 가로가 <span class="math-expr">x</span>m, 세로가 4m인 직사각형 모양의 벼 적재함 넓이 <span class="math-expr">y</span>m²
            </button>
          </div>
          <div class="feedback-box" id="fb-1"></div>
        `;
      } else if (quizType === '퀴즈2') {
        card.innerHTML = `
          <div class="quiz-title">수학 퀴즈 2단계: x절편과 y절편 분석하기</div>
          <div class="quiz-question">
            돌쇠가 수레를 끌고 출발지에서 목적지까지 가는 거리를 나타내는 1차함수 관계식이 <span class="math-expr">y = -5x + 30</span> (단, <span class="math-expr">y</span>는 남은 거리, <span class="math-expr">x</span>는 시간)입니다. <br>
            이 식의 <b><span class="math-expr">x</span>절편</b>과 <b><span class="math-expr">y</span>절편</b>을 바르게 짝지은 것은?
          </div>
          <div class="choices-grid">
            <button class="choice-btn" onclick="checkAnswer(this, false, 2)">
              <span class="math">①</span> <span class="math-expr">x</span>절편: 30, <span class="math-expr">y</span>절편: 5
            </button>
            <button class="choice-btn" onclick="checkAnswer(this, true, 2)">
              <span class="math">②</span> <span class="math-expr">x</span>절편: 6, <span class="math-expr">y</span>절편: 30
            </button>
            <button class="choice-btn" onclick="checkAnswer(this, false, 2)">
              <span class="math">③</span> <span class="math-expr">x</span>절편: 30, <span class="math-expr">y</span>절편: 6
            </button>
            <button class="choice-btn" onclick="checkAnswer(this, false, 2)">
              <span class="math">④</span> <span class="math-expr">x</span>절편: 5, <span class="math-expr">y</span>절편: 30
            </button>
          </div>
          <div class="feedback-box" id="fb-2"></div>
        `;
      } else if (quizType === '최종미션') {
        card.innerHTML = `
          <div class="quiz-title">최종 수확 미션: 일차함수 실생활 응용</div>
          <div class="quiz-question">
            총 수확해야 할 벼의 양이 <span class="math-expr">240</span>섬입니다. 돌쇠가 한 시간 수레로 수확할 때마다 <span class="math-expr">40</span>섬의 벼가 창고에 들어옵니다. <br>
            수레질을 <span class="math-expr">x</span>시간 동안 한 후에 <b>남아있는 벼의 양 <span class="math-expr">y</span>섬</b>을 구하는 일차함수 식은?
          </div>
          <div class="choices-grid">
            <button class="choice-btn" onclick="checkAnswer(this, false, 3)">
              <span class="math">①</span> <span class="math-expr">y = 40x</span>
            </button>
            <button class="choice-btn" onclick="checkAnswer(this, false, 3)">
              <span class="math">②</span> <span class="math-expr">y = 240 + 40x</span>
            </button>
            <button class="choice-btn" onclick="checkAnswer(this, true, 3)">
              <span class="math">③</span> <span class="math-expr">y = -40x + 240</span>
            </button>
            <button class="choice-btn" onclick="checkAnswer(this, false, 3)">
              <span class="math">④</span> <span class="math-expr">y = <span class="frac"><span>240</span><span>40x</span></span></span>
            </button>
          </div>
          <div class="feedback-box" id="fb-3"></div>
        `;
      }

      mainContent.appendChild(card);
    }

    // --- 정답 판정 및 피드백 처리 ---
    function checkAnswer(btn, isCorrect, quizNum) {
      const fb = document.getElementById(`fb-${quizNum}`);
      fb.style.display = 'block';

      if (isCorrect) {
        fb.className = "feedback-box feedback-success";
        
        if (quizNum === 1) {
          fb.innerHTML = "멋진 추론이에요! 돌쇠의 변덕스러운 기분 지수는 수학적으로 하나의 출력값으로 정의되지 않으므로 함수 관계가 아닙니다!";
          document.getElementById('hud-status').innerText = "수확 진행률: 35%";
        } else if (quizNum === 2) {
          fb.innerHTML = "정답입니다! y가 0일 때 x는 6이므로 x절편은 6이고, x가 0일 때 y는 30이므로 y절편은 30입니다.";
          document.getElementById('hud-status').innerText = "수확 진행률: 70%";
        } else if (quizNum === 3) {
          fb.innerHTML = "미션 완료! 매시간 40섬씩 감소하므로 y = -40x + 240 가 완벽하게 성립합니다!";
          document.getElementById('hud-status').innerText = "수확 진행률: 100%";
        }

        const explanation = fb.innerHTML;
        fb.innerHTML = `<div class="success-stage"><span class="answer-seal">정답</span><span class="unlock-copy"><strong class="unlock-title">🔓 다음 관문 잠금 해제</strong>${explanation}<small class="unlock-hint">이 상자를 클릭해 계속하기</small></span></div>`;
        fb.onclick = () => {
          fb.onclick = null;
          document.getElementById('main-content').innerHTML = '';
          quizActive = false;
          currentStep++;
          updateDialogue();
        };

      } else {
        fb.className = "feedback-box feedback-failure";
        fb.innerHTML = "아쉽습니다.<br>다시 한번 생각해보세요.";
        fb.onclick = null;
      }
    }

    // --- 최종 단원 정리 및 피드백 체크리스트 화면 ---
    function triggerChecklist() {
      const mainContent = document.getElementById('main-content');
      mainContent.innerHTML = '';

      const finishCard = document.createElement('div');
      finishCard.className = 'finish-card';
      finishCard.innerHTML = `
        <div class="finish-title">🎉 함수의 개념 단원 클리어!</div>
        <div class="checklist">
          <div class="checklist-item">함수의 올바른 뜻과 입력-출력 관계 이해</div>
          <div class="checklist-item">일차함수의 기울기 및 성질 파악</div>
          <div class="checklist-item">x절편, y절편의 뜻과 그래프 해석</div>
          <div class="checklist-item">실생활 문제를 연계한 일차함수 설계</div>
        </div>
        <button class="finish-btn" onclick="goToEnding()">최종 엔딩으로 이동</button>
      `;
      mainContent.appendChild(finishCard);
    }

    function goToEnding() {
      window.location.href = "ending.html";
    }

    // 대화 진행 중 체크리스트 트리거 관리
    function handleDialogueProgress() {
      if (quizActive) return;
      currentStep++;
      if (currentStep < script.length) {
        if (script[currentStep].speaker === '완료') {
          document.getElementById('dialogue-box').style.display = 'none';
          triggerChecklist();
        } else {
          updateDialogue();
        }
      }
    }

    // --- 키보드 작동 규칙 (Enter로 대화 넘기기) ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const dialogueBox = document.getElementById('dialogue-box');
        // 대화창이 보이고 비활성화 상태가 아닐 때 동작
        if (dialogueBox.style.display !== 'none' && !quizActive) {
          handleDialogueProgress();
        }
      }
    });

    // 앱 초기화 실행
    window.onload = () => {
      loadAssets();
      updateDialogue();
    };
  </script>
</body>
</html>
