<meta charset="UTF-8">

<title>인천대공원 원형 분수대</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;}
  .fx-svg{display:block;width:100%;height:auto;}
  .sflow{fill:none;stroke:#ffffff;stroke-width:2.1;stroke-linecap:round;
         stroke-dasharray:2.5 12;opacity:0.9;animation:fx-flow .7s linear infinite;}
  @keyframes fx-flow{ to{ stroke-dashoffset:-145; } }
  .ripple{fill:none;stroke:#ffffff;stroke-width:2;opacity:0;
          transform-box:fill-box;transform-origin:center;animation:fx-ripple 3s ease-out infinite;}
  @keyframes fx-ripple{ 0%{transform:scale(.24);opacity:0} 16%{opacity:.5} 100%{transform:scale(1);opacity:0} }
  .drop{fill:#eaf7fb;transform-box:fill-box;animation-name:fx-drop;animation-timing-function:cubic-bezier(.4,0,.9,.5);animation-iteration-count:infinite;}
  @keyframes fx-drop{ 0%{opacity:0;transform:translateY(0)} 14%{opacity:.9} 100%{opacity:0;transform:translateY(var(--fall))} }
  .mist{transform-box:fill-box;transform-origin:center;animation:fx-mist 2.6s ease-in-out infinite;}
  @keyframes fx-mist{ 0%,100%{opacity:.32;transform:scale(1)} 50%{opacity:.55;transform:scale(1.1)} }
  .boil{transform-box:fill-box;transform-origin:center;animation:fx-boil 1.4s ease-in-out infinite;}
  @keyframes fx-boil{ 0%,100%{opacity:.5;transform:scale(.9)} 50%{opacity:.85;transform:scale(1.15)} }
  .shimmer{animation:fx-shim 4s ease-in-out infinite;}
  @keyframes fx-shim{ 0%,100%{opacity:.25;transform:translateX(-10px)} 50%{opacity:.5;transform:translateX(10px)} }
</style>

  <linearGradient id="fx-stonewall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b8b2a6"/><stop offset="1" stop-color="#8f887c"/>

  <radialGradient id="fx-water" cx="0.5" cy="0.4" r="0.75">
    <stop offset="0" stop-color="#bfe8f2"/><stop offset="0.6" stop-color="#7ec9e0"/><stop offset="1" stop-color="#49a6c9"/>

  <linearGradient id="fx-dome" x1="0" y1="0" x2="0" y2="1">

    <stop offset="0.55" stop-color="#eaf7fb" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#d6f0f7" stop-opacity="0.62"/>
  </linearGradient>
  <filter id="fx-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="fx-blur2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="fx-waterclip"><ellipse cx="450" cy="431" rx="249" ry="60"/></clipPath>
