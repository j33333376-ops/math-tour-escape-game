<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .scg-svg { display:block; width:100%; height:auto; }
  .scg-title { font-family:'Jua','Malgun Gothic',sans-serif; }
  .scg-cloud { animation: scg-drift 40s ease-in-out infinite; }
  .scg-cloud2 { animation: scg-drift 52s ease-in-out infinite reverse; }
  @keyframes scg-drift { 0%,100%{transform:translateX(0);} 50%{transform:translateX(34px);} }
  .scg-leaf { animation: scg-sway 6.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  .scg-leaf2 { animation: scg-sway 7.6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes scg-sway { 0%,100%{transform:rotate(-1.3deg);} 50%{transform:rotate(1.3deg);} }
  .scg-glint { animation: scg-glint 4.5s ease-in-out infinite; }
  @keyframes scg-glint { 0%,100%{opacity:.15;} 50%{opacity:.9;} }
  .scg-spin { animation: scg-spin 46s linear infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes scg-spin { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }
  .scg-flit { animation: scg-flit 11s linear infinite; }
  @keyframes scg-flit { 0%{transform:translate(0,0);opacity:0;} 8%{opacity:.9;} 92%{opacity:.9;} 100%{transform:translate(180px,-46px);opacity:0;} }
  .scg-wing { animation: scg-wing .28s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:0% 50%; }
  @keyframes scg-wing { 0%{transform:rotateY(0) scaleX(1);} 100%{transform:scaleX(.5);} }
  .scg-bird { animation: scg-bird 15s linear infinite; }
  @keyframes scg-bird { 0%{transform:translate(0,0);opacity:0;} 12%{opacity:.5;} 88%{opacity:.5;} 100%{transform:translate(260px,-24px);opacity:0;} }
</style>
</head>
<body>
<svg class="scg-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천대공원 조각원">
<title>인천대공원 조각원</title>
<desc>잘 가꾼 잔디정원 위에 스테인리스 원형 조각, 거울 구체, 구멍 뚫린 화강암 추상 조각, 청동 인물상, 붉은 강철 기하 조각 등 다양한 조형물이 전시된 인천대공원 조각원.</desc>

  </linearGradient>
  <linearGradient id="scg-granite" x1="0.1" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#cfccc3"/><stop offset="0.5" stop-color="#9a958a"/><stop offset="1" stop-color="#635e54"/>
  </linearGradient>
  <linearGradient id="scg-red" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#ec6248"/><stop offset="0.5" stop-color="#cf3a26"/><stop offset="1" stop-color="#9a2015"/>
  </linearGradient>
  <linearGradient id="scg-red2" x1="0" y1="0" x2="0" y2="1">

  </linearGradient>

  </pattern>
  <filter id="scg-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="scg-soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
