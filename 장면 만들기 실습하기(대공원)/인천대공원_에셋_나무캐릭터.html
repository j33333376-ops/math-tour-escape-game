<svg class="stp-svg" viewBox="0 0 558 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="나무 그루터기 캐릭터">
<title>나무 그루터기 캐릭터</title>
<desc>머리 위에 새싹이 돋고 두 개의 나뭇가지 팔을 벌린, 눈과 옹이 입이 있는 귀여운 나무 그루터기 캐릭터.</desc>

<defs>

    <stop offset="0" stop-color="#9a6230"/>
    <stop offset="0.28" stop-color="#c08a4e"/>
    <stop offset="0.52" stop-color="#d0a066"/>
    <stop offset="0.78" stop-color="#b3793f"/>
    <stop offset="1" stop-color="#875528"/>
  </linearGradient>
  <radialGradient id="stp-top" cx="0.48" cy="0.4" r="0.72">
    <stop offset="0" stop-color="#eed69f"/>
    <stop offset="0.6" stop-color="#d3ac6d"/>
    <stop offset="1" stop-color="#b98f50"/>
  </radialGradient>
  <linearGradient id="stp-arm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c08a4e"/>
    <stop offset="0.5" stop-color="#b17b3f"/>
    <stop offset="1" stop-color="#8a5a2e"/>
  </linearGradient>
  <radialGradient id="stp-cut" cx="0.5" cy="0.5" r="0.6">
    <stop offset="0" stop-color="#ecd39c"/>
    <stop offset="1" stop-color="#c39a5b"/>
  </radialGradient>
  <linearGradient id="stp-leaf" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#77d23e"/>
    <stop offset="0.6" stop-color="#54b528"/>
    <stop offset="1" stop-color="#3c9a1e"/>
  </linearGradient>
  <radialGradient id="stp-knob" cx="0.4" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#c89a63"/>
    <stop offset="1" stop-color="#96612f"/>
  </radialGradient>
  <clipPath id="stp-bodyclip">
    <path d="M186,196 C186,212 232,225 283,225 C334,225 380,212 380,196
             C381,260 385,340 386,410 C387,470 391,512 392,542
             C395,566 386,582 371,587 C354,593 340,582 325,589
             C309,596 296,586 282,591 C267,596 252,585 237,589
             C221,595 206,587 191,583 C176,577 171,562 175,540
             C178,510 180,470 180,410 C181,340 183,260 186,196 Z"/>

</defs>
