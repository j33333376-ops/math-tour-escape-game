<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>슬라이딩 퍼즐</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      align-items: center;
      justify-content: center;
    }

    /* 퀴즈 카드 */
    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      width: 100%;
      max-width: 440px;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    /* 상태 표시줄 */
    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .col-badge {
      background: var(--primary);
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .btn-check {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-ctrl);
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-check:hover { background: var(--primary-dark); }
    .btn-check:active { transform: translateY(1px); }

    /* 게임 보드: 4x4 그리드 */
    #game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2%;
      background-color: #f1f5f9;
      border: 4px solid var(--border-color);
      border-radius: 12px;
      padding: 2%;
      user-select: none;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .tile {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.2rem, 5vw, 2rem);
      font-weight: 800;
      border-radius: 8px;
      transition: transform 0.15s ease-in-out, background-color 0.15s ease;
    }

    .number-tile {
      background-color: var(--card-bg);
      color: var(--primary);
      border: 1px solid var(--border-color);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }

    @media (hover: hover) {
      .number-tile:hover {
        transform: scale(1.05);
        background-color: var(--primary-soft);
      }
    }

    .number-tile:active { transform: scale(0.95); }

    .empty-tile {
      opacity: 0;
      pointer-events: none;
    }

    /* 결과 메시지 */
    .feedback {
      margin-top: 12px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
      color: var(--success);
    }
    .feedback .sub {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .hidden { display: none; }

    @media (orientation: landscape) and (max-height: 620px) {
      .panel-side { padding: 14px; max-width: 62vh; }
      .header-block p { display: none; }
      .header-block h2 { font-size: 1.2rem; }
      .control-header { margin-bottom: 8px; }
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }


    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* ===== 반응형 안전장치 ===== */
    /* 정사각 보드가 세로를 넘지 않게 (가로/세로 공통) */
    #game-board { width: min(100%, 56vh); margin-left: auto; margin-right: auto; }

    @media (orientation: portrait) {
      .panel-side { max-width: min(440px, 94vw); }
      #game-board { width: min(100%, 54vh); }
    }
    @media (orientation: landscape) and (max-height: 620px) {
      #game-board { width: min(100%, 52vh); }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>슬라이딩 퍼즐</h2>
        <p>타일을 클릭해 1부터 15까지 순서대로 맞추세요!</p>
      </div>

      <div class="control-header">
        <span class="col-badge" id="move-counter">이동 0회</span>
        <button class="btn-check" id="shuffle-button">🔄 다시 섞기</button>
      </div>

      <div id="game-board"></div>

      <div class="feedback hidden" id="message-box"></div>
    </div>
  </div>

  <script>
        // ---------------------------------------------------
        // [슬라이딩 퍼즐 게임 로직]
        // ---------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            
            const gridSize = 4;
            const gameBoard = document.getElementById('game-board');
            const shuffleButton = document.getElementById('shuffle-button');
            const moveCounter = document.getElementById('move-counter');
            const messageBox = document.getElementById('message-box');

            let board = [];
            let emptyIndex = -1;
            let moveCount = 0;
            let isGameWon = false;

            /**
             * 게임 보드를 초기화합니다. (1~15 숫자와 빈 칸(0) 생성)
             */
            function createBoard() {
                board = [];
                for (let i = 1; i < gridSize * gridSize; i++) {
                    board.push(i);
                }
                board.push(0); // 0은 빈 타일
                emptyIndex = gridSize * gridSize - 1;
                isGameWon = false;
            }

            /**
             * 보드를 섞습니다. (반드시 풀 수 있는 상태로 무작위 이동 수행)
             */
            function shuffleBoard() {
                createBoard(); // 정렬된 상태에서 시작
                
                for (let i = 0; i < 200; i++) {
                    const validMoves = getValidMoves(emptyIndex);
                    const randomMoveIndex = validMoves[Math.floor(Math.random() * validMoves.length)];
                    swapTiles(emptyIndex, randomMoveIndex);
                    emptyIndex = randomMoveIndex;
                }
                
                moveCount = 0;
                updateMoveCounter();
                
                // UI 초기화
                messageBox.classList.add('hidden');
                messageBox.innerHTML = '';
            }

            /**
             * 화면 렌더링
             */
            function renderBoard() {
                gameBoard.innerHTML = ''; 
                
                board.forEach((value, index) => {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.index = index;

                    if (value === 0) {
                        tile.classList.add('empty-tile');
                    } else {
                        tile.classList.add('number-tile');
                        tile.textContent = value;
                    }
                    
                    gameBoard.appendChild(tile);
                });
            }

            /**
             * 타일 클릭 이벤트 처리
             */
            function handleTileClick(e) {
                if (isGameWon) return; 

                const clickedTile = e.target.closest('.number-tile');
                if (!clickedTile) return;

                const clickedIndex = parseInt(clickedTile.dataset.index);

                if (isAdjacent(clickedIndex, emptyIndex)) {
                    swapTiles(clickedIndex, emptyIndex);
                    emptyIndex = clickedIndex;
                    moveCount++;
                    updateMoveCounter();
                    renderBoard();
                    checkWin();
                }
            }

            /**
             * 승리 조건 확인 (1~15 순서 맞는지)
             */
            function checkWin() {
                for (let i = 0; i < board.length - 1; i++) {
                    if (board[i] !== i + 1) {
                        return; // 하나라도 틀리면 리턴
                    }
                }
                
                // 성공 처리
                isGameWon = true;
                messageBox.innerHTML = `✅ 자물쇠가 풀렸습니다!<span class="sub">${moveCount}번 만에 성공</span>`;
                messageBox.classList.remove('hidden');
                
                // 빈 칸 채워주기 (시각적 완료 효과)
                const empty = gameBoard.querySelector('.empty-tile');
                if(empty) {
                    empty.style.opacity = '1';
                    empty.style.backgroundColor = '#d1fae5';
                    empty.textContent = '🔓';
                }
            }

            /**
             * 두 타일이 상하좌우로 인접해 있는지 확인
             */
            function isAdjacent(idx1, idx2) {
                const r1 = Math.floor(idx1 / gridSize);
                const c1 = idx1 % gridSize;
                const r2 = Math.floor(idx2 / gridSize);
                const c2 = idx2 % gridSize;

                const isHorizontal = (r1 === r2) && (Math.abs(c1 - c2) === 1);
                const isVertical = (c1 === c2) && (Math.abs(r1 - r2) === 1);

                return isHorizontal || isVertical;
            }

            /**
             * 타일 스왑 로직
             */
            function swapTiles(idx1, idx2) {
                [board[idx1], board[idx2]] = [board[idx2], board[idx1]];
            }

            /**
             * 이동 가능한 타일 인덱스 반환
             */
            function getValidMoves(emptyIdx) {
                const moves = [];
                const r = Math.floor(emptyIdx / gridSize);
                const c = emptyIdx % gridSize;

                if (r > 0) moves.push(emptyIdx - gridSize); // 위
                if (r < gridSize - 1) moves.push(emptyIdx + gridSize); // 아래
                if (c > 0) moves.push(emptyIdx - 1); // 왼쪽
                if (c < gridSize - 1) moves.push(emptyIdx + 1); // 오른쪽

                return moves;
            }

            /**
             * 이동 횟수 업데이트
             */
            function updateMoveCounter() {
                moveCounter.textContent = `이동 ${moveCount}회`;
            }

            // 이벤트 바인딩
            gameBoard.addEventListener('click', handleTileClick);
            shuffleButton.addEventListener('click', () => {
                shuffleBoard();
                renderBoard();
            });

            // 게임 시작
            shuffleBoard();
            renderBoard();
        });
    </script>
</body>
</html>
