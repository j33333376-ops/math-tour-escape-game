<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>24 게임 (사칙연산)</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      width: 38vw;
      max-width: 440px;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .control-group {
      background: var(--primary-soft);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .control-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .col-badge {
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .col-badge.accent { background: var(--accent); }
    .col-badge.muted  { background: #94a3b8; }

    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; }

    .stat-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-row { display: flex; gap: 8px; }

    .btn-check, .btn-ghost {
      border-radius: var(--radius-ctrl);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex: 1;
    }
    .btn-check { background: var(--primary); color: #fff; border: none; }
    .btn-check:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-check:active:not(:disabled) { transform: translateY(1px); }
    .btn-ghost { background: var(--card-bg); color: var(--primary-dark); border: 1px solid var(--border-color); }
    .btn-ghost:hover:not(:disabled) { background: var(--primary-soft); }
    .btn-ghost:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .answer-group { padding-top: 16px; border-top: 2px dashed var(--border-color); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
      word-break: keep-all;
      line-height: 1.45;
    }
    .feedback.success { color: var(--success); }
    .feedback.error   { color: var(--error); }
    .feedback.info    { color: var(--text-muted); }

    .board-side {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 10px;
    }

    .board-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    @media (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding-top: 2vh; gap: 12px; }
      .panel-side { width: 96vw; max-width: none; padding: 16px; }
      .board-side { width: 96vw; flex: 1; padding: 0 0 2vh 0; }
      .header-block p { margin-bottom: 12px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.2rem; }
      .header-block p { display: none; }
      .control-group { padding: 8px 12px; margin-bottom: 10px; }
      .stat-row { margin-bottom: 8px; }
    }

    /* ===== 24 게임 전용 ===== */
    .board-wrapper { width: 100%; height: 100%; padding: 20px; flex-direction: column; gap: 18px; }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .card {
      width: clamp(74px, 16vmin, 118px);
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      border: 3px solid var(--border-color);
      background: var(--card-bg);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s;
      user-select: none;
      padding: 6px;
    }
    .card .val {
      font-size: clamp(1.5rem, 5vmin, 2.6rem);
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
    }
    .card .expr {
      margin-top: 6px;
      font-size: clamp(0.55rem, 1.5vmin, 0.72rem);
      color: var(--text-muted);
      font-weight: 600;
      text-align: center;
      word-break: break-all;
      line-height: 1.2;
    }
    .card:hover { border-color: var(--primary); transform: translateY(-3px); }
    .card.a { border-color: var(--primary); background: var(--primary-soft); }
    .card.b { border-color: var(--accent); background: var(--accent-soft); }
    .card.a .val { color: var(--primary-dark); }
    .card.b .val { color: var(--accent); }
    .card.win  { border-color: var(--success); background: #dcfce7; }
    .card.win .val { color: #047857; }

    .ops { display: flex; gap: 10px; justify-content: center; }
    .op {
      width: clamp(46px, 9vmin, 62px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: clamp(1.1rem, 3.4vmin, 1.6rem);
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .op:hover:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); }
    .op.active { background: var(--primary); color: #fff; border-color: var(--primary-dark); }

    .goal {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }
    .goal b { color: var(--accent); font-size: 1.15rem; }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    @media (orientation: portrait) {
      .panel-side { max-height: 54%; flex: 0 0 auto; }
      .board-side { flex: 1 1 auto; }
    }

    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>24 게임</h2>
        <p>카드 두 장과 연산 기호를 골라 계산하세요.<br>네 수를 모두 써서 <b>24</b>를 만들면 성공!</p>
      </div>

      <div class="control-group">
        <div class="control-header">
          <label>사용 방법</label>
        </div>
        <div style="font-size:0.82rem; color:var(--text-muted); line-height:1.6; word-break:keep-all">
          ① 첫 번째 카드 클릭 → ② 연산 기호(+ − × ÷) 클릭 → ③ 두 번째 카드 클릭<br>
          두 카드가 계산 결과 한 장으로 합쳐집니다. 나눗셈은 분수도 허용돼요.
        </div>
      </div>

      <div class="stat-row">
        <span class="col-badge muted" id="cardBadge">남은 카드 4</span>
        <span class="col-badge accent" id="stepBadge">계산 0회</span>
      </div>

      <div class="btn-row">
        <button class="btn-ghost" id="undoBtn">↶ 되돌리기</button>
        <button class="btn-ghost" id="answerBtn">🔍 정답 보기</button>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn-ghost" id="againBtn">↺ 처음부터</button>
        <button class="btn-check" id="newBtn">🔄 새 문제</button>
      </div>

      <div class="answer-group" style="margin-top:16px">
        <div class="feedback info" id="feedback">첫 번째 카드를 클릭하세요.</div>
      </div>
    </div>

    <div class="board-side">
      <div class="board-wrapper">
        <div class="goal">목표: <b>24</b></div>
        <div class="cards" id="cards"></div>
        <div class="ops" id="ops">
          <button class="op" data-op="+">+</button>
          <button class="op" data-op="-">−</button>
          <button class="op" data-op="*">×</button>
          <button class="op" data-op="/">÷</button>
        </div>
      </div>
    </div>
  </div>

  <script>

    // ==========================================================
    //  24 게임 — 네 수를 사칙연산으로 조합해 24 만들기
    //  중간 결과는 분수(유리수)로 정확히 계산한다. (0.1+0.2 문제 회피)
    // ==========================================================
    const TARGET = 24;

    const cardsEl  = document.getElementById('cards');
    const opsEl    = document.getElementById('ops');
    const cardBadge = document.getElementById('cardBadge');
    const stepBadge = document.getElementById('stepBadge');
    const undoBtn   = document.getElementById('undoBtn');
    const answerBtn = document.getElementById('answerBtn');
    const againBtn  = document.getElementById('againBtn');
    const newBtn    = document.getElementById('newBtn');
    const feedback  = document.getElementById('feedback');

    // ---------- 유리수 ----------
    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
    function fr(n, d) {
      if (d < 0) { n = -n; d = -d; }
      const g = gcd(n, d);
      return { n: n / g, d: d / g };
    }
    const add = (x, y) => fr(x.n * y.d + y.n * x.d, x.d * y.d);
    const sub = (x, y) => fr(x.n * y.d - y.n * x.d, x.d * y.d);
    const mul = (x, y) => fr(x.n * y.n, x.d * y.d);
    const div = (x, y) => (y.n === 0 ? null : fr(x.n * y.d, x.d * y.n));
    const isInt = (x) => x.d === 1;
    const eq24  = (x) => x.d === 1 && x.n === TARGET;
    function frText(x) { return x.d === 1 ? String(x.n) : (x.n + '/' + x.d); }

    const OPS = {
      '+': { fn: add, sym: '+' },
      '-': { fn: sub, sym: '−' },
      '*': { fn: mul, sym: '×' },
      '/': { fn: div, sym: '÷' }
    };

    // ---------- 해 탐색 ----------
    function solve(items) {
      if (items.length === 1) return eq24(items[0].v) ? items[0].e : null;
      for (let i = 0; i < items.length; i++) {
        for (let j = 0; j < items.length; j++) {
          if (i === j) continue;
          const rest = items.filter((_, k) => k !== i && k !== j);
          for (const key of Object.keys(OPS)) {
            // 뺄셈/나눗셈은 순서가 중요하므로 (i,j) 순서쌍 전체를 훑는다
            if ((key === '+' || key === '*') && i > j) continue;
            const v = OPS[key].fn(items[i].v, items[j].v);
            if (!v) continue;
            const e = '(' + items[i].e + ' ' + OPS[key].sym + ' ' + items[j].e + ')';
            const r = solve([...rest, { v, e }]);
            if (r) return r;
          }
        }
      }
      return null;
    }

    function solvable(nums) {
      return solve(nums.map(n => ({ v: fr(n, 1), e: String(n) })));
    }

    // ---------- 상태 ----------
    let base = [];        // 원래 뽑힌 네 수
    let cards = [];       // { id, v:{n,d}, e }
    let pickA = null, pickOp = null;
    let steps = 0;
    let history = [];
    let solved = false;
    let nextId = 0;

    function setFeedback(t, k) {
      feedback.textContent = t;
      feedback.className = 'feedback ' + k;
    }

    function newPuzzle() {
      let tries = 0;
      do {
        base = Array.from({ length: 4 }, () => 1 + Math.floor(Math.random() * 9));
        tries++;
      } while (!solvable(base) && tries < 500);
      restart();
    }

    function restart() {
      nextId = 0;
      cards = base.map(n => ({ id: nextId++, v: fr(n, 1), e: String(n) }));
      pickA = null; pickOp = null;
      steps = 0;
      history = [];
      solved = false;
      setFeedback('첫 번째 카드를 클릭하세요.', 'info');
      render();
    }

    function snapshot() {
      history.push({ cards: cards.map(c => ({ ...c, v: { ...c.v } })), steps });
    }

    function render() {
      cardsEl.innerHTML = '';
      cards.forEach(c => {
        const d = document.createElement('div');
        d.className = 'card';
        if (pickA === c.id) d.classList.add('a');
        if (solved) d.classList.add('win');
        d.dataset.id = c.id;
        const showExpr = c.e !== frText(c.v);
        d.innerHTML = '<div class="val">' + frText(c.v) + '</div>' +
                      (showExpr ? '<div class="expr">' + c.e + '</div>' : '');
        cardsEl.appendChild(d);
      });

      [...opsEl.children].forEach(b => {
        b.classList.toggle('active', pickOp === b.dataset.op);
        b.disabled = solved || pickA === null;
      });

      cardBadge.textContent = '남은 카드 ' + cards.length;
      stepBadge.textContent = '계산 ' + steps + '회';
      undoBtn.disabled = history.length === 0;
    }

    cardsEl.addEventListener('click', (e) => {
      if (solved) return;
      const el = e.target.closest('.card');
      if (!el) return;
      const id = parseInt(el.dataset.id, 10);

      if (pickA === null) {
        pickA = id;
        setFeedback('연산 기호를 고르세요.', 'info');
        render();
        return;
      }
      if (pickA === id) {         // 같은 카드 다시 클릭 -> 선택 해제
        pickA = null; pickOp = null;
        setFeedback('선택을 취소했습니다.', 'info');
        render();
        return;
      }
      if (pickOp === null) {
        setFeedback('먼저 연산 기호를 고르세요.', 'info');
        return;
      }

      const a = cards.find(c => c.id === pickA);
      const b = cards.find(c => c.id === id);
      const v = OPS[pickOp].fn(a.v, b.v);

      if (!v) {
        setFeedback('❌ 0으로 나눌 수 없습니다.', 'error');
        pickOp = null;
        render();
        return;
      }

      snapshot();
      const e2 = '(' + a.e + ' ' + OPS[pickOp].sym + ' ' + b.e + ')';
      cards = cards.filter(c => c.id !== a.id && c.id !== b.id);
      cards.push({ id: nextId++, v, e: e2 });
      steps++;
      pickA = null; pickOp = null;

      if (cards.length === 1) {
        if (eq24(cards[0].v)) {
          solved = true;
          render();
          setFeedback('🎉 24를 만들었습니다!  ' + cards[0].e.slice(1, -1) + ' = 24', 'success');
          return;
        }
        setFeedback('결과가 ' + frText(cards[0].v) + ' 입니다. 24가 아니에요 — 되돌리기로 다시!', 'error');
        render();
        return;
      }

      setFeedback('계산 결과: ' + frText(v) + '. 계속하세요.', 'info');
      render();
    });

    opsEl.addEventListener('click', (e) => {
      const b = e.target.closest('.op');
      if (!b || b.disabled || solved) return;
      pickOp = (pickOp === b.dataset.op) ? null : b.dataset.op;
      if (pickOp) setFeedback('두 번째 카드를 클릭하세요.', 'info');
      render();
    });

    undoBtn.addEventListener('click', () => {
      if (history.length === 0) return;
      const prev = history.pop();
      cards = prev.cards;
      steps = prev.steps;
      pickA = null; pickOp = null;
      solved = false;
      setFeedback('되돌렸습니다.', 'info');
      render();
    });

    answerBtn.addEventListener('click', () => {
      const sol = solvable(base);
      if (sol) setFeedback('정답 예시: ' + sol.slice(1, -1) + ' = 24', 'info');
      else setFeedback('이 문제는 해가 없습니다. 새 문제를 뽑아주세요.', 'error');
    });

    againBtn.addEventListener('click', restart);
    newBtn.addEventListener('click', newPuzzle);

    newPuzzle();

  </script>
</body>
</html>
