<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>카이사르 암호</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
      /* ===== 이 퀴즈 전용 매핑 ===== */
      --outer-color: var(--primary);  /* 평문 */
      --inner-color: var(--accent);   /* 암호문 */
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* 스크롤 절대 방지 및 뷰포트 고정 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    /* 메인 앱 레이아웃 컨테이너 */
    .app-layout {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 2vh 2vw;
      box-sizing: border-box;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    /* 정보 및 입력/출력 제어 패널 */
    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      overflow: hidden;
      justify-content: center;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: center;
      color: var(--text-main);
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--outer-color);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-ctrl);
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .result-group {
      background: var(--accent-soft);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .result-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--inner-color);
      margin-bottom: 4px;
    }

    .result-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--inner-color);
      letter-spacing: 1px;
      min-height: 32px;
      word-break: break-all;
    }

    .badge-container {
      text-align: center;
      margin-top: 12px;
    }

    .info-badge {
      display: inline-block;
      padding: 4px 12px;
      background: var(--primary);
      color: #ffffff;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* 암호판 배치 영역 */
    .wheel-side {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* vmin 단위를 활용하여 가로/세로 어떤 모드에서도 화면을 벗어나지 않게 스케일링 */
    .wheel-box {
      position: relative;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .clickable-inner {
      cursor: grab;
    }
    .clickable-inner:active {
      cursor: grabbing;
    }

    /* ==========================================================================
       반응형 미디어 쿼리: 스크롤 없는 최적화 레이아웃 분기
       ========================================================================== */

    /* 1. 세로 모드 (스마트폰 세로, 태블릿 세로) */
    @media (orientation: portrait) {
      .app-layout {
        flex-direction: column;
        justify-content: space-evenly;
      }
      .panel-side {
        width: 92vw;
        max-height: 42vh;
        padding: 16px;
      }
      .wheel-side {
        width: 100%;
        height: 50vh;
      }
      .wheel-box {
        width: 72vmin;
        height: 72vmin;
      }
      .header-block p { margin-bottom: 12px; }
    }

    /* 2. 가로 모드 (노트북, 데스크톱, 스마트폰/태블릿 가로) */
    @media (orientation: landscape) {
      .app-layout {
        flex-direction: row;
        justify-content: center;
      }
      .panel-side {
        width: 38vw;
        max-width: 420px;
        height: 85vh;
        padding: 24px;
      }
      .wheel-side {
        width: 55vw;
        height: 90vh;
      }
      .wheel-box {
        width: 78vmin;
        height: 78vmin;
      }
    }

    /* 3. 초소형 화면이나 스마트폰 가로모드 등 높이가 극단적으로 낮은 경우의 컴팩트 예외 처리 */
    @media (orientation: landscape) and (max-height: 480px) {
      .panel-side {
        height: 92vh;
        padding: 10px;
      }
      .header-block h2 { font-size: 1.1rem; }
      .header-block p { display: none; } /* 설명 생략하여 공간 확보 */
      .input-group { margin-bottom: 8px; }
      .input-group input { padding: 6px 10px; font-size: 0.9rem; }
      .result-group { padding: 8px; }
      .result-text { font-size: 1.1rem; min-height: 24px; }
      .badge-container { margin-top: 4px; }
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }


    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <!-- 정보 및 데이터 입출력부 -->
    <div class="panel-side">
      <div class="header-block">
        <h2>카이사르 암호</h2>
        <p>안쪽 주황색 원판을 회전시키면 입력한 문장이 실시간으로 암호화 구역에 렌더링됩니다.</p>
      </div>

      <div class="input-group">
        <label for="plainInput">▼ 원본 평문 입력 (영어 알파벳)</label>
        <input type="text" id="plainInput" value="HELLO WORLD" placeholder="변환할 단어를 입력하세요..." autocomplete="off">
      </div>

      <div class="result-group">
        <div class="result-label">▲ 실시간 카이사르 암호문</div>
        <div class="result-text" id="encryptedOutput">-</div>
      </div>
      
      <div class="badge-container">
        <div class="info-badge" id="shiftBadge">이동 칸 수 (Key): 0칸</div>
      </div>
    </div>

    <!-- 인터랙티브 그래픽 암호판 -->
    <div class="wheel-side">
      <div class="wheel-box">
        <svg id="cipherSvg" viewBox="0 0 400 400">
          <defs>
            <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08"/>
            </filter>
          </defs>

          <!-- 바깥쪽 원판 (평문 원형 판 - 고정 고해상도 그래픽) -->
          <g id="outerWheel" filter="url(#subtleShadow)">
            <circle cx="200" cy="200" r="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
            <circle cx="200" cy="200" r="138" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
            <g id="outerGridLines"></g>
            <g id="outerLetters"></g>
          </g>

          <!-- 안쪽 원판 (암호문 원형 판 - 드래그/터치 회전 가능) -->
          <g id="innerWheel" class="clickable-inner" filter="url(#subtleShadow)">
            <circle cx="200" cy="200" r="138" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
            <circle cx="200" cy="200" r="95" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
            <g id="innerGridLines"></g>
            <g id="innerLetters"></g>
            <!-- 중심 축 디자인 마감 -->
            <circle cx="200" cy="200" r="12" fill="#ea580c"/>
            <circle cx="200" cy="200" r="4" fill="#ffffff"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const totalSectors = 26;
    const anglePerSector = 360 / totalSectors;

    const outerGridLines = document.getElementById('outerGridLines');
    const outerLetters = document.getElementById('outerLetters');
    const innerGridLines = document.getElementById('innerGridLines');
    const innerLetters = document.getElementById('innerLetters');
    const innerWheel = document.getElementById('innerWheel');
    
    const plainInput = document.getElementById('plainInput');
    const encryptedOutput = document.getElementById('encryptedOutput');
    const shiftBadge = document.getElementById('shiftBadge');

    let currentRotation = 0;
    let isDragging = false;
    let startAngle = 0;
    let initialRotation = 0;

    // --- 1. 정밀 격자구조 및 알파벳 텍스트 드로잉 (SVG 빌드) ---
    function drawCipherWheel() {
      for (let i = 0; i < totalSectors; i++) {
        const angle = i * anglePerSector;
        const rad = (angle - 90) * Math.PI / 180;
        
        // 바깥 구분 격자선 생성
        const x1_out = 200 + 138 * Math.cos(rad);
        const y1_out = 200 + 138 * Math.sin(rad);
        const x2_out = 200 + 180 * Math.cos(rad);
        const y2_out = 200 + 180 * Math.sin(rad);
        
        const lineOut = document.createElementNS("http://www.w3.org/2000/svg", "line");
        lineOut.setAttribute("x1", x1_out); lineOut.setAttribute("y1", y1_out);
        lineOut.setAttribute("x2", x2_out); lineOut.setAttribute("y2", y2_out);
        lineOut.setAttribute("stroke", "#e2e8f0");
        outerGridLines.appendChild(lineOut);

        // 바깥 평문 문자 정렬 배치
        const textAngle = angle + (anglePerSector / 2);
        const textRad = (textAngle - 90) * Math.PI / 180;
        const xTextOut = 200 + 159 * Math.cos(textRad);
        const yTextOut = 200 + 159 * Math.sin(textRad);

        const txtOut = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txtOut.setAttribute("x", xTextOut); txtOut.setAttribute("y", yTextOut + 5);
        txtOut.setAttribute("text-anchor", "middle");
        txtOut.setAttribute("fill", "#2563eb");
        txtOut.setAttribute("font-weight", "700");
        txtOut.setAttribute("font-size", "14px");
        txtOut.setAttribute("transform", `rotate(${textAngle}, ${xTextOut}, ${yTextOut})`);
        txtOut.textContent = alphabet[i];
        outerLetters.appendChild(txtOut);

        // 안쪽 암호 구분 격자선 생성
        const x1_in = 200 + 95 * Math.cos(rad);
        const y1_in = 200 + 95 * Math.sin(rad);
        const x2_in = 200 + 138 * Math.cos(rad);
        const y2_in = 200 + 138 * Math.sin(rad);

        const lineIn = document.createElementNS("http://www.w3.org/2000/svg", "line");
        lineIn.setAttribute("x1", x1_in); lineIn.setAttribute("y1", y1_in);
        lineIn.setAttribute("x2", x2_in); lineIn.setAttribute("y2", y2_in);
        lineIn.setAttribute("stroke", "#ea580c");
        lineIn.setAttribute("stroke-opacity", "0.4");
        innerGridLines.appendChild(lineIn);

        // 안쪽 암호문 문자 정렬 배치
        const xTextIn = 200 + 116 * Math.cos(textRad);
        const yTextIn = 200 + 116 * Math.sin(textRad);

        const txtIn = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txtIn.setAttribute("x", xTextIn); txtIn.setAttribute("y", yTextIn + 5);
        txtIn.setAttribute("text-anchor", "middle");
        txtIn.setAttribute("fill", "#374151");
        txtIn.setAttribute("font-weight", "700");
        txtIn.setAttribute("font-size", "13px");
        txtIn.setAttribute("transform", `rotate(${textAngle}, ${xTextIn}, ${yTextIn})`);
        txtIn.textContent = alphabet[i];
        innerLetters.appendChild(txtIn);
      }
    }

    // --- 2. 하드웨어 가속 회전 제어 엔진 (마우스 및 다중 터치 인터랙션) ---
    function calcAngle(clientX, clientY) {
      const rect = innerWheel.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      return Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
    }

    function onPointerStart(e) {
      isDragging = true;
      const pointer = e.touches ? e.touches[0] : e;
      startAngle = calcAngle(pointer.clientX, pointer.clientY);
      initialRotation = currentRotation;
      innerWheel.style.transition = "none";
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      if (e.cancelable) e.preventDefault();
      
      const pointer = e.touches ? e.touches[0] : e;
      const angle = calcAngle(pointer.clientX, pointer.clientY);
      const delta = angle - startAngle;
      
      currentRotation = initialRotation + delta;
      innerWheel.style.transform = `rotate(${currentRotation}deg)`;
      innerWheel.style.transformOrigin = "200px 200px";
      
      executeCipherUpdate();
    }

    function onPointerEnd() {
      if (!isDragging) return;
      isDragging = false;
      
      // 스냅 메커니즘을 통한 세밀한 칸 맞춤 보정 효과
      innerWheel.style.transition = "transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
      currentRotation = Math.round(currentRotation / anglePerSector) * anglePerSector;
      innerWheel.style.transform = `rotate(${currentRotation}deg)`;
      
      executeCipherUpdate();
    }

    // 인터랙션 통합 이벤트 바인딩
    innerWheel.addEventListener('mousedown', onPointerStart);
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('mouseup', onPointerEnd);

    innerWheel.addEventListener('touchstart', onPointerStart, { passive: false });
    document.addEventListener('touchmove', onPointerMove, { passive: false });
    document.addEventListener('touchend', onPointerEnd);

    // --- 3. 실시간 고속 스트링 암호화 알고리즘 ---
    function executeCipherUpdate() {
      let shift = Math.round(currentRotation / anglePerSector) % totalSectors;
      if (shift < 0) shift += totalSectors;
      
      shiftBadge.innerText = `이동 칸 수 (Key): ${shift}칸`;

      const sourceStr = plainInput.value.toUpperCase();
      let targetStr = "";

      for (let i = 0; i < sourceStr.length; i++) {
        const char = sourceStr[i];
        const idx = alphabet.indexOf(char);

        if (idx === -1) {
          targetStr += char; // 알파벳 외의 특수기호나 공백은 원형 보존
        } else {
          let cipherIdx = (idx + shift) % totalSectors;
          targetStr += alphabet[cipherIdx];
        }
      }

      encryptedOutput.textContent = targetStr || "TEXT EMPTY";
    }

    plainInput.addEventListener('input', executeCipherUpdate);

    // 런타임 이니셜라이즈
    drawCipherWheel();
    executeCipherUpdate();
  </script>
</body>
</html>
