<style>

  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .myl-svg { display:block; width:100%; height:auto; }
  .myl-title { font-family:'Jua','Malgun Gothic',sans-serif; }
  .myl-han { font-family:'Nanum Myeongjo','Batang',serif; }
  .myl-leaf { animation: myl-sway 6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes myl-sway { 0%,100%{transform:rotate(-1.6deg);} 50%{transform:rotate(1.6deg);} }
  .myl-cloud { animation: myl-drift 30s ease-in-out infinite; }
  @keyframes myl-drift { 0%,100%{transform:translateX(0);} 50%{transform:translateX(30px);} }
  .myl-flag { animation: myl-flag 4s ease-in-out infinite; transform-box:fill-box; transform-origin:0% 50%; }
  @keyframes myl-flag { 0%,100%{transform:skewX(0deg) scaleX(1);} 50%{transform:skewX(-8deg) scaleX(0.96);} }
</style>
