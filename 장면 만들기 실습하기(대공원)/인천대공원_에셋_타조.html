<!-- 원본 크기: 440x600 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타조</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .os-svg { display:block; width:100%; height:auto; }
  .os-neck { animation: os-neck 6.5s ease-in-out infinite; transform-box:fill-box; transform-origin:60% 100%; }
  @keyframes os-neck { 0%,100%{transform:rotate(-2.5deg);} 50%{transform:rotate(3deg);} }
  .os-eye { animation: os-blink 4.8s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
  @keyframes os-blink { 0%,92%,100%{transform:scaleY(1);} 96%{transform:scaleY(0.12);} }
  .os-tail { animation: os-tail 5.6s ease-in-out infinite; transform-box:fill-box; transform-origin:0% 40%; }
  @keyframes os-tail { 0%,100%{transform:rotate(-2deg);} 50%{transform:rotate(2deg);} }
  .os-body { animation: os-breathe 4.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 60%; }
  @keyframes os-breathe { 0%,100%{transform:scale(1);} 50%{transform:scale(1.012);} }
</style>
</head>
<body>
<svg class="os-svg" viewBox="0 0 440 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="타조">
<title>타조</title>
<desc>긴 목과 튼튼한 두 다리를 가진 지구상에서 가장 큰 새 타조. 검은 몸 깃털과 흰 날개깃, 작은 머리와 큰 눈.</desc>
<defs>
  <radialGradient id="os-body" cx="0.4" cy="0.32" r="0.8">
    <stop offset="0" stop-color="#4a4640"/><stop offset="0.6" stop-color="#332f2a"/><stop offset="1" stop-color="#1e1b17"/>
  </radialGradient>
  <linearGradient id="os-neck" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e6c3ba"/><stop offset="0.5" stop-color="#d6a99f"/><stop offset="1" stop-color="#b9857b"/>
  </linearGradient>
  <linearGradient id="os-leg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e0b8ad"/><stop offset="1" stop-color="#b48579"/>
  </linearGradient>
  <linearGradient id="os-beak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e2b473"/><stop offset="1" stop-color="#c08c44"/>
  </linearGradient>
</defs>

<!-- 그림자 -->
<ellipse cx="224" cy="576" rx="132" ry="18" fill="#3a3020" opacity="0.2"/>

<!-- 다리 -->
<g>
  <!-- 왼다리 -->
  <path d="M196,392 C190,440 186,480 190,510" fill="none" stroke="url(#os-leg)" stroke-width="20" stroke-linecap="round"/>
  <path d="M190,510 L184,556 M190,510 L206,554" fill="none" stroke="url(#os-leg)" stroke-width="12" stroke-linecap="round"/>
  <path d="M184,556 l-14,6 M206,554 l16,6" stroke="#c9a08e" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#a87a6c" stroke-width="1.6" opacity="0.5"><path d="M198,430 h-14 M196,458 h-14 M193,486 h-12"/></g>
  <!-- 오른다리 -->
  <path d="M258,392 C266,440 270,480 266,512" fill="none" stroke="url(#os-leg)" stroke-width="21" stroke-linecap="round"/>
  <path d="M266,512 L262,558 M266,512 L282,556" fill="none" stroke="url(#os-leg)" stroke-width="12.5" stroke-linecap="round"/>
  <path d="M262,558 l-14,6 M282,556 l16,6" stroke="#c9a08e" stroke-width="7.5" stroke-linecap="round"/>
  <g stroke="#a87a6c" stroke-width="1.6" opacity="0.5"><path d="M260,430 h14 M262,458 h14 M264,486 h12"/></g>
</g>

<g class="os-body">
<!-- 꼬리 깃(흰) -->
<g class="os-tail">
  <path d="M330,320 C384,300 416,320 420,352 C410,372 380,378 350,368 C360,350 352,332 330,320 Z" fill="#efe9df" stroke="#cfc7b9" stroke-width="2.5"/>
  <g stroke="#cfc7b9" stroke-width="2" opacity="0.6"><path d="M348,332 C376,330 398,338 410,352"/><path d="M346,348 C374,350 394,356 406,362"/></g>
</g>
<!-- 몸통(검은 깃털) -->
<path d="M120,332 C120,262 176,224 236,224 C316,224 352,282 352,344
         C352,404 300,432 232,432 C158,432 120,398 120,332 Z"
      fill="url(#os-body)" stroke="#151310" stroke-width="3"/>
<!-- 깃털 결 -->
<g fill="none" stroke="#5a554d" stroke-width="2.4" opacity="0.5" stroke-linecap="round">
  <path d="M150,300 C180,292 220,290 250,298"/><path d="M150,340 C186,332 232,332 268,342"/>
  <path d="M158,378 C196,372 244,374 282,386"/>
</g>
<!-- 날개(흰 깃 끝) -->
<path d="M150,320 C138,352 142,392 168,414 C196,412 218,392 224,364 C200,372 172,362 158,340 Z"
      fill="#2a2621" stroke="#151310" stroke-width="2.5"/>
<path d="M150,392 C160,406 176,414 196,414 C182,404 168,398 158,388 Z" fill="#efe9df"/>
<g stroke="#efe9df" stroke-width="3" opacity="0.8" stroke-linecap="round"><path d="M156,398 l-8,10 M172,406 l-6,12 M188,410 l-4,12"/></g>
</g>

<!-- ===== 목 + 머리 ===== -->
<g class="os-neck">
  <!-- 목 -->
  <path d="M186,244 C176,196 160,150 152,108 C150,94 160,90 170,98 C182,140 200,196 214,240 Z"
        fill="url(#os-neck)" stroke="#a87a6c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M170,120 C176,158 190,206 202,240" fill="none" stroke="#c99a8e" stroke-width="3" opacity="0.5"/>
  <!-- 머리 -->
  <ellipse cx="150" cy="96" rx="26" ry="22" fill="url(#os-neck)" stroke="#a87a6c" stroke-width="2.5"/>
  <!-- 부리 -->
  <path d="M128,92 C104,90 92,96 92,104 C92,112 106,116 128,110 Z" fill="url(#os-beak)" stroke="#a8792f" stroke-width="2"/>
  <path d="M100,104 C110,106 120,106 126,104" fill="none" stroke="#8a6224" stroke-width="1.6"/>
  <!-- 눈 -->
  <g class="os-eye">
    <ellipse cx="150" cy="90" rx="12" ry="13" fill="#ffffff" stroke="#b98f80" stroke-width="1.5"/>
    <circle cx="150" cy="91" r="8" fill="#241a12"/><circle cx="147" cy="87" r="2.6" fill="#ffffff"/>
    <!-- 속눈썹 -->
    <g stroke="#2a2018" stroke-width="2" stroke-linecap="round"><path d="M141,79 l-4,-5 M150,76 l0,-6 M159,79 l4,-5"/></g>
  </g>
</g>
</svg>
</body>
</html>
