<!-- 원본 크기: 1200x720 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인천대공원 호수정원</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .lk-svg { display:block; width:100%; height:auto; }
  .lk-title { font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif; }

  .lk-cloud  { animation: lk-drift 26s ease-in-out infinite; }
  .lk-cloud2 { animation: lk-drift 34s ease-in-out infinite reverse; }
  @keyframes lk-drift { 0%,100%{transform:translateX(0);} 50%{transform:translateX(34px);} }

  .lk-willow { animation: lk-sway 6.5s ease-in-out infinite; transform-box:fill-box; transform-origin: 50% 0%; }
  @keyframes lk-sway { 0%,100%{transform:rotate(-1.4deg);} 50%{transform:rotate(1.4deg);} }

  .lk-reed { animation: lk-reed 4.8s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes lk-reed { 0%,100%{transform:rotate(-2.6deg);} 50%{transform:rotate(2.6deg);} }

  .lk-duck  { animation: lk-bob 5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 60%; }
  @keyframes lk-bob { 0%,100%{transform:translateY(0) rotate(-0.8deg);} 50%{transform:translateY(-5px) rotate(0.8deg);} }

  .lk-ripple { animation: lk-rip 4.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes lk-rip { 0%{transform:scale(.6);opacity:.55;} 100%{transform:scale(1.5);opacity:0;} }

  .lk-shine { animation: lk-shine 5.5s ease-in-out infinite; }
  @keyframes lk-shine { 0%,100%{opacity:.30;} 50%{opacity:.7;} }

  .lk-fish { animation: lk-glint 6s ease-in-out infinite; }
  @keyframes lk-glint { 0%,92%,100%{opacity:0;} 96%{opacity:.8;} }
</style>
</head>
<body>
<svg class="lk-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인천대공원 호수정원">
<title>인천대공원 호수정원</title>
<desc>넓은 호수를 배경으로 청둥오리 세 마리가 물 위에 떠 있고, 수양버들과 정자, 갈대와 수련이 어우러진 인천대공원 호수정원 풍경.</desc>

<defs>
  <linearGradient id="lk-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9d8ef"/>
    <stop offset="0.55" stop-color="#d3ecf5"/>
    <stop offset="1" stop-color="#eef7ee"/>
  </linearGradient>
  <linearGradient id="lk-hill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8bbd7f"/>
    <stop offset="1" stop-color="#6aa564"/>
  </linearGradient>
  <linearGradient id="lk-hill2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a6cf88"/>
    <stop offset="1" stop-color="#83b76e"/>
  </linearGradient>
  <linearGradient id="lk-water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe6ec"/>
    <stop offset="0.28" stop-color="#8fcbd8"/>
    <stop offset="0.7" stop-color="#5fa6c2"/>
    <stop offset="1" stop-color="#3f83ac"/>
  </linearGradient>
  <linearGradient id="lk-bank" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8dbb5d"/>
    <stop offset="1" stop-color="#5c8a3c"/>
  </linearGradient>
  <radialGradient id="lk-tree" cx="0.36" cy="0.28" r="0.8">
    <stop offset="0" stop-color="#7cb35a"/>
    <stop offset="1" stop-color="#3f7434"/>
  </radialGradient>
  <linearGradient id="lk-willowfoliage" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9cca63"/>
    <stop offset="1" stop-color="#5f9a44"/>
  </linearGradient>
  <linearGradient id="lk-roof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b6f86"/>
    <stop offset="1" stop-color="#39485c"/>
  </linearGradient>
  <linearGradient id="lk-drakebody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e9e6dc"/>
    <stop offset="1" stop-color="#b9b3a4"/>
  </linearGradient>
  <linearGradient id="lk-drakehead" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#2bb071"/>
    <stop offset="0.5" stop-color="#0f8a52"/>
    <stop offset="1" stop-color="#0a5a3c"/>
  </linearGradient>
  <linearGradient id="lk-henbody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c8a36c"/>
    <stop offset="1" stop-color="#8a6a41"/>
  </linearGradient>
  <filter id="lk-blur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.2"/>
  </filter>

  <!-- ===== 청둥오리 수컷(드레이크) 심볼 : 오른쪽을 바라봄 ===== -->
  <symbol id="lk-drake" viewBox="0 0 240 150" overflow="visible">
    <!-- 꼬리(뒤·검정) + 흰 테 -->
    <path d="M14,96 C2,90 6,78 22,80 C40,82 58,88 74,96 C58,102 30,104 14,96 Z" fill="#f2efe6"/>
    <path d="M20,92 C10,86 16,74 30,78 C46,82 58,88 66,94 C52,100 32,100 20,92 Z" fill="#2b2b2b"/>
    <path d="M30,80 C34,66 44,60 52,66 C46,74 44,84 44,90 Z" fill="#1f1f1f"/>
    <!-- 몸통 -->
    <path d="M40,102 C34,74 66,60 120,60 C168,60 200,72 206,92 C210,108 196,118 168,120 C120,124 58,122 40,102 Z"
          fill="url(#lk-drakebody)" stroke="#8f897a" stroke-width="2"/>
    <!-- 옆구리 잔무늬 -->
    <g stroke="#9b9484" stroke-width="1.4" opacity="0.55" fill="none">
      <path d="M64,96 q10,-5 20,0 q10,5 20,0 q10,-5 20,0"/>
      <path d="M70,106 q10,-5 20,0 q10,5 20,0 q10,-5 20,0"/>
    </g>
    <!-- 접힌 날개 + 남색 익경(speculum) -->
    <path d="M96,74 C120,66 150,66 170,78 C160,92 130,96 104,92 C92,90 88,80 96,74 Z" fill="#d8d2c3" stroke="#a49d8c" stroke-width="1.6"/>
    <path d="M120,84 C132,80 146,80 156,86 C150,94 132,96 122,92 Z" fill="#2b56b0"/>
    <path d="M120,80 L156,84 M122,90 L154,92" stroke="#ffffff" stroke-width="2.4"/>
    <!-- 가슴(밤색) -->
    <path d="M170,108 C160,88 168,74 188,72 C204,72 214,84 212,100 C210,114 196,118 184,116 C176,114 172,112 170,108 Z"
          fill="#8a4a2c" stroke="#5e2f18" stroke-width="2"/>
    <!-- 흰 목테 -->
    <path d="M186,74 C196,70 206,72 210,80 C206,86 196,88 188,86 Z" fill="#f6f2e8" stroke="#d7cfbe" stroke-width="1.4"/>
    <!-- 머리(광택 초록) -->
    <circle cx="204" cy="52" r="24" fill="url(#lk-drakehead)"/>
    <path d="M188,44 C196,36 214,34 224,42" fill="none" stroke="#5fe0a4" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
    <!-- 부리(노랑) -->
    <path d="M224,52 C240,48 250,52 250,58 C250,64 240,66 224,62 C220,60 220,54 224,52 Z" fill="#f2c33a" stroke="#c9971f" stroke-width="1.6"/>
    <path d="M246,58 l3,0" stroke="#7a5a12" stroke-width="2" stroke-linecap="round"/>
    <!-- 눈 -->
    <circle cx="212" cy="48" r="3.4" fill="#141210"/>
    <circle cx="211" cy="47" r="1.1" fill="#ffffff"/>
  </symbol>

  <!-- ===== 청둥오리 암컷(hen) 심볼 : 오른쪽을 바라봄 ===== -->
  <symbol id="lk-hen" viewBox="0 0 240 150" overflow="visible">
    <path d="M18,98 C6,92 12,82 28,84 C46,86 62,92 76,98 C60,104 34,106 18,98 Z" fill="#a9895a"/>
    <path d="M40,104 C34,78 66,64 120,64 C168,64 200,76 206,96 C210,110 196,120 168,122 C120,126 58,124 40,104 Z"
          fill="url(#lk-henbody)" stroke="#6f552f" stroke-width="2"/>
    <!-- 얼룩 깃 -->
    <g fill="#6f552f" opacity="0.5">
      <ellipse cx="80" cy="92" rx="9" ry="5"/><ellipse cx="104" cy="86" rx="9" ry="5"/>
      <ellipse cx="128" cy="92" rx="9" ry="5"/><ellipse cx="98" cy="102" rx="9" ry="5"/>
      <ellipse cx="140" cy="82" rx="8" ry="4.5"/>
    </g>
    <path d="M110,80 C132,74 152,76 166,86 C156,96 130,98 112,94 C102,92 100,84 110,80 Z" fill="#b3946a" stroke="#7a5f36" stroke-width="1.6"/>
    <path d="M128,88 C138,84 150,84 158,90 C152,96 136,96 128,92 Z" fill="#2b56b0"/>
    <path d="M128,86 L158,88 M130,94 L156,94" stroke="#ffffff" stroke-width="2"/>
    <!-- 머리 -->
    <circle cx="204" cy="58" r="23" fill="#b3946a" stroke="#7a5f36" stroke-width="1.4"/>
    <g stroke="#7a5f36" stroke-width="2" opacity="0.5" stroke-linecap="round">
      <path d="M190,50 q10,-4 22,-2"/><path d="M188,60 q12,-3 26,-1"/>
    </g>
    <path d="M186,52 C182,48 184,66 190,70" fill="none" stroke="#5c4527" stroke-width="4" stroke-linecap="round"/>
    <!-- 부리(주황갈색) -->
    <path d="M224,58 C240,54 250,58 250,64 C250,70 240,72 224,68 C220,66 220,60 224,58 Z" fill="#c98a3a" stroke="#8a5a1f" stroke-width="1.6"/>
    <path d="M232,60 q6,0 12,2" stroke="#5c3a12" stroke-width="1.6" fill="none"/>
    <circle cx="212" cy="54" r="3.2" fill="#141210"/>
    <circle cx="211" cy="53" r="1" fill="#ffffff"/>
  </symbol>
</defs>

<!-- ===================== 하늘 ===================== -->
<rect x="0" y="0" width="1200" height="470" fill="url(#lk-sky)"/>
<g class="lk-cloud" fill="#ffffff" opacity="0.9">
  <ellipse cx="230" cy="78" rx="64" ry="20"/><ellipse cx="286" cy="70" rx="42" ry="24"/><ellipse cx="176" cy="88" rx="34" ry="15"/>
</g>
<g class="lk-cloud2" fill="#ffffff" opacity="0.82">
  <ellipse cx="930" cy="62" rx="58" ry="18"/><ellipse cx="978" cy="54" rx="38" ry="22"/><ellipse cx="884" cy="72" rx="30" ry="13"/>
</g>
<!-- 새 실루엣 -->
<g fill="none" stroke="#5c6f76" stroke-width="2.4" stroke-linecap="round" opacity="0.5">
  <path d="M470,96 q11,-9 22,0 q11,-9 22,0"/>
  <path d="M520,110 q8,-7 16,0 q8,-7 16,0"/>
</g>

<!-- ===================== 먼 언덕 / 숲 ===================== -->
<path d="M0,332 C140,296 300,300 430,320 C560,340 700,300 860,308 C980,314 1100,300 1200,318 L1200,470 L0,470 Z" fill="url(#lk-hill)"/>
<path d="M0,360 C160,332 320,352 470,344 C650,334 820,356 1000,346 C1090,341 1150,352 1200,346 L1200,470 L0,470 Z" fill="url(#lk-hill2)"/>
<!-- 먼 나무 무리 -->
<g opacity="0.9">
  <g fill="#5c8f4c">
    <circle cx="120" cy="322" r="26"/><circle cx="150" cy="330" r="20"/><circle cx="92" cy="332" r="18"/>
    <circle cx="640" cy="316" r="24"/><circle cx="668" cy="326" r="18"/><circle cx="612" cy="326" r="16"/>
    <circle cx="1050" cy="322" r="24"/><circle cx="1080" cy="330" r="18"/><circle cx="1022" cy="330" r="16"/>
  </g>
</g>

<!-- ===================== 물가 정자(먼쪽) ===================== -->
<g transform="translate(300,300)">
  <path d="M-52,26 L52,26 L36,-2 L-36,-2 Z" fill="url(#lk-roof)" stroke="#2b3646" stroke-width="2"/>
  <path d="M0,-30 L40,-2 L-40,-2 Z" fill="url(#lk-roof)" stroke="#2b3646" stroke-width="2"/>
  <circle cx="0" cy="-32" r="4" fill="#8895a6"/>
  <g stroke="#7a5230" stroke-width="6" stroke-linecap="round">
    <line x1="-34" y1="26" x2="-34" y2="66"/><line x1="34" y1="26" x2="34" y2="66"/>
    <line x1="-12" y1="26" x2="-12" y2="66"/><line x1="12" y1="26" x2="12" y2="66"/>
  </g>
  <rect x="-46" y="64" width="92" height="8" rx="2" fill="#8a5f38"/>
  <rect x="-40" y="40" width="80" height="6" rx="2" fill="#a4784a" opacity="0.8"/>
</g>

<!-- ===================== 호수(주인공) ===================== -->
<path d="M0,388 C220,364 360,404 560,398 C760,392 980,368 1200,392 L1200,640 L0,640 Z" fill="url(#lk-water)"/>
<!-- 물 반짝임 띠 -->
<g class="lk-shine" fill="#ffffff">
  <ellipse cx="360" cy="430" rx="150" ry="5"/>
  <ellipse cx="820" cy="452" rx="180" ry="5.5"/>
  <ellipse cx="560" cy="500" rx="120" ry="5"/>
</g>
<!-- 잔물결 선 -->
<g fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35" stroke-linecap="round">
  <path d="M120,470 q40,-8 80,0 q40,8 80,0"/>
  <path d="M700,486 q46,-8 92,0 q46,8 92,0"/>
  <path d="M300,540 q50,-9 100,0 q50,9 100,0"/>
  <path d="M840,556 q44,-8 88,0 q44,8 88,0"/>
  <path d="M480,600 q52,-9 104,0 q52,9 104,0"/>
</g>
<!-- 정자 반영 -->
<g transform="translate(300,392)" opacity="0.22" filter="url(#lk-blur)">
  <path d="M-52,0 L52,0 L36,28 L-36,28 Z" fill="#39485c"/>
  <g stroke="#7a5230" stroke-width="6"><line x1="-34" y1="28" x2="-34" y2="60"/><line x1="34" y1="28" x2="34" y2="60"/></g>
</g>

<!-- ===== 수련잎 ===== -->
<g>
  <ellipse cx="180" cy="560" rx="52" ry="18" fill="#4f8a3f" stroke="#37662c" stroke-width="2"/>
  <path d="M180,560 L150,552 M180,560 L210,552 M180,560 L188,578" stroke="#2f5a26" stroke-width="2"/>
  <ellipse cx="250" cy="592" rx="40" ry="14" fill="#5c9a48" stroke="#37662c" stroke-width="2"/>
  <circle cx="214" cy="548" r="9" fill="#f7c9de"/><circle cx="214" cy="548" r="4" fill="#fff3f8"/>
  <ellipse cx="1010" cy="606" rx="58" ry="19" fill="#4f8a3f" stroke="#37662c" stroke-width="2"/>
  <path d="M1010,606 L978,598 M1010,606 L1044,598" stroke="#2f5a26" stroke-width="2"/>
  <circle cx="1046" cy="596" r="9" fill="#fbe6a0"/><circle cx="1046" cy="596" r="4" fill="#fff8e0"/>
</g>

<!-- ===================== 청둥오리 3마리 ===================== -->
<!-- 반영(먼저 그려 오리 아래) -->
<g opacity="0.24" filter="url(#lk-blur)">
  <use href="#lk-drake" x="470" y="512" width="220" height="138" transform="translate(0,270) scale(1,-1)" transform-origin="580 512"/>
  <use href="#lk-hen"   x="726" y="470" width="176" height="110" transform="translate(0,214) scale(1,-1)" transform-origin="814 470"/>
  <use href="#lk-drake" x="150" y="470" width="150" height="94"  transform="translate(0,182) scale(1,-1)" transform-origin="225 470"/>
</g>

<!-- 큰 수컷 (앞·가까움) -->
<g class="lk-duck">
  <ellipse cx="596" cy="590" rx="120" ry="16" fill="#2f6f8c" opacity="0.35"/>
  <use href="#lk-drake" x="470" y="466" width="248" height="156"/>
  <ellipse cx="576" cy="582" rx="112" ry="9" fill="#ffffff" opacity="0.45"/>
</g>
<g class="lk-ripple"><ellipse cx="512" cy="600" rx="70" ry="14" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/></g>

<!-- 암컷 (오른쪽·중간) -->
<g class="lk-duck" style="animation-delay:1.1s">
  <ellipse cx="838" cy="536" rx="94" ry="13" fill="#2f6f8c" opacity="0.32"/>
  <use href="#lk-hen" x="726" y="424" width="200" height="126"/>
  <ellipse cx="820" cy="528" rx="88" ry="7.5" fill="#ffffff" opacity="0.42"/>
</g>
<g class="lk-ripple" style="animation-delay:1.6s"><ellipse cx="770" cy="544" rx="58" ry="12" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.5"/></g>

<!-- 작은 수컷 (왼쪽·멀리) -->
<g class="lk-duck" style="animation-delay:2.2s">
  <ellipse cx="238" cy="524" rx="76" ry="11" fill="#2f6f8c" opacity="0.3"/>
  <use href="#lk-drake" x="150" y="430" width="170" height="107"/>
  <ellipse cx="224" cy="518" rx="70" ry="6" fill="#ffffff" opacity="0.4"/>
</g>
<g class="lk-ripple" style="animation-delay:0.7s"><ellipse cx="190" cy="530" rx="46" ry="10" fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.5"/></g>

<!-- 물고기 반짝(간헐) -->
<g class="lk-fish" fill="#cfeefb"><ellipse cx="1000" cy="520" rx="10" ry="4"/><path d="M1010,520 l10,-5 l0,10 Z"/></g>

<!-- ===================== 수양버들(오른쪽 앞) ===================== -->
<g>
  <path d="M1146,150 C1120,150 1108,180 1112,214 C1090,206 1064,220 1060,248 C1092,250 1120,240 1140,224 C1150,262 1176,268 1200,258 L1200,150 Z" fill="#4f7a3a" opacity="0.25"/>
  <rect x="1150" y="150" width="20" height="230" fill="#6a4a2c"/>
  <path d="M1160,150 C1120,150 1092,182 1096,220" fill="none" stroke="#6a4a2c" stroke-width="10" stroke-linecap="round"/>
</g>
<g class="lk-willow">
  <ellipse cx="1130" cy="150" rx="130" ry="70" fill="url(#lk-willowfoliage)"/>
  <g stroke="#6fa348" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M1050,150 C1044,220 1040,300 1046,372"/>
    <path d="M1084,164 C1080,240 1078,330 1084,404"/>
    <path d="M1120,172 C1118,250 1116,340 1122,420"/>

    <path d="M1196,158 C1198,236 1200,322 1200,398"/>
  </g>
  <g stroke="#8cc25f" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <path d="M1066,156 C1062,224 1060,300 1064,360"/>
    <path d="M1102,168 C1100,238 1098,318 1102,388"/>
    <path d="M1140,170 C1140,244 1140,326 1142,398"/>
    <path d="M1178,162 C1180,236 1182,314 1182,384"/>
  </g>
</g>

<!-- ===================== 앞쪽 물가(왼쪽 하단 둔치) ===================== -->
<path d="M0,600 C120,576 240,588 300,616 C240,648 120,656 0,648 Z" fill="url(#lk-bank)"/>
<path d="M0,600 C120,576 240,588 300,616" fill="none" stroke="#b7dd8f" stroke-width="5" opacity="0.6"/>
<!-- 갈대 -->
<g class="lk-reed">
  <g stroke="#7f9a54" stroke-width="4" stroke-linecap="round">
    <path d="M60,640 C58,590 56,556 62,520"/><path d="M84,644 C84,596 84,560 90,528"/>
    <path d="M40,646 C36,600 34,570 40,540"/>
  </g>
  <g fill="#b78a3a"><ellipse cx="62" cy="516" rx="6" ry="16"/><ellipse cx="90" cy="524" rx="6" ry="16"/><ellipse cx="40" cy="536" rx="5" ry="14"/></g>
</g>
<g class="lk-reed" style="animation-delay:1.3s">
  <g stroke="#8fac60" stroke-width="4" stroke-linecap="round">
    <path d="M150,648 C148,604 148,574 154,548"/><path d="M172,650 C172,610 174,582 180,558"/>
  </g>
  <g fill="#c69a44"><ellipse cx="154" cy="544" rx="5.5" ry="15"/><ellipse cx="180" cy="554" rx="5.5" ry="15"/></g>
</g>

<!-- ===================== 현판 ===================== -->
<g transform="translate(600,680)">
  <rect x="-150" y="-26" width="300" height="52" rx="10" fill="#4c6b4a" opacity="0.9"/>
  <rect x="-150" y="-26" width="300" height="52" rx="10" fill="none" stroke="#eaf5e2" stroke-width="2.5"/>
  <text class="lk-title" x="0" y="10" text-anchor="middle" font-size="30" letter-spacing="10" fill="#f3f8ee">호수정원</text>
</g>

</svg>
</body>
</html>
