<!-- 원본 크기: 460x520 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독수리</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .eg-svg { display:block; width:100%; height:auto; }
  .eg-head { animation: eg-head 7.5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes eg-head { 0%,100%{transform:rotate(-3deg);} 45%{transform:rotate(3deg);} 72%{transform:rotate(0deg);} }
  .eg-eye { animation: eg-blink 5.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
  @keyframes eg-blink { 0%,94%,100%{transform:scaleY(1);} 97%{transform:scaleY(0.12);} }
  .eg-wingL { animation: eg-wingL 5.8s ease-in-out infinite; transform-box:fill-box; transform-origin:88% 10%; }
  .eg-wingR { animation: eg-wingR 5.8s ease-in-out infinite; transform-box:fill-box; transform-origin:12% 10%; }
  @keyframes eg-wingL { 0%,100%{transform:rotate(0);} 50%{transform:rotate(-1.4deg);} }
  @keyframes eg-wingR { 0%,100%{transform:rotate(0);} 50%{transform:rotate(1.4deg);} }
</style>
</head>
<body>
<svg class="eg-svg" viewBox="0 0 460 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="독수리">
<title>독수리</title>
<desc>흰 머리와 날카로운 노란 갈고리 부리, 또렷한 접힌 날개깃과 강한 발톱을 가진 웅장한 흰머리수리가 나뭇가지에 앉아 있는 모습.</desc>
<defs>
  <linearGradient id="eg-body" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#6a4c30"/><stop offset="0.55" stop-color="#4a3320"/><stop offset="1" stop-color="#2c1f12"/>
  </linearGradient>
  <linearGradient id="eg-breast" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7a5836"/><stop offset="1" stop-color="#4e3720"/>
  </linearGradient>
  <linearGradient id="eg-head" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdfcf8"/><stop offset="1" stop-color="#dad7cb"/>
  </linearGradient>
  <linearGradient id="eg-beak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f6cd48"/><stop offset="1" stop-color="#cf9020"/>
  </linearGradient>
  <linearGradient id="eg-branch" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a6338"/><stop offset="1" stop-color="#5e4222"/>
  </linearGradient>
</defs>
