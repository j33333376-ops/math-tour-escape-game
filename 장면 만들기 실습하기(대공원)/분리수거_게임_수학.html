<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>분리수거 마스터 PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --general:#7f8c8d; --general-d:#5b6668;
    --paper:#3d8fd6;   --paper-d:#2b6aa8;
    --plastic:#f2a03c; --plastic-d:#cf7f1c;
    --vinyl:#9b6cc4;   --vinyl-d:#7a4ca8;
    --metal:#e0594a;   --metal-d:#b83b2c;
    --ink:#274034;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(170deg,#eaf6ef 0%,#dff0ea 45%,#d3ead9 100%);
    height:100dvh; overflow:hidden; touch-action:none; user-select:none;
    display:flex; justify-content:center;
  }
  .app{ width:100%; max-width:820px; height:100dvh; display:flex; flex-direction:column; position:relative; }
  .title-font{ font-family:'Jua',sans-serif; font-weight:normal; }

  /* ===== 헤더 ===== */
  header{
    background:#ffffff; padding:12px 18px;
    box-shadow:0 4px 16px rgba(30,80,50,.08);
    display:flex; align-items:center; justify-content:space-between; z-index:20;
  }
  .brand{ font-family:'Jua',sans-serif; font-size:1.28rem; color:#2f9e5b; display:flex; align-items:center; gap:8px; }
  .brand .leaf{ font-size:1.3rem; }
  .stats{ display:flex; gap:10px; }
  .chip{ background:#f1f7f2; border-radius:12px; padding:6px 12px; text-align:center; line-height:1.1; min-width:64px; }
  .chip small{ display:block; font-size:.62rem; color:#8aa093; font-weight:600; }
  .chip b{ font-family:'Jua',sans-serif; font-size:1.15rem; color:#2f9e5b; }
  #score-chip b{ color:#f0932b; }
  #combo-chip{ transition:opacity .3s, transform .3s; }
  #combo-chip b{ color:#e0594a; }
  #combo-chip.off{ opacity:.35; }

  .progress{ height:8px; background:#cfe4d6; }
  .progress-fill{ height:100%; width:0; background:linear-gradient(90deg,#5bc98a,#2f9e5b); border-radius:0 6px 6px 0; transition:width .5s cubic-bezier(.3,1,.4,1); }

  /* ===== 본문 ===== */
  main{ flex:1; display:flex; flex-direction:column; align-items:center; padding:14px 16px 18px; min-height:0; }
  #hint{
    position:fixed; left:50%; top:60%; transform:translate(-50%,-50%);
    z-index:150; pointer-events:none;
    background:#ffffff; border-radius:16px; padding:11px 18px;
    box-shadow:0 8px 20px rgba(30,80,50,.16); text-align:center; font-size:1rem; font-weight:600;
    color:#3a5a48; width:min(540px,90vw); line-height:1.5;
    transition:top .26s ease, left .26s ease;
  }
  #hint::after{
    content:""; position:absolute; left:50%; top:-9px; transform:translateX(-50%);
    border-left:11px solid transparent; border-right:11px solid transparent; border-bottom:11px solid #ffffff;
  }
  #hint .hint-in{ display:block; width:100%; }
  #hint .q{ color:#e0594a; font-weight:800; }
  #stage{ flex:1; width:100%; min-height:250px; }

  /* ===== 드래그 아이템 ===== */
  #drag-item{
    position:fixed; left:50%; top:40%; width:132px; height:150px;
    transform:translate(-50%,-50%); z-index:200; cursor:grab;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    touch-action:none;
  }
  #drag-item.moving{ transition:left .5s cubic-bezier(.3,1.2,.5,1), top .5s cubic-bezier(.3,1.2,.5,1), transform .5s, opacity .45s; }
  #drag-item.grab{ cursor:grabbing; }
  .item-card{
    width:118px; height:118px; background:#ffffff; border-radius:26px;
    box-shadow:0 12px 26px rgba(30,60,40,.18); display:flex; align-items:center; justify-content:center;
    transition:transform .12s; border:3px solid #fff;
  }
  #drag-item.grab .item-card{ transform:scale(1.08) rotate(-2deg); box-shadow:0 18px 34px rgba(30,60,40,.26); }
  .item-card svg{ width:82%; height:82%; }
  .item-name{
    margin-top:8px; background:#274034; color:#fff; font-size:.82rem; font-weight:700;
    padding:4px 12px; border-radius:20px; white-space:nowrap; box-shadow:0 4px 10px rgba(0,0,0,.12);
  }
  #drag-item.shake{ animation:shake .45s; }
  @keyframes shake{ 0%,100%{transform:translate(-50%,-50%) rotate(0);} 20%{transform:translate(-54%,-50%) rotate(-7deg);} 40%{transform:translate(-46%,-50%) rotate(7deg);} 60%{transform:translate(-52%,-50%) rotate(-4deg);} 80%{transform:translate(-48%,-50%) rotate(4deg);} }
  .hand{ position:fixed; z-index:201; font-size:1.4rem; pointer-events:none; opacity:0; transition:opacity .3s; }

  /* ===== 수거함 ===== */
  #bins{ display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; gap:6px 1.4%; width:100%; max-width:860px; }
  .bin{ flex:1 1 76px; max-width:108px; min-width:70px; display:flex; flex-direction:column; align-items:center; cursor:pointer; position:relative; }
  .bin-svg{ width:100%; height:auto; overflow:visible; filter:drop-shadow(0 8px 12px rgba(30,60,40,.16)); transition:transform .18s; }
  .bin .lid{ transition:transform .22s cubic-bezier(.3,1.4,.5,1); transform-box:fill-box; transform-origin:14% 90%; }
  .bin.hot .bin-svg{ transform:translateY(-8px) scale(1.05); }
  .bin.hot .lid{ transform:translate(2px,-11px) rotate(-22deg); }
  .bin.hot .glow{ opacity:1; }
  .glow{ opacity:0; transition:opacity .2s; }
  .bin.reveal{ animation:revealPulse 1.1s ease-in-out 2; }
  @keyframes revealPulse{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  .bin.pop .bin-svg{ animation:binPop .4s; }
  @keyframes binPop{ 0%{transform:translateY(0) scale(1);} 35%{transform:translateY(-6px) scale(1.09);} 100%{transform:translateY(0) scale(1);} }
  .bin-label{ margin-top:6px; font-size:.82rem; font-weight:700; color:#3a4a42; text-align:center; }

  .float-pts{ position:fixed; z-index:300; font-family:'Jua',sans-serif; font-size:1.5rem; color:#2f9e5b; pointer-events:none; text-shadow:0 2px 4px rgba(255,255,255,.8); animation:floatPts 1s ease-out forwards; }
  @keyframes floatPts{ 0%{opacity:0; transform:translate(-50%,0) scale(.6);} 20%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-70px) scale(1.1);} }

  /* ===== 모달 / 결과 ===== */
  .overlay{ position:fixed; inset:0; background:rgba(20,40,30,.55); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .3s; z-index:1000; padding:20px; }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .card{ background:#fff; border-radius:24px; padding:26px 24px; text-align:center; width:340px; max-width:100%; box-shadow:0 18px 50px rgba(0,0,0,.25); transform:scale(.9); transition:transform .3s cubic-bezier(.3,1.3,.5,1); }
  .overlay.show .card{ transform:scale(1); }
  .card .emoji{ font-size:2.6rem; }
  .card h2{ margin:6px 0 4px; font-family:'Jua',sans-serif; }
  #modal h2{ color:#e0594a; }
  .card .where{ font-size:.95rem; color:#666; margin:2px 0 14px; }
  .card .where b{ color:#e0594a; }
  .card .desc{ font-size:.96rem; line-height:1.55; color:#4a5a52; background:#f4f8f5; border-radius:14px; padding:14px 16px; text-align:left; }
  .card .desc .ok{ color:#2f9e5b; font-weight:700; }
  .btn{ margin-top:18px; padding:13px 20px; font-size:1rem; font-family:'Jua',sans-serif; color:#fff; background:linear-gradient(90deg,#43c07f,#2f9e5b); border:none; border-radius:14px; cursor:pointer; width:100%; box-shadow:0 6px 16px rgba(47,158,91,.35); }
  .btn:active{ transform:translateY(1px); }
  #result h2{ color:#2f9e5b; font-size:1.6rem; }
  .result-score{ font-family:'Jua',sans-serif; font-size:2.8rem; color:#f0932b; line-height:1; margin:6px 0; }
  .result-grade{ font-size:1.1rem; font-weight:700; color:#3a5a48; margin-bottom:6px; }
  .result-row{ display:flex; justify-content:space-around; margin:14px 0 4px; }
  .result-row div{ font-size:.82rem; color:#8aa093; }
  .result-row b{ display:block; font-family:'Jua',sans-serif; font-size:1.3rem; color:#3a5a48; }

  .confetti{ position:fixed; z-index:900; width:10px; height:14px; top:-20px; pointer-events:none; border-radius:2px; }

  /* ===== 탄소 절감 바 ===== */
  #eco-bar{
    background:#ffffff; border-top:1px solid #e6f1e9;
    padding:7px 18px 9px; display:flex; align-items:center; gap:10px;
    box-shadow:0 3px 10px rgba(30,80,50,.06); z-index:19;
  }
  .eco-label{ font-size:.72rem; font-weight:700; color:#6f8a7c; white-space:nowrap; }
  #co2-total{ font-family:'Jua',sans-serif; font-size:1.15rem; color:#1f8f6a; line-height:1; }
  .eco-unit{ font-size:.68rem; color:#8aa093; font-weight:600; margin-right:2px; }
  .eco-track{ flex:1; height:9px; background:#e4f0e8; border-radius:6px; overflow:hidden; min-width:60px; }
  .eco-fill{ height:100%; width:0; background:linear-gradient(90deg,#7fd6b0,#1f8f6a); border-radius:6px; transition:width .55s cubic-bezier(.3,1,.4,1); }
  .eco-goal{ font-size:.68rem; color:#8aa093; font-weight:700; white-space:nowrap; }
  #eco-bar.reached .eco-goal{ color:#1f8f6a; }
  #eco-bar.bump #co2-total{ animation:ecoBump .45s; display:inline-block; }
  @keyframes ecoBump{ 0%{transform:scale(1);} 40%{transform:scale(1.28);} 100%{transform:scale(1);} }

  .float-co2{ position:fixed; z-index:300; font-family:'Jua',sans-serif; font-size:1.05rem; color:#1f8f6a; pointer-events:none; text-shadow:0 2px 4px rgba(255,255,255,.9); animation:floatPts 1.15s ease-out forwards; }

  /* ===== 수학 패널 ===== */
  .card.math{ width:440px; text-align:left; max-height:86dvh; overflow-y:auto; padding:22px 20px; }
  .card.math h2{ color:#1f8f6a; text-align:center; }
  .math-lead{ font-size:.86rem; color:#6f8a7c; text-align:center; margin:0 0 14px; }
  .math-sec{ margin-top:18px; }
  .math-sec > h3{
    margin:0 0 8px; font-size:.82rem; font-weight:800; color:#1f8f6a;
    display:flex; align-items:center; gap:6px;
  }
  .math-sec > h3 .tag{ background:#e6f5ee; color:#1f8f6a; border-radius:6px; padding:2px 7px; font-size:.66rem; }
  .graph-wrap{ background:#f6faf7; border-radius:14px; padding:10px 8px 6px; }
  .graph-wrap svg{ width:100%; height:auto; display:block; }
  .eq{
    font-family:'Jua',sans-serif; font-size:1.25rem; color:#274034;
    background:#eef7f2; border-radius:12px; padding:11px 14px; text-align:center; margin-top:10px;
  }
  .eq small{ display:block; font-family:'Noto Sans KR',sans-serif; font-size:.74rem; color:#6f8a7c; margin-top:5px; font-weight:600; }
  .qbox{ background:#fff8ec; border-left:4px solid #f0932b; border-radius:0 12px 12px 0; padding:11px 13px; margin-top:9px; font-size:.86rem; line-height:1.6; color:#4a5a52; }
  .qbox b{ color:#cf7f1c; }
  .legend{ display:flex; gap:14px; justify-content:center; font-size:.7rem; color:#6f8a7c; margin-top:6px; font-weight:600; }
  .legend i{ display:inline-block; width:16px; height:0; border-top:3px solid; vertical-align:middle; margin-right:4px; }
  .btn.ghost{ background:#eef7f2; color:#1f8f6a; box-shadow:none; margin-top:10px; }

  @media (max-width:480px){
    .brand{ font-size:1.05rem; } .chip{ min-width:52px; padding:5px 8px; } .chip b{ font-size:1rem; }
    #hint{ font-size:.92rem; } .bin-label{ font-size:.66rem; } #bins{ gap:1.5%; }
    #drag-item{ width:118px; } .item-card{ width:104px; height:104px; }
    #eco-bar{ padding:6px 12px 8px; gap:7px; } .eco-label{ font-size:.66rem; }
    .card.math{ padding:18px 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="leaf">♻️</span> <span class="title-font">분리수거 마스터</span></div>
    <div class="stats">
      <div class="chip" id="combo-chip"><small>콤보</small><b id="combo">0</b></div>
      <div class="chip"><small>스테이지</small><b id="stage-display">1/30</b></div>
      <div class="chip" id="score-chip"><small>점수</small><b id="score-display">0</b></div>
    </div>
  </header>
  <div class="progress"><div class="progress-fill" id="progress"></div></div>
  <div id="eco-bar">
    <span class="eco-label">🌍 줄인 탄소</span>
    <span><b id="co2-total">0</b><span class="eco-unit">g</span></span>
    <div class="eco-track"><div class="eco-fill" id="eco-fill"></div></div>
    <span class="eco-goal" id="eco-goal">목표 500g</span>
  </div>

  <main>
    <div id="stage"></div>
    <div id="bins"></div>
  </main>
</div>

<!-- 드래그 아이템 -->
<div id="drag-item">
  <div class="item-card" id="item-card"></div>
  <div class="item-name" id="item-name"></div>
</div>
<!-- 설명(아이템 바로 아래에 표시) -->
<div id="hint">여기에 힌트가 표시됩니다.</div>
<div class="hand" id="hand">👆</div>

<!-- 오답 모달 -->
<div class="overlay" id="modal">
  <div class="card">
    <div class="emoji">🤔</div>
    <h2>다시 생각해봐요!</h2>
    <div class="where" id="where"></div>
    <div class="desc" id="feedback"></div>
    <button class="btn" onclick="closeModal()">알겠어요!</button>
  </div>
</div>

<!-- 결과 모달 -->
<div class="overlay" id="result">
  <div class="card">
    <div class="emoji" id="result-emoji">🎉</div>
    <h2 class="title-font">분리수거 완료!</h2>
    <div class="result-score" id="result-score">0점</div>
    <div class="result-grade" id="result-grade"></div>
    <div class="result-row">
      <div>정답<b id="result-correct">0</b></div>
      <div>정확도<b id="result-acc">0%</b></div>
      <div>최고 콤보<b id="result-combo">0</b></div>
    </div>
    <div class="desc" style="margin-top:14px; text-align:center;">
      🌍 줄인 탄소 <b id="result-co2" style="color:#1f8f6a; font-family:'Jua',sans-serif; font-size:1.2rem;">0</b> g CO₂
      <div style="font-size:.8rem; color:#6f8a7c; margin-top:4px;" id="result-tree"></div>
    </div>
    <button class="btn" onclick="openMath()">📈 수학으로 보기</button>
    <button class="btn ghost" onclick="startGame()">다시 도전! 🔄</button>
  </div>
</div>

<!-- 수학 패널 -->
<div class="overlay" id="math">
  <div class="card math">
    <h2 class="title-font">분리수거 속 수학</h2>
    <p class="math-lead">내가 버린 기록이 그래프가 되었어요</p>
    <div id="math-body"></div>
    <button class="btn" onclick="closeMath()">닫기</button>
  </div>
</div>

<script>
/* ===== 아이템 SVG 아트 ===== */
const ART = {

    <rect x="46" y="38" width="4" height="46" rx="2" fill="#fff" opacity="0.55"/></svg>`,

const binName = {general:'일반쓰레기', food:'음식물', paper:'종이류', plastic:'플라스틱', vinyl:'비닐류', metal:'고철·캔류', bulky:'대형폐기물'};

/* ===== 탄소 절감량(g CO₂) — 수업용 예시값, 여기만 고치면 됩니다 =====
   재활용 가치가 큰 금속·플라스틱은 크게, 재활용이 안 되는 품목을
   '올바르게 일반쓰레기로 보내 선별 공정을 지킨 값'은 작게 잡았습니다.
   모두 5의 배수라 기울기 계산이 깔끔합니다.                        */
const CO2 = {
  '알루미늄 캔':60, '부탄가스':50, '낡은 소파':45, '매트리스':45,
  '통조림 캔':40, '부서진 나무 의자':40, '책':35, '투명 페트병':30,
  '샴푸 용기':25, '세제 용기':25, '치킨 상자':20,
  '신문지':15, '바나나 껍질':15, '사과 심':15, '채소 다듬은 것':15,
  '뽁뽁이(에어캡)':10,
  '영수증':5, '칫솔':5, '컵라면 용기':5, '아이스팩':5, '도자기 그릇':5,
  '고추장·장류':5, '플라스틱 빨대':5, '달걀 껍데기':5, '닭뼈':5,
  '과자 봉지':5, '비닐봉지':5, '사용한 휴지':5, '담배꽁초':5, '일회용 마스크':5
};
trashData.forEach(t => t.co2 = CO2[t.name] ?? 10);

const GOAL = 500;            // 부등식 미션 목표치(g)
const TREE_PER_DAY = 60;     // 나무 1그루가 하루에 흡수하는 양(g). 연 22kg ÷ 365일 ≈ 60g

/* ===== 상태 ===== */
let queue=[], idx=0, score=0, combo=0, maxCombo=0, correctCount=0, mistakes=0, busy=false;
let co2Total=0, history=[], itemMissed=false;   // history: 맞힌 순서대로 {name, co2, cum}
const $=id=>document.getElementById(id);
const dragItem=$('drag-item'), itemCard=$('item-card'), itemName=$('item-name');
const binsEl=$('bins');

function buildBins(){
  binsEl.innerHTML = BINS.map(b=>`<div class="bin" data-type="${b.type}">${binSVG(b)}<div class="bin-label">${b.name}</div></div>`).join('');
}
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=(i*7+idx*13+i*i+3)% (i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
// 더 나은 셔플(Math.random 사용)
function shuffleR(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startGame(){
  queue=shuffleR([...trashData]); idx=0; score=0; combo=0; maxCombo=0; correctCount=0; mistakes=0;
  co2Total=0; history=[]; itemMissed=false;
  $('eco-bar').classList.remove('reached');
  $('eco-goal').textContent=`목표 ${GOAL}g`;
  $('modal').classList.remove('show'); $('result').classList.remove('show'); $('math').classList.remove('show');
  updateHUD(); loadItem();
}
function updateHUD(){
  $('score-display').textContent=score;
  $('combo').textContent=combo;
  $('combo-chip').classList.toggle('off', combo<2);
  $('stage-display').textContent=`${Math.min(idx+1,queue.length)}/${queue.length}`;
  $('progress').style.width=`${(idx/queue.length)*100}%`;
  $('co2-total').textContent=co2Total;
  $('eco-fill').style.width=`${Math.min(100, co2Total/GOAL*100)}%`;
  if(co2Total>=GOAL){
    $('eco-bar').classList.add('reached');
    $('eco-goal').textContent=`목표 ${GOAL}g 달성! ✅`;
  }
}
function loadItem(){
  if(idx>=queue.length){ showResult(); return; }
  const it=queue[idx];
  itemCard.innerHTML=ART[it.art];
  itemName.textContent=it.name;
  $('hint').innerHTML=`<span class="hint-in">💡 ${it.hint}<br>어느 통에 버릴까요?</span>`;
  itemMissed=false;
  updateHUD();
  busy=false;
  homeReset(true);
  showHandHint();
}

/* ===== 위치/드래그 ===== */
let homeX=0, homeY=0;
function layoutPlay(){
  const s=$('stage').getBoundingClientRect();
  const hint=$('hint');
  const itemH=dragItem.offsetHeight||150;
  const hintH=hint.offsetHeight||64;
  const gap=12;
  const groupH=itemH+gap+hintH;
  const top=s.top+Math.max(2,(s.height-groupH)/2);
  homeX=s.left+s.width/2;
  homeY=top+itemH/2;
  hint.style.left=homeX+'px';
  hint.style.top=(top+itemH+gap+hintH/2)+'px';
}
function place(x,y,scale){ dragItem.style.left=x+'px'; dragItem.style.top=y+'px'; dragItem.style.transform=`translate(-50%,-50%)${scale?` scale(${scale})`:''}`; }
function homeReset(instant){
  layoutPlay();
  if(instant){ dragItem.classList.remove('moving'); }
  else{ dragItem.classList.add('moving'); }
  dragItem.style.opacity='1';
  place(homeX,homeY,1);
  if(!instant) setTimeout(()=>dragItem.classList.remove('moving'),520);
}
window.addEventListener('resize',()=>{ if(!busy && !dragging) homeReset(true); });

let dragging=false, offX=0, offY=0;
dragItem.addEventListener('pointerdown',e=>{
  if(busy) return;
  dragging=true; hideHand(); dragItem.setPointerCapture(e.pointerId);
  dragItem.classList.remove('moving'); dragItem.classList.add('grab');
  const r=dragItem.getBoundingClientRect();
  offX=e.clientX-(r.left+r.width/2); offY=e.clientY-(r.top+r.height/2);
});
dragItem.addEventListener('pointermove',e=>{
  if(!dragging) return;
  place(e.clientX-offX, e.clientY-offY, 1);
  const b=binAt(e.clientX-offX, e.clientY-offY);
  document.querySelectorAll('.bin').forEach(x=>x.classList.toggle('hot', x===b));
});
dragItem.addEventListener('pointerup',e=>{
  if(!dragging) return; dragging=false; dragItem.classList.remove('grab');
  try{ dragItem.releasePointerCapture(e.pointerId);}catch(_){}
  const cx=e.clientX-offX, cy=e.clientY-offY;
  const b=binAt(cx,cy);
  document.querySelectorAll('.bin').forEach(x=>x.classList.remove('hot'));
  if(b) answer(b); else homeReset(false);
});
function binAt(x,y){
  let found=null;
  document.querySelectorAll('.bin').forEach(b=>{
    const r=b.getBoundingClientRect();
    if(x>=r.left && x<=r.right && y>=r.top-30 && y<=r.bottom) found=b;
  });
  return found;
}

/* ===== 정답 처리 ===== */
function answer(bin){
  const it=queue[idx];
  if(bin.dataset.type===it.correctBin){
    busy=true;
    const r=bin.getBoundingClientRect();
    bin.classList.add('hot');
    dragItem.classList.add('moving');
    place(r.left+r.width/2, r.top+r.height*0.42, 0.15);
    dragItem.style.opacity='0';
    combo++; maxCombo=Math.max(maxCombo,combo);
    const gain=10 + (combo>=2?(combo-1)*2:0);
    score+=gain; correctCount++;
    // 한 번 잘못 버린 자원은 이미 오염된 것으로 보고 절감량을 주지 않습니다
    const saved = itemMissed ? 0 : it.co2;
    co2Total+=saved;
    history.push({name:it.name, co2:saved, full:it.co2, cum:co2Total});
    updateHUD();
    floatPoints(r.left+r.width/2, r.top-6, '+'+gain);
    floatCO2(r.left+r.width/2, r.top+18, saved ? `🌍 −${saved}g` : '🌍 0g');
    const eb=$('eco-bar'); eb.classList.remove('bump'); void eb.offsetWidth; eb.classList.add('bump');
    setTimeout(()=>{ bin.classList.remove('hot'); bin.classList.add('pop'); confettiBurst(r.left+r.width/2, r.top, 14); },180);
    setTimeout(()=>{ bin.classList.remove('pop'); idx++; loadItem(); },700);
  } else {
    combo=0; mistakes++; itemMissed=true; updateHUD();
    dragItem.classList.add('shake');
    setTimeout(()=>{ dragItem.classList.remove('shake'); homeReset(false); showModal(it, bin.dataset.type); },460);
  }
}
function showModal(it, wrong){
  $('where').innerHTML=`<b>${it.name}</b>은(는) <b>${binName[wrong]}</b>이 아니에요.`;
  $('feedback').innerHTML=it.feedback
    + `<div style="margin-top:10px; padding-top:9px; border-top:1px dashed #cfe0d5; font-size:.86rem; color:#1f8f6a; font-weight:700;">🌍 한 번 잘못 섞인 자원은 되살릴 수 없어요. 이 품목의 ${it.co2}g CO₂는 사라집니다.</div>`;
  $('modal').classList.add('show');
  // 정답 수거함 반짝
  const correct=document.querySelector(`.bin[data-type="${it.correctBin}"]`);
  if(correct){ correct.classList.add('reveal'); setTimeout(()=>correct.classList.remove('reveal'),2300); }
}
function closeModal(){ $('modal').classList.remove('show'); }

/* ===== 이펙트 ===== */
function floatPoints(x,y,txt){
  const el=document.createElement('div'); el.className='float-pts'; el.textContent=txt;
  el.style.left=x+'px'; el.style.top=y+'px'; document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}
function floatCO2(x,y,txt){
  const el=document.createElement('div'); el.className='float-co2'; el.textContent=txt;
  el.style.left=x+'px'; el.style.top=y+'px'; document.body.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}
const COLORS=['#43c07f','#f0932b','#3d8fd6','#e0594a','#9b6cc4','#f6d743'];
function confettiBurst(x,y,n){
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=x+'px'; c.style.top=y+'px'; c.style.background=COLORS[i%COLORS.length];
    document.body.appendChild(c);
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70, dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-40;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy+120}px) rotate(${360+Math.random()*360}deg)`,opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.6,.4,1)'});
    setTimeout(()=>c.remove(),1500);
  }
}
function showResult(){
  const total=queue.length, acc=Math.round(correctCount/(correctCount+mistakes||1)*100);
  let grade='🌱 새싹 지킴이', emoji='🎉';
  if(mistakes===0){ grade='🏆 분리수거 마스터!'; emoji='🏆'; }
  else if(acc>=70){ grade='🌳 훌륭한 환경 지킴이'; emoji='🎉'; }
  else { grade='🌿 조금만 더 연습해요'; emoji='💪'; }
  $('result-emoji').textContent=emoji;
  $('result-score').textContent=score+'점';
  $('result-grade').textContent=grade;
  $('result-correct').textContent=`${correctCount}/${total}`;
  $('result-acc').textContent=acc+'%';
  $('result-combo').textContent=maxCombo;
  $('result-co2').textContent=co2Total;
  $('result-tree').textContent=`나무 ${(co2Total/TREE_PER_DAY).toFixed(1)}그루가 하루 동안 흡수하는 양이에요`;
  $('progress').style.width='100%';
  $('result').classList.add('show');
  for(let i=0;i<3;i++) setTimeout(()=>confettiBurst(window.innerWidth/2,120,26),i*260);
}

/* ===== 수학 패널 ===== */
function niceScale(v){
  if(v<=0) return {max:10, step:5};
  const raw=v/4, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,4,5,10].map(m=>m*mag).find(s=>s>=raw) || 10*mag;
  return {max:Math.ceil(v/step)*step, step:step};
}

/* 그래프 1 — 내가 만든 누적 절감량 그래프 */
function graphCumulative(){
  const n=history.length;
  const total=history[n-1].cum;
  const sc=niceScale(total), yMax=sc.max, step=sc.step;
  const W=400,H=250,padL=48,padT=14,padB=36,plotW=W-padL-16,plotH=H-padT-padB;
  const X=i=>padL+(i/n)*plotW, Y=v=>padT+plotH-(v/yMax)*plotH;

  let grid='', yLab='';
  for(let v=0; v<=yMax+0.001; v+=step){
    grid+=`<line x1="${padL}" y1="${Y(v)}" x2="${padL+plotW}" y2="${Y(v)}" stroke="#dfeae3" stroke-width="1"/>`;
    yLab+=`<text x="${padL-7}" y="${Y(v)+4}" font-size="10" fill="#8aa093" text-anchor="end">${Math.round(v)}</text>`;
  }
  const tick=n<=10?1:(n<=20?4:5);
  let xLab='';
  for(let i=0;i<=n;i+=tick) xLab+=`<text x="${X(i)}" y="${padT+plotH+16}" font-size="10" fill="#8aa093" text-anchor="middle">${i}</text>`;

  let pts=`${X(0)},${Y(0)} `, dots='';
  history.forEach((h,i)=>{
    pts+=`${X(i+1)},${Y(h.cum)} `;
    dots+=`<circle cx="${X(i+1)}" cy="${Y(h.cum)}" r="2.8" fill="#1f8f6a"/>`;
  });

  return `<div class="graph-wrap"><svg viewBox="0 0 ${W} ${H}">
    ${grid}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="#9db3a6" stroke-width="1.6"/>
    <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" stroke="#9db3a6" stroke-width="1.6"/>
    ${yLab}${xLab}
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(n)}" y2="${Y(total)}" stroke="#f0932b" stroke-width="2.2" stroke-dasharray="6 4"/>
    <polyline points="${pts}" fill="none" stroke="#1f8f6a" stroke-width="2.4" stroke-linejoin="round"/>
    ${dots}
    <text x="${padL+plotW}" y="${padT+plotH+30}" font-size="10" fill="#6f8a7c" text-anchor="end">x : 올바르게 버린 개수(개)</text>
    <text x="${padL-40}" y="${padT-2}" font-size="10" fill="#6f8a7c">y : 누적 절감량(g)</text>
  </svg></div>
  <div class="legend">
    <span><i style="border-color:#1f8f6a"></i>실제 기록</span>
    <span><i style="border-color:#f0932b; border-top-style:dashed"></i>평균 기울기 직선</span>
  </div>`;
}

/* 그래프 2 — 품목마다 기울기가 다르다 */
function graphSlopes(){
  const items=[
    {name:'알루미늄 캔', a:60, c:'#e0594a'},
    {name:'투명 페트병', a:30, c:'#3d8fd6'},
    {name:'과자 봉지',   a:5,  c:'#9b6cc4'}
  ];
  const xMax=8, yMax=480;
  const W=400,H=215,padL=48,padT=14,padB=34,plotW=W-padL-72,plotH=H-padT-padB;
  const X=x=>padL+(x/xMax)*plotW, Y=y=>padT+plotH-(y/yMax)*plotH;

  let grid='', yLab='';
  for(let v=0; v<=yMax; v+=120){
    grid+=`<line x1="${padL}" y1="${Y(v)}" x2="${padL+plotW}" y2="${Y(v)}" stroke="#dfeae3" stroke-width="1"/>`;
    yLab+=`<text x="${padL-7}" y="${Y(v)+4}" font-size="10" fill="#8aa093" text-anchor="end">${v}</text>`;
  }
  let xLab='';
  for(let i=0;i<=xMax;i+=2) xLab+=`<text x="${X(i)}" y="${padT+plotH+15}" font-size="10" fill="#8aa093" text-anchor="middle">${i}</text>`;

  const lines=items.map(it=>{
    const yEnd=Math.min(it.a*xMax, yMax), xEnd=yEnd/it.a;
    return `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xEnd)}" y2="${Y(yEnd)}" stroke="${it.c}" stroke-width="2.6" stroke-linecap="round"/>
      <text x="${X(xEnd)+5}" y="${Y(yEnd)+4}" font-size="9.5" fill="${it.c}" font-weight="700">y=${it.a}x</text>`;
  }).join('');

  return `<div class="graph-wrap"><svg viewBox="0 0 ${W} ${H}">
    ${grid}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="#9db3a6" stroke-width="1.6"/>
    <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" stroke="#9db3a6" stroke-width="1.6"/>
    ${yLab}${xLab}${lines}
    <text x="${padL+plotW}" y="${padT+plotH+29}" font-size="10" fill="#6f8a7c" text-anchor="middle">x : 개수(개)</text>
  </svg></div>
  <div class="legend">${items.map(i=>`<span><i style="border-color:${i.c}"></i>${i.name}</span>`).join('')}</div>`;
}

function openMath(){
  const n=history.length;
  if(n===0){
    $('math-body').innerHTML='<div class="qbox">아직 맞힌 문제가 없어서 그래프를 그릴 수 없어요. 한 번 더 도전해 볼까요?</div>';
    $('math').classList.add('show'); return;
  }
  const total=history[n-1].cum;
  if(total===0){
    $('math-body').innerHTML='<div class="qbox">이번 판은 모든 품목을 한 번씩 잘못 버려서 절감량이 0g이에요. 그래프가 <b>기울기 0인 가로선</b>이 됩니다. 다시 도전해 볼까요?</div>';
    $('math').classList.add('show'); return;
  }
  const a=total/n;
  const aTxt=Number.isInteger(a)?a:a.toFixed(1);
  const target=1000, need=Math.ceil(target/a);

  // 실제로 절감에 성공한 품목 중 기울기가 가장 큰 / 작은 것
  const sorted=history.filter(h=>h.co2>0).sort((p,q)=>q.co2-p.co2);
  const best=sorted[0], worst=sorted[sorted.length-1];
  const zeros=history.filter(h=>h.co2===0).length;
  const flatNote = zeros
    ? `<br>한 번에 못 맞힌 <b>${zeros}개</b> 구간에서는 그래프가 <b>기울기 0</b>인 가로선이 돼요.`
    : '';

  $('math-body').innerHTML=`
  <div class="math-sec">
    <h3><span class="tag">중1·중2</span> 누적 절감량 그래프</h3>
    ${graphCumulative()}
    <div class="eq">y = ${aTxt}x
      <small>x = 올바르게 버린 개수 · y = 누적 절감량(g) · 기울기 ${aTxt} = 1개당 평균 절감량</small>
    </div>
    <div class="qbox">
      ❓ 초록 선은 왜 곧은 직선이 아닐까요?<br>
      → 품목마다 줄어드는 양이 다르기 때문이에요. <b>${best.name}(${best.co2}g)</b>에서는 가파르게,
      <b>${worst.name}(${worst.co2}g)</b>에서는 완만하게 올라갑니다.${flatNote}<br>
      주황 점선은 그 변화를 하나의 <b>평균 기울기</b>로 나타낸 정비례 그래프예요.
    </div>
  </div>

  <div class="math-sec">
    <h3><span class="tag">중2</span> 기울기가 클수록 효과가 크다</h3>
    ${graphSlopes()}
    <div class="qbox">
      ❓ 같은 8개를 버렸는데 결과가 왜 이렇게 다를까요?<br>
      → 세 그래프 모두 원점을 지나는 <b>정비례</b>지만 기울기가 60, 30, 5로 달라요.
      기울기가 12배면 절감량도 12배가 됩니다.
    </div>
  </div>

  <div class="math-sec">
    <h3><span class="tag">중1·중2</span> 목표를 넘으려면? (부등식)</h3>
    <div class="eq">${aTxt}x ≥ ${target.toLocaleString()}
      <small>x ≥ ${(target/a).toFixed(1)} 이므로 최소 <b>${need}개</b>를 올바르게 버려야 해요</small>
    </div>
    <div class="qbox">
      ❓ 이번 판에서는 ${n}개를 맞혀 <b>${total.toLocaleString()}g</b>을 줄였어요.
      1,000g을 넘으려면 <b>${Math.max(0, need-n)}개</b>가 더 필요합니다.<br>
      알루미늄 캔(60g)만 골라 버린다면 60x ≥ 1,000 → 최소 몇 개일까요?
    </div>
  </div>

  <div class="math-sec">
    <h3><span class="tag">중3</span> 값을 요약하는 여러 방법</h3>
    <div class="qbox">
      평균 <b>${aTxt}g</b> · 최댓값 <b>${best.co2}g</b> · 최솟값 <b>${worst.co2}g</b><br>
      ❓ 평균만으로 이번 판을 설명하기에 충분할까요? 5g짜리와 60g짜리가 섞여 있다면
      <b>흩어진 정도(산포도)</b>도 함께 봐야 합니다.
    </div>
  </div>`;
  $('math').classList.add('show');
}
function closeMath(){ $('math').classList.remove('show'); }
