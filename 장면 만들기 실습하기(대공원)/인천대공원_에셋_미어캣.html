<!-- 원본 크기: 360x520 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미어캣</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  .mk-svg { display:block; width:100%; height:auto; }
  .mk-head { animation: mk-look 6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes mk-look { 0%,100%{transform:rotate(-7deg);} 30%{transform:rotate(6deg);} 55%{transform:rotate(-3deg);} 80%{transform:rotate(4deg);} }
  .mk-eye { animation: mk-blink 4.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
  @keyframes mk-blink { 0%,93%,100%{transform:scaleY(1);} 96.5%{transform:scaleY(0.1);} }
  .mk-tail { animation: mk-tail 5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 0%; }
  @keyframes mk-tail { 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
  .mk-arm { animation: mk-arm 4.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 0%; }
  @keyframes mk-arm { 0%,100%{transform:rotate(0);} 50%{transform:rotate(-4deg);} }
</style>
</head>
<body>
<svg class="mk-svg" viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="미어캣">
<title>미어캣</title>
<desc>두 발로 서서 주변을 경계하듯 두리번거리는 미어캣. 눈 둘레의 검은 무늬와 뾰족한 주둥이가 특징.</desc>
<defs>
  <linearGradient id="mk-fur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8bd8e"/><stop offset="0.55" stop-color="#c7a970"/><stop offset="1" stop-color="#a9884f"/>
  </linearGradient>
  <linearGradient id="mk-belly" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eaddc0"/><stop offset="1" stop-color="#d3bd94"/>
  </linearGradient>
  <linearGradient id="mk-head" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ddc596"/><stop offset="1" stop-color="#c2a468"/>
  </linearGradient>
</defs>

<!-- 그림자 -->
<ellipse cx="182" cy="434" rx="86" ry="14" fill="#6a5330" opacity="0.2"/>

<!-- 꼬리 -->
<g class="mk-tail">
  <path d="M150,372 C120,404 108,440 118,452 C126,448 134,436 140,422 C148,406 156,392 168,382 Z"
        fill="url(#mk-fur)" stroke="#9a7c48" stroke-width="3" stroke-linejoin="round"/>
  <path d="M118,452 C126,448 134,436 140,422 C130,436 122,446 118,452 Z" fill="#5f4a2c"/>
</g>

<!-- 다리/발 -->
<path d="M150,360 C144,392 142,410 148,420 L172,420 C170,404 168,382 168,358 Z" fill="url(#mk-fur)" stroke="#9a7c48" stroke-width="2.5"/>
<path d="M210,360 C216,392 218,410 212,420 L188,420 C190,404 192,382 192,358 Z" fill="url(#mk-fur)" stroke="#9a7c48" stroke-width="2.5"/>
<ellipse cx="158" cy="420" rx="15" ry="6.5" fill="#c9ac74" stroke="#9a7c48" stroke-width="2"/>
<ellipse cx="204" cy="420" rx="15" ry="6.5" fill="#c9ac74" stroke="#9a7c48" stroke-width="2"/>

<!-- 몸통(직립·통통) -->
<path d="M138,240 C130,196 152,172 180,172 C208,172 230,196 222,240
         C236,290 238,342 220,380 C206,400 154,400 140,380 C122,342 124,290 138,240 Z"
      fill="url(#mk-fur)" stroke="#9a7c48" stroke-width="3" stroke-linejoin="round"/>
<!-- 배(밝음) -->
<path d="M180,206 C160,232 156,320 168,366 C176,380 188,380 196,366 C208,320 204,232 180,206 Z" fill="url(#mk-belly)"/>
<!-- 옆구리 줄무늬 -->
<g stroke="#9a7c48" stroke-width="3" opacity="0.3" stroke-linecap="round" fill="none">
  <path d="M148,286 C156,290 164,290 170,288"/><path d="M146,322 C154,326 162,326 168,324"/>
  <path d="M212,286 C204,290 196,290 190,288"/><path d="M214,322 C206,326 198,326 192,324"/>
</g>

<!-- 팔(앞으로 모음) -->
<g class="mk-arm">
  <path d="M158,250 C142,272 138,304 148,332 C154,340 162,336 162,326 C158,300 162,274 172,256 Z" fill="url(#mk-fur)" stroke="#9a7c48" stroke-width="2.5"/>
  <ellipse cx="150" cy="336" rx="8" ry="9" fill="#c9ac74" stroke="#9a7c48" stroke-width="2"/>
</g>
<g class="mk-arm" style="animation-delay:.5s">
  <path d="M202,250 C218,272 222,304 212,332 C206,340 198,336 198,326 C202,300 198,274 188,256 Z" fill="url(#mk-fur)" stroke="#9a7c48" stroke-width="2.5"/>
  <ellipse cx="210" cy="336" rx="8" ry="9" fill="#c9ac74" stroke="#9a7c48" stroke-width="2"/>
</g>

<!-- ===== 머리 ===== -->
<g class="mk-head">
  <!-- 귀 -->
  <ellipse cx="142" cy="108" rx="14" ry="11" fill="#8a6b3e" transform="rotate(-26 142 108)"/>
  <ellipse cx="218" cy="108" rx="14" ry="11" fill="#8a6b3e" transform="rotate(26 218 108)"/>
  <ellipse cx="144" cy="110" rx="8" ry="6" fill="#5f4a2c" transform="rotate(-26 144 110)"/>
  <ellipse cx="216" cy="110" rx="8" ry="6" fill="#5f4a2c" transform="rotate(26 216 110)"/>
  <!-- 머리통(작고 주둥이 뾰족) -->
  <path d="M180,88 C148,88 130,114 130,144 C130,162 140,178 156,186
           C162,198 172,208 180,208 C188,208 198,198 204,186
           C220,178 230,162 230,144 C230,114 212,88 180,88 Z"
        fill="url(#mk-head)" stroke="#9a7c48" stroke-width="3"/>
  <!-- 이마~볼 밝은 털 -->
  <path d="M180,104 C158,114 150,150 160,182 C168,198 192,198 200,182 C210,150 202,114 180,104 Z" fill="#eaddc0"/>
  <!-- 눈 둘레 검은 무늬 -->
  <ellipse cx="158" cy="140" rx="17" ry="21" fill="#3f3222" transform="rotate(-16 158 140)"/>
  <ellipse cx="202" cy="140" rx="17" ry="21" fill="#3f3222" transform="rotate(16 202 140)"/>
  <!-- 눈 -->
  <g class="mk-eye"><ellipse cx="160" cy="141" rx="8" ry="10" fill="#1c150e"/><circle cx="156" cy="136" r="2.6" fill="#ffffff" opacity="0.85"/></g>
  <g class="mk-eye" style="animation-delay:.1s"><ellipse cx="200" cy="141" rx="8" ry="10" fill="#1c150e"/><circle cx="196" cy="136" r="2.6" fill="#ffffff" opacity="0.85"/></g>
  <!-- 코/주둥이 -->
  <ellipse cx="180" cy="190" rx="9" ry="7" fill="#241b12"/>
  <path d="M180,196 L180,204" stroke="#5f4a2c" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M180,204 C175,209 170,209 167,205 M180,204 C185,209 190,209 193,205" fill="none" stroke="#5f4a2c" stroke-width="2" stroke-linecap="round"/>
</g>
</svg>
</body>
</html>
