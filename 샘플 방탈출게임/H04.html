<head>
    <meta charset="UTF-8">

    <title>차이나타운 체험학습앱 - H04</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        :root {
            --color-dark-red: #8c3030;
            --color-dark-red-hover: #661f1f;
            --color-antique-gold: #d4af37;
            --color-text-dark: #2d3748;
            --color-text-light: #ffffff;
            --color-bg-base: #f5f0e6;
            
            --font-title: 'Nanum Myeongjo', serif;
            --font-name: 'Nanum Gothic Coding', monospace;
            --font-body: 'Noto Sans KR', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: var(--color-bg-base);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid var(--color-antique-gold);
        }

        /* 어둠에서 빛으로 들어오는 연출 오버레이 */
        #fade-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 100;
            pointer-events: none;
            animation: lightFadeIn 3s forwards ease-in-out;
        }

        @keyframes lightFadeIn {
            0% { background-color: #000; opacity: 1; }
            40% { background-color: #fff; opacity: 1; }
            100% { background-color: #fff; opacity: 0; visibility: hidden; }
        }

        /* 상단 스테이지 바 */
        #stage-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--color-antique-gold);
            color: var(--color-antique-gold);
            font-family: var(--font-title);
            font-size: 1.2rem;
            padding: 8px 30px;
            border-radius: 4px;
            z-index: 20;
            text-align: center;
        }

        /* 등장인물 래퍼 */
        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            z-index: 10;
            transition: filter 0.4s ease;
        }

        /* 화자가 아닐 때 어둡게 처리 */
        .char-wrapper.inactive {
            filter: brightness(0.35);
        }

        /* 대화창 UI */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 160px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 2px solid var(--color-antique-gold);
            border-radius: 8px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
            box-sizing: border-box;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        #dialogue-box:hover {
            background-color: rgba(0, 0, 0, 0.85);
        }

        #speaker-name {
            font-family: var(--font-name);
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--color-antique-gold);
            margin-bottom: 12px;
        }

        #dialogue-text {
            font-family: var(--font-body);
            font-size: 1.15rem;
            color: var(--color-text-light);
            line-height: 1.6;
            letter-spacing: -0.02em;
        }

        .click-indicator {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: var(--color-antique-gold);
            font-family: var(--font-body);
            font-size: 0.9rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 공통 버튼 */
        .btn-nav {
            position: absolute;
            background-color: var(--color-dark-red);
            color: var(--color-text-light);
            border: 1px solid var(--color-antique-gold);
            border-radius: 4px;
            padding: 10px 24px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 60;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-nav:hover {
            background-color: var(--color-dark-red-hover);
        }

        #btn-prev { left: 20px; bottom: 20px; display: none; }
        #btn-next { right: 20px; bottom: 20px; display: none; }
        #btn-skip { right: 20px; bottom: 190px; } 

    </style>
</head>

<script>
    // 대화 스크립트 데이터
    const dialogues = [
        { speaker: "미스터 첸", text: "하하하! 훌륭합니다. 드디어 어두운 비밀통로를 뚫고 밖으로 나오셨군요. 무사히 탈출하신 것을 축하합니다.", target: "char-chen" },
        { speaker: "서연", text: "휴, 정말 다행이에요! 어두운 곳에 계속 있다가 밖으로 나오니 눈이 다 부시네요.", target: "char-seoyeon" },
        { speaker: "미스터 첸", text: "여러분 뒤에 있는 이곳 '한중문화관'은 한국과 중국의 문화가 교류하는 아주 상징적인 장소랍니다. 두 나라의 깊은 역사가 깃든 곳에서 여러분의 이번 여정이 뜻깊은 결실을 맺었군요.", target: "char-chen" },
        { speaker: "민우", text: "정말 재밌고 뜻깊은 시간이었어요! 어려운 퀴즈도 많았지만 미스터 첸의 도움 덕분에 탈출할 수 있었습니다. 감사합니다!", target: "char-minwoo" },
        { speaker: "서연", text: "민우야, 우리 이제 다음 장소로 이동해볼까?", target: "char-seoyeon" },
        { speaker: "민우", text: "응! 다음엔 또 어떤 모험이 우릴 기다리고 있을지 기대돼. 가자!", target: "char-minwoo" }
    ];

    let currentIndex = 0;

    function updateCharacterBrightness(activeTargetId) {
        // 모든 캐릭터를 어둡게 처리
        document.querySelectorAll('.char-wrapper').forEach(el => el.classList.add('inactive'));
        // 말하는 캐릭터만 밝게(필터 제거)
        if(activeTargetId) {
            document.getElementById(activeTargetId).classList.remove('inactive');
        }
    }

    function advanceDialogue() {
        if (currentIndex < dialogues.length) {
            const current = dialogues[currentIndex];
            document.getElementById('speaker-name').innerText = current.speaker;
            document.getElementById('dialogue-text').innerText = current.text;
            
            updateCharacterBrightness(current.target);
            currentIndex++;
        } else {
            endDialogue();
        }
    }

    function endDialogue() {
        // 대화창, 건너뛰기 버튼 숨기기
        document.getElementById('dialogue-box').style.display = 'none';
        document.getElementById('btn-skip').style.display = 'none';
        
        // 모든 캐릭터를 원래 밝기로 복구
        document.querySelectorAll('.char-wrapper').forEach(el => el.classList.remove('inactive'));
        
        // 이전, 다시 시작하기 버튼 표시
        document.getElementById('btn-prev').style.display = 'block';
        document.getElementById('btn-next').style.display = 'block';
    }

    // 화면 페이드인 이후 대화 시작 (약간의 딜레이 부여)
    setTimeout(() => {
        advanceDialogue();
    }, 500);
</script>
