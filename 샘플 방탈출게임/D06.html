<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천개항박물관 제4전시실 - 수탈의 기록 (D06)</title>
    <style>
        /* 전체 페이지 레이아웃 및 테마 */
        body {
            margin: 0;
            padding: 20px;
            background-color: #111827;
            color: #f3f4f6;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .exhibition-container {
            width: 100%;
            max-width: 950px;
            background: linear-gradient(145deg, #1f2937, #111827);
            border: 4px solid #4b5563;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            box-sizing: border-box;
            position: relative;
            padding-bottom: 90px; /* 하단 페이지 이동 버튼 공간 확보 */
        }

        /* 헤더 디자인 */
        header {
            text-align: center;
            border-bottom: 2px solid #4b5563;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        header h1 {
            color: #fbbf24;
            margin: 0 0 10px 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        header p {
            color: #9ca3af;
            margin: 0;
            font-size: 16px;
        }

        /* 무대 및 캐릭터 배치 공간 */
        .stage-area {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            flex-wrap: wrap;
            background-color: #0f172a;
            border: 3px solid #334155;
            border-radius: 12px;
            padding: 20px 10px 0 10px;
            margin-bottom: 30px;
            position: relative;
            min-height: 340px;
        }

        /* 금고 배경 연출 */
        .stage-area::before {
            content: 'BANK OF JAPAN - VAULT';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.05);
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            font-family: serif;
        }

        /* 대화창 디자인 */
        .dialogue-box {
            background-color: #1f2937;
            border: 2px solid #fbbf24;
            border-radius: 10px;
            padding: 20px;
            min-height: 80px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .speaker-tag {
            position: absolute;
            top: -15px;
            left: 20px;
            background-color: #fbbf24;
            color: #111827;
            padding: 3px 15px;
            font-weight: bold;
            border-radius: 5px;
            font-size: 14px;
        }

        .dialogue-text {
            font-size: 16px;
            line-height: 1.6;
            margin: 5px 0 0 0;
            color: #e5e7eb;
        }

        /* 대화 전환 버튼 */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .nav-btn {
            background-color: #374151;
            color: white;
            border: 2px solid #4b5563;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background-color: #fbbf24;
            color: #111827;
            border-color: #fbbf24;
        }

        /* 페이지 이동 버튼 전용 스타일 (하단 배치) */
        .page-navigation {
            position: absolute;
            bottom: 25px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
        }

        .page-btn {
            background-color: #4b5563;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .page-btn:hover {
            background-color: #9ca3af;
            color: #111827;
        }

        .page-btn:active {
            transform: scale(0.98);
        }

        /* ===================================================
           [캐릭터 1] 교복 민우 스타일링 및 구조
           =================================================== */
        .kyobok-minwoo-component { display: inline-block; overflow: visible !important; }
        .kmw-stage {
            position: relative; width: 220px; height: 280px; margin: 0 auto;
            animation: kmw-breatheHuman 4s ease-in-out infinite; overflow: visible !important;
        }
        @keyframes kmw-breatheHuman { 0%, 100% { transform: scale(1) translateY(0px); } 50% { transform: scale(1.01) translateY(-3px); } }
        .kmw-head-wrapper { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 120px; height: 130px; overflow: visible !important; }
        .kmw-ear-l, .kmw-ear-r { position: absolute; top: 52px; width: 16px; height: 26px; background-color: #ffdbb5; border: 3.5px solid #8d5b4c; z-index: 2; }
        .kmw-ear-l { left: -11px; border-radius: 50% 0 0 50%; transform: rotate(-10deg); }
        .kmw-ear-r { right: -11px; border-radius: 0 50% 50% 0; transform: rotate(10deg); }
        .kmw-hair-back { position: absolute; top: -8px; left: -4px; width: 128px; height: 80px; background-color: #242424; border: 3.5px solid #141414; border-radius: 60px 60px 20px 20px; z-index: 1; }
        .kmw-neck { position: absolute; top: 105px; left: 50%; transform: translateX(-50%); width: 28px; height: 40px; background-color: #ffdbb5; border-left: 3.5px solid #8d5b4c; border-right: 3.5px solid #8d5b4c; z-index: 3; }
        .kmw-face-skin { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffdbb5; border: 3.5px solid #8d5b4c; border-radius: 50px 50px 60px 60px; z-index: 4; overflow: hidden; }
        .kmw-front-hair { position: absolute; top: 0; left: 0; width: 100%; height: 42px; background-color: #242424; border-bottom: 3.5px solid #141414; z-index: 10; }
        .kmw-hair-point { position: absolute; top: 36px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid #141414; z-index: 11; }
        .kmw-eyebrow-l, .kmw-eyebrow-r { position: absolute; top: 50px; width: 18px; height: 4px; background-color: #221a15; border-radius: 2px; z-index: 6; }
        .kmw-eyebrow-l { left: 22px; transform: rotate(5deg); } .kmw-eyebrow-r { right: 22px; transform: rotate(-5deg); }
        .kmw-eye-l, .kmw-eye-r { position: absolute; top: 62px; width: 15px; height: 15px; background-color: #221a15; border-radius: 50%; z-index: 6; }
        .kmw-eye-l::after, .kmw-eye-r::after { content: ''; position: absolute; top: 2px; left: 2px; width: 4px; height: 4px; background-color: #fff; border-radius: 50%; }
        .kmw-eye-l { left: 24px; } .kmw-eye-r { right: 24px; }
        .kmw-blush-l, .kmw-blush-r { position: absolute; top: 78px; width: 18px; height: 9px; background-color: rgba(244, 63, 94, 0.4); border-radius: 50%; filter: blur(0.5px); z-index: 6; }
        .kmw-blush-l { left: 16px; } .kmw-blush-r { right: 16px; }
        .kmw-mouth { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 22px; height: 11px; background-color: #e11d48; border-radius: 2px 2px 12px 12px; border: 1.5px solid #9f1239; z-index: 6; }
        .kmw-uniform-top { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); width: 124px; height: 110px; background-color: #1e293b; border: 3.5px solid #475569; border-radius: 24px 24px 10px 10px; z-index: 7; overflow: hidden; }
        .kmw-collar-l { position: absolute; top: -2px; left: 32px; width: 30px; height: 26px; background-color: #ffffff; border: 3px solid #475569; transform: rotate(-30deg); border-radius: 0 0 5px 0; }
        .kmw-collar-r { position: absolute; top: -2px; right: 32px; width: 30px; height: 26px; background-color: #ffffff; border: 3px solid #475569; transform: rotate(30deg); border-radius: 0 0 0 5px; }
        .kmw-tie { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 12px; height: 50px; background-color: #b91c1c; border: 2px solid #7f1d1d; border-radius: 2px 2px 6px 6px; z-index: 10; }
        .kmw-tie::after { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 16px; height: 10px; background-color: #b91c1c; border: 2px solid #7f1d1d; border-radius: 3px; }

        /* ===================================================
           [캐릭터 2] 로봇 상상 스타일링 및 구조
           =================================================== */
        .sangsang-robot-component { display: inline-block; overflow: visible !important; }
        .ssr-stage { position: relative; width: 220px; height: 280px; margin: 0 auto; animation: ssr-float 4s ease-in-out infinite; overflow: visible !important; }
        @keyframes ssr-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .ssr-head { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 140px; height: 125px; background: linear-gradient(135deg, #e2e8f0, #cbd5e1); border-radius: 40px 40px 35px 35px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), inset -4px -4px 10px rgba(0,0,0,0.1); border: 4px solid #475569; z-index: 10; }
        .ssr-visor { position: absolute; top: 25px; left: 10px; right: 10px; height: 65px; background-color: #1e293b; border-radius: 20px; border: 3px solid #64748b; display: flex; justify-content: space-around; align-items: center; padding: 0 15px; }
        .ssr-eye { width: 22px; height: 22px; background-color: #00f2fe; border-radius: 50%; box-shadow: 0 0 15px #00f2fe; animation: ssr-blink 5s infinite; }
        @keyframes ssr-blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.05); } }
        .ssr-ear-l, .ssr-ear-r { position: absolute; top: 60px; width: 12px; height: 30px; background-color: #64748b; border: 3px solid #475569; z-index: 5; }
        .ssr-ear-l { left: 22px; border-radius: 5px 0 0 5px; } .ssr-ear-r { right: 22px; border-radius: 0 5px 5px 0; }
        .ssr-antenna { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 8px; height: 45px; background-color: #94a3b8; border: 3px solid #475569; border-radius: 4px; z-index: 5; }
        .ssr-antenna-tip { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; background-color: #38bdf8; border: 3px solid #475569; border-radius: 50%; box-shadow: 0 0 12px #38bdf8; z-index: 5; }
        .ssr-neck { position: absolute; top: 135px; left: 50%; transform: translateX(-50%); width: 32px; height: 25px; background: linear-gradient(90deg, #94a3b8, #cbd5e1); border: 3.5px solid #475569; border-radius: 4px; z-index: 5; }
        .ssr-body { position: absolute; top: 155px; left: 50%; transform: translateX(-50%); width: 110px; height: 90px; background: linear-gradient(135deg, #cbd5e1, #94a3b8); border: 4px solid #475569; border-radius: 25px 25px 20px 20px; z-index: 8; }
        .ssr-chest-core { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 38px; height: 38px; background-color: #38bdf8; border-radius: 50%; border: 3px solid #475569; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }
        .ssr-shoulder-l, .ssr-shoulder-r { position: absolute; top: 170px; width: 18px; height: 18px; background-color: #64748b; border: 3px solid #475569; border-radius: 50%; z-index: 9; }
        .ssr-shoulder-l { left: 42px; } .ssr-shoulder-r { right: 42px; }
        .ssr-arm-l, .ssr-arm-r { position: absolute; top: 180px; width: 14px; height: 45px; background-color: #cbd5e1; border: 3.5px solid #475569; border-radius: 7px; z-index: 6; transform-origin: top center; }
        .ssr-arm-l { left: 32px; animation: ssr-waveLeft 3s ease-in-out infinite alternate; }
        .ssr-arm-r { right: 32px; animation: ssr-waveRight 3s ease-in-out infinite alternate; }
        @keyframes ssr-waveLeft { 0% { transform: rotate(15deg); } 100% { transform: rotate(30deg); } }
        @keyframes ssr-waveRight { 0% { transform: rotate(-15deg); } 100% { transform: rotate(-30deg); } }
        .ssr-shadow { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 120px; height: 12px; background-color: rgba(15, 23, 42, 0.4); border-radius: 50%; z-index: 1; }

        /* ===================================================
           [캐릭터 3] 교복 서연 스타일링 및 구조
           =================================================== */
        .kyobok-seoyeon-component { display: inline-block; overflow: visible !important; }
        .ksy-stage { position: relative; width: 220px; height: 280px; margin: 0 auto; animation: ksy-breatheHuman 4s ease-in-out infinite; overflow: visible !important; }
        @keyframes ksy-breatheHuman { 0%, 100% { transform: scale(1) translateY(0px); } 50% { transform: scale(1.01) translateY(-3px); } }
        .ksy-head-wrapper { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 120px; height: 130px; overflow: visible !important; }
        .ksy-ponytail { position: absolute; top: 15px; right: -36px; width: 44px; height: 85px; background-color: #4a3728; border: 3.5px solid #2d1f10; border-radius: 0 40px 15px 40px; transform: rotate(15deg); z-index: 1; }
        .ksy-hair-elastic { position: absolute; top: 28px; right: -6px; width: 14px; height: 14px; background-color: #fb7185; border: 2px solid #e11d48; border-radius: 50%; z-index: 2; }
        .ksy-hair-back { position: absolute; top: -8px; left: -4px; width: 128px; height: 85px; background-color: #4a3728; border: 3.5px solid #2d1f10; border-radius: 60px 60px 20px 20px; z-index: 1; }
        .ksy-ear-l, .ksy-ear-r { position: absolute; top: 52px; width: 16px; height: 26px; background-color: #ffdbb5; border: 3.5px solid #8d5b4c; z-index: 2; }
        .ksy-ear-l { left: -11px; border-radius: 50% 0 0 50%; transform: rotate(-10deg); }
        .ksy-ear-r { right: -11px; border-radius: 0 50% 50% 0; transform: rotate(10deg); }
        .ksy-neck { position: absolute; top: 105px; left: 50%; transform: translateX(-50%); width: 28px; height: 40px; background-color: #ffdbb5; border-left: 3.5px solid #8d5b4c; border-right: 3.5px solid #8d5b4c; z-index: 3; }
        .ksy-face-skin { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffdbb5; border: 3.5px solid #8d5b4c; border-radius: 50px 50px 60px 60px; z-index: 4; overflow: hidden; }
        .ksy-front-hair { position: absolute; top: 0; left: 0; width: 100%; height: 45px; background-color: #4a3728; border-bottom: 3.5px solid #2d1f10; z-index: 10; }
        .ksy-hair-point { position: absolute; top: 39px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid #2d1f10; z-index: 11; }
        .ksy-eye-l, .ksy-eye-r { position: absolute; top: 62px; width: 15px; height: 15px; background-color: #221a15; border-radius: 50%; z-index: 6; }
        .ksy-eye-l::after, .ksy-eye-r::after { content: ''; position: absolute; top: 2px; left: 2px; width: 4px; height: 4px; background-color: #fff; border-radius: 50%; }
        .ksy-eye-l { left: 24px; } .ksy-eye-r { right: 24px; }
        .ksy-blush-l, .ksy-blush-r { position: absolute; top: 78px; width: 18px; height: 9px; background-color: rgba(244, 63, 94, 0.4); border-radius: 50%; filter: blur(0.5px); z-index: 6; }
        .ksy-blush-l { left: 16px; } .ksy-blush-r { right: 16px; }
        .ksy-mouth-surprise { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; background-color: #f43f5e; border-radius: 50%; border: 2px solid #be123c; z-index: 6; }
        .ksy-uniform-top { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); width: 124px; height: 110px; background-color: #1e293b; border: 3.5px solid #475569; border-radius: 24px 24px 10px 10px; z-index: 7; overflow: hidden; }
        .ksy-collar-l { position: absolute; top: -2px; left: 32px; width: 30px; height: 26px; background-color: #ffffff; border: 3px solid #475569; transform: rotate(-30deg); border-radius: 0 0 5px 0; }
        .ksy-collar-r { position: absolute; top: -2px; right: 32px; width: 30px; height: 26px; background-color: #ffffff; border: 3px solid #475569; transform: rotate(30deg); border-radius: 0 0 0 5px; }
        .ksy-ribbon { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 32px; height: 14px; background-color: #e11d48; border: 2px solid #9f1239; border-radius: 4px; z-index: 10; }
        .ksy-ribbon::before { content: ''; position: absolute; top: -4px; left: -14px; width: 18px; height: 20px; background-color: #e11d48; border: 2px solid #9f1239; border-radius: 6px 2px 2px 6px; transform: rotate(-15deg); }
        .ksy-ribbon::after { content: ''; position: absolute; top: -4px; right: -14px; width: 18px; height: 20px; background-color: #e11d48; border: 2px solid #9f1239; border-radius: 2px 6px 6px 2px; transform: rotate(15deg); }
        .ksy-skirt { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 126px; height: 35px; background: repeating-linear-gradient(90deg, #64748b, #64748b 10px, #475569 10px, #475569 20px); border: 3px solid #334155; border-radius: 5px 5px 12px 12px; z-index: 8; }

        /* 캐릭터 포커스 효과 */
        .character-box {
            transition: transform 0.3s, filter 0.3s;
            filter: brightness(0.6);
        }
        .character-box.active {
            transform: scale(1.05);
            filter: brightness(1);
        }
    </style>
</head>
<body>

<div class="exhibition-container">
    <header>
        <h1>인천개항박물관 제4전시실</h1>
        <p>구 일본 제1은행 인천지점 대형 금고와 수탈의 역사</p>
    </header>

    <div class="stage-area">
        
        <div id="char-minwoo" class="character-box active">
            <div class="kyobok-minwoo-component">
                <div class="kmw-stage">
                    <div class="kmw-head-wrapper">
                        <div class="kmw-hair-back"></div>
                        <div class="kmw-ear-l"></div>
                        <div class="kmw-ear-r"></div>
                        <div class="kmw-neck"></div>
                        <div class="kmw-face-skin">
                            <div class="kmw-front-hair"></div>
                            <div class="kmw-hair-point" style="left: 15px;"></div>
                            <div class="kmw-hair-point" style="left: 45px;"></div>
                            <div class="kmw-hair-point" style="right: 25px;"></div>
                            <div class="kmw-eyebrow-l"></div>
                            <div class="kmw-eyebrow-r"></div>
                            <div class="kmw-eye-l"></div>
                            <div class="kmw-eye-r"></div>
                            <div class="kmw-blush-l"></div>
                            <div class="kmw-blush-r"></div>
                            <div class="kmw-mouth"></div>
                        </div>
                    </div>
                    <div class="kmw-uniform-top">
                        <div class="kmw-collar-l"></div>
                        <div class="kmw-collar-r"></div>
                        <div class="kmw-tie"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="char-sangsang" class="character-box">
            <div class="sangsang-robot-component">
                <div class="ssr-stage">
                    <div class="ssr-antenna"></div>
                    <div class="ssr-antenna-tip"></div>
                    <div class="ssr-ear-l"></div>
                    <div class="ssr-ear-r"></div>
                    <div class="ssr-head">
                        <div class="ssr-visor">
                            <div class="ssr-eye"></div>
                            <div class="ssr-eye"></div>
                        </div>
                    </div>
                    <div class="ssr-neck"></div>
                    <div class="ssr-body">
                        <div class="ssr-chest-core"></div>
                    </div>
                    <div class="ssr-shoulder-l"></div>
                    <div class="ssr-shoulder-r"></div>
                    <div class="ssr-arm-l"></div>
                    <div class="ssr-arm-r"></div>
                    <div class="ssr-shadow"></div>
                </div>
            </div>
        </div>

        <div id="char-seoyeon" class="character-box">
            <div class="kyobok-seoyeon-component">
                <div class="ksy-stage">
                    <div class="ksy-head-wrapper">
                        <div class="ksy-ponytail"></div>
                        <div class="ksy-hair-elastic"></div>
                        <div class="ksy-hair-back"></div>
                        <div class="ksy-ear-l"></div>
                        <div class="ksy-ear-r"></div>
                        <div class="ksy-neck"></div>
                        <div class="ksy-face-skin">
                            <div class="ksy-front-hair"></div>
                            <div class="ksy-hair-point" style="left: 20px;"></div>
                            <div class="ksy-hair-point" style="left: 50px;"></div>
                            <div class="ksy-hair-point" style="right: 30px;"></div>
                            <div class="ksy-eye-l"></div>
                            <div class="ksy-eye-r"></div>
                            <div class="ksy-blush-l"></div>
                            <div class="ksy-blush-r"></div>
                            <div class="ksy-mouth-surprise"></div>
                        </div>
                    </div>
                    <div class="ksy-uniform-top">
                        <div class="ksy-collar-l"></div>
                        <div class="ksy-collar-r"></div>
                        <div class="ksy-ribbon"></div>
                        <div class="ksy-skirt"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="dialogue-box">
        <div id="speaker-name" class="speaker-tag">민우</div>
        <p id="dialogue-content" class="dialogue-text">여기가 바로 인천개항박물관의 제4전시실이야. 원래는 1899년에 지어진 일본 제1은행 인천지점의 '대형 금고'였다고 해. 건물 구조가 아직도 고스란히 남아있어서 역사적으로 정말 가치 있는 곳이지.</p>
    </div>

    <div class="btn-container">
        <button class="nav-btn" onclick="prevStep()">이전 대화</button>
        <button class="nav-btn" onclick="nextStep()">다음 대화</button>
    </div>

    <div class="page-navigation">
        <a href="D05.html" class="page-btn">← 이전페이지</a>
        <a href="D07.html" class="page-btn">다음페이지 →</a>
    </div>
</div>

<script>
    // 인터랙티브 대화 스크립트 데이터
    const script = [
        {
            speaker: "민우",
            id: "char-minwoo",
            text: "여기가 바로 인천개항박물관의 제4전시실이야. 원래는 1899년에 지어진 일본 제1은행 인천지점의 '대형 금고'였다고 해. 건물 구조가 아직도 고스란히 남아있어서 역사적으로 정말 가치 있는 곳이지."
        },
        {
            speaker: "서연",
            id: "char-seoyeon",
            text: "우와... 금고가 이렇게나 크다니 깜짝 놀랐어! 그런데 민우야, 일본은 왜 조선의 개항지였던 이곳 인천에 가장 먼저 이런 거대한 은행과 금고를 만든 거야?"
        },
        {
            speaker: "상상",
            id: "char-sangsang",
            text: "[시스템 데이터 분석 완료] 당시 일본 제1은행 인천지점은 단순한 은행이 아니었습니다. 조선에서 생산되는 '금'을 대량으로 매입하여 일본으로 반출하고, 강화도 조약 이후 관세를 무관세로 취급하며 경제적 이득을 독점하려던 '경제 수탈의 최전선기지'였습니다."
        },
        {
            speaker: "민우",
            id: "char-minwoo",
            text: "상상이 말이 맞아. 게다가 일본은 우리나라의 화폐 주권을 빼앗기 위해 '제1은행권'이라는 독자적인 지폐를 발행해서 유통하기도 했어. 우리 민족의 자본을 통제하고 말살하려는 가슴 아픈 수탈의 기록이 고스란히 새겨진 방인 셈이지."
        },
        {
            speaker: "서연",
            id: "char-seoyeon",
            text: "듣고 보니 너무 화가 나고 씁쓸하다... 우리가 힘이 없어서 소중한 재산과 경제 주권까지 통째로 빼앗겼던 거잖아. 이 단단해 보이는 금고 벽이 마치 우리 조상들의 눈물과 한을 가둬둔 것처럼 느껴져."
        },
        {
            speaker: "상상",
            id: "char-sangsang",
            text: "그렇습니다. 하지만 현재 이 공간은 과거의 아픔을 딛고, 일본의 금융 수탈 역사와 개항기 금융 기관들의 모습을 전시하는 '역사 교육의 장'으로 완벽하게 재탄생했습니다. 역사를 잊지 않는 것이 가장 중요하니까요."
        },
        {
            speaker: "민우",
            id: "char-minwoo",
            text: "맞아. 제4전시실에 전시된 유물들과 옛 금고의 흔적들을 둘러보면서, 아픈 역사일수록 더 똑바로 기억하고 지켜내야 한다는 교훈을 깊이 새겨야겠어!"
        }
    ];

    let currentStep = 0;

    function updateDialogue() {
        const current = script[currentStep];
        
        // 텍스트 업데이트
        document.getElementById("speaker-name").innerText = current.speaker;
        document.getElementById("dialogue-content").innerText = current.text;
        
        // 화자 변경에 따른 배경색/테두리 가시성 연출
        const speakerTag = document.getElementById("speaker-name");
        if (current.speaker === "상상") {
            speakerTag.style.backgroundColor = "#38bdf8";
            speakerTag.style.color = "#111827";
        } else if (current.speaker === "서연") {
            speakerTag.style.backgroundColor = "#fb7185";
            speakerTag.style.color = "#ffffff";
        } else {
            speakerTag.style.backgroundColor = "#fbbf24";
            speakerTag.style.color = "#111827";
        }

        // 캐릭터 포커스 시각 효과 조정
        document.querySelectorAll('.character-box').forEach(el => {
            el.classList.remove('active');
        });
        document.getElementById(current.id).classList.add('active');
    }

    function nextStep() {
        if (currentStep < script.length - 1) {
            currentStep++;
            updateDialogue();
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            updateDialogue();
        }
    }
</script>

</body>
</html>
