<!-- ===================================================
     [독립 컴포넌트 소스] 교복 서연 (Seoyeon) - 구조 최종 수정본
     =================================================== -->
<div class="kyobok-seoyeon-component" style="display: inline-block; overflow: visible !important;">
    
    <style>
        .ksy-stage {
            position: relative;
            width: 260px;
            height: 320px;
            margin: 0 auto;
            animation: ksy-breatheHuman 4s ease-in-out infinite;
            overflow: visible !important;
        }

        @keyframes ksy-breatheHuman {
            0%, 100% { transform: scale(1) translateY(0px); }
            50% { transform: scale(1.01) translateY(-3px); }
        }

        /* 두상 기본 상자 */
        .ksy-head-wrapper {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 130px;
            overflow: visible !important;
        }

        /* 오른쪽 사이드 포니테일 및 방울 */
        .ksy-ponytail {
            position: absolute;
            top: 15px;
            right: -36px;
            width: 44px;
            height: 85px;
            background-color: #4a3728;
            border: 3.5px solid #2d1f10;
            border-radius: 0 40px 15px 40px;
            transform: rotate(15deg);
            z-index: 1;
        }
        .ksy-hair-elastic {
            position: absolute;
            top: 28px;
            right: -6px;
            width: 14px;
            height: 14px;
            background-color: #fb7185;
            border: 2px solid #e11d48;
            border-radius: 50%;
            z-index: 2;
        }

        /* 뒷머리 베이스 */
        .ksy-hair-back {
            position: absolute;
            top: -8px;
            left: -4px;
            width: 128px;
            height: 85px;
            background-color: #4a3728;
            border: 3.5px solid #2d1f10;
            border-radius: 60px 60px 20px 20px;
            z-index: 1;
        }

        /* 귀 */
        .ksy-ear-l, .ksy-ear-r {
            position: absolute;
            top: 52px;
            width: 16px;
            height: 26px;
            background-color: #ffdbb5;
            border: 3.5px solid #8d5b4c;
            z-index: 2;
        }
        .ksy-ear-l { left: -11px; border-radius: 50% 0 0 50%; transform: rotate(-10deg); }
        .ksy-ear-r { right: -11px; border-radius: 0 50% 50% 0; transform: rotate(10deg); }

        /* [구조 변경] 목 조인트 - 머리통 내부 레이어로 편입하여 턱 밑으로 완벽 격리 */
        .ksy-neck {
            position: absolute;
            top: 105px; /* 머리통 wrapper 기준 내부 좌표로 변경 */
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 40px;
            background-color: #ffdbb5;
            border-left: 3.5px solid #8d5b4c;
            border-right: 3.5px solid #8d5b4c;
            z-index: 3; /* 얼굴 피부(4)보다 아래로 정렬 */
        }

        /* 얼굴 피부 컨테이너 (앞머리 마스킹) */
        .ksy-face-skin {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffdbb5;
            border: 3.5px solid #8d5b4c;
            border-radius: 50px 50px 60px 60px;
            z-index: 4;
            overflow: hidden;
        }

        /* 앞머리 스타일 */
        .ksy-front-hair {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background-color: #4a3728;
            border-bottom: 3.5px solid #2d1f10;
            z-index: 10;
        }
        .ksy-hair-point {
            position: absolute;
            top: 39px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 9px solid #2d1f10;
            z-index: 11;
        }

        /* 눈 */
        .ksy-eye-l, .ksy-eye-r {
            position: absolute;
            top: 62px;
            width: 15px;
            height: 15px;
            background-color: #221a15;
            border-radius: 50%;
            z-index: 6;
        }
        .ksy-eye-l::after, .ksy-eye-r::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
        }
        .ksy-eye-l { left: 24px; }
        .ksy-eye-r { right: 24px; }

        /* 볼터치 & 입 */
        .ksy-blush-l, .ksy-blush-r {
            position: absolute;
            top: 78px;
            width: 18px;
            height: 9px;
            background-color: rgba(244, 63, 94, 0.4);
            border-radius: 50%;
            filter: blur(0.5px);
            z-index: 6;
        }
        .ksy-blush-l { left: 16px; }
        .ksy-blush-r { right: 16px; }

        .ksy-mouth-surprise {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background-color: #f43f5e;
            border-radius: 50%;
            border: 2px solid #be123c;
            z-index: 6;
        }

        /* 교복 상의 및 스커트 */
        .ksy-uniform-top {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 124px;
            height: 110px;
            background-color: #1e293b;
            border: 3.5px solid #475569;
            border-radius: 24px 24px 10px 10px;
            z-index: 7;
            overflow: hidden;
        }
        .ksy-collar-l {
            position: absolute;
            top: -2px;
            left: 32px;
            width: 30px;
            height: 26px;
            background-color: #ffffff;
            border: 3px solid #475569;
            transform: rotate(-30deg);
            border-radius: 0 0 5px 0;
        }
        .ksy-collar-r {
            position: absolute;
            top: -2px;
            right: 32px;
            width: 30px;
            height: 26px;
            background-color: #ffffff;
            border: 3px solid #475569;
            transform: rotate(30deg);
            border-radius: 0 0 0 5px;
        }

        /* 교복 리본 */
        .ksy-ribbon {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 14px;
            background-color: #e11d48;
            border: 2px solid #9f1239;
            border-radius: 4px;
            z-index: 10;
        }
        .ksy-ribbon::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -14px;
            width: 18px;
            height: 20px;
            background-color: #e11d48;
            border: 2px solid #9f1239;
            border-radius: 6px 2px 2px 6px;
            transform: rotate(-15deg);
        }
        .ksy-ribbon::after {
            content: '';
            position: absolute;
            top: -4px;
            right: -14px;
            width: 18px;
            height: 20px;
            background-color: #e11d48;
            border: 2px solid #9f1239;
            border-radius: 2px 6px 6px 2px;
            transform: rotate(15deg);
        }

        /* 체크무늬 스커트 */
        .ksy-skirt {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 35px;
            background: repeating-linear-gradient(90deg, #64748b, #64748b 10px, #475569 10px, #475569 20px);
            border: 3px solid #334155;
            border-radius: 5px 5px 12px 12px;
            z-index: 8;
        }
    </style>

    <div class="ksy-stage">
        <div class="ksy-head-wrapper">
            <div class="ksy-ponytail"></div>
            <div class="ksy-hair-elastic"></div>
            <div class="ksy-hair-back"></div>
            <div class="ksy-ear-l"></div>
            <div class="ksy-ear-r"></div>
            <!-- 목을 얼굴피부 아래, 뒷머리 위에 완벽하게 샌드위치 배치 -->
            <div class="ksy-neck"></div>
            <div class="ksy-face-skin">
                <div class="ksy-front-hair"></div>
                <div class="ksy-hair-point" style="left: 20px;"></div>
                <div class="ksy-hair-point" style="left: 50px;"></div>
                <div class="ksy-hair-point" style="right: 30px;"></div>
                <div class="ksy-eye-l"></div>
                <div class="ksy-eye-r"></div>
                <div class="ksy-blush-l"></div>
                <div class="ksy-blush-r"></div>
                <div class="ksy-mouth-surprise"></div>
            </div>
        </div>
        <div class="ksy-uniform-top">
            <div class="ksy-collar-l"></div>
            <div class="ksy-collar-r"></div>
            <div class="ksy-ribbon"></div>
            <div class="ksy-skirt"></div>
        </div>
    </div>
</div>
