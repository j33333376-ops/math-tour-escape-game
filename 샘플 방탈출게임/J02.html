<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - J02</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        #game-container {
            width: 1066px;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6;
            position: relative;
            overflow: hidden;
            border: 4px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Stage Header Bar */
        #stage-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(140, 48, 48, 0.85);
            border: 2px solid #d4af37;
            padding: 8px 24px;
            border-radius: 4px;
            color: #ffffff;
            font-family: 'Nanum Myeongjo', serif;
            font-weight: bold;
            font-size: 14pt;
            z-index: 10;
            letter-spacing: 0.05em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Background Visuals - 1964 Archive Room */
        #archive-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.4)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23dcd5c5"/><path d="M0 0h100v100H0z" fill="none" stroke="%23cec5b3" stroke-width="0.5"/></svg>');
            background-size: auto;
            z-index: 1;
        }

        /* 1960s Retro Elements & Furniture via CSS */
        .retro-wall {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-bottom: 40px solid #736b5e;
            z-index: 2;
        }

        .poster {
            position: absolute;
            top: 70px;
            background: #e6dfcf;
            border: 1px solid #b5a891;
            padding: 8px;
            font-family: 'Nanum Myeongjo', serif;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.15);
            transform: rotate(-1deg);
            z-index: 2;
        }
        #poster-left { left: 40px; color: #8c3030; font-size: 16pt; width: 60px; text-align: center; }
        #poster-right { right: 40px; color: #2d3748; font-size: 12pt; width: 90px; text-align: center; }

        .cabinet {
            position: absolute;
            bottom: 40px;
            width: 110px;
            height: 280px;
            background: #4a5568;
            border: 3px solid #2d3748;
            border-radius: 2px;
            z-index: 2;
        }
        #cabinet-1 { left: 50px; }
        #cabinet-2 { left: 165px; }
        .cabinet::before {
            content: '';
            position: absolute;
            top: 25%; left: 0; width: 100%; height: 3px; background: #2d3748;
            box-shadow: 0 70px 0 #2d3748, 0 140px 0 #2d3748, 0 210px 0 #2d3748;
        }
        .label {
            position: absolute;
            background: #fff;
            border: 1px solid #999;
            font-size: 8pt;
            padding: 1px 4px;
            left: 15px;
            font-family: 'Noto Sans KR', sans-serif;
            transform: scale(0.8);
        }

        /* Center Desk & Blueprint */
        .center-desk {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            height: 140px;
            background: #8a6d4b;
            border: 4px solid #5c4731;
            border-radius: 4px;
            z-index: 4;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .blueprint {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) rotate(1deg);
            width: 320px;
            height: 95px;
            background: #2b579a;
            border: 2px solid #ffffff;
            padding: 6px;
            color: #ffffff;
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 8pt;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .blueprint-line {
            border: 1px dashed rgba(255,255,255,0.4);
            height: 45px;
            margin-top: 5px;
            position: relative;
        }
        .blueprint-red-line {
            position: absolute;
            top: 5px;
            left: 10px;
            right: 10px;
            border-top: 2px solid #ff4d4d;
        }

        /* Ceiling Hatch (Locked) */
        #ceiling-hatch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 25px;
            background: #5c4731;
            border: 3px solid #d4af37;
            border-top: 0;
            border-radius: 0 0 8px 8px;
            z-index: 5;
            text-align: center;
        }
        #hatch-lock {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: #8c3030;
            border: 2px solid #d4af37;
            border-radius: 50%;
            color: #d4af37;
            font-size: 9pt;
            line-height: 28px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .lock-glow {
            animation: lock-blink 2s infinite alternate;
        }
        @keyframes lock-blink {
            0% { box-shadow: 0 0 2px #ff4d4d; border-color: #ff4d4d; }
            100% { box-shadow: 0 0 12px #ff4d4d; border-color: #d4af37; }
        }

        /* Characters Wrapper and Container */
        #characters-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 20px;
            transition: filter 0.4s ease, transform 0.4s ease;
            overflow: visible;
        }

        /* Character Positioning */
        #char-minwoo { left: 240px; transform: scale(1.05); }
        #char-seoyeon { left: 540px; transform: scale(1.05); }
        #char-chulmin { left: 20px; transform: scale(1.05); }
        #char-drchoi { left: -300px; } 
        #char-kimgu { right: 40px; bottom: 180px; transform: scale(0.85); display: none; } 

        .inactive {
            filter: brightness(0.4) grayscale(0.3);
        }

        /* Dialogue Box UI */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 1026px;
            height: 160px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 20px 30px;
            color: #ffffff;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 13pt;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 10px;
            border-left: 4px solid #8c3030;
            padding-left: 10px;
            line-height: 1;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            letter-spacing: -0.02em;
        }

        #click-prompt {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 9pt;
            color: #d4af37;
            animation: blink 1.5s infinite;
            font-family: 'Noto Sans KR', sans-serif;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Navigation Buttons */
        .btn-nav {
            position: absolute;
            background: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            z-index: 11;
            transition: background 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .btn-nav:hover {
            background: #661f1f;
        }

        #btn-prev { left: 20px; bottom: 20px; }
        #btn-next { right: 20px; bottom: 20px; }
        #btn-skip { right: 20px; top: 20px; padding: 6px 16px; font-size: 10pt; background: rgba(45,55,72,0.8); }

        /* Character Iframe styling */
        .char-frame {
            width: 100%;
            height: 100%;
            border: 0;
            overflow: hidden;
            background: transparent;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="stage-header">스테이지: 1964년, 인천시청 아카이브 실(문서고)</div>

    <div id="archive-background">
        <div class="retro-wall"></div>
        <div class="poster" id="poster-left">재건<br>증산</div>
        <div class="poster" id="poster-right">1964년<br>인천 행정지도</div>
        
        <div class="cabinet" id="cabinet-1">
            <div class="label" style="top:20px;">인천시 조례</div>
            <div class="label" style="top:90px;">건축 허가서</div>
        </div>
        <div class="cabinet" id="cabinet-2">
            <div class="label" style="top:20px;">행정 서류</div>
            <div class="label" style="top:90px;">1964 건축대장</div>
        </div>

        <div id="ceiling-hatch">
            <div id="hatch-lock">🔒</div>
        </div>

        <div class="center-desk">
            <div class="blueprint">
                <div>인천시청 증축 평면도 (1964)</div>
                <div class="blueprint-line">
                    <div class="blueprint-red-line"></div>
                </div>
                <div style="font-size: 6pt; margin-top:3px; text-align:right; color:rgba(255,255,255,0.7)">식민지의 잔재를 지우고, 우리의 행정을 넓힌다</div>
            </div>
        </div>
    </div>

    <div id="characters-container">
        <div class="char-wrapper" id="char-chulmin">
            <iframe src="철민.html" scrolling="no" class="char-frame"></iframe>
        </div>
        <div class="char-wrapper" id="char-minwoo">
            <iframe src="민우.html" scrolling="no" class="char-frame"></iframe>
        </div>
        <div class="char-wrapper" id="char-seoyeon">
            <iframe src="서연.html" scrolling="no" class="char-frame"></iframe>
        </div>
        <div class="char-wrapper" id="char-kimgu">
            <iframe src="백범김구.html" scrolling="no" class="char-frame"></iframe>
        </div>
    </div>

    <div id="dialogue-box" onclick="advanceDialogue()">
        <div id="speaker-name">철민</div>
        <div id="dialogue-text">대사가 로딩 중입니다...</div>
        <div id="click-prompt">▼ 클릭하여 계속</div>
    </div>

    <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
    <button id="btn-prev" class="btn-nav" style="display:none;" onclick="moveScene('J01.html')">이전</button>
    <button id="btn-next" class="btn-nav" style="display:none;" onclick="moveScene('J03.html')">다음</button>
</div>

<script>
    // Dialogues Array Configuration
    const dialogues = [
        { speaker: "철민", text: "(바지를 털며) 아야야... 이번엔 또 어디야? 어? 아까 그 무서운 욱일기는 없어졌네?", target: "char-chulmin" },
        { speaker: "서연", text: "(벽에 걸린 달력을 보며) 1964년... 단 30년 만에 시간이 확 건너뛰었어. 여기 보니까 '인천시청 공보실'이라고 적혀 있네.", target: "char-seoyeon" },
        { speaker: "민우", text: "(중앙의 제도판으로 다가가며) 닥터 최가 우릴 1933년에 영원히 가두려고 했는데, 우리가 김구 선생님의 힌트를 찾아서 탈출하니까 시공간이 꼬인 것 같아. 이것 봐, 이 도면 좀 이상해.", target: "char-minwoo" },
        { speaker: "서연", text: "(도면을 유심히 살피며) 어? 이건 제물포구청... 아니, 당시 인천시청 건물 도면이잖아. 그런데 도면이 두 레이어로 겹쳐 있어. 밑바탕은 일제가 지은 견고한 2층 석조 건물인데... 그 위에 누군가 손으로 급하게 3층을 그려 넣었어!", target: "char-seoyeon" },
        { speaker: "철민", text: "(고개를 기웃거리며) 에이, 부실공사 하려고 장난쳐 놓은 거 아니야? 원래 2층짜리 건물에다가 마음대로 한 층을 더 올리면 무너지잖아!", target: "char-chulmin" },
        { speaker: "서연", text: "(탁 치며) 아니야, 철민아! 그게 바로 이 건물의 엄청난 역사야. 광복이 되고 인구가 늘어나니까 인천시청에 공무원도 많아지고 서류도 넘쳐났대. 새로 건물을 지을 돈은 없고 공간은 부족하니까, 1964년에 우리 선배 공무원들이 머리를 맞대고 이 단단한 일제 건물 꼭대기에 '3층'을 새로 쌓아 올리는 증축 공사를 한 거야.", target: "char-seoyeon" },
        { speaker: "민우", text: "(도면의 노트를 읽으며) 맞네. 여기 적혀 있어. '식민지의 잔재를 지우고, 우리의 행정을 넓히기 위해 한 층을 더 높은 곳에 세운다.' 닥터 최는 일제가 지은 2층 건물 상태로 역사를 고정하려고 했는데, 우리 선조들은 그 위에 우리만의 3층을 올려서 역사를 전진시킨 거였어!", target: "char-minwoo" },
        { speaker: "철민", text: "(감탄하다가 갑자기 시계를 보며 지레겁을 먹는다) 감동적이긴 한데, 얘들아! 타임 체인 락 시간이 30분밖에 안 남았어! 3층이든 4층이든 여기서 나갈 열쇠는 어딨냐고!", target: "char-chulmin" },
        { speaker: "백범김구 (라디오 목소리)", text: '"눈길을 걸어갈 때 어지럽게 걷지 말아라. 오늘 내가 남긴 발자취는 마침내 후인들의 길이 되리니... 청년들이여, 침략자가 세운 낮은 지붕에 갇히지 말고, 우리 손으로 높인 그 \'가장 높은 곳\'을 바라보아라. 그곳에 미래로 가는 문이 열릴 것이다."', target: "char-kimgu" },
        { speaker: "민우", text: "(소리치는) 김구 선생님! 또 길을 알려주시는군요!", target: "char-minwoo" },
        { speaker: "서연", text: "(라디오 소리를 분석하며) '가장 높은 곳'... 그리고 우리 손으로 높인 곳... 얘들아, 이 방 천장을 봐!", target: "char-seoyeon" },
        { speaker: "철민", text: "(목을 뒤로 젖히며) 헉, 저 위에 문이 있네? 근데 저 자물쇠는 어떻게 열어? 사다리도 없는데!", target: "char-chulmin" },
        { speaker: "민우", text: "(제도판 위의 도면을 다시 보며) 도면 밑에 숫자들이 잔뜩 적혀 있어. 증축 승인 날짜, 예산, 그리고... '인천시청 증축 좌표'. 서연아, 이 숫자들이 저 자물쇠의 암호 아닐까?", target: "char-minwoo" },
        { speaker: "서연", text: "(안경을 고쳐 쓰며) 맞아. 일제가 지은 높이에 굴복하지 않고, 우리가 세운 '3층의 역사'를 정확히 기억해 내는 것. 그게 닥터 최의 봉인을 푸는 유일한 방법이야.", target: "char-seoyeon" },
        { speaker: "민우", text: "(두 주먹을 불끈 쥐며) 좋아, 선배 공무원들이 남긴 증축 기록을 샅샅이 뒤져보자. 철민이 너는 저기 철제 캐비닛에서 '1964년 건축 대장'을 찾아와!", target: "char-minwoo" },
        { speaker: "철민", text: "(군기가 바짝 들어) 옙! 시청의 역사는 우리가 지킨다!", target: "char-chulmin" }
    ];

    let currentIndex = 0;

    function updateDialogue() {
        if (currentIndex >= dialogues.length) {
            endDialogue();
            return;
        }

        const current = dialogues[currentIndex];
        document.getElementById("speaker-name").innerText = current.speaker;
        document.getElementById("dialogue-text").innerText = current.text;

        // Reset all characters highlight
        const wrappers = document.querySelectorAll('.char-wrapper');
        wrappers.forEach(w => w.classList.add('inactive'));

        // Highlight speaker target
        const activeWrapper = document.getElementById(current.target);
        if (activeWrapper) {
            activeWrapper.classList.remove('inactive');
            if (current.target === 'char-kimgu') {
                activeWrapper.style.display = 'block';
            }
        }

        // Special visual event on 김구 선생님 radio broadcast
        if (current.speaker.includes("백범김구")) {
            document.getElementById("hatch-lock").classList.add("lock-glow");
        }
    }

    function advanceDialogue() {
        currentIndex++;
        updateDialogue();
    }

    function skipDialogue() {
        endDialogue();
    }

    function endDialogue() {
        // Hide dialogue box and skip button
        document.getElementById("dialogue-box").style.display = "none";
        document.getElementById("btn-skip").style.display = "none";

        // Restore all characters brightness
        const wrappers = document.querySelectorAll('.char-wrapper');
        wrappers.forEach(w => w.classList.remove('inactive'));
        document.getElementById("char-kimgu").style.display = "none"; 

        // Show navigation links
        document.getElementById("btn-prev").style.display = "block";
        document.getElementById("btn-next").style.display = "block";
        
        // Trigger lock final glowing cue
        document.getElementById("hatch-lock").classList.add("lock-glow");
    }

    function moveScene(url) {
        if (url) {
            window.location.href = url;
        }
    }

    // Initialize first dialogue on page load
    window.onload = function() {
        updateDialogue();
    };
</script>

</body>
</html>
