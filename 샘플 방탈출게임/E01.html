<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - E01</title>
    <style>
        /* [공통 UI/UX 및 폰트 규칙 — 근대 개항기 스타일] */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 기본 리셋 및 전체 화면 스크롤 금지 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f5f0e6; /* 양피지 느낌의 따뜻한 연베이지 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 16:9 비율 고정 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6;
            border: 2px solid #d4af37; /* 앤틱 골드 테두리 */
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
        }

        /* 스테이지 상단 표시바 */
        .stage-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(45, 55, 72, 0.85);
            border-bottom: 2px solid #d4af37;
            padding: 12px 20px;
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.15rem;
            font-weight: bold;
            z-index: 90;
            letter-spacing: 0.05em;
        }

        /* [건물 로딩 규칙] 짜장면 박물관 (원본 500x310px, 축소 배율 s=1.35 적용) */
        .building-frame {
            position: absolute;
            left: 30px; 
            bottom: 145px; 
            width: 675px;   /* 500 * 1.35 */
            height: 418.5px; /* 310 * 1.35 */
            overflow: hidden;
            z-index: 5;
        }
        .building-frame iframe {
            border: 0;
            width: 500px;
            height: 310px;
            transform: scale(1.35);
            transform-origin: top left;
        }

        /* [에셋 로딩 규칙] 등장인물 규격화 (260x320px 및 overflow:visible 필수 준수) */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 145px; 
            z-index: 10;
            overflow: visible;
            transition: filter 0.3s ease, opacity 0.3s ease;
        }

        /* [대화 진행 규칙] 말하지 않는 캐릭터 비활성화 어둡게 처리 (.inactive) */
        .character-wrapper.inactive {
            filter: brightness(0.45) grayscale(0.2);
        }

        /* 우측 영역 두 캐릭터 안 겹치게 고정 분리 배치 */
        #char-seoyeon {
            right: 210px; /* 서연이 위치 */
        }
        #char-minwoo {
            right: 15px;  /* 민우 위치 */
        }
        /* 민우 컴포넌트 좌우 반전으로 서연이와 마주보기 구현 */
        #char-minwoo .kyobok-minwoo-component {
            transform: scaleX(-1);
            transform-origin: center;
        }

        /* [대화창 규칙] 유형 2: 비주얼 노벨 형식 하단 대화창 UI (#dialogue-box) */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1020px;
            height: 125px;
            background-color: rgba(0, 0, 0, 0.75); /* 반투명한 검정 배경 */
            border: 2px solid #d4af37; /* 앤틱 골드 테두리 */
            border-radius: 6px;
            padding: 15px 24px;
            z-index: 80;
            cursor: pointer; /* 클릭 유도 */
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            user-select: none;
        }

        /* 화자 이름 영역 */
        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            color: #d4af37; /* 앤틱 골드 */
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* 대사 본문 텍스트 영역 */
        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            color: #ffffff; /* 흰색 텍스트 */
            letter-spacing: -0.02em;
        }

        /* 대화창 내부 클릭 힌트 애니메이션 아이콘 */
        .click-prompt {
            position: absolute;
            right: 20px;
            bottom: 12px;
            color: #d4af37;
            font-size: 0.85rem;
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* [공통 내비게이션 및 건너뛰기 버튼 스타일] */
        .btn-nav {
            position: absolute;
            background-color: #8c3030; /* 다크 레드 */
            color: #ffffff;
            border: 1px solid #d4af37; /* 앤틱 골드 테두리 */
            border-radius: 4px;
            padding: 8px 20px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: background-color 0.2s ease;
        }
        .btn-nav:hover {
            background-color: #661f1f;
        }
        #btn-prev {
            left: 20px;
            bottom: 20px;
            display: none; /* 대화 완료 후 표시 */
        }
        #btn-next {
            right: 20px;
            bottom: 20px;
            display: none; /* 대화 완료 후 표시 */
        }
        #btn-skip {
            right: 20px;
            top: 65px; /* 상단 메뉴 아래 정렬 */
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="stage-header">차이나타운 체험학습 - 제 1막: 짜장면 박물관 앞</div>

        <div class="building-frame">
            <iframe src="E_짜장면박물관.html" scrolling="no"></iframe>
        </div>

        <div id="char-seoyeon" class="character-wrapper"></div>

        <div id="char-minwoo" class="character-wrapper"></div>

        <button id="btn-skip" class="btn-nav" onclick="endDialogue()">건너뛰기</button>

        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name">화자 이름</div>
            <div id="dialogue-text">대사 내용 로딩 중...</div>
            <div class="click-prompt">▼ 클릭하여 계속</div>
        </div>

        <button id="btn-prev" class="btn-nav" onclick="window.location.href='index.html';">이전</button>
        <button id="btn-next" class="btn-nav" onclick="window.location.href='E02.html';">다음</button>
    </div>

    <script>
        // 대화 데이터 구축 (유형 2 규칙 준수)
        const dialogues = [
            { speaker: "서연", text: "나 지금 너무 배가 고파. 먹을 거 없어?", target: "char-seoyeon" },
            { speaker: "민우", text: "마침 내가 옛날 짜장면을 만드는 레시피를 보고 있어. 우리 레시피대로 짜장면을 만들어서 먹어보자. 그럼 시작해볼까?", target: "char-minwoo" },
            { speaker: "서연", text: "좋아!", target: "char-seoyeon" }
        ];

        let currentIndex = 0;

        // 대사 한 칸씩 넘기기 함수
        function advanceDialogue() {
            if (currentIndex >= dialogues.length) {
                endDialogue();
                return;
            }

            const current = dialogues[currentIndex];
            
            // 텍스트 화면 갱신
            document.getElementById('speaker-name').innerText = current.speaker + " :";
            document.getElementById('dialogue-text').innerText = current.text;

            // 말하는 인물 활성화 및 다른 인물 일괄 다크 인액티브 처리
            document.querySelectorAll('.character-wrapper').forEach(wrapper => {
                if (wrapper.id === current.target) {
                    wrapper.classList.remove('inactive');
                } else {
                    wrapper.classList.add('inactive');
                }
            });

            currentIndex++;
        }

        // 대화 종료 및 이동 내비게이션 전환 처리
        function endDialogue() {
            // 1. 대화창 및 스킵버튼 숨김
            document.getElementById('dialogue-box').style.display = 'none';
            document.getElementById('btn-skip').style.display = 'none';

            // 2. 전체 인물 하이라이트 정상 복구
            document.querySelectorAll('.character-wrapper').forEach(wrapper => {
                wrapper.classList.remove('inactive');
            });

            // 3. 네비게이션 이동용 이전/다음 버튼 노출
            document.getElementById('btn-prev').style.display = 'block';
            document.getElementById('btn-next').style.display = 'block';
        }

        // 캐릭터 비동기 데이터 Inject 인젝션 로드 함수
        async function loadCharacterAsset(fileName, targetId) {
            const targetContainer = document.getElementById(targetId);
            if (!targetContainer) return;

            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error();
                const htmlText = await response.text();
                targetContainer.innerHTML = htmlText;
            } catch (error) {
                // 로컬 테스팅 환경 대비용 완벽 보안 예외 방어코드
                targetContainer.innerHTML = `<iframe src="${fileName}" scrolling="no" style="width:100%; height:100%; border:0; background:transparent;"></iframe>`;
                const iframe = targetContainer.querySelector('iframe');
                if (iframe) {
                    iframe.onload = function() {
                        try {
                            const doc = iframe.contentDocument || iframe.contentWindow.document;
                            if (doc && doc.body) {
                                doc.body.style.background = 'transparent';
                                doc.body.style.backgroundColor = 'transparent';
                                doc.body.style.margin = '0';
                                doc.body.style.overflow = 'hidden';
                            }
                        } catch(e){}
                    };
                }
            }
        }

        // 초기 시작 이벤트 구동 바인딩
        window.addEventListener('DOMContentLoaded', async () => {
            // 비동기로 두 캐릭터 에셋을 먼저 안전하게 화면에 로드
            await loadCharacterAsset('서연.html', 'char-seoyeon');
            await loadCharacterAsset('민우.html', 'char-minwoo');
            
            // 로딩 직후 자동으로 첫 번째 대사 호출 가동
            advanceDialogue();
        });
    </script>
</body>
</html>
