<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - G02</title>
    <style>
        /* 공통 폰트 구성 */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f0e6; /* 따뜻한 연베이지 */
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 16:9 비율 유지형 게임 컨테이너 */
        #game-container {
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6;
            border: 4px solid #d4af37; /* 앤틱 골드 */
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* 스테이지 상단 표시바 */
        #stage-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(140, 48, 48, 0.85); /* 반투명 다크 레드 */
            border: 2px solid #d4af37;
            padding: 8px 24px;
            border-radius: 4px;
            color: #ffffff;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* 무대 배경 및 캔버스 */
        #stage-canvas {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(to bottom, #d9cfbe 0%, #f5f0e6 100%);
        }

        /* 에셋 로딩 규칙: 캐릭터 컴포넌트 공통 규격 */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 20px;
            overflow: visible !important;
            z-index: 5;
        }

        .character-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
            overflow: hidden;
            background: transparent;
        }

        /* 왼쪽에 맥아더 장군 배치 */
        #char-macarthur {
            left: 20px;
        }

        /* 오른쪽에 민우와 서연 배치 */
        #char-minwoo {
            right: 180px;
            transform: scaleX(-1);
        }

        #char-seoyeon {
            right: 20px;
            transform: scaleX(-1);
        }

        /* 유형 3 규칙: 수학 퀴즈 컨테이너 디자인 */
        .quiz-container {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 480px;
            background: #fdfaf4;
            border: 2px solid #8c3030;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            padding: 22px 22px 18px 22px;
            border-radius: 6px;
            z-index: 15;
            text-align: center;
        }

        /* 설명 박스 지문 스타일 */
        .npc-instruction {
            background-color: rgba(140, 48, 48, 0.05);
            border-left: 4px solid #8c3030;
            padding: 10px 12px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #2d3748;
            text-align: left;
            margin-bottom: 12px;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .quiz-title {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 17px;
            color: #8c3030;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* 시간 기록 서류 데이터 테이블 */
        .time-table {
            width: 100%;
            background: #f5f0e6;
            border: 1px solid #d4af37;
            border-collapse: collapse;
            margin-bottom: 16px;
            font-family: 'Nanum Gothic Coding', monospace;
        }

        .time-table th, .time-table td {
            border: 1px solid #d4af37;
            padding: 6px;
            font-size: 14px;
            color: #2d3748;
        }

        .time-table th {
            background-color: rgba(212, 175, 55, 0.2);
            color: #8c3030;
            font-weight: bold;
        }

        .highlight-target {
            font-weight: bold;
            color: #b91c1c;
            background-color: rgba(255, 235, 235, 0.7);
        }

        /* 입력창 및 정답 확인 버튼 배치 구조 */
        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }

        .quiz-input {
            width: 150px;
            height: 38px;
            border: 2px solid #d4af37;
            border-radius: 4px;
            padding: 0 10px;
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #2d3748;
            outline: none;
            background-color: #ffffff;
        }

        .quiz-input:focus {
            border-color: #8c3030;
        }

        .btn-submit {
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 0 18px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #661f1f;
        }

        /* 결과 피드백 메시지 박스 */
        .feedback-box {
            margin-top: 10px;
            font-size: 14px;
            min-height: 22px;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .feedback-success {
            color: #15803d;
        }

        .feedback-error {
            color: #b91c1c;
        }

        /* 날아다니는 황금 열쇠 스타일 설정 */
        #flying-key {
            position: absolute;
            width: 60px;
            height: 60px;
            font-size: 45px;
            line-height: 60px;
            text-align: center;
            cursor: pointer;
            z-index: 40;
            user-select: none;
            display: none;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1), top 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            animation: keySpin 1.5s infinite linear;
        }

        @keyframes keySpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.15); }
            100% { transform: rotate(0deg) scale(1); }
        }

        /* 아이템 보상 획득 팝업 오버레이 */
        #item-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #item-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .item-card {
            background: #fdfaf4;
            border: 3px solid #d4af37;
            padding: 25px 35px;
            text-align: center;
            border-radius: 6px;
            transform: scale(0.75);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #item-overlay.active .item-card {
            transform: scale(1);
        }

        .item-icon {
            font-size: 52px;
            margin-bottom: 12px;
            animation: rewardFloat 2s infinite alternate ease-in-out;
        }

        @keyframes rewardFloat {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        /* 공통 네비게이션 버튼 스타일 규칙 준수 */
        .btn-nav {
            position: absolute;
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s ease;
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next {
            right: 20px;
            bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="stage-header">인천상륙작전의 암호를 해결하라!</div>

        <div id="stage-canvas">
            
            <div style="position: absolute; left: 240px; bottom: 120px; width: 198.4px; height: 306.9px; overflow: hidden; z-index: 2; opacity: 0.65;">
                <iframe src="G_맥아더장군동상.html" scrolling="no" style="border: 0; width: 320px; height: 495px; transform: scale(0.62); transform-origin: top left;"></iframe>
            </div>

            <div class="quiz-container">
                <div class="npc-instruction">
                    <strong>맥아더 장군:</strong> "인천 앞바다는 바닷물이 들어오고 나가는 차이가 매우 크다네. 상륙작전을 하려면 바닷물이 가장 높이 차올랐을 때(만조) 배를 대야 하지. 내가 기록해 둔 만조 시간의 규칙을 찾아내어, 오늘 마지막 작전 가능 시간을 알아내게나!"
                </div>

                <div class="quiz-title">기록된 만조 시간의 규칙 분석</div>

                <table class="time-table">
                    <thead>
                        <tr>
                            <th>구분</th>
                            <th>만조 시각 (시, 분)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1차 만조</td>
                            <td>02시 10분</td>
                        </tr>
                        <tr>
                            <td>2차 만조</td>
                            <td>08시 30분</td>
                        </tr>
                        <tr>
                            <td>3차 만조</td>
                            <td>14시 50분</td>
                        </tr>
                        <tr class="highlight-target">
                            <td>4차 만조(최종 작전 시간)</td>
                            <td>[ ? ]</td>
                        </tr>
                    </tbody>
                </table>
                
                <div class="input-group">
                    <input type="text" id="answer-field" class="quiz-input" placeholder="시분 입력" maxlength="4" onkeydown="if(event.key === 'Enter') checkQuizAnswer()">
                    <button class="btn-submit" onclick="checkQuizAnswer()">정답 확인</button>
                </div>

                <div id="feedback" class="feedback-box"></div>
            </div>

            <div id="flying-key" onclick="catchGoldenKey()">🔑</div>

            <div id="char-macarthur" class="character-wrapper">
                <iframe src="맥아더장군.html" scrolling="no"></iframe>
            </div>

            <div id="char-minwoo" class="character-wrapper">
                <iframe src="민우.html" scrolling="no"></iframe>
            </div>

            <div id="char-seoyeon" class="character-wrapper">
                <iframe src="서연.html" scrolling="no"></iframe>
            </div>

        </div>

        <div id="item-overlay" onclick="closeItemOverlay()">
            <div class="item-card" onclick="event.stopPropagation()">
                <div class="item-icon">🔑</div>
                <h3 style="font-family:'Nanum Myeongjo', serif; color:#8c3030; margin-bottom:6px; font-size: 20px;">아이템 획득!</h3>
                <p style="font-size:15px; color:#2d3748; margin-bottom:15px;">날아다니는 열쇠를 붙잡아 <strong>황금 열쇠</strong>를 획득했습니다!</p>
                <button class="btn-submit" style="padding: 8px 24px;" onclick="closeItemOverlay()">확인</button>
            </div>
        </div>

        <button id="btn-prev" class="btn-nav" onclick="moveScene('G01.html')">이전</button>
        <button id="btn-next" class="btn-nav" style="display: none;" onclick="moveScene('G03.html')">다음</button>
    </div>

    <script>
        const CORRECT_ANSWER = "2110";
        let flyInterval = null;

        // 정답 검증 로직
        function checkQuizAnswer() {
            const userInput = document.getElementById("answer-field").value.trim();
            const feedbackEl = document.getElementById("feedback");

            if (userInput === CORRECT_ANSWER) {
                feedbackEl.className = "feedback-box feedback-success";
                feedbackEl.innerHTML = "정답일세! 사방으로 흩어진 황금 열쇠의 시간 에너지를 마우스로 붙잡아보게!";
                
                // 입력창 비활성화
                document.getElementById("answer-field").disabled = true;
                
                // 날아다니는 열쇠 미니게임 작동
                startFlyingKey();
            } else {
                feedbackEl.className = "feedback-box feedback-error";
                if (userInput.length < 4) {
                    feedbackEl.innerHTML = "네 자리 숫자의 형식으로 알맞게 기입해 주게나.";
                } else {
                    feedbackEl.innerHTML = "틀렸네. 만조 시간 사이의 흘러가는 일정한 규칙을 다시 한번 보게.";
                }
            }
        }

        // 황금열쇠가 화면 구역 안에서 불규칙하게 돌아다니도록 포지션 갱신
        function startFlyingKey() {
            const keyEl = document.getElementById("flying-key");
            keyEl.style.display = "block";
            
            moveKeyRandomly();
            flyInterval = setInterval(moveKeyRandomly, 800);
        }

        function moveKeyRandomly() {
            const keyEl = document.getElementById("flying-key");
            const container = document.getElementById("game-container");
            
            const maxX = container.clientWidth - 70;
            const maxY = container.clientHeight - 70;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            keyEl.style.left = randomX + "px";
            keyEl.style.top = randomY + "px";
        }

        // 날아다니는 황금 열쇠 클릭 성공 시 트리거
        function catchGoldenKey() {
            clearInterval(flyInterval);
            document.getElementById("flying-key").style.display = "none";
            
            // 보상 오버레이 오픈
            document.getElementById("item-overlay").classList.add("active");

            // 다음 네비게이션 버튼 노출
            document.getElementById("btn-next").style.display = "block";
        }

        function closeItemOverlay() {
            document.getElementById("item-overlay").classList.remove("active");
        }

        function moveScene(url) {
            if (url) {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
