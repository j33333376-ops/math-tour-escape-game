<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - A03</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 공통 스타일 및 레이아웃 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        #game-container {
            width: 1066px;
            aspect-ratio: 16 / 9;
            max-width: 1066px;
            background-color: #f5f0e6;
            position: relative;
            overflow: hidden;
            border: 4px solid #d4af37;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* 상단 표시바 */
        .top-bar {
            position: absolute;
            top: 0; left: 0; width: 100%;
            background: rgba(45, 55, 72, 0.85);
            border-bottom: 2px solid #d4af37;
            color: #d4af37;
            padding: 10px 20px;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            display: flex;
            justify-content: space-between;
        }

        /* 에셋 배치 레이어 */
        .stage-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
        }

        /* 캐릭터 기본 스타일 */
        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 20px;
            z-index: 3;
            overflow: visible;
        }
        #char-minwoo { left: 40px; }
        #char-seoyeon { right: 40px; transform: scaleX(-1); }

        /* 퀴즈 컨테이너 */
        .quiz-container {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            background: rgba(245, 240, 230, 0.95);
            border: 3px double #8c3030;
            border-radius: 8px;
            padding: 20px;
            z-index: 5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-family: 'Noto Sans KR', sans-serif;
        }

        .quiz-progress {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 14px;
            color: #8c3030;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .speech-bubble {
            background: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 15px;
            line-height: 1.6;
            color: #2d3748;
        }
        .speech-bubble strong {
            font-family: 'Nanum Gothic Coding', monospace;
            color: #8c3030;
            display: block;
            margin-bottom: 4px;
        }

        /* 빈칸 표시 상자 */
        .blank-box {
            display: inline-block;
            border-bottom: 2px dashed #8c3030;
            color: #8c3030;
            font-weight: bold;
            padding: 0 4px;
            letter-spacing: 2px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .quiz-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #8c3030;
            background: #fff;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            border-radius: 4px;
        }
        .quiz-input:focus { outline: 2px solid #d4af37; }

        .btn-submit {
            background: #8c3030;
            color: white;
            border: 1px solid #d4af37;
            padding: 0 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-submit:hover { background: #661f1f; }

        .feedback-msg {
            font-size: 14px;
            min-height: 20px;
            font-weight: bold;
        }
        .msg-error { color: #cc3333; }
        .msg-success { color: #2f855a; }

        /* 네비게이션 버튼 */
        .btn-nav {
            position: absolute;
            background: #8c3030;
            color: white;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            text-decoration: none;
            font-size: 15px;
        }
        .btn-nav:hover { background: #661f1f; }
        #btn-prev { left: 20px; bottom: 20px; }
        #btn-next { right: 20px; bottom: 20px; display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="top-bar">
        <span>차이나타운 체험학습앱</span>
        <span>미션: 4대 패루 퀴즈 풀기</span>
    </div>

    <div class="stage-layer">
        <div style="position:absolute; left:240px; bottom:20px; width:585px; height:422px; overflow:hidden; z-index:1;">
            <iframe src="A_패루.html" scrolling="no" style="border:0; width:900px; height:650px; transform:scale(0.65); transform-origin:top left;"></iframe>
        </div>
    </div>

    <div class="char-wrapper" id="char-minwoo">
        <iframe src="민우.html" scrolling="no" style="border:0; width:260px; height:320px; overflow:hidden; background:transparent;"></iframe>
    </div>
    <div class="char-wrapper" id="char-seoyeon">
        <iframe src="서연.html" scrolling="no" style="border:0; width:260px; height:320px; overflow:hidden; background:transparent;"></iframe>
    </div>

    <div class="quiz-container">
        <div class="quiz-progress" id="quiz-step">QUESTION 1 / 4</div>
        
        <div class="speech-bubble">
            <strong id="speaker-q">민우</strong>
            <span id="text-question">문제를 불러오는 중입니다...</span>
        </div>

        <div class="speech-bubble" style="border-color: #8c3030;">
            <strong>서연</strong>
            <span id="text-answer">그건 바로 <span class="blank-box" id="blank-view">□□□□</span>야!</span>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" class="quiz-input" placeholder="정답을 입력하세요" autocomplete="off">
            <button type="button" class="btn-submit" onclick="checkAnswer()">확인</button>
        </div>
        <div class="feedback-msg" id="feedback"></div>
    </div>

    <a href="A02.html" class="btn-nav" id="btn-prev">이전</a>
    <a href="index.html" class="btn-nav" id="btn-next">다음</a>
</div>

<script>
    // 퀴즈 데이터셋
    const quizData = [
        {
            question: "인천역 맞은편에 있는 제1패루 '중화가'는 과거 목조 패루가 있던 자리에 새로 지어진 것입니다. 현재의 석조 패루가 세워진 연도는 몇 년도일까요?",
            blankText: "□□□□년",
            answer: "2000년",
            hint: "힌트: 2000 혹은 2000년으로 입력해 보세요."
        },
        {
            question: "제2패루 '인화문'은 다른 패루들과 달리, 지붕 아래 부재를 받쳐주는 '이것'이 없이 문 형태로만 이루어진 것이 특징입니다. '이것'은 무엇일까요?",
            blankText: "□□",
            answer: "처마",
            hint: "힌트: 지붕 아래에 길게 나온 전통 건축 구조입니다."
        },
        {
            question: "제3패루 '선린문'을 통과하면 중국 초나라와 한나라의 역사를 그림으로 볼 수 있는 거리가 나옵니다. 이 거리의 이름은 무엇일까요?",
            blankText: "□□□ □□□□",
            answer: "초한지 벽화거리",
            hint: "힌트: 초나라와 한나라의 역사 벽화가 있는 거리입니다."
        },
        {
            question: "제4패루 '한중문' 주변에는 중국인들이 재물의 신으로 모시는 삼국지 인물의 동상이 있습니다. 이 인물은 누구일까요?",
            blankText: "□□",
            answer: "관우",
            hint: "힌트: 삼국지에서 유비와 결의를 맺은 의리의 명장입니다."
        }
    ];

    let currentIdx = 0;

    function loadQuiz() {
        const currentQuiz = quizData[currentIdx];
        document.getElementById('quiz-step').innerText = `QUESTION ${currentIdx + 1} / ${quizData.length}`;
        document.getElementById('text-question').innerText = currentQuiz.question;
        document.getElementById('blank-view').innerText = currentQuiz.blankText;
        document.getElementById('user-input').value = "";
        document.getElementById('feedback').innerText = "";
        document.getElementById('feedback').className = "feedback-msg";
    }

    function checkAnswer() {
        // 입력값과 정답 문자열의 모든 공백 제거 처리
        let userInput = document.getElementById('user-input').value.replace(/\s+/g, "");
        const currentQuiz = quizData[currentIdx];
        const feedback = document.getElementById('feedback');
        
        let correctAnswer = currentQuiz.answer.replace(/\s+/g, "");
        let isCorrect = false;

        // 예외 대응 정답 판정
        if (currentIdx === 0) {
            // 1번 문제: "2000" 또는 "2000년" 둘 다 정답 처리
            if (userInput === "2000" || userInput === "2000년") {
                isCorrect = true;
            }
        } else if (currentIdx === 3) {
            // 4번 문제: "관우" 또는 "관우상" 둘 다 정답 처리
            if (userInput === "관우" || userInput === "관우상") {
                isCorrect = true;
            }
        } else {
            // 2, 3번 문제: 띄어쓰기를 무시하고 글자가 일치하면 정답 처리
            if (userInput === correctAnswer) {
                isCorrect = true;
            }
        }

        if (isCorrect) {
            feedback.innerText = "정답이야! 참 잘했어.";
            feedback.className = "feedback-msg msg-success";
            
            // 맞혔을 때 서연이의 답변 말풍선에 정답 채우기
            document.getElementById('blank-view').innerText = currentQuiz.answer;

            setTimeout(() => {
                currentIdx++;
                if (currentIdx < quizData.length) {
                    loadQuiz();
                } else {
                    // 전 문항 완료 시 연출
                    document.getElementById('quiz-step').innerText = "MISSION CLEAR";
                    document.getElementById('text-question').innerText = "네 개의 패루 문제를 모두 맞혔어! 정말 대단해.";
                    document.getElementById('text-answer').innerText = "덕분에 패루에 대해 완벽하게 알게 되었어. 고마워!";
                    document.querySelector('.input-area').style.display = 'none';
                    feedback.innerText = "미션 성공! 다음 장소로 이동할 수 있습니다.";
                    document.getElementById('btn-next').style.display = 'block';
                }
            }, 1500);

        } else {
            feedback.innerText = currentQuiz.hint;
            feedback.className = "feedback-msg msg-error";
        }
    }

    // 엔터키 처리
    document.getElementById('user-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    window.onload = loadQuiz;
</script>
</body>
</html>
