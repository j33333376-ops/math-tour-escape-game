<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>차이나타운 체험학습앱 - 홍예문</title>
    <style>
        /* 폰트 로드 */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 공통 컨테이너 규칙 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* 스테이지 상단 표시바 */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            border-bottom: 2px solid #d4af37;
            padding: 12px 24px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            z-index: 100;
        }

        .stage-title {
            font-family: 'Nanum Myeongjo', serif;
            color: #d4af37;
            font-size: 22px;
            font-weight: 700;
            margin: 0;
        }

        /* 건물 래퍼 */
        #building-wrapper {
            position: absolute;
            left: 335px; /* (1066 - 396) / 2 */
            bottom: 120px;
            width: 396px;
            height: 414px;
            overflow: hidden;
            z-index: 10;
        }

        /* 캐릭터 래퍼 */
        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 20px;
            overflow: visible;
            z-index: 20;
            transition: filter 0.3s ease; /* 화자 강조를 위한 부드러운 전환 */
        }

        #char-minwoo {
            left: 60px;
        }

        #char-seoyeon {
            right: 60px;
            transform: scaleX(-1);
        }

        /* 말하지 않는 캐릭터 어둡게 처리 */
        .inactive {
            filter: brightness(0.4);
        }

        /* 대화창 (유형 2) */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 140px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #d4af37;
            border-radius: 4px;
            padding: 20px 30px;
            box-sizing: border-box;
            z-index: 50;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 10px;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            color: #ffffff;
            line-height: 1.6;
            letter-spacing: -0.02em;
        }

        /* 공통 이동/스킵 버튼 */
        .btn-nav {
            position: absolute;
            background-color: #8c3030;
            color: white;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            z-index: 100;
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        #btn-prev { left: 20px; bottom: 20px; display: none; }
        #btn-next { right: 20px; bottom: 20px; display: none; }
        #btn-skip { right: 20px; bottom: 180px; } /* 대화창 위쪽에 배치 */
    </style>
</head>
<body>
    <div id="game-container">
        
        <div id="top-bar">
            <h1 class="stage-title">차이나타운 체험학습앱</h1>
        </div>

        <div id="building-wrapper">
            <iframe src="I_홍예문.html" scrolling="no" style="border:0; width:440px; height:460px; transform:scale(0.9); transform-origin:top left;"></iframe>
        </div>

        <div id="char-minwoo" class="char-wrapper"></div>
        <div id="char-seoyeon" class="char-wrapper"></div>

        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name"></div>
            <div id="dialogue-text"></div>
        </div>

        <button id="btn-prev" class="btn-nav" onclick="goPrev()">이전</button>
        <button id="btn-next" class="btn-nav" onclick="goNext()">다음</button>
        <button id="btn-skip" class="btn-nav" onclick="endDialogue()">건너뛰기</button>

    </div>

    <script>
        // --- 1. 페이지 이동 로직 ---
        const prevUrl = "I01.html";
        const nextUrl = "I03.html";

        function goPrev() { if(prevUrl) window.location.href = prevUrl; }
        function goNext() { if(nextUrl) window.location.href = nextUrl; }

        window.addEventListener('DOMContentLoaded', () => {
            const btnNext = document.getElementById('btn-next');
            if (!nextUrl || nextUrl.trim() === '') {
                btnNext.innerText = 'End';
            }
        });

        // --- 2. 대화 진행 (Visual Novel) 로직 ---
        const dialogues = [
            { speaker: "민우", text: "여기가 홍예문이구나.", target: "char-minwoo" },
            { speaker: "서연", text: "맞아, 여기가 홍예문이야. 생각보다 크기가 작네?", target: "char-seoyeon" },
            { speaker: "민우", text: "여기 안내문을 보니까 높이가 10m 정도래.", target: "char-minwoo" },
            { speaker: "서연", text: "안내문이 있어? 들어가기 전에 무슨 문인지 안내문을 함께 읽어보면서 알아가보자!", target: "char-seoyeon" },
            { speaker: "민우", text: "알겠어. 한 번 같이 읽어보자.", target: "char-minwoo" },
            { speaker: "안내문", text: "무지개처럼 생긴 문이라는 의미의 홍예문은 제물포항에서 경인철도 축현역쪽을 관통하는 문으로 1908년 축조되었다. 공사는 일본군 공병대가 맡았다. 화강암을 다듬어서 약 10m 높이로 쌓았는데 설계와 감독은 일본이 맡고 조선인과 중국인 노동자들이 공사에 참여하였다.", target: null },
            { speaker: "서연", text: "1908년에 지어진 문이구나.", target: "char-seoyeon" },
            { speaker: "민우", text: "일본이 물자 수송을 편하게 하기 위해 지은 문이네.", target: "char-minwoo" },
            { speaker: "서연", text: "그러네. 마냥 가볍게 생각할 문이 아니었구나...", target: "char-seoyeon" },
            { speaker: "민우", text: "한 번 홍예문에 대해서 자세히 알아봤으니 안으로 들어가서 본격적으로 최선생님께서 남기신 보물을 찾아볼까?", target: "char-minwoo" },
            { speaker: "서연", text: "그래! 들어가보자!", target: "char-seoyeon" }
        ];

        let currentIndex = 0; // 시작하자마자 첫 대사가 나오도록 0으로 설정

        function updateDialogueUI() {
            const current = dialogues[currentIndex];
            
            // 텍스트 갱신
            document.getElementById('speaker-name').innerText = current.speaker;
            document.getElementById('dialogue-text').innerText = current.text;

            // 캐릭터 하이라이트 처리 (말하는 사람 밝게, 나머지는 어둡게)
            document.querySelectorAll('.char-wrapper').forEach(el => {
                if (el.id === current.target) {
                    el.classList.remove('inactive');
                } else {
                    el.classList.add('inactive');
                }
            });
        }

        function advanceDialogue() {
            currentIndex++;
            
            // 대화가 끝났을 경우
            if (currentIndex >= dialogues.length) {
                endDialogue();
                return;
            }

            updateDialogueUI();
        }

        function endDialogue() {
            // 대화창 및 스킵 버튼 숨기기
            document.getElementById('dialogue-box').style.display = 'none';
            document.getElementById('btn-skip').style.display = 'none';
            
            // 모든 캐릭터 밝기 원상복구
            document.querySelectorAll('.char-wrapper').forEach(el => {
                el.classList.remove('inactive');
            });

            // 이전/다음 이동 버튼 표시
            document.getElementById('btn-prev').style.display = 'block';
            document.getElementById('btn-next').style.display = 'block';
        }

        // --- 3. 에셋(인물) Fetch 로드 로직 ---
        async function loadCharacter(containerId, filename) {
            const container = document.getElementById(containerId);
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('Fetch failed');
                const html = await response.text();
                container.innerHTML = html;
            } catch (error) {
                console.warn(`${filename} 로드 실패. iframe 모드로 대체합니다.`, error);
                container.innerHTML = `<iframe src="${filename}" scrolling="no" style="border:0; width:260px; height:320px; background:transparent; overflow:hidden;"></iframe>`;
            }
        }

        // 초기 인물 로드 후 첫 대사 뿌리기
        Promise.all([
            loadCharacter('char-minwoo', '민우.html'),
            loadCharacter('char-seoyeon', '서연.html')
        ]).then(() => {
            updateDialogueUI(); // 인물이 그려진 뒤 첫 번째 대사와 하이라이트 상태를 적용합니다.
        });
    </script>
</body>
</html>
