<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - 삼국지 벽화거리</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        :root {
            --dark-red: #8c3030;
            --antique-gold: #d4af37;
            --warm-beige: #f5f0e6;
            --text-dark: #2d3748;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 16:9 비율 고정 및 기본 배경 설정 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: var(--warm-beige);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* 상단 스테이지 표시바 */
        #stage-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--antique-gold);
            padding: 8px 30px;
            border-radius: 4px;
            z-index: 100;
        }
        #stage-bar h1 {
            margin: 0;
            font-family: 'Nanum Myeongjo', serif;
            color: var(--antique-gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        /* 공통 네비게이션 버튼 */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            background-color: var(--dark-red);
            color: white;
            border: 1px solid var(--antique-gold);
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            z-index: 100;
            transition: background-color 0.2s ease;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        }
        .btn-nav:hover {
            background-color: #661f1f;
        }
        #btn-prev { left: 20px; }
        #btn-next { right: 20px; }

        /* 상황 설명 박스 (유형 1 양피지 스타일) */
        #situation-box {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            background-color: var(--warm-beige);
            border: 2px solid var(--antique-gold);
            padding: 35px;
            border-radius: 8px;
            box-shadow: inset 0 0 40px rgba(140, 48, 48, 0.05), 5px 5px 15px rgba(0, 0, 0, 0.5);
            z-index: 50;
            text-align: center;
        }
        #situation-box h2 {
            font-family: 'Nanum Myeongjo', serif;
            color: var(--dark-red);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.5);
            padding-bottom: 10px;
        }
        #situation-box p {
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            letter-spacing: -0.02em;
            font-size: 1.15rem;
            margin-bottom: 0;
            word-break: keep-all;
        }
        #situation-box .highlight {
            color: var(--dark-red);
            font-weight: bold;
            font-family: 'Nanum Gothic Coding', monospace;
        }

        /* 건물 배경 컨테이너 */
        /* 원본 1400x620 -> 무대 높이(~600px)의 70% 목표 = 배율 0.7 사용 (980x434) */
        #building-wrapper {
            position: absolute;
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%);
            width: 980px;  /* 1400 * 0.7 */
            height: 434px; /* 620 * 0.7 */
            overflow: hidden;
            z-index: 1;
        }
        #building-iframe {
            width: 1400px;
            height: 620px;
            border: 0;
            transform: scale(0.7);
            transform-origin: top left;
        }

        /* 캐릭터 컨테이너 */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            z-index: 10;
            overflow: visible !important; /* 호흡 애니메이션 잘림 방지 */
        }
        #character-minwoo {
            left: 80px;
            bottom: 10px;
        }
        #character-sangsang {
            right: 80px;
            bottom: 40px; /* 공중에 떠 있는 느낌을 위해 살짝 높게 */
            transform: scaleX(-1); /* 민우를 바라보도록 좌우 반전 */
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="stage-bar">
        <h1>제 1장. 시작된 여정</h1>
    </div>

    <div id="building-wrapper">
        <iframe id="building-iframe" src="F_삼국지벽화거리.html" scrolling="no"></iframe>
    </div>

    <div id="character-minwoo" class="character-wrapper"></div>
    <div id="character-sangsang" class="character-wrapper"></div>

    <div id="situation-box">
        <h2>삼국지 벽화거리의 비밀</h2>
        <p>
            민우는 처음 보는 거대한 <span class="highlight">삼국지 벽화거리</span>의 모습에 어리둥절한 표정으로 주변을 두리번거린다.<br><br>
            그때, 안내 로봇 상상이가 다가와 말을 건넨다.<br>
            "이 벽화거리 속 3개의 장면에서 퀴즈를 모두 해결하면, <span class="highlight">제갈량의 비책</span>을 얻을 수 있습니다!"
        </p>
    </div>

    <button id="btn-prev" class="btn-nav" onclick="window.location.href='index.html'">이전</button>
    <button id="btn-next" class="btn-nav" onclick="window.location.href='F02.html'">다음</button>
</div>

<script>
    /**
     * 지정된 URL의 HTML 에셋을 fetch로 가져와서 대상 요소에 삽입하는 함수
     * 로컬 환경(file://) 등 fetch가 막히는 경우를 대비해 iframe 방식을 fallback으로 사용
     */
    async function loadCharacter(url, elementId) {
        const wrapper = document.getElementById(elementId);
        try {
            const response = await fetch(url);
            if (response.ok) {
                const text = await response.text();
                wrapper.innerHTML = text;
            } else {
                throw new Error("Fetch failed");
            }
        } catch (error) {
            console.warn(`[${url}] Fetch 로드 실패, iframe 방식으로 대체합니다.`, error);
            // fallback 시 스크롤바가 생기지 않도록 속성 및 스타일 적용
            wrapper.innerHTML = `<iframe src="${url}" scrolling="no" style="border:0; width:100%; height:100%; overflow:hidden; background:transparent;"></iframe>`;
        }
    }

    window.onload = () => {
        // 등장인물 에셋 로드 (순차 혹은 병렬 무관하나 여기선 병렬 실행)
        loadCharacter("민우.html", "character-minwoo");
        loadCharacter("상상.html", "character-sangsang");
    };
</script>

</body>
</html>
