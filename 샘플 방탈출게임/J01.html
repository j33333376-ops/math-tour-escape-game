<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - J01</title>
    <style>
        /* 폰트 로드 */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 전역 초기화 및 모니터 규격 고정 */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1510;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 16:9 메인 게임 컨테이너 */
        #game-container {
            width: 1066px;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6;
            position: relative;
            overflow: hidden;
            border: 4px solid #d4af37;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transition: all 0.5s ease-in-out;
        }

        /* 배경 레이어 (시기에 따라 가변) */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: background 1s ease-in-out, filter 0.5s ease;
            /* 초기 상태: 2026년 제물포구청 종합민원실 분위기 감성 표현 */
            background: linear-gradient(rgba(245, 240, 230, 0.85), rgba(230, 220, 200, 0.9)), 
                        repeating-linear-gradient(90deg, #eaddca 0px, #eaddca 100px, #dfd0be 100px, #dfd0be 200px);
        }

        /* 1933년 인천부청사 테마 클래스 */
        #game-container.past-theme #bg-layer {
            background: linear-gradient(rgba(140, 48, 48, 0.25), rgba(20, 15, 10, 0.85)),
                        linear-gradient(to right, #4a3b32 0%, #2b211a 50%, #4a3b32 100%);
            filter: sepia(40%) contrast(110%);
        }

        /* 암전 및 시공간 왜곡 연출 오버레이 */
        #glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            z-index: 10;
            pointer-events: none;
            transition: background-color 0.4s ease;
        }
        #game-container.glitch #glitch-overlay {
            background-color: rgba(0, 0, 0, 0.95);
            animation: flashGlitch 0.3s infinite alternate;
        }
        @keyframes flashGlitch {
            0% { background-color: rgba(0,0,0,0.95); }
            50% { background-color: rgba(140, 48, 48, 0.4); }
            100% { background-color: rgba(10, 5, 5, 0.98); }
        }

        /* 스테이지 상단 표시바 */
        #stage-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(45, 55, 72, 0.85);
            border: 2px solid #d4af37;
            padding: 8px 30px;
            border-radius: 4px;
            z-index: 20;
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 15pt;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            text-align: center;
        }

        /* 현대 소품 및 디스플레이 레이어 */
        .prop-element {
            position: absolute;
            z-index: 3;
            transition: opacity 0.5s ease;
        }
        .modern-prop { opacity: 1; }
        .past-prop { opacity: 0; }

        #game-container.past-theme .modern-prop { opacity: 0; pointer-events: none; }
        #game-container.past-theme .past-prop { opacity: 1; }

        /* 2026년 현수막 */
        #banner-2026 {
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d3748;
            color: #ffffff;
            border: 2px dashed #f5f0e6;
            padding: 5px 20px;
            font-size: 11pt;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 1933년 욱일기 및 대일본제국지도 */
        #banner-1933 {
            top: 70px;
            right: 40px;
            width: 140px;
            height: 90px;
            border: 2px solid #8c3030;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9pt;
            color: #8c3030;
            font-weight: bold;
            background: linear-gradient(45deg, #fff 45%, #8c3030 45%, #8c3030 55%, #fff 55%);
        }

        /* 1933년 김구 선생 거울 실루엣 연출 */
        #mystic-mirror {
            top: 80px;
            left: 45px;
            width: 110px;
            height: 160px;
            border: 3px solid #d4af37;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50% 50% 0 0;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #mirror-text {
            color: #ffcccc;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 9pt;
            text-align: center;
            padding: 5px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            text-shadow: 0 0 5px #8c3030;
        }

        /* 무대 중앙 오브젝트 (책상 및 장부) */
        #center-desk {
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            height: 110px;
            background: #5c4033;
            border: 3px solid #d4af37;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }
        #desk-prop-text {
            color: #f5f0e6;
            font-size: 9pt;
            padding: 8px;
            text-align: center;
            font-family: 'Nanum Gothic Coding', monospace;
        }

        /* [에셋 로딩 규칙] 등장 인물 컨테이너 지정 규격 무조건 준수 */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 80px;
            z-index: 5;
            overflow: visible; /* 숨김 처리로 인한 애니메이션 잘림 방지 */
            transition: all 0.5s ease-in-out;
        }
        
        /* 인물 개별 고정 배치 구조 */
        #char-minwoo  { left: 180px; }
        #char-seoyeon { left: 30px; }
        #char-chulmin { right: 180px; }
        #char-drchoi  { right: 30px; bottom: 120px; transform: scale(0.95); opacity: 0; }
        #char-kimgu   { left: 350px; bottom: 100px; transform: scale(0.9); opacity: 0; pointer-events: none;}

        /* 상황 설명 텍스트 박스 (양피지/오래된 서류 연출 스타일) - 캐릭터 가림 최소화를 위해 하단 배치 변경 */
        #situation-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 780px;
            min-height: 140px;
            background-color: #f5f0e6;
            border: 2px solid #8c3030;
            box-shadow: inset 0 0 20px rgba(140, 48, 48, 0.15), 0 8px 16px rgba(0,0,0,0.5);
            padding: 18px 25px;
            z-index: 25;
            border-radius: 2px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        #situation-container:hover {
            transform: translateX(-50%) scale(1.01);
        }
        #situation-container::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid #d4af37;
            pointer-events: none;
        }
        #situation-title {
            font-family: 'Nanum Gothic Coding', monospace;
            color: #8c3030;
            font-weight: bold;
            font-size: 11pt;
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }
        #situation-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 11pt;
            color: #2d3748;
            line-height: 1.6;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }
        #click-guide {
            position: absolute;
            right: 15px;
            bottom: 10px;
            font-size: 8pt;
            color: #8c3030;
            animation: blink 1.2s infinite;
            font-family: 'Noto Sans KR', sans-serif;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 공통 이동 네비게이션 버튼 구조 */
        .btn-nav {
            position: absolute;
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            font-size: 10.5pt;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .btn-nav:hover {
            background-color: #661f1f;
            transform: translateY(-1px);
        }
        #btn-prev {
            left: 20px;
            bottom: 20px;
        }
        #btn-next {
            right: 20px;
            bottom: 20px;
        }

        /* 사운드 이펙트 캡션 인디케이터 */
        #sound-effect-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(140, 48, 48, 0.9);
            border: 1px solid #d4af37;
            color: #ffffff;
            padding: 5px 12px;
            font-size: 9pt;
            font-family: 'Nanum Gothic Coding', monospace;
            border-radius: 3px;
            z-index: 22;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #sound-effect-indicator.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="bg-layer"></div>
        <div id="glitch-overlay"></div>

        <div id="stage-header">STAGE 1: 제물포구청 종합민원실 (2026년)</div>

        <div id="sound-effect-indicator">🔊 BGM: 평온한 행정실 테마</div>

        <div id="banner-2026" class="prop-element modern-prop">2026년 7월, 제물포구청 새 출발!</div>
        
        <div id="banner-1933" class="prop-element past-prop">大日本帝國 仁川府</div>
        <div id="mystic-mirror" class="prop-element past-prop">
            <div id="mirror-text">이 단단한 돌벽 아래,<br>민족의 숨결을 찾아라</div>
        </div>

        <div id="center-desk" class="prop-element">
            <div id="desk-prop-text">주요 소품: 리플릿 및 행정 서류 뭉치</div>
        </div>

        <div id="char-seoyeon" class="character-wrapper">
            <iframe src="서연.html" scrolling="no" style="border:0; width:260px; height:320px; overflow:hidden; background:transparent;"></iframe>
        </div>
        
        <div id="char-minwoo" class="character-wrapper">
            <iframe src="민우.html" scrolling="no" style="border:0; width:260px; height:320px; overflow:hidden; background:transparent;"></iframe>
        </div>

        <div id="char-chulmin" class="character-wrapper">
            <iframe src="철min.html" id="iframe-chulmin" scrolling="no" style="border:0; width:260px; height:320px; overflow:hidden; background:transparent;"></iframe>
        </div>

        <div id="char-drchoi" class="character-wrapper">
            <iframe src="닥터최.html" scrolling="no" style="border:0; width:260px; height:320px; overflow:hidden; background:transparent;"></iframe>
        </div>

        <div id="char-kimgu" class="character-wrapper">
            <iframe src="백범김구.html" scrolling="no" style="border:0; width:260px; height:320px; overflow:hidden; background:transparent;"></iframe>
        </div>

        <div id="situation-container" onclick="nextTimeline()">
            <div id="situation-title">현실 기록 조회 중...</div>
            <div id="situation-text">평화로운 2026년 제물포구청 민원실. 민우, 서연, 철민은 구청을 방문해 리플릿을 구경하고 있다. (클릭하여 진행)</div>
            <div id="click-guide">화면을 클릭하여 진행 ▶</div>
        </div>

        <button class="btn-nav" id="btn-prev" onclick="moveScene('index.html')">이전 화면</button>
        <button class="btn-nav" id="btn-next" onclick="moveScene('J02.html')">다음 장면</button>
    </div>

    <script>
        // 철민 파일명 매핑 정밀 보정 조치 (철민.html 호환성 대응)
        document.getElementById('iframe-chulmin').src = "철민.html";

        // 서사 연출 단계 관리 타임라인 배열 정의
        const timelineData = [
            {
                step: 1,
                header: "STAGE 1: 제물포구청 종합민원실 (2026년)",
                sound: "🔊 BGM: 평온한 행정실 테마",
                title: "민원실 탐방",
                text: "철민: \"야, 이 제물포구청 건물이 100년도 넘었다고? 완전 새 건물 같은데?\"\n서연: \"그게 바로 역사의 증거야. 일제가 지은 건물을 우리가 광복 후 시청, 이어서 구청으로 개축한 거잖아.\""
            },
            {
                step: 2,
                header: "STAGE 1: 제물포구청 종합민원실 (2026년)",
                sound: "🔊 소품 조사",
                title: "비정상 조짐 발견",
                text: "민우: \"멋지긴 한데... 여기서 일하면 매일 역사 교육받는 기분이겠네. 어? 이 명패 밑에 이상한 기계 장치가...\" (민우가 장치를 건드리는 순간 전등이 깜빡이기 시작합니다.)"
            },
            {
                step: 3,
                header: "⚠️ 시공간 왜곡 현상 발생",
                sound: "⚡ 콰르릉! 째깍째깍 (거대한 태엽 작동음)",
                title: "암전 및 시간 왜곡",
                text: "철민: \"어? 야 불이 왜 이래? 정전인가?!\" (천장의 LED 조명이 지지직거리며 완전히 꺼집니다. 사물들이 흔들리며 홀로그램 태엽 소용돌이가 방안을 휘감기 시작합니다.)",
                action: "glitch"
            },
            {
                step: 4,
                header: "STAGE 2: 인천부 청사 서생방 (1933년)",
                sound: "🎵 BGM: 무겁고 서늘한 어둠의 테마",
                title: "낯선 식민지 사무실",
                text: "백열등이 붉게 켜지자 벽면은 낡은 석조와 목재로 변했고, 빛바랜 욱일기와 대일본제국 지도가 걸려 있습니다. 플레이어들의 옷도 1933년의 복장으로 교체되었습니다.",
                action: "past"
            },
            {
                step: 5,
                header: "STAGE 2: 인천부 청사 서생방 (1933년)",
                sound: "👢 저벅... 저벅... (둔탁한 군화 소리)",
                title: "닥터최의 경고",
                text: "닥터 최(VO): \"하하하! 제물포구청까지 나를 쫓아온 쥐새끼들. 이 청사는 영원히 식민지 기지로 고정될 것이다! 60분 뒤 시간의 문이 닫히면 너희는 영원히 일본의 노예가 될 것이다!\"",
                action: "drchoi"
            },
            {
                step: 6,
                header: "STAGE 2: 인천부 청사 서생방 (1933년)",
                sound: "✨ 거울 속의 희미한 서광",
                title: "선조들의 투혼",
                text: "책상 위 낡은 거울에 백범 김구 선생의 실루엣이 스쳐 지나가며 붉은 글씨가 떠오릅니다: [이 단단한 돌벽 아래, 민족의 숨결을 찾아라]",
                action: "kimgu"
            },
            {
                step: 7,
                header: "STAGE 2: 인천부 청사 서생방 (1933년)",
                sound: "🚨 긴박한 탈출의 시작",
                title: "단서 추적 개시",
                text: "서연: \"김구 선생님?! 선생님도 이 청사에 수감되셨었잖아!\"\n민우: \"좋아, 군화 소리가 가까워지고 있어. 어서 책상 위 장부와 비밀을 풀 단서를 찾자!\" (작전 개시)"
            }
        ];

        let currentStepIdx = 0;
        const container = document.getElementById('game-container');
        const soundIndicator = document.getElementById('sound-effect-indicator');

        // 내레이션 타임라인 제어 함수
        function nextTimeline() {
            if (currentStepIdx < timelineData.length - 1) {
                currentStepIdx++;
                updateSceneState();
            } else {
                alert("모든 상황 연출 조회가 완료되었습니다. 우측 하단의 '다음 장면' 버튼을 눌러 게임을 시작하세요!");
            }
        }

        // 상태 전환 스크립트 핵심 로직
        function updateSceneState() {
            const data = timelineData[currentStepIdx];
            
            // 텍스트 동적 업데이트
            document.getElementById('stage-header').innerText = data.header;
            document.getElementById('situation-title').innerText = `[${data.title}]`;
            document.getElementById('situation-text').innerText = data.text;
            
            // 사운드 인디케이터 처리
            soundIndicator.innerText = data.sound;
            soundIndicator.classList.add('active');

            // 연출 액션 스위칭 분기 조절
            if (data.action === "glitch") {
                container.classList.add('glitch');
            } else if (data.action === "past") {
                container.classList.remove('glitch');
                container.classList.add('past-theme');
                document.getElementById('desk-prop-text').innerHTML = "칙칙한 목재 책상<br>(가타카나 장부, 일본도 위치)";
                document.getElementById('desk-prop-text').style.color = "#ffcccc";
            } else if (data.action === "drchoi") {
                document.getElementById('char-drchoi').style.opacity = "1";
            } else if (data.action === "kimgu") {
                document.getElementById('mirror-text').style.opacity = "1";
                document.getElementById('char-kimgu').style.opacity = "0.35"; // 유령 실루엣 연출 효과
            }
        }

        // 공통 장면 이동 함수 (규칙 준수: window.location.href 사용)
        function moveScene(url) {
            if (url) {
                window.location.href = url;
            }
        }

        // 초기 구동 실행
        window.onload = () => {
            updateSceneState();
        };
    </script>
</body>
</html>
