<!-- ===================================================
     [독립 컴포넌트 소스] 북한 군인 (Chulmin) - 군모 쏠림 최종 수정본
     =================================================== -->
<div class="north-korean-soldier-component" style="display: inline-block; overflow: visible !important;">
    
    <style>
        .nk-stage {
            position: relative;
            width: 260px;
            height: 320px;
            margin: 0 auto;
            animation: nk-breatheHuman 4s ease-in-out infinite;
            overflow: visible !important;
        }

        @keyframes nk-breatheHuman {
            0%, 100% { transform: scale(1) translateY(0px); }
            50% { transform: scale(1.01) translateY(-3px); }
        }

        /* 두상 기본 상자 */
        .nk-head-wrapper {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 130px;
            overflow: visible !important;
        }

        /* 귀 (좌우 대칭 고정) */
        .nk-ear-l, .nk-ear-r {
            position: absolute;
            top: 52px;
            width: 16px;
            height: 26px;
            background-color: #ffdbb5;
            border: 3.5px solid #8d5b4c;
            z-index: 2;
        }
        .nk-ear-l { left: -11px; border-radius: 50% 0 0 50%; transform: rotate(-10deg); }
        .nk-ear-r { right: -11px; border-radius: 0 50% 50% 0; transform: rotate(10deg); }

        /* 뒷머리 베이스 */
        .nk-hair-back {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 124px;
            height: 65px;
            background-color: #1a1512;
            border: 3.5px solid #0d0a08;
            border-radius: 40px 40px 20px 20px;
            z-index: 1;
        }

        /* 목 조인트 */
        .nk-neck {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 40px;
            background-color: #ffdbb5;
            border-left: 3.5px solid #8d5b4c;
            border-right: 3.5px solid #8d5b4c;
            z-index: 3;
        }

        /* 얼굴 피부 컨테이너 */
        .nk-face-skin {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffdbb5;
            border: 3.5px solid #8d5b4c;
            border-radius: 50px 50px 60px 60px;
            z-index: 4;
            overflow: hidden;
        }

        /* 이목구비 정중앙 정렬 */
        .nk-eyebrow-l, .nk-eyebrow-r {
            position: absolute;
            top: 52px;
            width: 20px;
            height: 5px;
            background-color: #1a1512;
            border-radius: 2px;
            z-index: 6;
        }
        .nk-eyebrow-l { left: 22px; transform: rotate(8deg); }
        .nk-eyebrow-r { right: 22px; transform: rotate(-8deg); }

        .nk-eye-l, .nk-eye-r {
            position: absolute;
            top: 64px;
            width: 15px;
            height: 15px;
            background-color: #221a15;
            border-radius: 50%;
            z-index: 6;
        }
        .nk-eye-l::after, .nk-eye-r::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
        }
        .nk-eye-l { left: 24px; }
        .nk-eye-r { right: 24px; }

        .nk-blush-l, .nk-blush-r {
            position: absolute;
            top: 80px;
            width: 18px;
            height: 9px;
            background-color: rgba(244, 63, 94, 0.35);
            border-radius: 50%;
            filter: blur(0.5px);
            z-index: 6;
        }
        .nk-blush-l { left: 16px; }
        .nk-blush-r { right: 16px; }

        .nk-mouth {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 4px;
            background-color: #b91c1c;
            border-radius: 2px;
            z-index: 6;
        }

        /* [핵심 수정] 군모 포지셔닝 보정 */
        /* width가 134px이므로 border 포함 총 크기를 계산해 정중앙정렬(left 50% + translateX) 처리 */
        .nk-military-hat {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%); 
            width: 134px;
            height: 55px;
            background-color: #55533a;
            border: 3.5px solid #383726;
            border-radius: 12px 12px 4px 4px;
            z-index: 10;
        }
        
        /* 군모 챙도 모자 상자 안에서 완전한 중앙 정렬 */
        .nk-hat-brim {
            position: absolute;
            bottom: -6.5px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px; /* 모자 몸통과 가로 폭 일치시켜 비틀어짐 방지 */
            height: 10px;
            background-color: #2e2d1f;
            border-radius: 0 0 8px 8px;
            z-index: 11;
        }

        /* 붉은 별 기장 역시 모자 정중앙으로 칼정렬 */
        .nk-red-star {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            background-color: #dc2626;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            border: 1px solid #fee2e2;
            z-index: 12;
        }

        /* 군복 상의 */
        .nk-uniform-top {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 124px;
            height: 110px;
            background-color: #55533a;
            border: 3.5px solid #383726;
            border-radius: 20px 20px 10px 10px;
            z-index: 7;
            overflow: hidden;
        }
        .nk-collar-center {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 24px;
            background-color: #43422e;
            border: 3px solid #383726;
            border-radius: 0 0 6px 6px;
            z-index: 9;
        }
        .nk-epaulet-l, .nk-epaulet-r {
            position: absolute;
            top: 4px;
            width: 26px;
            height: 10px;
            background-color: #d97706;
            border: 2px solid #92400e;
            z-index: 8;
        }
        .nk-epaulet-l { left: 2px; transform: rotate(-10deg); border-radius: 4px 2px 2px 4px; }
        .nk-epaulet-r { right: 2px; transform: rotate(10deg); border-radius: 2px 4px 4px 2px; }
        
        .nk-pocket-l, .nk-pocket-r {
            position: absolute;
            top: 42px;
            width: 32px;
            height: 24px;
            background-color: #4a4933;
            border: 2.5px solid #383726;
            border-radius: 3px;
        }
        .nk-pocket-l { left: 14px; }
        .nk-pocket-r { right: 14px; }
    </style>

    <div class="nk-stage">
        <div class="nk-head-wrapper">
            <div class="nk-hair-back"></div>
            <div class="nk-ear-l"></div>
            <div class="nk-ear-r"></div>
            <div class="nk-neck"></div>
            <div class="nk-face-skin">
                <div class="nk-eyebrow-l"></div>
                <div class="nk-eyebrow-r"></div>
                <div class="nk-eye-l"></div>
                <div class="nk-eye-r"></div>
                <div class="nk-blush-l"></div>
                <div class="nk-blush-r"></div>
                <div class="nk-mouth"></div>
            </div>
            <!-- 수평 축 완벽 정렬된 군모 레이어 -->
            <div class="nk-military-hat">
                <div class="nk-red-star"></div>
                <div class="nk-hat-brim"></div>
            </div>
        </div>

        <div class="nk-uniform-top">
            <div class="nk-collar-center"></div>
            <div class="nk-epaulet-l"></div>
            <div class="nk-epaulet-r"></div>
            <div class="nk-pocket-l"></div>
            <div class="nk-pocket-r"></div>
        </div>
    </div>
</div>
