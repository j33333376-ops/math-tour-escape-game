<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - I04</title>
    <style>
        /* 1. 폰트 구성 적용 */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        :root {
            --bg-dark: #1e1a15;
            --beige-bg: #f5f0e6;
            --dark-red: #8c3030;
            --dark-red-hover: #661f1f;
            --antique-gold: #d4af37;
            --text-dark: #2d3748;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.6;
            letter-spacing: -0.02em;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 16:9 비율 유지 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: var(--beige-bg);
            border: 4px double var(--antique-gold);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 스테이지 상단 표시바 */
        #stage-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background-color: rgba(26, 18, 10, 0.85);
            border-bottom: 2px solid var(--antique-gold);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        #stage-title {
            font-family: 'Nanum Myeongjo', serif;
            color: var(--antique-gold);
            font-weight: bold;
            font-size: 1.1rem;
        }

        #stage-subtitle {
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        /* 무대 연출 공간 */
        #stage-view {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: calc(100% - 45px);
        }

        /* 에셋 배경 배치 레이어 */
        .asset-environment {
            position: absolute;
            width: 100%;
            height: 100%;
            bottom: 0;
            left: 0;
        }

        /* 인물 겉싸개 프레임 규칙 및 말 안 할 때 어두워지는 효과(.inactive) */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            z-index: 5;
            transition: filter 0.4s ease, opacity 0.4s ease;
        }

        .character-wrapper.inactive {
            filter: brightness(0.4) grayscale(0.2);
        }

        .character-iframe {
            width: 260px;
            height: 320px;
            border: 0;
            overflow: hidden;
            background: transparent;
        }

        /* 대화창 유형 2 UI 디자인 */
        #dialogue-box {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            height: 140px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 2px solid var(--antique-gold);
            border-radius: 6px;
            padding: 15px 25px;
            cursor: pointer;
            z-index: 20;
            display: block;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            color: var(--antique-gold);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.4);
            display: inline-block;
            padding-bottom: 2px;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--text-light);
            font-size: 1rem;
            line-height: 1.6;
        }

        /* 공통 네비게이션 버튼 규칙 */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            background-color: var(--dark-red);
            color: var(--text-light);
            border: 1px solid var(--antique-gold);
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            z-index: 15;
            transition: background-color 0.3s;
            text-decoration: none;
            display: none; /* 대화 완료 전까진 기본 숨김 */
            text-align: center;
        }

        .btn-nav:hover {
            background-color: var(--dark-red-hover);
        }

        #btn-prev {
            left: 20px;
        }

        #btn-next {
            right: 20px;
        }

        #btn-skip {
            right: 20px;
            display: block; /* 대화 진행 중일 때는 보임 */
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 상단 인포바 -->
    <div id="stage-header">
        <div id="stage-title">I04. 홍예문 잠금 해제 완료</div>
        <div id="stage-subtitle">차이나타운 체험학습앱 — 근대 개항기</div>
    </div>

    <!-- 무대 뷰어 -->
    <div id="stage-view">
        <div class="asset-environment">
            <!-- [건물 로딩 규칙]: 원본 440x460 -> 배율 s=0.75 적용 (표시 가로세로: 330x345) -->
            <div style="position:absolute; left:360px; bottom:20px; width:330px; height:345px; overflow:hidden; z-index: 1;">
                <iframe src="I_홍예문.html" scrolling="no" style="border:0; width:440px; height:460px; transform:scale(0.75); transform-origin:top left; background:transparent;"></iframe>
            </div>

            <!-- [인물 로딩 규칙]: 좌측 민우, 서연 배치 / 우측 닥터최 마주보게 배치(scaleX) -->
            <!-- 민우 -->
            <div id="char-minwoo" class="character-wrapper" style="left: 40px; bottom: 20px;">
                <iframe src="민우.html" scrolling="no" class="character-iframe"></iframe>
            </div>
            <!-- 서연 -->
            <div id="char-seoyeon" class="character-wrapper" style="left: 170px; bottom: 20px;">
                <iframe src="서연.html" scrolling="no" class="character-iframe"></iframe>
            </div>
            <!-- 닥터최 (우측 배치 및 좌우 반전으로 마주보게 구성) -->
            <div id="char-choi" class="character-wrapper" style="right: 50px; bottom: 20px; transform: scaleX(-1);">
                <iframe src="닥터최.html" scrolling="no" class="character-iframe"></iframe>
            </div>
        </div>

        <!-- 유형 2: 대화창 UI 구조 -->
        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name">민우</div>
            <div id="dialogue-text">대사가 로딩 중입니다... 잠시만 기다려 주세요.</div>
        </div>
    </div>

    <!-- 탐색 및 제어 시스템 버튼 -->
    <a href="I04.html" class="btn-nav" id="btn-prev">이전 장면</a>
    <a href="index.html" class="btn-nav" id="btn-next">다음 장면</a>
    <button class="btn-nav" id="btn-skip" onclick="skipDialogue()">건너뛰기(Skip)</button>
</div>

<script>
    // 대화 데이터 배열 관리 (요청 사항을 번갈아가며 대화형식으로 구성)
    const dialogues = [
        {
            speaker: "민우",
            text: "선생님! 이것 좀 보세요! 드디어 홍예문 퍼즐을 풀고 이 영롱한 '홍예문 펜던트'를 획득했어요!",
            target: "char-minwoo"
        },
        {
            speaker: "서연",
            text: "정말 고생 끝에 얻은 귀한 보물이에요. 은은하게 빛나는 게 근대 개항기의 역사가 고스란히 담겨있는 느낌이에요.",
            target: "char-seoyeon"
        },
        {
            speaker: "닥터최",
            text: "하하, 대단하구나 얘들아! 까다로운 문양 수식 퍼즐이었을 텐데 훌륭하게 풀어냈어. 아주 자랑스럽다.",
            target: "char-choi"
        },
        {
            speaker: "민우",
            text: "헤헤, 닥터최 선생님의 힌트 덕분이죠! 이제 이 구역의 비밀은 풀었으니, 다음 퀴즈 탐색을 이어가야 해요.",
            target: "char-minwoo"
        },
        {
            speaker: "서연",
            text: "맞아요. 메인 지도 화면으로 돌아가서 우리가 가야 할 다음 코스를 다시 확인하고 움직여요. 어서 index 화면으로 가요!",
            target: "char-seoyeon"
        },
        {
            speaker: "닥터최",
            text: "좋다, 그럼 서둘러 출발하자꾸나. 다음 탐정 단서도 만만치 않을 테니 긴장 늦추지 말고!",
            target: "char-choi"
        }
    ];

    let currentIndex = 0;

    // 대화 진행 함수
    function advanceDialogue() {
        if (currentIndex < dialogues.length) {
            const current = dialogues[currentIndex];
            
            // 텍스트 업데이트
            document.getElementById("speaker-name").innerText = current.speaker;
            document.getElementById("dialogue-text").innerText = current.text;

            // 캐릭터 비활성화(.inactive) 토글 제어
            const wrappers = ["char-minwoo", "char-seoyeon", "char-choi"];
            wrappers.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (id === current.target) {
                        el.classList.remove("inactive");
                    } else {
                        el.classList.add("inactive");
                    }
                }
            });

            currentIndex++;
        } else {
            // 모든 대화 종료 시 처리
            endDialogueScene();
        }
    }

    // 대화 스킵 처리
    function skipDialogue() {
        endDialogueScene();
    }

    // 대화 시퀀스 종료 후 UI 전환
    function endDialogueScene() {
        // 대화창 및 스킵 버튼 제거
        document.getElementById("dialogue-box").style.display = "none";
        document.getElementById("btn-skip").style.display = "none";

        // 모든 인물 활성화 처리
        const wrappers = ["char-minwoo", "char-seoyeon", "char-choi"];
        wrappers.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.remove("inactive");
        });

        // 네비게이션 버튼 세트 표출
        document.getElementById("btn-prev").style.display = "block";
        document.getElementById("btn-next").style.display = "block";
    }

    // 초기 첫 대화 자동 실행
    window.onload = function() {
        advanceDialogue();
    };
</script>

</body>
</html>
