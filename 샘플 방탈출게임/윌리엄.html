<!-- ===================================================
     [독립 컴포넌트 소스] 서양 신사 윌리엄 (William) - 구조 최종 수정본
     =================================================== -->
<div class="western-gentleman-component" style="display: inline-block; overflow: visible !important;">
    
    <style>
        .wt-stage {
            position: relative;
            width: 260px;
            height: 320px;
            margin: 0 auto;
            animation: wt-breatheHuman 4s ease-in-out infinite;
            overflow: visible !important;
        }

        @keyframes wt-breatheHuman {
            0%, 100% { transform: scale(1) translateY(0px); }
            50% { transform: scale(1.01) translateY(-3px); }
        }

        /* 두상 기본 상자 */
        .wt-head-wrapper {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 130px;
            overflow: visible !important;
        }

        /* 귀 */
        .wt-ear-l, .wt-ear-r {
            position: absolute;
            top: 52px;
            width: 16px;
            height: 26px;
            background-color: #fde0d9; /* 밝은 피부톤 */
            border: 3.5px solid #d49a89;
            z-index: 2;
        }
        .wt-ear-l { left: -11px; border-radius: 50% 0 0 50%; transform: rotate(-10deg); }
        .wt-ear-r { right: -11px; border-radius: 0 50% 50% 0; transform: rotate(10deg); }

        /* 서양 신사의 실크 해트 (Top Hat) */
        .wt-hat {
            position: absolute;
            top: -45px;
            left: 15px;
            width: 90px;
            height: 65px;
            background-color: #1c1917;
            border: 3.5px solid #000000;
            border-radius: 4px 4px 0 0;
            z-index: 10;
        }
        .wt-hat-brim {
            position: absolute;
            bottom: -3px;
            left: -15px;
            width: 120px;
            height: 10px;
            background-color: #1c1917;
            border: 3px solid #000000;
            border-radius: 10px;
        }
        .wt-hat-band {
            position: absolute;
            bottom: 6px;
            left: 0;
            width: 100%;
            height: 14px;
            background-color: #be123c; /* 붉은 리본 장식 */
        }

        /* 목 */
        .wt-neck {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 40px;
            background-color: #fde0d9;
            border-left: 3.5px solid #d49a89;
            border-right: 3.5px solid #d49a89;
            z-index: 3;
        }

        /* 얼굴 피부 컨테이너 */
        .wt-face-skin {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fde0d9;
            border: 3.5px solid #d49a89;
            border-radius: 50px 50px 60px 60px;
            z-index: 4;
            overflow: hidden;
        }

        /* 부드러운 형태의 눈썹 (금발/갈색) */
        .wt-eyebrow-l, .wt-eyebrow-r {
            position: absolute;
            top: 48px;
            width: 22px;
            height: 5px;
            background-color: #92400e;
            border-radius: 3px;
            z-index: 6;
        }
        .wt-eyebrow-l { left: 20px; transform: rotate(5deg); }
        .wt-eyebrow-r { right: 20px; transform: rotate(-5deg); }

        /* 파란 눈동자 */
        .wt-eye-l, .wt-eye-r {
            position: absolute;
            top: 60px;
            width: 14px;
            height: 14px;
            background-color: #0369a1; /* 푸른 눈 */
            border-radius: 50%;
            z-index: 6;
            border: 1.5px solid #082f49;
        }
        .wt-eye-l::after, .wt-eye-r::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
        }
        .wt-eye-l { left: 24px; }
        .wt-eye-r { right: 24px; }

        /* 서양식 핸들바 콧수염 */
        .wt-mustache-l, .wt-mustache-r {
            position: absolute;
            top: 86px;
            width: 26px;
            height: 10px;
            border-top: 5px solid #92400e;
            border-radius: 40% 40% 0 0;
            z-index: 8;
        }
        .wt-mustache-l { left: 25px; transform: rotate(-10deg); }
        .wt-mustache-r { right: 25px; transform: rotate(10deg); }

        /* 입 */
        .wt-mouth {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 6px;
            background-color: #9f1239;
            border-radius: 0 0 10px 10px;
            z-index: 6;
        }

        /* 클래식 정장 상의 (네이비) */
        .wt-uniform-top {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 110px;
            background-color: #1e293b; /* 네이비 정장 */
            border: 3.5px solid #0f172a;
            border-radius: 20px 20px 10px 10px;
            z-index: 7;
            overflow: hidden;
        }

        /* 흰 와이셔츠 */
        .wt-shirt {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 100%;
            background-color: #f8fafc;
            border-left: 2px solid #cbd5e1;
            border-right: 2px solid #cbd5e1;
            z-index: 8;
        }

        /* 넥타이 */
        .wt-tie {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 70px;
            background-color: #be123c;
            clip-path: polygon(50% 0%, 100% 20%, 50% 100%, 0% 20%);
            z-index: 9;
        }
        .wt-tie-knot {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 16px;
            background-color: #9f1239;
            border-radius: 2px;
            z-index: 10;
        }

        /* 정장 라펠 (옷깃) */
        .wt-lapel-l, .wt-lapel-r {
            position: absolute;
            top: 0;
            width: 40px;
            height: 75px;
            background-color: #1e293b;
            border-bottom: 3.5px solid #0f172a;
            z-index: 11;
        }
        .wt-lapel-l { 
            left: 12px; 
            border-right: 3.5px solid #0f172a;
            transform: rotate(-15deg); 
            border-radius: 0 0 20px 0; 
        }
        .wt-lapel-r { 
            right: 12px; 
            border-left: 3.5px solid #0f172a;
            transform: rotate(15deg); 
            border-radius: 0 0 0 20px; 
        }
    </style>

    <div class="wt-stage">
        <div class="wt-head-wrapper">
            <div class="wt-ear-l"></div>
            <div class="wt-ear-r"></div>
            <div class="wt-neck"></div>
            
            <div class="wt-face-skin">
                <div class="wt-eyebrow-l"></div>
                <div class="wt-eyebrow-r"></div>
                <div class="wt-eye-l"></div>
                <div class="wt-eye-r"></div>
                <div class="wt-mustache-l"></div>
                <div class="wt-mustache-r"></div>
                <div class="wt-mouth"></div>
            </div>
            
            <div class="wt-hat">
                <div class="wt-hat-band"></div>
                <div class="wt-hat-brim"></div>
            </div>
        </div>

        <div class="wt-uniform-top">
            <div class="wt-shirt"></div>
            <div class="wt-tie-knot"></div>
            <div class="wt-tie"></div>
            <div class="wt-lapel-l"></div>
            <div class="wt-lapel-r"></div>
        </div>
    </div>
</div>
