<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천 상상플랫폼</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1280px;
    }

    /* SVG 내부 스타일 — 인라인 style 속성 override 없이 순수 선언 */
    .building-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 지붕(경사면) */
    .roof-left  { fill: #cdd0d4; stroke: #a8acb0; stroke-width: 1; }
    .roof-right { fill: #cdd0d4; stroke: #a8acb0; stroke-width: 1; }
    .roof-edge-line { stroke: #888c90; stroke-width: 1; fill: none; }

    /* 외벽 */
    .wall-left  { fill: #e8e6e2; }
    .wall-right { fill: #e8e6e2; }

    /* 유리창 패널 */
    .glass-frame-left  { fill: #3a4850; }
    .glass-frame-right { fill: #3a4850; }
    .glass-panel { fill: url(#gl4); }
    .glass-divider { stroke: #2a3840; stroke-width: 1.5; fill: none; }
    .glass-highlight { fill: #fff; opacity: 0.12; }

    /* 나무 */
    .tree-trunk { fill: #5a7a4a; }
    .tree-trunk-dark { fill: #4a6a3a; }
    .tree-dark  { fill: #5a8a4a; }
    .tree-light { fill: #6aa05a; opacity: 0.85; }
    .tree-berry { fill: #d8a8a8; opacity: 0.7; }

    /* 간판 */
    .sign-bg-main { fill: #dde0e2; stroke: #b8bcc0; stroke-width: 1; }
    .sign-top     { fill: #c8ccd0; }
    .sign-text-main { fill: #2a4060; font-size: 24px; font-weight: bold; text-anchor: middle; }
    .sign-banner  { fill: #cc4040; }
    .sign-text-banner { fill: #fff; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .sign-label   { fill: #3a5070; opacity: 0.85; }
    .sign-label-text { fill: #fff; font-size: 13px; font-weight: bold; letter-spacing: 1; text-anchor: middle; }

    /* 지붕 기와선 */
    .roof-stripe { stroke: #aab0b4; stroke-width: 0.5; opacity: 0.7; fill: none; }

    /* 태양광 패널 */
    .solar-panel { fill: url(#solar4); }
    .solar-line  { stroke: #3a6888; stroke-width: 0.5; opacity: 0.6; fill: none; }
    .solar-highlight { fill: #fff; opacity: 0.1; }

    /* 우측 창고형 건물 */
    .store-wall  { fill: #d8d4d0; }
    .store-door  { fill: #8a4a2a; }
    .store-door-top { fill: #6a3818; }
    .store-stripe { stroke: #6a3818; stroke-width: 0.6; opacity: 0.5; fill: none; }
    .store-window { fill: #9ab4c0; opacity: 0.55; }
    .store-window-line { stroke: #7a94a0; stroke-width: 0.6; opacity: 0.6; fill: none; }
    .store-roof-edge { fill: #c8c6c2; }
    .store-base  { fill: #5a3818; }
    .store-corner { fill: #c8c6c2; }

    /* 좌측 창고형 건물 */
    .annex-window { fill: #9ab4c0; opacity: 0.55; }
    .annex-base   { fill: #c8c6c2; }

    /* 지면 */
    .ground-strip { fill: #f4f4f2; }
    .ground-shadow { fill: #000; opacity: 0.06; }
    .ground-line  { stroke: #d8d4cc; stroke-width: 1.5; stroke-dasharray: 14,10; opacity: 0.6; fill: none; }

    /* 기둥/지지대 */
    .pillar { stroke: #9a9a9a; stroke-width: 1.5; fill: none; }
    .pillar-cap { fill: #b8b8b0; stroke: #9a9a9a; stroke-width: 1.5; }

    /* 레일침목 */
    .sleeper { fill: #e8e6e0; opacity: 0.7; }

    /* 메인 건물 목재 */
    .beam-top  { fill: #8a4a2a; }
    .beam-dark { fill: #6a3818; }
    .beam-base { fill: #c8c6c2; }
  </style>
</head>

</body>
</html>
