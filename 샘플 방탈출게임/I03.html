<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>차이나타운 체험학습앱 - 홍예문 내부</title>
    <style>
        /* --- 폰트 로드 --- */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 공통 컨테이너 규칙 --- */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6; /* 따뜻한 연베이지 (양피지 느낌) */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* --- 스테이지 상단 표시바 --- */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            border-bottom: 2px solid #d4af37; /* 앤틱 골드 */
            padding: 12px 24px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            z-index: 100;
        }

        .stage-title {
            font-family: 'Nanum Myeongjo', serif;
            color: #d4af37;
            font-size: 22px;
            font-weight: 700;
            margin: 0;
        }

        /* --- 배경 건물 (홍예문) --- */
        /* 원본 440x460 -> 1.2배율 확대 (528x552)로 내부로 들어온 느낌 연출 */
        #building-wrapper {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 40px; 
            width: 528px;
            height: 552px;
            overflow: hidden;
            z-index: 10;
        }

        /* --- 등장 인물 --- */
        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 20px;
            overflow: visible;
            z-index: 20;
            transition: filter 0.3s ease;
        }

        #char-minwoo {
            left: 60px;
        }

        #char-seoyeon {
            right: 60px;
            transform: scaleX(-1); /* 서연이 중앙/민우를 바라보도록 좌우 반전 */
        }

        /* 말하지 않는 캐릭터 어둡게 처리 */
        .inactive {
            filter: brightness(0.4);
        }

        /* --- 대화창 (유형 2) --- */
        /* '한 명씩 번갈아 가면서 대화한다'는 요청에 따라 대화창 UI 적용 */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 140px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #d4af37;
            border-radius: 4px;
            padding: 20px 30px;
            box-sizing: border-box;
            z-index: 50;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 10px;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            color: #ffffff;
            line-height: 1.6;
            letter-spacing: -0.02em;
        }

        /* --- 공통 이동/스킵 버튼 --- */
        .btn-nav {
            position: absolute;
            background-color: #8c3030;
            color: white;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            z-index: 100;
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        #btn-prev { left: 20px; bottom: 20px; display: none; }
        #btn-next { right: 20px; bottom: 20px; display: none; }
        #btn-skip { right: 20px; bottom: 180px; } /* 대화창 위쪽에 배치 */
    </style>
</head>
<body>
    <div id="game-container">
        
        <div id="top-bar">
            <h1 class="stage-title">차이나타운 체험학습앱</h1>
        </div>

        <div id="building-wrapper">
            <iframe src="I_홍예문.html" scrolling="no" style="border:0; width:440px; height:460px; transform:scale(1.2); transform-origin:top left;"></iframe>
        </div>

        <div id="char-minwoo" class="char-wrapper"></div>
        <div id="char-seoyeon" class="char-wrapper"></div>

        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name"></div>
            <div id="dialogue-text"></div>
        </div>

        <button id="btn-prev" class="btn-nav" onclick="goPrev()">이전</button>
        <button id="btn-next" class="btn-nav" onclick="goNext()">다음</button>
        <button id="btn-skip" class="btn-nav" onclick="endDialogue()">건너뛰기</button>

    </div>

    <script>
        // --- 1. 페이지 이동 로직 ---
        const prevUrl = "I02.html";
        const nextUrl = "I04.html";

        function goPrev() { if(prevUrl) window.location.href = prevUrl; }
        function goNext() { if(nextUrl) window.location.href = nextUrl; }

        window.addEventListener('DOMContentLoaded', () => {
            const btnNext = document.getElementById('btn-next');
            if (!nextUrl || nextUrl.trim() === '') {
                btnNext.innerText = 'End';
            }
        });

        // --- 2. 대화 진행 로직 ---
        // 요청서의 "한 명씩 번갈아 가면서 대화한다" 조건에 맞춘 스토리 대사 생성
        const dialogues = [
            { speaker: "민우", text: "드디어 홍예문 안으로 들어왔네. 가까이서 보니까 아치형으로 된 벽돌 구조가 엄청 정교해.", target: "char-minwoo" },
            { speaker: "서연", text: "맞아. 세월의 흔적이 느껴지면서도 단단해 보여. 그런데 최 선생님께서 남기신 보물이 과연 이 안에 있을까?", target: "char-seoyeon" },
            { speaker: "민우", text: "분명히 이곳 어딘가에 힌트를 남겨두셨을 거야. 구석구석 자세히 살펴보자.", target: "char-minwoo" },
            { speaker: "서연", text: "잠깐, 민우야. 저기 위쪽 천장 좀 봐. 돌 틈 사이에 뭔가 있는 것 같지 않아?", target: "char-seoyeon" },
            { speaker: "민우", text: "어디? 앗... 정말이네! 뭔가 흐릿하게 글씨 같은 게 적혀 있는 것 같아. 조금 더 가까이 가보자.", target: "char-minwoo" }
        ];

        let currentIndex = 0; // 시작하자마자 첫 대사가 나오도록 0으로 설정

        function updateDialogueUI() {
            const current = dialogues[currentIndex];
            
            // 텍스트 갱신
            document.getElementById('speaker-name').innerText = current.speaker;
            document.getElementById('dialogue-text').innerText = current.text;

            // 캐릭터 하이라이트 처리 (말하는 사람 밝게, 나머지는 어둡게)
            document.querySelectorAll('.char-wrapper').forEach(el => {
                if (el.id === current.target) {
                    el.classList.remove('inactive');
                } else {
                    el.classList.add('inactive');
                }
            });
        }

        function advanceDialogue() {
            currentIndex++;
            
            // 대화가 끝났을 경우
            if (currentIndex >= dialogues.length) {
                endDialogue();
                return;
            }

            updateDialogueUI();
        }

        function endDialogue() {
            // 대화창 및 스킵 버튼 숨기기
            document.getElementById('dialogue-box').style.display = 'none';
            document.getElementById('btn-skip').style.display = 'none';
            
            // 모든 캐릭터 밝기 원상복구
            document.querySelectorAll('.char-wrapper').forEach(el => {
                el.classList.remove('inactive');
            });

            // 이전/다음 이동 버튼 표시
            document.getElementById('btn-prev').style.display = 'block';
            document.getElementById('btn-next').style.display = 'block';
        }

        // --- 3. 에셋(인물) Fetch 로드 로직 ---
        async function loadCharacter(containerId, filename) {
            const container = document.getElementById(containerId);
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('Fetch failed');
                const html = await response.text();
                container.innerHTML = html;
            } catch (error) {
                console.warn(`${filename} 로드 실패. iframe 모드로 대체합니다.`, error);
                container.innerHTML = `<iframe src="${filename}" scrolling="no" style="border:0; width:260px; height:320px; background:transparent; overflow:hidden;"></iframe>`;
            }
        }

        // 초기 인물 로드 후 첫 대사 뿌리기
        Promise.all([
            loadCharacter('char-minwoo', '민우.html'),
            loadCharacter('char-seoyeon', '서연.html')
        ]).then(() => {
            updateDialogueUI(); 
        });
    </script>
</body>
</html>
