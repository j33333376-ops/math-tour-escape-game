<div class="iop-museum-component" style="display: inline-block; overflow: visible !important;">
    
    <style>
        .iop-stage {
            position: relative;
            width: 500px;
            height: 380px;
            margin: 0 auto;
            overflow: visible !important;
        }

        /* =========================================
           1. 상단 지붕 및 돔 (Roof & Dome)
           ========================================= */
        /* 지붕 위 하얀색 간판 */
        .iop-sign {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 20px;
            background: #fdfdfd;
            border-top: 1px solid #ccc;
            box-shadow: inset 0 -3px 0 #ddd;
            z-index: 5;
        }

        /* 메인 보라색 사다리꼴 지붕 */
        .iop-roof {
            position: absolute;
            top: 25px;
            left: 50px;
            width: 400px;
            height: 75px;
            background-color: #83709b;
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
            /* 세로선 패턴 */
            background-image: repeating-linear-gradient(90deg, transparent 0, transparent 38px, #5a3a7f 38px, #5a3a7f 40px);
            z-index: 4;
        }
        
        /* 하단 지붕 짙은 테두리 */
        .iop-roof-base {
            position: absolute;
            top: 96px;
            left: 48px;
            width: 404px;
            height: 4px;
            background-color: #5a3a7f;
            z-index: 7;
        }

        /* 중앙 보라색 유리 돔 (Curved Glass Dome) */
        .iop-dome {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 75px;
            background-color: #83709b;
            border-radius: 70px 70px 0 0;
            border: 4px solid #5a3a7f;
            border-bottom: none;
            z-index: 6;
            overflow: hidden;
        }
        /* 돔 내부 3D 입체 유리 격자무늬 */
        .iop-dome-grid-v1 {
            position: absolute; bottom: -10%; left: 10%; width: 80%; height: 120%;
            border: 2px solid #fff; border-radius: 50%;
        }
        .iop-dome-grid-v2 {
            position: absolute; bottom: -10%; left: 30%; width: 40%; height: 120%;
            border: 2px solid #fff; border-radius: 50%;
        }
        .iop-dome-grid-h1 { position: absolute; top: 25px; left: 0; width: 100%; height: 2px; background: #fff; }
        .iop-dome-grid-h2 { position: absolute; top: 50px; left: 0; width: 100%; height: 2px; background: #fff; }
        .iop-dome-center { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 2px; height: 100%; background: #fff; }

        /* 좌우 소형 아치 지붕창 (Dormer Windows) */
        .iop-dormer {
            position: absolute;
            top: 45px;
            width: 32px;
            height: 55px;
            background: #18476f; /* 다크 블루 유리 */
            border-radius: 16px 16px 0 0;
            border: 4px solid #fff; /* 두꺼운 흰색 프레임 */
            z-index: 7;
        }
        .iop-dormer.left { left: 110px; }
        .iop-dormer.right { right: 110px; }


        /* =========================================
           2. 프리즈 및 코니스 (Frieze & Cornices)
           ========================================= */
        .iop-cornice-top {
            position: absolute;
            top: 100px;
            left: 10px;
            width: 480px;
            height: 15px;
            background: linear-gradient(to bottom, #fff, #dfdfdf);
            clip-path: polygon(2% 0, 98% 0, 100% 100%, 0 100%);
            z-index: 10;
        }
        
        .iop-frieze {
            position: absolute;
            top: 115px;
            left: 15px;
            width: 470px;
            height: 35px;
            background: #f6f5ef;
            z-index: 9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .iop-frieze-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .iop-frieze-circle {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: inset -1px -1px 3px rgba(0,0,0,0.1);
        }
        .iop-frieze-square {
            width: 24px;
            height: 18px;
            background: #fff;
            border: 4px solid #8e4918; /* 갈색 테두리 */
        }

        .iop-cornice-bot {
            position: absolute;
            top: 150px;
            left: 10px;
            width: 480px;
            height: 12px;
            background: linear-gradient(to bottom, #fff, #d0d0d0);
            clip-path: polygon(0 0, 100% 0, 98% 100%, 2% 100%);
            z-index: 10;
        }


        /* =========================================
           3. 메인 벽돌 외벽 (Main Brick Wall)
           ========================================= */
        .iop-wall {
            position: absolute;
            top: 162px;
            left: 15px;
            width: 470px;
            height: 200px;
            background-color: #f1f0ec;
            /* 엇갈린 벽돌 패턴을 위한 다중 그라디언트 겹침 */
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px),
                linear-gradient(rgba(0,0,0,0.2) 1px, transparent 1px);
            background-size: 32px 12px, 32px 12px, 100% 6px;
            background-position: 0 0, 16px 6px, 0 0;
            z-index: 1;
        }


        /* =========================================
           4. 격자 창문 (Grid Windows)
           ========================================= */
        .iop-window {
            position: absolute;
            top: 185px;
            width: 45px;
            height: 130px;
            background-color: #1e2933; /* 어두운 남색 유리 */
            border: 5px solid #fff;
            outline: 3px solid #8c4714; /* 바깥 갈색 테두리 */
            box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
            z-index: 5;
            /* 3열 4행 격자 (Muntins) */
            background-image:
                linear-gradient(90deg, transparent 30%, #fff 30%, #fff 35%, transparent 35%, transparent 65%, #fff 65%, #fff 70%, transparent 70%),
                linear-gradient(to bottom, transparent 23%, #fff 23%, #fff 27%, transparent 27%, transparent 48%, #fff 48%, #fff 52%, transparent 52%, transparent 73%, #fff 73%, #fff 77%, transparent 77%);
        }
        .iop-win-1 { left: 30px; }
        .iop-win-2 { left: 95px; }
        .iop-win-3 { right: 95px; }
        .iop-win-4 { right: 30px; }


        /* =========================================
           5. 중앙 현관 및 포르티코 (Central Portico)
           ========================================= */
        .iop-portico {
            position: absolute;
            top: 162px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 200px;
            z-index: 8;
        }

        /* 좌우 웅장한 기둥 (Pillars) */
        .iop-pillar-group {
            position: absolute;
            top: 0;
            width: 42px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .iop-pillar-group.left { left: 5px; }
        .iop-pillar-group.right { right: 5px; }

        .iop-cap-top {
            width: 42px; height: 16px;
            background: linear-gradient(to bottom, #fff, #ddd);
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
        }
        .iop-cap-sub { width: 32px; height: 6px; background: #eee; }
        
        .iop-pillar {
            width: 24px; height: 160px;
            background: #fff;
            box-shadow: inset -3px 0 5px rgba(0,0,0,0.05);
        }
        
        .iop-base-sub { width: 32px; height: 6px; background: #eee; }
        .iop-base-bot {
            width: 42px; height: 12px;
            background: linear-gradient(to top, #fff, #ddd);
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
        }

        /* 아치형 출입구 프레임 */
        .iop-door-surround {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 155px;
            background: #fff;
            border-radius: 50px 50px 0 0;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2), 0 0 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* 갈색-오렌지 메인 도어 */
        .iop-door {
            width: 80px;
            height: 145px;
            background: #cb6318;
            border-radius: 40px 40px 0 0;
            border: 2px solid #4a2106;
            position: relative;
        }
        
        /* 도어 상단 반원형 유리창 */
        .iop-door-glass-arch {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 32px;
            background: #2b333a;
            border-radius: 32px 32px 0 0;
            border: 2px solid #4a2106;
            overflow: hidden;
        }
        /* 반원형 내부 살대(Muntins) */
        .iop-door-glass-arch::before {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 3px; height: 100%; background: #cb6318;
        }
        .iop-door-glass-arch::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 3px; background: #cb6318; top: 50%;
        }

        /* 도어 하단 패널 */
        .iop-door-panels {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 94px;
            display: flex;
            gap: 4px;
        }
        .iop-door-col {
            flex: 1; display: flex; flex-direction: column; gap: 4px;
            border-right: 2px solid #4a2106;
            padding-right: 2px;
        }
        .iop-door-col:last-child { border-right: none; padding-right: 0; padding-left: 2px; }
        .iop-door-pane { flex: 1; background: #3d4246; border: 2px solid #4a2106; }


        /* =========================================
           6. 하단 몰딩 (Base Foundation)
           ========================================= */
        .iop-foundation-top {
            position: absolute;
            bottom: 8px;
            left: 5px;
            width: 490px;
            height: 10px;
            background: linear-gradient(to bottom, #fff, #ddd);
            clip-path: polygon(1% 0, 99% 0, 100% 100%, 0 100%);
            z-index: 10;
        }
        .iop-foundation-bot {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 500px;
            height: 8px;
            background: #fdfdfd;
            border-top: 1px solid #ccc;
            z-index: 9;
        }
    </style>

    <div class="iop-stage">
        
        <div class="iop-sign"></div>
        <div class="iop-roof"></div>
        <div class="iop-roof-base"></div>
        
        <div class="iop-dome">
            <div class="iop-dome-grid-v1"></div>
            <div class="iop-dome-grid-v2"></div>
            <div class="iop-dome-grid-h1"></div>
            <div class="iop-dome-grid-h2"></div>
            <div class="iop-dome-center"></div>
        </div>
        
        <div class="iop-dormer left"></div>
        <div class="iop-dormer right"></div>

        <div class="iop-cornice-top"></div>
        <div class="iop-frieze">
            <div class="iop-frieze-group">
                <div class="iop-frieze-circle"></div><div class="iop-frieze-circle"></div><div class="iop-frieze-circle"></div>
            </div>
            <div class="iop-frieze-group">
                <div class="iop-frieze-square"></div><div class="iop-frieze-square"></div><div class="iop-frieze-square"></div><div class="iop-frieze-square"></div>
            </div>
            <div class="iop-frieze-group">
                <div class="iop-frieze-circle"></div><div class="iop-frieze-circle"></div><div class="iop-frieze-circle"></div>
            </div>
        </div>
        <div class="iop-cornice-bot"></div>

        <div class="iop-wall"></div>

        <div class="iop-window iop-win-1"></div>
        <div class="iop-window iop-win-2"></div>
        <div class="iop-window iop-win-3"></div>
        <div class="iop-window iop-win-4"></div>

        <div class="iop-portico">
            
            <div class="iop-pillar-group left">
                <div class="iop-cap-top"></div><div class="iop-cap-sub"></div>
                <div class="iop-pillar"></div>
                <div class="iop-base-sub"></div><div class="iop-base-bot"></div>
            </div>
            
            <div class="iop-pillar-group right">
                <div class="iop-cap-top"></div><div class="iop-cap-sub"></div>
                <div class="iop-pillar"></div>
                <div class="iop-base-sub"></div><div class="iop-base-bot"></div>
            </div>

            <div class="iop-door-surround">
                <div class="iop-door">
                    <div class="iop-door-glass-arch"></div>
                    <div class="iop-door-panels">
                        <div class="iop-door-col">
                            <div class="iop-door-pane"></div><div class="iop-door-pane"></div>
                        </div>
                        <div class="iop-door-col">
                            <div class="iop-door-pane"></div><div class="iop-door-pane"></div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>

        <div class="iop-foundation-top"></div>
        <div class="iop-foundation-bot"></div>

    </div>
</div>
