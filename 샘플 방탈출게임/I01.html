<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - 홍예문</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 초기화 및 기본 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        /* 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #f5f0e6; /* 양피지 느낌의 연베이지 배경 */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* 스테이지 상단 표시바 */
        .stage-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid #d4af37;
            color: #d4af37;
            text-align: center;
            padding: 12px 0;
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.3rem;
            font-weight: 700;
            z-index: 100;
        }

        /* 공통 내비게이션 버튼 */
        .btn-nav {
            position: absolute;
            background-color: #8c3030;
            color: white;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s ease;
            display: none; /* 대화가 끝난 후 활성화 */
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next {
            right: 20px;
            bottom: 20px;
        }

        #btn-skip {
            right: 20px;
            bottom: 20px;
            display: block; /* 초기에 건너뛰기 버튼 활성화 */
        }

        /* 유형 2: 대화창 UI */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 140px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 15px 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            z-index: 500;
            box-sizing: border-box;
        }

        /* 화자 이름 */
        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 8px;
        }

        /* 대사 본문 */
        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.05rem;
            color: #ffffff;
            line-height: 1.6;
            letter-spacing: -0.02em;
        }

        /* 클릭 유도 화살표 */
        .click-prompt {
            position: absolute;
            right: 20px;
            bottom: 12px;
            color: #d4af37;
            font-size: 0.85rem;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        /* 캐릭터 래퍼 및 비활성화 상태 */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            z-index: 10;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        /* 말하지 않는 인물 어둡게 처리 */
        .character-wrapper.inactive {
            filter: brightness(0.4) grayscale(0.2);
        }

        /* 배경 및 건물 래퍼 */
        .building-wrapper {
            position: absolute;
            z-index: 1;
            overflow: hidden; 
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="stage-bar">제 1장 - 홍예문 앞</div>

        <div class="building-wrapper" style="left: 50%; bottom: 160px; transform: translateX(-50%); width: 396px; height: 414px;">
            <iframe src="I_홍예문.html" scrolling="no" style="border: 0; width: 440px; height: 460px; transform: scale(0.9); transform-origin: top left;"></iframe>
        </div>

        <div id="char-choi" class="character-wrapper" style="left: 120px; bottom: 40px;"></div>
        <div id="char-minwoo" class="character-wrapper" style="left: 580px; bottom: 40px; transform: scaleX(-1);"></div>
        <div id="char-seoyeon" class="character-wrapper" style="left: 800px; bottom: 40px; transform: scaleX(-1);"></div>

        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name"></div>
            <div id="dialogue-text"></div>
            <div class="click-prompt">▼ 클릭하여 계속</div>
        </div>

        <button id="btn-prev" class="btn-nav" onclick="location.href='index.html'">이전</button>
        <button id="btn-next" class="btn-nav" onclick="location.href='I02.html'">다음</button>
        <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
    </div>

    <script>
        // 대사 데이터 구조화 (마지막 대사 추가)
        const dialogues = [
            { speaker: "해설", text: "(민우와 서연이 거대한 화강암 아치형 터널인 홍예문을 올려다보며 감탄하고 있다.)", target: null },
            { speaker: "민우", text: "(고개를 뒤로 젖히며) 와, 선생님! 진짜 신기해요. 도심 한복판에 이런 바위를 뚫어서 만든 터널이 있다니요!", target: "char-minwoo" },
            { speaker: "서연", text: "정말요. 거대한 돌을 직접 깎아서 만든 거잖아요. 곡선 모양도 굉장히 정교하고요. 기계도 없던 시절에 이걸 어떻게 다 뚫었을까요?", target: "char-seoyeon" },
            { speaker: "닥터최", text: "(표정이 차분해지며) 겉으로 보기엔 정교한 건축 기술의 산물 같지만, 이 홍예문의 이면에는 아주 아픈 역사가 숨어 있단다.", target: "char-choi" },
            { speaker: "민우", text: "아픈 역사요? 그냥 길을 편하게 다니려고 만든 거 아니었어요?", target: "char-minwoo" },
            { speaker: "닥터최", text: "아니야. 1908년에 완공된 이 홍예문은, 당시 인천에 자리 잡은 일본인들이 자신들의 거주지와 항구를 더 빠르고 효율적으로 연결하기 위해 만든 통로였어. 말하자면, 우리 땅을 깎아 만든 ‘침략의 길’이었던 셈이지.", target: "char-choi" },
            { speaker: "서연", text: "(어두운 표정으로) 아... 그럼 이 길을 통해 우리나라의 물자들이 더 쉽게 빠져나갔겠네요?", target: "char-seoyeon" },
            { speaker: "닥터최", text: "맞아. 인천항을 통해 들어온 일본 세력이 자신들의 영향력을 확대하고, 우리 땅에서 생산되는 자원과 물자를 더 원활하게 수탈하기 위해 산을 강제로 깎아내고 뚫은 거야. 우리 민중들에게는 억지로 공사에 동원되어 고통받아야 했던 현장이기도 하고.", target: "char-choi" },
            { speaker: "민우", text: "(다시 터널을 바라보며) 그냥 멋있는 건축물인 줄로만 알았는데... 다시 보니까 저 돌들이 마치 당시 사람들의 희생을 누르고 있는 것처럼 느껴져요.", target: "char-minwoo" },
            { speaker: "닥터최", text: "단순히 수학적인 곡선이나 공학 기술로만 이 장소를 보지 않았으면 좋겠구나. 우리가 발을 딛고 있는 이 땅에 새겨진 뼈아픈 역사를 기억하는 것, 그것이 역사를 배우는 수학 동아리의 진짜 목적이니까.", target: "char-choi" },
            { speaker: "서연", text: "그렇다면 이제 우리 홍예문으로 들어가 볼까요?", target: "char-seoyeon" }
        ];

        let currentIndex = 0;

        // 대화 진행 핵심 로직
        function advanceDialogue() {
            if (currentIndex >= dialogues.length) {
                endDialogue();
                return;
            }

            const current = dialogues[currentIndex];
            
            // 화자 이름 및 대사 출력
            document.getElementById("speaker-name").innerText = current.speaker;
            document.getElementById("dialogue-text").innerText = current.text;

            // 캐릭터 하이라이트 상태 제어
            const wrappers = document.querySelectorAll(".character-wrapper");
            
            if (current.target) {
                wrappers.forEach(wrapper => {
                    if (wrapper.id === current.target) {
                        wrapper.classList.remove("inactive");
                    } else {
                        wrapper.classList.add("inactive");
                    }
                });
            } else {
                // 해설 등 타겟이 없을 경우 모든 캐릭터를 원래대로 밝게 하거나 연출 유지
                wrappers.forEach(wrapper => wrapper.classList.remove("inactive"));
            }

            currentIndex++;
        }

        // 대화 조기 종료 (건너뛰기)
        function skipDialogue() {
            endDialogue();
        }

        // 모든 대화 완료 후 처리
        function endDialogue() {
            document.getElementById("dialogue-box").style.display = "none";
            document.getElementById("btn-skip").style.display = "none";
            
            // 모든 캐릭터 원래 밝기로 복구
            const wrappers = document.querySelectorAll(".character-wrapper");
            wrappers.forEach(wrapper => wrapper.classList.remove("inactive"));

            // 이동 버튼 표시
            document.getElementById("btn-prev").style.display = "block";
            document.getElementById("btn-next").style.display = "block";
        }

        // 에셋 로딩용 fetch 함수
        async function loadCharacterHTML(filename, containerId) {
            const container = document.getElementById(containerId);
            try {
                const response = await fetch(filename);
                if (response.ok) {
                    const html = await response.text();
                    container.innerHTML = html;
                } else {
                    fallbackToIframe(filename, container);
                }
            } catch (error) {
                fallbackToIframe(filename, container);
            }
        }

        function fallbackToIframe(filename, container) {
            container.innerHTML = `<iframe src="${filename}" scrolling="no" style="width: 260px; height: 320px; border: 0; overflow: hidden; background: transparent;"></iframe>`;
        }

        // 초기 구동
        document.addEventListener("DOMContentLoaded", () => {
            loadCharacterHTML("닥터최.html", "char-choi");
            loadCharacterHTML("민우.html", "char-minwoo");
            loadCharacterHTML("서연.html", "char-seoyeon");
            
            // 첫 번째 대사 자동 출력
            advanceDialogue();
        });
    </script>
</body>
</html>
