<div class="hongyemun-component" style="display: inline-block; overflow: visible !important;">
    
    <style>
        .hym-stage {
            position: relative;
            width: 440px;
            height: 460px;
            margin: 0 auto;
        }

        /* =========================================
           1. 철제 난간 (Top Railing)
           ========================================= */
        .hym-railing {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            z-index: 1;
        }
        /* 세로 난간 기둥 */
        .hym-rail-posts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 54px, #4d4b4a 54px, #4d4b4a 62px);
            background-position: 25px 0;
        }
        /* 가로 바 (상단 & 중단) */
        .hym-rail-top {
            position: absolute;
            top: 15px;
            left: -10px;
            width: 460px;
            height: 6px;
            background-color: #555352;
        }
        .hym-rail-mid {
            position: absolute;
            top: 50px;
            left: -10px;
            width: 460px;
            height: 6px;
            background-color: #555352;
        }

        /* =========================================
           2. 상단 돌출 테두리 (Ledge / Cornice)
           ========================================= */
        .hym-ledge-top {
            position: absolute;
            top: 68px;
            left: -10px;
            width: 460px;
            height: 16px;
            background-color: #d8c4c0;
            z-index: 10;
        }
        .hym-ledge-bot {
            position: absolute;
            top: 84px;
            left: 0;
            width: 440px;
            height: 10px;
            background-color: #3d3b3a; /* 깊은 그림자 역할 */
            clip-path: polygon(0 0, 100% 0, 98% 100%, 2% 100%); /* 사다리꼴 모양 */
            z-index: 10;
        }

        /* =========================================
           3. 메인 벽돌 배경 (Main Brick Wall)
           ========================================= */
        .hym-wall {
            position: absolute;
            top: 94px;
            left: 0;
            width: 100%;
            height: 366px;
            background-color: #d2bba8; /* 기본 베이지톤 */
            
            /* 마법의 CSS: 흰색 줄눈(Mortar)과 넓은 컬러 패치를 겹쳐 
               불규칙한 파스텔톤 벽돌 패턴을 생성 */
            background-image:
                /* 1. 가로 줄눈 */
                linear-gradient(#fcfcfc 4px, transparent 4px),
                /* 2. 세로 줄눈 (홀수 열) */
                linear-gradient(90deg, transparent 44px, #fcfcfc 44px, #fcfcfc 48px, transparent 48px),
                /* 3. 세로 줄눈 (짝수 열 - 엇갈리게 배치) */
                linear-gradient(90deg, transparent 20px, #fcfcfc 20px, #fcfcfc 24px, transparent 24px, transparent 68px, #fcfcfc 68px, #fcfcfc 72px, transparent 72px),
                /* 4. 벽돌 색상 변형 필터 1 (더스티 핑크) */
                linear-gradient(135deg, rgba(145, 115, 115, 0.45) 25%, transparent 25%, transparent 75%, rgba(145, 115, 115, 0.45) 75%),
                /* 5. 벽돌 색상 변형 필터 2 (차분한 보라/회색조) */
                linear-gradient(45deg, rgba(220, 200, 200, 0.5) 20%, transparent 20%, transparent 80%, rgba(165, 145, 145, 0.5) 80%);
            
            background-size:
                100% 26px,      /* 가로줄 높이 간격 */
                96px 52px,      /* 홀수 열 블록 사이즈 */
                96px 52px,      /* 짝수 열 블록 사이즈 */
                192px 104px,    /* 컬러 필터 1 */
                288px 156px;    /* 컬러 필터 2 */
            
            background-position:
                0 0,
                0 4px,
                0 30px,
                0 0,
                0 0;
            z-index: 1;
        }

        /* =========================================
           4. 홍예(아치) 구조물 (Archway Elements)
           ========================================= */
        
        /* 4-1. 아치 곡선부 쐐기돌 (Radial Voussoirs) */
        .hym-voussoirs {
            position: absolute;
            bottom: 110px; /* 직선문 끝나는 지점 */
            left: 50%;
            margin-left: -125px; /* width 250px의 절반 */
            width: 250px;
            height: 125px;
            border-radius: 125px 125px 0 0;
            z-index: 2;
            
            /* Conic-gradient를 사용해 곡선을 따라 방사형으로 뻗는 벽돌을 구현 */
            background-image: repeating-conic-gradient(from -90deg at 50% 100%,
                #ab8f88 0, #ab8f88 12.5deg, #fcfcfc 12.5deg, #fcfcfc 15deg,
                #d8c2be 15deg, #d8c2be 27.5deg, #fcfcfc 27.5deg, #fcfcfc 30deg,
                #c6a9a3 30deg, #c6a9a3 42.5deg, #fcfcfc 42.5deg, #fcfcfc 45deg
            );
        }

        /* 4-2. 아치 좌우 직선부 벽돌 (Straight Side Bricks) */
        .hym-side-l, .hym-side-r {
            position: absolute;
            bottom: 0;
            width: 35px;
            height: 110px;
            z-index: 2;
            background-image: repeating-linear-gradient(to bottom,
                #ab8f88 0, #ab8f88 22px, #fcfcfc 22px, #fcfcfc 26px,
                #d8c2be 26px, #d8c2be 48px, #fcfcfc 48px, #fcfcfc 52px,
                #c6a9a3 52px, #c6a9a3 74px, #fcfcfc 74px, #fcfcfc 78px
            );
        }
        .hym-side-l {
            left: 50%;
            margin-left: -125px;
        }
        .hym-side-r {
            right: 50%;
            margin-right: -125px;
        }

        /* 4-3. 내부 어두운 프레임 & 흰색 통로 (Inner Frame & Opening) */
        .hym-door {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130px; 
            height: 175px; /* 순수 내부 흰색 공간 높이 */
            background-color: #ffffff;
            border: 25px solid #3d3b3a; /* 묵직한 다크 그레이 프레임 */
            border-bottom: none;
            border-radius: 90px 90px 0 0; /* (130/2) + 25 = 90 */
            z-index: 5;
        }
    </style>

    <div class="hym-stage">
        
        <div class="hym-railing">
            <div class="hym-rail-posts"></div>
            <div class="hym-rail-top"></div>
            <div class="hym-rail-mid"></div>
        </div>

        <div class="hym-ledge-top"></div>
        <div class="hym-ledge-bot"></div>

        <div class="hym-wall"></div>

        <div class="hym-voussoirs"></div> <div class="hym-side-l"></div>    <div class="hym-side-r"></div>    <div class="hym-door"></div>
        
    </div>
</div>
