<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - 한중문화관 앞</title>
    <style>
        /* 폰트 구성 및 초기화 */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            color: #2d3748;
            overflow: hidden;
        }

        /* 16:9 고정 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6; /* 양피지 느낌의 연베이지 배경 */
            background-image: radial-gradient(circle, rgba(245,240,230,1) 60%, rgba(212,175,55,0.1) 100%);
            border: 4px double #d4af37; /* 앤틱 골드 테두리 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* 스테이지 상단 표시바 */
        #stage-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(45, 55, 72, 0.85);
            border: 2px solid #d4af37;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-radius: 4px;
        }

        #stage-title {
            font-family: 'Nanum Myeongjo', serif;
            font-weight: bold;
            color: #d4af37;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        #stage-app-name {
            font-family: 'Nanum Gothic Coding', monospace;
            color: #ffffff;
            font-size: 0.9rem;
        }

        /* 무대 영역 (캐릭터 및 건물 배치) */
        #stage-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 상황 설명 박스 (유형 1) */
        .situation-box {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            background: #fdfaf2;
            border: 1px solid #8c3030;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15), inset 0 0 20px rgba(140, 48, 48, 0.05);
            padding: 18px 25px;
            border-radius: 4px;
            z-index: 5;
            text-align: center;
            line-height: 1.6;
            letter-spacing: -0.02em;
        }

        .situation-box p {
            margin-bottom: 8px;
            font-size: 1rem;
        }
        .situation-box p:last-child {
            margin-bottom: 0;
        }

        .highlight-red {
            color: #8c3030;
            font-weight: bold;
        }

        .highlight-gold {
            color: #b38f1d;
            font-weight: bold;
        }

        /* 캐릭터 컴포넌트 공통 스타일 (인물 로딩 규칙 적용) */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 20px;
            z-index: 3;
            overflow: visible; /* 애니메이션이나 후가공 처리가 잘리지 않도록 함 */
            transition: transform 0.3s ease;
        }

        /* 공통 네비게이션 버튼 스타일 */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-decoration: none;
            display: inline-block;
        }

        .btn-nav:hover {
            background-color: #661f1f;
        }

        .btn-nav:active {
            transform: scale(0.98);
        }

        #btn-prev {
            left: 20px;
        }

        #btn-next {
            right: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="stage-header">
            <div id="stage-title">제 1 장 : 한중문화관의 수수께끼</div>
            <div id="stage-app-name">차이나타운 체험학습앱</div>
        </div>

        <div class="situation-box">
            <p>한중문화관 앞에 도착하자, 이곳에서 근무하는 연구원 <span class="highlight-gold">미스터첸</span>이 인사를 건네왔습니다.</p>
            <p>"반갑네, 탐험가 친구들! 이곳은 한국과 중국의 역사와 문화가 숨 쉬는 한중문화관이라네."</p>
            <p class="highlight-red">★ 다음 단계로 나아가려면 미스터첸이 준비한 역사 퀴즈를 풀어야만 합니다!</p>
        </div>

        <div id="stage-view">
            <div style="position: absolute; left: 223px; bottom: 40px; width: 403px; height: 318.5px; overflow: hidden; z-index: 2;">
                <iframe src="H_한중문화관.html" scrolling="no" style="border: 0; width: 620px; height: 490px; transform: scale(0.65); transform-origin: top left;"></iframe>
            </div>

            <div id="char-minwoo" class="character-wrapper" style="left: 60px;">
                <iframe src="민우.html" scrolling="no" style="border:0; width:260px; height:320px; background:transparent;"></iframe>
            </div>

            <div id="char-seoyeon" class="character-wrapper" style="left: 230px;">
                <iframe src="서연.html" scrolling="no" style="border:0; width:260px; height:320px; background:transparent;"></iframe>
            </div>

            <div id="char-chen" class="character-wrapper" style="right: 80px; transform: scaleX(-1);">
                <iframe src="미스터첸.html" scrolling="no" style="border:0; width:260px; height:320px; background:transparent;"></iframe>
            </div>
        </div>

        <button id="btn-prev" class="btn-nav" onclick="navigateTo('index.html')">이전으로</button>
        <button id="btn-next" class="btn-nav" onclick="navigateTo('H02.html')">다음 단계로</button>
    </div>

    <script>
        /**
         * 지정된 URL로 현재 창에서 페이지를 이동시킵니다.
         * @param {string} url - 이동할 목적지 파일명
         */
        function navigateTo(url) {
            if (url && url.trim() !== '') {
                window.location.href = url;
            } else {
                alert('마지막 장면입니다.');
            }
        }

        // DOM 콘텐츠 로드 후 캐릭터 인젝션 실패 유효성 검증 및 예외 처리 로직 (선택 사항)
        document.addEventListener("DOMContentLoaded", function() {
            console.log("차이나타운 체험학습앱 - 근대 개항기 스타일 무대 로드 완료");
        });
    </script>
</body>
</html>
