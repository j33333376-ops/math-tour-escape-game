<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대불호텔의 비밀 - 2단계: 신기한 객실</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        }

        body {
            background-color: #2b0c14;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 1100px;
            background: #faf4ea;
            border: 6px double #d4af37;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 헤더 영역 */
        .game-header {
            background: #4a1521;
            color: #d4af37;
            text-align: center;
            padding: 15px;
            border-bottom: 3px solid #d4af37;
        }

        .game-header h1 {
            font-size: 22px;
            letter-spacing: 2px;
        }

        .game-header p {
            font-size: 14px;
            color: #f0e6d2;
            margin-top: 5px;
        }

        /* 메인 게임판 구조 */
        .game-main {
            display: flex;
            padding: 20px;
            gap: 20px;
            background-image: linear-gradient(rgba(250, 244, 234, 0.9), rgba(250, 244, 234, 0.9)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" fill="none" stroke="%23d4af37" stroke-width="0.5" stroke-opacity="0.2"/></svg>');
        }

        /* 왼쪽: 옷장(아이템 리스트) */
        .closet-section {
            flex: 1;
            background: #3e2723;
            border: 4px solid #5d4037;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            min-width: 280px;
        }

        .closet-title {
            color: #ffecb3;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid #ffecb3;
            padding-bottom: 5px;
            width: 100%;
            text-align: center;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 120px);
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        .clothing-item {
            background: #fff8e1;
            border: 2px solid #bcaaa4;
            border-radius: 8px;
            padding: 10px 8px;
            text-align: center;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none;
            z-index: 50;
        }

        .clothing-item.wrong-item {
            background: #eceff1;
            border-color: #b0bec5;
        }

        .clothing-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border-color: #d4af37;
        }

        .clothing-item:active {
            cursor: grabbing;
        }

        .clothing-item .icon {
            font-size: 36px;
            margin-bottom: 5px;
            display: block;
        }

        .clothing-item .name {
            font-size: 12px;
            font-weight: bold;
            color: #4e342e;
        }

        /* 오른쪽: 캐릭터 배치 영역 */
        .mannequin-section {
            flex: 2;
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .mannequin-card {
            background: #fff;
            border: 3px double #8d6e63;
            border-radius: 8px;
            width: 48%;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
        }

        .mannequin-card.male { border-color: #1565c0; background: #f4f6ec; }
        .mannequin-card.female { border-color: #c2185b; background: #fdf2f4; }

        .mannequin-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 3px 15px;
            border-radius: 20px;
            color: white;
            z-index: 10;
        }
        .male .mannequin-title { background: #1565c0; }
        .female .mannequin-title { background: #c2185b; }

        /* 오버레이 드롭 존 스타일 (안내 투명 레이어) */
        .drop-zone {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border: 2px dashed rgba(212, 175, 55, 0.4);
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, border-color 0.2s;
            z-index: 40;
            cursor: pointer;
        }

        .drop-zone.hovered {
            background-color: rgba(255, 224, 130, 0.4) !important;
            border-color: #ffb300 !important;
        }

        .zone-head {
            top: 45px;
            width: 130px;
            height: 125px;
            border-radius: 50%;
        }

        .zone-body {
            top: 175px;
            width: 140px;
            height: 125px;
            border-radius: 12px;
        }

        .zone-label {
            font-size: 11px;
            color: #78909c;
            font-weight: bold;
            background: rgba(255,255,255,0.7);
            padding: 2px 6px;
            border-radius: 10px;
            pointer-events: none;
        }

        .drop-zone.occupied .zone-label {
            display: none;
        }
        .drop-zone.occupied {
            border: none;
            background: transparent;
        }

        /* 내부 드롭 데이터 자체는 비가시화 (CSS 룩 변환으로 처리하므로 엘리먼트 숨김) */
        .drop-zone .clothing-item {
            display: none !important;
        }

        /* 하단: 대사창 */
        .dialogue-section {
            background: rgba(20, 20, 20, 0.95);
            color: #fff;
            padding: 20px;
            min-height: 110px;
            border-top: 4px solid #d4af37;
            position: relative;
        }

        .char-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffd54f;
            margin-bottom: 8px;
            display: inline-block;
            border-left: 4px solid #ffd54f;
            padding-left: 8px;
        }

        .char-text {
            font-size: 15px;
            line-height: 1.6;
            color: #e0e0e0;
            word-break: keep-all;
        }

        /* 제어 버튼 영역 */
        .control-panel {
            display: flex;
            justify-content: flex-end;
            padding: 12px 20px;
            background: #f5f0e6;
            border-top: 1px solid #e0d4be;
            gap: 10px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-check {
            background: #d4af37;
            color: #3e2723;
            border: 1px solid #b89322;
        }
        .btn-check:hover {
            background: #c29d2b;
        }

        .btn-reset {
            background: #cfd8dc;
            color: #37474f;
        }
        .btn-reset:hover {
            background: #b0bec5;
        }

        .btn-clear {
            background: #4caf50;
            color: white;
            display: none;
            animation: pulse 1.5s infinite;
        }
        .btn-clear:hover {
            background: #43a047;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        /* ===================================================
           [자연스럽게 입혀지는 의상 변동 전용 스타일 스크립트]
           =================================================== */
        
        /* 민우: 개항기 서양식 정장 변동 룩 */
        .suit-equipped .kmw-uniform-top {
            background-color: #4a2711 !important; /* 클래식 브라운 정장 자켓 */
            border-color: #2d1607 !important;
        }
        .suit-equipped .kmw-collar-l, .suit-equipped .kmw-collar-r {
            background-color: #fdfefe !important; /* 안쪽 깨끗한 하이 셔츠 깃 */
        }
        .suit-equipped .kmw-tie {
            background-color: #d4af37 !important; /* 스쿨 타이를 실크 개항기 크라바트 핀 형태로 탈바꿈 */
            border-color: #b49322 !important;
            border-radius: 50% !important;
            width: 22px !important;
            height: 22px !important;
            top: 12px !important;
        }
        .suit-equipped .kmw-tie::after {
            display: none !important; /* 기존 현대식 타이 꼬리 제거 */
        }

        /* 서연: 개항기 서양식 고풍 드레스 변동 룩 */
        .dress-equipped .ksy-uniform-top {
            background-color: #78281f !important; /* 빈티지 와인레드 벨벳 상의 드레스 */
            border-color: #511913 !important;
        }
        .dress-equipped .ksy-collar-l, .dress-equipped .ksy-collar-r {
            background-color: #f5f5f5 !important;
        }
        .dress-equipped .ksy-ribbon {
            display: none !important; /* 기존 스쿨 리본 제거 */
        }
        .dress-equipped .ksy-skirt {
            background: #78281f !important; /* 하의 스커트가 아래로 우아하게 이어져 긴 드레스로 변형 효과 */
            border-color: #511913 !important;
            height: 70px !important;
            bottom: -30px !important;
            border-radius: 5px 5px 28px 28px !important;
            z-index: 8 !important;
        }

        /* ===================================================
           [기본 캐릭터 베이스 스타일 컴포넌트]
           =================================================== */
        /* 서연 기본 구조 */
        .ksy-stage {
            position: relative;
            width: 260px;
            height: 320px;
            margin: 0 auto;
            animation: ksy-breatheHuman 4s ease-in-out infinite;
            overflow: visible !important;
        }
        @keyframes ksy-breatheHuman {
            0%, 100% { transform: scale(1) translateY(0px); }
            50% { transform: scale(1.01) translateY(-3px); }
        }
        .ksy-head-wrapper {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 130px;
            overflow: visible !important;
        }
        .ksy-ponytail {
            position: absolute;
            top: 15px;
            right: -36px;
            width: 44px;
            height: 85px;
            background-color: #4a3728;
            border: 3.5px solid #2d1f10;
            border-radius: 0 40px 15px 40px;
            transform: rotate(15deg);
            z-index: 1;
        }
        .ksy-hair-elastic {
            position: absolute;
            top: 28px;
            right: -6px;
            width: 14px;
            height: 14px;
            background-color: #fb7185;
            border: 2px solid #e11d48;
            border-radius: 50%;
            z-index: 2;
        }
        .ksy-hair-back {
            position: absolute;
            top: -8px;
            left: -4px;
            width: 128px;
            height: 85px;
            background-color: #4a3728;
            border: 3.5px solid #2d1f10;
            border-radius: 60px 60px 20px 20px;
            z-index: 1;
        }
        .ksy-ear-l, .ksy-ear-r {
            position: absolute;
            top: 52px;
            width: 16px;
            height: 26px;
            background-color: #ffdbb5;
            border: 3.5px solid #8d5b4c;
            z-index: 2;
        }
        .ksy-ear-l { left: -11px; border-radius: 50% 0 0 50%; transform: rotate(-10deg); }
        .ksy-ear-r { right: -11px; border-radius: 0 50% 50% 0; transform: rotate(10deg); }
        .ksy-neck {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 40px;
            background-color: #ffdbb5;
            border-left: 3.5px solid #8d5b4c;
            border-right: 3.5px solid #8d5b4c;
            z-index: 3;
        }
        .ksy-face-skin {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffdbb5;
            border: 3.5px solid #8d5b4c;
            border-radius: 50px 50px 60px 60px;
            z-index: 4;
            overflow: hidden;
        }
        .ksy-front-hair {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background-color: #4a3728;
            border-bottom: 3.5px solid #2d1f10;
            z-index: 10;
        }
        .ksy-hair-point {
            position: absolute;
            top: 39px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 9px solid #2d1f10;
            z-index: 11;
        }
        .ksy-eye-l, .ksy-eye-r {
            position: absolute;
            top: 62px;
            width: 15px;
            height: 15px;
            background-color: #221a15;
            border-radius: 50%;
            z-index: 6;
        }
        .ksy-eye-l::after, .ksy-eye-r::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
        }
        .ksy-eye-l { left: 24px; }
        .ksy-eye-r { right: 24px; }
        .ksy-blush-l, .ksy-blush-r {
            position: absolute;
            top: 78px;
            width: 18px;
            height: 9px;
            background-color: rgba(244, 63, 94, 0.4);
            border-radius: 50%;
            filter: blur(0.5px);
            z-index: 6;
        }
        .ksy-blush-l { left: 16px; }
        .ksy-blush-r { right: 16px; }
        .ksy-mouth-surprise {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background-color: #f43f5e;
            border-radius: 50%;
            border: 2px solid #be123c;
            z-index: 6;
        }
        .ksy-uniform-top {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 124px;
            height: 110px;
            background-color: #1e293b;
            border: 3.5px solid #475569;
            border-radius: 24px 24px 10px 10px;
            z-index: 7;
            overflow: hidden;
            transition: background-color 0.3s;
        }
        .ksy-collar-l {
            position: absolute;
            top: -2px;
            left: 32px;
            width: 30px;
            height: 26px;
            background-color: #ffffff;
            border: 3px solid #475569;
            transform: rotate(-30deg);
            border-radius: 0 0 5px 0;
        }
        .ksy-collar-r {
            position: absolute;
            top: -2px;
            right: 32px;
            width: 30px;
            height: 26px;
            background-color: #ffffff;
            border: 3px solid #475569;
            transform: rotate(30deg);
            border-radius: 0 0 0 5px;
        }
        .ksy-ribbon {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 14px;
            background-color: #e11d48;
            border: 2px solid #9f1239;
            border-radius: 4px;
            z-index: 10;
        }
        .ksy-ribbon::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -14px;
            width: 18px;
            height: 20px;
            background-color: #e11d48;
            border: 2px solid #9f1239;
            border-radius: 6px 2px 2px 6px;
            transform: rotate(-15deg);
        }
        .ksy-ribbon::after {
            content: '';
            position: absolute;
            top: -4px;
            right: -14px;
            width: 18px;
            height: 20px;
            background-color: #e11d48;
            border: 2px solid #9f1239;
            border-radius: 2px 6px 6px 2px;
            transform: rotate(15deg);
        }
        .ksy-skirt {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 35px;
            background: repeating-linear-gradient(90deg, #64748b, #64748b 10px, #475569 10px, #475569 20px);
            border: 3px solid #334155;
            border-radius: 5px 5px 12px 12px;
            z-index: 8;
            transition: all 0.3s;
        }

            right: 32px;
            width: 30px;
            height: 26px;
            background-color: #ffffff;
            border: 3px solid #475569;
            transform: rotate(30deg);
            border-radius: 0 0 0 5px;
        }
        .kmw-tie {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 50px;
            background-color: #b91c1c;
            border: 2px solid #7f1d1d;
            border-radius: 2px 2px 6px 6px;
            z-index: 10;
            transition: all 0.3s;
        }
        .kmw-tie::after {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 10px;
            background-color: #b91c1c;
            border: 2px solid #7f1d1d;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="toast-overlay" id="toast">알맞은 위치에 의상을 매치해보세요!</div>

    <div class="game-header">
        <h1>대불호텔의 비밀 🗝️</h1>
        <p>2단계: 신기한 객실 - 민우와 서연이를 개항기 패셔니스타로 완벽 변신시키기</p>
    </div>

    <div class="game-main">
        <div class="closet-section">
            <div class="closet-title">🚪 개항기 옷장</div>
            <div class="items-grid" id="closet-grid">
                <div class="clothing-item" draggable="true" id="fedora">
                    <span class="icon">🎩</span>
                    <span class="name">중절모</span>
                </div>
                <div class="clothing-item" draggable="true" id="suit">
                    <span class="icon">🤵</span>
                    <span class="name">정장세트</span>
                </div>
                <div class="clothing-item wrong-item" draggable="true" id="cap">
                    <span class="icon">🧢</span>
                    <span class="name">현대식 캡모자</span>
                </div>
                <div class="clothing-item" draggable="true" id="hairpin">
                    <span class="icon">🎀</span>
                    <span class="name">머리핀</span>
                </div>
                <div class="clothing-item" draggable="true" id="dress">
                    <span class="icon">👗</span>
                    <span class="name">드레스세트</span>
                </div>
                <div class="clothing-item wrong-item" draggable="true" id="spacesuit">
                    <span class="icon">👨‍🚀</span>
                    <span class="name">미래형 우주복</span>
                </div>
            </div>
        </div>

        <div class="mannequin-section">
            <div class="mannequin-card male">
                <div class="mannequin-title">민우 (남성 코디)</div>
                <div class="kyobok-minwoo-component">
                    <div class="kmw-stage">
                        <div class="kmw-head-wrapper">
                            <div class="kmw-hair-back"></div>
                            <div class="kmw-ear-l"></div>
                            <div class="kmw-ear-r"></div>
                            <div class="kmw-neck"></div>
                            <div class="kmw-face-skin">
                                <div class="kmw-front-hair"></div>
                                <div class="kmw-hair-point" style="left: 15px;"></div>
                                <div class="kmw-hair-point" style="left: 45px;"></div>
                                <div class="kmw-hair-point" style="right: 25px;"></div>
                                <div class="kmw-eyebrow-l"></div>
                                <div class="kmw-eyebrow-r"></div>
                                <div class="kmw-eye-l"></div>
                                <div class="kmw-eye-r"></div>
                                <div class="kmw-blush-l"></div>
                                <div class="kmw-blush-r"></div>
                                <div class="kmw-mouth"></div>
                            </div>
                        </div>
                        <div class="kmw-uniform-top">
                            <div class="kmw-collar-l"></div>
                            <div class="kmw-collar-r"></div>
                            <div class="kmw-tie"></div>
                        </div>

                        <div id="mw-fedora-wear" style="display:none; position:absolute; top:-42px; left:50%; transform:translateX(-50%); font-size:95px; z-index:15; pointer-events:none;">🎩</div>

                        <div class="drop-zone zone-head" id="male-head" data-accept="fedora">
                            <span class="zone-label">모자 구역</span>
                        </div>
                        <div class="drop-zone zone-body" id="male-body" data-accept="suit">
                            <span class="zone-label">의상 구역</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mannequin-card female">
                <div class="mannequin-title">서연 (여성 코디)</div>
                <div class="kyobok-seoyeon-component">
                    <div class="ksy-stage">
                        <div class="ksy-head-wrapper">
                            <div class="ksy-ponytail"></div>
                            <div class="ksy-hair-elastic"></div>
                            <div class="ksy-hair-back"></div>
                            <div class="ksy-ear-l"></div>
                            <div class="ksy-ear-r"></div>
                            <div class="ksy-neck"></div>
                            <div class="ksy-face-skin">
                                <div class="ksy-front-hair"></div>
                                <div class="ksy-hair-point" style="left: 20px;"></div>
                                <div class="ksy-hair-point" style="left: 50px;"></div>
                                <div class="ksy-hair-point" style="right: 30px;"></div>
                                <div class="ksy-eye-l"></div>
                                <div class="ksy-eye-r"></div>
                                <div class="ksy-blush-l"></div>
                                <div class="ksy-blush-r"></div>
                                <div class="ksy-mouth-surprise"></div>
                            </div>
                        </div>
                        <div class="ksy-uniform-top">
                            <div class="ksy-collar-l"></div>
                            <div class="ksy-collar-r"></div>
                            <div class="ksy-ribbon"></div>
                            <div class="ksy-skirt"></div>
                        </div>

                        <div id="sy-pin-wear" style="display:none; position:absolute; top:12px; right:45px; font-size:35px; z-index:15; pointer-events:none;">🎀</div>

                        <div class="drop-zone zone-head" id="female-head" data-accept="hairpin">
                            <span class="zone-label">장식 구역</span>
                        </div>
                        <div class="drop-zone zone-body" id="female-body" data-accept="dress">
                            <span class="zone-label">의상 구역</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="dialogue-section">
        <div>
            <div class="char-name" id="char-name">서연</div>
            <div class="char-text" id="char-text">
                "19세기 개항기 복장으로 알맞게 입혀보자!"
            </div>
        </div>
    </div>

    <div class="control-panel">
        <button class="btn btn-reset" onclick="resetGame()">다시 입히기</button>
        <button class="btn btn-check" id="btn-check" onclick="checkOutfits()">코디 완성 확인</button>
        <button class="btn btn-clear" id="btn-clear" onclick="nextStage()">🔑 다음 단계로 이동하기</button>
    </div>
</div>

<script>
    const dialogName = document.getElementById('char-name');
    const dialogText = document.getElementById('char-text');
    const btnClear = document.getElementById('btn-clear');
    const btnCheck = document.getElementById('btn-check');

    const items = document.querySelectorAll('.clothing-item');
    const dropZones = document.querySelectorAll('.drop-zone');
    const closetGrid = document.getElementById('closet-grid');

    items.forEach(item => {
        item.addEventListener('dragstart', dragStart);
        item.addEventListener('dragend', dragEnd);
        item.addEventListener('click', itemClick);
    });

    dropZones.forEach(zone => {
        zone.addEventListener('dragover', dragOver);
        zone.addEventListener('dragenter', dragEnter);
        zone.addEventListener('dragleave', dragLeave);
        zone.addEventListener('drop', dragDrop);
        zone.addEventListener('click', zoneClick);
    });

    let draggedItem = null;
    let selectedItem = null;

    function dragStart(e) {
        draggedItem = this;
        setTimeout(() => this.style.opacity = '0.4', 0);
    }

    function dragEnd() {
        this.style.opacity = '1';
        draggedItem = null;
    }

    function dragOver(e) {
        e.preventDefault();
    }

    function dragEnter(e) {
        e.preventDefault();
        this.classList.add('hovered');
    }

    function dragLeave() {
        this.classList.remove('hovered');
    }

    // 의상 부품 입히기 비주얼 매핑 코어 엔진
    function applyOutfitVisual(itemId, zoneId, undo = false) {
        if (zoneId === 'male-head') {
            document.getElementById('mw-fedora-wear').style.display = undo ? 'none' : 'block';
        } else if (zoneId === 'male-body') {
            const mwComp = document.querySelector('.kyobok-minwoo-component');
            if (undo) mwComp.classList.remove('suit-equipped');
            else mwComp.classList.add('suit-equipped');
        } else if (zoneId === 'female-head') {
            document.getElementById('sy-pin-wear').style.display = undo ? 'none' : 'block';
        } else if (zoneId === 'female-body') {
            const syComp = document.querySelector('.kyobok-seoyeon-component');
            if (undo) syComp.classList.remove('dress-equipped');
            else syComp.classList.add('dress-equipped');
        }
    }

    // 드래그앤드롭 예외 처리 및 자연스러운 장착 처리
    function dragDrop() {
        this.classList.remove('hovered');
        const acceptedId = this.getAttribute('data-accept');
        
        // 올바른 타겟 매칭이 아니거나, 추가된 현대식 오답 아이템일 경우 즉시 실패 팝업 도출
        if (draggedItem.id === 'cap' || draggedItem.id === 'spacesuit' || draggedItem.id !== acceptedId) {
            alert("틀렸어. 다시 생각해보자.");
            return;
        }

        // 기존에 장착된 아이템이 있다면 해제 후 복귀
        if (this.querySelector('.clothing-item')) {
            const existingItem = this.querySelector('.clothing-item');
            applyOutfitVisual(existingItem.id, this.id, true);
            closetGrid.appendChild(existingItem);
        }
        
        this.appendChild(draggedItem);
        this.classList.add('occupied');
        applyOutfitVisual(draggedItem.id, this.id, false);
        showToast("의상을 깔끔하게 입혔습니다.");
    }

    // 클릭/터치 조작 예외 처리 및 자연스러운 장착 처리
    function itemClick() {
        if (selectedItem) {
            selectedItem.style.border = "2px solid #bcaaa4";
        }
        
        if (this.parentElement.classList.contains('drop-zone')) {
            const zone = this.parentElement;
            zone.classList.remove('occupied');
            applyOutfitVisual(this.id, zone.id, true);
            closetGrid.appendChild(this);
            showToast("의상을 벗겼습니다.");
            if (selectedItem === this) selectedItem = null;
            return;
        }

        selectedItem = this;
        this.style.border = "3px solid #ffb300";
        showToast("의상을 선택했습니다. 입힐 부위를 터치하세요.");
    }

    function zoneClick() {
        if (selectedItem) {
            const acceptedId = this.getAttribute('data-accept');

            if (selectedItem.id === 'cap' || selectedItem.id === 'spacesuit' || selectedItem.id !== acceptedId) {
                alert("틀렸어. 다시 생각해보자.");
                selectedItem.style.border = "2px solid #bcaaa4";
                selectedItem = null;
                return;
            }

            if (this.querySelector('.clothing-item')) {
                const existingItem = this.querySelector('.clothing-item');
                applyOutfitVisual(existingItem.id, this.id, true);
                closetGrid.appendChild(existingItem);
            }

            this.appendChild(selectedItem);
            this.classList.add('occupied');
            applyOutfitVisual(selectedItem.id, this.id, false);
            selectedItem.style.border = "2px solid #bcaaa4";
            selectedItem = null;
            showToast("의상을 깔끔하게 입혔습니다.");
        }
    }

    // 최종 정답 및 승인 검증 스크립트
    function checkOutfits() {
        const maleHead = document.getElementById('male-head').querySelector('.clothing-item');
        const maleBody = document.getElementById('male-body').querySelector('.clothing-item');
        const femaleHead = document.getElementById('female-head').querySelector('.clothing-item');
        const femaleBody = document.getElementById('female-body').querySelector('.clothing-item');

        const isClear = maleHead && maleHead.id === 'fedora' &&
                        maleBody && maleBody.id === 'suit' &&
                        femaleHead && femaleHead.id === 'hairpin' &&
                        femaleBody && femaleBody.id === 'dress';

        if (isClear) {
            // 요청하신 전용 완료 메시지 얼럿 팝업창 실행
            alert("첫번째 열쇠를 얻었어! 다음 방으로 이동하자!");
            
            // 대사창 결과 가이드 출력 및 이동용 활성화 버튼 토글
            dialogName.innerText = "서연 & 민우";
            dialogName.style.borderColor = "#4caf50";
            dialogName.style.color = "#4caf50";
            dialogText.innerHTML = "우와! 우리가 완벽한 개항기 신사와 숙녀로 변신했어! <strong>[다음 단계로 이동하기]</strong> 버튼을 눌러 탈출을 계속하자!";
            
            btnCheck.style.display = 'none';
            btnClear.style.display = 'block';
        } else {
            dialogName.innerText = "민우";
            dialogName.style.borderColor = "#e53935";
            dialogName.style.color = "#e53935";
            dialogText.innerText = "어라? 모자가 훌렁 벗겨지네? 코디가 마음에 안 드나 봐.";

            setTimeout(() => {
                dialogName.innerText = "서연";
                dialogName.style.borderColor = "#ffd54f";
                dialogName.style.color = "#ffd54f";
                dialogText.innerText = "성별과 스타일에 맞게 정장세트(정장+중절모)와 드레스세트(드레스+머리핀)를 각각 정확하게 드래그해 줘야 해!";
            }, 2500);
        }
    }

    // 리셋 기능 초기화
    function resetGame() {
        const allItems = [
            document.getElementById('fedora'),
            document.getElementById('suit'),
            document.getElementById('cap'),
            document.getElementById('hairpin'),
            document.getElementById('dress'),
            document.getElementById('spacesuit')
        ];
        
        allItems.forEach(item => {
            if (item) {
                item.style.border = "2px solid #bcaaa4";
                closetGrid.appendChild(item);
            }
        });

        dropZones.forEach(zone => {
            zone.classList.remove('occupied');
            applyOutfitVisual('', zone.id, true);
        });

        if (selectedItem) selectedItem = null;

        dialogName.innerText = "서연";
        dialogName.style.borderColor = "#ffd54f";
        dialogName.style.color = "#ffd54f";
        dialogText.innerText = "19세기 개항기 복장으로 알맞게 입혀보자!";
        
        btnCheck.style.display = 'block';
        btnClear.style.display = 'none';
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    function nextStage() {
    // C04.html 페이지로 이동합니다.
    window.location.href = "C04.html";

}
    }
</script>

</body>
</html>
