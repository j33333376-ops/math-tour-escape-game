<div class="japanese-officer-component" style="display: inline-block; overflow: visible !important;">
    
    <style>
        /* 기본 인간형 캐릭터 호환 스테이지 및 숨쉬기 애니메이션 */
        .jpo-stage {
            position: relative;
            width: 260px;
            height: 320px;
            margin: 0 auto;
            animation: jpo-breatheHuman 4s ease-in-out infinite;
            overflow: visible !important;
        }

        @keyframes jpo-breatheHuman {
            0%, 100% { transform: scale(1) translateY(0px); }
            50% { transform: scale(1.01) translateY(-3px); }
        }

        /* 두상 기본 상자 */
        .jpo-head-wrapper {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 130px;
            overflow: visible !important;
        }

        /* 귀 */
        .jpo-ear-l, .jpo-ear-r {
            position: absolute;
            top: 52px;
            width: 16px;
            height: 26px;
            background-color: #ffdbb5;
            border: 3.5px solid #8d5b4c;
            z-index: 2;
        }
        .jpo-ear-l { left: -11px; border-radius: 50% 0 0 50%; transform: rotate(-10deg); }
        .jpo-ear-r { right: -11px; border-radius: 0 50% 50% 0; transform: rotate(10deg); }

        /* 뒷머리 베이스 (짧은 상투/단발 형태의 검은 머리 바탕) */
        .jpo-hair-back {
            position: absolute;
            top: -5px;
            left: -2px;
            width: 124px;
            height: 80px;
            background-color: #1c1917;
            border: 3.5px solid #0c0a09;
            border-radius: 50px 50px 20px 20px;
            z-index: 1;
        }

        /* 목 조인트 */
        .jpo-neck {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 40px;
            background-color: #ffdbb5;
            border-left: 3.5px solid #8d5b4c;
            border-right: 3.5px solid #8d5b4c;
            z-index: 3;
        }

        /* 얼굴 피부 컨테이너 */
        .jpo-face-skin {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffdbb5;
            border: 3.5px solid #8d5b4c;
            border-radius: 50px 50px 60px 60px;
            z-index: 4;
            overflow: hidden;
        }

        /* 일제 순사 모자 (정모 스타일) */
        .jpo-cap {
            position: absolute;
            top: -22px;
            left: -8px;
            width: 136px;
            height: 52px;
            background-color: #1e293b; /* 경찰 제복 다크 블루/블랙 */
            border: 3.5px solid #0f172a;
            border-radius: 35px 35px 8px 8px;
            z-index: 12; /* 얼굴 피부와 앞머리 위로 완벽 정렬 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        /* 모자 챙 */
        .jpo-cap-brim {
            position: absolute;
            bottom: -5px;
            left: -2px;
            width: 132px;
            height: 10px;
            background-color: #0f172a;
            border-radius: 0 0 12px 12px;
            border-bottom: 2px solid #334155;
        }
        /* 모자 전면 황금색 띠 */
        .jpo-cap-band {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #eab308; /* 황금색 라인 */
            border-top: 1.5px solid #0f172a;
            border-bottom: 1.5px solid #0f172a;
        }
        /* 모자 중앙 제국 경찰 배지 기호 */
        .jpo-cap-badge {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background-color: #facc15; /* 표적/훈장 스타일의 황금 원형 심볼 */
            border: 2.5px solid #a16207;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(250,204,21,0.6);
        }

        /* 매섭고 날카롭게 화가 난 눈썹 */
        .jpo-eyebrow-l, .jpo-eyebrow-r {
            position: absolute;
            top: 52px;
            width: 22px;
            height: 5px;
            background-color: #1c1917;
            border-radius: 2px;
            z-index: 6;
        }
        .jpo-eyebrow-l { left: 20px; transform: rotate(-15deg); } /* 안쪽으로 매섭게 꺾임 */
        .jpo-eyebrow-r { right: 20px; transform: rotate(15deg); }

        /* 매서운 눈빛 */
        .jpo-eye-l, .jpo-eye-r {
            position: absolute;
            top: 64px;
            width: 13px;
            height: 13px;
            background-color: #1c1917;
            border-radius: 50%;
            z-index: 6;
        }
        .jpo-eye-l::after, .jpo-eye-r::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 3.5px;
            height: 3.5px;
            background-color: #fff;
            border-radius: 50%;
        }
        .jpo-eye-l { left: 25px; }
        .jpo-eye-r { right: 25px; }

        /* 강압적인 인상의 콧수염 */
        .jpo-mustache-l, .jpo-mustache-r {
            position: absolute;
            top: 90px;
            width: 14px;
            height: 4.5px;
            background-color: #1c1917;
            border-radius: 2px;
            z-index: 8;
        }
        .jpo-mustache-l { left: 34px; transform: rotate(5deg); }
        .jpo-mustache-r { right: 34px; transform: rotate(-5deg); }

        /* 고압적이고 굳게 다문 입매 */
        .jpo-mouth {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 3.5px;
            background-color: #991b1b; /* 어두운 붉은색 입선 */
            border-radius: 2px;
            z-index: 6;
        }

        /* 일제 제복 상의 (네이비 블랙 수트) */
        .jpo-uniform-top {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 124px;
            height: 110px;
            background-color: #1e293b;
            border: 3.5px solid #0f172a;
            border-radius: 24px 24px 10px 10px;
            z-index: 7;
            overflow: hidden;
        }

        /* 하이 칼라(세운 깃) 제복 스타일 전면 가림막 */
        .jpo-collar-block {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 20px;
            background-color: #0f172a;
            border: 2.5px solid #334155;
            border-radius: 0 0 6px 6px;
            z-index: 8;
        }

        /* 권위를 나타내는 어깨 황금 견장 (좌/우) */
        .jpo-epaulet-l, .jpo-epaulet-r {
            position: absolute;
            top: 4px;
            width: 26px;
            height: 10px;
            background-color: #dc2626; /* 붉은 바탕 */
            border: 2px solid #eab308; /* 황금 테두리 */
            z-index: 9;
        }
        .jpo-epaulet-l { left: -2px; border-radius: 4px 12px 2px 4px; transform: rotate(-10deg); }
        .jpo-epaulet-r { right: -2px; border-radius: 12px 4px 4px 2px; transform: rotate(10deg); }
        
        /* 견장 내부 황금색 계급 징 장식 */
        .jpo-epaulet-l::after, .jpo-epaulet-r::after {
            content: '';
            position: absolute;
            top: 1px;
            width: 4px;
            height: 4px;
            background-color: #eab308;
            border-radius: 50%;
        }
        .jpo-epaulet-l::after { right: 4px; }
        .jpo-epaulet-r::after { left: 4px; }

        /* 제복 중앙 여밈 선 */
        .jpo-center-seam {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 3.5px;
            height: 100%;
            background-color: #0f172a;
            z-index: 8;
        }

        /* 제복 전면 황금 단추 */
        .jpo-gold-button {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background-color: #facc15;
            border: 1.5px solid #a16207;
            border-radius: 50%;
            z-index: 10;
        }
    </style>

    <div class="jpo-stage">
        <div class="jpo-head-wrapper">
            <div class="jpo-hair-back"></div>
            <div class="jpo-ear-l"></div>
            <div class="jpo-ear-r"></div>
            
            <div class="jpo-neck"></div>
            
            <div class="jpo-face-skin">
                <div class="jpo-eyebrow-l"></div>
                <div class="jpo-eyebrow-r"></div>
                
                <div class="jpo-eye-l"></div>
                <div class="jpo-eye-r"></div>
                
                <div class="jpo-mustache-l"></div>
                <div class="jpo-mustache-r"></div>
                
                <div class="jpo-mouth"></div>
            </div>

            <div class="jpo-cap">
                <div class="jpo-cap-band"></div>
                <div class="jpo-cap-badge"></div>
                <div class="jpo-cap-brim"></div>
            </div>
        </div>

        <div class="jpo-uniform-top">
            <div class="jpo-collar-block"></div>
            <div class="jpo-center-seam"></div>
            
            <div class="jpo-epaulet-l"></div>
            <div class="jpo-epaulet-r"></div>
            
            <div class="jpo-gold-button" style="top: 35px;"></div>
            <div class="jpo-gold-button" style="top: 60px;"></div>
            <div class="jpo-gold-button" style="top: 85px;"></div>
        </div>
    </div>
</div>
