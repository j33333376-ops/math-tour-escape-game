<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - 적벽의 비밀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');
    </style>
    <style>
        /* 기본 리셋 및 레이아웃 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1a1a;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
            overflow: hidden;
        }

        /* 16:9 고정 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6; /* 양피지 베이지 */
            border: 4px solid #d4af37; /* 앤틱 골드 테두리 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 안개 자욱한 적벽대전 배경 연출용 오버레이 */
        #background-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(26,26,26,0.4) 0%, rgba(140,48,48,0.2) 100%);
            z-index: 2;
            pointer-events: none;
        }
        
        #mist-effect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(100,100,100,0.2) 100%);
            opacity: 0.7;
            z-index: 3;
            pointer-events: none;
            animation: pulseMist 6s ease-in-out infinite alternate;
        }
        @keyframes pulseMist {
            0% { opacity: 0.5; }
            100% { opacity: 0.8; }
        }

        /* 상단 네비게이션/스테이지 표시바 */
        #stage-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(26, 26, 26, 0.85);
            border: 1px solid #d4af37;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-radius: 4px;
        }
        #stage-title {
            font-family: 'Nanum Myeongjo', serif;
            font-weight: bold;
            color: #d4af37;
            font-size: 18px;
            letter-spacing: 1px;
        }
        #stage-status {
            font-family: 'Nanum Gothic Coding', monospace;
            color: #ffffff;
            font-size: 14px;
        }

        /* 에셋 배치 구역 (건물 및 인물) */
        #scenery-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* 인물 배치 컨테이너 */
        .character-wrapper {
            position: absolute;
            bottom: 80px;
            width: 260px;
            height: 320px;
            z-index: 5;
            transition: filter 0.4s ease, transform 0.4s ease;
            overflow: visible !important;
        }
        /* 대화 비활성화 상태 인물 어둡게 처리 */
        .character-wrapper.inactive {
            filter: brightness(0.4) grayscale(0.3);
        }
        #char-minwoo { left: 150px; }
        
        /* 제갈량 좌우반전하여 민우를 바라보게 설정 */
        #char-zhuge { right: 150px; transform: scaleX(-1); } 

        /* 제갈량 홀로그램 SVG 전용 애니메이션 스타일 추가 */
        .jegal-hologram-container {
            position: relative;
            width: 100%;
            height: 100%;
            animation: float-spirit 4s ease-in-out infinite;
        }
        .glow-effect {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(255, 235, 59, 0.4))
                    drop-shadow(0 0 35px rgba(212, 175, 55, 0.6));
            animation: pulse-glow 3s infinite alternate;
        }
        .jegal-hologram-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            mix-blend-mode: overlay;
        }
        @keyframes float-spirit {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes pulse-glow {
            0% { opacity: 0.65; filter: drop-shadow(0 0 10px rgba(255, 235, 59, 0.3)) drop-shadow(0 0 20px rgba(212, 175, 55, 0.4)); }
            100% { opacity: 0.95; filter: drop-shadow(0 0 15px rgba(255, 235, 59, 0.6)) drop-shadow(0 0 35px rgba(212, 175, 55, 0.8)); }
        }

        /* 대화창 UI */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 140px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 15px 25px;
            z-index: 20;
            cursor: pointer;
        }
        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 8px;
            border-bottom: 1px dashed #8c3030;
            padding-bottom: 4px;
            display: inline-block;
        }
        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        #click-notice {
            position: absolute;
            right: 15px;
            bottom: 10px;
            font-size: 12px;
            color: #d4af37;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* 퀴즈 컨테이너 UI */
        #quiz-container {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            background: #f5f0e6;
            border: 3px double #8c3030;
            outline: 1px solid #d4af37;
            outline-offset: -6px;
            padding: 30px;
            z-index: 30;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            border-radius: 4px;
        }
        #quiz-title {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 22px;
            color: #8c3030;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #quiz-prompt {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #2d3748;
            margin-bottom: 20px;
        }
        #quiz-input-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        #answer-input {
            width: 200px;
            padding: 10px;
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 16px;
            border: 2px solid #475569;
            background-color: #ffffff;
            color: #2d3748;
            border-radius: 4px;
            text-align: center;
        }
        #answer-input:focus {
            outline: none;
            border-color: #8c3030;
        }
        
        /* 공통 네비게이션 버튼 스타일 */
        .btn-nav {
            position: absolute;
            background-color: #8c3030;
            color: white;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 25;
            transition: background-color 0.2s ease;
        }
        .btn-nav:hover {
            background-color: #661f1f;
        }
        #btn-prev { left: 20px; bottom: 20px; }
        #btn-next, #btn-skip { right: 20px; bottom: 20px; }
        #btn-submit { position: static; padding: 10px 20px; } 

        #feedback-msg {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            min-height: 20px;
        }
        .text-error { color: #b91c1c; }
        .text-success { color: #15803d; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="background-overlay"></div>
    <div id="mist-effect"></div>

    <div id="stage-header">
        <div id="stage-title">제4장: 삼국지 벽화거리 — 적벽의 화공</div>
        <div id="stage-status">체험 학습 미션 진행 중</div>
    </div>

    <div id="scenery-layer">
        <div style="position: absolute; left: 0px; bottom: 0px; width: 854px; height: 378px; overflow: hidden; z-index: 1;">
            <iframe src="F_삼국지벽화거리.html" scrolling="no" style="border:0; width:1400px; height:620px; transform:scale(0.61); transform-origin:top left; background: transparent;"></iframe>
        </div>

        <div id="char-minwoo" class="character-wrapper">
            <iframe src="민우.html" scrolling="no" style="border:0; width:260px; height:320px; overflow:hidden; background:transparent;"></iframe>
        </div>

        <div id="char-zhuge" class="character-wrapper">
            <div class="jegal-hologram-container">
                <svg class="glow-effect" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#fff8cc" stop-opacity="0.9" />
                            <stop offset="40%" stop-color="#ffeb3b" stop-opacity="0.75" />
                            <stop offset="100%" stop-color="#b7791f" stop-opacity="0.1" />
                        </linearGradient>
                        <linearGradient id="fanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                            <stop offset="100%" stop-color="#ffd700" stop-opacity="0.6" />
                        </linearGradient>
                    </defs>
                    <g fill="url(#goldGradient)">
                        <rect x="85" y="15" width="30" height="15" rx="2" />
                        <path d="M 75 30 L 125 30 L 130 65 L 70 65 Z" />
                        <path d="M 75 55 Q 60 80 65 110 Q 75 80 75 55 Z" opacity="0.6"/>
                        <path d="M 125 55 Q 140 80 135 110 Q 125 80 125 55 Z" opacity="0.6"/>
                        <ellipse cx="100" cy="80" rx="22" ry="28" />
                        <path d="M 85 95 Q 100 160 115 95 Q 100 120 85 95 Z" opacity="0.8" />
                        <path d="M 40 250 C 40 150, 70 120, 100 120 C 130 120, 160 150, 160 250 Z" />
                        <path d="M 70 140 C 30 160, 20 220, 30 250 L 70 250 Z" opacity="0.7"/>
                        <path d="M 130 140 C 170 160, 180 220, 170 250 L 130 250 Z" opacity="0.7"/>
                    </g>
                    <g transform="translate(10, -10)">
                        <line x1="95" y1="180" x2="125" y2="135" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
                        <g fill="url(#fanGradient)">
                            <path d="M 120 145 Q 120 100 135 110 Q 130 130 120 145 Z" />
                            <path d="M 123 142 Q 145 95 155 105 Q 140 130 123 142 Z" />
                            <path d="M 126 142 Q 165 110 165 125 Q 145 140 126 142 Z" />
                            <path d="M 124 146 Q 165 140 155 155 Q 135 155 124 146 Z" />
                        </g>
                    </g>
                    <ellipse cx="100" cy="245" rx="80" ry="10" fill="#ffeb3b" opacity="0.3" filter="blur(5px)" />
                </svg>
            </div>
        </div>
    </div>

    <div id="dialogue-box" onclick="advanceDialogue()">
        <div id="speaker-name">민우</div>
        <div id="dialogue-text">어? 분명 인천 차이나타운 벽화 앞이었는데... 이 자욱한 안개랑 배들은 다 뭐지?</div>
        <div id="click-notice">클릭하여 계속 ▼</div>
    </div>

    <div id="quiz-container">
        <div id="quiz-title">🔒 적벽의 자물쇠</div>
        <div id="quiz-prompt">
            조조의 대군을 치기 위해 화공(火攻)을 성공시켜야 합니다.<br>
            현재 부는 북서풍을 뒤집고 조조의 진영으로 불길을 보낼 <strong>'이 바람'</strong>의 이름은 무엇일까요?
        </div>
        <div id="quiz-input-box">
            <input type="text" id="answer-input" placeholder="바람 이름 입력" autocomplete="off">
            <button id="btn-submit" class="btn-nav" onclick="checkAnswer()">확인</button>
        </div>
        <div id="feedback-msg"></div>
    </div>

    <button id="btn-prev" class="btn-nav" onclick="navigate('F03.html')">이전으로</button>
    <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
    <button id="btn-next" class="btn-nav" style="display:none;" onclick="navigate('F05.html')">다음</button>
</div>

<script>
    // 대화 데이터 구축 (유형 2 설계 구조 적용)
    const dialogues = [
        { speaker: "민우", text: "어? 분명 인천 차이나타운 벽화 앞이었는데... 이 자욱한 안개랑 배들은 다 뭐지?", target: "char-minwoo" },
        { speaker: "제갈량", text: "낯선 곳의 나그네여, 놀라지 말게. 이곳은 곧 천하의 운명이 바뀔 전쟁터, '적벽'이라네.", target: "char-zhuge" },
        { speaker: "민우", text: "깃털 부채에 그 외모... 설마 제갈공명?! 내가 진짜 삼국지 세계관에 들어온 거예요?", target: "char-minwoo" },
        { speaker: "제갈량", text: "나를 알아봐 주니 기쁘군. 지금 조조의 대군을 치기 위해 화공(火攻)을 준비했으나, 결정적인 '이것'이 부족해 주유 장군이 시름하고 있네.", target: "char-zhuge" },
        { speaker: "민우", text: "아, 그거 알아요! 겨울이라 바람 방향이 반대잖아요. 조조 군대를 불태우려면 지금 부는 북서풍을 뒤집을 '이 바람'이 꼭 필요하죠?", target: "char-minwoo" },
        { speaker: "제갈량", text: "정확하군. 내가 제단을 쌓아 하늘에 기도를 올릴 테니, 자네는 어서 그 바람의 이름을 전해 자물쇠를 풀게나.", target: "char-zhuge" }
    ];

    let currentIndex = 0;

    // 대화 초기 화면 설정
    function initDialogue() {
        updateDialogueView();
    }

    // 다음 대사 진행 함수
    function advanceDialogue() {
        currentIndex++;
        if (currentIndex < dialogues.length) {
            updateDialogueView();
        } else {
            endDialoguePhase();
        }
    }

    // 대사 및 인물 하이라이트(밝기) 업데이트
    function updateDialogueView() {
        const current = dialogues[currentIndex];
        document.getElementById("speaker-name").innerText = current.speaker;
        document.getElementById("dialogue-text").innerText = current.text;

        // 모든 인물 wrapper에 inactive 추가 후 활성 인물만 제거
        document.querySelectorAll('.character-wrapper').forEach(el => {
            el.classList.add('inactive');
        });
        const activeChar = document.getElementById(current.target);
        if (activeChar) {
            activeChar.classList.remove('inactive');
        }
    }

    // 대화 건너뛰기 처리
    function skipDialogue() {
        endDialoguePhase();
    }

    // 대화 단계 종료 후 퀴즈 단계 진입
    function endDialoguePhase() {
        // 대화창 및 스킵버튼 숨김
        document.getElementById("dialogue-box").style.display = "none";
        document.getElementById("btn-skip").style.display = "none";
        
        // 인물 원래 밝기로 복구
        document.querySelectorAll('.character-wrapper').forEach(el => {
            el.classList.remove('inactive');
        });

        // 퀴즈 팝업 표시 (유형 3 활성화)
        document.getElementById("quiz-container").style.display = "block";
    }

    // 퀴즈 정답 검증 시스템 (정답: 동남풍)
    function checkAnswer() {
        const userInput = document.getElementById("answer-input").value.trim();
        const feedback = document.getElementById("feedback-msg");

        if (userInput === "동남풍") {
            feedback.className = "text-success";
            feedback.innerHTML = "🎉 정답입니다! 거대한 동남풍이 불어오며 자물쇠가 열립니다.";
            document.getElementById("quiz-input-box").style.display = "none";
            
            // 미션 클리어 후 다음 장면(F05) 버튼 활성화
            document.getElementById("btn-next").style.display = "block";
        } else {
            feedback.className = "text-error";
            feedback.innerHTML = "❌ 틀렸습니다. 다시 생각해 보세요! (힌트: 동쪽과 남쪽 사이)";
        }
    }

    // 페이지 이동 함수
    function navigate(url) {
        window.location.href = url;
    }

    // 초기 구동
    window.onload = initDialogue;
</script>
</body>
</html>
