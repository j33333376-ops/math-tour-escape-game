<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - B01</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f5f0e6;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Game Container (16:9 Aspect Ratio) */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f3ebd9;
            background-image: linear-gradient(rgba(245, 240, 230, 0.85), rgba(245, 240, 230, 0.85)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="none"/><path d="M0 0h100v100H0z" fill="%238c3030" fill-opacity=".015"/></svg>');
            border: 4px double #8c3030;
            outline: 2px solid #d4af37;
            outline-offset: -8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* UI Upper Bar */
        .stage-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(45, 55, 72, 0.85);
            border: 1px solid #d4af37;
            padding: 8px 32px;
            border-radius: 4px;
            color: #d4af37;
            font-family: 'Nanum Myeongjo', serif;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 2px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Scenery Stage Viewport */
        #stage-viewport {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Asset Wrapper Dimensions & Alignment */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            bottom: 120px; /* 대화창 높이를 고려해 인물 위치를 살짝 위로 조정 */
            z-index: 5;
            transition: filter 0.3s ease, transform 0.3s ease;
        }
        .character-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
            overflow: hidden;
        }

        /* Inactive states for Visual Novel focus */
        .character-wrapper.inactive {
            filter: brightness(0.4) grayscale(0.2);
        }

        /* Specific Placements */
        #char-seoyeon { left: 60px; }
        #char-sangsang { left: 403px; }
        #char-minwoo { left: 746px; transform: scaleX(-1); } 
        /* 민우 반전 유지하되 하이라이트 시 덮어쓰기 방지 처리 */
        #char-minwoo.inactive { transform: scaleX(-1); filter: brightness(0.4) grayscale(0.2); }

        /* Dialogue Box (Type 2 UI) - 건물을 가리지 않도록 하단에 슬림하게 배치 */
        #dialogue-box {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            height: 110px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 12px 24px;
            color: #ffffff;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            color: #d4af37;
            margin-bottom: 6px;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1rem;
            line-height: 1.5;
            letter-spacing: -0.02em;
        }

        /* Dialogue Click Indicator Accent */
        .click-notice {
            position: absolute;
            bottom: 8px;
            right: 16px;
            font-size: 0.75rem;
            color: rgba(212, 175, 55, 0.6);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Common Navigation Buttons */
        .btn-nav {
            position: absolute;
            background-color: #8c3030;
            color: white;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.16);
            transition: background-color 0.2s ease, transform 0.1s ease;
            z-index: 25;
            text-decoration: none;
        }
        .btn-nav:hover {
            background-color: #661f1f;
        }
        #btn-prev { left: 20px; bottom: 20px; display: none; }
        #btn-next { right: 20px; bottom: 20px; display: none; }
        #btn-skip { right: 20px; top: 20px; padding: 6px 16px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Stage Information Indicator Bar -->
        <div class="stage-header">상상플랫폼 앞</div>

        <div id="stage-viewport">
            <!-- Building Asset Injection Container -->
            <!-- 건물 가림을 최소화하기 위해 Y축 위치 고정 및 상단 대사박스 삭제 -->
            <div style="position: absolute; left: 149px; bottom: 190px; width: 768px; height: 276px; overflow: hidden; z-index: 1; border-bottom: 3px solid #8c3030;">
                <iframe src="B_상상플랫폼.html" scrolling="no" style="border: 0; width: 1280px; height: 460px; transform: scale(0.6); transform-origin: top left; opacity: 0.95;"></iframe>
            </div>

            <!-- Character Asset Injection Framework -->
            <div id="char-seoyeon" class="character-wrapper">
                <iframe src="서연.html" scrolling="no"></iframe>
            </div>

            <div id="char-sangsang" class="character-wrapper">
                <iframe src="상상.html" scrolling="no"></iframe>
            </div>

            <div id="char-minwoo" class="character-wrapper">
                <iframe src="민우.html" scrolling="no"></iframe>
            </div>
        </div>

        <!-- Visual Novel Dialogue Box -->
        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name">서연</div>
            <div id="dialogue-text">와, 건물이 정말 크고 멋지다! 민우야, 넌 여기가 원래 뭐 하던 곳인지 알아?</div>
            <div class="click-notice">클릭하여 계속</div>
        </div>

        <!-- System Navigation Controllers -->
        <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
        <button id="btn-prev" class="btn-nav" onclick="navigateTo('index.html')">이전으로</button>
        <button id="btn-next" class="btn-nav" onclick="navigateTo('B02.html')">다음으로</button>
    </div>

    <script>
        // Dialogue Script Data Sequence
        const dialogues = [
            { speaker: "서연", text: "와, 건물이 정말 크고 멋지다! 민우야, 넌 여기가 원래 뭐 하던 곳인지 알아?", target: "char-seoyeon" },
            { speaker: "민우", text: "글쎄... 엄청 현대적인 건물 같으면서도 어딘가 오래된 창고 같기도 하고... 잘 모르겠네.", target: "char-minwoo" },
            { speaker: "상상", text: "헤헤, 내가 알려줄게! 이곳은 원래 인천항의 오래된 곡물 창고였단다.", target: "char-sangsang" },
            { speaker: "상상", text: "지금은 멋진 복합문화공간으로 재탄생했지. 이제부터 나와 함께 상상플랫폼의 역사를 알아보려고 해!", target: "char-sangsang" }
        ];

        let currentIndex = 0;

        /**
         * Dialogue Turn Management Engine
         */
        function advanceDialogue() {
            currentIndex++;
            if (currentIndex < dialogues.length) {
                updateDialogueView();
            } else {
                endDialogueStage();
            }
        }

        /**
         * Render active character and text block
         */
        function updateDialogueView() {
            const currentData = dialogues[currentIndex];
            
            // Text Content Swap
            document.getElementById("speaker-name").innerText = currentData.speaker;
            document.getElementById("dialogue-text").innerText = currentData.text;

            // Character Focus Filter Toggle
            document.querySelectorAll(".character-wrapper").forEach(el => {
                if (el.id === currentData.target) {
                    el.classList.remove("inactive");
                } else {
                    el.classList.add("inactive");
                }
            });
        }

        /**
         * Fast-forward/Skip processing logic
         */
        function skipDialogue() {
            endDialogueStage();
        }

        /**
         * Conclude visual novel context and transition to standard map navigation buttons
         */
        function endDialogueStage() {
            // Hide interaction elements
            document.getElementById("dialogue-box").style.display = "none";
            document.getElementById("btn-skip").style.display = "none";

            // Restore complete lighting state to all characters
            document.querySelectorAll(".character-wrapper").forEach(el => {
                el.classList.remove("inactive");
            });

            // Display direction routing interfaces
            document.getElementById("btn-prev").style.display = "block";
            document.getElementById("btn-next").style.display = "block";
        }

        /**
         * Global Client Window Routing Manager
         */
        function navigateTo(url) {
            if (url && url.trim() !== "") {
                window.location.href = url;
            }
        }

        // Initialize Phase Highlight System Configuration
        window.addEventListener("DOMContentLoaded", () => {
            // First speaker focus accentuation setup
            document.querySelectorAll(".character-wrapper").forEach(el => {
                if (el.id !== dialogues[0].target) el.classList.add("inactive");
            });
        });
    </script>
</body>
</html>
