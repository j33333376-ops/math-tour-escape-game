<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맥아더 장군 CSS 그래픽 아트 (투명 배경)</title>
    <style>
        :root {
            --accent-color: #d4af37; /* 금빛 계급장 */
            --skin-color: #ffdbca; /* 미국인 밝은 피부 */
            --uniform-khaki: #4a533c; /* 군복 카키 */
            --hair-color: #5a3d28; /* 갈색 머리 */
            --sunglasses: #111111;
            --pipe-brown: #8b5a2b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* 배경 투명색 지정 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 캐릭터 그래픽 본체 */
        .general-art {
            position: relative;
            width: 300px;
            height: 360px;
            transform: scale(1.2);
        }

        /* 장교 모자 (정모) */
        .military-cap {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 210px;
            height: 65px;
            background-color: var(--uniform-khaki);
            border-radius: 40% 40% 15% 15% / 80% 80% 20% 20%;
            z-index: 5;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
        }

        /* 모자 챙 */
        .cap-visor {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 20px;
            background-color: #111;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
        }

        /* 모자 금빛 문양 */
        .cap-badge {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 24px;
            background-color: var(--accent-color);
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
        }

        /* 갈색 머리카락 */
        .hair {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 172px;
            height: 65px;
            background-color: var(--hair-color);
            border-radius: 30% 30% 0 0;
            z-index: 2;
        }

        /* 얼굴 (미국인 밝은 피부) */
        .face {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 166px;
            height: 155px;
            background-color: var(--skin-color);
            border-radius: 40% 40% 50% 50% / 40% 40% 60% 60%;
            z-index: 3;
            box-shadow: inset 0 -8px 15px rgba(0,0,0,0.1);
        }

        /* 썬글라스 */
        .sunglasses {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 144px;
            height: 48px;
            z-index: 4;
            display: flex;
            justify-content: space-between;
        }

        .lens {
            width: 66px;
            height: 45px;
            background: linear-gradient(135deg, #222 0%, #000 100%);
            border-radius: 20% 20% 50% 50% / 30% 30% 70% 70%;
            border: 2px solid var(--accent-color);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            position: relative;
        }

        .lens::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 10px;
            width: 15px;
            height: 6px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .glass-bridge {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 4px;
            background-color: var(--accent-color);
        }

        /* 입과 파이프 담배 */
        .mouth-pipe-group {
            position: absolute;
            bottom: 30px;
            left: 65px;
            width: 120px;
            height: 40px;
            z-index: 4;
        }

        .mouth {
            position: absolute;
            top: 8px;
            left: 25px;
            width: 36px;
            height: 5px;
            background-color: #b57c6c;
            border-radius: 2px;
        }

        .pipe-stem {
            position: absolute;
            top: 7px;
            left: 55px;
            width: 50px;
            height: 5px;
            background-color: #222;
            transform: rotate(-10deg);
            transform-origin: left center;
        }

        .pipe-bowl {
            position: absolute;
            top: -18px;
            left: 98px;
            width: 26px;
            height: 36px;
            background-color: var(--pipe-brown);
            border-radius: 5px 5px 10px 10px;
            border-top: 4px solid #443;
            box-shadow: 3px 4px 6px rgba(0,0,0,0.3);
            animation: pipe-shake 4s infinite ease-in-out;
        }

        .smoke {
            position: absolute;
            top: -35px;
            left: 104px;
            width: 18px;
            height: 18px;
            background-color: rgba(255,255,255,0.25);
            border-radius: 50%;
            filter: blur(4px);
            animation: float-smoke 3s infinite ease-in-out;
        }

        /* 군복 상체 */
        .uniform-chest {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 145px;
            background-color: var(--uniform-khaki);
            border-radius: 30% 30% 0 0;
            z-index: 1;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.15);
        }

        /* 군복 칼라 깃 */
        .collar {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 76px;
            height: 50px;
            background-color: #3e4532;
            clip-path: polygon(0% 0%, 100% 0%, 80% 100%, 50% 70%, 20% 100%);
        }

        /* 5성 장군 계급장 */
        .stars {
            position: absolute;
            top: 18px;
            width: 65px;
            height: 12px;
            display: flex;
            justify-content: space-between;
        }
        .stars.left { left: 16px; transform: rotate(15deg); }
        .stars.right { right: 16px; transform: rotate(-15deg); }
        
        .star {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        /* 애니메이션 효과 */
        @keyframes pipe-shake {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-1px) rotate(-2deg); }
        }

        @keyframes float-smoke {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            50% { transform: translateY(-18px) translateX(8px) scale(1.4); opacity: 0.5; }
            100% { transform: translateY(-35px) translateX(18px) scale(1.8); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="general-art">
    <!-- 모자 -->
    <div class="military-cap">
        <div class="cap-badge"></div>
        <div class="cap-visor"></div>
    </div>
    
    <!-- 머리카락 -->
    <div class="hair"></div>
    
    <!-- 미국인 얼굴 구획 (피부, 썬글라스, 파이프 담배) -->
    <div class="face">
        <div class="sunglasses">
            <div class="glass-bridge"></div>
            <div class="lens"></div>
            <div class="lens"></div>
        </div>
        
        <div class="mouth-pipe-group">
            <div class="mouth"></div>
            <div class="pipe-stem"></div>
            <div class="pipe-bowl"></div>
            <div class="smoke"></div>
        </div>
    </div>

    <!-- 군복 상체 (5성 계급장 포함) -->
    <div class="uniform-chest">
        <div class="collar"></div>
        <div class="stars left">
            <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
        </div>
        <div class="stars right">
            <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
        </div>
    </div>
</div>

</body>
</html>
