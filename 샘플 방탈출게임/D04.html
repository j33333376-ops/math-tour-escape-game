<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - D04</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 공통 및 구조 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #2d3748;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: #f5f0e6; /* 양피지 톤 */
            background-image: radial-gradient(circle, rgba(245,240,230,0.3) 0%, rgba(212,175,55,0.05) 100%);
            border: 6px double #d4af37; /* 앤틱 골드 테두리 */
            overflow: hidden;
        }

        /* 상단 정보 표시바 */
        #stage-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            padding: 8px 20px;
            background-color: rgba(30, 41, 59, 0.85);
            border: 1px solid #d4af37;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .stage-title {
            font-family: 'Nanum Myeongjo', serif;
            font-weight: 700;
            color: #d4af37;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .stage-location {
            font-family: 'Noto Sans KR', sans-serif;
            color: #ffffff;
            font-size: 13px;
        }

        /* 무대 배경 및 에셋 배치 영역 */
        #stage-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* 건물 로딩 프레임 (원본 500x380, 목표 높이 무대의 약 60%, 배율 s=0.5) */
        .building-wrapper {
            position: absolute;
            left: 50%;
            bottom: 120px;
            transform: translateX(-50%);
            width: 250px;  /* 500 * 0.5 */
            height: 190px; /* 380 * 0.5 */
            overflow: hidden;
            z-index: 15;
            filter: sepia(40%) contrast(95%);
            border-bottom: 3px solid #8c3030;
        }
        .building-iframe {
            border: 0;
            width: 500px;
            height: 380px;
            transform: scale(0.5);
            transform-origin: top left;
            overflow: hidden;
        }

        /* 인물 캐릭터 공통 프레임 (260x320) */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 80px;
            z-index: 20;
            overflow: visible !important;
            transition: filter 0.4s ease, transform 0.4s ease;
        }
        .character-iframe {
            width: 260px;
            height: 320px;
            border: 0;
            overflow: hidden;
        }

        /* 캐릭터 인접 비활성화(어둡게) 효과 */
        .character-wrapper.inactive {
            filter: brightness(0.4) grayscale(30%);
            transform: scale(0.96);
        }

        /* 캐릭터 개별 위치 */
        #char-minwoo { left: 80px; }
        #char-sangsang { left: 50%; transform: translateX(-50%); bottom: 60px; z-index: 25; }
        #char-sangsang.inactive { transform: translateX(-50%) scale(0.96); }
        #char-seoyeon { right: 80px; }

        /* 하단 대화창 UI */
        #dialogue-box {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            height: 135px;
            background-color: rgba(15, 23, 42, 0.88);
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 15px 25px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 16px;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 8px;
            display: inline-block;
            border-bottom: 1px dashed #d4af37;
            padding-bottom: 2px;
        }
        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            color: #ffffff;
            line-height: 1.6;
            letter-spacing: -0.02em;
        }
        .click-guide {
            position: absolute;
            right: 20px;
            bottom: 10px;
            font-size: 11px;
            color: rgba(212, 175, 55, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 이동 네비게이션 버튼 */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            background-color: #8c3030;
            color: white;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            z-index: 300;
            transition: background-color 0.2s ease;
        }
        .btn-nav:hover {
            background-color: #661f1f;
        }
        #btn-prev { left: 20px; }
        #btn-next, #btn-skip { right: 20px; }

        /* 바닥면 대지 표현 */
        .ground-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 110px;
            background-color: #e3dac9;
            border-top: 2px solid #cbd5e1;
            z-index: 5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="stage-header">
        <div class="stage-title">제 4 장: 개항기 거리를 걷다</div>
        <div class="stage-location">인천개항박물관 앞거리</div>
    </div>

    <div id="stage-view">
        <div class="building-wrapper">
            <iframe src="D_인천개항박물관.html" class="building-iframe" scrolling="no"></iframe>
        </div>

        <div id="char-minwoo" class="character-wrapper">
            <iframe src="민우.html" class="character-iframe" scrolling="no"></iframe>
        </div>
        
        <div id="char-sangsang" class="character-wrapper">
            <iframe src="상상.html" class="character-iframe" scrolling="no"></iframe>
        </div>

        <div id="char-seoyeon" class="character-wrapper">
            <iframe src="서연.html" class="character-iframe" scrolling="no"></iframe>
        </div>

        <div class="ground-line"></div>
    </div>

    <div id="dialogue-box" onclick="advanceDialogue()">
        <div id="speaker-name">민우</div>
        <div id="dialogue-text">로딩 중...</div>
        <div class="click-guide">▼ 화면을 클릭하여 계속</div>
    </div>

    <button id="btn-prev" class="btn-nav" style="display:none;" onclick="navigate('D03.html')">이전 장면</button>
    <button id="btn-skip" class="btn-nav" onclick="skipDialogue()">건너뛰기</button>
    <button id="btn-next" class="btn-nav" style="display:none;" onclick="navigate('D05.html')">다음 장면</button>
</div>

<script>
    // 상상이와 서연이의 대화 분량을 대폭 늘린 스크립트 데이터 (유형 2 규칙 준수)
    const dialogues = [
        {
            speaker: "민우",
            text: "와, 여기가 바로 개항기 시절의 인천 거리구나! 양옆으로 세워진 서양식 석조 건물들이 정말 이국적인 풍경을 만들어내고 있어.",
            target: "char-minwoo"
        },
        {
            speaker: "서연",
            text: "맞아! 저기 보이는 인천개항박물관 건물도 원래는 일본 제일은행 지점 건물이었대. 붉은 벽돌이랑 돌로 지어진 모습이 지금 봐도 엄청 튼튼해 보여.",
            target: "char-seoyeon"
        },
        {
            speaker: "상상",
            text: "[AMI 아카이브 검색 완료] 1883년 인천 개항 이후, 이 거리를 중심으로 각 나라의 관할 구역인 '조계지'가 설정되면서 서구식 건물들이 밀집하기 시작했단다.",
            target: "char-sangsang"
        },
        {
            speaker: "서연",
            text: "그럼 당시에 이 길을 걸어 다니던 사람들의 모습은 어땠어? 지금 우리처럼 교복을 입은 학생들도 있었을까?",
            target: "char-seoyeon"
        },
        {
            speaker: "상상",
            text: "좋은 질문이야! 개항기 거리에는 갓을 쓰고 도포를 입은 조선인들과 양복을 입은 서양 선교사, 그리고 한복 형태의 초기 여학교 교복을 입은 학생들이 한데 섞여 다녔어.",
            target: "char-sangsang"
        },
        {
            speaker: "민우",
            text: "우와, 상상만 해도 정말 신기하고 기묘한 풍경이었겠다! 전통과 근대 문화가 융합되던 격동의 시기였던 거네.",
            target: "char-minwoo"
        },
        {
            speaker: "서연",
            text: "저기 늘어선 상점들에서는 서양에서 들어온 신기한 물건들이나 커피 같은 걸 팔았겠지? 탕국이라고 불렀다던데, 나도 한 번 마셔보고 싶다!",
            target: "char-seoyeon"
        },
        {
            speaker: "상상",
            text: "당시 인천항을 통해 전등, 전화, 철도 같은 근대적 발명품들이 최초로 들어왔단다. 이 거리는 조선에서 가장 먼저 새로운 미래를 맞이하던 통로였던 셈이지.",
            target: "char-sangsang"
        },
        {
            speaker: "서연",
            text: "화려해 보이는 거리 풍경 뒤에는 개항기 백성들의 치열한 삶과 역사적 아픔도 함께 녹아있는 것 같아서 마음이 조금 진중해지기도 해.",
            target: "char-seoyeon"
        }
    ];

    let currentIndex = 0;

    function advanceDialogue() {
        if (currentIndex < dialogues.length) {
            const currentData = dialogues[currentIndex];
            
            document.getElementById("speaker-name").innerText = currentData.speaker;
            document.getElementById("dialogue-text").innerText = currentData.text;
            
            document.querySelectorAll('.character-wrapper').forEach(el => {
                el.classList.add('inactive');
            });
            
            const activeWrapper = document.getElementById(currentData.target);
            if (activeWrapper) {
                activeWrapper.classList.remove('inactive');
            }
            
            currentIndex++;
        } else {
            endDialoguePhase();
        }
    }

    function skipDialogue() {
        endDialoguePhase();
    }

    function endDialoguePhase() {
        document.getElementById("dialogue-box").style.display = "none";
        document.getElementById("btn-skip").style.display = "none";
        
        document.querySelectorAll('.character-wrapper').forEach(el => {
            el.classList.remove('inactive');
        });
        
        document.getElementById("btn-prev").style.display = "block";
        document.getElementById("btn-next").style.display = "block";
    }

    function navigate(url) {
        if(url) {
            window.location.href = url;
        }
    }

    window.onload = function() {
        advanceDialogue();
    };
</script>

</body>
</html>
