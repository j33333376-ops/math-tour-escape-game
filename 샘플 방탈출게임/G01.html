<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천상륙작전의 암호를 해결하라!</title>
    <style>
        /* 폰트 구성 */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 공통 스타일 및 변수 정의 */
        :root {
            --color-main: #8c3030;       /* 다크 레드 */
            --color-sub: #d4af37;        /* 앤틱 골드 */
            --color-text-dark: #2d3748;  /* 어두운 텍스트 */
            --color-text-light: #ffffff; /* 밝은 텍스트 */
            --color-bg: #f5f0e6;         /* 연베이지 양피지 느낌 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 게임 화면 컨테이너 (16:9 비율 고정) */
        #game-container {
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background-color: var(--color-bg);
            position: relative;
            overflow: hidden;
            border: 4px solid var(--color-sub);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
        }

        /* 스테이지 상단 표시바 (G02 요구사항 스타일 반영: 반투명 어두운 배경) */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: rgba(45, 55, 72, 0.85);
            border-bottom: 2px solid var(--color-sub);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
        }

        #top-bar .game-title {
            font-family: 'Nanum Myeongjo', serif;
            color: var(--color-sub);
            font-weight: bold;
            font-size: 1.05rem;
            letter-spacing: 0.05em;
        }

        #top-bar .stage-name {
            font-family: 'Nanum Myeongjo', serif;
            color: var(--color-text-light);
            font-size: 0.95rem;
        }

        /* 무대 배경 및 에셋 배치 영역 */
        #stage-canvas {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000; /* 전체 화면 에셋 로드 전 빌지 방지 */
        }

        /* 등장인물 Wrapper 공통 규격 */
        .char-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            transition: filter 0.4s ease, opacity 0.8s ease, transform 0.6s ease;
            z-index: 10;
        }

        .char-wrapper iframe {
            border: 0;
            width: 260px;
            height: 320px;
            overflow: hidden;
        }

        /* 인물별 개별 위치 설정 */
        #char-seoyeon {
            left: 60px;
            bottom: 15px;
        }

        #char-minwoo {
            left: 240px;
            bottom: 15px;
        }

        #char-macarthur {
            right: 80px;
            bottom: 15px;
            opacity: 0; /* 초기 상태 숨김 */
            transform: translateX(40px);
        }

        /* 캐릭터 좌우 반전 (서로 마주 보게 처리) */
        .flip-x {
            transform: scaleX(-1);
        }

        /* 맥아더 장군 등장 시 적용할 클래스 */
        #char-macarthur.appear {
            opacity: 1;
            transform: translateX(0);
        }

        /* 비활성화된 대화 상대 어둡게 처리 */
        .char-wrapper.inactive {
            filter: brightness(0.4) grayscale(0.2);
        }

        /* 맥아더장군 하단 뿌연 연기 효과 컨테이너 */
        #smoke-container {
            position: absolute;
            right: 40px;      /* 맥아더 장군 위치 주변에 걸치도록 배치 */
            bottom: 0;
            width: 340px;
            height: 120px;
            z-index: 15;      /* 캐릭터 발밑을 살짝 덮도록 레이어 배치 */
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease-in-out; /* 부드럽게 피어오르는 효과 */
            overflow: hidden;
        }

        #smoke-container.active {
            opacity: 10;     /* 연기의 투명도 유지 및 고정 */
        }

        /* 연기 입자 공통 애니메이션 */
        .smoke-particle {
            position: absolute;
            bottom: -20px;
            background: radial-gradient(circle, rgba(235, 225, 205, 0.6) 0%, rgba(200, 190, 170, 0.2) 50%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(20px);
            animation: driftSmoke 5s infinite ease-in-out alternate;
        }

        /* 일렁이는 입자 멀티 레이어화 */
        .smoke-1 { width: 180px; height: 100px; left: 10px; animation-delay: 0s; }
        .smoke-2 { width: 220px; height: 110px; left: 90px; animation-delay: -1.8s; }
        .smoke-3 { width: 160px; height: 90px; right: 10px; animation-delay: -3.2s; }

        @keyframes driftSmoke {
            0% {
                transform: translateY(10px) scale(0.9) translateX(-10px);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-15px) scale(1.1) translateX(15px);
                opacity: 0.8;
            }
            100% {
                transform: translateY(0px) scale(1.0) translateX(-5px);
                opacity: 0.5;
            }
        }

        /* 유형 1: 상황 설명 박스 (양피지 스타일) */
        #situation-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            background: #fbf7ee;
            border: 2px dashed var(--color-main);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            padding: 30px;
            text-align: center;
            z-index: 40;
            border-radius: 4px;
            transition: opacity 0.5s ease;
        }

        #situation-box p {
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--color-text-dark);
            font-size: 1.1rem;
            line-height: 1.7;
            word-break: keep-all;
        }

        /* 유형 2: 대화창 UI (등장인물을 가리지 않도록 상단에 배치) */
        #dialogue-box {
            position: absolute;
            top: 65px; /* 상단 바 바로 아래 배치 */
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            height: 135px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--color-sub);
            border-radius: 6px;
            padding: 15px 25px;
            z-index: 45;
            cursor: pointer;
            display: none; /* 초기에 숨김 처리 */
        }

        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            color: var(--color-sub);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            display: inline-block;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            padding-bottom: 2px;
        }

        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--color-text-light);
            font-size: 1.05rem;
            line-height: 1.6;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        #click-prompt {
            position: absolute;
            right: 20px;
            bottom: 10px;
            color: var(--color-sub);
            font-size: 0.8rem;
            animation: blink 1s infinite alternate;
        }

        /* 공통 이동 버튼 스타일 */
        .btn-nav {
            position: absolute;
            background: var(--color-main);
            color: white;
            border: 1px solid var(--color-sub);
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            z-index: 60;
            transition: background 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .btn-nav:hover {
            background: #661f1f;
        }

        #btn-prev {
            left: 20px;
            bottom: 20px;
        }

        #btn-next, #btn-skip {
            right: 20px;
            bottom: 20px;
        }

        #btn-next {
            display: none; /* 대화 전개 완료 전까지 숨김 */
        }

        @keyframes blink {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="top-bar">
            <span class="game-title">인천상륙작전의 암호를 해결하라!</span>
            <span class="stage-name">자유공원-맥아더 장군과의 만남</span>
        </div>

        <div id="stage-canvas">
            
            <div style="position: absolute; left: 0; bottom: 0; width: 1066px; height: 600px; overflow: hidden; z-index: 1;">
                <iframe src="G_맥아더장군동상.html" scrolling="no" style="border:0; width:1066px; height:600px; transform:scale(1); transform-origin:top left;"></iframe>
            </div>

            <div id="char-seoyeon" class="char-wrapper">
                <iframe src="서연.html" scrolling="no"></iframe>
            </div>

            <div id="char-minwoo" class="char-wrapper">
                <iframe src="민우.html" scrolling="no"></iframe>
            </div>

            <div id="char-macarthur" class="char-wrapper">
                <div class="flip-x" style="width:100%; height:100%;">
                    <iframe src="맥아더장군.html" scrolling="no"></iframe>
                </div>
            </div>

            <div id="smoke-container">
                <div class="smoke-particle smoke-1"></div>
                <div class="smoke-particle smoke-2"></div>
                <div class="smoke-particle smoke-3"></div>
            </div>

        </div>

        <div id="situation-box">
            <p>공원의 무거운 침묵을 깨고, 공간의 틈새가 뒤틀리기 시작합니다.<br>이윽고 짙은 안개 속에서 누군가의 형상이 모습을 드러내는데...</p>
        </div>

        <div id="dialogue-box" onclick="advanceDialogue()">
            <div id="speaker-name">화자</div>
            <div id="dialogue-text">대사 내용</div>
            <div id="click-prompt">클릭하여 계속 ▼</div>
        </div>

        <button id="btn-prev" class="btn-nav" onclick="goToURL('INDEX.html')">이전</button>
        <button id="btn-skip" class="btn-nav" onclick="skipDialogue()" style="display:none;">건너뛰기</button>
        <button id="btn-next" class="btn-nav" onclick="goToURL('G02.html')">다음</button>
    </div>

    <script>
        const dialogues = [
            {
                speaker: "서연",
                text: "말도 안돼....맥아더 장군님...?",
                target: "char-seoyeon"
            },
            {
                speaker: "맥아더장군",
                text: "음, 미래에서 온 손님들이군. 반갑네. 지금 시간의 축이 뒤틀려 내가 있던 1950년 인천상륙작전의 역사적 데이터가 지워지고 있네. 이대로 두면 현재의 대한민국도, 이 차이나타운도 사라지게 될 걸세.",
                target: "char-macarthur"
            },
            {
                speaker: "민우",
                text: "시간이 뒤틀렸다고요? 저희가 뭘 어떻게 해야 하죠?",
                target: "char-minwoo"
            },
            {
                speaker: "맥아더장군",
                text: "내가 가진 '비밀 작전 지도'의 봉인을 풀어야 하네. 암호는 이 장소와 역사적 숫자에 숨겨져 있지. 자, 시작하세.",
                target: "char-macarthur"
            }
        ];

        let currentIndex = 0;
        let isDialogueReady = false;

        window.addEventListener('DOMContentLoaded', () => {
            // 1. 페이지 로드 5초 뒤: 맥아더 장군 등장 및 박스 전환
            setTimeout(() => {
                const sitBox = document.getElementById('situation-box');
                sitBox.style.opacity = '0';
                setTimeout(() => { sitBox.style.display = 'none'; }, 500);

                const macarthur = document.getElementById('char-macarthur');
                macarthur.classList.add('appear');

                setTimeout(() => {
                    document.getElementById('dialogue-box').style.display = 'block';
                    document.getElementById('btn-skip').style.display = 'block';
                    isDialogueReady = true;
                    updateDialogueView();
                }, 600);

            }, 5000);

            // 2. 맥아더 등장(5초) 후 정확히 2초 뒤(총 7초): 뿌연 연기 효과 가동 및 영구 유지
            setTimeout(() => {
                const smokeContainer = document.getElementById('smoke-container');
                if (smokeContainer) {
                    smokeContainer.classList.add('active');
                }
            }, 7000);
        });

        function updateDialogueView() {
            if (currentIndex >= dialogues.length) {
                completeDialogueSequence();
                return;
            }

            const currentData = dialogues[currentIndex];
            document.getElementById('speaker-name').innerText = currentData.speaker;
            document.getElementById('dialogue-text').innerText = currentData.text;

            document.querySelectorAll('.char-wrapper').forEach(el => {
                el.classList.add('inactive');
            });

            const activeSpeaker = document.getElementById(currentData.target);
            if (activeSpeaker) {
                activeSpeaker.classList.remove('inactive');
            }
        }

        function advanceDialogue() {
            if (!isDialogueReady) return;
            currentIndex++;
            updateDialogueView();
        }

        function completeDialogueSequence() {
            isDialogueReady = false;
            document.getElementById('dialogue-box').style.display = 'none';
            document.getElementById('btn-skip').style.display = 'none';

            document.querySelectorAll('.char-wrapper').forEach(el => {
                el.classList.remove('inactive');
            });

            document.getElementById('btn-next').style.display = 'block';
        }

        function skipDialogue() {
            completeDialogueSequence();
        }

        function goToURL(url) {
            if (url) {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
