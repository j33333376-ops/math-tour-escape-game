<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전통 차이나타운 패루 일러스트</title>
    <style>
        /* 기본 배경 및 레이아웃 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Malgun Gothic', sans-serif;
        }

        /* 패루 전체 컨테이너 */
        .paifang-gate {
            position: relative;
            width: 900px;
            height: 650px;
            box-sizing: border-box;
        }

        /* ==========================================
           1. 기둥 시스템 (Pillars & Bases)
        ========================================== */
        .pillar {
            position: absolute;
            background: linear-gradient(90deg, #a60f0f 0%, #d32f2f 25%, #ff5252 50%, #d32f2f 75%, #7a0707 100%);
            border: 2px solid #222;
            border-bottom: none;
            box-shadow: inset 2px 0 5px rgba(255,255,255,0.3), 5px 5px 15px rgba(0,0,0,0.2);
            z-index: 5;
        }

        /* 기둥 내부의 화려한 황금 용/구름 추상화 문양 */
        .pillar::before {
            content: '';
            position: absolute;
            top: 40px;
            bottom: 60px;
            left: 4px;
            right: 4px;
            background: repeating-linear-gradient(45deg, rgba(255, 215, 0, 0.4) 0px, rgba(255, 215, 0, 0.4) 10px, transparent 10px, transparent 20px),
                        repeating-linear-gradient(-45deg, rgba(218, 165, 32, 0.3) 0px, rgba(218, 165, 32, 0.3) 8px, transparent 8px, transparent 16px);
            opacity: 0.9;
        }

        /* 기둥 개별 위치 및 크기 */
        .pillar-1 { left: 60px;  bottom: 0; width: 45px; height: 420px; } /* 좌측 외곽 */
        .pillar-2 { left: 250px; bottom: 0; width: 55px; height: 500px; } /* 좌측 내부 */
        .pillar-3 { right: 250px; bottom: 0; width: 55px; height: 500px; } /* 우측 내부 */
        .pillar-4 { right: 60px; bottom: 0; width: 45px; height: 420px; } /* 우측 외곽 */

        /* 기둥 하단 황금 받침대 (Pedestals) */
        .pillar-base {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #ffe066 0%, #f5b041 40%, #b37d14 100%);
            border: 2px solid #222;
            border-radius: 6px 6px 0 0;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.15), 2px 2px 5px rgba(0,0,0,0.3);
            z-index: 6;
        }
        .pillar-1 .pillar-base, .pillar-4 .pillar-base { width: 65px; height: 50px; }
        .pillar-2 .pillar-base, .pillar-3 .pillar-base { width: 80px; height: 65px; }

        /* ==========================================
           2. 대들보 및 단청 문양 (Beams & Dancheong)
        ========================================== */
        /* 하단 메인 대들보 (전체를 관통하는 가로 보) */
        .beam-lower-main {
            position: absolute;
            left: 55px;
            right: 55px;
            bottom: 350px;
            height: 35px;
            background: linear-gradient(180deg, #27ae60 0%, #1e8449 100%);
            border: 2px solid #222;
            z-index: 4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        /* 하단 보의 화려한 패턴 격자 */
        .beam-lower-main::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, #f1c40f 0px, #f1c40f 12px, #e74c3c 12px, #e74c3c 18px, transparent 18px, transparent 36px);
            opacity: 0.8;
        }

        /* 중앙 상부 메인 대들보 (현판이 들어가는 파란 배경 보) */
        .beam-center-upper {
            position: absolute;
            left: 245px;
            right: 245px;
            bottom: 425px;
            height: 80px;
            background: linear-gradient(180deg, #2980b9 0%, #1f618d 100%);
            border: 2px solid #222;
            z-index: 4;
            box-shadow: 0 5px 8px rgba(0,0,0,0.2);
        }
        .beam-center-upper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, #f39c12 0px, #f39c12 20px, #27ae60 20px, #27ae60 30px, transparent 30px, transparent 60px);
            opacity: 0.5;
        }

        /* 좌우 외곽 대들보 장식 판넬 (붉은색 벽면 공간) */
        .beam-side-panel {
            position: absolute;
            bottom: 383px;
            width: 142px;
            height: 44px;
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
            border: 2px solid #222;
            z-index: 4;
        }
        .beam-side-panel-left { left: 107px; }
        .beam-side-panel-right { right: 107px; }
        
        /* 외곽 판넬 내부 황금 문양 테두리 */
        .beam-side-panel::after {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 2px dashed #f1c40f;
            opacity: 0.7;
        }

        /* 전통 목조 건축의 겹처마/공포(Dougong) 효과 완벽 재현 */
        .dougong-tier {
            position: absolute;
            height: 12px;
            background: repeating-linear-gradient(90deg, #145a32 0px, #145a32 15px, #f1c40f 15px, #f1c40f 25px);
            border: 2px solid #222;
            z-index: 4;
        }
        .dougong-main { bottom: 503px; left: 235px; width: 426px; }
        .dougong-left { bottom: 425px; left: 50px; width: 202px; }
        .dougong-right { bottom: 425px; right: 50px; width: 202px; }

        /* ==========================================
           3. 중앙 정품 현판 (Plaque)
        ========================================== */
        .main-plaque {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 437px;
            width: 240px;
            height: 56px;
            background: #0f4cbf;
            border: 4px double #f1c40f;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.4);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 14px;
            padding-left: 14px; /* 글자 균형 조절 */
            text-shadow: 3px 3px 5px #000000, 0 0 10px #f1c40f;
            z-index: 7;
        }

        /* ==========================================
           4. 기와지붕 시스템 (Roofs & Eaves)
        ========================================== */
        /* 지붕 공통 스타일 */
        .roof-structure {
            position: absolute;
            background: linear-gradient(180deg, #f39c12 0%, #e67e22 40%, #d35400 100%);
            border: 2px solid #222;
            z-index: 10;
        }
        /* 기와 골 무늬 패턴 레이어 */
        .tile-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 5px, transparent 5px, transparent 15px);
        }

        /* [중앙 상단 메인 지붕] - 사다리꼴 형태로 완벽 컷팅 */
        .roof-top-main {
            bottom: 513px;
            left: 200px;
            width: 496px;
            height: 85px;
            clip-path: polygon(14% 0%, 86% 0%, 100% 84%, 96% 100%, 4% 100%, 0% 84%);
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
        }

        /* [좌측 하단 지붕] */
        .roof-side-left {
            bottom: 435px;
            left: 30px;
            width: 224px;
            height: 55px;
            clip-path: polygon(16% 0%, 96% 0%, 100% 80%, 95% 100%, 5% 100%, 0% 80%);
        }

        /* [우측 하단 지붕] */
        .roof-side-right {
            bottom: 435px;
            right: 30px;
            width: 224px;
            height: 55px;
            clip-path: polygon(4% 0%, 84% 0%, 100% 80%, 95% 100%, 5% 100%, 0% 80%);
        }

        /* 중국 전통 건축 특유의 하늘로 솟아오른 처마 끝(Eave Wings) 디테일 */
        .eave-wing {
            position: absolute;
            width: 45px;
            height: 40px;
            background: linear-gradient(135deg, #f39c12, #d35400);
            border: 2px solid #222;
            z-index: 9;
        }
        .wing-top-l { bottom: 520px; left: 168px; border-radius: 0 0 0 100%; transform: rotate(-20deg); }
        .wing-top-r { bottom: 520px; right: 168px; border-radius: 0 0 100% 0; transform: rotate(20deg); }
        .wing-bottom-l { bottom: 442px; left: 2px; border-radius: 0 0 0 100%; transform: rotate(-20deg); }
        .wing-bottom-r { bottom: 442px; right: 2px; border-radius: 0 0 100% 0; transform: rotate(20deg); }

        /* ==========================================
           5. 지붕 상부 용마루 및 황금 장식 (Decos)
        ========================================== */
        .roof-crest-line {
            position: absolute;
            bottom: 596px;
            left: 265px;
            width: 366px;
            height: 10px;
            background: #b37d14;
            border: 2px solid #222;
            z-index: 11;
        }
        /* 용마루 중앙 호로병/탑 장식 */
        .crest-center-deco {
            position: absolute;
            bottom: 604px;
            left: 438px;
            width: 20px;
            height: 30px;
            background: linear-gradient(90deg, #ffe066, #f5b041);
            border: 2px solid #222;
            border-radius: 50% 50% 20% 20%;
            z-index: 12;
        }
        /* 용마루 양끝 취두(용머리 모양 장식) 추상화 */
        .crest-edge-deco {
            position: absolute;
            bottom: 598px;
            width: 22px;
            height: 22px;
            background: #f5b041;
            border: 2px solid #222;
            border-radius: 50% 50% 0 0;
            z-index: 12;
        }
        .crest-edge-l { left: 255px; transform: rotate(-15deg); }
        .crest-edge-r { right: 255px; transform: rotate(15deg); }
    </style>
</head>
<body>

    <div class="paifang-gate">
        
        <div class="roof-crest-line"></div>
        <div class="crest-center-deco"></div>
        <div class="crest-edge-deco crest-edge-l"></div>
        <div class="crest-edge-deco crest-edge-r"></div>

        <div class="eave-wing wing-top-l"></div>
        <div class="eave-wing wing-top-r"></div>
        <div class="roof-structure roof-top-main">
            <div class="tile-pattern"></div>
        </div>

        <div class="eave-wing wing-bottom-l"></div>
        <div class="eave-wing wing-bottom-r"></div>
        <div class="roof-structure roof-side-left">
            <div class="tile-pattern"></div>
        </div>
        <div class="roof-structure roof-side-right">
            <div class="tile-pattern"></div>
        </div>

        <div class="main-plaque">中華街</div>

        <div class="dougong-tier dougong-main"></div>
        <div class="dougong-tier dougong-left"></div>
        <div class="dougong-tier dougong-right"></div>
        
        <div class="beam-center-upper"></div>
        <div class="beam-side-panel beam-side-panel-left"></div>
        <div class="beam-side-panel beam-side-panel-right"></div>
        <div class="beam-lower-main"></div>

        <div class="pillar pillar-1"><div class="pillar-base"></div></div>
        <div class="pillar pillar-2"><div class="pillar-base"></div></div>
        <div class="pillar pillar-3"><div class="pillar-base"></div></div>
        <div class="pillar pillar-4"><div class="pillar-base"></div></div>

    </div>
    </body>
</html>
