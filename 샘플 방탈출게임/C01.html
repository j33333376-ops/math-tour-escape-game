<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - C01</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        /* 스타일 리셋 및 기본 배경 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 16:9 반응형 게임 컨테이너 */
        #game-container {
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background: radial-gradient(circle at 50% 30%, #2c1111 0%, #120505 70%, #050101 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 4px solid #d4af37;
            box-sizing: border-box;
        }

        /* 개항기 분위기 밤하늘 연출 */
        .sky-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.8), transparent);
            pointer-events: none;
            z-index: 1;
        }

        /* 바닥 흙길 마당 */
        .ground-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(to bottom, #231b15 0%, #140f0c 100%);
            border-top: 3px solid #8c3030;
            z-index: 2;
        }

        /* 상단 표시바 */
        .top-info-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(18, 5, 5, 0.75);
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-sizing: border-box;
        }
        .stage-title {
            font-family: 'Nanum Myeongjo', serif;
            font-weight: 700;
            font-size: 20px;
            color: #d4af37;
            margin: 0;
        }
        .stage-subtitle {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 13px;
            color: #ffffff;
            opacity: 0.9;
        }

        /* 유형 1: 상황 설명 텍스트 박스 (양피지 스타일) */
        .situation-box {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-height: 125px;
            background-color: #f5f0e6;
            border: 3px double #8c3030;
            border-radius: 4px;
            padding: 12px 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(140,48,48,0.15);
            z-index: 9;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .situation-box h3 {
            font-family: 'Nanum Myeongjo', serif;
            color: #8c3030;
            margin: 0 0 6px 0;
            font-size: 16px;
            border-bottom: 1px dashed #d4af37;
            padding-bottom: 4px;
        }
        .situation-box p {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 13.5px;
            line-height: 1.6;
            letter-spacing: -0.02em;
            color: #2d3748;
            margin: 0;
            word-break: keep-all;
        }

        /* 에셋 배치 레이어 */
        .stage-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* 캐릭터 공통 래퍼 (정적 컴포넌트 규격 유지) */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            overflow: visible;
            pointer-events: auto;
        }
        .character-wrapper iframe {
            width: 260px;
            height: 320px;
            border: 0;
            overflow: hidden;
        }

        /* 주인공 스쿼드 (좌측 배치) */
        #char-minwoo {
            left: 40px;
            bottom: 60px;
            z-index: 6;
        }
        #char-seoyeon {
            left: 170px;
            bottom: 50px;
            z-index: 5;
            transform: scale(0.95); /* 미세한 원근감 */
        }

        /* 타임슬립 스파크 효과 오버레이 */
        .time-sparkle {
            position: absolute;
            left: 20px;
            bottom: 40px;
            width: 400px;
            height: 250px;
            background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 4;
            animation: flash 2s ease-in-out infinite alternate;
        }

        /* 미스터 첸 (우측 배치) */
        #char-chen {
            right: 50px;
            bottom: 65px;
            z-index: 6;
            transform: scaleX(-1); /* 민우, 서연을 마주보도록 좌우 반전 */
        }

        /* 공통 내비게이션 버튼 스타일 */
        .btn-nav {
            position: absolute;
            background-color: #8c3030;
            color: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            transition: background 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-nav:hover {
            background-color: #661f1f;
        }
        #btn-prev {
            left: 20px;
            bottom: 20px;
        }
        #btn-next {
            right: 20px;
            bottom: 20px;
        }

        /* 호흡 및 번쩍임 애니메이션 효과 */
        @keyframes flash {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* 스크롤바 커스텀 (상황 상자용) */
        .situation-box::-webkit-scrollbar {
            width: 6px;
        }
        .situation-box::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        .situation-box::-webkit-scrollbar-thumb {
            background-color: #8c3030;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- 상단 내비게이션 헤더 바 -->
        <div class="top-info-bar">
            <h2 class="stage-title">대불호텔의 비밀</h2>
            <div class="stage-subtitle">프롤로그 : 사라진 황금 열쇠</div>
        </div>

        <!-- 유형 1 전용: 상황 설명 아웃라인 박스 -->
        <div class="situation-box">
            <h3>[배경 / 연출]</h3>
            <p>번쩍하는 섬광과 함께 시계 초침 소리가 빠르게 되감기듯 들립니다. 눈을 떠보니 주위는 현대적인 전시관이 아닌, 가스등이 어스름하게 켜진 1889년의 대불호텔 앞마당입니다. 당황한 민우와 서연 앞을 화려한 마고자를 입은 미스터 첸이 가로막고 서서 손가락 사이로 황금 열쇠를 살랑살랑 흔들며 비웃고 있습니다.</p>
        </div>

        <!-- 환경 연출 무대 배경 레이어 -->
        <div class="sky-layer"></div>
        
        <!-- 규칙 2에 따른 대불호텔 에셋 로딩 (원본 500x500px, 축소배율 s=0.72 구조화 적용) -->
        <!-- 표시 영역 크기: W*s(360px), H*s(360px)로 정확하게 마크업 프레임 크기를 맞춰 잘림과 스크롤 방지 -->
        <div style="position: absolute; right: 80px; bottom: 120px; width: 360px; height: 360px; overflow: hidden; z-index: 2;">
            <iframe src="C_대불호텔.html" scrolling="no" style="border: 0; width: 500px; height: 500px; transform: scale(0.72); transform-origin: top left;"></iframe>
        </div>

        <div class="ground-layer"></div>
        <div class="time-sparkle"></div>

        <!-- 등장인물 레이어 (규칙 1, 6 기반 iframe 투명 배경 임베딩 구조 고수) -->
        <div class="stage-view">
            <!-- 주인공 민우 -->
            <div id="char-minwoo" class="character-wrapper">
                <iframe src="민우.html" scrolling="no"></iframe>
            </div>

            <!-- 주인공 서연 -->
            <div id="char-seoyeon" class="character-wrapper">
                <iframe src="서연.html" scrolling="no"></iframe>
            </div>

            <!-- 악역 미스터 첸 (좌우반전 적용) -->
            <div id="char-chen" class="character-wrapper">
                <iframe src="미스터첸.html" scrolling="no"></iframe>
            </div>
        </div>

        <!-- 공통 화면 이동 컴포넌트 컨트롤러 -->
        <button class="btn-nav" id="btn-prev" onclick="navigateTo('index.html')">이전 장면</button>
        <button class="btn-nav" id="btn-next" onclick="navigateTo('C02.html')">다음 장면</button>

    </div>

    <script>
        // 공통 기능: 부드러운 현재 창 주소 이동 제어 함수
        function navigateTo(url) {
            if (url && url.trim() !== "") {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
