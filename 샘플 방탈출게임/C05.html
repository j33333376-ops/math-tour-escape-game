<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - C05</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f5f0e6;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; font-family: 'Noto Sans KR', sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%; max-width: 1066px; aspect-ratio: 16 / 9;
            background-color: #f2eade;
            border: 6px double #d4af37;
            box-shadow: 0 12px 36px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* 퀴즈 및 캐릭터 영역 */
        .quiz-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 500px;
            background-color: #fffdf9;
            border: 4px solid #cfa87b;
            border-radius: 20px;
            padding: 20px;
            z-index: 100;
            text-align: center;
        }

        /* 내비게이션 버튼 */
        .btn-nav {
            position: absolute; background-color: #8c3030; color: white;
            border: 1px solid #d4af37; border-radius: 4px; padding: 10px 24px;
            font-family: 'Noto Sans KR', sans-serif; font-weight: bold; cursor: pointer; z-index: 130;
        }
        #btn-prev { left: 20px; bottom: 20px; }
        #btn-next { right: 20px; bottom: 20px; display: none; }

        .hidden { display: none; }
        .input-style { padding: 10px; border: 2px solid #cfa87b; border-radius: 10px; width: 80px; }
        .submit-btn { padding: 10px 20px; background:#8c3030; color:white; border:none; border-radius:10px; cursor:pointer; margin-top: 10px; }
        .key-icon { margin: 15px auto; }
        .dialogue-text { cursor: pointer; font-weight: bold; padding: 10px; border: 1px solid #d4af37; border-radius: 10px; margin-top: 10px; background: #fdf5e6; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 배경: 대불호텔 -->
    <div style="position:absolute; left:50%; bottom:100px; width:400px; height:400px; transform:translateX(-50%);">
        <iframe src="C_대불호텔.html" scrolling="no" style="border:0; width:500px; height:500px; transform:scale(0.8);"></iframe>
    </div>

    <!-- 민우와 서연 배치 -->
    <div style="position:absolute; left:50px; bottom:20px; z-index:50;">
        <div style="transform: scale(0.6);">[민우 캐릭터 컴포넌트 소스 삽입]</div>
    </div>
    <div style="position:absolute; right:50px; bottom:20px; z-index:50;">
        <div style="transform: scale(0.6);">[서연 캐릭터 컴포넌트 소스 삽입]</div>
    </div>

    <!-- 퀴즈 컨테이너 -->
    <div class="quiz-container">
        <div id="quiz1">
            <h2 style="color: #b37d4e; margin-bottom:10px;">양탕국의 비법퀴즈: 물의 양 구하기</h2>
            <p>150에서 출발하여 계산해보자!<br>150 → (3으로 나누기) → (50 더하기) → (2 곱하기)</p>
            <input type="number" id="q1" class="input-style">
            <button class="submit-btn" onclick="checkQuiz1()">정답 확인</button>
        </div>

        <div id="quiz2" class="hidden">
            <h2 style="color: #b37d4e; margin-bottom:10px;">양탕국의 비법퀴즈: 설탕의 양 구하기</h2>
            <p>전체 설탕 100g 중 1/4(4분의 1)을 사용했다면, 남은 설탕은 몇 g일까?</p>
            <input type="number" id="q2" class="input-style">
            <button class="submit-btn" onclick="checkQuiz2()">최종 확인</button>
        </div>

        <div id="result-area" class="hidden">
            <h3 style="color: #b37d4e;">모든 퀴즈 통과! 축하합니다!</h3>
            <p>열쇠를 찾았습니다.</p>
            <div class="key-icon">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            </div>
            <div id="minwoo-dialogue" class="dialogue-text" onclick="showSeoyeon()">민우: "모든 열쇠를 다 찾았어"</div>
            <div id="seoyeon-dialogue" class="dialogue-text hidden" style="background: #e6f4ea;">서연: "어서 열쇠를 이용해 호텔을 탈출하자"</div>
        </div>
    </div>

    <button id="btn-prev" class="btn-nav" onclick="window.location.href='C04.html'">이전 장면</button>
    <button id="btn-next" class="btn-nav" onclick="window.location.href='C06.html'">다음 장면</button>
</div>

<script>
    function checkQuiz1() {
        if (document.getElementById('q1').value === '200') {
            document.getElementById('quiz1').classList.add('hidden');
            document.getElementById('quiz2').classList.remove('hidden');
        } else { alert("다시 계산해보세요!"); }
    }
    function checkQuiz2() {
        if (document.getElementById('q2').value === '75') {
            document.getElementById('quiz2').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
        } else { alert("틀렸어요. 다시 생각해보세요!"); }
    }
    function showSeoyeon() {
        document.getElementById('minwoo-dialogue').style.display = 'none';
        document.getElementById('seoyeon-dialogue').classList.remove('hidden');
        document.getElementById('btn-next').style.display = 'block';
    }
</script>

</body>
</html>
