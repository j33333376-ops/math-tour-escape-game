<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차이나타운 체험학습앱 - F05</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

        :root {
            --dark-red: #8c3030;
            --dark-red-hover: #661f1f;
            --antique-gold: #d4af37;
            --warm-beige: #f5f0e6;
            --text-dark: #2d3748;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 16:9 비율 고정 컨테이너 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1066px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(to bottom, #1a0f1a, #2c1a1a);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            border: 2px solid #2a251f;
        }

        /* 상단 스테이지 표시바 */
        #stage-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--antique-gold);
            padding: 8px 32px;
            border-radius: 4px;
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }
        #stage-bar h1 {
            margin: 0;
            font-family: 'Nanum Myeongjo', serif;
            color: var(--antique-gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* 건물 배경 컨테이너 (정확한 원본 WxH 기반 스케일 처리) */
        #building-wrapper {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 1066px;
            height: 472px; /* 620 * 0.76142857 */
            overflow: hidden;
            z-index: 1;
        }
        #building-wrapper iframe {
            border: 0;
            width: 1400px;
            height: 620px;
            transform: scale(0.76142857);
            transform-origin: top left;
            overflow: hidden;
        }

        /* 캐릭터 배치용 공통 스타일 */
        .character-wrapper {
            position: absolute;
            width: 260px;
            height: 320px;
            bottom: 30px;
            z-index: 10;
            overflow: visible !important;
            transition: filter 0.4s ease, transform 0.4s ease, opacity 0.4s ease;
        }
        
        /* 활성화/비활성화 명암 처리 */
        .character-wrapper.inactive {
            filter: brightness(0.35) grayscale(0.2);
        }

        #char-minwoo {
            left: 60px;
        }
        #char-sangsang {
            right: 60px;
            transform: scaleX(-1); /* 서로 마주보도록 반전 */
        }
        #char-sangsang.inactive {
            transform: scaleX(-1);
            filter: brightness(0.35) grayscale(0.2);
        }

        /* 제갈량 홀로그램 그래픽 배치 스타일 */
        #char-jegal {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            bottom: 60px;
            width: 300px;
            height: 400px;
            z-index: 20;
            overflow: visible !important;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease, transform 1s ease;
        }
        #char-jegal.active {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* 제갈량 홀로그램 컴포넌트 자체 내부 스타일 */
        .jegal-hologram-container {
            position: relative;
            width: 100%;
            height: 100%;
            animation: float-spirit 4s ease-in-out infinite;
        }
        .glow-effect {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(255, 235, 59, 0.4))
                    drop-shadow(0 0 35px rgba(212, 175, 55, 0.6));
            animation: pulse-glow 3s infinite alternate;
        }
        .jegal-hologram-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        @keyframes float-spirit {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes pulse-glow {
            0% { opacity: 0.65; filter: drop-shadow(0 0 10px rgba(255, 235, 59, 0.3)) drop-shadow(0 0 20px rgba(212, 175, 55, 0.4)); }
            100% { opacity: 0.95; filter: drop-shadow(0 0 15px rgba(255, 235, 59, 0.6)) drop-shadow(0 0 35px rgba(212, 175, 55, 0.8)); }
        }

        /* 제갈량 지령 연출 레이어 (전체 화면 배경 빛무리가 은은한 노란빛으로 확장되도록 수정) */
        #hologram-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 235, 59, 0.15) 0%, rgba(140, 48, 48, 0.05) 50%, rgba(0,0,0,0) 80%);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        #hologram-overlay.active {
            opacity: 1;
            animation: holo-pulse 4s infinite alternate;
        }
        @keyframes holo-pulse {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        /* 대화창 UI (수정된 컴팩트 크기 유지) */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 135px;
            background-color: rgba(0, 0, 0, 0.82);
            border: 2px solid var(--antique-gold);
            border-radius: 6px;
            padding: 15px 25px;
            z-index: 150;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }
        
        /* 제갈량 모드 각성 연출 (은은한 황금빛 각성 반영) */
        #dialogue-box.jegal-mode {
            border-color: #fff3cc;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.4), inset 0 0 15px rgba(212, 175, 55, 0.2);
        }

        /* 화자 이름 표시 */
        #speaker-name {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 1.1rem;
            color: var(--antique-gold);
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        
        /* 상황 설명 및 대사 본문 */
        #dialogue-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1rem;
            color: var(--text-light);
            line-height: 1.5;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        #dialogue-text.system-direction {
            color: #b3c1d1;
            font-style: italic;
        }

        /* 중요 키워드 강조 */
        .highlight {
            color: #ffeb3b;
            font-weight: 700;
            text-shadow: 0 0 4px rgba(255, 235, 59, 0.5);
        }

        /* 클릭 유도 인디케이터 */
        .click-prompt {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            animation: blink 1.5s infinite;
            font-family: 'Noto Sans KR', sans-serif;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 네비게이션 버튼 */
        .btn-nav {
            position: absolute;
            bottom: 20px;
            background-color: var(--dark-red);
            color: white;
            border: 1px solid var(--antique-gold);
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: bold;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
            z-index: 180;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-nav:hover {
            background-color: var(--dark-red-hover);
        }
        #btn-prev {
            left: 20px;
        }
        #btn-next {
            right: 20px;
            display: none;
        }
        #btn-skip {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #cccccc;
            border: 1px solid #555555;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 180;
            font-family: 'Noto Sans KR', sans-serif;
        }
        #btn-skip:hover {
            background-color: var(--dark-red);
            color: white;
            border-color: var(--antique-gold);
        }

        /* 엔딩 오버레이 패널 */
        #ending-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }
        #ending-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        #ending-overlay h2 {
            font-family: 'Nanum Myeongjo', serif;
            color: var(--antique-gold);
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 4px;
            text-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        #ending-overlay p {
            font-family: 'Noto Sans KR', sans-serif;
            color: #d1d5db;
            font-size: 1.15rem;
            line-height: 1.8;
            text-align: center;
            margin-bottom: 40px;
            max-width: 600px;
            word-break: keep-all;
        }
        .btn-restart {
            background-color: var(--dark-red);
            color: white;
            border: 1px solid var(--antique-gold);
            padding: 12px 36px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-family: 'Noto Sans KR', sans-serif;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .btn-restart:hover {
            background-color: var(--dark-red-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 상단 스테이지 표시 바 -->
    <div id="stage-bar">
        <h1>[결말] 시대를 뛰어넘은 승상의 마지막 비책</h1>
    </div>

    <!-- 건너뛰기 버튼 -->
    <button id="btn-skip" onclick="skipDialogue()">건너뛰기</button>

    <!-- 제갈량의 지령 연출 레이어 -->
    <div id="hologram-overlay"></div>

    <!-- 삼국지 벽화거리 배경 -->
    <div id="building-wrapper">
        <iframe src="F_삼국지벽화거리.html" scrolling="no"></iframe>
    </div>

    <!-- 인물 그래픽 배치 영역 -->
    <div id="char-minwoo" class="character-wrapper"></div>
    
    <!-- 순수 HTML/CSS 제갈량 황금빛 홀로그램 그래픽 삽입 -->
    <div id="char-jegal">
        <div class="jegal-hologram-container">
            <svg class="glow-effect" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#fff8cc" stop-opacity="0.9" />
                        <stop offset="40%" stop-color="#ffeb3b" stop-opacity="0.75" />
                        <stop offset="100%" stop-color="#b7791f" stop-opacity="0.1" />
                    </linearGradient>
                    <linearGradient id="fanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                        <stop offset="100%" stop-color="#ffd700" stop-opacity="0.6" />
                    </linearGradient>
                </defs>
                <g fill="url(#goldGradient)">
                    <!-- 윤건 -->
                    <rect x="85" y="15" width="30" height="15" rx="2" />
                    <path d="M 75 30 L 125 30 L 130 65 L 70 65 Z" />
                    <path d="M 75 55 Q 60 80 65 110 Q 75 80 75 55 Z" opacity="0.6"/>
                    <path d="M 125 55 Q 140 80 135 110 Q 125 80 125 55 Z" opacity="0.6"/>
                    <!-- 얼굴과 수염 -->
                    <ellipse cx="100" cy="80" rx="22" ry="28" />
                    <path d="M 85 95 Q 100 160 115 95 Q 100 120 85 95 Z" opacity="0.8" />
                    <!-- 도포 -->
                    <path d="M 40 250 C 40 150, 70 120, 100 120 C 130 120, 160 150, 160 250 Z" />
                    <path d="M 70 140 C 30 160, 20 220, 30 250 L 70 250 Z" opacity="0.7"/>
                    <path d="M 130 140 C 170 160, 180 220, 170 250 L 130 250 Z" opacity="0.7"/>
                </g>
                <!-- 백우선 -->
                <g transform="translate(10, -10)">
                    <line x1="95" y1="180" x2="125" y2="135" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
                    <g fill="url(#fanGradient)">
                        <path d="M 120 145 Q 120 100 135 110 Q 130 130 120 145 Z" />
                        <path d="M 123 142 Q 145 95 155 105 Q 140 130 123 142 Z" />
                        <path d="M 126 142 Q 165 110 165 125 Q 145 140 126 142 Z" />
                        <path d="M 124 146 Q 165 140 155 155 Q 135 155 124 146 Z" />
                    </g>
                </g>
                <ellipse cx="100" cy="245" rx="80" ry="10" fill="#ffeb3b" opacity="0.3" filter="blur(5px)" />
            </svg>
        </div>
    </div>

    <div id="char-sangsang" class="character-wrapper"></div>

    <!-- 비주얼 노벨 대화 상자 -->
    <div id="dialogue-box" onclick="advanceDialogue()">
        <div id="speaker-name">시스템</div>
        <div id="dialogue-text" class="system-direction">로딩 중...</div>
        <div class="click-prompt">▼ 클릭하여 계속</div>
    </div>

    <!-- 좌하단 고정 이전 버튼 -->
    <button id="btn-prev" class="btn-nav" onclick="window.location.href='F04.html'">이전</button>
    
    <!-- 우하단 고정 최종 완료 엔드 버튼 -->
    <button id="btn-next" class="btn-nav" onclick="finishStage()">End</button>
</div>

<!-- 최종 체험학습 수료 오버레이 -->
<div id="ending-overlay">
    <h2>수고하셨습니다</h2>
    <p>
        인천 차이나타운 삼국지 벽화거리에서 모든 역사적 암호를 풀어내고,<br>
        제갈 승상이 시대를 건너 남겨둔 위대한 비책 <br>
        <span class="highlight">['초심', '인내', '용기']</span>를 획득하셨습니다!
    </p>
    <button class="btn-restart" onclick="window.location.href='index.html'">메인 화면으로 이동</button>
</div>

<script>
    const dialogues = [
        {
            speaker: "지시문",
            text: "(민우가 스마트폰에 마지막 정답을 입력하자, 화면에서 환한 금빛 빛줄기가 뿜어져 나온다.)",
            target: "all-inactive"
        },
        {
            speaker: "상상",
            text: "“삐빅- 정답입니다! 민우 학생, 축하합니다. 제갈 승상께서 차이나타운에 숨겨두신 비밀 데이터의 암호가 모두 해제되었습니다.”",
            target: "char-sangsang"
        },
        {
            speaker: "민우",
            text: "“하아, 드디어 다 풀었다! 상상아, 제갈량의 비책이 대체 뭐야? 엄청난 무기 도면이라도 되는 거야? 아니면 마법 같은 병법서?”",
            target: "char-minwoo"
        },
        {
            speaker: "지시문",
            text: "(상상이 빔프로젝터를 켜듯 허공에 홀로그램 화면을 띄운다. 그곳에서 은은한 노란빛 오라와 함께 제갈 승상의 형상이 떠오르며, 묵직하고 따뜻한 목소리가 흘러나온다.)",
            target: "hologram-start"
        },
        {
            speaker: "[제갈량의 음성]",
            text: "“이백 년의 시간을 넘어 나의 마지막 지령에 닿은 젊은이여, 고생 많았다. 위기를 극복할 단 하나의 마법 같은 비책을 기대하였는가? 안타깝게도 천하를 다스리는 데 있어 단번에 세상을 바꾸는 요행은 존재하지 않는다.”",
            target: "jegal-voice"
        },
        {
            speaker: "민우",
            text: "“어? 그럼 비책이라는 게 아예 없었던 거야?”",
            target: "char-minwoo"
        },
        {
            speaker: "상상",
            text: "“끝까지 들어보세요, 민우 학생.”",
            target: "char-sangsang"
        },
        {
            speaker: "[제갈량의 음성]",
            text: "“하지만 네가 오늘 이 거리를 걸으며 스스로 증명해 낸 것들이 바로 내가 남기고자 한 진짜 비책이다. 첫째, 도원결의의 벽화에서 배운 <span class='highlight'>'변치 않는 초심'</span>이다. 아무리 힘든 일이 있어도 처음 품었던 순수한 뜻을 잃지 말거라.”",
            target: "jegal-voice"
        },
        {
            speaker: "[제갈량의 음성]",
            text: "“둘째, 삼고초려의 벽화에서 배운 <span class='highlight'>'굽히지 않는 인내'</span>다. 진정으로 원하는 것을 얻기 위해서는 찬 바람을 세 번, 아니 백 번이라도 견뎌내는 끈기가 필요하다.”",
            target: "jegal-voice"
        },
        {
            speaker: "[제갈량의 음성]",
            text: "“마지막으로, 적벽의 불길 속에서 배운 <span class='highlight'>'두려움을 마주하는 용기'</span>다. 거대한 적 앞에서도 바람의 방향이 바뀔 때를 기다려 몸을 던지는 자만이 승리할 수 subcontinent.”",
            target: "jegal-voice"
        },
        {
            speaker: "지시문",
            text: "(민우는 홀로그램에서 빛나는 제갈 승상의 환영을 바라보며 말문이 막힌다. 그저 옛날이야기라고 생각했던 그림들이, 마치 지금의 자신을 향한 응원처럼 느껴진다.)",
            target: "hologram-mid"
        },
        {
            speaker: "[제갈량의 음성]",
            text: "“나 제갈량은 훗날 촉나라가 무너질 것을 알면서도, 나의 주군과 백성들을 위해 끝까지 포기하지 않고 출사표를 던졌다. 나의 비책을 이어받은 젊은이여. 너의 앞길에 놓인 수많은 시험과 막막한 미래 앞에서도 절대 도망치지 마라. <span class='highlight'>초심과 인내, 그리고 용기.</span> 이 세 가지만 가슴에 품는다면, 너는 너만의 역사에서 가장 위대한 영웅이 될 것이다.”",
            target: "jegal-voice"
        },
        {
            speaker: "지시문",
            text: "(음성이 끝나며 제갈량의 홀로그램이 수많은 황금빛 반딧불이가 되어 하늘로 흩어진다. 벽화거리에 따뜻한 가로등 불빛이 하나둘 켜진다.)",
            target: "hologram-end"
        },
        {
            speaker: "민우",
            text: "“...멋지네. 제갈량 할아버지, 생각보다 훨씬 대단한 걸 남겨두셨잖아.”",
            target: "char-minwoo"
        },
        {
            speaker: "상상",
            text: "“민우 학생의 생체 바이탈이 아주 안정적이고 긍정적으로 변화했습니다! 훌륭한 체험학습이 된 것 같네요. 이제 집으로 돌아갈 시간입니다.”",
            target: "char-sangsang"
        },
        {
            speaker: "민우",
            text: "“응. 내일 학교 가면, 왠지 수학 문제 하나쯤은 안 풀려도 끝까지 물고 늘어질 수 있을 것 같아. 삼고초려의 인내로 말이야. 가자, 상상아!”",
            target: "char-minwoo"
        },
        {
            speaker: "지시문",
            text: "(자신감 넘치는 발걸음으로 벽화거리를 걸어 나가는 민우의 뒷모습을 비추며, 체험학습 앱의 화면이 서서히 암전된다.)",
            target: "all-inactive"
        }
    ];

    let currentIndex = 0;

    function advanceDialogue() {
        if (currentIndex >= dialogues.length) {
            endDialogueFlow();
            return;
        }

        const currentData = dialogues[currentIndex];
        const speakerElem = document.getElementById("speaker-name");
        const textElem = document.getElementById("dialogue-text");
        const boxElem = document.getElementById("dialogue-box");
        const holoOverlay = document.getElementById("hologram-overlay");
        const jegalChar = document.getElementById("char-jegal");

        // 텍스트 내용 채워넣기
        speakerElem.textContent = currentData.speaker;
        textElem.innerHTML = currentData.text;

        if (currentData.speaker === "지시문") {
            textElem.classList.add("system-direction");
        } else {
            textElem.classList.remove("system-direction");
        }

        const wrapperMinwoo = document.getElementById("char-minwoo");
        const wrapperSangsang = document.getElementById("char-sangsang");

        // 초기화
        wrapperMinwoo.classList.remove("inactive");
        wrapperSangsang.classList.remove("inactive");
        boxElem.classList.remove("jegal-mode");

        // 대사 주체 연출 제어 로직
        if (currentData.target === "char-minwoo") {
            wrapperSangsang.classList.add("inactive");
        } else if (currentData.target === "char-sangsang") {
            wrapperMinwoo.classList.add("inactive");
        } else if (currentData.target === "all-inactive") {
            wrapperMinwoo.classList.add("inactive");
            wrapperSangsang.classList.add("inactive");
        } else if (currentData.target === "hologram-start") {
            wrapperMinwoo.classList.add("inactive");
            wrapperSangsang.classList.add("inactive");
            holoOverlay.classList.add("active");
            jegalChar.classList.add("active"); // 제갈량 등장
        } else if (currentData.target === "jegal-voice") {
            wrapperMinwoo.classList.add("inactive");
            wrapperSangsang.classList.add("inactive");
            boxElem.classList.add("jegal-mode");
            jegalChar.classList.add("active"); // 제갈량 유지
        } else if (currentData.target === "hologram-mid") {
            wrapperMinwoo.classList.add("inactive");
            wrapperSangsang.classList.add("inactive");
            jegalChar.classList.add("active");
        } else if (currentData.target === "hologram-end") {
            wrapperMinwoo.classList.add("inactive");
            wrapperSangsang.classList.add("inactive");
            holoOverlay.classList.remove("active");
            jegalChar.classList.remove("active"); // 제갈량 소멸
        }

        currentIndex++;
    }

    function skipDialogue() {
        currentIndex = dialogues.length;
        endDialogueFlow();
    }

    function endDialogueFlow() {
        document.getElementById("dialogue-box").style.display = "none";
        document.getElementById("btn-skip").style.display = "none";
        
        document.getElementById("char-minwoo").classList.remove("inactive");
        document.getElementById("char-sangsang").classList.remove("inactive");
        document.getElementById("hologram-overlay").classList.remove("active");
        document.getElementById("char-jegal").classList.remove("active");

        document.getElementById("btn-next").style.display = "block";
    }

    function finishStage() {
        document.getElementById("ending-overlay").classList.add("show");
    }

    async function fetchCharacterAsset(filename, containerId) {
        const container = document.getElementById(containerId);
        try {
            const response = await fetch(filename);
            if (response.ok) {
                container.innerHTML = await response.text();
            } else {
                throw new Error("Asset load error");
            }
        } catch (e) {
            console.warn(`${filename} 파일 로드 실패. iframe 백업 모드를 가동합니다.`);
            container.innerHTML = `<iframe src="${filename}" scrolling="no" style="border:0; width:100%; height:100%; overflow:hidden; background:transparent;"></iframe>`;
        }
    }

    window.onload = function() {
        fetchCharacterAsset("민우.html", "char-minwoo");
        fetchCharacterAsset("상상.html", "char-sangsang");
        advanceDialogue();
    };
</script>

</body>
</html>
