<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>울타리 암호</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
      /* ===== 이 퀴즈 전용 매핑 ===== */
      --line-color: var(--accent);  /* 지그재그 경로선 */
      --cell-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      box-sizing: border-box;
      gap: 20px;
      align-items: stretch;
    }

    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      width: 38vw;
      max-width: 440px;
      justify-content: center;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .control-group {
      background: var(--primary-soft);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .control-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .col-badge {
      background: var(--primary);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .live-decoded {
      background: var(--primary-dark);
      color: white;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 2px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .answer-group {
      padding-top: 16px;
      border-top: 2px dashed var(--border-color);
    }

    .answer-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-ctrl);
      outline: none;
      transition: border-color 0.2s;
      text-transform: uppercase;
      min-width: 0;
    }

    .input-row input:focus {
      border-color: var(--primary);
    }

    .btn-check {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-ctrl);
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .btn-check:hover { background: var(--primary-dark); }
    .btn-check:active { transform: translateY(1px); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
    }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--error); }

    /* 암호판(격자) 영역 - 중앙 정렬 */
    .wheel-side {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 10px;
    }

    .fence-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden; 
    }

    /* 비율을 유지하는 실제 그리기 영역 */
    .fence-inner {
      position: relative;
    }

    .fence-grid {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
    }

    .fence-cell {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--text-main);
      background: var(--cell-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .fence-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .fence-polyline {
      fill: none;
      stroke: var(--line-color);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding-top: 2vh; }
      .panel-side { width: 96vw; height: auto; max-width: none; padding: 16px; margin: 0 auto; }
      .wheel-side { width: 96vw; flex: 1; margin: 0 auto; padding: 0 0 2vh 0; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.2rem; margin-bottom: 4px; }
      .header-block p { display: none; }
      .control-group { padding: 8px 12px; margin-bottom: 10px; }
      .live-decoded { min-height: 36px; font-size: 1rem; margin-bottom: 10px; padding: 8px; }
      .answer-group { padding-top: 10px; }
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }


    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>울타리 암호</h2>
        <p>줄의 개수를 조절하면 문자가 지그재그로 재배열됩니다.<br>선을 따라 차례대로 읽어 단어를 완성하세요!</p>
      </div>

      <div class="control-group">
        <div class="control-header">
          <label>울타리 줄 개수</label>
          <!-- 초기값을 1줄로 수정 -->
          <span class="col-badge" id="railBadge">1 줄</span>
        </div>
        <!-- min=1, value=1 로 변경하여 1줄부터 시작할 수 있게 함 -->
        <input type="range" id="railSlider" min="1" max="6" value="1" step="1">
      </div>

      <div class="live-decoded" id="liveDecoded">
        ...
      </div>

      <div class="answer-group">
        <label>💡 해독한 정답을 입력하세요</label>
        <div class="input-row">
          <input type="text" id="answerInput" placeholder="정답 입력" autocomplete="off">
          <button class="btn-check" id="checkBtn">확인</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>

    <div class="wheel-side">
      <div class="fence-wrapper" id="fenceWrapper">
        <div class="fence-inner" id="fenceInner">
          <svg id="fenceSvg" class="fence-svg">
            <polyline id="fencePolyline" class="fence-polyline" />
          </svg>
          <div id="fenceGrid" class="fence-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ⚙️ 선생님 설정 영역
    // =========================================================================
    
    const CIPHER_TEXT = "DININ RWNADANIG AGPT"; 
    const CORRECT_ANSWER = "DRAWINGANDPAINTING";
    
    // =========================================================================

    const cleanText = CIPHER_TEXT.replace(/\s/g, '').toUpperCase();
    const len = cleanText.length;

    const fenceWrapper = document.getElementById('fenceWrapper');
    const fenceInner = document.getElementById('fenceInner');
    const fenceGrid = document.getElementById('fenceGrid');
    const fenceSvg = document.getElementById('fenceSvg');
    const fencePolyline = document.getElementById('fencePolyline');
    
    const railSlider = document.getElementById('railSlider');
    const railBadge = document.getElementById('railBadge');
    const liveDecoded = document.getElementById('liveDecoded');
    
    const answerInput = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    const feedback = document.getElementById('feedback');

    function buildRailFence(ciphertext, numRails) {
      // 1줄일 때는 일직선으로 반환
      if (numRails === 1) return ciphertext.split('').map((c, i) => ({ col: i, rail: 0, char: c }));
      
      const railForCol = [];
      let r = 0;
      let dir = 1;
      
      for (let i = 0; i < len; i++) {
        railForCol.push(r);
        r += dir;
        if (r === numRails - 1 || r === 0) dir *= -1;
      }

      const counts = new Array(numRails).fill(0);
      for (let i = 0; i < len; i++) counts[railForCol[i]]++;

      const railStrings = [];
      let idx = 0;
      for (let i = 0; i < numRails; i++) {
        railStrings.push(ciphertext.substring(idx, idx + counts[i]));
        idx += counts[i];
      }

      const result = [];
      const railPointers = new Array(numRails).fill(0);
      for (let i = 0; i < len; i++) {
        const rail = railForCol[i];
        const char = railStrings[rail][railPointers[rail]];
        railPointers[rail]++;
        result.push({ col: i, rail: rail, char: char });
      }

      return result; 
    }

    function renderFence(rails, animate = true) {
      railBadge.textContent = rails + " 줄";
      
      const w = fenceWrapper.clientWidth - 40; 
      const h = fenceWrapper.clientHeight - 40;
      
      if (w <= 0 || h <= 0) return;

      const decodedData = buildRailFence(cleanText, rails);
      
      let cellSize = Math.min(w / len, h / rails);
      
      if (cellSize > 60) cellSize = 60;

      const gridW = cellSize * len;
      const gridH = cellSize * rails;

      fenceInner.style.width = `${gridW}px`;
      fenceInner.style.height = `${gridH}px`;

      fenceGrid.innerHTML = '';
      let polylinePoints = [];

      const fontSize = Math.max(12, cellSize * 0.55);

      decodedData.forEach((item) => {
        const cell = document.createElement('div');
        cell.className = 'fence-cell';
        cell.textContent = item.char;
        
        const padding = Math.min(6, cellSize * 0.1);
        const cw = cellSize - padding * 2;
        const ch = cellSize - padding * 2;
        const cx = item.col * cellSize + padding;
        const cy = item.rail * cellSize + padding;

        cell.style.width = `${cw}px`;
        cell.style.height = `${ch}px`;
        cell.style.left = `${cx}px`;
        cell.style.top = `${cy}px`;
        cell.style.fontSize = `${fontSize}px`;
        
        if (animate) {
          cell.style.animationDelay = `${item.col * 0.04}s`;
        } else {
          cell.style.animation = 'none';
          cell.style.opacity = 1;
          cell.style.transform = 'scale(1)';
        }
        
        fenceGrid.appendChild(cell);

        const px = item.col * cellSize + (cellSize / 2);
        const py = item.rail * cellSize + (cellSize / 2);
        polylinePoints.push(`${px},${py}`);
      });

      fenceSvg.setAttribute('viewBox', `0 0 ${gridW} ${gridH}`);
      fencePolyline.setAttribute('points', polylinePoints.join(' '));

      if (animate) {
        fencePolyline.style.transition = 'none';
        fencePolyline.style.strokeDasharray = 'none';
        
        setTimeout(() => {
          const length = fencePolyline.getTotalLength();
          fencePolyline.style.strokeDasharray = length;
          fencePolyline.style.strokeDashoffset = length;
          
          fencePolyline.getBoundingClientRect(); 
          
          fencePolyline.style.transition = `stroke-dashoffset ${len * 0.04 + 0.5}s ease-in-out`;
          fencePolyline.style.strokeDashoffset = '0';
        }, 50);
      } else {
        fencePolyline.style.transition = 'none';
        fencePolyline.style.strokeDashoffset = '0';
        fencePolyline.style.strokeDasharray = 'none';
      }

      const decodedText = decodedData.map(d => d.char).join('');
      liveDecoded.textContent = decodedText;
    }

    railSlider.addEventListener('input', (e) => {
      renderFence(parseInt(e.target.value), true);
    });

    let resizeTimer;
    const observer = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderFence(parseInt(railSlider.value), false); 
      }, 50);
    });
    observer.observe(fenceWrapper);

    function checkAnswer() {
      const userAnswer = answerInput.value.replace(/\s/g, '').toLowerCase();
      const targetAnswer = CORRECT_ANSWER.replace(/\s/g, '').toLowerCase();

      if (userAnswer === "") return;

      if (userAnswer === targetAnswer) {
        feedback.textContent = "✅ 정답입니다! 미술실 탈출 성공!";
        feedback.className = "feedback success";
      } else {
        feedback.textContent = "❌ 틀렸습니다. 지그재그 선을 따라 순서대로 읽어보세요.";
        feedback.className = "feedback error";
        
        setTimeout(() => {
          if (feedback.classList.contains('error')) {
            feedback.textContent = "";
            feedback.className = "feedback";
          }
        }, 1500);
      }
    }

    checkBtn.addEventListener('click', checkAnswer);
    answerInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

  </script>
</body>
</html>
