<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 개념 어드벤처 - 일차부등식</title>
    <style>
        /* 기본 리셋 및 핵심 레이아웃 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 16:9 비율 유지를 위한 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 1024px;
            height: 576px;
            background: #1a1a1a;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            border: 4px solid #d4af37;
            border-radius: 12px;
        }

        /* 배경 레이어 */
        #background-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* CSS 대체 배경 (황금들판) */
        .fallback-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #72a0c1 0%, #f4e8c1 40%, #e6b800 80%, #996600 100%);
            overflow: hidden;
        }
        
        .fallback-bg::before {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: repeating-linear-gradient(
                45deg,
                #e6b800,
                #e6b800 20px,
                #cc9900 20px,
                #cc9900 40px
            );
            opacity: 0.85;
        }

        /* 캐릭터 레이어 */
        #character-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 120px 150px 120px;
        }

        .character-wrapper {
            width: 260px;
            height: 320px;
            position: relative;
            transition: filter .25s ease, opacity .25s ease, transform .25s ease;
            transform-origin: bottom center;
        }

        /* 캐릭터 대화 강조 규칙 */
        .active-speaker {
            filter: brightness(1.12) saturate(1.08);
            opacity: 1;
            transform: scale(1.04);
        }

        .inactive-speaker {
            filter: brightness(0.48) saturate(0.7);
            opacity: 0.72;
        }

        /* 설명 숨김 요소 */
        .character-wrapper p,
        .character-wrapper small,
        .character-wrapper figcaption,
        .character-wrapper .caption,
        .character-wrapper .description,
        .character-wrapper .hint,
        .character-wrapper .label {
            display: none !important;
        }

        /* 대체용 미려한 캐릭터 플레이스홀더 */
        .char-placeholder {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px dashed rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .char-placeholder .avatar-icon {
            font-size: 72px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .char-placeholder .name-tag {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid #d4af37;
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        /* 상단 HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 24px;
            border-radius: 12px;
            border: 2px solid #d4af37;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .hud-title {
            color: #ffd700;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .hud-progress {
            color: #ffffff;
            font-size: 1rem;
        }

        /* 중앙 콘텐츠 영역 (겹침 방지 구조) */
        #content-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            pointer-events: none;
        }

        /* 퀴즈 카드 인터페이스 */
        .quiz-card {
            background: rgba(20, 24, 35, 0.96);
            border: 3px solid #d4af37;
            border-radius: 16px;
            width: 720px;
            max-height: 300px;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            pointer-events: auto;
            display: none; /* 대화 상태에선 감춤 */
            flex-direction: column;
            z-index: 10;
        }

        .quiz-question {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 16px;
            color: #ffffff;
            border-bottom: 2px dashed rgba(212, 175, 55, 0.3);
            padding-bottom: 12px;
        }

        .choices-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice-btn {
            background: #2a2e3d;
            border: 2px solid #484f66;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            min-height: 52px;
            line-height: 1.4;
            white-space: normal;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .choice-btn:hover {
            background: #3e455c;
            border-color: #ffd700;
            transform: translateY(-2px);
        }

        .choice-num {
            background: #ffd700;
            color: #111111;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .choice-text {
            display: inline-flex;
            align-items: center;
            width: 100%;
        }

        /* 하단 대화창 */
        #dialogue-box {
            background: rgba(26, 18, 10, 0.95);
            border: 3px solid #8c6a3c;
            border-radius: 14px;
            padding: 16px 28px;
            height: 125px;
            position: relative;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            z-index: 5;
            transition: all 0.3s ease;
        }

        #dialogue-box.compact {
            height: 80px;
            padding: 10px 24px;
        }

        .dialogue-speaker {
            font-weight: bold;
            color: #ffd700;
            font-size: 1.15rem;
            margin-bottom: 6px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .dialogue-text {
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.5;
            overflow-y: auto;
        }

        .dialogue-arrow {
            position: absolute;
            bottom: 12px;
            right: 24px;
            font-size: 0.85rem;
            color: #ffd700;
            animation: bounce 0.8s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        /* 수식 스타일 가이드라인 완벽 이행 */
        .math {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 4px;
            vertical-align: middle;
        }

        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.85em;
            padding: 0 4px;
            line-height: 1.1;
        }

        .frac > span:first-child {
            border-bottom: 1.5px solid #ffffff;
            padding-bottom: 2px;
        }

        .frac > span:last-child {
            padding-top: 2px;
        }

        .repeat {
            position: relative;
            border-top: 2px solid #ff4d4d;
            padding-top: 1px;
            display: inline-block;
        }

        /* 수직선 시각화 전용 컴포넌트 */
        .number-line-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .line-axis {
            position: relative;
            width: 80%;
            height: 4px;
            background: #ffffff;
            margin: 25px 0 15px 0;
        }

        .line-arrow-left {
            position: absolute;
            left: -8px;
            top: -6px;
            color: #ffffff;
            font-size: 10px;
        }

        .line-arrow-right {
            position: absolute;
            right: -8px;
            top: -6px;
            color: #ffffff;
            font-size: 10px;
        }

        .line-point {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #ff4d4d;
            top: -5px;
            transform: translateX(-50%);
        }

        .line-point.filled {
            background: #ff4d4d;
        }

        .line-point.empty {
            background: #2a2e3d;
        }

        .line-ray {
            position: absolute;
            height: 4px;
            background: #ff4d4d;
            top: 0;
        }

        .line-label {
            position: absolute;
            top: 15px;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: #ffd700;
            font-weight: bold;
        }

        /* 피드백 모달 시스템 */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            padding: 24px;
        }

        .modal-content {
            background: #251c14;
            border: 4px solid #d4af37;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 12px 36px rgba(0,0,0,0.8);
            animation: scaleIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .modal-content.unlocked { cursor: pointer; background: linear-gradient(145deg, #2d2117, #20160f); }
        .success-stage { display: flex; align-items: center; justify-content: center; gap: 14px; }
        .answer-seal { flex: 0 0 auto; width: 62px; height: 62px; display: grid; place-items: center; border: 4px double #d94b42; color: #ef5d53; border-radius: 10px; font-family: serif; font-size: 1.25rem; font-weight: 900; transform: rotate(-7deg); animation: sealStamp .42s cubic-bezier(.2,.9,.25,1.35); }
        .unlock-copy { text-align: left; line-height: 1.5; }
        .unlock-title { display: block; color: #f2cf68; font-size: 1.12rem; margin-bottom: 5px; }
        .unlock-hint { display: block; margin-top: 6px; color: #dbcda9; font-size: .82rem; }
        @keyframes sealStamp { from { opacity: 0; transform: scale(2.1) rotate(-14deg); } to { opacity: 1; transform: scale(1) rotate(-7deg); } }
        @media (prefers-reduced-motion: reduce) { .answer-seal { animation: none; } }

        @keyframes scaleIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1.8rem;
            color: #ffd700;
            margin-bottom: 16px;
            font-weight: bold;
        }

        .modal-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .modal-btn {
            background: #d4af37;
            border: none;
            color: #1a120b;
            padding: 12px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn:hover {
            background: #ffe066;
            transform: translateY(-2px);
        }

        /* 정리 체크리스트 */
        .checklist-wrapper {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #8c6a3c;
            border-radius: 10px;
            padding: 18px;
            text-align: left;
            margin-bottom: 20px;
        }

        .checklist-item {
            margin: 12px 0;
            display: flex;
            align-items: center;
            font-size: 1rem;
        }

        .checklist-item::before {
            content: "✓";
            color: #00ff66;
            font-weight: bold;
            font-size: 1.3rem;
            margin-right: 12px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="background-layer">
            <div class="fallback-bg"></div>
        </div>

        <div id="character-layer">
            <div id="char-dolsoe" class="character-wrapper inactive-speaker">
                <div class="char-placeholder">
                    <div class="avatar-icon">👨‍🌾</div>
                    <div class="name-tag">돌쇠</div>
                </div>
            </div>
            <div id="char-manim" class="character-wrapper inactive-speaker">
                <div class="char-placeholder">
                    <div class="avatar-icon">👩</div>
                    <div class="name-tag">마님</div>
                </div>
            </div>
        </div>

        <div id="ui-layer">
            <div class="hud">
                <span class="hud-title">🌾 수학 개념 어드벤처 - 제4장: 일차부등식</span>
                <span id="hud-progress" class="hud-progress">진행도: 0%</span>
            </div>

            <div id="content-area">
                <div id="quiz-card" class="quiz-card">
                    <div id="quiz-question" class="quiz-question"></div>
                    <div id="choices-container" class="choices-container"></div>
                </div>
            </div>

            <div id="dialogue-box">
                <div>
                    <div id="dialogue-speaker" class="dialogue-speaker"></div>
                    <div id="dialogue-text" class="dialogue-text"></div>
                </div>
                <div id="dialogue-arrow" class="dialogue-arrow">▼ 클릭 또는 Enter</div>
            </div>
        </div>

        <div id="feedback-modal" class="modal">
            <div class="modal-content">
                <div id="modal-title" class="modal-title"></div>
                <div id="modal-text" class="modal-text"></div>
                <button id="modal-btn" class="modal-btn">계속하기</button>
            </div>
        </div>
    </div>

    <script>
        // 에셋 비동기 로드 함수
        function fetchAsset(wrapperId, fileName, fallbackHtml) {
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper) return;

            fetch(fileName)
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.text();
                })
                .then(html => {
                    wrapper.innerHTML = html;
                    const selectors = ["p", "small", "figcaption", ".caption", ".description", ".hint", ".label"];
                    selectors.forEach(sel => {
                        wrapper.querySelectorAll(sel).forEach(el => el.style.display = 'none');
                    });
                })
                .catch(() => {
                    const iframe = document.createElement("iframe");
                    iframe.src = fileName;
                    iframe.setAttribute("scrolling", "no");
                    iframe.style.width = "100%";
                    iframe.style.height = "100%";
                    iframe.style.border = "0";
                    iframe.style.overflow = "hidden";
                    
                    wrapper.innerHTML = "";
                    wrapper.appendChild(iframe);

                    let isLoaded = false;
                    iframe.onload = () => { isLoaded = true; };
                    setTimeout(() => {
                        if (!isLoaded) {
                            wrapper.innerHTML = fallbackHtml;
                        }
                    }, 1000);
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchAsset("background-layer", "assets/황금들판.html", `<div class="fallback-bg"></div>`);
            fetchAsset("char-dolsoe", "assets/돌쇠.html", `
                <div class="char-placeholder">
                    <div class="avatar-icon">👨‍🌾</div>
                    <div class="name-tag">돌쇠</div>
                </div>
            `);
            fetchAsset("char-manim", "assets/마님.html", `
                <div class="char-placeholder">
                    <div class="avatar-icon">👩</div>
                    <div class="name-tag">마님</div>
                </div>
            `);
            updateDialogue();
        });

        // --- 시나리오 진행 데이터 ---
        const scenario = [
            {
                speaker: "해설자",
                text: "지난 시간, 돌쇠는 장터에서 <b>지수법칙</b>을 이용해 씨앗의 수를 계산하고 필요한 벼 씨앗을 구해 왔습니다."
            },
            {
                speaker: "돌쇠",
                text: "지수법칙으로 씨앗의 수를 계산해 왔어유! 이제 정해진 예산 안에서 씨앗을 얼마나 살 수 있는지 계획해 보겠어유."
            },
            {
                speaker: "마님",
                text: "돌쇠야! 씨앗을 너무 다닥다닥 심으면 양분이 모자라 다 썩어버리고, 너무 띄엄띄엄 심으면 우리 소중한 황금들판이 낭비되고 마느니라."
            },
            {
                speaker: "마님",
                text: "올해는 우리가 확보해야 할 '최소 수확량'을 넘기면서도, 가문의 '제한된 예산' 범위를 절대로 초과해선 안 된다! 경계를 정확히 지켜야 하느니라."
            },
            {
                speaker: "돌쇠",
                text: "아하! 딱 떨어지는 값이 아니라, 특정 범위의 크고 작음을 따지는 것이군유! 학교에서 배운 크기 비교의 식, <b>부등식</b>이 필요하겠어유!"
            },
            {
                speaker: "해설자",
                text: "그렇습니다. 등호(<span class='math'>=</span>) 대신 부등호(<span class='math'>&lt;, &gt;, &le;, &ge;</span>)를 사용하여 수 또는 식의 대소 관계를 나타낸 식을 <b>부등식</b>이라고 합니다."
            },
            {
                speaker: "마님",
                text: "그럼 먼저, 부등식의 참과 거짓을 구별하는 기본 문제부터 간단히 확인해 볼 터이니 대답해 보아라!"
            },
            {
                // 퀴즈 1 (개념/뜻)
                quiz: {
                    question: "<b>[1번 퀴즈: 부등식의 해 구하기]</b> 일차부등식 <span class='math'>2x - 3 &le; 5</span> 가 있습니다. 이 부등식이 참이 되게 하는 <span class='math'>x</span>의 값(부등식의 해)이 <u>아닌</u> 것은 무엇인가요?",
                    choices: [
                        { text: "<span class='math'>x = 2</span>", isCorrect: false },
                        { text: "<span class='math'>x = 3</span>", isCorrect: false },
                        { text: "<span class='math'>x = 4</span>", isCorrect: false },
                        { text: "<span class='math'>x = 5</span>", isCorrect: true }
                    ],
                    solution: "풀이: 양변에 <span class='math'>3</span>을 더하면 <span class='math'>2x &le; 8</span>이 되고, 양변을 <span class='math'>2</span>로 나누면 <span class='math'>x &le; 4</span>가 됩니다. 따라서 <span class='math'>x = 5</span>는 범위를 만족하지 않습니다."
                }
            },
            {
                speaker: "돌쇠",
                text: "식을 천천히 살펴보니 알맞은 경계를 찾을 수 있었어유!"
            },
            {
                speaker: "마님",
                text: "오호, 제법이구나. 부등식에서 가장 조심해야 할 절대 규칙인 <b>'성질'</b>도 기억하고 있느냐?"
            },
            {
                speaker: "돌쇠",
                text: "그럼유! 양변에 같은 수를 더하거나 빼도, 혹은 양수를 곱하거나 나누어도 부등호의 방향은 변하지 않지만... <b>음수를 곱하거나 나눌 때는 부등호 방향이 반대로 휙 바뀐다</b>는 놀라운 사실을 기억하고 있어유!"
            },
            {
                // 퀴즈 2 (부등식 성질)
                quiz: {
                    question: "<b>[2번 퀴즈: 부등호의 성질 적용]</b> <span class='math'>a &lt; b</span> 일 때, 다음 중 부등호의 방향이 처음과 <u>반대로 바뀌는</u> 식은 무엇일까요?",
                    choices: [
                        { text: "<span class='math'>a - 4 &lt; b - 4</span>", isCorrect: false },
                        { text: "<span class='math'><span class='frac'><span>a</span><span>3</span></span> &lt; <span class='frac'><span>b</span><span>3</span></span></span>", isCorrect: false },
                        { text: "<span class='math'>-5a &gt; -5b</span>", isCorrect: true },
                        { text: "<span class='math'>-a + 2 &lt; -b + 2</span>", isCorrect: false }
                    ],
                    solution: "풀이: 부등식의 양변에 <b>음수</b>인 <span class='math'>-5</span>를 곱할 때 부등호의 방향이 반대로 뒤집히게 됩니다. 다른 사칙연산의 경우는 방향이 유지됩니다."
                }
            },
            {
                speaker: "마님",
                text: "잘했구나, 돌쇠야! 이제 일차부등식을 이용해 씨앗 심기 계획을 직접 세워 보아라."
            },
            {
                speaker: "돌쇠",
                text: "예산 계획을 한 번 확인해 볼까유? 씨앗 한 되에 <span class='math'>500</span>냥이고, 논을 일구는 기본 관리비가 <span class='math'>3000</span>냥이 드네유. 총예산 <span class='math'>20000</span>냥 이하로 사야 합니다!"
            },
            {
                // 퀴즈 3 (문제 상황 응용 및 수직선)
                quiz: {
                    question: "<b>[3번 퀴즈: 실전 예산 계산]</b> 살 수 있는 씨앗의 양을 <span class='math'>x</span>되라고 할 때, 총 비용 식은 <span class='math'>500x + 3000 &le; 20000</span> 입니다. 이 부등식의 올바른 해의 범위는 무엇일까요?",
                    choices: [
                        { text: "<span class='math'>x &le; 34</span>", isCorrect: true },
                        { text: "<span class='math'>x &lt; 34</span>", isCorrect: false },
                        { text: "<span class='math'>x &le; 46</span>", isCorrect: false },
                        { text: "<span class='math'>x &ge; 34</span>", isCorrect: false }
                    ],
                    solution: "풀이: <span class='math'>500x &le; 17000</span> 에서 양변을 양수 <span class='math'>500</span>으로 나누면 부등호 방향 변화 없이 <span class='math'>x &le; 34</span>가 됩니다."
                }
            },
            {
                speaker: "해설자",
                text: "좋습니다! 구한 해를 수직선 위에 시각적으로 그려내는 법도 마무리지어 볼까요?"
            },
            {
                // 최종 미션 (종합)
                quiz: {
                    isFinal: true,
                    question: "<b>[최종 미션: 수직선 해 표현]</b> 돌쇠가 구한 범위인 <span class='math'>x &le; 34</span>를 수직선에 올바르게 나타낸 형태는 어느 것일까요?",
                    choices: [
                        { text: "34를 포함하고(검은 동그라미) 왼쪽으로 뻗어 나가는 선", isCorrect: true },
                        { text: "34를 포함하지 않고(흰 동그라미) 왼쪽으로 뻗어 나가는 선", isCorrect: false },
                        { text: "34를 포함하고(검은 동그라미) 오른쪽으로 뻗어 나가는 선", isCorrect: false },
                        { text: "34를 포함하지 않고(흰 동그라미) 오른쪽으로 뻗어 나가는 선", isCorrect: false }
                    ],
                    solution: "풀이: 이하(<span class='math'>&le;</span>) 기호는 경계값을 포함하므로 검은 동그라미로 칠해주고, 작거나 같은 범위이므로 수직선의 왼쪽 방향으로 화살표를 그려야 합니다."
                }
            },
            {
                speaker: "마님",
                text: "아주 대견하구나 돌쇠야! <span class='math'>x &le; 34</span>되 이하로 씨앗을 계획하면 가문의 황금들판 예산을 철저하게 사수하면서 최대 효율을 뽑아낼 수 있겠구나!"
            },
            {
                speaker: "돌쇠",
                text: "마님! 그런데 만약 보리와 쌀 두 종류를 섞어서 심어야 하고, 각각의 조건이 두 가지 이상 얽혀버리면 어떻게 계산해야 하나유?"
            },
            {
                speaker: "마님",
                text: "오, 그것은 조건들이 동시에 맞물려 들어가는 다음 단계, <b>연립일차방정식</b>의 지혜가 필요하느니라. 준비를 마친 뒤 다음 방으로 향하거라!"
            },
            {
                summary: true
            }
        ];

        let currentIndex = 0;
        let currentModalCallback = null; // 모달 확인 버튼을 누를 때 호출할 전역 콜백 등록 변수

        const dialogueBox = document.getElementById("dialogue-box");
        const dialogueSpeaker = document.getElementById("dialogue-speaker");
        const dialogueText = document.getElementById("dialogue-text");
        const quizCard = document.getElementById("quiz-card");
        const quizQuestion = document.getElementById("quiz-question");
        const choicesContainer = document.getElementById("choices-container");
        const hudProgress = document.getElementById("hud-progress");

        const charDolsoe = document.getElementById("char-dolsoe");
        const charManim = document.getElementById("char-manim");

        const feedbackModal = document.getElementById("feedback-modal");
        const modalTitle = document.getElementById("modal-title");
        const modalText = document.getElementById("modal-text");
        const modalBtn = document.getElementById("modal-btn");

        // 말하는 주체 강조 처리 함수
        function updateSpeakers(speaker) {
            charDolsoe.classList.remove("active-speaker", "inactive-speaker");
            charManim.classList.remove("active-speaker", "inactive-speaker");

            if (speaker === "돌쇠") {
                charDolsoe.classList.add("active-speaker");
                charManim.classList.add("inactive-speaker");
            } else if (speaker === "마님") {
                charManim.classList.add("active-speaker");
                charDolsoe.classList.add("inactive-speaker");
            } else {
                charDolsoe.classList.add("active-speaker");
                charManim.classList.add("active-speaker");
            }
        }

        // 전체 진행 대화창 업데이트
        function updateDialogue() {
            if (currentIndex >= scenario.length) return;

            const step = scenario[currentIndex];
            const progressPercent = Math.round((currentIndex / (scenario.length - 1)) * 100);
            hudProgress.innerText = `진행도: ${progressPercent}%`;

            if (step.summary) {
                showSummaryScreen();
                return;
            }

            if (step.quiz) {
                dialogueBox.classList.add("compact");
                dialogueSpeaker.innerText = "수학 챌린지 퀴즈";
                dialogueText.innerText = "문제를 읽고 올바른 보기를 직접 클릭하여 완수해 보세요.";
                
                quizQuestion.innerHTML = step.quiz.question;
                choicesContainer.innerHTML = "";
                
                if (step.quiz.isFinal) {
                    // 이전 렌더링된 수직선이 남아있을 수 있으므로 기존 수직선 요소 제거 후 재삽입
                    const existingVis = quizQuestion.querySelector(".number-line-box");
                    if (existingVis) existingVis.remove();

                    const lineVis = document.createElement("div");
                    lineVis.className = "number-line-box";
                    lineVis.innerHTML = `
                        <div class="line-axis">
                            <span class="line-arrow-left">◀</span>
                            <div class="line-point filled" style="left: 60%;"></div>
                            <div class="line-ray" style="left: 0%; width: 60%;"></div>
                            <span class="line-label" style="left: 60%;">34</span>
                            <span class="line-arrow-right">▶</span>
                        </div>
                    `;
                    quizQuestion.appendChild(lineVis);
                }

                step.quiz.choices.forEach((choice, index) => {
                    const btn = document.createElement("button");
                    btn.className = "choice-btn";
                    btn.innerHTML = `<span class="choice-num">${index + 1}</span><span class="choice-text">${choice.text}</span>`;
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        checkAnswer(choice.isCorrect, step.quiz.solution, step.quiz.isFinal);
                    });
                    choicesContainer.appendChild(btn);
                });

                quizCard.style.display = "flex";
                updateSpeakers("시스템");
            } else {
                dialogueBox.classList.remove("compact");
                quizCard.style.display = "none";
                dialogueSpeaker.innerText = step.speaker;
                dialogueText.innerHTML = step.text;
                updateSpeakers(step.speaker);
            }
        }

        // 퀴즈 정답 검증 처리
        function checkAnswer(isCorrect, solutionText, isFinal) {
            if (isCorrect) {
                const okMsg = isFinal ? "미션 완료! 단원 클리어! 훌륭해요!" : "멋진 추론이에요! 해결 완료!";
                const unlockedText = `<div class="success-stage"><span class="answer-seal">정답</span><span class="unlock-copy"><strong class="unlock-title">🔓 다음 관문 잠금 해제</strong>${solutionText}<small class="unlock-hint">이 상자를 클릭해 계속하기</small></span></div>`;
                showModal(okMsg, unlockedText, () => {
                    hideModal();
                    currentIndex++;
                    updateDialogue();
                }, true);
            } else {
                showModal("오류 발생!", `아쉽습니다.<br>다시 한번 생각해보세요.`, () => {
                    hideModal();
                });
            }
        }

        // 모달 표시 함수 (클론 노드를 사용하지 않고 콜백 레퍼런스 교체)
        function showModal(title, text, callback, isUnlocked = false) {
            modalTitle.innerHTML = title;
            modalText.innerHTML = text;
            currentModalCallback = callback; // 콜백 함수 동적 지정
            feedbackModal.querySelector(".modal-content").classList.toggle("unlocked", isUnlocked);
            feedbackModal.style.display = "flex";
        }

        function hideModal() {
            feedbackModal.style.display = "none";
            currentModalCallback = null;
        }

        // 전역 모달 버튼 단일 이벤트 리스너 등록
        modalBtn.addEventListener("click", () => {
            if (typeof currentModalCallback === "function") {
                currentModalCallback();
            }
        });
        feedbackModal.querySelector(".modal-content").addEventListener("click", (event) => {
            if (event.target === modalBtn) return;
            if (feedbackModal.querySelector(".modal-content").classList.contains("unlocked") &&
                typeof currentModalCallback === "function") {
                currentModalCallback();
            }
        });

        // 마지막 화면 요약정리 및 다음 단원 매끄러운 유도
        function showSummaryScreen() {
            dialogueBox.style.display = "none";
            quizCard.style.display = "none";

            const contentArea = document.getElementById("content-area");
            contentArea.innerHTML = "";
            contentArea.style.pointerEvents = "auto";

            const summaryCard = document.createElement("div");
            summaryCard.className = "quiz-card";
            summaryCard.style.display = "flex";
            summaryCard.style.width = "750px";
            summaryCard.style.maxHeight = "400px";

            summaryCard.innerHTML = `
                <div class="quiz-question" style="text-align: center; color: #ffd700; font-size: 1.3rem; font-weight: bold;">
                    🌾 일차부등식 학습 체크리스트
                </div>
                <div class="checklist-wrapper">
                    <div class="checklist-item">부등호(<span class="math">&lt;, &gt;, &le;, &ge;</span>)를 사용한 부등식의 기초 성질 이해 완료</div>
                    <div class="checklist-item">음수를 양변에 곱하거나 나눌 때 부등호 방향이 바뀐다는 핵심 규칙 습득 완료</div>
                    <div class="checklist-item">복잡한 일차부등식의 식 세우기(<span class="math">500x + 3000 &le; 20000</span>) 완수</div>
                    <div class="checklist-item">수직선 위에 부등식의 영역을 명확히 시각화하여 표현하기 성공</div>
                </div>
                <button id="next-chapter-btn" class="modal-btn" style="background: #27ae60; color: white;">
                    다음 단원(연립일차방정식)으로 이동하기
                </button>
            `;

            contentArea.appendChild(summaryCard);

            document.getElementById("next-chapter-btn").addEventListener("click", () => {
                window.location.href = "A04.html";
            });

            updateSpeakers("전체");
        }

        // 전체 영역 클릭 & Enter 진행 연동
        function handleDialogueNext() {
            if (scenario[currentIndex] && (scenario[currentIndex].quiz || scenario[currentIndex].summary)) {
                return;
            }
            currentIndex++;
            if (currentIndex < scenario.length) {
                updateDialogue();
            }
        }

        dialogueBox.addEventListener("click", (e) => {
            e.stopPropagation();
            handleDialogueNext();
        });

        document.getElementById("game-container").addEventListener("click", () => {
            handleDialogueNext();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                if (feedbackModal.style.display === "flex") {
                    modalBtn.click(); // 모달이 떠 있을 때는 모달 버튼 동작 연동
                } else {
                    handleDialogueNext();
                }
            }
        });
    </script>
</body>
</html>
