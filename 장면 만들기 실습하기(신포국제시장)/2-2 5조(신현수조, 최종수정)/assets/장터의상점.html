<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>왁자지껄한 고을 장터의 종자 상점</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1510;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
        <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff9e79" />
                <stop offset="60%" stop-color="#ffd3a5" />
                <stop offset="100%" stop-color="#fff3e3" />
            </linearGradient>

            <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#2c3539" />

                <stop offset="100%" stop-color="#1c2124" />

            <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#5c3a21" />
                <stop offset="50%" stop-color="#8b5a2b" />
                <stop offset="100%" stop-color="#4a2e1b" />
            </linearGradient>

            <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#e0b084" />
                <stop offset="100%" stop-color="#c49060" />
            </linearGradient>

            <radialGradient id="basketGrad" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#e8c38c" />
                <stop offset="70%" stop-color="#b08850" />
                <stop offset="100%" stop-color="#785628" />
            </radialGradient>

            <radialGradient id="seedBrown" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#a06030" />
                <stop offset="100%" stop-color="#502810" />

            <radialGradient id="seedYellow" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#fcd116" />
                <stop offset="100%" stop-color="#b38600" />
            </radialGradient>

            <radialGradient id="seedGreen" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#93c572" />
                <stop offset="100%" stop-color="#4f7942" />
            </radialGradient>

            <radialGradient id="seedRed" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#e2583e" />
                <stop offset="100%" stop-color="#8b1e0f" />
            </radialGradient>

            <filter id="sunGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="40" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <filter id="dustBlur">
                <feGaussianBlur stdDeviation="3" />
            </filter>

            <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                <feDropShadow dx="10" dy="15" stdDeviation="8" flood-opacity="0.3"/>
            </filter>
            <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="20" stdDeviation="15" flood-opacity="0.4" flood-color="#3d220f"/>
            </filter>

                <path d="M 0 0 L 20 20 M 20 0 L 0 20" stroke="#704e25" stroke-width="1" opacity="0.2"/>
