<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 개념 어드벤처 - 오프닝</title>
    <style>
        /* 기본 스타일 리셋 및 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 16:9 비율 유지 컨테이너 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 비율 */
            max-width: 177.78vh;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            background: #111;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* 레이어 구조 정의 */
        .layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #bg-layer { z-index: 1; pointer-events: none; }
        #character-layer { z-index: 2; pointer-events: none; }
        #ui-layer { z-index: 3; pointer-events: none; }
        #overlay-layer { z-index: 4; pointer-events: none; }

        /* 배경 내부 요소 스타일 */
        .bg-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .bg-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* AI 제작 대체 배경 (사랑채 느낌의 고풍스럽고 미스터리한 서재/방) */
        .custom-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c1a10 0%, #140b07 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4%;
        }
        .bg-wall {
            flex: 1;
            border-bottom: 20px solid #3d2314;
            position: relative;
            background: radial-gradient(circle at 50% 30%, rgba(139, 94, 60, 0.2) 0%, transparent 70%);
        }
        /* 창문 및 격자 무늬 연출 */
        .bg-window {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 50%;
            border: 4px solid #5c3a21;
            background: rgba(255, 235, 180, 0.05);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .bg-floor {
            height: 25%;
            background: linear-gradient(to bottom, #4a2e1b, #27170c);
        }

        /* 캐릭터 배치 및 대화 강조 규칙 적용 */
        .char-container {
            position: absolute;
            bottom: 15%;
            width: 260px;
            height: 320px;
            transition: filter .25s ease, opacity .25s ease, transform .25s ease;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .char-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        
        /* 위치 분리 */
        #char-dolsoe { left: 10%; }
        #char-manim { right: 10%; }

        /* 캐릭터 강조 필터 규칙 */
        .active-speaker {
            filter: brightness(1.12) saturate(1.08);
            opacity: 1;
            transform: scale(1.04);
        }
        .inactive-speaker {
            filter: brightness(0.48) saturate(0.7);
            opacity: 0.72;
        }
        .default-speaker {
            filter: brightness(1) saturate(1);
            opacity: 1;
            transform: scale(1);
        }
        
        /* 캐릭터 캡션 제거 강제 차단용 숨김 */
        .char-container p, 
        .char-container small, 
        .char-container figcaption, 
        .char-container .caption, 
        .char-container .description, 
        .char-container .hint, 
        .char-container .label {
            display: none !important;
        }

        /* UI 및 대화창 구조 */
        .ui-flex-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            padding: 24px;
        }

        /* 상단 HUD 구역 */
        .hud-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        .game-title-tag {
            background: rgba(0, 0, 0, 0.75);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid #ffd700;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* 중앙 미스터리 콘텐츠 영역 (단원 맵 / 연출) */
        .center-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 60px;
            margin-bottom: 24px;
            position: relative;
        }

        /* 5개 단원 구역 프리뷰 맵 */
        .mission-map {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            width: 90%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #555;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .mission-map.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .map-node {
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            color: #aaa;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
        }
        .map-node.active {
            border-color: #ffd700;
            background: #332a15;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .node-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #888;
        }
        .map-node.active .node-status {
            color: #ffd700;
            font-weight: bold;
        }
        .node-name {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            word-break: keep-all;
        }
        .node-icon {
            font-size: 1.5rem;
            margin-top: auto;
        }

        /* 하단 대화창 */
        .dialogue-box {
            background: rgba(15, 10, 8, 0.92);
            border: 3px solid #6d4c41;
            border-radius: 10px;
            padding: 20px 30px;
            min-height: 120px;
            max-height: 150px;
            position: relative;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .dialogue-box:hover {
            border-color: #8d6e63;
        }
        .speaker-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffcc80;
            margin-bottom: 8px;
        }
        .dialogue-text {
            font-size: 1.05rem;
            color: #e0e0e0;
            line-height: 1.6;
            word-break: keep-all;
        }
        .next-indicator {
            position: absolute;
            bottom: 12px;
            right: 20px;
            color: #ffcc80;
            font-size: 0.8rem;
            animation: blink 1s infinite alternate;
        }

        /* 수학 수식 스타일 규칙 정의 */
        .math {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            padding: 0 4px;
            vertical-align: middle;
        }
        .frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            padding: 0 4px;
            font-size: 0.9em;
        }
        .frac span:first-child {
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 1px;
        }
        .frac span:last-child {
            padding-top: 1px;
        }
        .repeat {
            position: relative;
            display: inline-block;
            border-top: 2px solid #ffd700;
            padding-top: 1px;
            margin-top: -1px;
        }

        /* 시작 액션 버튼 */
        .action-btn {
            background: linear-gradient(135deg, #d84315 0%, #bf360c 100%);
            color: #fff;
            border: 2px solid #ff7043;
            border-radius: 6px;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(216, 67, 21, 0.4);
            transition: all 0.2s ease;
            display: none;
            animation: pulse 1.5s infinite;
        }
        .action-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ff5722 0%, #d84315 100%);
            box-shadow: 0 6px 20px rgba(216, 67, 21, 0.6);
        }

        /* 오버레이 연출 효과 */
        .title-screen {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 1s ease;
            pointer-events: auto;
            cursor: pointer;
        }
        .title-subtitle {
            color: #aaa;
            font-size: 1.2rem;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .title-main {
            color: #ffd700;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        .title-prompt {
            color: #666;
            font-size: 1rem;
            animation: blink 1.2s infinite alternate;
        }

        /* 애니메이션 키프레임 */
        @keyframes blink {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="bg-layer" class="layer">
            <div id="bg-wrapper" class="bg-wrapper"></div>
        </div>

        <div id="character-layer" class="layer">
            <div id="char-dolsoe" class="char-container default-speaker"></div>
            <div id="char-manim" class="char-container default-speaker"></div>
        </div>

        <div id="ui-layer" class="layer">
            <div class="ui-flex-container">
                <div class="hud-panel">
                    <div class="game-title-tag">수학 개념 어드벤처</div>
                </div>

                <div class="center-stage">
                    <div id="mission-map" class="mission-map">
                        <div class="map-node active">
                            <div class="node-status">잠금해제</div>
                            <div class="node-name">1. 순환소수와 유리수</div>
                            <div class="node-icon">🔑</div>
                        </div>
                        <div class="map-node">
                            <div class="node-status">비밀 구역</div>
                            <div class="node-name">2. 지수법칙</div>
                            <div class="node-icon">🔒</div>
                        </div>
                        <div class="map-node">
                            <div class="node-status">암호 장치</div>
                            <div class="node-name">3. 일차부등식</div>
                            <div class="node-icon">🔒</div>
                        </div>
                        <div class="map-node">
                            <div class="node-status">단서 카드</div>
                            <div class="node-name">4. 연립방정식</div>
                            <div class="node-icon">🔒</div>
                        </div>
                        <div class="map-node">
                            <div class="node-status">최종 비밀문</div>
                            <div class="node-name">5. 함수의 개념</div>
                            <div class="node-icon">🚪</div>
                        </div>
                    </div>

                    <button id="start-btn" class="action-btn">일하러 가자!</button>
                </div>

                <div id="dialogue-box" class="dialogue-box">
                    <div id="speaker-name" class="speaker-name">시스템</div>
                    <div id="dialogue-text" class="dialogue-text">화면을 클릭하거나 Enter 키를 누르면 이야기가 시작됩니다.</div>
                    <div class="next-indicator">▼ Click / Enter</div>
                </div>
            </div>
        </div>

        <div id="title-screen" class="title-screen">
            <div class="title-subtitle">수학 방탈출 미스터리 어드벤처</div>
            <div class="title-main">수학 개념 어드벤처</div>
            <div class="title-prompt">클릭하여 모험을 시작하세요</div>
        </div>
    </div>

    <script>
        // 대화 데이터 정의 (스토리라인 및 수학 기법 적용)
        const storyData = [
            { speaker: "시스템", text: "조선 최고의 농경 지대를 자랑하는 마님의 대저택. 하지만 올해는 극심한 가뭄과 흉년의 위기가 찾아왔습니다." },
            { speaker: "마님", text: "돌쇠야, 흉년을 피하고 올해 최고의 수확량을 올릴 비책을 찾았다. 하지만 모든 농사 계획을 철저한 계산하에 실행해야만 해." },
            { speaker: "돌쇠", text: "예? 계산이라니요 마님! 지는 그저 몸으로 때우는 농사만 지어왔습지요..." },
            { speaker: "마님", text: "걱정 마라. 다섯 농사 구역을 차례로 돌며 수학 단서를 모으면 흉년을 이겨 낼 농사 비책을 완성할 수 있을 것이다." },
            { speaker: "시스템", text: "사랑채의 지도가 빛나며 논밭, 장터, 황금들판, 저수지와 수확 창고로 이어지는 길이 나타납니다." },
            { speaker: "시스템", text: "진행 방법: 다섯 농사 구역의 문제를 차례로 해결하고 대풍년에 필요한 단서를 모으세요.", showMap: true },
            { speaker: "마님", text: "첫 번째 목적지는 <span class='math'>0.<span class='repeat'>3</span></span>처럼 반복되는 수의 비밀을 이용해 논밭의 비율을 정하는 '순환소수와 유리수' 구역이다." },
            { speaker: "돌쇠", text: "좋아유! 한 구역씩 천천히 해결해서 대풍년의 비책을 꼭 완성해 보겠어유!" },
            { speaker: "시스템", text: "첫 번째 단서가 반짝입니다. 돌쇠는 순환소수와 유리수 구역이 있는 논밭으로 출발합니다.", showBtn: true }
        ];

        let currentIdx = -1;
        const titleScreen = document.getElementById('title-screen');
        const dialogueBox = document.getElementById('dialogue-box');
        const speakerName = document.getElementById('speaker-name');
        const dialogueText = document.getElementById('dialogue-text');
        const missionMap = document.getElementById('mission-map');
        const startBtn = document.getElementById('start-btn');

        // 에셋 로딩 설정
        const assets = {
            bg: "assets/사랑채.html",
            dolsoe: "assets/돌쇠.html",
            manim: "assets/마님.html"
        };

        // 로드 시 실행
        document.addEventListener("DOMContentLoaded", () => {
            loadBackground();
            loadCharacter("dolsoe", "char-dolsoe");
            loadCharacter("manim", "char-manim");

            // 타이틀 클릭 시 시작
            titleScreen.addEventListener('click', () => {
                titleScreen.style.opacity = '0';
                setTimeout(() => titleScreen.style.display = 'none', 1000);
                nextDialogue();
            });

            // 대화창 클릭 및 키보드 이벤트 바인딩
            dialogueBox.addEventListener('click', nextDialogue);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (titleScreen.style.display !== 'none') {
                        titleScreen.click();
                    } else {
                        nextDialogue();
                    }
                }
            });

            // 다음 페이지 이동 버튼 이벤트
            startBtn.addEventListener('click', () => {
                window.location.href = "A01.html";
            });
        });

        // 배경 파일 비동기 로드 및 예외 처리
        function loadBackground() {
            const wrapper = document.getElementById('bg-wrapper');
            fetch(assets.bg)
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.text();
                })
                .then(html => {
                    wrapper.innerHTML = html;
                    const el = wrapper.firstElementChild;
                    if (el) {
                        el.style.position = "absolute";
                        el.style.inset = "0";
                        el.style.width = "100%";
                        el.style.height = "100%";
                        el.style.overflow = "hidden";
                    }
                })
                .catch(() => {
                    // fetch 실패 시 iframe 대체 시도 후 차단 시 CSS 생성 배경 적용
                    wrapper.innerHTML = `<iframe src="${assets.bg}" scrolling="no" style="width:100%; height:100%; border:0; overflow:hidden;"></iframe>`;
                    const iframe = wrapper.querySelector('iframe');
                    
                    let fallbackTimeout = setTimeout(() => {
                        createCustomCSSBg(wrapper);
                    }, 1000);

                    iframe.onload = () => clearTimeout(fallbackTimeout);
                    iframe.onerror = () => {
                        clearTimeout(fallbackTimeout);
                        createCustomCSSBg(wrapper);
                    };
                });
        }

        // 배경 로드 실패 시 고풍스러운 사랑채/비밀 서재 스타일 직접 생성
        function createCustomCSSBg(wrapper) {
            wrapper.innerHTML = `
                <div class="custom-bg">
                    <div class="bg-wall">
                        <div class="bg-window"></div>
                    </div>
                    <div class="bg-floor"></div>
                </div>
            `;
        }

        // 캐릭터 컴포넌트 비동기 로드
        function loadCharacter(key, wrapperId) {
            const wrapper = document.getElementById(wrapperId);
            const fileName = assets[key];

            fetch(fileName)
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.text();
                })
                .then(html => {
                    wrapper.innerHTML = html;
                    cleanCharacterCaptions(wrapper);
                })
                .catch(() => {
                    // 로컬 환경 등 차단 시 iframe 대체
                    wrapper.innerHTML = `<iframe src="${fileName}" scrolling="no"></iframe>`;
                    const iframe = wrapper.querySelector('iframe');
                    iframe.onload = () => {
                        try {
                            const doc = iframe.contentDocument || iframe.contentWindow.document;
                            cleanCharacterCaptions(doc.body);
                        } catch (e) {
                            // 크로스 도메인 제한 시 내부 숨김은 CSS 매칭으로 커버
                        }
                    };
                });
        }

        // 캐릭터 영역 내 캡션 강제 제거 및 가리기
        function cleanCharacterCaptions(container) {
            const selectors = ['p', 'small', 'figcaption', '.caption', '.description', '.hint', '.label'];
            selectors.forEach(sel => {
                container.querySelectorAll(sel).forEach(el => el.style.display = 'none');
            });
        }

        // 대화 진행 및 화자 강조 시스템
        function nextDialogue() {
            if (currentIdx >= storyData.length - 1) return;
            currentIdx++;

            const currentStory = storyData[currentIdx];
            speakerName.textContent = currentStory.speaker;
            dialogueText.innerHTML = currentStory.text;

            // 단원 프리뷰 맵 연출 제어
            if (currentStory.showMap) {
                missionMap.classList.add('visible');
            } else if (currentStory.showBtn) {
                missionMap.style.display = 'none';
                startBtn.style.display = 'block';
            } else {
                missionMap.classList.remove('visible');
            }

            updateSpeakers(currentStory.speaker);
        }

        // 대화 캐릭터 강조 상태 업데이트 규칙 적용
        function updateSpeakers(speaker) {
            const dolsoeWrap = document.getElementById('char-dolsoe');
            const manimWrap = document.getElementById('char-manim');

            if (speaker === "돌쇠") {
                dolsoeWrap.className = "char-container active-speaker";
                manimWrap.className = "char-container inactive-speaker";
            } else if (speaker === "마님") {
                dolsoeWrap.className = "char-container inactive-speaker";
                manimWrap.className = "char-container active-speaker";
            } else {
                // 시스템, 해설 등 특정 캐릭터와 연결되지 않은 경우 기본 밝기로 리셋
                dolsoeWrap.className = "char-container default-speaker";
                manimWrap.className = "char-container default-speaker";
            }
        }
    </script>
</body>
</html>
