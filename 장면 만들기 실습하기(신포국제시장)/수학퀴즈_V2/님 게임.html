<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>님게임</title>
  <style>
    html { overflow-x: hidden; }
    body {
      background: linear-gradient(120deg, #f0fdfa, #e0e7ff);
      min-height: 100vh;
      min-height: 100dvh;   /* 모바일 주소창 대응 */
      overflow-x: hidden;
      font-family: 'Pretendard','Segoe UI',sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 28px 0 6px 0;
      font-size: 2rem;
      color: #0e7490;
      font-weight: 900;
      text-align: center;
    }
    .desc {
      color: #334155;
      margin-bottom: 14px;
      font-size: 1rem;
      text-align: center;
      line-height: 1.5;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      background: #ffffffaa;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 2px 12px #00000012;
      margin-bottom: 8px;
    }
    .toolbar button {
      height: 36px;
      border-radius: 10px;
      border: none;
      background: #0e7490;
      color: #fff;
      padding: 0 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 10px #0e749022;
    }

    .nim-board {
      --n: 31;            /* JS 가 실제 최대 링 개수로 덮어씀 */
      --ring-gap: 1.5px;
      --ring-pad: 5px;
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 3.4vw, 28px);
      margin: 12px 0;
      width: 100%;
      max-width: 740px;
      padding: 0 12px;
    }
    /* 행: 뷰포트를 넘지 않고, 봉이 남는 폭을 모두 차지한다 */
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      min-width: 0;
    }

    /* 봉: flex 로 늘어나되 절대 넘치지 않음 */
    .stick {
      flex: 1 1 auto;
      min-width: 0;
      height: clamp(10px, 2.4vw, 18px);
      background: #c39e71;
      border-radius: 13px;
      position: relative;
      box-shadow: 0 2px 10px #c39e7133;
      display: flex;
      align-items: center;
    }

    .rings {
      position: absolute;
      inset: 0;
      display: flex;
      flex-wrap: nowrap;         /* 절대 줄바꿈하지 않음 */
      gap: var(--ring-gap);
      align-items: center;
      justify-content: flex-start;
      padding: 0 var(--ring-pad);
    }

    /* 링 폭 = (봉 너비 − 여백 − 링 사이 간격) ÷ 최대 링 개수
       → 개수가 몇 개든, 화면이 얼마나 좁든 봉 안에 정확히 들어간다.
         (--n 은 JS 가 가장 긴 줄의 링 개수로 설정) */
    .ring {
      flex: 0 0 auto;
      width: min(
        10px,
        calc((100% - var(--ring-pad) * 2 - (var(--n) - 1) * var(--ring-gap)) / var(--n))
      );
      min-width: 3px;
      height: clamp(22px, 6.4vw, 50px);
      border-radius: 9999px;
      border: 2px solid #8d8d8d;
      background: #fff;
      box-shadow: 0 1px 2px #0001;
      cursor: pointer;
      transition: border 0.18s, box-shadow 0.18s, transform 0.06s;
    }
    .ring:hover { transform: translateY(-1px); }
    .ring.selected {
      border: 2.2px solid #3b82f6;
      background: #bae6fd;
      box-shadow: 0 4px 12px #38bdf833;
    }
    .move-btn {
      flex: 0 0 auto;
      white-space: nowrap;
      font-size: 0.98rem;
      padding: 7px 14px;
      background: #0e7490;
      color: #fff;
      border: none;
      border-radius: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 8px #0e749022;
    }
    .move-btn:disabled {
      background: #64748b;
      cursor: not-allowed;
      opacity: 0.8;
    }
    .info {
      font-size: 1.08rem;
      margin-top: 8px;
      color: #0e7490;
      font-weight: 800;
      text-align: center;
    }

    #winMsgBackdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(2,6,23,0.45);
      align-items: center; justify-content: center;
      padding: 16px;
    }
    .winBox {
      max-width: 420px;
      width: 100%;
      background: #0e7490;
      color: #fde047;
      border-radius: 18px;
      text-align: center;
      padding: 22px 20px;
      animation: pop 0.28s cubic-bezier(.7,2,.45,1) both;
    }
    .winTitle { font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
    .winActions { margin-top: 12px; }
    .winBtn {
      padding: 8px 14px; border-radius: 12px; border: none; cursor: pointer;
      font-weight: 800; background: #fef08a; color: #0f172a;
    }
    @keyframes pop {
      0% { transform: scale(0.86); opacity: 0;}
      100% { transform: scale(1); opacity: 1;}
    }

    /* ===== 반응형 안전장치 ===== */
    * { box-sizing: border-box; }
    .nim-board, .toolbar { max-width: 100%; }
    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; margin: 16px 0 4px 0; }
      .desc { font-size: 0.86rem; margin-bottom: 10px; padding: 0 12px; }
      .toolbar { flex-wrap: wrap; gap: 6px; padding: 8px; }
      .toolbar button { height: 32px; padding: 0 10px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      h1 { font-size: 1.2rem; margin: 8px 0 2px 0; }
      .desc { font-size: 0.8rem; margin-bottom: 6px; }
      .toolbar { padding: 6px 8px; margin-bottom: 4px; }
      .nim-board { gap: 12px; margin: 6px 0; }
    }

    /* 좁은 화면: 간격을 더 조이고 버튼을 작게 */
    @media (max-width: 520px) {
      .nim-board { --ring-gap: 1px; --ring-pad: 4px; padding: 0 8px; }
      .move-btn { padding: 6px 9px; font-size: 0.82rem; border-radius: 10px; }
      .row { gap: 6px; }
    }
    @media (max-width: 360px) {
      .nim-board { --ring-gap: 0.5px; --ring-pad: 3px; }
      .move-btn { padding: 5px 7px; font-size: 0.74rem; }
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>

  <h1>님게임</h1>
  <div class="desc">
    한 번에 <b>한 봉(row)</b>만 선택하여, 선택한 링부터 <b>오른쪽 모든 링</b>을 옮깁니다(=제거).<br/>
    마지막 링을 옮기는(제거하는) 사람이 승리합니다! (플레이어가 선공)
  </div>

  <div class="toolbar">
    <button id="resetBtn">재시작 🔄</button>
  </div>

  <div class="nim-board" id="board"></div>
  <div class="info" id="info"></div>

  <div id="winMsgBackdrop">
    <div class="winBox">
      <div class="winTitle" id="winTitle">플레이어 승리! 🎉</div>
      <div class="winActions">
        <button class="winBtn" id="overlayRestartBtn">재시작</button>
      </div>
    </div>
  </div>

  <script>
    const initialRings = [31, 20, 19];
    let rings, selected, player, gameEnd, aiThinking;

    const boardEl = document.getElementById('board');
    const infoEl  = document.getElementById('info');
    const resetBtn    = document.getElementById('resetBtn');
    const winBackdrop = document.getElementById('winMsgBackdrop');
    const winTitle    = document.getElementById('winTitle');
    const overlayRestartBtn = document.getElementById('overlayRestartBtn');

    function showWin(name) {
      winTitle.textContent = `${name} 승리! 🎉`;
      winBackdrop.style.display = 'flex';
    }
    function hideWin() { winBackdrop.style.display = 'none'; }

    function resetGame() {
      rings = initialRings.map(n => Array(n).fill('L'));
      selected = [null, null, null];
      player = 1;
      gameEnd = false;
      aiThinking = false;
      hideWin();
      draw();
      announceTurn();
      maybeAiTurn();
    }

    function draw() {
      // 링 폭 계산 기준: 가장 긴 줄의 초기 링 개수
      boardEl.style.setProperty('--n', Math.max(...initialRings));
      boardEl.innerHTML = '';
      for (let row = 0; row < 3; row++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row';

        const stick = document.createElement('div');
        stick.className = 'stick';

        const ringContainer = document.createElement('div');
        ringContainer.className = 'rings';

        for (let i = 0; i < rings[row].length; i++) {
          const ring = document.createElement('div');
          const sel = (selected[row] !== null && i >= selected[row]);
          ring.className = 'ring' + (sel ? ' selected' : '');
          ring.onclick = () => {
            if (gameEnd || aiThinking) return;
            if (selected[row] === null || selected[row] !== i) selected = [null,null,null];
            selected[row] = (selected[row] === i ? null : i);
            draw();
          };
          ringContainer.appendChild(ring);
        }
        stick.appendChild(ringContainer);
        rowDiv.appendChild(stick);

        const btn = document.createElement('button');
        btn.className = 'move-btn';
        btn.textContent = '→ 이동';
        btn.disabled = selected[row]===null || gameEnd || aiThinking;
        btn.onclick = () => moveRings(row);
        rowDiv.appendChild(btn);
        boardEl.appendChild(rowDiv);
      }
    }

    function announceTurn() {
      if (gameEnd) { infoEl.textContent=''; return; }
      infoEl.textContent = (player===2?'컴퓨터':'플레이어') + ' 차례';
    }

    function moveRings(row, opts={force:false}) {
      if (gameEnd || (aiThinking && !opts.force)) return;
      const idx = selected[row];
      if (idx===null) return;

      rings[row].splice(idx);
      selected=[null,null,null];

      if (rings.every(a=>a.length===0)) {
        gameEnd=true;
        showWin(player===2?'컴퓨터':'플레이어');
        draw();
        infoEl.textContent='';
        return;
      }

      player=3-player;
      draw();
      announceTurn();
      maybeAiTurn();
    }

    function maybeAiTurn() {
      if (gameEnd||player!==2) return;
      aiThinking=true;
      setTimeout(()=>{
        const {row,removeCount}=chooseAiMove_ByTotal();
        const len=rings[row].length, idx=len-removeCount;
        selected=[null,null,null];
        selected[row]=Math.max(0,idx);
        draw();
        moveRings(row,{force:true});
        aiThinking=false;
      },550);
    }

    function chooseAiMove_ByTotal() {
      const heaps = rings.map(r=>r.length);
      const total = heaps.reduce((a,b)=>a+b,0);
      const nimSum = heaps[0]^heaps[1]^heaps[2];

      const randomMove = () => {
        const choices = heaps.map((h,i)=>({i,h})).filter(x=>x.h>0);
        const pick = choices[Math.floor(Math.random()*choices.length)];
        const rm = 1 + Math.floor(Math.random()*pick.h);
        return {row: pick.i, removeCount: rm};
      };

      const optimalMove = () => {
        if (nimSum===0) return randomMove();
        for (let i=0;i<heaps.length;i++){
          const h = heaps[i], target = h ^ nimSum;
          if (target < h) return {row: i, removeCount: h - target};
        }
        return randomMove();
      };

      if (total <= 6) return optimalMove();                         // 100%
      if (total >= 15) return Math.random() < 0.5 ? optimalMove() : randomMove();   // 50%
      return Math.random() < 0.7 ? optimalMove() : randomMove();    // 70%
    }

    resetBtn.onclick=resetGame;
    overlayRestartBtn.onclick=resetGame;
    winBackdrop.onclick=e=>{ if(e.target===winBackdrop) hideWin(); };

    resetGame();
  </script>
</body>
</html>
