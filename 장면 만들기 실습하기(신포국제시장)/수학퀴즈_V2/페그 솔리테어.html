<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>페그 솔리테어</title>
  <style>
    :root {
      /* ===== 공통 디자인 토큰 (전체 퀴즈 공용) ===== */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --radius-card: 16px;
      --radius-ctrl: 10px;
      --shadow-card: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-layout {
      display: flex;
      width: 100%; height: 100%;
      padding: 2vh 2vw;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .panel-side {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      width: 38vw;
      max-width: 440px;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-block h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .header-block p {
      margin: 0 0 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }

    .control-group {
      background: var(--primary-soft);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .control-header label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .col-badge {
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .col-badge.accent { background: var(--accent); }
    .col-badge.muted  { background: #94a3b8; }

    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; }

    .stat-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-row { display: flex; gap: 8px; }

    .btn-check, .btn-ghost {
      border-radius: var(--radius-ctrl);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex: 1;
    }
    .btn-check { background: var(--primary); color: #fff; border: none; }
    .btn-check:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-check:active:not(:disabled) { transform: translateY(1px); }
    .btn-ghost { background: var(--card-bg); color: var(--primary-dark); border: 1px solid var(--border-color); }
    .btn-ghost:hover:not(:disabled) { background: var(--primary-soft); }
    .btn-ghost:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .answer-group { padding-top: 16px; border-top: 2px dashed var(--border-color); }

    .feedback {
      margin-top: 10px;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      font-size: 0.95rem;
      word-break: keep-all;
      line-height: 1.45;
    }
    .feedback.success { color: var(--success); }
    .feedback.error   { color: var(--error); }
    .feedback.info    { color: var(--text-muted); }

    .board-side {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: 10px;
    }

    .board-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    @media (orientation: portrait) {
      .app-layout { flex-direction: column; justify-content: flex-start; padding-top: 2vh; gap: 12px; }
      .panel-side { width: 96vw; max-width: none; padding: 16px; }
      .board-side { width: 96vw; flex: 1; padding: 0 0 2vh 0; }
      .header-block p { margin-bottom: 12px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.2rem; }
      .header-block p { display: none; }
      .control-group { padding: 8px 12px; margin-bottom: 10px; }
      .stat-row { margin-bottom: 8px; }
    }

    /* ===================================================================
       반응형 안전장치 — PC/모바일, 가로/세로 어디서도 잘리지 않게
       =================================================================== */
    .app-layout { min-height: 0; min-width: 0; }
    .board-side { min-height: 0; min-width: 0; }

    /* 패널이 화면보다 길어지면 화면을 밀지 않고 패널 안에서만 스크롤 */
    .panel-side {
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    @media (orientation: portrait) {
      .panel-side { max-height: 54%; flex: 0 0 auto; }
      .board-side { flex: 1 1 auto; }
    }

    /* 폰 가로처럼 세로가 짧은 화면 */
    @media (orientation: landscape) and (max-height: 560px) {
      .app-layout { padding: 8px; gap: 10px; }
      .panel-side { padding: 12px; }
      .header-block h2 { font-size: 1.12rem; margin-bottom: 4px; }
      .header-block p  { display: none; }
      .stat-row { margin-bottom: 8px; }
      .answer-group { padding-top: 10px; margin-top: 10px !important; }
      .feedback { font-size: 0.82rem; margin-top: 6px; min-height: 16px; }
      .btn-row button { padding: 8px 12px; font-size: 0.85rem; }
    }
    @media (orientation: landscape) and (max-height: 430px) {
      .rule-note, .note { font-size: 0.7rem; padding: 6px 8px; margin-bottom: 8px; line-height: 1.4; }
      .control-group { padding: 7px 10px; margin-bottom: 8px; }
      .col-badge { font-size: 0.72rem; padding: 3px 9px; }
    }

    /* 부가 공통 유틸 (일부 퍼즐에서 사용) */
    .note {
      background: var(--accent-soft);
      border: 1px solid #fed7aa;
      border-radius: var(--radius-ctrl);
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #9a3412;
      line-height: 1.5;
      word-break: keep-all;
      margin-bottom: 14px;
    }

    /* ===== 목록(index.html)으로 돌아가는 버튼 ===== */
    .home-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.10);
      color: #1e293b;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s, box-shadow .18s, color .18s, border-color .18s, background .18s;
    }
    .home-btn:hover {
      background: #fff;
      color: #1d4ed8;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.5);
    }
    .home-btn:active { transform: translateY(0); }
    .home-btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .home-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* 좁거나 납작한 화면에서는 아이콘만 */
    @media (max-width: 560px), (orientation: landscape) and (max-height: 430px) {
      .home-btn { padding: 8px; gap: 0; }
      .home-btn .label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ===== 페그 솔리테어 전용 ===== */
    .board-wrapper {
      width: min(82vmin, 560px);
      aspect-ratio: 1 / 1;
      padding: clamp(10px, 3.4%, 22px);
      background: linear-gradient(160deg, #fbfcfe, #eef1f6);
    }

    .peg-board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: clamp(2px, 1%, 7px);
      width: 100%;
      height: 100%;
      user-select: none;
    }

    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cell.void { visibility: hidden; }

    /* 오목한 홀(소켓) */
    .socket {
      position: absolute;
      inset: 9%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 38%, #c8cfda, #dfe4ec 70%);
      box-shadow:
        inset 0 5px 9px rgba(15, 23, 42, 0.34),
        inset 0 -3px 5px rgba(255, 255, 255, 0.65);
    }

    /* 입체 페그(구슬) */
    .peg {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      z-index: 2;
      cursor: pointer;
      background: radial-gradient(circle at 34% 28%,
        #ffe4b8 0%, #fdba74 34%, #f97316 62%, #b7420b 100%);
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.6),
        inset 0 -6px 10px rgba(0, 0, 0, 0.34),
        0 5px 10px rgba(15, 23, 42, 0.36);
      transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.15s ease;
    }
    .peg::after {
      content: '';
      position: absolute;
      top: 13%; left: 20%;
      width: 34%; height: 24%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      filter: blur(1px);
      pointer-events: none;
    }
    .cell:not(.finished) .peg:hover { transform: scale(1.05); }

    .peg.selected {
      transform: scale(1.09);
      z-index: 4;
      filter: saturate(1.15) brightness(1.06);
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.6),
        inset 0 -6px 10px rgba(0, 0, 0, 0.3),
        0 0 0 3px #fff,
        0 0 18px 3px rgba(37, 99, 235, 0.65);
      outline: 3px solid var(--primary);
      outline-offset: 1px;
    }

    /* 점프 가능한 목적지 홀 */
    .cell.target { cursor: pointer; }
    .cell.target .socket {
      background: radial-gradient(circle at 50% 40%, #dbeafe, #eff6ff 72%);
      box-shadow:
        inset 0 0 0 3px var(--primary),
        inset 0 4px 8px rgba(37, 99, 235, 0.22);
      animation: targetPulse 1.25s ease-in-out infinite;
    }
    .cell.target .socket::after {
      content: '';
      position: absolute;
      inset: 33%;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0.55;
    }
    @keyframes targetPulse {
      0%, 100% { box-shadow: inset 0 0 0 3px var(--primary), inset 0 4px 8px rgba(37,99,235,.22); }
      50%      { box-shadow: inset 0 0 0 3px var(--primary), 0 0 12px rgba(37,99,235,.55), inset 0 4px 8px rgba(37,99,235,.3); }
    }

    /* 마지막 남은 페그 축하 */
    .peg.champion {
      background: radial-gradient(circle at 34% 28%, #fff7cd 0%, #fde047 36%, #f59e0b 64%, #b45309 100%);
      box-shadow:
        inset 0 3px 5px rgba(255,255,255,.7),
        inset 0 -6px 10px rgba(0,0,0,.3),
        0 0 0 3px #fff,
        0 0 22px 4px rgba(245, 158, 11, 0.7);
      animation: champ 1s ease-in-out infinite;
    }
    @keyframes champ {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .peg, .cell.target .socket, .peg.champion { animation: none; transition: none; }
    }
  </style>
</head>
<body>

  <a class="home-btn" href="index.html" title="게임 목록으로 돌아가기" aria-label="게임 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/>
    </svg>
    <span class="label">목록</span>
  </a>


  <div class="app-layout">
    <div class="panel-side">
      <div class="header-block">
        <h2>페그 솔리테어</h2>
        <p>페그로 <b>이웃한 페그</b>를 뛰어넘어 빈 홀에 안착시키세요.<br>뛰어넘긴 페그는 사라집니다. 마지막에 <b>1개</b>만 남기면 성공!</p>
      </div>

      <div class="note">
        💡 점프는 <b>상하좌우 직교 방향</b>만 가능해요(대각선 불가). 페그를 누르면 갈 수 있는 <b>목적지가 파랗게</b> 표시됩니다. 중앙에 마지막 1개를 남기면 최고!
      </div>

      <div class="stat-row">
        <span class="col-badge muted" id="pegBadge">남은 페그 32</span>
        <span class="col-badge accent" id="moveBadge">이동 0</span>
      </div>

      <div class="btn-row">
        <button class="btn-ghost" id="undoBtn">↶ 되돌리기</button>
        <button class="btn-check" id="resetBtn">🔄 다시 시작</button>
      </div>

      <div class="answer-group" style="margin-top:16px">
        <div class="feedback info" id="feedback">페그를 눌러 점프할 곳을 골라보세요.</div>
      </div>
    </div>

    <div class="board-side">
      <div class="board-wrapper">
        <div class="peg-board" id="board"></div>
      </div>
    </div>
  </div>

  <script>

    // ==========================================================
    //  페그 솔리테어 — 잉글리시 십자보드 (7x7 - 네 모서리 2x2 = 33홀)
    //  이동: 직교 인접 페그 위로 2칸 점프, 빈 홀에 착지, 넘긴 페그 제거.
    //  로직은 별도 node 스크립트로 검증함(합법이동/제거/막힘·승리).
    // ==========================================================
    const SIZE = 7;
    const CENTER = { r: 3, c: 3 };
    const DIRS = [ { dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 } ];

    const boardEl  = document.getElementById('board');
    const pegBadge  = document.getElementById('pegBadge');
    const moveBadge = document.getElementById('moveBadge');
    const undoBtn   = document.getElementById('undoBtn');
    const resetBtn  = document.getElementById('resetBtn');
    const feedback  = document.getElementById('feedback');

    let board = [];       // null=보드밖, 0=빈홀, 1=페그
    let selected = null;  // 선택된 페그 {r,c}
    let history = [];      // 점프 기록(전체) [{from,mid,to}]
    let finished = false;

    function isValid(r, c) {
      if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
      const inRowArm = r >= 2 && r <= 4;
      const inColArm = c >= 2 && c <= 4;
      return inRowArm || inColArm;   // 십자모양(모서리 2x2 제외)
    }

    function initBoard() {
      board = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (isValid(r, c)) board[r][c] = 1;
      board[CENTER.r][CENTER.c] = 0;   // 중앙만 빈칸
    }

    // (r,c) 페그가 할 수 있는 점프 목적지들
    function jumpsFrom(r, c) {
      const res = [];
      if (board[r][c] !== 1) return res;
      for (const { dr, dc } of DIRS) {
        const mr = r + dr, mc = c + dc;         // 뛰어넘는 페그
        const tr = r + 2 * dr, tc = c + 2 * dc; // 착지 홀
        if (!isValid(tr, tc)) continue;
        if (board[mr][mc] === 1 && board[tr][tc] === 0) {
          res.push({ from: { r, c }, mid: { r: mr, c: mc }, to: { r: tr, c: tc } });
        }
      }
      return res;
    }

    function anyMoves() {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (board[r][c] === 1 && jumpsFrom(r, c).length > 0) return true;
      return false;
    }

    function pegCount() {
      let n = 0;
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (board[r][c] === 1) n++;
      return n;
    }

    function setFeedback(t, k) {
      feedback.textContent = t;
      feedback.className = 'feedback ' + k;
    }

    function reset() {
      initBoard();
      selected = null;
      history = [];
      finished = false;
      setFeedback('페그를 눌러 점프할 곳을 골라보세요.', 'info');
      render();
    }

    function currentTargets() {
      if (!selected) return [];
      return jumpsFrom(selected.r, selected.c);
    }

    function render() {
      const targets = currentTargets();
      const isTarget = (r, c) => targets.some(m => m.to.r === r && m.to.c === c);
      const remaining = pegCount();

      boardEl.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (finished) cell.classList.add('finished');
          if (!isValid(r, c)) {
            cell.classList.add('void');
            boardEl.appendChild(cell);
            continue;
          }
          cell.dataset.r = r;
          cell.dataset.c = c;

          const socket = document.createElement('div');
          socket.className = 'socket';
          cell.appendChild(socket);

          if (board[r][c] === 1) {
            const peg = document.createElement('div');
            peg.className = 'peg';
            if (selected && selected.r === r && selected.c === c) peg.classList.add('selected');
            if (finished && remaining === 1) peg.classList.add('champion');
            cell.appendChild(peg);
          } else if (isTarget(r, c)) {
            cell.classList.add('target');
          }
          boardEl.appendChild(cell);
        }
      }

      pegBadge.textContent = '남은 페그 ' + remaining;
      moveBadge.textContent = '이동 ' + history.length;
      undoBtn.disabled = history.length === 0 || finished;
    }

    function applyMove(m) {
      board[m.from.r][m.from.c] = 0;
      board[m.mid.r][m.mid.c] = 0;    // 뛰어넘긴 페그 제거
      board[m.to.r][m.to.c] = 1;
    }

    function doJump(m) {
      applyMove(m);
      history.push(m);
      selected = null;
      const remaining = pegCount();

      if (remaining === 1) {
        finished = true;
        const last = m.to;
        if (last.r === CENTER.r && last.c === CENTER.c) {
          setFeedback('🎉 완벽합니다! 중앙에 페그 1개만 남겼어요! (' + history.length + '수)', 'success');
        } else {
          setFeedback('🎉 성공! 페그를 1개만 남겼어요! (' + history.length + '수)', 'success');
        }
      } else if (!anyMoves()) {
        finished = true;
        setFeedback('막혔어요! 더 이상 점프할 수 없습니다. 페그 ' + remaining
          + '개 남음 — ↶ 되돌리기로 다시 시도해 보세요.', 'error');
      } else {
        setFeedback('점프! 남은 페그 ' + remaining + '개. 계속 이어가세요.', 'info');
      }
      render();
    }

    function onCellClick(r, c) {
      if (finished) return;

      // 목적지 클릭 → 점프
      if (selected) {
        const m = currentTargets().find(x => x.to.r === r && x.to.c === c);
        if (m) { doJump(m); return; }
        // 선택된 페그 자신을 다시 클릭 → 선택 해제
        if (selected.r === r && selected.c === c) {
          selected = null;
          setFeedback('선택을 해제했습니다.', 'info');
          render();
          return;
        }
      }

      // 페그 선택
      if (board[r][c] === 1) {
        const js = jumpsFrom(r, c);
        if (js.length === 0) {
          selected = null;
          setFeedback('이 페그는 지금 점프할 수 없어요. 다른 페그를 골라보세요.', 'info');
          render();
          return;
        }
        selected = { r, c };
        setFeedback('파란 목적지 홀을 눌러 점프하세요. (' + js.length + '곳 가능)', 'info');
        render();
        return;
      }

      // 빈 곳 클릭 → 선택 해제
      if (selected) {
        selected = null;
        setFeedback('선택을 해제했습니다.', 'info');
        render();
      }
    }

    function undo() {
      if (finished || history.length === 0) return;
      const m = history.pop();
      board[m.to.r][m.to.c] = 0;     // 착지 취소
      board[m.mid.r][m.mid.c] = 1;   // 제거된 페그 복원
      board[m.from.r][m.from.c] = 1; // 출발 복원
      selected = null;
      setFeedback('되돌렸습니다. 남은 페그 ' + pegCount() + '개.', 'info');
      render();
    }

    boardEl.addEventListener('click', (e) => {
      const cell = e.target.closest('.cell');
      if (!cell || cell.classList.contains('void')) return;
      if (cell.dataset.r === undefined) return;
      onCellClick(parseInt(cell.dataset.r, 10), parseInt(cell.dataset.c, 10));
    });

    undoBtn.addEventListener('click', undo);
    resetBtn.addEventListener('click', reset);

    reset();

  </script>
</body>
</html>
